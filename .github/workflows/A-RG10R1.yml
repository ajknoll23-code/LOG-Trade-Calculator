name: A-RG10R1 - Week 8 Frozen Research Evaluation Batch (Markdown Hard-Break Fix)
run-name: A-RG10R1 ${{ inputs.mode }} - seven frozen Week 8 evaluators, Markdown hard-break guard

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW_ONLY evaluates in runner; APPLY commits only seven study evaluation JSON/MD pairs'
        required: true
        type: choice
        default: PREVIEW_ONLY
        options:
          - PREVIEW_ONLY
          - APPLY

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  evaluation:
    name: Refresh seven frozen study evaluations against committed Week 8 outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install only original evaluator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'numpy>=1.26,<3'

      - name: Pin immutable evidence and verify Week 8 outcomes exist
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD > "$RUNNER_TEMP/rg10_start_head.txt"
          cat > "$RUNNER_TEMP/rg10_manifest.py" <<'PY'
          import hashlib, json, os, pathlib
          R=pathlib.Path.cwd()
          STUDIES=(
              ('Production V2 Phase 9', 'research/production-v2/production_v2_phase9_prospective_evaluator.py', 'research/production-v2/production_v2_phase9_preseason_candidates.json', 'research/production-v2/production_v2_phase9_evaluation.json', 'research/production-v2/production_v2_phase9_evaluation.md', 'completed_weeks'),
              ('Position Weight V2 Phase 5', 'research/position-weight-v2/position_weight_v2_phase5_prospective_evaluator.py', 'research/position-weight-v2/position_weight_v2_phase5_frozen_candidates.json', 'research/position-weight-v2/position_weight_v2_phase5_evaluation.json', 'research/position-weight-v2/position_weight_v2_phase5_evaluation.md', 'completed_outcome_weeks'),
              ('Replacement Level V2 Phase 5', 'research/replacement-level-v2/replacement_level_v2_phase5_prospective_evaluator.py', 'research/replacement-level-v2/replacement_level_v2_phase5_frozen_candidates.json', 'research/replacement-level-v2/replacement_level_v2_phase5_evaluation.json', 'research/replacement-level-v2/replacement_level_v2_phase5_evaluation.md', 'completed_outcome_weeks'),
              ('Age Curve V2 Phase 5', 'research/age-curve-v2/age_curve_v2_phase5_prospective_evaluator.py', 'research/age-curve-v2/age_curve_v2_phase5_frozen_candidates.json', 'research/age-curve-v2/age_curve_v2_phase5_evaluation.json', 'research/age-curve-v2/age_curve_v2_phase5_evaluation.md', 'completed_outcome_weeks'),
              ('Opportunity V2 Phase 5', 'research/opportunity-v2/opportunity_v2_phase5_prospective_evaluator.py', 'research/opportunity-v2/opportunity_v2_phase5_frozen_candidates.json', 'research/opportunity-v2/opportunity_v2_phase5_evaluation.json', 'research/opportunity-v2/opportunity_v2_phase5_evaluation.md', 'completed_outcome_weeks'),
              ('No-History Rookie V2 Phase 3', 'research/no-history-v2/no_history_v2_phase3_prospective_evaluator.py', 'research/no-history-v2/no_history_v2_phase3_frozen_candidates.json', 'research/no-history-v2/no_history_v2_phase3_evaluation.json', 'research/no-history-v2/no_history_v2_phase3_evaluation.md', 'completed_outcome_weeks'),
              ('Durability V2 Phase 5', 'research/durability-v2/durability_v2_phase5_prospective_evaluator.py', 'research/durability-v2/durability_v2_phase5_frozen_candidates.json', 'research/durability-v2/durability_v2_phase5_evaluation.json', 'research/durability-v2/durability_v2_phase5_evaluation.md', 'completed_outcome_weeks'),
          )
          HASH_INPUTS=[
              'index.html', 'free-agent-board.html', 'data/league_rosters.json',
              'data/free_agents.json', 'data/free_agent_utility_v1.json',
              'scripts/validation/repo_regression_checks.py',
              'scripts/validation/capture_realized_outcomes.py',
              'scripts/validation/snapshot_values.py',
              'scripts/model/ppg_pipeline.py',
              'scripts/projections/build_team_utility_lineup_projections.py',
              'research/model-history/identity/2026-w06-sleeper-registry.json',
              'research/model-history/outcomes/2026.json',
          ] + [s[1] for s in STUDIES] + [s[2] for s in STUDIES]
          def sha(p): return hashlib.sha256((R/p).read_bytes()).hexdigest()
          def check_outcomes():
              o=json.loads((R/'research/model-history/outcomes/2026.json').read_text())
              assert o.get('season')=='2026', 'Not the 2026 outcome season'
              assert o.get('model_key_count') == o.get('resolved_model_key_count') == 565, 'Frozen 565-player identity pool changed'
              assert o.get('identity_coverage_pct')==100.0, 'Outcome identity coverage incomplete'
              observed=sorted(int(w) for w in o.get('weeks',{}))
              assert observed==list(range(1,9)), f'Expected only completed weeks 1..8: {observed}'
              return observed
          if __name__=='__main__':
              check_outcomes()
              for s in STUDIES:
                  for path in s[1:5]:
                      assert (R/path).is_file(), f'Missing frozen study input or evaluator: {path}'
                  old=json.loads((R/s[3]).read_text())
                  old_weeks=[int(w) for w in old.get(s[5],[])]
                  assert 7 in old_weeks, f'{s[0]} missing prior Week 7: {old_weeks}'
              state={'outcomes_weeks':list(range(1,9)),
                     'immutable_hashes':{p:sha(p) for p in HASH_INPUTS},
                     'studies':[{'name':s[0],'script':s[1],'frozen':s[2],'json':s[3],'markdown':s[4],'weeks_key':s[5]} for s in STUDIES]}
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'rg10_manifest.json'
              path.write_text(json.dumps(state,indent=2)+'\n')
              print('PASS: 565 fixed identities; W01-W08 completed outcome evidence; all seven preseason freezes present and fingerprinted')
          PY
          python3 "$RUNNER_TEMP/rg10_manifest.py"

      - name: Execute the seven existing evaluators without refreezing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,sys,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'rg10_manifest.json').read_text())
          for study in d['studies']:
              script=study['script']
              print('---',study['name'],'---',flush=True)
              for flag in ('--selftest','--write','--check'):
                  print('RUN',script,flag,flush=True)
                  subprocess.run([sys.executable,script,flag],check=True)
              result=json.loads(pathlib.Path(study['json']).read_text())
              weeks=sorted(int(w) for w in result.get(study['weeks_key'],[]))
              assert 8 in weeks, f'Week 8 not evaluated by {study["name"]}: {weeks}'
              assert not any(w>8 for w in weeks), f'Partial/future week counted by {study["name"]}: {weeks}'
              assert result.get('deployment_authorized') is False, f'Deployment authorization unexpectedly changed: {study["name"]}'
              if 'research_only' in result:
                  assert result['research_only'] is True, f'Not research-only: {study["name"]}'
              if 'production_files_mutated' in result:
                  assert result['production_files_mutated'] in (0,False), f'Production mutated: {study["name"]}'
              if 'production_mutation_authorized' in result:
                  assert result['production_mutation_authorized'] is False
              print('PASS',study['name'],'evaluated',weeks,'no production authorization',flush=True)
          PY

      - name: Validate protected freezes and exact study-output-only changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'rg10_manifest.json').read_text())
          def sha(path):return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          for path, original in d['immutable_hashes'].items():
              current=sha(path)
              assert current==original, f'Immutable source changed: {path}'
          allowed={p for s in d['studies'] for p in (s['json'],s['markdown'])}
          result=subprocess.run(['git','status','--porcelain=v1','--untracked-files=all'],capture_output=True,text=True,check=True)
          changed={line[3:] for line in result.stdout.splitlines()}
          assert changed<=allowed, f'Unexpected outputs changed: {sorted(changed-allowed)}'
          for s in d['studies']:
              assert pathlib.Path(s['json']).is_file() and pathlib.Path(s['markdown']).is_file()
              assert 8 in json.loads(pathlib.Path(s['json']).read_text())[s['weeks_key']]
          print('PASS: seven frozen candidates and all protected source bytes unchanged; only approved evaluation JSON/MD files changed')
          print('Changed paths:',sorted(changed))
          pathlib.Path(os.environ['RUNNER_TEMP'],'rg10_diff.txt').write_text(result.stdout)
          PY
          # The frozen Production V2 evaluator intentionally emits Markdown
          # hard line breaks (exactly two ASCII spaces). Git's generic check
          # treats these standard Markdown line endings as whitespace errors.
          # Check every other changed file normally; allow ONLY the six
          # observed generated Markdown hard breaks in the designated report.
          git diff --check -- . ':(exclude)research/production-v2/production_v2_phase9_evaluation.md'
          python3 - <<'PY_HARDBREAK'
          import subprocess
          path = 'research/production-v2/production_v2_phase9_evaluation.md'
          patch = subprocess.check_output(
              ['git', 'diff', '--no-ext-diff', '--unified=0', '--', path],
              text=True,
          )
          hard_break_count = 0
          for line in patch.splitlines():
              if not line.startswith('+') or line.startswith('+++'):
                  continue
              added_text = line[1:]
              stripped = added_text.rstrip(' \t')
              if stripped == added_text:
                  continue
              suffix = added_text[len(stripped):]
              if suffix != '  ' or not stripped:
                  raise RuntimeError(
                      'Unexpected trailing whitespace in frozen Production V2 '
                      f'generated Markdown: {added_text!r}'
                  )
              hard_break_count += 1
          if hard_break_count != 6:
              raise RuntimeError(
                  f'Expected exactly six known Markdown line breaks; '
                  f'found {hard_break_count}. Re-audit before release.'
              )
          print('PASS: all other whitespace clean; exactly six legitimate '
                'two-space Markdown hard breaks preserved in generated report.')
          PY_HARDBREAK

      - name: Run unaffected repo regression and FA utility guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_free_agent_utility_v1.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/validation')
          import repo_regression_checks as r
          checks=[
              r.check_snapshot_parity,
              r.check_position_rules_and_free_agents,
              r.check_dual_eligibility_audit,
              r.check_team_identity,
              r.check_aliases_and_ktc_positions,
              r.check_idp_v1_projection_invariants,
              r.check_canonical_history_and_v1_bridge,
              r.check_preferred_bake_preview_invariants,
              r.check_deployed_idp_v1_invariants,
              r.check_free_agent_board_parity,
              r.check_package_adjustment_live.validate,
              r.check_package_sampling_contract,
              r.check_index_js_syntax,
          ]
          for c in checks:c()
          assert len(checks)==13
          assert r._check_cal22_current_successor()['status']=='PASS'
          print('PASS: all 13 unaffected regression groups, 565/565 snapshot parity, 48-member CAL22 protection')
          print('KNOWN UNRESOLVED: Team Utility lineup projections remain stale pending Jersey Bagels kicker')
          PY

      - name: Summarize validated Week 8 research refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((root/'rg10_manifest.json').read_text())
          lines=[
              '# A-RG10 Frozen Week 8 Research Evaluation',
              '', '- Evaluation type: existing frozen candidate evaluation ONLY',
              '- NFL outcome weeks: 1–8, 565/565 identified players',
              '- No candidate, method, frozen baseline, player valuation, or production change',
              '- All 13 unaffected repository regression groups passed',
              '- Team Utility lineup freshness remains deferred; unrelated missing kicker',
              '- IDP DL/LB Phase 2 is NOT covered; run its dedicated workflow independently',
              '', '| Frozen study | Evaluated weeks | Production release |',
              '|---|---|---|',
          ]
          for s in d['studies']:
              e=json.loads(pathlib.Path(s['json']).read_text())
              weeks=e[s['weeks_key']]
              lines.append(f'| {s["name"]} | {min(weeks)}–{max(weeks)} | No |')
          lines.extend(['',f'- Selected action: **{os.environ["RG10_MODE"]}**'])
          report='\n'.join(lines)+'\n'
          (root/'rg10_report.md').write_text(report)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(report)
          PY
        env:
          RG10_MODE: ${{ inputs.mode }}

      - name: APPLY only the 14 approved evaluator output paths
        if: ${{ inputs.mode == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/rg10_start_head.txt")"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'rg10_manifest.json').read_text())
          allowed=sorted({p for s in d['studies'] for p in (s['json'],s['markdown'])})
          subprocess.run(['git','add','--',*allowed],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)<=set(allowed),f'Unauthorized staged changes: {set(staged)-set(allowed)}'
          assert staged, 'No Week 8 evaluation output changed; nothing to commit'
          print('PASS: exact approved seven-study output paths staged:',staged)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-RG10R1: evaluate seven frozen prospective studies through completed Week 8'
          git push origin HEAD:main

      - name: Upload protected source fingerprints and study report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-RG10R1-week8-frozen-evaluators-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rg10_start_head.txt
            ${{ runner.temp }}/rg10_manifest.json
            ${{ runner.temp }}/rg10_report.md
            ${{ runner.temp }}/rg10_diff.txt
