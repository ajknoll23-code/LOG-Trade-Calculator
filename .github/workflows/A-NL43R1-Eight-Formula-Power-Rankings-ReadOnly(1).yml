name: A-NL43R1 - Eight Formula Power Ranking Bakeoff (Read Only)
run-name: A-NL43R1 - Compare 8 frozen formulas through W${{ inputs.through_week }}
'on':
  workflow_dispatch:
    inputs:
      through_week:
        description: Latest COMPLETED NFL week (8 for original replay; 9+ only after Sleeper advances)
        required: true
        type: string
        default: '8'
permissions:
  contents: read
concurrency:
  group: log-nl43-eight-formula-research
  cancel-in-progress: false
jobs:
  eight-formula-bakeoff:
    name: Reproduce NL42 and evaluate eight frozen scoring formulas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standalone read-only power ranking backtest
        env:
          THROUGH_WEEK: ${{ inputs.through_week }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nl43_engine.py" <<'NL43_ENGINE'
          #!/usr/bin/env python3
          """A-NL43R1: Read-only eight-formula newsletter power-ranking bake-off.

          V1/V2/V3 inherited unchanged from NL42; V4..V8 exploratory candidates.
          Freeze NL42 W1..W8 source. Any model selected using W4..W8 results is not independently validated.
          V4+ prospective assessments begin W10 because Week 9 was already in progress on design date.
          """
          from __future__ import annotations
          import argparse, base64, csv, hashlib, json, math, os, random, statistics
          from pathlib import Path
          from urllib.request import Request, urlopen

          LEAGUE_ID = '1326679131051532288'
          SEASON = '2026'
          FIXED_END_WEEK = 8
          V1_TO_V3_PROSPECTIVE_WEEK = 9
          NEW_MODEL_PROSPECTIVE_WEEK = 10
          BOOTSTRAP_SEED = 4301
          WEIGHTS = {
              'V1': {'combined_win_rate': .60, 'pf_percentile': .40},
              'V2': {'season_scoring': .35, 'all_play': .30, 'recent_scoring': .25, 'h2h': .10},
              'V3': {'season_scoring': .40, 'all_play': .35, 'recent_scoring': .15, 'h2h': .10},
              'V4': {'season_scoring': .20, 'all_play': .60, 'recent_scoring': .10, 'h2h': .10},
              'V5': {'season_scoring': .70, 'all_play': .15, 'recent_scoring': .10, 'h2h': .05},
              'V6': {'season_scoring': .20, 'all_play': .15, 'recent_scoring': .60, 'h2h': .05},
              'V7': {'season_scoring': .35, 'all_play': .20, 'recent_scoring': .10, 'scoring_floor': .25, 'h2h': .10},
              'V8': {'season_scoring': .35, 'all_play': .25, 'recent_scoring': .15, 'scoring_floor': .15, 'h2h': .10},
          }
          MODEL_NAMES = {
              'V1': 'Original combined record', 'V2': 'Original balanced challenger',
              'V3': 'Reduced-momentum challenger', 'V4': 'All-play dominant',
              'V5': 'Season scoring dominant', 'V6': 'Momentum dominant',
              'V7': 'High scoring floor', 'V8': 'Balanced with floor'
          }
          for key, vals in WEIGHTS.items():
              assert math.isclose(sum(vals.values()), 1.0, abs_tol=1e-9), key

          # Generated deterministically from exact immutable NL42R1 W1–W8 score-only evidence.
          FROZEN_WEEK8_B64 = ''
          FROZEN_WEEK8_SHA256 = 'cbfa3d6b7588461d448d30daf6d94d184e0aecf2cb80e897edb7b473f36a7b32'


          def freeze_data():
              raw=base64.b64decode(FROZEN_WEEK8_B64)
              if hashlib.sha256(raw).hexdigest() != FROZEN_WEEK8_SHA256:
                  raise RuntimeError('Frozen through-W8 evidence SHA mismatch')
              data=json.loads(raw)
              if data['season'] != SEASON or data['league_id'] != LEAGUE_ID or len(data['weeks']) != 8:
                  raise RuntimeError('Frozen evidence identity or length changed')
              return data


          def fetch_json(uri):
              req=Request('https://api.sleeper.app/v1/'+uri,headers={'User-Agent':'LOG-NL43R1-power-bakeoff-read-only/1'})
              with urlopen(req,timeout=30) as resp:
                  return json.load(resp)


          def score(row):
              v=row.get('custom_points')
              if v is None: v=row.get('points')
              if v is None or not isinstance(v,(int,float)) or isinstance(v,bool) or not math.isfinite(v):
                  raise RuntimeError('Sleeper score missing or invalid')
              if v < 0:
                  raise RuntimeError('Sleeper score negative; verify league data before continuing')
              return float(v)


          def live_week(w,ids):
              raw=fetch_json(f'league/{LEAGUE_ID}/matchups/{w}')
              if not isinstance(raw,list) or len(raw)!=12:
                  raise RuntimeError(f'Week {w}: expected 12 scored matchups')
              by_id={};groups={}
              for row in raw:
                  rid=int(row['roster_id']);mid=row.get('matchup_id')
                  if rid in by_id or rid not in ids or mid is None:raise RuntimeError('Unexpected duplicate roster ID or unpaired matchup')
                  by_id[rid]=score(row)
                  groups.setdefault(str(mid),[]).append(rid)
              if len(groups)!=6 or any(len(x)!=2 for x in groups.values()):
                  raise RuntimeError(f'Week {w}: expected 6 complete pairings')
              pairs=sorted([sorted(x) for x in groups.values()])
              return {'week':w,'scores':{str(x):p for x,p in by_id.items()},'pairs':pairs,
                      'median':statistics.median(by_id.values())}


          def completed_source(through_week,allow_network=True):
              if not 8 <= through_week <= 18:
                  raise RuntimeError('through_week must be between 8 and 18')
              root=freeze_data()
              if through_week == 8:return root
              if not allow_network:raise RuntimeError('Requested week requires confirmed live Sleeper scores')
              league=fetch_json(f'league/{LEAGUE_ID}')
              state=fetch_json('state/nfl')
              if str(league.get('season'))!=SEASON or str(state.get('season'))!=SEASON:
                  raise RuntimeError('2026 season mismatch; refusing live snapshot')
              state_week=int(state.get('week') or 0)
              if state_week <= through_week and str(state.get('season_type')) != 'post':
                  raise RuntimeError(f'Week {through_week} is not yet completed: Sleeper currently Week {state_week}')
              ids={int(k) for k in root['team_names']}
              live_rosters=fetch_json(f'league/{LEAGUE_ID}/rosters')
              if {int(x['roster_id']) for x in live_rosters} != ids:
                  raise RuntimeError('Roster identities have changed; manual review required')
              # Fail closed on any historical scoring revision. Changes to W1-W8 need separate reconciliation.
              for w in range(1,9):
                  old=root['weeks'][w-1]
                  current=live_week(w,ids)
                  if current['pairs'] != sorted([sorted(x) for x in old['pairs']]):
                      raise RuntimeError(f'Week {w} pairings differ from frozen NL42 source')
                  for rid in ids:
                      if not math.isclose(current['scores'][str(rid)],old['scores'][str(rid)],abs_tol=1e-6,rel_tol=0):
                          raise RuntimeError(f'Week {w} scoring history has changed for roster {rid}; do not silently backfill')
              for w in range(9,through_week+1):
                  root['weeks'].append(live_week(w,ids))
              return root


          def ranks_desc(values):
              return {rid:i+1 for i,(rid,v) in enumerate(sorted(values.items(),key=lambda item:(-item[1],item[0])))}


          def z_transform(values):
              nums=list(values.values());mu=statistics.mean(nums);sd=statistics.pstdev(nums)
              return {k: max(0.,min(100., 50.+20.*(v-mu)/sd)) if sd>1e-12 else 50. for k,v in values.items()}


          def quantile(values,q=.25):
              a=sorted(values);p=(len(a)-1)*q;lo=int(math.floor(p));hi=int(math.ceil(p))
              return a[lo]*(hi-p)+a[hi]*(p-lo) if hi!=lo else a[lo]


          def historical_features(data,cutoff):
              if cutoff < 3: raise RuntimeError('All candidate models require at least 3 completed weeks')
              weeks=data['weeks'][:cutoff];ids=sorted(int(k) for k in data['team_names'])
              if len(ids)!=12 or len(weeks)!=cutoff:raise RuntimeError('Bad cohort')
              weekly={rid:[] for rid in ids};h2h={rid:0. for rid in ids};median={rid:0. for rid in ids};all_play={rid:0. for rid in ids}
              for pos,w in enumerate(weeks,1):
                  if w['week']!=pos:raise RuntimeError(f'Week identity mismatch {pos}')
                  scores={int(k):float(v) for k,v in w['scores'].items()}
                  if set(scores)!=set(ids) or len(w['pairs'])!=6:raise RuntimeError('Incomplete week')
                  seen=[]
                  for a,b in w['pairs']:
                      a=int(a);b=int(b);seen.extend([a,b]);h2h[a]+=(scores[a]>scores[b])+.5*(scores[a]==scores[b]);h2h[b]+=(scores[b]>scores[a])+.5*(scores[a]==scores[b])
                  if sorted(seen)!=ids: raise RuntimeError('Invalid pairings')
                  med=statistics.median(scores.values())
                  if not math.isclose(med,w['median'],abs_tol=1e-6):raise RuntimeError('Median mismatch')
                  for rid in ids:
                      s=scores[rid];weekly[rid].append(s)
                      median[rid]+=(s>med)+.5*(s==med)
                      all_play[rid]+=sum((s>t)+.5*(s==t) for opp,t in scores.items() if rid!=opp)
              ppg={rid:statistics.mean(weekly[rid]) for rid in ids}
              recent={rid:statistics.mean(weekly[rid][-3:]) for rid in ids}
              floor={rid:quantile(weekly[rid],.25) for rid in ids}
              pf={rid:sum(weekly[rid]) for rid in ids}
              pf_pct={rid:100*(sum(pf[x]<pf[rid] for x in ids if x!=rid)+.5*sum(pf[x]==pf[rid] for x in ids if x!=rid))/11 for rid in ids}
              f={
                  'combined_win_rate':{rid:100*(h2h[rid]+median[rid])/(2*cutoff) for rid in ids},
                  'pf_percentile':pf_pct,
                  'season_scoring':z_transform(ppg),
                  'all_play':{rid:100*all_play[rid]/(11*cutoff) for rid in ids},
                  'recent_scoring':z_transform(recent),
                  'h2h':{rid:100*h2h[rid]/cutoff for rid in ids},
                  'scoring_floor':z_transform(floor),
              }
              scores={name:{rid:sum(weight*f[feature][rid] for feature,weight in mapping.items()) for rid in ids} for name,mapping in WEIGHTS.items()}
              ordering={name:sorted(ids,key=lambda rid:(-sc[rid],-pf[rid],rid)) for name,sc in scores.items()}
              positions={name:{rid:i+1 for i,rid in enumerate(row)} for name,row in ordering.items()}
              return {'scores':scores,'positions':positions,'features':f,'ppg':ppg,'recent_ppg':recent,'floor':floor,'season_pf':pf,'ids':ids}


          def avg_ranks(values):
              a=sorted(values.items(),key=lambda pair: pair[1]);r={};n=len(a);i=0
              while i<n:
                  j=i+1
                  while j<n and a[j][1]==a[i][1]:j+=1
                  rank=(i+j+1)/2
                  for k in range(i,j):r[a[k][0]]=rank
                  i=j
              return r


          def spearman(position,actual):
              a=avg_ranks(position);b=avg_ranks(actual);ids=sorted(a)
              av=statistics.mean(a.values());bv=statistics.mean(b.values())
              num=sum((a[i]-av)*(b[i]-bv) for i in ids)
              den=math.sqrt(sum((a[i]-av)**2 for i in ids)*sum((b[i]-bv)**2 for i in ids))
              return num/den if den>1e-12 else 0.


          def evaluate(data):
              through_week=len(data['weeks'])
              test_rows=[];team_rows=[]
              by_model={m:[] for m in WEIGHTS}
              stability={m:[] for m in WEIGHTS}
              prev_positions=None
              for cutoff in range(3,through_week+1):
                  curr=historical_features(data,cutoff)
                  if prev_positions is not None:
                      for m in WEIGHTS:
                          stability[m].append(statistics.mean(abs(curr['positions'][m][i]-prev_positions[m][i]) for i in curr['ids']))
                  prev_positions=curr['positions']
                  if cutoff==through_week:break
                  w=data['weeks'][cutoff]
                  actual={int(r):float(v) for r,v in w['scores'].items()}
                  target_rank=ranks_desc(actual)
                  for m in WEIGHTS:
                      position=curr['positions'][m]
                      hits=sum(position[i]<=3 and target_rank[i]<=3 for i in curr['ids'])
                      correct=0;total=0
                      for a,b in w['pairs']:
                          if actual[a]!=actual[b]:
                              total+=1;correct+=int((position[a]<position[b]) == (actual[a]>actual[b]))
                      row={'training_through_week':cutoff,'test_week':cutoff+1,
                          'classification':('EXPLORATORY' if cutoff+1<=8 else
                           ('PROSPECTIVE_ALL' if cutoff+1>=10 else 'V1_V2_V3_ONLY')),
                          'model':m,'spearman':spearman(position,target_rank),
                          'mean_rank_error':statistics.mean(abs(position[i]-target_rank[i]) for i in curr['ids']),
                          'top3_hits':hits,'h2h_correct':correct,'h2h_total':total,'h2h_accuracy':correct/total if total else 0}
                      test_rows.append(row)
                      by_model[m].append(row)
                      for rid in curr['ids']:
                          team_rows.append({'cutoff':cutoff,'test_week':cutoff+1,'model':m,'roster_id':rid,
                                            'team':data['team_names'][str(rid)],'pred_rank':position[rid],
                                            'next_score':actual[rid],'next_score_rank':target_rank[rid]})
              latest=historical_features(data,through_week)
              result=[]
              for rid in latest['ids']:
                  row={'roster_id':rid,'team':data['team_names'][str(rid)],'points_for':round(latest['season_pf'][rid],2),
                       'all_play_win_rate':round(latest['features']['all_play'][rid],2),
                       'recent_ppg':round(latest['recent_ppg'][rid],2),
                       'scoring_floor':round(latest['floor'][rid],2)}
                  for m in WEIGHTS:
                      row[m+'_rank']=latest['positions'][m][rid];row[m+'_score']=round(latest['scores'][m][rid],2)
                  result.append(row)
              result.sort(key=lambda row:row['V1_rank'])
              metric={}
              for m,rows in by_model.items():
                  historic=[x for x in rows if x['classification']=='EXPLORATORY']
                  prospective=[x for x in rows if (x['test_week']>=9 if m in ['V1','V2','V3'] else x['test_week']>=10)]
                  def summary(a):
                      if not a:return None
                      return {'n_weeks':len(a),'spearman':round(statistics.mean(x['spearman'] for x in a),4),
                              'rank_mae':round(statistics.mean(x['mean_rank_error'] for x in a),4),
                              'top3_total':sum(x['top3_hits'] for x in a),'top3_possible':3*len(a),
                              'h2h_correct':sum(x['h2h_correct'] for x in a),'h2h_total':sum(x['h2h_total'] for x in a)}
                  metric[m]={'name':MODEL_NAMES[m],'exploratory':summary(historic),
                             'prospective':summary(prospective),'weekly_rank_movement':round(statistics.mean(stability[m]),3) if stability[m] else None}
              return {'summary':metric,'latest':result,'weekly':test_rows,'team_week':team_rows}


          def write_csv(path,rows):
              if not rows:return
              with open(path,'w',encoding='utf-8',newline='') as f:
                  d=csv.DictWriter(f,fieldnames=list(rows[0]));d.writeheader();d.writerows(rows)


          def report(data,results):
              s=results['summary'];week=len(data['weeks'])
              t=['# A-NL43R1 — Eight Formula Newsletter Power-Ranking Bake-off','',
                 f'**League:** {LEAGUE_ID} · 2026 completed through Week {week}.',
                 '**Governance:** read-only; no newsletter, roster, free-agent, or calculator changes.','',
                 '## Research boundaries',
                 '- V1 is the only published formula. V1/V2/V3 are unchanged from NL42.',
                 '- Weeks 4–8 are *exploratory*, and formulas created using those weeks cannot claim independent success.',
                 '- V1/V2/V3 prospective scoring starts with Week 9 (NL42 freeze).',
                 '- New V4–V8 **clean prospective scoring begins Week 10** (Week 9 was already in progress when designed).',
                 '- Do not promote any model automatically; use at least four completed clean prospective weeks before review.',
                 '- Correlations here are per-week Spearman score-ranking correlations, averaged across test weeks.','',
                 '## Frozen formula library','',
                 '| Model | Philosophy | Exact features and weights |', '|---|---|---|']
              for m,w in WEIGHTS.items():
                  t.append(f"| {m} | {MODEL_NAMES[m]} | "+', '.join(f'{round(v*100)}% {k}' for k,v in w.items())+' |')
              t += ['', 'All scoring features are computed from **completed weeks only**. Season/recent/floor scoring are z-transformed with league cross-sectional population SD, clamped to 0–100. Floor is the 25th percentile of completed weekly team scores.',
                    '', '## Exploratory through Week 8','',
                    '| Formula | Next-week Spearman | Rank MAE | Top-three hits | H2H wins predicted | Mean weekly rank movement |',
                    '|---|---:|---:|---:|---:|---:|']
              for m,v in s.items():
                  e=v['exploratory']
                  t.append(f"| {m} | {e['spearman']:.3f} | {e['rank_mae']:.2f} | {e['top3_total']}/{e['top3_possible']} | {e['h2h_correct']}/{e['h2h_total']} | {v['weekly_rank_movement'] if v['weekly_rank_movement'] is not None else 'n/a'} |")
              t += ['', 'Historical scores are shown for descriptive comparison only. The apparent best historical formula is **not necessarily the best future predictor**.',
                    '', '## Clean prospective outcomes','',
                    '| Model | Eligible weeks tested | Spearman | Rank MAE | Top-three hits | H2H correct |',
                    '|---|---:|---:|---:|---:|---:|']
              for m,v in s.items():
                  x=v['prospective']
                  if not x:
                      t.append(f'| {m} | 0 | — | — | — | — |')
                  else:
                      t.append(f"| {m} | {x['n_weeks']} | {x['spearman']:.3f} | {x['rank_mae']:.2f} | {x['top3_total']}/{x['top3_possible']} | {x['h2h_correct']}/{x['h2h_total']} |")
              t += ['', '## Current 12-team standings under all models','',
                    '| Team | V1 | V2 | V3 | V4 | V5 | V6 | V7 | V8 |',
                    '|---|---:|---:|---:|---:|---:|---:|---:|---:|']
              for r in results['latest']:
                  t.append('| '+r['team'].replace('|','/')+' | '+' | '.join(str(r[m+'_rank']) for m in WEIGHTS)+' |')
              t += ['', '## Deployment recommendation', '',
                    '**Keep V1 published.** Broader exploratory comparisons can identify plausible candidates but are not grounds to tune weights against historical scores. Wait for future weeks scored under the locked models before reconsidering.',
                    '', '## Data and limitations',
                    '- The 2026 Week 1–8 dataset is frozen from the successful NL42R1 artifact; later weeks are verified complete from Sleeper.',
                    '- All observations belong to one 12-team league; within-week outcomes are correlated.',
                    '- A week with missing scores, mismatched roster IDs, or altered Week 1–8 historical scores fails closed.',
                    '- H2H results and all-play results are distinct; rankings are editorial and never override official Sleeper standings.',
                    '- The entire workflow is non-publishing, non-mutating and cannot access private free-agent data.', '']
              return '\n'.join(t)


          def selftest():
              d=freeze_data();res=evaluate(d)
              assert len(res['latest'])==12 and len(res['weekly'])==40
              expect={'V1':(.5020979021,2.7,7,20),'V2':(.5370629371,2.6,8,19),'V3':(.5412587413,2.56666667,8,19)}
              for m,(rho,mae,top,h2h) in expect.items():
                  a=res['summary'][m]['exploratory']
                  assert math.isclose(a['spearman'],rho,abs_tol=.0001),(m,a)
                  assert math.isclose(a['rank_mae'],mae,abs_tol=.0001),(m,a)
                  assert a['top3_total']==top and a['h2h_correct']==h2h,(m,a)
              assert res['latest'][0]['team']=="Landry's Hat"
              assert res['latest'][0]['V1_rank']==1
              assert all(v['prospective'] is None for v in res['summary'].values())
              # Future score mutations cannot affect past ranks; models only read weeks before test target.
              altered=json.loads(json.dumps(d));altered['weeks'][7]['scores']['1']=9999.
              for m in WEIGHTS:
                  # A changed Week 8 outcome cannot influence ranks calculated after Week 7.
                  f=historical_features(d,7)['positions'][m]
                  g=historical_features(altered,7)['positions'][m]
                  assert f==g,m
              print('PASS: NL42 V1/V2/V3 reproduced exactly; 8 formulas; future-leakage guard; 12-team reconciliation')


          def main():
              parser=argparse.ArgumentParser()
              parser.add_argument('--through-week',type=int,default=8)
              parser.add_argument('--out',type=Path,default=Path('nl43_output'))
              parser.add_argument('--selftest',action='store_true')
              args=parser.parse_args()
              if args.selftest:selftest();return
              selftest()
              data=completed_source(args.through_week)
              result=evaluate(data)
              args.out.mkdir(parents=True,exist_ok=True)
              (args.out/'NL43R1-RESEARCH-REPORT.md').write_text(report(data,result)+'\n',encoding='utf-8')
              (args.out/'NL43R1-RESULTS.json').write_text(json.dumps({'season':SEASON,'through_week':args.through_week,
                   'governance':'READ_ONLY_NO_FORMULA_PROMOTION','models':WEIGHTS,'evaluations':result['summary']},indent=2)+'\n',encoding='utf-8')
              write_csv(args.out/'NL43R1-ALL-EIGHT-CURRENT-RANKINGS.csv',result['latest'])
              write_csv(args.out/'NL43R1-WEEKLY-MODEL-METRICS.csv',result['weekly'])
              write_csv(args.out/'NL43R1-ALL-TEAM-PREDICTIONS.csv',result['team_week'])
              digest=hashlib.sha256(json.dumps(data,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              (args.out/'NL43R1-SOURCE-HASH.txt').write_text('sha256='+digest+'\n',encoding='utf-8')
              print(f'PASS: {len(WEIGHTS)} immutable model definitions; {args.through_week} verified completed weeks; 0 repository writes')
              for m,v in result['summary'].items():
                  print(f'{m}: exploratory rho={v["exploratory"]["spearman"]:.3f}; clean prospective n={v["prospective"]["n_weeks"] if v["prospective"] else 0}')

          if __name__=='__main__':main()
          NL43_ENGINE
          python3 "$RUNNER_TEMP/nl43_engine.py" --through-week "$THROUGH_WEEK" --out "$RUNNER_TEMP/nl43_results"
      - name: Attach reproducible research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL43R1-Eight-Formula-Research-${{ github.run_id }}
          path: ${{ runner.temp }}/nl43_results/
          retention-days: 90
          if-no-files-found: error
      - name: Research-only summary
        shell: bash
        run: |
          set -euo pipefail
          echo '## NL43R1 - 8 formula research, read-only' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'V1 remains the newsletter formula. Exploratory backtests do not authorize promotion.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^## Exploratory through Week 8/,/^## Clean prospective outcomes/p' "$RUNNER_TEMP/nl43_results/NL43R1-RESEARCH-REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'No repository writes, no private FA board, no newsletter publishing.' >> "$GITHUB_STEP_SUMMARY"
