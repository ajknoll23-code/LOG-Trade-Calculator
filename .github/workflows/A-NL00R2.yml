          python3 scripts/newsletters/league_newsletter.py --selftest

      - name: Live Sleeper PRE Week 9 and POST Week 8 verification (NO SEND)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loog-reports"
          python3 scripts/newsletters/league_newsletter.py \
            --edition pre --week 9 --output-dir "$RUNNER_TEMP/loog-reports"
          python3 scripts/newsletters/league_newsletter.py \
            --edition post --week 8 --output-dir "$RUNNER_TEMP/loog-reports"
          python3 - <<'PY'
          import json,os,pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'loog-reports'
          docs = sorted(p.glob('*.json'))
          assert len(docs) == 2, f'Expected two live report data files: {docs}'
          assert len(list(p.glob('*.html'))) == 2
          assert len(list(p.glob('*.txt'))) == 2
          for path in docs:
              d = json.loads(path.read_text())
              assert d['season'] == 2026 and d['league_id'] == '1326679131051532288'
              assert len(d['games']) == 6
              ids = [g[k] for g in d['games'] for k in ('a','b')]
              assert len(set(ids)) == 12
              if d['edition'] == 'post':
                  assert d['week'] == 8 and d['median'] is not None
                  assert all(g['score_a'] is not None and g['score_b'] is not None for g in d['games'])
              else:
                  assert d['week'] == 9
              print(f"PASS LIVE: {d['edition']} week={d['week']}; six games; twelve unique teams; league={d['league']}; no email")
          PY

      - name: Ensure exact one-time install scope, never touch valuation or live data
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/nl00_protected.sha"
          python3 - <<'PY'
          import subprocess
          allowed={'.github/workflows/A-NL01R2.yml','scripts/newsletters/league_newsletter.py',
                   'tests/newsletters/test_newsletter.py','docs/LOOG-newsletter-setup.md'}
          status=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True)
          changed={line[3:] for line in status.splitlines() if line.strip()}
          assert changed == allowed, f'Changed paths differ from exact newsletter scope: {changed}'
          print('PASS: exact four newsletter-only files staged; original repository unchanged')
          PY
          git diff --exit-code -- index.html free-agent-board.html config.json data/ research/ scripts/validation/
          git diff --check

      - name: APPLY installed newsletter and retire one-time installer
        if: ${{ inputs.mode == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/nl00_base_sha.txt")"
          sha256sum --check "$RUNNER_TEMP/nl00_protected.sha"
          git add -- .github/workflows/A-NL01R2.yml \
            scripts/newsletters/league_newsletter.py \
            tests/newsletters/test_newsletter.py \
            docs/LOOG-newsletter-setup.md
          git rm -- .github/workflows/A-NL00R2.yml
          # Preserve first successful preview installer without leaving it active.
          test -f .github/workflows/A-NL00R1.yml
          test ! -e .github/workflow-archive/A-NL00R1.yml
          mkdir -p .github/workflow-archive
          git mv .github/workflows/A-NL00R1.yml .github/workflow-archive/A-NL00R1.yml
          python3 - <<'PY'
          import subprocess
          # --name-only lists the destination of a 100% Git rename, not both paths.
          allowed={'.github/workflows/A-NL01R2.yml', '.github/workflows/A-NL00R2.yml',
                   '.github/workflow-archive/A-NL00R1.yml',
                   'scripts/newsletters/league_newsletter.py',
                   'tests/newsletters/test_newsletter.py','docs/LOOG-newsletter-setup.md'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == allowed, f'Unexpected staged paths: {changed}'
          changes=subprocess.check_output(['git','diff','--cached','--name-status','--find-renames=100%'],text=True)
          assert 'R100\t.github/workflows/A-NL00R1.yml\t.github/workflow-archive/A-NL00R1.yml' in changes, changes
          print('PASS: exact newsletter release files + self-deleting installer, no data or production changes')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-NL01R2: install safe twice-weekly Sleeper league newsletters'
          git push origin HEAD:main

      - name: Report exact outcome and mail safety state
        if: always()
        shell: bash
        env:
          NL_MODE: ${{ inputs.mode }}
        run: |
          {
            echo '## A-NL00R2 LOOG Newsletter Installation'
            echo "- Mode: $NL_MODE"
            echo '- Live Sleeper Week 9 preview + Week 8 recap: see artifact files if this step succeeded'
            echo '- Number of teams: 12, pairings: 6 each'
            echo '- SMTP: NOT CALLED; send mode was never provided'
            echo '- Frozen valuation model: untouched'
            echo '- Scheduled newsletter default: render-only; sending requires two explicit repository variables and SMTP secrets'
            if [ "$NL_MODE" = APPLY ]; then
              echo '- APPLY installed A-NL01R2 and archived A-NL00R1, removed A-NL00R2 from active workflows'
            else
              echo '- PREVIEW_ONLY did not commit any files'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real source previews (no email)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-NL00R2-live-preview-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/loog-reports/
