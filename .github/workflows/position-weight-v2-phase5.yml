name: Position Weight V2 Phase 5 Prospective Evaluator

# FROZEN prospective research only.
#
# Freezes deployed_control vs bridge_50 before Week 1, then grades only
# completed future 2026 evidence using cross-position structural lineup utility.
# No production file or deployed POSITION_WEIGHT is changed.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 2'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 5 self-test
        run: python3 research/position-weight-v2/position_weight_v2_phase5_prospective_evaluator.py --selftest

      - name: Freeze if needed and evaluate completed future weeks
        run: python3 research/position-weight-v2/position_weight_v2_phase5_prospective_evaluator.py --freeze --write

      - name: Verify frozen/evaluation guardrails
        run: python3 research/position-weight-v2/position_weight_v2_phase5_prospective_evaluator.py --check

      - name: Commit prospective research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/position-weight-v2/position_weight_v2_phase5_frozen_candidates.json
          git add research/position-weight-v2/position_weight_v2_phase5_evaluation.json
          git add research/position-weight-v2/position_weight_v2_phase5_evaluation.md
          git diff --staged --quiet || git commit -m "Update Position Weight V2 Phase 5 prospective research"
          git push
