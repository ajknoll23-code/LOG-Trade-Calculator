# PREFLIGHTED: POST_IDENTITY_V2_CLOSURE_AND_DL_LB_HANDOFF
name: A16 Workflow Folder Cleanup Post Identity V2

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests==2.34.2"

      - name: Guard closure state and exact active workflow inventory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          workflow_dir=Path(".github/workflows")
          this_cleanup="A16-workflow-folder-cleanup-post-identity-v2.yml"
          old_cleanup="workflow-folder-cleanup-v9-prep.yml"

          archive_targets={'A1-identity-v2-phase8-external-corroboration.yml': '4cbe922b764a7672bcc953edb324c4a68d2e9c52', 'A2-identity-v2-phase9-terrell-jennings-id-corroboration.yml': '840f7dc6d73c3314af4128d8ab2fc4a9247d5ce0', 'A3-identity-v2-phase10-terrell-jennings-shadow.yml': '4075bc688d04606011693643f125e9b2edb965e0', 'A4-identity-v2-phase11-terrell-jennings-deployment.yml': '4cea1ef9020698418b83379ee290396b9dedc7d4', 'A4-identity-v2-phase11-terrell-jennings-deployment-fixed.yml': '5c9231823853c2950709f1e2f280abd3f554fd14', 'A5-identity-v2-phase12-batch1-stable-id-shadow.yml': '1e080ae32e792121ecdd45f3559ed20f9a467c30', 'A6-identity-v2-phase13-batch1-deployment.yml': '0f291616704f17e9e24bc2b0c03bd28580b3d3d1', 'A7-identity-v2-phase14-batch2-stable-id-shadow.yml': '20a6f6116b6ab7b2bd261ae804faa35c09461bd7', 'A8-identity-v2-phase15-batch2-deployment.yml': '38ad117138b40706fcb541e7ab1dcd654024d865', 'A9-identity-v2-phase16-batch3-stable-id-shadow.yml': 'f195555235d1c03a3845216aa40f0002aacce15c', 'A10-identity-v2-phase17-batch3-deployment.yml': 'dbb8df1466a2090bc7bed1cf14af5d83d621cfd5', 'A11-identity-v2-phase18-batch4-stable-id-shadow-fixed.yml': '5f078eab1fc11983c8de388d4533cd884c27bef9', 'A12-identity-v2-phase19-batch4-deployment.yml': '30680709537622baf46f6e20d5a571980a4fb447', 'A13-identity-v2-phase20-final-pair-stable-id-shadow.yml': '3f8e3f20c67bd06f798aed32dfe7b1b3112ceac7', 'A14-identity-v2-phase21-devin-culp-exact-scope-deployment.yml': '986fce88e2600c6c5fe04fef0e215767ddeb89d2', 'A15-identity-v2-phase22-closure-freeze.yml': '86d59d79f5b4a075c39056180393312d9b72d509', 'a10.yml': 'dbb8df1466a2090bc7bed1cf14af5d83d621cfd5', 'identity-v2-phase7-current-manual-review-refresh.yml': '237d8865a37c0e1bbd633b6fa715944c79326c81', 'idp-dl-lb-structural-integrity-audit-v1.yml': '89b0e856bc7f73556b84ee40d0cf262d878fba3b', 'idp-dl-lb-residual-reconciliation-v1-phase1.yml': '3670c06f2bb344bfc8c748ccb86fb09926a73b7c'}
          protected=set(['A16-workflow-folder-cleanup-post-identity-v2.yml', 'age-curve-v2-phase5.yml', 'cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml', 'draft-pick-fv-v10-phase0-expected-value-prereg-and-construct-audit.yml', 'draft-pick-fv-v10-phase1-market-bridge-tail-freeze.yml', 'draft-pick-fv-v10-phase2-5-tail-year-discount-uncertainty.yml', 'draft-pick-fv-v10-phase2-production-candidate-audit-v2.yml', 'draft-pick-fv-v10-phase2-production-candidate-audit.yml', 'draft-pick-fv-v10-phase3-production-deployment-v2.yml', 'draft-pick-fv-v9-phase0-1-production-candidate-development-freeze-FIXED.yml', 'draft-pick-fv-v9-phase0-1-production-candidate-development-freeze.yml', 'draft-pick-fv-v9-phase2-production-engineering-bridge.yml', 'draft-pick-fv-v9-production-rollback.yml', 'durability-v2-phase5.yml', 'fantasypros-api-pipeline.yml', 'free-agent-utility-v1-refresh.yml', 'idp-dl-lb-phase2.yml', 'ktc-vote-aggregation.yml', 'ktc_voter_balance_prospective.yml', 'market-edge-v1-prospective-study.yml', 'no-history-rookie-v2-phase3.yml', 'opportunity-v2-phase5.yml', 'package-adjustment-audit-step4-exact-live-oos.yml', 'package-adjustment-v8-development-voting-activation-v1.yml', 'package-adjustment-v8-outcome-blind-maturity-monitor-v1.yml', 'package-adjustment-v8-phase1c-development-catalog-and-audit-v1.yml', 'package-adjustment-v8-phase1d-fixed50-protocol-amendment-v1.yml', 'package-adjustment-v8-phase1e-evaluation-engine-freeze-v2.yml', 'package-adjustment-v8-phase1f-pre-vote-operational-hardening-v2.yml', 'package-adjustment-v8-phase1f-pre-vote-operational-hardening-v3.yml', 'position-weight-v2-phase5.yml', 'prospective-trade-evidence-capture.yml', 'replacement-level-v2-phase5.yml', 'repo-regression-checks.yml', 'research-program-status-v1-current-state-audit.yml', 'scheduled-data-refresh.yml', 'sync-sleeper.yml'])

          current={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }

          assert this_cleanup in current, "A16 cleanup workflow missing"
          if old_cleanup in current:
              raise SystemExit(
                  "Old cleanup workflow is still present. Delete "
                  ".github/workflows/workflow-folder-cleanup-v9-prep.yml "
                  "manually before running A16."
              )

          cleanup_named=sorted(
              n for n in current if "cleanup" in n.lower()
          )
          if cleanup_named != [this_cleanup]:
              raise SystemExit(
                  "A16 must be the only active cleanup workflow. Found: "
                  + ", ".join(cleanup_named)
              )

          expected=set(archive_targets)|protected
          if current != expected:
              raise SystemExit(
                  "Active workflow inventory differs from the frozen A16 plan.\n"
                  f"Missing: {sorted(expected-current)}\n"
                  f"Unexpected: {sorted(current-expected)}"
              )

          assert len(current)==57
          assert len(archive_targets)==20
          assert len(protected)==37

          D=Path("research/identity-v2")
          close=json.loads(
              (D/"identity_v2_phase22_closure_freeze.json").read_text()
          )
          close_m=json.loads(
              (D/"identity_v2_phase22_closure_manifest.json").read_text()
          )
          assert close["decision"]==(
              "PASS_IDENTITY_V2_CLOSE_AND_FREEZE_WITH_JONAH_ELLISS_HOLD"
          )
          assert close["status"]=="FROZEN_COMPLETE_WITH_ONE_EXPLICIT_HOLD"
          assert close["identity_v2_closed"] is True
          assert close["deployable_identity_work_complete"] is True
          assert close["production_change_applied"] is False
          assert close["remaining_manual_review_count"]==1
          assert close["remaining_manual_review_fpids"]==["26157"]
          assert close_m["decision"]==close["decision"]
          assert close_m["identity_v2_closed"] is True
          assert close_m["remaining_manual_review_fpids"]==["26157"]

          P=Path("research/idp-dl-lb-residual-reconciliation-v1")
          p2=json.loads((P/"phase2_evaluation.json").read_text())
          p2m=json.loads((P/"phase2_manifest.json").read_text())
          assert p2["status"]=="READY_WAITING_FOR_COMPLETED_WEEK_4"
          assert p2["first_eligible_future_week"]==4
          assert p2["deployment_authorized"] is False
          assert p2["production_change_authorized"] is False
          assert p2m["status"]=="READY_WAITING_FOR_COMPLETED_WEEK_4"
          assert p2m["candidate_freeze_immutable"] is True
          assert "idp-dl-lb-phase2.yml" in protected

          audit=json.loads(
              Path("research/idp-dl-lb-structural-audit-v1/audit_result.json").read_text()
          )
          p1=json.loads((P/"phase1_result.json").read_text())
          assert audit["status"]=="AUDIT_COMPLETE"
          assert audit["decision"]==(
              "STOP_TRUSTING_ABSOLUTE_FV_CALIBRATION_FOR_MIGRATED_DL_COHORT_"
              "AUTHORIZE_RECONCILIATION_RESEARCH"
          )
          assert audit["production_change_authorized"] is False
          assert p1["status"]=="COMPLETE"
          assert p1["decision"]==(
              "FREEZE_DL_LINEAGE_RESIDUAL_RESET_C0_FOR_PROSPECTIVE_VALIDATION"
          )
          assert p1["production_change_authorized"] is False

          for name,expected_blob in archive_targets.items():
              path=workflow_dir/name
              if not path.exists():
                  raise SystemExit(f"Archive target missing: {path}")
              actual=subprocess.check_output(
                  ["git","hash-object",str(path)],text=True
              ).strip()
              if actual!=expected_blob:
                  raise SystemExit(
                      f"Blob drift for {name}: "
                      f"expected={expected_blob} actual={actual}"
                  )

          print("PASS: A16 is the sole cleanup workflow.")
          print("PASS: exact active workflow inventory = 57.")
          print("PASS: Identity V2 is formally closed.")
          print("PASS: DL/LB Phase 2 remains active and waits for completed Week 4.")
          print("PASS: 20 exact completed/superseded workflows are eligible for archive.")
          PY

      - name: Pre-cleanup repository regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Build exact archive plan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          import yaml

          workflow_dir=Path(".github/workflows")
          archive_dir=Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True,exist_ok=True)
          batch="2026-09-29-post-identity-v2-closure-and-dl-lb-handoff"

          archive_targets={'A1-identity-v2-phase8-external-corroboration.yml': '4cbe922b764a7672bcc953edb324c4a68d2e9c52', 'A2-identity-v2-phase9-terrell-jennings-id-corroboration.yml': '840f7dc6d73c3314af4128d8ab2fc4a9247d5ce0', 'A3-identity-v2-phase10-terrell-jennings-shadow.yml': '4075bc688d04606011693643f125e9b2edb965e0', 'A4-identity-v2-phase11-terrell-jennings-deployment.yml': '4cea1ef9020698418b83379ee290396b9dedc7d4', 'A4-identity-v2-phase11-terrell-jennings-deployment-fixed.yml': '5c9231823853c2950709f1e2f280abd3f554fd14', 'A5-identity-v2-phase12-batch1-stable-id-shadow.yml': '1e080ae32e792121ecdd45f3559ed20f9a467c30', 'A6-identity-v2-phase13-batch1-deployment.yml': '0f291616704f17e9e24bc2b0c03bd28580b3d3d1', 'A7-identity-v2-phase14-batch2-stable-id-shadow.yml': '20a6f6116b6ab7b2bd261ae804faa35c09461bd7', 'A8-identity-v2-phase15-batch2-deployment.yml': '38ad117138b40706fcb541e7ab1dcd654024d865', 'A9-identity-v2-phase16-batch3-stable-id-shadow.yml': 'f195555235d1c03a3845216aa40f0002aacce15c', 'A10-identity-v2-phase17-batch3-deployment.yml': 'dbb8df1466a2090bc7bed1cf14af5d83d621cfd5', 'A11-identity-v2-phase18-batch4-stable-id-shadow-fixed.yml': '5f078eab1fc11983c8de388d4533cd884c27bef9', 'A12-identity-v2-phase19-batch4-deployment.yml': '30680709537622baf46f6e20d5a571980a4fb447', 'A13-identity-v2-phase20-final-pair-stable-id-shadow.yml': '3f8e3f20c67bd06f798aed32dfe7b1b3112ceac7', 'A14-identity-v2-phase21-devin-culp-exact-scope-deployment.yml': '986fce88e2600c6c5fe04fef0e215767ddeb89d2', 'A15-identity-v2-phase22-closure-freeze.yml': '86d59d79f5b4a075c39056180393312d9b72d509', 'a10.yml': 'dbb8df1466a2090bc7bed1cf14af5d83d621cfd5', 'identity-v2-phase7-current-manual-review-refresh.yml': '237d8865a37c0e1bbd633b6fa715944c79326c81', 'idp-dl-lb-structural-integrity-audit-v1.yml': '89b0e856bc7f73556b84ee40d0cf262d878fba3b', 'idp-dl-lb-residual-reconciliation-v1-phase1.yml': '3670c06f2bb344bfc8c748ccb86fb09926a73b7c'}
          protected=set(['A16-workflow-folder-cleanup-post-identity-v2.yml', 'age-curve-v2-phase5.yml', 'cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml', 'draft-pick-fv-v10-phase0-expected-value-prereg-and-construct-audit.yml', 'draft-pick-fv-v10-phase1-market-bridge-tail-freeze.yml', 'draft-pick-fv-v10-phase2-5-tail-year-discount-uncertainty.yml', 'draft-pick-fv-v10-phase2-production-candidate-audit-v2.yml', 'draft-pick-fv-v10-phase2-production-candidate-audit.yml', 'draft-pick-fv-v10-phase3-production-deployment-v2.yml', 'draft-pick-fv-v9-phase0-1-production-candidate-development-freeze-FIXED.yml', 'draft-pick-fv-v9-phase0-1-production-candidate-development-freeze.yml', 'draft-pick-fv-v9-phase2-production-engineering-bridge.yml', 'draft-pick-fv-v9-production-rollback.yml', 'durability-v2-phase5.yml', 'fantasypros-api-pipeline.yml', 'free-agent-utility-v1-refresh.yml', 'idp-dl-lb-phase2.yml', 'ktc-vote-aggregation.yml', 'ktc_voter_balance_prospective.yml', 'market-edge-v1-prospective-study.yml', 'no-history-rookie-v2-phase3.yml', 'opportunity-v2-phase5.yml', 'package-adjustment-audit-step4-exact-live-oos.yml', 'package-adjustment-v8-development-voting-activation-v1.yml', 'package-adjustment-v8-outcome-blind-maturity-monitor-v1.yml', 'package-adjustment-v8-phase1c-development-catalog-and-audit-v1.yml', 'package-adjustment-v8-phase1d-fixed50-protocol-amendment-v1.yml', 'package-adjustment-v8-phase1e-evaluation-engine-freeze-v2.yml', 'package-adjustment-v8-phase1f-pre-vote-operational-hardening-v2.yml', 'package-adjustment-v8-phase1f-pre-vote-operational-hardening-v3.yml', 'position-weight-v2-phase5.yml', 'prospective-trade-evidence-capture.yml', 'replacement-level-v2-phase5.yml', 'repo-regression-checks.yml', 'research-program-status-v1-current-state-audit.yml', 'scheduled-data-refresh.yml', 'sync-sleeper.yml'])

          def blob(path):
              return subprocess.check_output(
                  ["git","hash-object",str(path)],text=True
              ).strip()

          def trigger_contract(path):
              doc=yaml.load(
                  Path(path).read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc,dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")
              raw=doc.get("on")
              if isinstance(raw,str):
                  return {raw}
              if isinstance(raw,list):
                  return set(map(str,raw))
              if isinstance(raw,dict):
                  return set(map(str,raw.keys()))
              raise SystemExit(
                  f"Unrecognized workflow trigger syntax: {path}: {raw!r}"
              )

          current={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }
          expected=set(archive_targets)|protected
          assert current==expected
          assert len(current)==57

          rows=[]
          for name,expected_blob in sorted(archive_targets.items()):
              src=workflow_dir/name
              dst=archive_dir/name
              if not src.exists():
                  raise SystemExit(f"Archive target missing: {src}")
              if dst.exists():
                  raise SystemExit(
                      f"Archive destination already exists; refusing overwrite: {dst}"
                  )

              actual_blob=blob(src)
              if actual_blob!=expected_blob:
                  raise SystemExit(
                      f"Blob drift for {name}: "
                      f"expected={expected_blob} actual={actual_blob}"
                  )

              triggers=trigger_contract(src)
              if triggers != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Archive target {name} is not manual-only: "
                      f"triggers={sorted(triggers)}"
                  )

              family=(
                  "Identity V2 closed"
                  if (
                      name.startswith("A")
                      or name=="a10.yml"
                      or name.startswith("identity-v2-")
                  )
                  else "IDP DL/LB completed precursor research; Phase 2 remains active"
              )

              rows.append({
                  "original_path":str(src),
                  "archive_path":str(dst),
                  "git_blob_sha":actual_blob,
                  "sha256":hashlib.sha256(src.read_bytes()).hexdigest(),
                  "triggers":sorted(triggers),
                  "cleanup_batch":batch,
                  "research_family":family,
              })

          plan={
              "schema_version":10,
              "cleanup_batch":batch,
              "authorization_evidence":{
                  "identity_v2_decision":
                      "PASS_IDENTITY_V2_CLOSE_AND_FREEZE_WITH_JONAH_ELLISS_HOLD",
                  "identity_v2_closed":True,
                  "identity_v2_remaining_manual_hold":"26157 Jonah Elliss",
                  "idp_dl_lb_phase2_status":
                      "READY_WAITING_FOR_COMPLETED_WEEK_4",
                  "idp_dl_lb_phase2_protected_active":True,
                  "old_cleanup_manually_deleted_before_run":
                      "workflow-folder-cleanup-v9-prep.yml",
              },
              "active_before_n":len(current),
              "archive_now_n":len(rows),
              "active_after_n":len(protected),
              "protected_active_workflows":sorted(protected),
              "archive_entries":rows,
              "delete_entries":[],
          }

          assert plan["active_before_n"]==57
          assert plan["archive_now_n"]==20
          assert plan["active_after_n"]==37

          Path(".github/workflow-archive/workflow-cleanup-plan.json").write_text(
              json.dumps(plan,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )

          print("PASS: exact archive plan frozen.")
          print("PASS: 20 workflows to archive; 37 workflows protected active.")
          PY

      - name: Archive exact completed workflows
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          data=json.loads(
              Path(".github/workflow-archive/workflow-cleanup-plan.json").read_text(
                  encoding="utf-8"
              )
          )

          for row in data["archive_entries"]:
              src=Path(row["original_path"])
              dst=Path(row["archive_path"])
              dst.parent.mkdir(parents=True,exist_ok=True)

              if not src.exists():
                  raise SystemExit(f"Archive source disappeared: {src}")
              if dst.exists():
                  raise SystemExit(f"Archive destination exists: {dst}")

              src.rename(dst)

              actual=hashlib.sha256(dst.read_bytes()).hexdigest()
              if actual!=row["sha256"]:
                  raise SystemExit(
                      f"Post-move hash mismatch for {dst}: "
                      f"expected={row['sha256']} actual={actual}"
                  )

          print(
              f"PASS: archived {len(data['archive_entries'])} exact workflows "
              "without changing file bytes."
          )
          PY

      - name: Update archive manifest and README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path

          archive_dir=Path(".github/workflow-archive/completed-research")
          plan_path=Path(".github/workflow-archive/workflow-cleanup-plan.json")
          manifest_path=archive_dir/"archive_manifest.json"
          readme_path=archive_dir/"README.md"

