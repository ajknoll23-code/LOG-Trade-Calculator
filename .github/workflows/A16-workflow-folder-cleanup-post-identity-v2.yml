              if p.is_file() and p.suffix in {".yml",".yaml"}
          }

          if current!=expected:
              raise SystemExit(
                  "Post-cleanup active workflow inventory mismatch.\n"
                  f"Missing: {sorted(expected-current)}\n"
                  f"Unexpected: {sorted(current-expected)}"
              )
          assert len(current)==37

          for name in sorted(current):
              path=workflow_dir/name
              doc=yaml.load(
                  path.read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc,dict):
                  raise SystemExit(f"Invalid active workflow YAML: {name}")

          assert "idp-dl-lb-phase2.yml" in current
          assert "A16-workflow-folder-cleanup-post-identity-v2.yml" in current
          assert "workflow-folder-cleanup-v9-prep.yml" not in current

          forbidden={
              "A1-identity-v2-phase8-external-corroboration.yml",
              "A2-identity-v2-phase9-terrell-jennings-id-corroboration.yml",
              "A3-identity-v2-phase10-terrell-jennings-shadow.yml",
              "A4-identity-v2-phase11-terrell-jennings-deployment.yml",
              "A4-identity-v2-phase11-terrell-jennings-deployment-fixed.yml",
              "A5-identity-v2-phase12-batch1-stable-id-shadow.yml",
              "A6-identity-v2-phase13-batch1-deployment.yml",
              "A7-identity-v2-phase14-batch2-stable-id-shadow.yml",
              "A8-identity-v2-phase15-batch2-deployment.yml",
              "A9-identity-v2-phase16-batch3-stable-id-shadow.yml",
              "A10-identity-v2-phase17-batch3-deployment.yml",
              "A11-identity-v2-phase18-batch4-stable-id-shadow-fixed.yml",
              "A12-identity-v2-phase19-batch4-deployment.yml",
              "A13-identity-v2-phase20-final-pair-stable-id-shadow.yml",
              "A14-identity-v2-phase21-devin-culp-exact-scope-deployment.yml",
              "A15-identity-v2-phase22-closure-freeze.yml",
              "a10.yml",
              "identity-v2-phase7-current-manual-review-refresh.yml",
              "idp-dl-lb-structural-integrity-audit-v1.yml",
              "idp-dl-lb-residual-reconciliation-v1-phase1.yml",
          }
          leaked=sorted(forbidden & current)
          if leaked:
              raise SystemExit(
                  "Archived workflow(s) still active: "+", ".join(leaked)
              )

          print("PASS: exact post-cleanup active workflow count = 37.")
          print("PASS: active DL/LB Phase 2 preserved.")
          print("PASS: closed Identity V2 chain removed from active Actions list.")
          PY

      - name: Prove cleanup touched only workflow administration paths
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          status=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={
              line[3:]
              for line in status.splitlines()
              if line.strip()
          }

          bad=sorted(
              p for p in touched
              if not (
                  p.startswith(".github/workflows/")
                  or p.startswith(".github/workflow-archive/")
              )
          )
          if bad:
              raise SystemExit(
                  "Cleanup touched non-workflow administration files: "
                  + ", ".join(bad)
              )

          if not touched:
              raise SystemExit("Cleanup produced no repository changes.")

          print(
              "PASS: cleanup scope is restricted to .github/workflows and "
              ".github/workflow-archive."
          )
          PY

          git diff --check

      - name: Post-cleanup repository regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit A16 cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A16 cleanup."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .github/workflows .github/workflow-archive
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          names=subprocess.check_output(
              ["git","diff","--cached","--name-only"],
              text=True
          ).splitlines()

          bad=[
              p for p in names
              if not (
                  p.startswith(".github/workflows/")
                  or p.startswith(".github/workflow-archive/")
              )
          ]
          if bad:
              raise SystemExit(
                  "Refusing commit; staged non-workflow files: "
                  + ", ".join(sorted(bad))
              )
          print(f"PASS: {len(names)} staged workflow-administration paths only.")
          PY

          git commit -m "Archive closed Identity V2 workflows"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A16 workflow folder cleanup committed cleanly."
