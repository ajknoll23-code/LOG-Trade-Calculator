          old=json.loads(manifest_path.read_text(encoding="utf-8"))

          assert old["archive_workflow_n"]==187
          assert len(old.get("archive_entries",[]))==187
          assert old["last_cleanup_batch"]==(
              "2026-09-28-post-draft-pick-v8-1-closeout-v9-prep"
          )

          by_original={
              row["original_path"]:row
              for row in old.get("archive_entries",[])
          }

          for row in plan["archive_entries"]:
              if row["original_path"] in by_original:
                  raise SystemExit(
                      "Archive manifest already contains target: "
                      + row["original_path"]
                  )
              by_original[row["original_path"]]=row

          entries=[by_original[k] for k in sorted(by_original)]
          deleted=list(old.get("deleted_obsolete_workflows",[]))

          actual_yaml=sorted(
              p.name for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          )
          manifest_yaml=sorted(
              Path(row["archive_path"]).name for row in entries
          )

          if actual_yaml!=manifest_yaml:
              raise SystemExit(
                  "Archive YAML inventory differs from manifest after A16."
              )

          assert len(entries)==207
          assert len(actual_yaml)==207

          now=datetime.now(timezone.utc).isoformat()
          manifest={
              **old,
              "schema_version":10,
              "archive_workflow_n":207,
              "last_cleanup_batch":plan["cleanup_batch"],
              "last_cleanup_at_utc":now,
              "active_workflow_n_after_cleanup":37,
              "archive_entries":entries,
              "deleted_obsolete_workflows":deleted,
              "latest_cleanup_authorization":plan["authorization_evidence"],
          }
          manifest_path.write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )

          old_readme=readme_path.read_text(encoding="utf-8").rstrip()
          added_names=[
              Path(row["archive_path"]).name
              for row in plan["archive_entries"]
          ]
          section=[
              "",
              "",
              "## 2026-09-29 — Identity V2 closure cleanup",
              "",
              "Archived 20 completed/superseded manual workflows after the "
              "formal Identity V2 Phase 22 closure. The active DL/LB Phase 2 "
              "prospective workflow remains in `.github/workflows` because it "
              "is waiting for completed Week 4.",
              "",
              "Archived in this batch:",
              "",
          ]
          section += [f"- {name}" for name in sorted(added_names)]
          readme_path.write_text(
              old_readme+"\n"+"\n".join(section).rstrip()+"\n",
              encoding="utf-8",
          )

          print("PASS: archive manifest advanced 187 -> 207.")
          print("PASS: README records the exact A16 cleanup batch.")
          PY

      - name: Prove exact post-cleanup active inventory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          workflow_dir=Path(".github/workflows")
          plan=json.loads(
              Path(".github/workflow-archive/workflow-cleanup-plan.json").read_text()
