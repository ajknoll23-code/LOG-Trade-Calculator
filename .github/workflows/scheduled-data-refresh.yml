name: Scheduled Data Refresh

# Automated source-data maintenance.
#
# Tuesday = full refresh:
#   Sleeper sync -> standings-based 2027 draft-slot projection -> team refresh ->
#   Sleeper projections -> IDP filter -> FantasyPros -> identity crosswalk ->
#   Team Utility lineup projections -> dual eligibility -> KTC aggregation ->
#   KTC voter-balance research audit -> separate Market Value ->
#   realized-outcome target refresh -> derived state -> value uncertainty
#   envelopes -> append-only historical model/evidence snapshot ->
#   fundamental + market out-of-sample evaluators.
#
# Friday = light refresh:
#   Same core projection/data chain, excluding the weekly draft-slot projection,
#   dual-eligibility, KTC aggregation, KTC voter-balance research audit,
#   separate Market Value refresh, and realized-outcome refresh steps, then
#   captures another historical snapshot.
#
# Draft-slot projection is intentionally Tuesday-only on the schedule. Updating
# it during a live Thursday/Friday matchup could let partial-week points scored
# move a standings tiebreaker before the week's games are complete.
#
# Everything runs sequentially in ONE job and is committed/pushed ONCE to
# avoid the multi-workflow push races that can occur when independent writers
# run at the same time.
on:
  schedule:
    - cron: '0 15 * * 2'
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Refresh depth'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - light
      update_draft_slots:
        description: 'Also refresh the 2027 standings-based draft-slot projection'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine refresh mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 2" ]; then
            mode="full"
          else
            mode="light"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Refresh mode: $mode"

      - name: Set up Python 3.12 for Sleeper sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sleeper sync self-test
        run: python3 scripts/sync/sync_sleeper.py --selftest

      - name: Refresh Sleeper league data
        run: python3 scripts/sync/sync_sleeper.py

      - name: Draft-slot projection self-test
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 2') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.update_draft_slots == 'true')
        run: python3 scripts/projections/draft_slot_projection_pipeline.py --selftest

      - name: Refresh standings-based draft-slot projection
        id: draftslot
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 2') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.update_draft_slots == 'true')
        shell: bash
        run: |
          set -euo pipefail

          before_index="$RUNNER_TEMP/index.before-draft-slot.html"
          before_projection="$RUNNER_TEMP/draft-slot.before.json"
          had_projection=0

          cp index.html "$before_index"
          if [ -f data/draft_slot_projection.json ]; then
            cp data/draft_slot_projection.json "$before_projection"
            had_projection=1
          fi

          set +e
          output="$(python3 scripts/projections/draft_slot_projection_pipeline.py \
            --write-index \
            --output data/draft_slot_projection.json 2>&1)"
          rc=$?
          set -e

          printf '%s\n' "$output"

          if [ "$rc" -eq 0 ]; then
            echo "status=updated" >> "$GITHUB_OUTPUT"
            echo "Draft-slot projection updated from the just-refreshed Sleeper standings."
            exit 0
          fi

          # Restore the last known-good production projection before deciding
          # whether this is a safe data-timing skip or a real pipeline failure.
          cp "$before_index" index.html
          if [ "$had_projection" -eq 1 ]; then
            cp "$before_projection" data/draft_slot_projection.json
          else
            rm -f data/draft_slot_projection.json
          fi

          # These are intentional fail-closed states from the projection
          # pipeline. They mean "do not update the projection yet", not that
          # the broader source-data refresh should be blocked.
          if printf '%s\n' "$output" | grep -Eq \
            'Rosters do not all have the same number of completed regular-season games|No completed regular-season games yet|Exact standings tie remains after record and total points scored'; then
            echo "::warning::Draft-slot projection skipped safely; last known-good projection preserved."
            echo "status=preserved-last-good" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Any other error is unexpected. Keep the repo restored but fail the
          # refresh so an implementation/source-contract problem cannot be
          # silently swallowed.
          echo "::error::Unexpected draft-slot projection failure."
          exit "$rc"

      - name: Verify refreshed draft-slot projection
        if: steps.draftslot.outputs.status == 'updated'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          projection_path = Path("data/draft_slot_projection.json")
          roster_path = Path("data/league_rosters.json")
          index_path = Path("index.html")

          p = json.loads(projection_path.read_text(encoding="utf-8"))
          index = index_path.read_text(encoding="utf-8")

          assert p["schema_version"] == 1
          assert p["status"] == "projected_from_regular_season_standings"
          assert p["draft_season"] == "2027"

          rule = p["league_rule"]
          assert rule["primary"] == "reverse_regular_season_standings"
          assert rule["tiebreaker"] == "total_points_scored"
          assert rule["playoff_finish_used"] is False
          assert rule["potential_points_used"] is False
          assert rule["current_pick_holder_used_for_slot"] is False
          assert rule["original_roster_id_determines_traded_pick_slot"] is True

          actual_roster_sha = hashlib.sha256(roster_path.read_bytes()).hexdigest()
          assert p["source"]["league_rosters_sha256"] == actual_roster_sha

          standings = p["standings_worst_to_best"]
          assert len(standings) == 12
          assert [r["draft_order_rank"] for r in standings] == list(range(1, 13))
          assert [r["tier"] for r in standings[:4]] == ["early"] * 4
          assert [r["tier"] for r in standings[4:8]] == ["mid"] * 4
          assert [r["tier"] for r in standings[8:]] == ["late"] * 4

          for left, right in zip(standings, standings[1:]):
              # No exact record+PF ties are allowed through the pipeline, so the
              # confirmed league ordering must be strictly increasing here.
              lk = (left["standing_points"], left["points_for"])
              rk = (right["standing_points"], right["points_for"])
              assert lk < rk, (lk, rk)

          expected_date = p["projection_as_of_date"]
          assert (
              f"const DRAFT_SLOT_LAST_UPDATED = '{expected_date}';"
              in index
          )

          m = re.search(
              r"const\s+DRAFT_SLOT_PROJECTION\s*=\s*\{(.*?)\}\s*;",
              index,
              flags=re.DOTALL,
          )
          assert m
          block = m.group(1)
          for rid, tier in p["projection_by_roster_id"].items():
              assert re.search(
                  rf"\b{re.escape(rid)}\s*:\s*['\"]{tier}['\"]",
                  block,
              ), (rid, tier)

          # Preserve reviewed production semantics.
          assert "if(season !== DRAFT_SLOT_APPLIES_TO_SEASON) return 'mid';" in index
          assert "const slot = pickSlotForSeason(t.roster_id, t.season);" in index

          print("PASS: refreshed draft-slot projection matches current Sleeper standings.")
          PY

      - name: Refresh trade history
        run: python3 scripts/sync/sync_trade_history.py

      - name: Set up Python 3.11 for refresh pipelines
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Team refresh self-test
        run: python3 scripts/maintenance/team_field_refresh_pipeline.py --selftest

      - name: Refresh player team fields
        run: python3 scripts/maintenance/team_field_refresh_pipeline.py

      - name: Player-position map self-test
        run: python3 scripts/utilities/generate_player_positions.py --selftest

      - name: Regenerate player-position map
        run: python3 scripts/utilities/generate_player_positions.py

      - name: Sleeper projections self-test
        run: python3 scripts/projections/sleeper_projections_pipeline.py --selftest

      - name: Refresh Sleeper projections
        run: python3 scripts/projections/sleeper_projections_pipeline.py

      - name: Sleeper IDP filter self-test
        run: python3 scripts/projections/filter_sleeper_idp_only.py --selftest

      - name: Refresh Sleeper IDP-only subset
        run: python3 scripts/projections/filter_sleeper_idp_only.py

      - name: FantasyPros pipeline self-test
        run: python3 scripts/projections/fantasypros_api_pipeline.py --selftest

      - name: Refresh FantasyPros projections
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python3 scripts/projections/fantasypros_api_pipeline.py

      - name: Identity resolver self-test
        run: python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest

      - name: Refresh FantasyPros-Sleeper identity crosswalk
        run: python3 scripts/projections/resolve_fantasypros_sleeper_identity.py

      - name: Team Utility lineup projection self-test
        run: python3 scripts/projections/build_team_utility_lineup_projections.py --selftest

      - name: Refresh Team Utility lineup projections
        run: python3 scripts/projections/build_team_utility_lineup_projections.py --write

      - name: Verify Team Utility lineup projection artifact
        run: python3 scripts/projections/build_team_utility_lineup_projections.py --check

      - name: Dual-eligibility self-test
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/validation/dual_eligibility_pipeline.py --selftest

      - name: Refresh dual-eligibility audit
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/validation/dual_eligibility_pipeline.py

      - name: Refresh KTC vote ratings
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/market/ktc_pipeline.py

      - name: KTC voter-balance analysis self-test
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/market/analyze_ktc_voter_balance.py --selftest

      - name: Build KTC voter-balance research analysis
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/market/analyze_ktc_voter_balance.py --write

      - name: Verify KTC voter-balance research analysis
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/market/analyze_ktc_voter_balance.py --check

      - name: Market Value self-test
        run: python3 scripts/market/build_market_value.py --selftest

      - name: Build separate league Market Value
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/market/build_market_value.py --write

      - name: Realized-outcome capture self-test
        run: python3 scripts/validation/capture_realized_outcomes.py --selftest

      - name: Refresh realized 2026 outcomes
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/validation/capture_realized_outcomes.py

      - name: Derived-state self-test
        run: python3 scripts/maintenance/refresh_repo_derived_state.py --selftest

      - name: Refresh deterministic derived state
        run: python3 scripts/maintenance/refresh_repo_derived_state.py --write

      - name: Value uncertainty self-test
        run: python3 scripts/validation/build_value_uncertainty.py --selftest

      - name: Build value uncertainty sensitivity envelopes
        run: python3 scripts/validation/build_value_uncertainty.py --write

      - name: Historical model-capture self-test
        run: python3 scripts/validation/capture_model_history.py --selftest

      - name: Historical evaluator self-test
        run: python3 scripts/validation/evaluate_model_history.py --selftest

      - name: Market-history evaluator self-test
        run: python3 scripts/validation/evaluate_market_history.py --selftest

      - name: Phase 9 prospective evaluator self-test
        if: steps.mode.outputs.mode == 'full'
        run: python3 research/production-v2/production_v2_phase9_prospective_evaluator.py --selftest

      - name: Capture historical model and source evidence
        run: python3 scripts/validation/capture_model_history.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Evaluate historical predictions against realized outcomes
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/validation/evaluate_model_history.py --write

      - name: Evaluate historical predictions against future league market
        if: steps.mode.outputs.mode == 'full'
        run: python3 scripts/validation/evaluate_market_history.py --write

      - name: Evaluate Production V2 Phase 9 prospective calibration
        if: steps.mode.outputs.mode == 'full'
        run: python3 research/production-v2/production_v2_phase9_prospective_evaluator.py --write

      - name: Verify Production V2 Phase 9 evaluation
        if: steps.mode.outputs.mode == 'full'
        run: python3 research/production-v2/production_v2_phase9_prospective_evaluator.py --check

      - name: Stage refreshed data and history
        run: |
          git add data/
          git add index.html
          git add free-agent-board.html
          git add scripts/artifacts/generated/player_positions.json
          git add scripts/artifacts/generated/player_team_refresh.json
          git add scripts/sleeper_2026_projections.json
          git add scripts/artifacts/generated/sleeper_2026_raw_categories.json
          git add scripts/artifacts/generated/sleeper_2026_raw_weekly.json
          git add scripts/sleeper_2026_idp_only.json
          git add scripts/artifacts/generated/fantasypros_api_raw_2026.json
          git add scripts/fantasypros_api_normalized_2026.json
          git add scripts/artifacts/reports/fantasypros_api_pipeline_report.md
          git add scripts/identity_crosswalk.json
          git add scripts/artifacts/reports/identity_collision_report.md
          git add scripts/artifacts/generated/team_utility_lineup_projections.json
          git add scripts/artifacts/reports/team_utility_lineup_projection_report.md
          git add scripts/artifacts/generated/dual_eligibility_results.json
          git add scripts/artifacts/generated/ktc_ratings.json
          if [ -f scripts/artifacts/generated/ktc_voter_balance_analysis.json ]; then
            git add scripts/artifacts/generated/ktc_voter_balance_analysis.json
          fi
          if [ -f scripts/artifacts/reports/ktc_voter_balance_analysis.md ]; then
            git add scripts/artifacts/reports/ktc_voter_balance_analysis.md
          fi
          if [ -f scripts/artifacts/generated/market_values.json ]; then
            git add scripts/artifacts/generated/market_values.json
          fi
          if [ -f scripts/artifacts/reports/market_value_report.md ]; then
            git add scripts/artifacts/reports/market_value_report.md
          fi
          git add scripts/artifacts/generated/value_uncertainty.json
          git add scripts/artifacts/reports/value_uncertainty_report.md
          if [ -f research/model-history/outcomes/2026.json ]; then
            git add research/model-history/outcomes/2026.json
          fi
          git add research/model-history/snapshots/
          if [ -f research/model-history/evaluation/latest.json ]; then
            git add research/model-history/evaluation/latest.json
          fi
          if [ -f research/model-history/evaluation/latest.md ]; then
            git add research/model-history/evaluation/latest.md
          fi
          if [ -f research/model-history/evaluation/market_latest.json ]; then
            git add research/model-history/evaluation/market_latest.json
          fi
          if [ -f research/model-history/evaluation/market_latest.md ]; then
            git add research/model-history/evaluation/market_latest.md
          fi
          if [ -f research/production-v2/production_v2_phase9_evaluation.json ]; then
            git add research/production-v2/production_v2_phase9_evaluation.json
          fi
          if [ -f research/production-v2/production_v2_phase9_evaluation.md ]; then
            git add research/production-v2/production_v2_phase9_evaluation.md
          fi
          git status --short

      - name: Commit and push refreshed data
        shell: bash
        run: |
          git config user.name "trade-desk-refresh-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No refreshed data changed; nothing to commit."
          else
            git commit -m "Automated data refresh (${{ steps.mode.outputs.mode }})"
            git push origin main
          fi
