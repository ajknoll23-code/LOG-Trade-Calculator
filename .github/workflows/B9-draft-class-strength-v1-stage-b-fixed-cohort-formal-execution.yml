name: B9 Draft Class Strength V1 - Stage B Fixed-Cohort Formal Execution

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6_V3_RUN_ID: "36648176714"

jobs:
  formal_stage_b:
    name: B9 final fixed-cohort audit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B9 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2" "numpy==2.3.3"

      - name: Guard exact B8 frozen contract and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-class-strength-v1")
          m=json.loads((D/"b8_manifest.json").read_text())
          p=json.loads((D/"b8_stage_b_fixed_cohort_preregistration.json").read_text())
          x=json.loads((D/"b8_stage_b_execution_contract.json").read_text())

          assert m["decision"]=="PASS_B8_STAGE_B_PREREGISTRATION_FROZEN_B9_EXECUTION_NEXT"
          assert m["next_stage"]=="B9 Stage B fixed-cohort formal execution"
          for name,expected in m["output_hashes"].items():
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          assert p["decision"]=="FREEZE_B8_STAGE_B_FIXED_COHORT_RANK_STRATIFIED_FINAL_AUDIT"
          assert p["finality_policy"]["this_is_final_v1_target_null_audit"] is True
          assert p["years"]==list(range(2010,2024))
          assert p["cohort_contract"]["players_per_class"]==48
          assert p["cohort_contract"]["total_players"]==672
          assert p["cohort_contract"]["outcome_sorting_forbidden"] is True
          assert p["cohort_contract"]["backfill_player_49_if_missing_forbidden"] is True
          assert p["primary_null_contract"]["permutations"]==50000
          assert p["primary_null_contract"]["seed"]==20261003
          assert p["bootstrap_contract"]["replicates"]==10000
          assert p["bootstrap_contract"]["seed"]==20261004
          assert p["power_contract"]["injected_log_effect_sd_grid"]==[0.03,0.05,0.08,0.12]
          assert p["power_contract"]["simulations_per_grid_point"]==2000
          assert p["power_contract"]["seed"]==20261005
          assert p["power_contract"]["economically_relevant_log_sd"]==0.08
          assert p["pass_gate"]["permutation_p_lt"]==0.10
          assert p["pass_gate"]["excess_class_variance_ratio_ge"]==0.30
          assert p["pass_gate"]["excess_ratio_80pct_lower_bound_gt"]==0.0
          assert p["bridge_contract"]["required_for_stage_b_pass"] is True
          assert p["2027_class_scored"] is False
          assert p["production_change_authorized"] is False
          assert x["decision"]=="STAGE_B_EXECUTION_REQUIRES_SEPARATE_B9_WORKFLOW"
          assert x["stage_b_execution_authorized_by_this_workflow"] is False
          print("PASS: exact B8 hashes and final-audit contract guarded.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: repository regression baseline."

      - name: Download exact B6 V3 pre-outcome source artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36648176714
          name: dcs-b6-preoutcome-source
          path: /tmp/b9-b6-source

      - name: Download exact B6 V3 season artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36648176714
          pattern: dcs-b6-season-*
          path: /tmp/b9-b6-seasons
          merge-multiple: true

      - name: Build fixed cohort and perform identity-only resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, unicodedata
          from collections import defaultdict
          from pathlib import Path
          import requests

          ROOT=Path.cwd();D=ROOT/"research/draft-class-strength-v1"
          SRC=Path("/tmp/b9-b6-source");OUT=Path("/tmp/b9");OUT.mkdir(parents=True,exist_ok=True)
          pre=json.loads((D/"b8_stage_b_fixed_cohort_preregistration.json").read_text())
          pop=json.loads((SRC/"population_source_gate.json").read_text())
          YEARS=pre["years"];POSITIONS=set(pre["positions"])
          assert YEARS==list(range(2010,2024))
          assert pop["candidate_years"]==YEARS
          assert pop["primary_positions"]==["QB","RB","WR","TE"]

          def norm(s):
              s=unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode("ascii")
              return re.sub(r"[^a-z0-9]","",s.lower())
          def npos(p):
              p=str(p or "").upper();return "RB" if p=="FB" else p

          by_year=defaultdict(list)
          for r in pop["players"]:
              y=int(r["draft_year"])
              if y in YEARS and npos(r["position"]) in POSITIONS:
                  by_year[y].append(dict(r))

          cohort=[]
          for y in YEARS:
              rows=sorted(by_year[y],key=lambda r:(int(r["draft_pick"]),str(r["stable_id"])))
              assert len(rows)>=48,(y,len(rows))
              for k,r in enumerate(rows[:48],1):
                  cohort.append({**r,"position":npos(r["position"]),"skill_pick_rank":k})
          assert len(cohort)==672

          # Identity-only source: Sleeper player registry. No stats/outcomes are used
          # in this resolution step.
          url="https://api.sleeper.app/v1/players/nfl"
          resp=requests.get(url,timeout=180,headers={"User-Agent":"LOG-DCS-B9-Identity/1.0"})
          resp.raise_for_status(); raw=resp.content; data=resp.json()
          assert isinstance(data,dict) and len(data)>1000
          source_meta={"url":url,"sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw),"record_n":len(data)}

          gsis=defaultdict(set);namepos=defaultdict(set);nameposbirth=defaultdict(set)
          for sid,rec in data.items():
              if not isinstance(rec,dict):continue
              pos=npos(rec.get("position"))
              if pos not in POSITIONS:continue
              g=rec.get("gsis_id") or rec.get("gsis")
              if g:gsis[str(g)].add(str(sid))
              nm=rec.get("full_name") or " ".join(x for x in [rec.get("first_name"),rec.get("last_name")] if x)
              key=(norm(nm),pos)
              if key[0]:namepos[key].add(str(sid))
              bd=str(rec.get("birth_date") or "")[:10]
              if key[0] and bd:nameposbirth[(key[0],pos,bd)].add(str(sid))

          resolutions=[];unresolved=[]
          for r in cohort:
              original=str(r.get("sleeper_id") or "").strip() or None
              resolved=original;method="b6_preoutcome_crosswalk" if original else None
              candidates=set()
              if not resolved and r.get("gsis_id"):
                  candidates=set(gsis.get(str(r["gsis_id"]),set()))
                  if len(candidates)==1:
                      resolved=next(iter(candidates));method="sleeper_registry_exact_gsis"
              if not resolved:
                  bd=str(r.get("birth_date") or "")[:10]
                  nk=(norm(r.get("name")),r["position"],bd)
                  candidates=set(nameposbirth.get(nk,set())) if bd else set()
                  if len(candidates)==1:
                      resolved=next(iter(candidates));method="sleeper_registry_exact_name_position_birth"
              if not resolved:
                  nk=(norm(r.get("name")),r["position"])
                  candidates=set(namepos.get(nk,set()))
                  if len(candidates)==1:
                      resolved=next(iter(candidates));method="sleeper_registry_unique_name_position"
              rr={**r,"resolved_sleeper_id":resolved,"identity_resolution_method":method}
              resolutions.append(rr)
              if not resolved:
                  unresolved.append({
                      "draft_year":r["draft_year"],"draft_pick":r["draft_pick"],"skill_pick_rank":r["skill_pick_rank"],
                      "stable_id":r["stable_id"],"gsis_id":r.get("gsis_id"),"pfr_id":r.get("pfr_id"),
                      "name":r.get("name"),"position":r["position"],"birth_date":r.get("birth_date"),
                      "last_candidate_sleeper_ids":sorted(candidates),
                  })

          out={
              "schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_fixed_cohort_identity_gate",
              "years":YEARS,"cohort_n":len(resolutions),"players_per_class":48,
              "selection":"first 48 NFL-drafted QB/RB/WR/TE by overall NFL draft pick; no outcome sorting",
              "identity_source":source_meta,"resolved_n":len(resolutions)-len(unresolved),"unresolved_n":len(unresolved),
              "unresolved_fraction":len(unresolved)/672,"manual_identity_review_required":bool(unresolved),
              "players":resolutions,"unresolved":unresolved,
              "2027_class_scored":False,"production_change_authorized":False,
          }
          (OUT/"cohort_identity.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({k:out[k] for k in ["cohort_n","resolved_n","unresolved_n","unresolved_fraction","manual_identity_review_required"]},indent=2))
          PY

      - name: Execute frozen Stage B or stop for manual identity review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import importlib.util, json, math, random, statistics
          from collections import defaultdict
          from datetime import date
          from pathlib import Path
          import numpy as np

          ROOT=Path.cwd();D=ROOT/"research/draft-class-strength-v1"
          SD=Path("/tmp/b9-b6-seasons");TMP=Path("/tmp/b9")
          pre=json.loads((D/"b8_stage_b_fixed_cohort_preregistration.json").read_text())
          ident=json.loads((TMP/"cohort_identity.json").read_text())
          old=json.loads((D/"phase0a_initial_realized_target_panel.json").read_text())
          b6panel=json.loads((D/"b6_option_d_historical_target_panel.json").read_text())
          YEARS=pre["years"];PRIMARY=tuple(pre["positions"])

          def write_result(obj):
              (D/"b9_stage_b_result.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
              print(json.dumps(obj,indent=2))

          # B8 requires manual review for any cohort slot that remains unresolved.
          # Do not silently invoke the <=2% imputation branch before that review.
          if ident["unresolved_n"]>0:
              queue={
                  "schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_manual_identity_review_queue",
                  "unresolved_n":ident["unresolved_n"],"unresolved_fraction":ident["unresolved_fraction"],
                  "b8_max_unresolved_fraction_after_manual_review":pre["missing_outcome_contract"]["max_unresolved_fraction_after_manual_review"],
                  "players":ident["unresolved"],"instructions":pre["missing_outcome_contract"]["resolution_sequence"],
                  "outcomes_not_used_to_select_cohort":True,"formal_test_run":False,
                  "2027_class_scored":False,"production_change_authorized":False,
              }
              (D/"b9_manual_identity_review_queue.json").write_text(json.dumps(queue,indent=2,sort_keys=True)+"\n")
              write_result({
                  "schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_stage_b_formal_execution",
                  "decision":"STOP_B9_MANUAL_IDENTITY_REVIEW_REQUIRED_BEFORE_FORMAL_TEST",
                  "fixed_cohort_n":672,"unresolved_n":ident["unresolved_n"],"unresolved_fraction":ident["unresolved_fraction"],
                  "formal_test_run":False,"primary_verdict_frozen":False,"power_run":False,
                  "predictor_source_feasibility_authorized":False,"predictor_fit_performed":False,
                  "2027_class_scored":False,"production_change_authorized":False,
              })
              raise SystemExit(0)

          arts={}
          for s in range(2010,2026):
              p=SD/f"season_{s}.json";assert p.exists(),p
              a=json.loads(p.read_text());assert a["season"]==s and a["provider"]=="Sleeper historical weekly NFL stats"
              assert a["availability_pass"] is True
              arts[s]=a

          v5=json.loads((ROOT/"research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json").read_text())
          bridge=v5["frozen_scale_bridge"];h3=pre["outcome_contract"]
          weights={k:float(v) for k,v in h3["position_weights_primary_subset"].items()}
          ranks={k:int(v) for k,v in h3["replacement_ranks_primary_subset"].items()}
          prod=bridge["production_transform"];base=float(h3["o2_scale"]["base_scale"])
          age_path=ROOT/"scripts/validation/snapshot_values.py"
          spec=importlib.util.spec_from_file_location("dcs_b9_age",age_path);age_mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(age_mod)
          age_cfg={"age_curve":bridge["age_curve"],"qb_post_peak_floor":float(bridge["qb_post_peak_floor"]),"lb_post_peak_decay_power":float(bridge["lb_post_peak_decay_power"])}
          def clamp(v,lo,hi):return max(lo,min(hi,v))
          def sched(s):return 17 if s>=2021 else 16
          def age_sep1(b,s):
              d=date.fromisoformat(str(b)[:10]);a=date(s,9,1);return a.year-d.year-((a.month,a.day)<(d.month,d.day))

          baselines={}
          for s,a in arts.items():
              by=defaultdict(list)
              for sid,r in a["players"].items():
                  p=r.get("season_position")
                  if p not in PRIMARY or int(r["games"])<3:continue
                  by[p].append((float(r["season_total"])/int(r["games"]),sid))
              bb={}
              for p in PRIMARY:
                  arr=sorted(by[p],key=lambda x:(-x[0],x[1]));rank=ranks[p]
                  assert len(arr)>=rank,(s,p,len(arr),rank)
                  bb[p]={"replacement_ppg":arr[rank-1][0],"eligible_n":len(arr)}
              baselines[s]=bb

          players=[]
          for r in ident["players"]:
              y=int(r["draft_year"]);p=r["position"];sid=str(r["resolved_sleeper_id"]);birth=r.get("birth_date")
              assert birth,(y,r["name"],"missing birth")
              annual=[]
              for s in [y,y+1,y+2]:
                  rec=arts[s]["players"].get(sid);games=int(rec["games"]) if rec else 0;total=float(rec["season_total"]) if rec else 0.0
                  denom=float(baselines[s][p]["replacement_ppg"])*sched(s)
                  realized=float(prod["zero_games_override"]) if games==0 else clamp(float(prod["intercept"])+float(prod["slope"])*(total/denom),float(prod["floor"]),float(prod["ceiling"]))
                  age=age_sep1(birth,s);am=float(age_mod.age_multiplier(p,age,"Starter",realized,realized,age_cfg))
                  annual.append(base*weights[p]*am*realized)
              o2=statistics.fmean(annual)
              players.append({**r,"H3_O2":o2,"annual_player_equivalent_fv":annual})
          assert len(players)==672

          # H3.O2 plumbing equivalence against B6 wherever the fixed cohort overlaps
          # B6's saved outcome-sorted top 48. B8 allows <=1% relative difference.
          old_h3={}
          for y in YEARS:
              for r in b6panel["classes"][str(y)]["top48_players"]:
                  old_h3[str(r["stable_id"])]=float(r["H3_O2"])
          compared=[]
          tol=float(pre["registry_identity_contract"]["h3o2_equivalence_check_overlap_tolerance_relative"])
          for r in players:
              sid=str(r["stable_id"])
              if sid not in old_h3:continue
              oldv=old_h3[sid];newv=float(r["H3_O2"])
              rel=abs(newv-oldv)/max(abs(oldv),1.0)
              compared.append(rel)
              assert rel<=tol,(sid,r["name"],oldv,newv,rel)
          assert len(compared)>=200,len(compared)

          by_year=defaultdict(list)
          for r in players:by_year[int(r["draft_year"])].append(r)
          for y in YEARS:
              by_year[y].sort(key=lambda r:int(r["skill_pick_rank"]));assert [int(r["skill_pick_rank"]) for r in by_year[y]]==list(range(1,49))

          matrix=np.array([[float(r["H3_O2"]) for r in by_year[y]] for y in YEARS],dtype=float)
          assert matrix.shape==(14,48)
          totals=matrix.sum(axis=1)
          def log_scores_from_totals(t):
              out=[]
              for i in range(len(t)):
                  loo=(float(t.sum())-float(t[i]))/(len(t)-1)
                  out.append(math.log(float(t[i])/loo))
              return np.array(out,dtype=float)
          scores=log_scores_from_totals(totals);obs=float(np.var(scores,ddof=1))

          # Frozen rank-stratified primary null: independently permute each of the
          # 48 skill-pick-rank columns across the 14 classes.
          B=int(pre["primary_null_contract"]["permutations"]);seed=int(pre["primary_null_contract"]["seed"])
          rng=np.random.default_rng(seed);null=np.empty(B,dtype=float);exceed=0
          work=np.empty_like(matrix)
          for b in range(B):
              for k in range(48):work[:,k]=matrix[rng.permutation(14),k]
              v=float(np.var(log_scores_from_totals(work.sum(axis=1)),ddof=1));null[b]=v
              exceed+=v>=obs
          pval=(exceed+1)/(B+1);nmean=float(null.mean());evr=max(0.0,1.0-nmean/obs) if obs>0 else 0.0

          # Primary bootstrap implementation frozen here per B8: within each fixed
          # class, resample 48 H3.O2 values with replacement, preserving class size 48.
          BR=int(pre["bootstrap_contract"]["replicates"]);brng=np.random.default_rng(int(pre["bootstrap_contract"]["seed"]));brels=np.empty(BR,dtype=float)
          for b in range(BR):
              bt=np.empty(14,dtype=float)
              for i in range(14):bt[i]=matrix[i,brng.integers(0,48,size=48)].sum()
              vv=float(np.var(log_scores_from_totals(bt),ddof=1));brels[b]=max(0.0,1.0-nmean/vv) if vv>0 else 0.0
          brels.sort()
          def q(a,p):return float(a[int(round((len(a)-1)*p))])
          rel80=[q(brels,.10),q(brels,.90)];rel95=[q(brels,.025),q(brels,.975)]

          class_rows={}
          for i,y in enumerate(YEARS):
              rs=by_year[y]
              class_rows[str(y)]={
                  "class_total":float(totals[i]),"class_log_strength":float(scores[i]),"class_multiplier":math.exp(float(scores[i])),
                  "qb_total":sum(float(r["H3_O2"]) for r in rs if r["position"]=="QB"),
                  "nonqb_total":sum(float(r["H3_O2"]) for r in rs if r["position"]!="QB"),
                  "bucket_totals":{
                      "ranks_1_6":sum(float(r["H3_O2"]) for r in rs[0:6]),
                      "ranks_7_12":sum(float(r["H3_O2"]) for r in rs[6:12]),
                      "ranks_13_24":sum(float(r["H3_O2"]) for r in rs[12:24]),
                      "ranks_25_48":sum(float(r["H3_O2"]) for r in rs[24:48]),
                  },
                  "players":[{"skill_pick_rank":r["skill_pick_rank"],"draft_pick":r["draft_pick"],"stable_id":r["stable_id"],"name":r["name"],"position":r["position"],"H3_O2":r["H3_O2"]} for r in rs],
              }

          # Required bridge.
          bridge_years=pre["bridge_contract"]["years"]
          new=[class_rows[str(y)]["class_log_strength"] for y in bridge_years]
          oldv=[old["rows"][str(y)]["overall_log_strength"] for y in bridge_years]
          def pearson(x,y):
              mx,my=statistics.fmean(x),statistics.fmean(y);num=sum((a-mx)*(b-my) for a,b in zip(x,y))
              dx=math.sqrt(sum((a-mx)**2 for a in x));dy=math.sqrt(sum((b-my)**2 for b in y));return num/(dx*dy) if dx and dy else 0.0
          def ranks_fn(a):
              order=sorted(range(len(a)),key=lambda i:(a[i],i));out=[0.0]*len(a);i=0
              while i<len(order):
                  j=i+1
                  while j<len(order) and a[order[j]]==a[order[i]]:j+=1
                  rr=(i+1+j)/2
                  for z in range(i,j):out[order[z]]=rr
                  i=j
              return out
          bp=pearson(new,oldv);bs=pearson(ranks_fn(new),ranks_fn(oldv));sign=sum((a>=0)==(b>=0) for a,b in zip(new,oldv))/len(new)
          bg=pre["bridge_contract"]["supportive_gate"]
          bridge_pass=bs>=float(bg["spearman_ge"]) and bp>=float(bg["pearson_ge"]) and sign>=float(bg["sign_agreement_ge_fraction"])

          gate=pre["pass_gate"]
          signal_pass=(pval<float(gate["permutation_p_lt"]) and evr>=float(gate["excess_class_variance_ratio_ge"]) and rel80[0]>float(gate["excess_ratio_80pct_lower_bound_gt"]))
          primary_pass=signal_pass and bridge_pass

          # Freeze primary verdict before any diagnostic or power analysis.
          primary={
              "schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_stage_b_primary_verdict",
              "fixed_cohort_n":672,"complete_class_n":14,"observed_variance":obs,
              "primary_null":{"permutations":B,"seed":seed,"mean_variance":nmean,"permutation_p_value":pval,"variance_q90":float(np.quantile(null,.90))},
              "excess_class_variance_ratio":evr,"bootstrap":{"replicates":BR,"seed":int(pre["bootstrap_contract"]["seed"]),"interval_80":rel80,"interval_95":rel95,
              "implementation":"within each fixed class, resample 48 H3.O2 values with replacement; preserve class size 48"},
              "signal_gate_pass":signal_pass,
              "bridge":{"years":bridge_years,"new_fixed_cohort_log_strength":dict(zip(map(str,bridge_years),new)),"old_sf_cell_log_strength":dict(zip(map(str,bridge_years),oldv)),"spearman":bs,"pearson":bp,"sign_agreement":sign,"supportive":bridge_pass},
              "primary_stage_b_pass":primary_pass,"identity_equivalence_compared_n":len(compared),"identity_equivalence_max_relative_difference":max(compared) if compared else None,
              "predictor_fit_performed":False,"2027_class_scored":False,"production_change_authorized":False,
          }
          (D/"b9_stage_b_primary_verdict.json").write_text(json.dumps(primary,indent=2,sort_keys=True)+"\n")
          (D/"b9_fixed_cohort_h3o2_panel.json").write_text(json.dumps({"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_fixed_cohort_h3o2_panel","years":YEARS,"classes":class_rows,"2027_class_scored":False,"production_change_authorized":False},indent=2,sort_keys=True)+"\n")

          # Power analysis. B8 requires 2,000 simulations at each effect SD and s=0
          # false-pass reporting. For computational tractability, each simulated test
          # uses the frozen observed Stage B null mean/q90 as calibration plus 100
          # within-class bootstrap replicates to apply the same three signal concepts.
          pcfg=pre["power_contract"];prng=np.random.default_rng(int(pcfg["seed"]));levels=[0.0]+[float(x) for x in pcfg["injected_log_effect_sd_grid"]]
          q90=float(np.quantile(null,.90));inner_boot=100;power={}
          for s in levels:
              passed=0;N=int(pcfg["simulations_per_grid_point"])
              for sim in range(N):
                  base_m=np.empty_like(matrix)
                  for k in range(48):base_m[:,k]=matrix[prng.permutation(14),k]
                  theta=prng.normal(0.0,s,size=14);theta=theta-theta.mean();sm=base_m*np.exp(theta[:,None])
                  sv=float(np.var(log_scores_from_totals(sm.sum(axis=1)),ddof=1))
                  sp=(sv>q90)
                  sevr=max(0.0,1.0-nmean/sv) if sv>0 else 0.0
                  bvals=[]
                  for _ in range(inner_boot):
                      bt=np.empty(14,dtype=float)
                      for i in range(14):bt[i]=sm[i,prng.integers(0,48,size=48)].sum()
                      vv=float(np.var(log_scores_from_totals(bt),ddof=1));bvals.append(max(0.0,1.0-nmean/vv) if vv>0 else 0.0)
                  bvals.sort();lower80=float(bvals[int(round((inner_boot-1)*.10))])
                  if sp and sevr>=float(gate["excess_class_variance_ratio_ge"]) and lower80>float(gate["excess_ratio_80pct_lower_bound_gt"]):passed+=1
              power[str(s)]={"simulations":N,"pass_rate":passed/N,"inner_bootstrap_replicates":inner_boot}
          adequate=power[str(float(pcfg["economically_relevant_log_sd"]))]["pass_rate"]>=float(pcfg["adequate_power_threshold"])
          mde=None
          for s in [float(x) for x in pcfg["injected_log_effect_sd_grid"]]:
              if power[str(s)]["pass_rate"]>=float(pcfg["adequate_power_threshold"]):mde=s;break
          power_result={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_stage_b_power","seed":int(pcfg["seed"]),"simulation_base":"rank-stratified null-generated data","calibration":"frozen observed Stage B primary null q90 and mean variance","levels":power,"false_pass_rate_s0":power["0.0"]["pass_rate"],"economically_relevant_log_sd":float(pcfg["economically_relevant_log_sd"]),"adequate_power_at_0_08":adequate,"minimum_grid_log_sd_at_80pct_power":mde,"power_does_not_rescue_primary_failure":True,"2027_class_scored":False,"production_change_authorized":False}
          (D/"b9_stage_b_power.json").write_text(json.dumps(power_result,indent=2,sort_keys=True)+"\n")

          # Non-gating diagnostics only after primary verdict is frozen.
          drng=np.random.default_rng(20261006)
          # leave-2017-out
          idx=[i for i,y in enumerate(YEARS) if y!=2017];lm=matrix[idx,:];lt=lm.sum(axis=1);lobs=float(np.var(log_scores_from_totals(lt),ddof=1));ln=[]
          for _ in range(10000):
              w=np.empty_like(lm)
              for k in range(48):w[:,k]=lm[drng.permutation(len(idx)),k]
              ln.append(float(np.var(log_scores_from_totals(w.sum(axis=1)),ddof=1)))
          lp=(sum(v>=lobs for v in ln)+1)/(len(ln)+1)

          # Era-block rank null: permute each rank within 2010-16 and 2017-23 separately.
          eb=[]
          blocks=[np.arange(0,7),np.arange(7,14)]
          for _ in range(10000):
              w=np.empty_like(matrix)
              for k in range(48):
                  for block in blocks:w[block,k]=matrix[block[drng.permutation(len(block))],k]
              eb.append(float(np.var(log_scores_from_totals(w.sum(axis=1)),ddof=1)))
          ebp=(sum(v>=obs for v in eb)+1)/(len(eb)+1)

          # Position x broad skill-rank-bin permutation preserving each cell's position/bin.
          bins=[(0,6),(6,12),(12,24),(24,48)];px=[];posmat=np.array([[r["position"] for r in by_year[y]] for y in YEARS],dtype=object)
          cells=defaultdict(list)
          for bi,(lo,hi) in enumerate(bins):
              for i in range(14):
                  for k in range(lo,hi):cells[(posmat[i,k],bi)].append((i,k))
          for _ in range(10000):
              w=matrix.copy()
              for key,locs in cells.items():
                  vals=np.array([matrix[i,k] for i,k in locs]);vals=vals[drng.permutation(len(vals))]
                  for z,(i,k) in enumerate(locs):w[i,k]=vals[z]
              px.append(float(np.var(log_scores_from_totals(w.sum(axis=1)),ddof=1)))
          pxp=(sum(v>=obs for v in px)+1)/(len(px)+1)

          diagnostics={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_non_gating_diagnostics","gating_authority":False,
              "bucket_and_position_totals":{y:{"bucket_totals":class_rows[y]["bucket_totals"],"qb_total":class_rows[y]["qb_total"],"nonqb_total":class_rows[y]["nonqb_total"]} for y in class_rows},
              "leave_2017_out":{"observed_variance":lobs,"permutations":10000,"p_value":lp},
              "era_block_rank_null":{"permutations":10000,"p_value":ebp},
              "position_x_rank_bin_null":{"permutations":10000,"p_value":pxp,"bins":["1-6","7-12","13-24","25-48"]},
              "not_run":{"outcome_sorted_top48_of_first72":"Not required for primary verdict; would require expanding identity resolution beyond the frozen 672-player cohort.","uncapped_three_year_vorp":"B8 named this diagnostic but did not freeze a sufficiently exact formula; inventing it after B6/B7 would add researcher degrees of freedom."},
              "diagnostics_cannot_change_primary_verdict":True,"2027_class_scored":False,"production_change_authorized":False}
          (D/"b9_non_gating_diagnostics.json").write_text(json.dumps(diagnostics,indent=2,sort_keys=True)+"\n")

          if primary_pass:
              decision="PASS_B9_STAGE_B_AUTHORIZE_PREDICTOR_SOURCE_FEASIBILITY_ONLY"
              auth=True
          elif adequate:
              decision="STOP_B9_PERMANENT_CLOSE_ADEQUATELY_POWERED_NEGATIVE_NEUTRAL_1_00"
              auth=False
          else:
              decision="STOP_B9_CLOSE_UNDERPOWERED_NEUTRAL_1_00_REVISIT_ONLY_AFTER_2024_2026_MATURE"
              auth=False

          final={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_stage_b_formal_execution","decision":decision,
              "fixed_cohort_n":672,"complete_class_n":14,"formal_test_run":True,"primary_stage_b_pass":primary_pass,
              "permutation_p_value":pval,"excess_class_variance_ratio":evr,"excess_ratio_80pct_interval":rel80,
              "bridge_supportive":bridge_pass,"bridge_spearman":bs,"bridge_pearson":bp,"bridge_sign_agreement":sign,
              "adequate_power_at_log_sd_0_08":adequate,"predictor_source_feasibility_authorized":auth,
              "predictor_fit_performed":False,"2027_features_read":False,"2027_class_scored":False,"production_change_authorized":False,
              "finality_policy_applied":True}
          write_result(final)
          PY

      - name: Freeze B9 manifest and validate finality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          D=Path("research/draft-class-strength-v1")
          r=json.loads((D/"b9_stage_b_result.json").read_text())
          assert r["2027_class_scored"] is False and r["production_change_authorized"] is False and r["predictor_fit_performed"] is False

          names=["b9_stage_b_result.json"]
          if r["formal_test_run"]:
              names += ["b9_stage_b_primary_verdict.json","b9_fixed_cohort_h3o2_panel.json","b9_stage_b_power.json","b9_non_gating_diagnostics.json"]
              p=json.loads((D/"b9_stage_b_primary_verdict.json").read_text())
              assert p["fixed_cohort_n"]==672 and p["complete_class_n"]==14
              assert p["primary_null"]["permutations"]==50000 and p["primary_null"]["seed"]==20261003
              assert p["bootstrap"]["replicates"]==10000 and p["bootstrap"]["seed"]==20261004
              assert p["production_change_authorized"] is False
              if r["primary_stage_b_pass"]:
                  assert r["decision"]=="PASS_B9_STAGE_B_AUTHORIZE_PREDICTOR_SOURCE_FEASIBILITY_ONLY"
                  assert r["predictor_source_feasibility_authorized"] is True
              else:
                  assert r["predictor_source_feasibility_authorized"] is False
                  assert r["decision"].startswith("STOP_B9_")
          else:
              assert r["decision"]=="STOP_B9_MANUAL_IDENTITY_REVIEW_REQUIRED_BEFORE_FORMAL_TEST"
              names += ["b9_manual_identity_review_queue.json"]

          m={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b9_manifest","decision":r["decision"],
             "output_hashes":{n:hashlib.sha256((D/n).read_bytes()).hexdigest() for n in names},
             "formal_test_run":r["formal_test_run"],"primary_stage_b_pass":r.get("primary_stage_b_pass"),
             "predictor_source_feasibility_authorized":r["predictor_source_feasibility_authorized"],
             "predictor_fit_performed":False,"2027_class_scored":False,"production_change_authorized":False}
          (D/"b9_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")

          all_text="\n".join(p.read_text(errors="ignore") for p in D.glob("b9_*") if p.is_file()).lower()
          assert '"predictor_fit_performed": true' not in all_text
          assert '"2027_class_scored": true' not in all_text
          assert '"production_change_authorized": true' not in all_text
          print("PASS: B9 result/manifest frozen; production and 2027 remain untouched.")
          PY

      - name: Run post-analysis repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          echo "PASS: post-analysis repository regression."

      - name: Prove B9 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          raw=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all"],text=True)
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(p.startswith("research/draft-class-strength-v1/b9_") for p in touched),touched
          assert not any(p.startswith(("model/","scripts/","data/",".github/")) for p in touched),touched
          assert "index.html" not in touched and "free-agent-board.html" not in touched
          print("PASS: B9 mutation scope is research-only.")
          PY

      - name: Commit frozen B9 final-audit artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo "ERROR: origin/main moved during B9."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-class-strength-v1/b9_*.json
          if git diff --cached --quiet; then echo "PASS: B9 artifacts already match; no commit required."; exit 0; fi
          git commit -m "Run Draft Class Strength V1 B9 final fixed-cohort audit"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: B9 final-audit artifacts committed."
