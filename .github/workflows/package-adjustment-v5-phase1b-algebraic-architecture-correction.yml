name: Package Adjustment V5 - Phase 1B Algebraic Architecture Correction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  correct-before-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact predevelopment state
        shell: bash
        run: |
          set -euo pipefail
          V5="research/package-adjustment-v5-liquid-picks"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V5/phase1_structural_preregistration.json")" = "97f4da97d35594c658ce7252fb5a0bf0e7a2a188"
          test "$(git hash-object "$V5/phase1_manifest.json")" = "cda5cf9bc10e90c9bd3920ab3907843fc272a4ad"
          test "$(git hash-object "$V5/phase1a_predevelopment_clarification.json")" = "e7ba03b32256137a7c3f9bd3a0131ebe0b99a687"

          test ! -e "$V5/phase1b_predevelopment_architecture_correction.json"
          test ! -e "$V5/phase2_development_results.json"
          test ! -e "$V5/phase2_manifest.json"
          test ! -e "$V5/frozen_candidate.json"

      - name: Verify production remains V1.6
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove original V5 formula has predevelopment invariant conflict
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "research/package-adjustment-v5-liquid-picks/"
              "phase1_structural_preregistration.json"
          )
          d = json.loads(p.read_text())
          candidates = d["candidate_grid"]["candidates"]
          assert len(candidates) == 12

          def old_score(side, c):
              side = sorted(side, key=lambda a: a["fv"], reverse=True)
              vals = [float(a["fv"]) for a in side]
              total = sum(vals)
              v1 = vals[0]
              e = max(0.0, min(1.0, v1 / 10000.0))

              top = side[0]
              top_coeff = 0.75 * (
                  float(c["top_pick_stud_scale"])
                  if top["kind"] == "pick" else 1.0
              )

              penalty = 0.0
              if len(side) >= 2:
                  a = side[1]
                  scale = (
                      float(c["pick_fragmentation_scale"])
                      if a["kind"] == "pick" else 1.0
                  )
                  penalty += 0.10 * scale * float(a["fv"])

              for a in side[2:]:
                  scale = (
                      float(c["pick_fragmentation_scale"])
                      if a["kind"] == "pick" else 1.0
                  )
                  penalty += 0.30 * scale * float(a["fv"])

              return total + e * (top_coeff * v1 - penalty)

          unsafe = []
          safe = []

          # Deterministic rank-crossing proof:
          # hold a player at 6000 and raise a pick from 5999 to 6001.
          # A monotone formula must never reduce side score when the pick's FV rises.
          before = [
              {"kind": "player", "fv": 6000.0},
              {"kind": "pick", "fv": 5999.0},
              {"kind": "player", "fv": 2500.0},
          ]
          after = [
              {"kind": "player", "fv": 6000.0},
              {"kind": "pick", "fv": 6001.0},
              {"kind": "player", "fv": 2500.0},
          ]

          for c in candidates:
              b = old_score(before, c)
              a = old_score(after, c)
              if a + 1e-12 < b:
                  unsafe.append({
                      "id": c["id"],
                      "before_score": b,
                      "after_score": a,
                      "drop_when_pick_value_increases": b - a,
                  })
              else:
                  safe.append(c["id"])

          # Any type-specific role coefficient can create a crossover discontinuity.
          # On this frozen grid, only the fully type-neutral V4-equivalent point is safe.
          assert len(unsafe) == 11, (len(unsafe), unsafe)
          assert safe == ["liquid-picks-pf100-ts100"], safe

          print("PASS: algebraic invariant conflict reproduced before development.")
          print("UNSAFE_CANDIDATES=11")
          print("ONLY_ROLE_NEUTRAL_CANDIDATE=liquid-picks-pf100-ts100")
          PY

      - name: Freeze corrected continuous liquid-pick architecture
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          v5 = Path("research/package-adjustment-v5-liquid-picks")
          p1 = v5 / "phase1_structural_preregistration.json"
          p1a = v5 / "phase1a_predevelopment_clarification.json"
          out = v5 / "phase1b_predevelopment_architecture_correction.json"

          prereg = json.loads(p1.read_text())
          clarification = json.loads(p1a.read_text())

          assert prereg["status"] == "FROZEN_BEFORE_SPENT_V4_DEVELOPMENT"
          assert clarification["status"] == "FROZEN_PREDEVELOPMENT_CLARIFICATION"
          assert clarification["v4_exact_600_outcomes_analyzed_by_this_phase"] is False

          liquidity_grid = [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40]
          candidates = [
              {
                  "id": f"liquid-credit-l{int(round(value * 100)):02d}",
                  "base_v4_candidate": "elite-frag-s75-p210-p330",
                  "pick_liquidity_credit": value,
              }
              for value in liquidity_grid
          ]

          correction = {
              "schema_version": 1,
              "study_id": "package-adjustment-v5-liquid-picks",
              "phase": "1B",
              "status": "FROZEN_ALGEBRAIC_CORRECTION_BEFORE_SPENT_EVIDENCE",
              "frozen": True,
              "frozen_at_utc": datetime.now(timezone.utc).isoformat(),
              "research_only": True,
              "production_change_authorized": False,
              "spent_v4_ballots_read_by_this_phase": False,
              "v4_individual_outcomes_analyzed_by_this_phase": False,
              "why_phase1_grid_is_superseded": {
                  "type": "algebraic_hard_invariant_conflict",
                  "discovered_before_phase2_development": True,
                  "not_discovered_from_v4_ballot_outcomes": True,
                  "original_candidate_count": 12,
                  "original_candidates_violating_rank_crossing_monotonicity": 11,
                  "only_original_candidate_not_invalidated": "liquid-picks-pf100-ts100",
                  "only_original_candidate_is_exact_v4_s75": True,
                  "scientific_implication": (
                      "The original grid cannot test the liquid-pick hypothesis "
                      "without violating the already-frozen monotonicity/continuity "
                      "contract. Running Phase 2 on that grid would knowingly create "
                      "a structurally doomed study."
                  ),
              },
              "authoritative_v5_architecture_for_phase2_and_later": {
                  "name": "continuous liquid-pick credit",
                  "base_player_only_model": "elite-frag-s75-p210-p330",
                  "base_v4_premium": (
                      "P_base = clamp(v1/10000,0,1) * "
                      "(0.75*v1 - 0.10*v2 - 0.30*sum(v3+))"
                  ),
                  "pick_value_sum": "PICKS = sum(FV_i for every draft pick on the side)",
                  "pick_liquidity_credit": (
                      "P_liquid = lambda * clamp(v1/10000,0,1) * PICKS"
                  ),
                  "side_effective_score": "E = total_FV + P_base + P_liquid",
                  "trade_score_delta": "(E_A-E_B)/(abs(E_A)+abs(E_B))",
                  "why_continuous": (
                      "The type-specific term depends on the continuous sum of pick "
                      "value, not on whether a pick occupies rank 1, rank 2, or the "
                      "tail. Rank crossings therefore do not change a pick-specific "
                      "coefficient discontinuously."
                  ),
                  "players_only_exact_v4_s75_equivalence": True,
                  "one_v_one_display_adjustment_remains_zero": True,
              },
              "corrected_candidate_grid": {
                  "pick_liquidity_credit_values": liquidity_grid,
                  "candidate_count": len(candidates),
                  "candidates": candidates,
                  "v4_s75_lambda_zero_retained_as_reference_not_candidate": True,
                  "no_continuous_parameter_optimization": True,
                  "no_topology_specific_parameters": True,
                  "no_rank_specific_pick_parameters": True,
                  "players_only_formula_frozen_to_v4_s75": True,
              },
              "hard_invariants_retained": prereg["hard_invariants"],
              "phase2_development_contract_retained_with_only_candidate_grid_and_formula_superseded": {
                  "cross_validation": prereg[
                      "phase2_spent_v4_development_plan"
                  ]["cross_validation"],
                  "calibration": prereg[
                      "phase2_spent_v4_development_plan"
                  ]["calibration"],
                  "controls": prereg[
                      "phase2_spent_v4_development_plan"
                  ]["controls"],
                  "development_nomination_gates": prereg[
                      "phase2_spent_v4_development_plan"
                  ]["development_nomination_gates"],
                  "near_tie_rule": prereg[
                      "phase2_spent_v4_development_plan"
                  ]["near_tie_rule"],
                  "if_no_candidate_passes": prereg[
                      "phase2_spent_v4_development_plan"
                  ]["if_no_candidate_passes"],
                  "phase1a_structural_score_equivalence_clarification_applies": True,
              },
              "fresh_confirmation_contract_retained_exactly": prereg[
                  "fresh_confirmation_contract_if_candidate_frozen"
              ],
              "asset_eligibility_retained_exactly": prereg["asset_eligibility"],
              "governance": {
                  "this_correction_must_be_frozen_before_any_phase2_run": True,
                  "original_phase1_candidate_grid_may_not_be_evaluated": True,
                  "corrected_grid_may_not_be_expanded_after_phase2_outcomes": True,
                  "v4_exact_600_remains_spent_development_evidence_only": True,
                  "fresh_confirmation_required_for_any_v5_candidate": True,
                  "production_remains_v1_6": True,
              },
              "source_fingerprints": {
                  "phase1_preregistration_sha256": hashlib.sha256(
                      p1.read_bytes()
                  ).hexdigest(),
                  "phase1a_clarification_sha256": hashlib.sha256(
                      p1a.read_bytes()
                  ).hexdigest(),
              },
          }

          out.write_text(
              json.dumps(correction, indent=2, sort_keys=True) + "\n"
          )

          print("V5_PHASE1B_STATUS=FROZEN_ALGEBRAIC_CORRECTION_BEFORE_SPENT_EVIDENCE")
          print("V5_CORRECTED_CANDIDATE_COUNT=7")
          PY

      - name: Verify corrected architecture and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "research/package-adjustment-v5-liquid-picks/"
              "phase1b_predevelopment_architecture_correction.json"
          )
          d = json.loads(p.read_text())

          assert d["status"] == "FROZEN_ALGEBRAIC_CORRECTION_BEFORE_SPENT_EVIDENCE"
          assert d["frozen"] is True
          assert d["production_change_authorized"] is False
          assert d["spent_v4_ballots_read_by_this_phase"] is False
          assert d["v4_individual_outcomes_analyzed_by_this_phase"] is False

          why = d["why_phase1_grid_is_superseded"]
          assert why["discovered_before_phase2_development"] is True
          assert why["not_discovered_from_v4_ballot_outcomes"] is True
          assert why["original_candidates_violating_rank_crossing_monotonicity"] == 11
          assert why["only_original_candidate_is_exact_v4_s75"] is True

          grid = d["corrected_candidate_grid"]
          assert grid["candidate_count"] == 7
          assert grid["pick_liquidity_credit_values"] == [
              0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40
          ]
          assert grid["no_continuous_parameter_optimization"] is True
          assert grid["no_topology_specific_parameters"] is True
          assert grid["no_rank_specific_pick_parameters"] is True
          assert grid["players_only_formula_frozen_to_v4_s75"] is True

          retained = d[
              "phase2_development_contract_retained_with_only_candidate_grid_and_formula_superseded"
          ]
          gates = retained["development_nomination_gates"]
          assert gates["minimum_improvement_vs_raw_control"] == 0.005
          assert gates["maximum_overall_log_loss_increase_vs_v4_s75"] == 0.005
          assert gates["minimum_positive_folds_vs_raw"] == 3
          assert gates["maximum_topology_x_asset_mix_regression_vs_raw"] == 0.02
          assert gates[
              "three_v_three_includes_picks_regression_vs_raw_must_be_at_most"
          ] == 0.02
          assert retained["near_tie_rule"] == {
              "maximum_candidates_frozen": 2,
              "threshold_mean_log_loss": 0.001,
          }

          fresh = d["fresh_confirmation_contract_retained_exactly"]
          assert fresh["new_vote_namespace"] == "__pkgv5c1__"
          assert fresh["challenge_count"] == 240
          assert fresh["evaluation"]["deployment_gates"][
              "maximum_topology_x_asset_mix_log_loss_regression_vs_raw"
          ] == 0.03

          print(
              "PASS: corrected V5 architecture frozen before spent-evidence "
              "development; all scientific gates retained."
          )
          PY

      - name: Run repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after correction
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed V5 Phase 1B workflow
        run: git rm .github/workflows/package-adjustment-v5-phase1b-algebraic-architecture-correction.yml

      - name: Stage exact Phase 1B scope
        shell: bash
        run: |
          set -euo pipefail

          git add research/package-adjustment-v5-liquid-picks/phase1b_predevelopment_architecture_correction.json
          git diff --cached --check

          python3 - <<'PY'
          import subprocess
          expected = {
              "research/package-adjustment-v5-liquid-picks/phase1b_predevelopment_architecture_correction.json",
              ".github/workflows/package-adjustment-v5-phase1b-algebraic-architecture-correction.yml",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise RuntimeError(
                  f"Unexpected V5 Phase 1B scope: {sorted(changed)}"
              )
          print("PASS: exact two-file V5 Phase 1B scope staged.")
          PY

      - name: Commit frozen V5 algebraic correction
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Correct Package Adjustment V5 architecture before development"
          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-v5-liquid-picks/phase1_structural_preregistration.json)" = "97f4da97d35594c658ce7252fb5a0bf0e7a2a188"
          test "$(git hash-object research/package-adjustment-v5-liquid-picks/phase1a_predevelopment_clarification.json)" = "e7ba03b32256137a7c3f9bd3a0131ebe0b99a687"
          test ! -e .github/workflows/package-adjustment-v5-phase1b-algebraic-architecture-correction.yml

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          echo "V5_PHASE1B_STATUS=FROZEN_ALGEBRAIC_CORRECTION_BEFORE_SPENT_EVIDENCE"
          echo "V5_CORRECTED_CANDIDATE_COUNT=7"
          git log --oneline -1
