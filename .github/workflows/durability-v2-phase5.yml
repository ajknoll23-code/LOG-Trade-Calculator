name: Durability V2 Phase 5 Prospective

# Research-only prospective evaluation of frozen durability candidates.
# The first successful run freezes the preseason availability predictions.
# Later runs preserve that exact freeze and collect 2026 evidence.
#
# No deployed durability, Production V2, Age Curve V2, Opportunity V2,
# No-History V2, Market Value, or player value is changed.
on:
  workflow_dispatch:
  schedule:
    # After Tuesday full refresh and the other prospective research evaluators.
    - cron: '0 18 * * 2'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Phase 5 self-test
        run: python3 research/durability-v2/durability_v2_phase5_prospective_evaluator.py --selftest

      - name: Freeze preseason durability candidates if needed and evaluate
        run: python3 research/durability-v2/durability_v2_phase5_prospective_evaluator.py --freeze --write

      - name: Verify frozen candidates and prospective outputs
        run: python3 research/durability-v2/durability_v2_phase5_prospective_evaluator.py --check

      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/durability-v2/durability_v2_phase5_frozen_candidates.json
          git add research/durability-v2/durability_v2_phase5_evaluation.json
          git add research/durability-v2/durability_v2_phase5_evaluation.md
          git diff --staged --quiet || git commit -m "Update Durability V2 Phase 5 prospective research"
          git push
