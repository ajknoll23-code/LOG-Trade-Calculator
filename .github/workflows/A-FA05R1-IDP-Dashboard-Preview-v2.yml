        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          git add -- free-agent-board.html assets/idp_opportunity_v1.js assets/idp_opportunity_v1.css scripts/utilities/install_idp_dashboard_v1.py
          git diff --cached --check
          if git diff --cached --quiet; then
