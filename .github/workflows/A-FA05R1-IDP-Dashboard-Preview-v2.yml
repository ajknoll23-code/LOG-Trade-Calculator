name: A-FA05R1 - IDP Opportunity Dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview validates additive UI changes; Apply commits dashboard UI only
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

