name: A-NL01R4 - LOOG PDF Newsletter (LOG branded, no unrostered section)
run-name: A-NL01R4 ${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'scheduled' }} PDF newsletter

on:
  schedule:
    - cron: '0 8 * * 2'
      timezone: 'America/Phoenix'
    - cron: '0 8 * * 4'
      timezone: 'America/Phoenix'
  workflow_dispatch:
    inputs:
      edition:
        description: 'pre=Thursday Weekly War Room; post=Tuesday Aftermath'
        required: true
        type: choice
        options: [pre, post]
        default: pre
      week:
        description: 'NFL week (1-18); blank uses current Sleeper week'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  newsletter-pdf:
    name: Safe verified PDF newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve edition/week
        id: control
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_EDITION: ${{ inputs.edition }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          week="$INPUT_WEEK"
          if [ "$EVENT_NAME" = 'schedule' ]; then
            case "$SCHEDULE" in
              '0 8 * * 2') edition=post ;;
              '0 8 * * 4') edition=pre ;;
              *) echo '::error::Unknown schedule'; exit 1 ;;
            esac
            week=''
          else
            edition="$INPUT_EDITION"
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"

      - name: Render LOG-styled newsletter HTML/TXT/JSON
        shell: bash
        env:
          NEWS_EDITION: ${{ steps.control.outputs.edition }}
          NEWS_WEEK: ${{ steps.control.outputs.week }}
        run: |
          set -euo pipefail
          mkdir -p out/newsletters
          echo 'This workflow expects the repository newsletter engine to render LOG-styled output with the same LOG logo path as the site and without the Unrostered section.'
          python3 scripts/newsletters/league_newsletter.py --edition "$NEWS_EDITION" ${NEWS_WEEK:+--week "$NEWS_WEEK"} --output-dir out/newsletters
          python3 - <<'PY'
          import json
          from pathlib import Path
          docs=list(Path('out/newsletters').glob('*.json'))
          assert len(docs)==1, docs
          d=json.loads(docs[0].read_text(encoding='utf-8'))
          assert len(d['games']) == 6
          ids=[x[k] for x in d['games'] for k in ('a','b')]
          assert len(set(ids)) == 12
          html_files=list(Path('out/newsletters').glob('*.html'))
          assert len(html_files)==1
          html=html_files[0].read_text(encoding='utf-8')
          assert 'Unrostered players to investigate' not in html
          print('PASS: newsletter contract satisfied')
          PY

      - name: Convert HTML to PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = next(Path('out/newsletters').glob('*.html'))
          pdf = html.with_suffix('.pdf')
          # Placeholder generation contract for repo-integrated renderer.
          # In practice this step should use the repo's standard HTML->PDF renderer.
          # We intentionally fail loudly if PDF not created by renderer integration.
          if not pdf.exists():
              raise SystemExit('Expected integrated PDF renderer to create a PDF alongside the HTML output.')
          print(f'PDF OK: {pdf}')
          PY

      - name: Upload PDF newsletter artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOOG-newsletter-pdf-${{ steps.control.outputs.edition }}-${{ github.run_id }}
          path: out/newsletters/
          if-no-files-found: error
          retention-days: 90
