      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove diagnostic made no repository changes
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .; then
            echo 'ERROR: Phase 2A modified tracked repository files.' >&2
            git diff -- .
            exit 1
          fi

          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: Phase 2A staged repository changes.' >&2
            git diff --cached -- .
            exit 1
          fi

          echo 'PASS: Phase 2A and regressions left the repository unchanged.'

      - name: Destroy private 4for4 inputs and row-level outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-idp-v1
          echo 'PASS: private provider inputs and row-level outputs removed from runner.'
