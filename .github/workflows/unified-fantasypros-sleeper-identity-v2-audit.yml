name: Unified FantasyPros-Sleeper Identity V2 Audit

# Research-only audit. This deliberately does NOT replace
# scripts/identity_crosswalk.json. It evaluates a unified offense + IDP
# stable-ID resolver before any production promotion.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: unified-fantasypros-sleeper-identity-v2-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test unified resolver
        run: python3 research/identity-v2/unified_fantasypros_sleeper_identity_v2.py --selftest

      - name: Run unified identity V2 audit
        run: python3 research/identity-v2/unified_fantasypros_sleeper_identity_v2.py

      - name: Research-only mutation safety check
        shell: bash
        run: |
          allowed="$(printf '%s\n' \
            research/identity-v2/unified_fantasypros_sleeper_identity_v2.json \
            research/identity-v2/unified_fantasypros_sleeper_identity_v2.md)"

          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sed '/^$/d' | sort -u)"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sort -u))"

          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by research-only identity audit:"
            echo "$unexpected"
            exit 1
          fi

          git add \
            research/identity-v2/unified_fantasypros_sleeper_identity_v2.json \
            research/identity-v2/unified_fantasypros_sleeper_identity_v2.md

          git diff --cached --check

          staged="$(git diff --cached --name-only | sort -u)"
          unexpected_staged="$(comm -23 <(printf '%s\n' "$staged") <(printf '%s\n' "$allowed" | sort -u))"
          if [ -n "$unexpected_staged" ]; then
            echo "Unexpected files staged:"
            echo "$unexpected_staged"
            exit 1
          fi

      - name: Commit audit results
        shell: bash
        run: |
          git config user.name "identity-v2-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No audit-output changes to commit."
          else
            git commit -m "Audit unified FantasyPros-Sleeper identity V2"
            git push origin main
          fi
