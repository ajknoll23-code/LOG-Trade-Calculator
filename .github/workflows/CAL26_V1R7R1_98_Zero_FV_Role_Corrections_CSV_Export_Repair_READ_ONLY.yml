name: CAL26 V1R7R1 - 98 Price Neutral Week6 Role Corrections CSV Export Repair READ ONLY

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r7r1-readonly-role-release-candidate
  cancel-in-progress: false

jobs:
  build_price_neutral_roles:
    name: Stage 98 roles and verify 565 live FV parity - no production writes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout canonical current Trade Calculator read only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact green V1R6 565-player role/FV evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/cal26-v1r7-source"
          gh run download 39645378760 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R6-Week6-Stable-Roles-Exact-FV-Shadow-READ-ONLY \
            --dir "${{ runner.temp }}/cal26-v1r7-source"
          test -f "${{ runner.temp }}/cal26-v1r7-source/CAL26_V1R6_Manifest.json"
          test -f "${{ runner.temp }}/cal26-v1r7-source/CAL26_V1R6_All_565_Role_to_Live_FV_Impact.csv"
      - name: Materialize isolated production-parity candidate builder
        shell: bash
        run: |
          set -euo pipefail
          cat > "${{ runner.temp }}/cal26_v1r7_role_candidate.py" <<'PY_CAL26_V1R7'
          #!/usr/bin/env python3
          """CAL26 V1R7: stage 98 repeatedly-supported, exactly zero-FV impact role-only edits.
          No repository writes. Uses pinned V1R6 green evidence, exact current calculator FV evaluator,
          canonical free agent sync. Price-moving roles are held, not silently capped.
          """
          from __future__ import annotations
          import argparse, collections, copy, csv, datetime, hashlib, json, re, sys, tempfile
          from pathlib import Path

          V1R6_RUN=39645378760
          ARTIFACT='CAL26-V1R6-Week6-Stable-Roles-Exact-FV-Shadow-READ-ONLY'
          SOURCE_SHA=''
          EXPECTED_MANIFEST_STATUS='PASS_CAL26_V1R6_ROLE_TO_EXACT_FV_SHADOW_ONLY'
          EXPECTED_MODEL_WEEK=6
          REQUIRED_ROLES=('Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite')


          def check(ok,msg):
              if not ok:raise AssertionError('CAL26_V1R7_'+str(msg))

          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def csvread(p):
              with Path(p).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          def csvwrite(p,rows,columns):
              with Path(p).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=columns,extrasaction="ignore");w.writeheader();w.writerows(rows)
          def truth(v):return str(v).strip().lower() in ('true','1')


          def replace_role_records(index, updates, sync):
              start,end,record_region=sync._extract_const_object(index,'PLAYER_DB')
              changed=record_region
              for u in updates:
                  name=u['player']
                  old=u['live_role']
                  new=u['candidate_role']
                  pos=u['position']
                  check(old!=new and old in REQUIRED_ROLES and new in REQUIRED_ROLES,'BAD_ROLE_CANDIDATE_'+name)
                  # Source PLAYER_DB objects use single-quoted exact name keys and compact JS fields.
                  key=re.escape(name)
                  pattern=(r"(?P<prefix>'"+key+r"'\s*:\s*\{\s*pos:'"+re.escape(pos)+
                           r"'\s*,\s*age:\d+\s*,\s*role:')"+re.escape(old)+r"(?P<suffix>')")
                  changed,n=re.subn(pattern,lambda m:m.group('prefix')+new+m.group('suffix'),changed)
                  check(n==1,'PLAYER_DB_ROLE_PATCH_EXPECTED_ONCE_'+name+'_GOT_'+str(n))
              candidate=index[:start]+changed+index[end:]
              check(candidate!=index,'NO_ROLE_PATCH_APPLIED')
              return candidate


          def analyze(source,repo,out):
              source,repo,out=Path(source),Path(repo),Path(out)
              out.mkdir(parents=True,exist_ok=True)
              allpath=source/'CAL26_V1R6_All_565_Role_to_Live_FV_Impact.csv'
              manpath=source/'CAL26_V1R6_Manifest.json'
              check(allpath.exists() and manpath.exists(),'MISSING_PINNED_V1R6_FILES')
              man=json.loads(manpath.read_text(encoding='utf-8'))
              check(man['status']==EXPECTED_MANIFEST_STATUS,'WRONG_SOURCE_STAGE')
              check(man['source_week']==EXPECTED_MODEL_WEEK,'WRONG_ROLE_MODEL_WEEK')
              check(man['source_green_run']==39643851866,'WRONG_WEEK6_RUN')
              check(man['output_player_count']==565 and man['candidate_role_changes']==110,'WRONG_SOURCE_UNIVERSE')
              check(man['role_changed_nonzero_fv']==12 and man['role_changed_zero_fv']==98,'UNEXPECTED_ROLE_IMPACT_COHORT')
              check(man['accepted_fv_controls_count']==18,'ACCEPTED_CONTROL_COUNT_WRONG')
              check(man['production_changed'] is False and man['model_frozen'] is True,'INVALID_SOURCE_RELEASE')
              check(man['production_index_sha256']==sha(repo/'index.html'),'PRODUCTION_INDEX_DRIFT')
              check(man['canonical_fv_evaluator_sha256']==sha(repo/'scripts/validation/snapshot_values.py'),
                    'CANONICAL_FV_EVALUATOR_DRIFT')
              rows=csvread(allpath)
              check(len(rows)==565 and len({r['player'] for r in rows})==565,'565_UNIQUE_ROWS_REQUIRED')
              check(sum(truth(r['protect_accepted_fv']) for r in rows)==18,'PROTECTED_FV_COUNT_DRIFT')
              check(sum(truth(r['cal26_proposal_available']) for r in rows)==80,'OWNER_REVIEW_COUNT_DRIFT')
              selected=[];deferred=[]
              for r in rows:
                  check(r['production_files_changed']=='False','V1R6_PRODUCTION_DID_CHANGE')
                  check(r['cal26_v1r6_action'] in man['role_group_counts'],'UNKNOWN_ACTION')
                  if r['cal26_v1r6_action']=='STABLE_STANDARD_SHADOW_PRICED':
                      check(int(r['week6_prior_active_games'])>=3,'INSUFFICIENT_ACTIVE_GAMES')
                      check(r['week4_model_tier']==r['week6_model_tier']==r['candidate_role'],
                            'WEEK4_6_TIER_INSTABILITY')
                      check(int(r['week6_vs_current_tier_change']) in (1,2),
                            'NOT_STABLE_ONE_OR_TWO_TIER_INCREASE')
                      if int(r['raw_role_only_fv_delta'])==0:
                          selected.append(r)
                      else:deferred.append(r)
                  elif r['cal26_v1r6_action'] not in ('MATCHED_UNCHANGED','UNMATCHED_RETAIN'):
                      deferred.append(r)
              check(len(selected)==98,'ZERO_FV_CANDIDATE_COUNT_NOT_98')
              check(len([r for r in selected if r['position']=='K'])>=0,'POSITION_VALIDATION')
              check(not set(r['player'] for r in selected)&set(r['player'] for r in deferred),'DUPLICATE_RELEASE_TRACK')
              sys.path.insert(0,str(repo/'scripts'/'validation'))
              sys.path.insert(0,str(repo/'scripts'/'sync'))
              import snapshot_values as sv
              import sync_free_agent_valuation as sync
              indexpath=repo/'index.html';boardpath=repo/'free-agent-board.html'
              index=indexpath.read_text(encoding='utf-8');board=boardpath.read_text(encoding='utf-8')
              baseline_cfg=sv.load_from_html(indexpath)
              before=sv.compute_all_values(baseline_cfg)
              check(len(before)==565,'LIVE_UNIVERSE_NOT_565')
              check(sync.render_synced(index,board)==board,'LIVE_BOARD_NOT_SYNCED_BEFORE_CHANGE')
              check(all(sync.parity_regions(index,board).values()),'PREEXISTING_BOARD_PARITY_FAILURE')
              canonical_by_lower={k.casefold():k for k in baseline_cfg['player_db']}
              check(len(canonical_by_lower)==565,'CASEFOLD_KEY_COLLISION')
              for r in selected:
                  key=canonical_by_lower.get(r['player'])
                  check(key and key==r['player'],'CANONICAL_PLAYER_NAME_UNMATCHED_'+r['player'])
                  check(before[key]['role']==r['live_role'],'LIVE_ROLE_SOURCE_MISMATCH_'+key)
                  check(before[key]['value']==int(r['live_fv_exact']),'SOURCE_PRICE_MISMATCH_'+key)
                  check(int(r['raw_role_only_shadow_fv'])==before[key]['value'],'SOURCE_NONZERO_FV_'+key)
              candidate_index=replace_role_records(index,selected,sync)
              candidate_board=sync.render_synced(candidate_index,board)
              check(sync.render_synced(candidate_index,candidate_board)==candidate_board,'BOARD_SYNC_NOT_IDEMPOTENT')
              check(all(sync.parity_regions(candidate_index,candidate_board).values()),'CANDIDATE_BOARD_PARITY_FAILURE')
              check(sync._extract_const_object(board,'FA_PROD_MULT_DATA')[2]==
                    sync._extract_const_object(candidate_board,'FA_PROD_MULT_DATA')[2],
                    'FREE_AGENT_SPECIFIC_PROD_FACTOR_MODIFIED')
              cand_index_path=out/'index.html';cand_board_path=out/'free-agent-board.html'
              cand_index_path.write_text(candidate_index,encoding='utf-8')
              cand_board_path.write_text(candidate_board,encoding='utf-8')
              cfg=sv.load_from_html(cand_index_path)
              after=sv.compute_all_values(cfg)
              check(len(after)==565,'POST_RELEASE_UNIVERSE_DRIFT')
              expectedroles={r['player']:r['candidate_role'] for r in selected}
              exactrolechanges=0
              for k in before:
                  check(k in after,'PLAYER_REMOVED_'+k)
                  check(before[k]['value']==after[k]['value'],'PRICE_CHANGED_'+k)
                  check(before[k]['pos']==after[k]['pos'],'POSITION_CHANGED_'+k)
                  expected=expectedroles.get(k,before[k]['role'])
                  check(after[k]['role']==expected,'ROLE_NOT_AS_EXPECTED_'+k)
                  exactrolechanges += (after[k]['role'] != before[k]['role'])
              check(exactrolechanges==len(selected)==98,'EXACT_ROLE_CHANGE_COUNT_INCORRECT')
              check(all(before[r['player']]['value']==after[r['player']]['value'] for r in rows if truth(r['protect_accepted_fv'])),
                    'ACCEPTED_FV_CONTROL_MOVED')
              # Accepted FV proposals are PRICE controls, not a prohibition on correcting their labels.
              check(all(after[r['player']]['role']==before[r['player']]['role'] for r in rows if r['cal26_v1r6_action']=='DOWNGRADE_HELD'),
                    'DOWNGRADE_APPLIED')
              check(all(after[r['player']]['role']==before[r['player']]['role'] for r in rows if r['cal26_v1r6_action']=='LARGE_UPGRADE_REVIEW'),
                    'LARGE_UPGRADE_APPLIED')
              check(all(after[r['player']]['role']==before[r['player']]['role'] for r in rows if r['cal26_v1r6_action']=='UNMATCHED_RETAIN'),
                    'UNMATCHED_CHANGED')
              # Price parity alone does not guarantee unchanged position/production inputs: audit canonical source too.
              check(sync._extract_const_object(index,'PROD_MULT_DATA')[2]==
                    sync._extract_const_object(candidate_index,'PROD_MULT_DATA')[2],
                    'PROD_MULT_DATA_CHANGED')
              check(sync._extract_const_object(index,'NO_REAL_PRODUCTION_HISTORY')[2]==
                    sync._extract_const_object(candidate_index,'NO_REAL_PRODUCTION_HISTORY')[2],
                    'NO_REAL_HISTORY_CHANGED')
              manifest={
                  'status':'PASS_CAL26_V1R7_98_ZERO_FV_ROLE_CANDIDATE_READ_ONLY',
                  'green_source_v1r6_run':V1R6_RUN,
                  'v1r6_csv_sha256':sha(allpath),'v1r6_manifest_sha256':sha(manpath),
                  'source_week':6,'role_model_retuned':False,
                  'input_index_sha256':sha(indexpath),'input_board_sha256':sha(boardpath),
                  'candidate_index_sha256':sha(cand_index_path),'candidate_board_sha256':sha(cand_board_path),
                  'source_565':565,'roles_changed':98,'prices_changed':0,
                  'accepted_controls_count':18,'accepted_controls_prices_changed':0,
                  'accepted_controls_roles_corrected_without_fv_change':sum(truth(r['protect_accepted_fv']) for r in selected),
                  'reviewed_cal26_proposals_count':80,'reviewed_cal26_proposals_changed':0,
                  'zero_fv_stable_upgrade_count':98,
                  'price_changing_stable_candidates_held':12,
                  'large_upgrade_candidates_held':man['role_group_counts']['LARGE_UPGRADE_REVIEW'],
                  'downgrades_held':man['role_group_counts']['DOWNGRADE_HELD'],
                  'remaining_unmatched':man['role_group_counts']['UNMATCHED_RETAIN'],
                  'candidate_free_agent_sync_parity':True,
                  'candidate_fa_specific_prod_factors_unchanged':True,
                  'production_files_changed':False,'production_release_authorized':False,
              }
              (out/'CAL26_V1R7_Manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n',encoding='utf-8')
              columns=['player','position','live_role','candidate_role','live_fv_exact','raw_role_only_fv_delta','week6_prior_active_games','week4_model_tier','week6_model_tier','protect_accepted_fv']
              csvwrite(out/'CAL26_V1R7_98_Zero_FV_Role_Upgrade_Candidates.csv',selected,columns)
              csvwrite(out/'CAL26_V1R7_Deferred_Role_Change_Reviews.csv',deferred,columns)
              notes=['# CAL26 V1R7 — 98 Stable Role-Only Upgrades, No FV Changes','',
                     '**READ-ONLY candidate copies only. Nothing deployed.**','',
                     '- Exact green V1R6 110 stable +1/+2 upgrades evaluated; 98 were FV-neutral, 12 moved FV and are held.',
                     '- Candidate index.html and free-agent-board.html produced under Actions artifact, not in repository.',
                     '- Recomputed all 565 FV using canonical snapshot_values.py: no changes.',
                     '- Canonical free-agent board synchronized; independent FA production factors retained.',
                     '- No large role upgrades, downgrades, or unmatched players changed.',
                     '- All 18 accepted owner FV price controls remain unchanged; 6 have role-label corrections with zero FV impact. Existing 80 proposed prices are not adopted or modified.',
                     '', '## Focus', '', '| Player | Current role | Candidate role | FV |', '|---|---|---|---:|']
              for p in ('cj stroud','justin jefferson','matthew golden','brian branch','patrick queen','justin herbert'):
                  rr=next((r for r in rows if r['player']==p),None)
                  if rr:
                      now=after[p]['role']; notes.append(f"| {p.title()} | {rr['live_role']} | {now} | {before[p]['value']:,} |")
              notes +=['', '**Important:** The release candidate is *price-neutral now*; role changes may affect future valuation updates, other features, or external displays. This stage does not independently validate dynasty talent appropriateness for all 98 players or authorize production.','']
              (out/'CAL26_V1R7_Review.md').write_text('\n'.join(notes),encoding='utf-8')
              print(json.dumps(manifest,sort_keys=True,indent=2))


          def test_smoke():
              a="const PLAYER_DB = {'foo':{pos:'QB',age:25,role:'Rotational'},'bar':{pos:'WR',age:24,role:'Starter'}};"
              class S:
                  @staticmethod
                  def _extract_const_object(s,n):
                      b=s.index('const PLAYER_DB');e=s.index(';',b)+1
                      return b,e,s[b:e]
              patched=replace_role_records(a,[{'player':'foo','position':'QB','live_role':'Rotational','candidate_role':'Starter'}],S())
              check("role:'Starter'" in patched and "foo':{pos:'QB',age:25,role:'Starter'" in patched,'PATCH_SMOKE')
              try:
                  replace_role_records(a,[{'player':'nonexistent','position':'QB','live_role':'Rotational','candidate_role':'Starter'}],S())
                  raise AssertionError('missing key silently allowed')
              except AssertionError as e:
                  check('EXPECTED_ONCE' in str(e),'WRONG_NEGATIVE_TEST_FAILURE')
              # Regression for red run #39648888316: extra source columns should not break CSV export.
              with tempfile.TemporaryDirectory(prefix='cal26-v1r7r1-csv-') as td:
                  example = Path(td)/'test.csv'
                  csvwrite(example,[{'player':'cj stroud','position':'QB','b42_model_score':'0.92',
                                     'owner_rating_cal26_fv':'Correct'}],['player','position'])
                  check(csvread(example)==[{'player':'cj stroud','position':'QB'}],
                        'EXTRA_COLUMNS_CSV_EXPORT_REGRESSION')
              print('CAL26 V1R7R1 role-patch, absent-key, and projected CSV export tests PASS')

          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('--source');p.add_argument('--repo',default='.');p.add_argument('--out')
              p.add_argument('--smoke-test',action='store_true')
              args=p.parse_args()
              if args.smoke_test:test_smoke()
              else:
                  if not args.source or not args.out:p.error('--source and --out required')
                  analyze(args.source,args.repo,args.out)
          PY_CAL26_V1R7
          python3 - <<'PY_TEST_ENGINE'
          import ast,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'cal26_v1r7_role_candidate.py'
          ast.parse(p.read_text())
          print('PASS: CAL26 V1R7 engine syntax')
          PY_TEST_ENGINE
      - name: Run role patch and real source CSV export regression
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ runner.temp }}/cal26_v1r7_role_candidate.py" --smoke-test
      - name: Build price-neutral candidate index and synchronized free agent board
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ runner.temp }}/cal26_v1r7_role_candidate.py" \
            --source "${{ runner.temp }}/cal26-v1r7-source" \
            --repo . \
            --out "${{ runner.temp }}/cal26-v1r7-output"
      - name: Independent manifest and repository no-write verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INDEPENDENT'
          import csv,json,os,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cal26-v1r7-output'
          m=json.loads((root/'CAL26_V1R7_Manifest.json').read_text())
          with (root/'CAL26_V1R7_98_Zero_FV_Role_Upgrade_Candidates.csv').open(newline='') as f:
              selected=list(csv.DictReader(f))
          assert m['status']=='PASS_CAL26_V1R7_98_ZERO_FV_ROLE_CANDIDATE_READ_ONLY'
          assert m['source_565']==565 and m['roles_changed']==98 and m['prices_changed']==0
          assert len(selected)==98 and len({x['player'] for x in selected})==98
          assert all(int(x['raw_role_only_fv_delta'])==0 for x in selected)
          assert m['accepted_controls_count']==18 and m['accepted_controls_prices_changed']==0
          assert m['accepted_controls_roles_corrected_without_fv_change']==6
          assert m['production_files_changed'] is False and m['production_release_authorized'] is False
          assert m['candidate_free_agent_sync_parity'] is True
          for name,field in [('index.html','candidate_index_sha256'),('free-agent-board.html','candidate_board_sha256')]:
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==m[field]
          print('PASS: 98 proposed role-only changes; all 565 FVs identical; 18 price controls protected')
          PY_INDEPENDENT
          test -z "$(git status --porcelain --untracked-files=all)"
          cat "${{ runner.temp }}/cal26-v1r7-output/CAL26_V1R7_Review.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'No repository files changed. Production release requires a separate explicit action.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research candidate HTML pair and exact player decisions
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R7R1-98-Role-Only-No-FV-Change-Release-Candidate-READ-ONLY
          path: ${{ runner.temp }}/cal26-v1r7-output/
          if-no-files-found: warn
          retention-days: 30
