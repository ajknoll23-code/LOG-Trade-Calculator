name: A-QA21R2 - Fixed Three-QB FV Production Release
run-name: A-QA21R2 Huntley Lock Howell FV ${{ inputs.release_mode }}
'on':
  workflow_dispatch:
    inputs:
      release_mode:
        description: PREVIEW is safe; APPLY commits exactly 3 approved QB prices into 2 HTML files
        type: choice
        required: true
        default: PREVIEW_ONLY
        options:
        - PREVIEW_ONLY
        - APPLY_EXACT_APPROVED_3QB
permissions:
  contents: write
  actions: read
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA21_MODE: ${{ inputs.release_mode }}
      QA21_DIR: /tmp/qa21-stage
      QA21_QA20: /tmp/qa21-source20
      QA20_IN08: /tmp/qa21-source08
      QA20_IN19: /tmp/qa21-source19
      QA20_OUT: /tmp/qa21-stage
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout production main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Confirm source runs were green and traceable
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nfor id in 41208643474 41207517148 41072676062; do\n  gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$id\"\
        \ > \"$RUNNER_TEMP/run_$id.json\"\ndone\npython3 - <<'PY_VERIFY'\nimport json,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        expected={41208643474:'.github/workflows/A-QA20R1-3QB-Price-Control-Preview.yml',41207517148:'.github/workflows/A-QA19R1-QB-Numeric-Owner-Preview.yml',41072676062:'.github/workflows/A-QA08R1-Role-Audit.yml'}\n\
        for id,path in expected.items():\n r=json.loads((p/f'run_{id}.json').read_text())\n assert r['status']=='completed' and r['conclusion']=='success'\n\
        \ assert r['path']==path and r['head_branch']=='main'\n assert r['repository']['full_name']==os.environ['GITHUB_REPOSITORY']\n\
        print('PASS pinned green QA08, QA19, QA20 workflow lineage')\nPY_VERIFY"
    - name: Download exact successful QA20 stage
      uses: actions/download-artifact@v4
      with:
        name: A-QA20-Controlled-3QB-Price-Preview
        run-id: '41208643474'
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: ${{ env.QA21_QA20 }}
    - name: Download QA08 immutable 72-player baseline
      uses: actions/download-artifact@v4
      with:
        name: A-QA08-DOB-Parity-Role-Evidence
        run-id: '41072676062'
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: ${{ env.QA20_IN08 }}
    - name: Download QA19 numeric research to verify original scenario
      uses: actions/download-artifact@v4
      with:
        name: A-QA19-Four-QB-Numeric-Owner-Preview
        run-id: '41207517148'
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: ${{ env.QA20_IN19 }}
    - name: Stage exact approved production patch without writing repository
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$QA21_DIR\"\ncat > \"$RUNNER_TEMP/qa21_stage.py\" <<'PY_STAGE'\nfrom pathlib import Path\n\
        import os,hashlib,re,json\nROOT=Path(os.environ['QA21_DIR'])\nROOT.mkdir(exist_ok=True)\nqa=None\nartifact=Path(os.environ['QA21_QA20'])\n\
        manifest=json.loads((artifact/'QA20_Manifest.json').read_text())\nassert manifest['status']=='QA20_THREE_QB_TARGETED_PREVIEW_STAGED_READ_ONLY'\
        \ and manifest['read_only'] and not manifest['owner_release_authorized']\nassert manifest['selected_candidates']==3 and manifest['curated_reference_count']==565\
        \ and manifest['existing_owner_anchor_count']==15\nassert manifest['candidate_scenario_values']=={'Tyler Huntley':1250,'Drew\
        \ Lock':1104,'Sam Howell':1098}\nassert manifest['qa19_verified_run']=='41207517148' and manifest['qa08_verified_run']=='41072676062'\n\
        assert all(manifest[k]==0 for k in ('production_value_changes','fv_plus_changes','mv_changes','repo_mutations'))\nneedle='function\
        \ playerValue(pos, age, role, name){'\nshadow_marker='/* QA20_OWNER_SCENARIO_PREVIEW_ONLY_NOT_APPROVED */'\ninsert='''/* QA21_2026_10_31_EXPLICIT_OWNER_APPROVED_QB_ROSTER_PRICES\
        \ */\n// Owner-approved Oct 31, 2026: Tyler Huntley (Sleeper 7083), Drew Lock (5854),\n// Sam Howell (8162). Stable name and\
        \ QB-position check avoids fantasy-slot\n// dependency: a Sleeper starter/bench/taxi move cannot undo the pricing decision.\n\
        // No production multiplier, role, age, FV+, or MV formula is changed.\nconst QA21_OWNER_APPROVED_QB_ROSTER_FV = {\n  'drew\
        \ lock':1104,\n  'sam howell':1098,\n  'tyler huntley':1250,\n};\nfunction playerValue(pos, age, role, name){\n  const qa21ApprovedKey=normalizeName(name\
        \ || '');\n  if(pos==='QB' && Object.prototype.hasOwnProperty.call(QA21_OWNER_APPROVED_QB_ROSTER_FV,qa21ApprovedKey)){\n   \
        \ return QA21_OWNER_APPROVED_QB_ROSTER_FV[qa21ApprovedKey];\n  }\n'''\nfor source,output,sha in [\n ('qa20_staged_index.html','index.html','base_live_index_sha256'),\n\
        \ ('qa20_staged_free-agent-board.html','free-agent-board.html','base_live_board_sha256')]:\n    staged=(artifact/source).read_text(encoding='utf-8')\n\
        \    assert hashlib.sha256(staged.encode()).hexdigest()==manifest[{'qa20_staged_index.html':'staged_index_sha256','qa20_staged_free-agent-board.html':'staged_board_sha256'}[source]]\n\
        \    i=staged.index(shadow_marker)\n    start=staged.index(needle,i)\n    end=staged.index('\\n  }\\n',start)+len('\\n  }\\\
        n')\n    orig=staged[:i]+needle+staged[end:]\n    assert hashlib.sha256(orig.encode()).hexdigest()==manifest[sha], output\n\
        \    assert orig.count(needle)==1 and 'QA21_OWNER_APPROVED_QB_ROSTER_FV' not in orig\n    prod=orig.replace(needle,insert,1)\n\
        \    assert prod.replace(insert,needle,1)==orig\n    assert prod.count('QA21_OWNER_APPROVED_QB_ROSTER_FV')==3\n    assert Path(output).read_text(encoding='utf-8')==orig,\
        \ 'PRODUCTION_DRIFT_'+output\n    (ROOT/output).write_text(prod)\n    (ROOT/(output+'.baseline')).write_text(orig)\n    assert\
        \ hashlib.sha256(prod.encode()).hexdigest()=={'index.html':'53c6cebc07ad9f7b5c405354709a8208a1eb108b55336e35ef3dff64bec67164','free-agent-board.html':'a21bc18883065c61844d3decd510a896d19a99248e3f92f56ed73820da34fd75'}[output]\n\
        \    print(output,'BASE',len(orig),hashlib.sha256(orig.encode()).hexdigest(), 'PROD',len(prod),hashlib.sha256(prod.encode()).hexdigest(),'BLOB',hashlib.sha1((f'blob\
        \ {len(prod.encode())}\\0').encode()+prod.encode()).hexdigest())\n(ROOT/'production_patch.json').write_text(json.dumps({'targets':{'Tyler\
        \ Huntley':1250,'Drew Lock':1104,'Sam Howell':1098},'lineage':'QA20 41208643474','original_manifest':manifest,'files':{f:hashlib.sha256((ROOT/f).read_bytes()).hexdigest()\
        \ for f in ['index.html','free-agent-board.html']}},indent=2))\n\nroster=json.loads(Path('data/league_rosters.json').read_text())\n\
        seen={}\nfor t in roster['rosters']:\n    for slot in ('starters','bench','taxi','reserve_ir'):\n        for p in t.get(slot,[]):\n\
        \            if str(p.get('player_id')) in ('7083','5854','8162'):\n                sid=str(p['player_id'])\n              \
        \  assert sid not in seen, ('DUPLICATE_ROSTER_ID',sid)\n                seen[sid]=(p['name'],p['position'],slot)\nassert {sid:name\
        \ for sid,(name,pos,slot) in seen.items()}=={'7083':'Tyler Huntley','5854':'Drew Lock','8162':'Sam Howell'}\nassert all(p=='QB'\
        \ for n,p,slot in seen.values())\nprint('PASS three Sleeper IDs resolved uniquely to approved QB names')\n\nPY_STAGE\npython3\
        \ -m py_compile \"$RUNNER_TEMP/qa21_stage.py\"\npython3 \"$RUNNER_TEMP/qa21_stage.py\""
    - name: Protect all 565 curated values and all 15 owner anchors on both pages
      shell: bash
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/qa21_validate.py" <<''PY_VALIDATE''

        from pathlib import Path

        import sys,hashlib,json,os

        r=Path(os.environ[''QA21_DIR'']);sys.path.insert(0,str(Path(''scripts/validation'').resolve()))

        import snapshot_values as sv

        ba=sv.load_from_html(r/''index.html.baseline'');pr=sv.load_from_html(r/''index.html'');bb=sv.load_from_html(r/''free-agent-board.html.baseline'');pb=sv.load_from_html(r/''free-agent-board.html'')

        assert len(ba[''player_db''])==len(pr[''player_db''])==565

        assert ba[''cal26_fv_owner_anchors'']==pr[''cal26_fv_owner_anchors'']==bb[''cal26_fv_owner_anchors'']==pb[''cal26_fv_owner_anchors'']

        assert len(ba[''cal26_fv_owner_anchors''])==15

        assert sv.compute_all_values(ba)==sv.compute_all_values(pr)

        assert sv.compute_all_values(bb)==sv.compute_all_values(pb)

        assert set(sv.compute_all_values(ba))==set(sv.compute_all_values(bb))

        assert ''QA20_FV_PREVIEW'' not in (r/''index.html'').read_text() and ''QA20_FV_PREVIEW'' not in (r/''free-agent-board.html'').read_text()

        assert (r/''index.html'').read_text().count(''QA21_OWNER_APPROVED_QB_ROSTER_FV'')==3

        assert (r/''free-agent-board.html'').read_text().count(''QA21_OWNER_APPROVED_QB_ROSTER_FV'')==3

        print(''PASS: 565/565 original static values unchanged, 15/15 owner controls unchanged, each page unchanged; pre-existing cross-page
        James Pearce discrepancy retained'')


        PY_VALIDATE

        python3 "$RUNNER_TEMP/qa21_validate.py"'
    - name: Replay 72 actual roster profiles using production JavaScript
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/qa21_replay.js\" <<'JS_REPLAY'\n'use strict';\nconst fs=require('fs');\nconst vm=require('vm');\n\
        const source=fs.readFileSync(process.env.QA21_DIR+'/index.html.baseline','utf8');\nconst cases=JSON.parse(fs.readFileSync(process.env.QA20_IN08+'/QA08_Input72.json','utf8'));\n\
        const qa19=JSON.parse(fs.readFileSync(process.env.QA20_IN19+'/QA19_Four_QB_Numeric_Owner_Scenarios.json','utf8'));\nconst preview=qa19.filter(q=>q.illustrative_owner_FV_center_NOT_APPROVED!==null);\n\
        const mapping=new Map(preview.map(p=>[p.sleeper_id, p]));\nconst output=process.env.QA20_OUT;\nconst stageIndex=fs.readFileSync(process.env.QA21_DIR+'/index.html','utf8');\n\
        const sourceBoard=fs.readFileSync(process.env.QA21_DIR+'/free-agent-board.html.baseline','utf8');\nconst stageBoard=fs.readFileSync(process.env.QA21_DIR+'/free-agent-board.html','utf8');\n\
        function fail(s){throw new Error('QA20 SIMULATION STOP: '+s)}\n// Require the same exact core function and original fantasy-slot\
        \ mechanism.\nfor(const p of [/function playerValue\\(pos, age, role, name\\)\\{/,\n    /function productionMultiplier\\(name,\
        \ role\\)\\{/,\n    /role:\\s*existing\\s*\\?\\s*existing\\.role\\s*:\\s*slotDefaults\\[slot\\]/,\n    /return Math\\.round\\\
        (100 \\* pw \\* am \\* rm \\* 55\\);/])\n  if(!p.test(source)) fail('Core source structure changed: '+p);\nif(qa19.length!==4\
        \ || mapping.size!==3 ||\n  JSON.stringify([...mapping.keys()].sort())!==JSON.stringify(['5854','7083','8162'].sort()))\n  fail('Incorrect\
        \ three-player owner preview selection');\n// Capture exact source definitions rather than reimplement the pricing formula.\n\
        function getConst(name,source){\n  const re=new RegExp('^const '+name+'\\\\s*=', 'm');\n  const m=re.exec(source);\n  if(!m)\
        \ fail('Constant missing: '+name);\n  const start=m.index, rhsStart=start+m[0].length;\n  const tail=source.slice(rhsStart);\n\
        \  const rhs=tail.trimStart();\n  if(rhs.startsWith('{')){\n    // R2 repair: some constants (POSITION_WEIGHT and ROLE_MULT)\
        \ are\n    // complete single-line objects. R1 incorrectly captured through\n    // the NEXT multiline object's close, redeclaring\
        \ AGE_CURVE.\n    // Match the exact one-line object before trying a multiline close.\n    const firstLine=tail.split('\\n',1)[0];\n\
        \    if(/^\\s*\\{[^{}]*\\}\\s*;\\s*(?:\\/\\/.*)?$/.test(firstLine))\n      return source.slice(start,rhsStart+firstLine.length);\n\
        \    const end=/^};\\s*$/m.exec(tail);\n    if(!end) fail('Could not safely locate object closing: '+name);\n    const result=source.slice(start,rhsStart+end.index+end[0].length);\n\
        \    // A multiline object must end on the line containing its own\n    // closing brace; no intervening top-level declaration\
        \ allowed.\n    if(/^const [A-Za-z_$][\\w$]*\\s*=/m.test(result.slice(m[0].length)))\n      fail('Object extraction swallowed\
        \ another constant: '+name);\n    return result;\n  }\n  const lineEnd=source.indexOf('\\n',rhsStart);\n  const one=source.slice(start,lineEnd<0?source.length:lineEnd);\n\
        \  if(!one.includes(';')) fail('Nonliteral simple constant: '+name);\n  return one;\n}\nfunction getFn(name,source){\n  const\
        \ re=new RegExp('^function '+name+'\\\\([^\\\\n]*\\\\)\\\\s*\\\\{', 'm');\n  const m=re.exec(source);\n  if(!m) fail('Function\
        \ missing: '+name);\n  const tail=source.slice(m.index);\n  const end=/^}\\s*$/m.exec(tail);\n  if(!end) fail('Unable to locate\
        \ exact function end: '+name);\n  return tail.slice(0,end.index+end[0].length);\n}\nconst constants=[\n  'POSITION_WEIGHT','AGE_CURVE','QB_POST_PEAK_FLOOR','LB_POST_PEAK_DECAY_POWER',\n\
        \  'ROLE_MULT','PROD_MULT_DATA','NO_REAL_PRODUCTION_HISTORY',\n  'CAL22_LEGACY_MONOTONE_KEYS','PROD_MULT','PLAYER_DB','RB_BIRTH_DATE_DATA',\n\
        \  'CAL26_FV_OWNER_ANCHORS'\n];\nconst functions=[\n  'normalizeName','productionMultiplier','ageMultiplier',\n  'fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier',\n\
        \  'effectiveAgeMultiplier','playerValue'\n];\nfunction buildEngine(content,isStage){\n  const defs=[...constants, ...(isStage?['QA21_OWNER_APPROVED_QB_ROSTER_FV']:[])];\n\
        \  const script=defs.map(k=>getConst(k,content)).join('\\n')+'\\n'+\n     functions.map(k=>getFn(k,content)).join('\\n')+\n\
        \     '\\nglobalThis.QA20_EXPORT={playerValue,normalizeName,PLAYER_DB};';\n  const FIXED_DAY='2026-10-30T12:00:00.000Z';\n \
        \ class AuditDate extends Date {\n    constructor(...args){super(...(args.length?args:[FIXED_DAY]));}\n    static now(){return\
        \ Date.parse(FIXED_DAY);}\n  }\n  const sandbox={Date:AuditDate};\n  try{vm.runInNewContext(script,sandbox,{timeout:12000});}\n\
        \  catch(e){fail('Could not isolate exact source functions: '+e.message)}\n  const res=sandbox.QA20_EXPORT;\n  if(!res||typeof\
        \ res.playerValue!=='function')fail('Source replay exports unavailable');\n  return res;\n}\nconst originalIndex=buildEngine(source,false);\n\
        const patchedIndex=buildEngine(stageIndex,true);\nconst originalBoard=buildEngine(sourceBoard,false);\nconst patchedBoard=buildEngine(stageBoard,true);\n\
        if(cases.length!==72 || new Set(cases.map(c=>c.sleeper_id)).size!==72) fail('Bad 72-player cohort');\nconst expected={\n  '7083':{name:'Tyler\
        \ Huntley',age:28,role:'Starter',value:1250,baseline:7150},\n  '5854':{name:'Drew Lock',age:29,role:'Rotational',value:1104,baseline:4648},\n\
        \  '8162':{name:'Sam Howell',age:26,role:'Rotational',value:1098,baseline:4648}\n};\nfor(const [sid,decision] of Object.entries(expected)){\n\
        \  const p=mapping.get(sid);\n  if(!p||p.player!==decision.name||p.current_fv_UNCHANGED!==decision.baseline||\n    p.illustrative_owner_FV_center_NOT_APPROVED!==decision.value||\n\
        \    p.decision_gate!=='NUMERIC_OWNER_PREVIEW_ONLY_NOT_DEPLOYABLE' ||\n    p.owner_approved!=='NO'||p.production_FV_changed!=='NO')\n\
        \    fail('QA19 candidate drift '+sid);\n}\nfunction evaluate(engine,c){\n  const key=engine.normalizeName(c.player);\n  const\
        \ prior=engine.PLAYER_DB[key];\n  if(c.sleeper_birth_date){\n    engine.PLAYER_DB[key]={...(prior||{}),birth_date:c.sleeper_birth_date};\n\
        \  }\n  const out=engine.playerValue(c.position,c.age,c.assigned_role,c.player);\n  if(prior===undefined)delete engine.PLAYER_DB[key];else\
        \ engine.PLAYER_DB[key]=prior;\n  if(!Number.isInteger(out)||out<0||out>20000) fail('Invalid FV '+c.player);\n  return out;\n\
        }\nconst records=[];\nfor(const c of cases){\n  const sid=c.sleeper_id;\n  const before=evaluate(originalIndex,c);\n  const\
        \ after=evaluate(patchedIndex,c);\n  const bBefore=evaluate(originalBoard,c);\n  const bAfter=evaluate(patchedBoard,c);\n  const\
        \ target=expected[sid]||null;\n  if(target){\n    if(c.player!==target.name||c.position!=='QB'||c.age!==target.age||\n     \
        \ c.assigned_role!==target.role||before!==target.baseline||bBefore!==target.baseline||\n      after!==target.value||bAfter!==target.value)\n\
        \      fail('Three-player exact baseline or preview drift '+sid+' '+JSON.stringify({before,after,bBefore,bAfter}));\n    //\
        \ These owner-approved prices must persist through fantasy role and age changes.\n    for(const probe of [{...c,assigned_role:'Speculative'},\
        \ {...c,assigned_role:'Starter'}, {...c,age:c.age+1}]) {\n      if(evaluate(patchedIndex,probe)!==target.value || evaluate(patchedBoard,probe)!==target.value)\n\
        \        fail('Owner approved FV reverted on role or age drift '+sid);\n    }\n    const otherPosition={...c,position:'RB'};\n\
        \    if(evaluate(patchedIndex,otherPosition)!==evaluate(originalIndex,otherPosition))\n      fail('QB-only override leaked to\
        \ RB '+sid);\n\n  }else if(before!==after||bBefore!==bAfter)fail('Non-target preview mutation '+sid);\n  if(before!==bBefore||after!==bAfter)fail('Index\
        \ versus free-agent board model disagrees '+sid);\n  records.push({sleeper_id:sid,player:c.player,position:c.position,fantasy_slot:c.fantasy_slot,\n\
        \    actual_baseline_current_source:before,qa08_frozen_baseline:c.published_fv,\n    staged_preview_FV:after,illustrative_delta:after-before,\n\
        \    original_source_drift_from_QA08:before-c.published_fv,\n    candidate_selected:!!target,\n    owner_release_authorized:false});\n\
        }\nif(records.filter(x=>x.candidate_selected).length!==3||\n  records.filter(x=>x.illustrative_delta!==0).length!==3) fail('Not\
        \ exactly three corrections');\nfs.writeFileSync(output+'/QA21_72_Player_Live_Function_Parity.json',JSON.stringify(records,null,2)+'\\\
        n');\nconsole.log(JSON.stringify({qa20:'READ_ONLY_PREVIEW',cohort:records.length,changed:3,\n  other69_unchanged:records.filter(x=>!x.candidate_selected&&x.illustrative_delta===0).length,\n\
        \  pinned_baseline_drift:records.filter(x=>x.original_source_drift_from_QA08!==0).length,\n  both_ui_pages_tested:true}));\n\
        \n\nJS_REPLAY\nnode --check \"$RUNNER_TEMP/qa21_replay.js\"\nnode \"$RUNNER_TEMP/qa21_replay.js\""
    - name: Guarded production commit or preview only
      shell: bash
      run: "set -euo pipefail\ncase \"$QA21_MODE\" in PREVIEW_ONLY|APPLY_EXACT_APPROVED_3QB) ;; *) echo 'Unsupported release mode';exit\
        \ 1;; esac\nif test \"$QA21_MODE\" = APPLY_EXACT_APPROVED_3QB; then\n  test \"$GITHUB_REF\" = refs/heads/main\n  test -z \"\
        $(git status --porcelain --untracked-files=all)\"\n  cp \"$QA21_DIR/index.html\" index.html\n  cp \"$QA21_DIR/free-agent-board.html\"\
        \ free-agent-board.html\n  python3 - <<'PY_FILES'\nimport subprocess\npaths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()\n\
        assert set(paths)=={'index.html','free-agent-board.html'},paths\nprint('EXACT 2 HTML FILES changed; 3 QB overrides')\nPY_FILES\n\
        \  git config user.name 'github-actions[bot]'\n  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        \  git add -- index.html free-agent-board.html\n  git commit -m 'CAL QA21: owner-approved FV for Huntley Lock Howell (3 QB only)'\n\
        \  git push origin HEAD:main\n  echo \"Release pushed: $(git rev-parse HEAD)\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  test -z\
        \ \"$(git status --porcelain --untracked-files=all)\"\n  echo 'PREVIEW ONLY: no production changes. To deploy, select APPLY_EXACT_APPROVED_3QB.'\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nfi"
    - name: Generate owner manifest and mobile report
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY_REPORT''

        import json,os,pathlib

        p=pathlib.Path(os.environ[''QA21_DIR'']);m=json.loads((p/''production_patch.json'').read_text())

        mode=os.environ[''QA21_MODE'']

        status=''RELEASE_COMMITTED'' if mode==''APPLY_EXACT_APPROVED_3QB'' else ''PREVIEW_ONLY''

        content={''status'':status,''user_approved_exact_prices'':m[''targets''],''source'':''A-QA20 green 41208643474'',''mode'':mode,''curated_player_fv_changes'':0,''other_69_audited_player_changes'':0,''existing_owner_anchor_changes'':0,''target_count'':3,''repo_changes'':2
        if status==''RELEASE_COMMITTED'' else 0,''owner_approved_by_user'':True,''reversible_patch'':True,''known_preexisting_james_pearce_cross_page_disagreement'':''UNCHANGED''}

        (p/''QA21_Release_Manifest.json'').write_text(json.dumps(content,indent=2)+''\n'')

        with (p/''QA21_72_Player_Live_Function_Parity.json'').open() as f: v=json.load(f)

        assert len(v)==72 and sum(x[''illustrative_delta'']!=0 for x in v)==3

        assert sum(x[''illustrative_delta'']==0 for x in v if not x[''candidate_selected''])==69

        lines=[''# QA21 — Three approved QB prices'','''',f''**Mode: {status}**'','''',''| Player | Before FV | After FV |'', ''|---|---:|---:|'',''|
        Tyler Huntley | 7,150 | 1,250 |'',''| Drew Lock | 4,648 | 1,104 |'',''| Sam Howell | 4,648 | 1,098 |'','''', ''72/72 roster
        profiles replayed; only three changed. 565/565 curated source players unchanged. 15/15 approved anchors unchanged.'', ''QB overrides
        persist after age and fantasy-roster-slot changes.'',''FV+/MV and non-target production weights unchanged.'', ''Historical pre-existing
        James Pearce cross-page position drift not modified.'']

        (p/''QA21_Report.md'').write_text(''\n''.join(lines)+''\n'')

