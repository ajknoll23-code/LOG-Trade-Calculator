name: Free Agent Production V2 Phase 3 Confirm and Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  confirm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"
          python3 - <<'PY'
          import requests
          print("requests import PASS:", requests.__version__)
          PY

      - name: Guard frozen research and clean repository
        shell: bash
        run: |
          set -euo pipefail

          required=(
            research/free-agent-production-v2/free_agent_production_v2_phase1.json
            research/free-agent-production-v2/free_agent_production_v2_phase1.py
            research/free-agent-production-v2/phase1_manifest.json
            research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.json
            research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.py
            research/free-agent-production-v2/phase2_manifest.json
            free-agent-board.html
            index.html
            data/free_agents.json
            data/league_rosters.json
            scripts/sync/sync_free_agent_valuation.py
            scripts/validation/validate_free_agent_valuation_parity.py
            scripts/validation/repo_regression_checks.py
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required input: $f"; exit 1; }
          done

          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"

          new_files=(
            model/releases/free-agent-production-v2/release.json
            scripts/model/apply_free_agent_production_v2_release.py
            research/free-agent-production-v2/phase3_production_confirmation.json
            research/free-agent-production-v2/phase3_production_confirmation.md
            research/free-agent-production-v2/phase3_manifest.json
          )
          for f in "${new_files[@]}"; do
            test ! -e "$f" || {
              echo "Refusing to overwrite existing Phase 3/release artifact: $f"
              exit 1
            }
          done

          if grep -q "FREE_AGENT_PRODUCTION_V2_RELEASE_START" free-agent-board.html; then
            echo "Free-Agent Production V2 release block is already present; refusing duplicate deployment."
            exit 1
          fi

          git rev-parse HEAD | tee "${RUNNER_TEMP}/starting_sha.txt"

          sha256sum \
            index.html \
            data/free_agents.json \
            data/league_rosters.json \
            > "${RUNNER_TEMP}/phase3-immutable-production-inputs.sha256"

      - name: Preflight full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Verify Phase 1 and Phase 2 frozen lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          research = root / "research" / "free-agent-production-v2"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          p1 = json.loads((research / "free_agent_production_v2_phase1.json").read_text())
          m1 = json.loads((research / "phase1_manifest.json").read_text())
          p2 = json.loads((research / "free_agent_production_v2_phase2_shadow.json").read_text())
          m2 = json.loads((research / "phase2_manifest.json").read_text())

          assert p1["decision"] == "PASS_FA_PROD_V2_PHASE1_LINEAGE_AND_FREEZE"
          assert p2["decision"] == "PASS_FA_PROD_V2_PHASE2_SHADOW_VALIDATION"
          assert p1["production_change_authorized"] is False
          assert p2["production_change_authorized"] is False

          for rel, expected in m1["output_sha256"].items():
              path = root / rel
              assert path.exists(), rel
              assert sha(path) == expected, f"Phase 1 frozen output drift: {rel}"

          for rel, expected in m2["output_sha256"].items():
              path = root / rel
              assert path.exists(), rel
              assert sha(path) == expected, f"Phase 2 frozen output drift: {rel}"

          for rel in ("free-agent-board.html", "index.html", "data/free_agents.json"):
              expected = p1["input_sha256"][rel]
              actual = sha(root / rel)
              assert actual == expected, (
                  f"Production/input drift since Phase 1 freeze: {rel}: "
                  f"{actual} != {expected}"
              )

          assert p1["counts"]["active_non_k_deployed_entries"] == 364
          assert p1["counts"]["reproducible_candidates"] == 333
          assert p2["phase1"]["active_count"] == 364
          assert p2["phase1"]["candidate_count"] == 333
          assert p2["phase1"]["unresolved_held_count"] == 31

          print("PASS: frozen Phase 1/2 lineage and production inputs are intact.")
          PY

      - name: Write approved Free-Agent Production V2 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model/releases/free-agent-production-v2
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          research = root / "research" / "free-agent-production-v2"
          out = root / "model" / "releases" / "free-agent-production-v2" / "release.json"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          p1 = json.loads((research / "free_agent_production_v2_phase1.json").read_text())
          p2 = json.loads((research / "free_agent_production_v2_phase2_shadow.json").read_text())

          p2_by_id = {
              str(r["sleeper_id"]): r
              for r in p2["candidate_rows"]
          }

          candidates = []
          held = []
          for r in p1["rows"]:
              sid = str(r["sleeper_id"])
              base = {
                  "sleeper_id": sid,
                  "key": r["name"],
                  "pos": r["pos"],
                  "deployed_prod": float(r["deployed_prod"]),
              }
              if r.get("candidate_prod") is None:
                  held.append(base)
              else:
                  shadow = p2_by_id[sid]
                  candidates.append({
                      **base,
                      "candidate_prod": float(r["candidate_prod"]),
                      "phase2_shadow_fv": int(shadow["shadow_fv"]),
                      "phase2_current_fv": int(shadow["current_fv"]),
                  })

          candidates.sort(key=lambda r: (r["key"], r["pos"], r["sleeper_id"]))
          held.sort(key=lambda r: (r["key"], r["pos"], r["sleeper_id"]))

          assert len(candidates) == 333
          assert len(held) == 31
          assert len({r["sleeper_id"] for r in candidates + held}) == 364

          release = {
              "release_id": "free-agent-production-v2",
              "status": "APPROVED_BY_PHASE2_PENDING_PHASE3_DEPLOYMENT",
              "method": "frozen_phase1_candidate_exactly_validated_by_phase2_shadow",
              "candidate_count": len(candidates),
              "held_active_count": len(held),
              "kickers": "out_of_scope_unchanged",
              "candidate_overrides": candidates,
              "held_active_legacy": held,
              "phase1_result_sha256": sha(
                  research / "free_agent_production_v2_phase1.json"
              ),
              "phase1_manifest_sha256": sha(research / "phase1_manifest.json"),
              "phase2_result_sha256": sha(
                  research / "free_agent_production_v2_phase2_shadow.json"
              ),
              "phase2_manifest_sha256": sha(research / "phase2_manifest.json"),
              "deployment_policy": {
                  "only_prod_changes": True,
                  "role_age_team_identity_unchanged": True,
                  "unresolved_rows_hold_deployed_value": True,
                  "canonical_prod_mult_data_unchanged": True,
              },
          }
          out.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n")
          print("Wrote", out, "with", len(candidates), "candidate overrides and", len(held), "held rows.")
          PY

      - name: Write deterministic release applicator
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/model/apply_free_agent_production_v2_release.py <<'PY'
          #!/usr/bin/env python3
          """Apply/check the approved Free-Agent Production V2 release.

          The historical FA_PROD_MULT_DATA object is intentionally preserved.
          A generated release block immediately after it overrides `prod` for
          exactly the approved V2 candidate cohort. Held/unresolved rows and
          kickers remain on the historical table.
          """

          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path
          import subprocess
          import sys

          SCRIPT = Path(__file__).resolve()
          ROOT = SCRIPT.parents[2]
          BOARD = ROOT / "free-agent-board.html"
          RELEASE = ROOT / "model" / "releases" / "free-agent-production-v2" / "release.json"

          START = "/* FREE_AGENT_PRODUCTION_V2_RELEASE_START */"
          END = "/* FREE_AGENT_PRODUCTION_V2_RELEASE_END */"

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def load_sync():
              scripts = ROOT / "scripts"
              if str(scripts) not in sys.path:
                  sys.path.insert(0, str(scripts))
              from sync import sync_free_agent_valuation
              return sync_free_agent_valuation

          def eval_base_table(board_text, sync_mod):
              const_source = sync_mod._extract_const_object(
                  board_text, "FA_PROD_MULT_DATA"
              )[2]
              js = const_source + "\nprocess.stdout.write(JSON.stringify(FA_PROD_MULT_DATA));\n"
              proc = subprocess.run(
                  ["node", "-e", js],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if proc.returncode != 0:
                  raise RuntimeError(proc.stderr.strip())
              return json.loads(proc.stdout)

          def exact_entry(table, key, pos):
              raw = table.get(key)
              vals = raw if isinstance(raw, list) else [raw]
              matches = [
                  v for v in vals
                  if isinstance(v, dict) and str(v.get("pos") or "") == pos
              ]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"Expected exactly one FA table entry for {key!r} {pos}; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          def validate_release_against_base(board_text, release, sync_mod):
              table = eval_base_table(board_text, sync_mod)
              seen = set()
              for group_name in ("candidate_overrides", "held_active_legacy"):
                  for row in release[group_name]:
                      ident = (row["key"], row["pos"], row["sleeper_id"])
                      if ident in seen:
                          raise RuntimeError(f"Duplicate release identity: {ident}")
                      seen.add(ident)
                      entry = exact_entry(table, row["key"], row["pos"])
                      actual = float(entry["prod"])
                      expected = float(row["deployed_prod"])
                      if abs(actual - expected) > 1e-12:
                          raise RuntimeError(
                              f"Historical FA base drift for {ident}: "
                              f"{actual} != {expected}"
                          )
              if len(release["candidate_overrides"]) != 333:
                  raise RuntimeError("Release candidate count is not 333")
              if len(release["held_active_legacy"]) != 31:
                  raise RuntimeError("Release held count is not 31")

          def release_block(release):
              rows = [
                  {
                      "key": r["key"],
                      "pos": r["pos"],
                      "prod": float(r["candidate_prod"]),
                      "sleeper_id": r["sleeper_id"],
                  }
                  for r in release["candidate_overrides"]
              ]
              payload = json.dumps(rows, separators=(",", ":"))
              return (
                  START + "\n"
                  "const FA_PROD_MULT_V2_RELEASE = " + payload + ";\n"
                  "for (const __v2 of FA_PROD_MULT_V2_RELEASE) {\n"
                  "  const __raw = FA_PROD_MULT_DATA[__v2.key];\n"
                  "  const __vals = Array.isArray(__raw) ? __raw : [__raw];\n"
                  "  let __matched = 0;\n"
                  "  for (const __entry of __vals) {\n"
                  "    if (__entry && __entry.pos === __v2.pos) {\n"
                  "      __entry.prod = __v2.prod;\n"
                  "      __matched += 1;\n"
                  "    }\n"
                  "  }\n"
                  "  if (__matched !== 1) {\n"
                  "    throw new Error('FA Production V2 release match failure for ' + "
                  "__v2.sleeper_id + ' ' + __v2.key + ' ' + __v2.pos + ': ' + __matched);\n"
                  "  }\n"
                  "}\n"
                  + END
              )

          def render(board_text, release, sync_mod):
              validate_release_against_base(board_text, release, sync_mod)
              block = release_block(release)
              if START in board_text or END in board_text:
                  if START not in board_text or END not in board_text:
                      raise RuntimeError("Partial FA Production V2 release markers found")
                  s = board_text.index(START)
                  e = board_text.index(END, s) + len(END)
                  return board_text[:s] + block + board_text[e:]

              _, const_end, _ = sync_mod._extract_const_object(
                  board_text, "FA_PROD_MULT_DATA"
              )
              return board_text[:const_end] + "\n\n" + block + board_text[const_end:]

          def main():
              ap = argparse.ArgumentParser()
              mode = ap.add_mutually_exclusive_group(required=True)
              mode.add_argument("--write", action="store_true")
              mode.add_argument("--check", action="store_true")
              mode.add_argument("--selftest", action="store_true")
              args = ap.parse_args()

              sync_mod = load_sync()

              if args.selftest:
                  sample = "const FA_PROD_MULT_DATA = {'x':{pos:'WR',prod:0.15}};\n"
                  release = {
                      "candidate_overrides": [{
                          "key": "x",
                          "pos": "WR",
                          "sleeper_id": "1",
                          "deployed_prod": 0.15,
                          "candidate_prod": 0.25,
                      }],
                      "held_active_legacy": [],
                  }
                  # Test block construction separately; production count guards
                  # intentionally require the real 333/31 release.
                  block = release_block(release)
                  assert START in block and END in block
                  assert '"prod":0.25' in block
                  print("Free-Agent Production V2 release applicator self-test PASS")
                  return

              board = BOARD.read_text(encoding="utf-8")
              release = read_json(RELEASE)
              expected = render(board, release, sync_mod)

              if args.check:
                  if START not in board:
                      raise SystemExit("FA Production V2 release block is absent")
                  # render() replaces an existing block deterministically.
                  if expected != board:
                      raise SystemExit("FA Production V2 release block is stale")
                  print("PASS: Free-Agent Production V2 release block is current")
                  return

              BOARD.write_text(expected, encoding="utf-8")
              print("Wrote", BOARD, "with approved Free-Agent Production V2 release")

          if __name__ == "__main__":
              main()
          PY
          chmod +x scripts/model/apply_free_agent_production_v2_release.py

      - name: Compile and self-test release applicator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/model/apply_free_agent_production_v2_release.py")
          compile(p.read_text(encoding="utf-8"), str(p), "exec")
          print("Release applicator compile PASS")
          PY
          python3 scripts/model/apply_free_agent_production_v2_release.py --selftest

      - name: Apply approved V2 release to free-agent board
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/model/apply_free_agent_production_v2_release.py --write
          python3 scripts/model/apply_free_agent_production_v2_release.py --check

      - name: Confirm deployed board exactly reproduces Phase 2 shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          root = Path(".")
          scripts = root / "scripts"
          validation = scripts / "validation"
          if str(scripts) not in sys.path:
              sys.path.insert(0, str(scripts))
          if str(validation) not in sys.path:
              sys.path.insert(0, str(validation))

          import validate_free_agent_valuation_parity as fa_validator

          phase2_path = root / "research" / "free-agent-production-v2" / "free_agent_production_v2_phase2_shadow.json"
          phase2 = json.loads(phase2_path.read_text())
          release = json.loads(
              (root / "model" / "releases" / "free-agent-production-v2" / "release.json").read_text()
          )
          free_doc = json.loads((root / "data" / "free_agents.json").read_text())
          board_text = (root / "free-agent-board.html").read_text()

          p2_script = root / "research" / "free-agent-production-v2" / "free_agent_production_v2_phase2_shadow.py"
          spec = importlib.util.spec_from_file_location("fa_v2_phase2_frozen", p2_script)
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          runtime = fa_validator._board_runtime_rows(board_text, free_doc)
          by_id = mod.attach_sleeper_ids(runtime["rows"], free_doc, fa_validator)

          candidate_by_id = {
              str(r["sleeper_id"]): r
              for r in phase2["candidate_rows"]
          }
          assert len(candidate_by_id) == 333

          mismatches = []
          for sid, shadow in candidate_by_id.items():
              actual = int(by_id[sid]["val"])
              expected = int(shadow["shadow_fv"])
              if actual != expected:
                  mismatches.append({
                      "sleeper_id": sid,
                      "name": shadow["name"],
                      "expected_shadow_fv": expected,
                      "actual_deployed_fv": actual,
                  })

          if mismatches:
              raise SystemExit(
                  "Deployed board does not reproduce Phase 2 shadow: "
                  + json.dumps(mismatches[:20], indent=2)
              )

          candidate_ids = set(candidate_by_id)
          held_ids = {
              str(r["sleeper_id"]) for r in release["held_active_legacy"]
          }
          assert len(held_ids) == 31
          assert not (candidate_ids & held_ids)

          for sid in candidate_ids:
              assert runtime["production_source_by_id"][sid] == "fa_specific_prod"
          for sid in held_ids:
              assert runtime["production_source_by_id"][sid] == "fa_specific_prod"

          print("PASS: all 333 deployed candidate FVs exactly reproduce Phase 2 shadow.")
          print("PASS: all 31 unresolved active rows remain FA-specific and held.")
          PY

      - name: Validate free-agent parity after deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_free_agent_valuation_parity.py

      - name: Run full repository regression suite after deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Write Phase 3 production confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path(".")
          research = root / "research" / "free-agent-production-v2"
          release_path = root / "model" / "releases" / "free-agent-production-v2" / "release.json"
          apply_path = root / "scripts" / "model" / "apply_free_agent_production_v2_release.py"
          board = root / "free-agent-board.html"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          p2 = json.loads(
              (research / "free_agent_production_v2_phase2_shadow.json").read_text()
          )
          release = json.loads(release_path.read_text())

          result = {
              "study_id": "free-agent-production-v2",
              "phase": 3,
              "status": "PRODUCTION_CONFIRMATION_COMPLETE",
              "decision": "PASS_FA_PROD_V2_PHASE3_CONFIRMED_AND_DEPLOYED",
              "production_change_authorized": True,
              "production_change_applied": True,
              "candidate_count_deployed": len(release["candidate_overrides"]),
              "unresolved_active_held": len(release["held_active_legacy"]),
              "kickers": "unchanged",
              "phase2_decision": p2["decision"],
              "phase2_shadow_exact_reproduction_required": True,
              "canonical_prod_mult_data_changed": False,
              "role_age_team_identity_changed": False,
              "deployment_mechanism": (
                  "generated FA_PROD_MULT_V2_RELEASE block immediately after "
                  "historical FA_PROD_MULT_DATA; exact 333-row prod-only override"
              ),
              "production_files_changed": [
                  "free-agent-board.html",
                  "model/releases/free-agent-production-v2/release.json",
                  "scripts/model/apply_free_agent_production_v2_release.py"
              ],
              "repo_commit_sha_before_deploy": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "sha256": {
                  "free-agent-board.html": sha(board),
                  "model/releases/free-agent-production-v2/release.json": sha(release_path),
                  "scripts/model/apply_free_agent_production_v2_release.py": sha(apply_path),
                  "phase1_manifest.json": sha(research / "phase1_manifest.json"),
                  "phase2_manifest.json": sha(research / "phase2_manifest.json"),
              },
              "phase2_diagnostics_carried_forward": {
                  "candidate_changed_fv_count": p2["diagnostics"]["candidate_changed_fv_count"],
                  "candidate_increased_fv_count": p2["diagnostics"]["candidate_increased_fv_count"],
                  "candidate_decreased_fv_count": p2["diagnostics"]["candidate_decreased_fv_count"],
                  "active_rank_spearman": p2["diagnostics"]["active_rank_spearman"],
                  "top_overlap": p2["diagnostics"]["top_overlap"],
              },
          }

          json_path = research / "phase3_production_confirmation.json"
          md_path = research / "phase3_production_confirmation.md"
          json_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")

          d = result["phase2_diagnostics_carried_forward"]
          md = f"""# Free-Agent Production V2 — Phase 3 Production Confirmation

          **Decision:** `{result['decision']}`

          Free-Agent Production V2 is now deployed.

          - Approved candidate overrides deployed: **{result['candidate_count_deployed']}**
          - Unresolved active FA-specific rows held at legacy values: **{result['unresolved_active_held']}**
          - Kickers changed: **0**
          - Canonical `PROD_MULT_DATA` changed: **No**
          - Role/age/team/identity logic changed: **No**
          - Phase 2 shadow FV reproduced exactly for all candidates: **Yes**
          - Full free-agent parity validation: **PASS**
          - Full repository regression suite after deployment: **PASS**

          ## Carried-forward Phase 2 movement

          - Candidate rows with changed FV: **{d['candidate_changed_fv_count']}**
          - Increased FV: **{d['candidate_increased_fv_count']}**
          - Decreased FV: **{d['candidate_decreased_fv_count']}**
          - Active-cohort rank Spearman: **{d['active_rank_spearman']:.4f}**
          - Top-25 overlap: **{d['top_overlap']['top25']['overlap_share']:.1%}**
          - Top-50 overlap: **{d['top_overlap']['top50']['overlap_share']:.1%}**
          - Top-100 overlap: **{d['top_overlap']['top100']['overlap_share']:.1%}**

          ## Deployment architecture

          The historical `FA_PROD_MULT_DATA` object remains intact as the legacy baseline.
          A generated `FA_PROD_MULT_V2_RELEASE` block overrides production multipliers for
          exactly the 333 Phase 1 candidates validated in Phase 2. The 31 unresolved active
          rows remain on their historical values. This makes the deployment deterministic,
          auditable, reversible, and checkable with
          `scripts/model/apply_free_agent_production_v2_release.py --check`.
          """
          md_path.write_text(
              "\n".join(line.strip() for line in md.splitlines()) + "\n"
          )

          manifest = {
              "study_id": result["study_id"],
              "phase": 3,
              "decision": result["decision"],
              "production_change_applied": True,
              "release_sha256": sha(release_path),
              "board_sha256": sha(board),
              "apply_script_sha256": sha(apply_path),
              "phase3_result_sha256": sha(json_path),
              "phase3_markdown_sha256": sha(md_path),
          }
          (research / "phase3_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )

          print(json.dumps({
              "decision": result["decision"],
              "candidate_count_deployed": result["candidate_count_deployed"],
              "unresolved_active_held": result["unresolved_active_held"],
          }, indent=2))
          PY

      - name: Prove immutable production inputs and exact deployment diff
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          sha256sum -c "${RUNNER_TEMP}/phase3-immutable-production-inputs.sha256"

          python3 - <<'PY'
          import subprocess

          expected = {
              "free-agent-board.html",
              "model/releases/free-agent-production-v2/release.json",
              "scripts/model/apply_free_agent_production_v2_release.py",
              "research/free-agent-production-v2/phase3_production_confirmation.json",
              "research/free-agent-production-v2/phase3_production_confirmation.md",
              "research/free-agent-production-v2/phase3_manifest.json",
          }

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          actual = set()
          for line in raw.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              actual.add(path)

          if actual != expected:
              raise SystemExit(
                  "Phase 3 deployment diff mismatch.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(actual)}"
              )
          print("PASS: exact six-file Phase 3 deployment diff.")
          PY

      - name: Commit confirmed Free-Agent Production V2 deployment
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            free-agent-board.html \
            model/releases/free-agent-production-v2/release.json \
            scripts/model/apply_free_agent_production_v2_release.py \
            research/free-agent-production-v2/phase3_production_confirmation.json \
            research/free-agent-production-v2/phase3_production_confirmation.md \
            research/free-agent-production-v2/phase3_manifest.json

          git diff --cached --quiet && {
            echo "No Phase 3 deployment changes to commit"
            exit 1
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during Phase 3. Refusing to commit stale deployment."
            echo "Local HEAD:  $(git rev-parse HEAD)"
            echo "Origin main: $(git rev-parse origin/main)"
            exit 1
          fi

          git commit -m "Deploy Free-Agent Production V2"
          git push origin HEAD:main
