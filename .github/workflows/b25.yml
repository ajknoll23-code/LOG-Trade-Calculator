# PREFLIGHTED: B25_DRAFT_CAPITAL_OUTLOOK_V2_PHASE0B_FIVE_SOURCE_ENSEMBLE_FEASIBILITY
name: B25 Draft Capital Outlook V2 - Phase 0B Five-Source Ensemble K60 Input Feasibility

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b25_v2_phase0b_ensemble_source_feasibility:
    name: Metadata-only five-source ensemble feasibility - no player identities, outcomes, or scoring
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.32.5" \
            "beautifulsoup4==4.13.5"

      - name: Guard B24 scientific stop and Phase 0B authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          B24=Path("research/draft-capital-outlook-v2/b24/b24_manifest.json")
          assert B24.is_file(), B24
          j=json.loads(B24.read_text())

          assert j["study_id"]=="draft-capital-outlook-v2"
          assert j["stage"]=="b24_manifest"
          assert j["b24_executed"] is True
          assert j["b24_execution_count_committed"]==1
          assert j["decision"]=="STOP_EXACT_WALTER_PATH_AUTHORIZE_V2_PHASE0B_ENSEMBLE_K60_SOURCE_AUDIT"
          assert j["same_source_k60_feasible"] is False
          assert j["same_source_k32_fallback_available"] is False
          assert j["v2_phase0b_ensemble_k60_source_audit_authorized"] is True
          assert j["architecture_freeze_authorized"] is False
          assert j["v2_predictor_target_association_authorized"] is False
          assert j["2027_class_scored"] is False
          assert j["production_change_authorized"] is False

          print("PASS: B24 authorizes source-only Phase 0B ensemble feasibility and still forbids architecture opening, association, scoring, and production.")
          PY

      - name: Guard historical anchor-distance precedent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("research/draft-capital-outlook-v1/b17d/b17d_source_regime_audit.json")
          assert p.is_file(), p
          j=json.loads(p.read_text())

          accepted=[
              x for x in j["classes"]
              if x.get("status") in {"EXISTING_ACCEPTED","SOURCE_FEASIBLE_TRANSPORT_ONLY"}
              and x.get("class_year") in set(range(2013,2024))
          ]
          assert len(accepted)==11, len(accepted)
          distances=[int(x["distance_days"]) for x in accepted]
          assert max(distances)==8, distances
          assert all(x["author_class"]=="WALT_EXPLICIT" for x in accepted)
          assert all(x["order_method_class"]=="POWER_RANKINGS" for x in accepted)

          print({"historical_classes":len(accepted),"maximum_anchor_distance_days":max(distances)})
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze Phase 0B five-source source-only contract before network access
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/draft-capital-outlook-v2/b25
          mkdir -p research/draft-capital-outlook-v2/b25

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v2/b25")
          p=O/"b25_phase0b_preregistration.json"

          cfg={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v2",
            "stage":"b25_phase0b_five_source_ensemble_input_feasibility_preregistration",
            "created_before_b25_network_access":True,
            "created_before_predictor_composition_inspection":True,
            "created_before_any_v2_predictor_target_association":True,
            "objective":"Determine whether five independently published, contemporaneous, public 2027 NFL first-round mock drafts provide enough structural input depth to justify freezing a multi-mock K60 ensemble architecture. Do not inspect or persist player identities.",
            "anchor_contract":{
              "target_date":"2026-09-30",
              "maximum_absolute_distance_days":8,
              "justification":"Frozen maximum distance observed among the 11 accepted 2013-2023 historical predictor anchors in B17D."
            },
            "source_selection_contract":{
              "selection_method":"FROZEN_EXACT_SOURCE_SET",
              "minimum_independent_publishers_required":5,
              "minimum_explicit_picks_per_source":32,
              "source_substitution_allowed":False,
              "source_addition_allowed_after_network_access":False,
              "source_removal_allowed_after_network_access":False,
              "same_publisher_multiple_analysts_count_as_independent":False,
              "syndicated_copy_counts_as_independent":False,
              "simulator_output_allowed":False,
              "big_board_allowed":False,
              "consensus_board_allowed":False,
              "player_identity_inspection_allowed":False,
              "player_name_persistence_allowed":False
            },
            "sources":[
              {
                "source_id":"walter_charlie_2026_09_25",
                "publisher":"WalterFootball",
                "author":"Charlie Campbell",
                "publication_date":"2026-09-25",
                "publisher_domain":"walterfootball.com",
                "pages":[
                  {
                    "role":"picks_1_16",
                    "url":"https://walterfootball.com/draft2027charlie.php",
                    "minimum_explicit_picks":16
                  },
                  {
                    "role":"picks_17_32",
                    "url":"https://walterfootball.com/draft2027charlie_1.php",
                    "minimum_explicit_picks":16
                  }
                ]
              },
              {
                "source_id":"si_manzano_2026_09_23",
                "publisher":"Sports Illustrated",
                "author":"Gilberto Manzano",
                "publication_date":"2026-09-23",
                "publisher_domain":"si.com",
                "pages":[
                  {
                    "role":"picks_1_32",
                    "url":"https://www.si.com/nfl/2027-nfl-mock-draft-includes-seven-qbs-first-round-arch-manning",
                    "minimum_explicit_picks":32
                  }
                ]
              },
              {
                "source_id":"cbs_renner_2026_09_28",
                "publisher":"CBS Sports",
                "author":"Mike Renner",
                "publication_date":"2026-09-28",
                "publisher_domain":"cbssports.com",
                "pages":[
                  {
                    "role":"picks_1_32",
                    "url":"https://www.cbssports.com/nfl/draft/news/2027-nfl-mock-draft-dolphins-jeremiah-smith-arch-manning-to-cardinals/",
                    "minimum_explicit_picks":32
                  }
                ]
              },
              {
                "source_id":"athlon_easterling_2026_09_24",
                "publisher":"Athlon Sports",
                "author":"Luke Easterling",
                "publication_date":"2026-09-24",
                "publisher_domain":"athlonsports.com",
                "pages":[
                  {
                    "role":"picks_1_32",
                    "url":"https://athlonsports.com/nfl/2027-nfl-mock-draft-darian-mensah-trinidad-chambliss-arch-manning-dante-moore",
                    "minimum_explicit_picks":32
                  }
                ]
              },
              {
                "source_id":"clutchpoints_crean_2026_09_29",
                "publisher":"ClutchPoints",
                "author":"Tim Crean",
                "publication_date":"2026-09-29",
                "publisher_domain":"clutchpoints.com",
                "pages":[
                  {
                    "role":"picks_1_32",
                    "url":"https://clutchpoints.com/nfl/nfl-stories/2027-nfl-mock-draft-ahead-week-4-2026",
                    "minimum_explicit_picks":32
                  }
                ]
              }
            ],
            "feasibility_rule":"PASS only if all five frozen publishers remain publicly retrievable, each publication date is within +/-8 days of 2026-09-30, author/date markers are present, no paywall/auth wall is detected, and at least 32 explicit pick numbers are structurally detectable per source without extracting player identities.",
            "pass_decision":"PASS_V2_PHASE0B_FIVE_SOURCE_ENSEMBLE_INPUT_FEASIBLE_AUTHORIZE_PHASE0C_ARCHITECTURE_FREEZE_ONLY",
            "stop_decision":"STOP_V2_ENSEMBLE_SOURCE_PATH_KEEP_NEUTRAL_NO_ARCHITECTURE",
            "next_stage_if_pass":"B26_PHASE0C_FREEZE_EXACT_ENSEMBLE_MATH_BEFORE_PLAYER_IDENTITIES_OR_OUTCOMES",
            "forbidden_in_b25":[
              "player-name extraction",
              "player-rank extraction",
              "team-player pairing extraction",
              "mock consensus calculation",
              "K60 player construction",
              "Rich Hill value lookup",
              "historical actual-capital target loading",
              "predictor-target association",
              "correlation",
              "regression",
              "permutation testing",
              "multiplier calculation",
              "2027 class scoring",
              "FV change",
              "production deployment"
            ],
            "architecture_freeze_authorized":False,
            "v2_predictor_target_association_authorized":False,
            "2027_class_scoring_authorized":False,
            "production_change_authorized":False
          }

          domains=[x["publisher_domain"] for x in cfg["sources"]]
          assert len(cfg["sources"])==5
          assert len(set(domains))==5
          assert cfg["source_selection_contract"]["minimum_independent_publishers_required"]==5
          assert cfg["source_selection_contract"]["source_substitution_allowed"] is False

          p.write_text(json.dumps(cfg,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (O/"b25_preregistration.sha256").write_text(f"{h}  {p.name}\n")
          print(json.dumps({"preregistration_sha256":h,"source_count":len(cfg["sources"])},indent=2))
          PY

      - name: Execute metadata-only five-source feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,time
          from datetime import date,datetime,timezone
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from bs4 import BeautifulSoup

          O=Path("research/draft-capital-outlook-v2/b25")
          P=json.loads((O/"b25_phase0b_preregistration.json").read_text())
          sha=lambda b: hashlib.sha256(b).hexdigest()

          expected=(O/"b25_preregistration.sha256").read_text().split()[0]
          assert sha((O/"b25_phase0b_preregistration.json").read_bytes())==expected

          target=date.fromisoformat(P["anchor_contract"]["target_date"])
          max_dist=int(P["anchor_contract"]["maximum_absolute_distance_days"])

          # This workflow intentionally never extracts player links, player names,
          # team-player pairs, or ranking content. Only document metadata and pick
          # number structure are inspected.
          forbidden_code_tokens=(
              "rich_hill_pick_values",
              "actual_top60",
              "b19/c1_result",
              "b21_historical_calibration",
          )
          source_text=Path(".github/workflows/b25.yml").read_text().lower()
          for token in forbidden_code_tokens:
              assert token not in source_text, token

          sess=requests.Session()
          sess.headers.update({
            "User-Agent":"LOG-Draft-Capital-Outlook-V2-B25/1.0 (+source-only structural audit; GitHub Actions)",
            "Accept":"text/html,application/xhtml+xml;q=0.9,*/*;q=0.5",
            "Accept-Language":"en-US,en;q=0.9",
          })

          transient_codes={408,425,429}
          paywall_markers=(
              "subscribe to continue",
              "subscription required",
              "sign in to continue",
              "login to continue",
              "join premium now",
              "walterfootball premium",
              "this content is for subscribers",
          )

          def normalize_text(raw):
              soup=BeautifulSoup(raw,"html.parser")
              for tag in soup(["script","style","noscript","svg"]):
                  tag.decompose()
              return "\n".join(
                  re.sub(r"\s+"," ",x).strip()
                  for x in soup.stripped_strings
                  if re.sub(r"\s+"," ",x).strip()
              )

          def author_present(text, author):
              parts=[x for x in re.split(r"\s+",author.strip()) if x]
              return all(re.search(rf"\b{re.escape(x)}\b",text,re.I) for x in parts)

          def date_present(text, iso):
              d=date.fromisoformat(iso)
              month_full=d.strftime("%B")
              month_abbr=d.strftime("%b")
              day=str(d.day)
              year=str(d.year)
              pats=[
                  rf"\b{re.escape(month_full)}\s+0?{day},?\s+{year}\b",
                  rf"\b{re.escape(month_abbr)}\.?\s+0?{day},?\s+{year}\b",
                  rf"\b{d.month}/0?{day}/{year}\b",
                  rf"\b0?{d.month}/0?{day}/{str(year)[2:]}\b",
              ]
              return any(re.search(p,text,re.I) for p in pats)

          def pick_numbers(raw):
              soup=BeautifulSoup(raw,"html.parser")
              nums=set()

              # Strategy 1: semantic headings.
              for tag in soup.find_all(re.compile(r"^h[1-6]$")):
                  t=re.sub(r"\s+"," ",tag.get_text(" ",strip=True))
                  for pat in (
                      r"^(?:No\.?\s*)?(\d{1,2})\s*[\.\):\-]",
                      r"^(?:Pick\s*)#?\s*(\d{1,2})\b",
                  ):
                      m=re.search(pat,t,re.I)
                      if m and 1<=int(m.group(1))<=32:
                          nums.add(int(m.group(1)))

              # Strategy 2: table/list first-cell pick numbers.
              for row in soup.find_all(["tr","li"]):
                  t=re.sub(r"\s+"," ",row.get_text(" ",strip=True))
                  m=re.match(r"^(?:No\.?\s*|Pick\s*#?\s*)?(\d{1,2})\s*[\.\):\-]?\s+",t,re.I)
                  if m and 1<=int(m.group(1))<=32:
                      nums.add(int(m.group(1)))

              # Strategy 3: visible line starts. Require full 1..32 coverage later,
              # which prevents incidental statistics from satisfying feasibility.
              visible=normalize_text(raw)
              for line in visible.splitlines():
                  for pat in (
                      r"^(?:No\.?\s*)?(\d{1,2})\s*[\.\):\-]\s+",
                      r"^Pick\s*#?\s*(\d{1,2})\b",
                  ):
                      m=re.search(pat,line,re.I)
                      if m and 1<=int(m.group(1))<=32:
                          nums.add(int(m.group(1)))

              return sorted(nums)

          def fetch(url):
              response=None
              last=None
              for delay in (0,3,9):
                  if delay:
                      time.sleep(delay)
                  try:
                      r=sess.get(url,timeout=60,allow_redirects=True)
                      if r.status_code in transient_codes or 500<=r.status_code<=599:
                          last=f"HTTP {r.status_code}"
                          continue
                      response=r
                      break
                  except requests.RequestException as e:
                      last=f"{type(e).__name__}: {e}"
              if response is None:
                  raise RuntimeError(f"technical retrieval failure after retries for {url}: {last}")
              return response

          results=[]
          for src in P["sources"]:
              pub_date=date.fromisoformat(src["publication_date"])
              distance=abs((pub_date-target).days)
              source_pages=[]
              source_numbers=set()
              source_structural_ok=True
              structural_reasons=[]

              if distance>max_dist:
                  source_structural_ok=False
                  structural_reasons.append(f"anchor_distance_{distance}_exceeds_{max_dist}")

              for page in src["pages"]:
                  r=fetch(page["url"])
                  raw=r.content
                  text=normalize_text(raw)
                  low=text.lower()
                  final_host=(urlparse(r.url).hostname or "").lower()
                  domain_ok=src["publisher_domain"] in final_host
                  authwall=any(x in low for x in paywall_markers)
                  author_ok=author_present(text,src["author"])
                  date_ok=date_present(text,src["publication_date"])
                  nums=pick_numbers(raw)

                  # Per-page structural minimum is based only on explicit pick-number coverage.
                  min_picks=int(page["minimum_explicit_picks"])
                  page_ok=(
                      r.status_code==200
                      and domain_ok
                      and not authwall
                      and author_ok
                      and date_ok
                      and len(nums)>=min_picks
                  )
                  if not page_ok:
                      source_structural_ok=False
                      if r.status_code!=200:
                          structural_reasons.append(f"{page['role']}_http_{r.status_code}")
                      if not domain_ok:
                          structural_reasons.append(f"{page['role']}_domain_mismatch")
                      if authwall:
                          structural_reasons.append(f"{page['role']}_paywall_or_auth")
                      if not author_ok:
                          structural_reasons.append(f"{page['role']}_author_marker_missing")
                      if not date_ok:
                          structural_reasons.append(f"{page['role']}_date_marker_missing")
                      if len(nums)<min_picks:
                          structural_reasons.append(f"{page['role']}_explicit_pick_count_{len(nums)}_lt_{min_picks}")

                  source_numbers.update(nums)
                  source_pages.append({
                      "role":page["role"],
                      "requested_url":page["url"],
                      "final_url":r.url,
                      "status_code":r.status_code,
                      "content_sha256":sha(raw),
                      "content_bytes":len(raw),
                      "publisher_domain_match":domain_ok,
                      "paywall_or_auth_wall":authwall,
                      "author_marker_present":author_ok,
                      "publication_date_marker_present":date_ok,
                      "explicit_pick_numbers_detected":nums,
                      "explicit_pick_count_detected":len(nums),
                      "minimum_explicit_picks_required":min_picks,
                      "page_structurally_feasible":page_ok,
                  })

              # Multi-page source coverage is the union of explicit pick numbers.
              source_total_ok=source_structural_ok and set(range(1,33)).issubset(source_numbers)
              if not set(range(1,33)).issubset(source_numbers):
                  structural_reasons.append("source_missing_complete_1_through_32_pick_number_coverage")

              results.append({
                  "source_id":src["source_id"],
                  "publisher":src["publisher"],
                  "author":src["author"],
                  "publication_date":src["publication_date"],
                  "anchor_distance_days":distance,
                  "publisher_domain":src["publisher_domain"],
                  "pages":source_pages,
                  "source_explicit_pick_numbers_detected":sorted(source_numbers),
                  "source_explicit_pick_count_detected":len(source_numbers),
                  "source_structurally_feasible":source_total_ok,
                  "structural_reasons":sorted(set(structural_reasons)),
              })

          domains=[x["publisher_domain"] for x in results]
          distinct_publishers=len(set(domains))
          feasible=[x for x in results if x["source_structurally_feasible"]]

          pass_all=(
              len(results)==5
              and distinct_publishers==5
              and len(feasible)==5
          )

          decision=P["pass_decision"] if pass_all else P["stop_decision"]

          out={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v2",
            "stage":"b25_phase0b_five_source_ensemble_input_feasibility",
            "executed_at_utc":datetime.now(timezone.utc).isoformat(),
            "preregistration_sha256":expected,
            "target_anchor_date":P["anchor_contract"]["target_date"],
            "maximum_anchor_distance_days":max_dist,
            "frozen_source_count":len(results),
            "distinct_publisher_count":distinct_publishers,
            "structurally_feasible_source_count":len(feasible),
            "all_five_sources_structurally_feasible":pass_all,
            "sources":results,
            "player_identities_extracted":False,
            "player_names_persisted":False,
            "predictor_composition_inspected":False,
            "ensemble_math_defined":False,
            "K60_player_construct_built":False,
            "actual_capital_loaded":False,
            "predictor_target_association_computed":False,
            "correlation_computed":False,
            "regression_computed":False,
            "permutation_test_computed":False,
            "multiplier_computed":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "decision":decision,
          }

          (O/"b25_source_feasibility.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")

          report=[
              "# Draft Capital Outlook V2 — B25 Phase 0B Five-Source Ensemble Input Feasibility",
              "",
              f"Decision: **{decision}**",
              "",
              "This is a source-structure audit only. Player identities, player rankings, team-player pairings, historical actual capital, predictor-target associations, multipliers, and 2027 scores were not opened.",
              "",
              f"- Frozen source count: **{len(results)}**",
              f"- Distinct publisher count: **{distinct_publishers}**",
              f"- Structurally feasible sources: **{len(feasible)} / 5**",
              f"- Historical anchor tolerance: **±{max_dist} days around {P['anchor_contract']['target_date']}**",
              "",
          ]
          for x in results:
              report.append(
                  f"- {x['publisher']} / {x['author']} ({x['publication_date']}): "
                  f"{'PASS' if x['source_structurally_feasible'] else 'NOT FEASIBLE'}; "
                  f"anchor distance={x['anchor_distance_days']}d; "
                  f"explicit pick-number coverage={x['source_explicit_pick_count_detected']}/32; "
                  f"reasons={x['structural_reasons'] or ['none']}"
              )
          report += [
              "",
              "A B25 PASS authorizes only B26: freeze the exact ensemble/censoring/aggregation architecture while player identities remain unopened. It does not authorize predictor construction or any outcome association.",
          ]
          (O/"b25_report.md").write_text("\n".join(report)+"\n")

          print(json.dumps({
              "decision":decision,
              "feasible_source_count":len(feasible),
              "distinct_publisher_count":distinct_publishers,
          },indent=2))
          PY

      - name: Audit B25 scientific firewall and write manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v2/b25")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          prereg=O/"b25_phase0b_preregistration.json"
          result=O/"b25_source_feasibility.json"
          report=O/"b25_report.md"

          for p in (prereg,result,report,O/"b25_preregistration.sha256"):
              assert p.is_file(),p

          P=json.loads(prereg.read_text())
          R=json.loads(result.read_text())

          assert R["preregistration_sha256"]==sha(prereg)
          assert R["frozen_source_count"]==5
          assert R["distinct_publisher_count"]==5
          assert R["player_identities_extracted"] is False
          assert R["player_names_persisted"] is False
          assert R["predictor_composition_inspected"] is False
          assert R["ensemble_math_defined"] is False
          assert R["K60_player_construct_built"] is False
          assert R["actual_capital_loaded"] is False
          assert R["predictor_target_association_computed"] is False
          assert R["correlation_computed"] is False
          assert R["regression_computed"] is False
          assert R["permutation_test_computed"] is False
          assert R["multiplier_computed"] is False
          assert R["2027_class_scored"] is False
          assert R["production_change_authorized"] is False
          assert R["decision"] in {P["pass_decision"],P["stop_decision"]}

          b26_authorized=R["decision"]==P["pass_decision"]

          manifest={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v2",
            "stage":"b25_manifest",
            "b25_executed":True,
            "b25_execution_count_committed":1,
            "decision":R["decision"],
            "frozen_source_count":R["frozen_source_count"],
            "distinct_publisher_count":R["distinct_publisher_count"],
            "structurally_feasible_source_count":R["structurally_feasible_source_count"],
            "all_five_sources_structurally_feasible":R["all_five_sources_structurally_feasible"],
            "b26_phase0c_architecture_freeze_authorized":b26_authorized,
            "player_identity_open_authorized":False,
            "predictor_construction_authorized":False,
            "v2_predictor_target_association_authorized":False,
            "2027_class_scoring_authorized":False,
            "production_change_authorized":False,
            "output_hashes":{
              "b25_phase0b_preregistration.json":sha(prereg),
              "b25_source_feasibility.json":sha(result),
              "b25_report.md":sha(report),
            },
          }

          mp=O/"b25_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          files=[prereg,result,report,mp]
          (O/"b25_hashes.sha256").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files))

          print(json.dumps(manifest,indent=2))
          PY

      - name: Run repository regression after B25 artifacts
        shell: bash
        run: |
          set -euo pipefail

          ROOT="research/draft-capital-outlook-v2/b25"
          PRESERVE_DIR="$(mktemp -d)"
          PRESERVE_ARCHIVE="$PRESERVE_DIR/b25.tar"

          tar -C "$ROOT" -cf "$PRESERVE_ARCHIVE" .

          restore_b25() {
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            tar -C "$ROOT" -xf "$PRESERVE_ARCHIVE"
            rm -rf "$PRESERVE_DIR"
          }
          trap restore_b25 EXIT

          python3 scripts/validation/repo_regression_checks.py

          restore_b25
          trap - EXIT

      - name: Commit B25 source-only feasibility artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v2/b25
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No B25 changes to commit."
            exit 1
          fi
          git commit -m "B25 draft capital outlook V2 five-source ensemble feasibility"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final clean-state confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B25 complete. A scientific source-feasibility stop is intentionally GREEN."
