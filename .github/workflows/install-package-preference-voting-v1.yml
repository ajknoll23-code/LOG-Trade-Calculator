name: Install Package Preference Voting V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate frozen package-vote challenge catalog
        shell: bash
        run: |
          mkdir -p research/package-adjustment-v1 scripts/market

          cat > research/package-adjustment-v1/generate_package_vote_challenges.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import bisect
          import hashlib
          import json
          import math
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          VALUES = ROOT / "scripts" / "artifacts" / "generated" / "value_uncertainty.json"
          ROSTERS = ROOT / "data" / "league_rosters.json"
          OUT = ROOT / "research" / "package-adjustment-v1" / "package_vote_challenges.json"

          RATIO_TARGETS = (0.95, 1.05, 1.15, 1.30)
          PACKAGE_SIZES = (2, 3)
          ANCHORS_PER_POSITION = 2
          MAX_PIECE_TO_TARGET = 0.85
          MIN_PIECE_TO_TARGET = 0.06
          MAX_RATIO_ERROR = 0.025

          POS_MAP = {
              "QB":"QB","RB":"RB","WR":"WR","TE":"TE","K":"K",
              "DL":"DL","DE":"DL","DT":"DL",
              "LB":"LB","OLB":"LB","ILB":"LB",
              "DB":"DB","CB":"DB","S":"DB","SS":"DB","FS":"DB",
          }

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def normalize_name(value):
              s = str(value or "").strip().lower()
              s = re.sub(r"[.'’\-]", "", s)
              return re.sub(r"\s+", " ", s).strip()

          def normalize_pos(value):
              return POS_MAP.get(str(value or "").upper())

          def finite(value):
              try:
                  x = float(value)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def fragmentation(values):
              total = sum(values)
              if total <= 0:
                  return 0.0
              return 1.0 - sum((v / total) ** 2 for v in values)

          def nearest_two(candidates, desired, used):
              i, j = 0, len(candidates) - 1
              best = None
              while i < j:
                  a, b = candidates[i], candidates[j]
                  total = a["fv"] + b["fv"]
                  key = tuple(sorted((a["key"], b["key"])))
                  if key not in used:
                      cand = (abs(total - desired), key, [a, b], total)
                      if best is None or cand[:2] < best[:2]:
                          best = cand
                  if total < desired:
                      i += 1
                  else:
                      j -= 1
              return best

          def nearest_three(candidates, desired, used):
              vals = [p["fv"] for p in candidates]
              best = None
              n = len(candidates)
              for i in range(n - 2):
                  for j in range(i + 1, n - 1):
                      need = desired - candidates[i]["fv"] - candidates[j]["fv"]
                      k0 = bisect.bisect_left(vals, need, j + 1)
                      for k in (k0 - 1, k0, k0 + 1):
                          if k <= j or k >= n:
                              continue
                          trio = [candidates[i], candidates[j], candidates[k]]
                          key = tuple(sorted(p["key"] for p in trio))
                          if key in used:
                              continue
                          total = sum(p["fv"] for p in trio)
                          cand = (abs(total - desired), key, trio, total)
                          if best is None or cand[:2] < best[:2]:
                              best = cand
              return best

          def main():
              values_doc = read_json(VALUES)
              rosters_doc = read_json(ROSTERS)

              value_index = {}
              for name, row in (values_doc.get("players") or {}).items():
                  fv = finite(row.get("center_value"))
                  pos = normalize_pos(row.get("pos"))
                  if fv is None or fv <= 0 or not pos or pos == "K":
                      continue
                  value_index[normalize_name(name)] = {"fv": fv, "pos": pos}

              rostered = {}
              for roster in rosters_doc.get("rosters") or []:
                  for slot in ("starters", "bench", "taxi", "reserve_ir"):
                      for raw in roster.get(slot) or []:
                          key = normalize_name(raw.get("name"))
                          row = value_index.get(key)
                          if not row:
                              continue
                          rostered[key] = {
                              "key": key,
                              "name": str(raw.get("name") or key),
                              "pos": row["pos"],
                              "fv": float(row["fv"]),
                              "team": raw.get("team"),
                              "age": raw.get("age"),
                          }

              players = sorted(rostered.values(), key=lambda p: (-p["fv"], p["key"]))
              if len(players) < 350:
                  raise RuntimeError(f"too few rostered valued players: {len(players)}")

              anchors = []
              for pos in ("QB","RB","WR","TE","DL","LB","DB"):
                  anchors.extend([p for p in players if p["pos"] == pos][:ANCHORS_PER_POSITION])

              challenges = []
              used_packages = set()

              for anchor in anchors:
                  target = anchor["fv"]
                  candidates = [
                      p for p in players
                      if p["key"] != anchor["key"]
                      and p["fv"] <= target * MAX_PIECE_TO_TARGET
                      and p["fv"] >= target * MIN_PIECE_TO_TARGET
                  ]
                  candidates.sort(key=lambda p: (p["fv"], p["key"]))

                  for size in PACKAGE_SIZES:
                      for ratio_target in RATIO_TARGETS:
                          desired = target * ratio_target
                          found = (
                              nearest_two(candidates, desired, used_packages)
                              if size == 2
                              else nearest_three(candidates, desired, used_packages)
                          )
                          if not found:
                              continue

                          _err, package_key, package, total = found
                          actual_ratio = total / target
                          if abs(actual_ratio - ratio_target) > MAX_RATIO_ERROR:
                              continue

                          used_packages.add(package_key)
                          frag = fragmentation([p["fv"] for p in package])
                          gap = max(0.0, 1.0 - max(p["fv"] for p in package) / target)
                          challenge_id = (
                              f"pkgv1_{anchor['pos'].lower()}_"
                              f"{anchor['key'].replace(' ', '_')}_"
                              f"{size}x_{int(round(ratio_target * 100)):03d}"
                          )

                          challenges.append({
                              "id": challenge_id,
                              "schema_version": 1,
                              "target": {
                                  "key": anchor["key"],
                                  "name": anchor["name"],
                                  "pos": anchor["pos"],
                                  "team": anchor.get("team"),
                                  "age": anchor.get("age"),
                                  "fv": round(target, 3),
                              },
                              "package": [{
                                  "key": p["key"],
                                  "name": p["name"],
                                  "pos": p["pos"],
                                  "team": p.get("team"),
                                  "age": p.get("age"),
                                  "fv": round(p["fv"], 3),
                              } for p in package],
                              "package_size": size,
                              "target_fv": round(target, 3),
                              "package_fv": round(total, 3),
                              "raw_package_to_target_ratio": round(actual_ratio, 6),
                              "ratio_target": ratio_target,
                              "fragmentation": round(frag, 8),
                              "best_asset_gap": round(gap, 8),
                              "fg": round(frag * gap, 8),
                          })

              ids = [c["id"] for c in challenges]
              if len(ids) != len(set(ids)):
                  raise RuntimeError("duplicate package challenge ids")
              if len(challenges) < 70:
                  raise RuntimeError(f"challenge catalog too small: {len(challenges)}")

              by_size, by_pos, by_ratio = {}, {}, {}
              for c in challenges:
                  by_size[str(c["package_size"])] = by_size.get(str(c["package_size"]), 0) + 1
                  pos = c["target"]["pos"]
                  by_pos[pos] = by_pos.get(pos, 0) + 1
                  key = f"{c['ratio_target']:.2f}"
                  by_ratio[key] = by_ratio.get(key, 0) + 1

              doc = {
                  "schema_version": 1,
                  "status": "frozen_package_preference_v1",
                  "consumer_changed": False,
                  "frozen": True,
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "regeneration_policy": "Do not regenerate from vote outcomes; future changes require a versioned V2.",
                  "display_policy": "Names/team/position/age only. Fundamental values and geometry stay hidden.",
                  "source_sha256": {
                      str(VALUES.relative_to(ROOT)): sha256(VALUES),
                      str(ROSTERS.relative_to(ROOT)): sha256(ROSTERS),
                  },
                  "design": {
                      "ratio_targets": list(RATIO_TARGETS),
                      "package_sizes": list(PACKAGE_SIZES),
                      "anchors_per_position": ANCHORS_PER_POSITION,
                      "max_piece_to_target": MAX_PIECE_TO_TARGET,
                      "min_piece_to_target": MIN_PIECE_TO_TARGET,
                      "max_ratio_error": MAX_RATIO_ERROR,
                      "pick_assets_included": False,
                  },
                  "counts": {
                      "challenge_count": len(challenges),
                      "by_package_size": by_size,
                      "by_target_position": by_pos,
                      "by_ratio_target": by_ratio,
                  },
                  "challenges": challenges,
              }
              OUT.write_text(json.dumps(doc, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(f"Wrote {OUT.relative_to(ROOT)} with {len(challenges)} challenges")

          if __name__ == "__main__":
              main()
          PY

          chmod +x research/package-adjustment-v1/generate_package_vote_challenges.py
          python3 research/package-adjustment-v1/generate_package_vote_challenges.py

      - name: Create Package Preference V1 aggregation pipeline
        shell: bash
        run: |
          cat > scripts/market/package_vote_pipeline.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import io
          import json
          import math
          import sys
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          SCRIPT_DIR = Path(__file__).resolve().parent
          ROOT = SCRIPT_DIR.parents[1]
          sys.path.insert(0, str(SCRIPT_DIR))
          import ktc_pipeline

          CHALLENGES = ROOT / "research" / "package-adjustment-v1" / "package_vote_challenges.json"
          OUT_JSON = ROOT / "research" / "package-adjustment-v1" / "package_vote_results.json"
          OUT_MD = ROOT / "research" / "package-adjustment-v1" / "package_vote_results.md"

          PREFIX = "__pkgv1__|"
          META_PREFIX = "__pkgv1_meta__|"
          SCHEMA_PREFIX = "__pkgv1_schema__|"

          MAX_VOTES_PER_VOTER_PER_DAY = 10
          VOTER_EFFECTIVE_LIFETIME_CAP = 30.0
          MIN_VOTES = 80
          MIN_VOTERS = 6
          MIN_CHALLENGES = 20
          MIN_EACH_CHOICE = 15

          LAMBDA_GRID = tuple(i / 200 for i in range(201))
          BETA_GRID = tuple(i / 4 for i in range(1, 65))

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def fetch_rows():
              r = requests.get(ktc_pipeline.SHEET_CSV_URL, timeout=30)
              r.raise_for_status()
              return list(csv.DictReader(io.StringIO(r.text)))

          def is_package_row(row):
              return str(row.get("keep") or "").startswith(PREFIX)

          def parse_row(row):
              parts = str(row.get("keep") or "").split("|")
              if len(parts) != 3 or parts[0] != "__pkgv1__" or parts[2] not in {"T","P"}:
                  return None
              meta = str(row.get("trade") or "")
              left = meta[len(META_PREFIX):] if meta.startswith(META_PREFIX) else None
              if left not in {"T","P"}:
                  left = None
              if not str(row.get("cut") or "").startswith(SCHEMA_PREFIX):
                  return None
              return {
                  "timestamp": row.get("timestamp") or "",
                  "voter_roster_id": str(row.get("voter_roster_id") or ""),
                  "challenge_id": parts[1],
                  "choice": parts[2],
                  "left_canonical_side": left,
              }

          def apply_daily_cap(rows):
              counts = defaultdict(int)
              kept, dropped = [], 0
              for row in rows:
                  day = str(row.get("timestamp") or "")[:10]
                  voter = str(row.get("voter_roster_id") or "")
                  if not day or not voter:
                      continue
                  key = (voter, day)
                  if counts[key] >= MAX_VOTES_PER_VOTER_PER_DAY:
                      dropped += 1
                      continue
                  counts[key] += 1
                  kept.append(row)
              return kept, dropped

          def voter_weights(rows):
              counts = defaultdict(int)
              for row in rows:
                  counts[row["voter_roster_id"]] += 1
              return {
                  voter: {
                      "raw_votes": count,
                      "ballot_weight": min(1.0, VOTER_EFFECTIVE_LIFETIME_CAP / count),
                      "effective_votes": min(float(count), VOTER_EFFECTIVE_LIFETIME_CAP),
                  }
                  for voter, count in counts.items()
              }

          def logistic(z):
              if z >= 0:
                  e = math.exp(-z)
                  return 1.0 / (1.0 + e)
              e = math.exp(z)
              return e / (1.0 + e)

          def log_likelihood(rows, catalog, weights, lam, beta):
              total = 0.0
              for row in rows:
                  c = catalog[row["challenge_id"]]
                  ratio = float(c["raw_package_to_target_ratio"])
                  fg = float(c["fg"])
                  eff_ratio = max(1e-9, ratio * max(1e-9, 1.0 - lam * fg))
                  p = min(1 - 1e-12, max(1e-12, logistic(beta * math.log(eff_ratio))))
                  y = 1.0 if row["choice"] == "P" else 0.0
                  w = weights[row["voter_roster_id"]]["ballot_weight"]
                  total += w * (y * math.log(p) + (1.0-y) * math.log(1.0-p))
              return total

          def fit(rows, catalog, weights):
              best = None
              profile = {}
              for lam in LAMBDA_GRID:
                  best_ll = None
                  for beta in BETA_GRID:
                      ll = log_likelihood(rows, catalog, weights, lam, beta)
                      best_ll = ll if best_ll is None else max(best_ll, ll)
                      candidate = (ll, -lam, -beta, lam, beta)
                      if best is None or candidate > best:
                          best = candidate
                  profile[f"{lam:.3f}"] = best_ll
              max_ll, _a, _b, lam, beta = best
              supported = [float(k) for k,ll in profile.items() if 2*(max_ll-ll) <= 3.84]
              return {
                  "lambda_hat": lam,
                  "beta_hat": beta,
                  "weighted_log_likelihood": max_ll,
                  "lambda_profile_support_heuristic": {
                      "semantics": "profile likelihood heuristic, not calibrated CI",
                      "low": min(supported) if supported else None,
                      "high": max(supported) if supported else None,
                  },
                  "boundary_lambda_flag": lam in {0.0, 1.0},
              }

          def summarize(rows, doc):
              catalog = {c["id"]: c for c in doc["challenges"]}
              valid = [r for r in rows if r["challenge_id"] in catalog]
              weights = voter_weights(valid)
              package_votes = sum(r["choice"] == "P" for r in valid)
              target_votes = sum(r["choice"] == "T" for r in valid)
              unique_voters = len(weights)
              distinct = len({r["challenge_id"] for r in valid})

              left_known = [r for r in valid if r["left_canonical_side"] in {"T","P"}]
              left_rate = (
                  100 * sum(r["choice"] == r["left_canonical_side"] for r in left_known) / len(left_known)
                  if left_known else None
              )

              by_ratio = {}
              for rt in doc["design"]["ratio_targets"]:
                  ids = {c["id"] for c in doc["challenges"] if abs(float(c["ratio_target"])-float(rt)) < 1e-9}
                  sub = [r for r in valid if r["challenge_id"] in ids]
                  p = sum(r["choice"] == "P" for r in sub)
                  by_ratio[f"{float(rt):.2f}"] = {
                      "votes": len(sub),
                      "package_choice_pct": round(100*p/len(sub),2) if sub else None,
                  }

              by_size = {}
              for size in doc["design"]["package_sizes"]:
                  ids = {c["id"] for c in doc["challenges"] if int(c["package_size"]) == int(size)}
                  sub = [r for r in valid if r["challenge_id"] in ids]
                  p = sum(r["choice"] == "P" for r in sub)
                  by_size[str(size)] = {
                      "votes": len(sub),
                      "package_choice_pct": round(100*p/len(sub),2) if sub else None,
                  }

              gates = {
                  "counted_votes": len(valid) >= MIN_VOTES,
                  "unique_voters": unique_voters >= MIN_VOTERS,
                  "distinct_challenges": distinct >= MIN_CHALLENGES,
                  "choice_mix": package_votes >= MIN_EACH_CHOICE and target_votes >= MIN_EACH_CHOICE,
              }
              ready = all(gates.values())

              return {
                  "voter_weights": weights,
                  "raw_vote_count": len(valid),
                  "unique_voters": unique_voters,
                  "distinct_challenges": distinct,
                  "package_votes": package_votes,
                  "target_votes": target_votes,
                  "package_choice_pct": round(100*package_votes/len(valid),2) if valid else None,
                  "display_left_choice_pct": round(left_rate,2) if left_rate is not None else None,
                  "by_ratio_target": by_ratio,
                  "by_package_size": by_size,
                  "promotion_data_gates": {
                      "thresholds": {
                          "counted_votes": MIN_VOTES,
                          "unique_voters": MIN_VOTERS,
                          "distinct_challenges": MIN_CHALLENGES,
                          "minimum_each_choice": MIN_EACH_CHOICE,
                      },
                      "passed": gates,
                      "all_passed": ready,
                  },
                  "v0_fit": fit(valid, catalog, weights) if ready else None,
              }

          def write_report(result):
              s = result["summary"]
              lines = [
                  "# Package Preference Voting V1",
                  "",
                  "**Status: RESEARCH ONLY — no production consumer changed.**",
                  "",
                  f"- Counted package votes: `{s['raw_vote_count']}`",
                  f"- Unique voters: `{s['unique_voters']}`",
                  f"- Distinct challenges: `{s['distinct_challenges']}`",
                  f"- Package choice rate: `{s['package_choice_pct']}`",
                  f"- Display-left choice rate: `{s['display_left_choice_pct']}`",
                  "",
                  "## By raw package / target FV ratio",
                  "",
                  "| Ratio | Votes | Package chosen |",
                  "|---:|---:|---:|",
              ]
              for ratio,row in s["by_ratio_target"].items():
                  pct = "n/a" if row["package_choice_pct"] is None else f"{row['package_choice_pct']:.1f}%"
                  lines.append(f"| {ratio} | {row['votes']} | {pct} |")

              lines += ["", "## V0 lambda fit", ""]
              if s["v0_fit"] is None:
                  lines.append("Insufficient data for provisional lambda; collection continues.")
              else:
                  f = s["v0_fit"]
                  support = f["lambda_profile_support_heuristic"]
                  lines += [
                      f"- `lambda_hat`: `{f['lambda_hat']:.3f}`",
                      f"- `beta_hat`: `{f['beta_hat']:.2f}`",
                      f"- Profile support heuristic: `{support['low']}` to `{support['high']}`",
                      f"- Boundary flag: `{f['boundary_lambda_flag']}`",
                  ]

              lines += [
                  "",
                  "## Isolation",
                  "",
                  "- Package rows are removed before normal KTC daily-cap and Bradley-Terry work.",
                  "- Package votes do not alter Market Value or the live trade verdict.",
                  "",
              ]
              OUT_MD.write_text("\n".join(lines), encoding="utf-8")

          def selftest():
              assert is_package_row({"keep":"__pkgv1__|abc|P"})
              assert not is_package_row({"keep":"alpha"})
              parsed = parse_row({
                  "timestamp":"2026-09-07T00:00:00Z",
                  "voter_roster_id":"4",
                  "keep":"__pkgv1__|abc|P",
                  "trade":"__pkgv1_meta__|T",
                  "cut":"__pkgv1_schema__|1",
              })
              assert parsed["challenge_id"] == "abc"
              assert parsed["choice"] == "P"
              assert parsed["left_canonical_side"] == "T"
              rows = [{
                  "timestamp":"2026-09-07T00:00:00Z",
                  "voter_roster_id":"4",
                  "challenge_id":f"x{i}",
                  "choice":"P",
                  "left_canonical_side":"P",
              } for i in range(15)]
              capped,dropped = apply_daily_cap(rows)
              assert len(capped) == 10 and dropped == 5
              print("Package vote pipeline self-test passed.")

          def main():
              if "--selftest" in sys.argv:
                  selftest()
                  return

              doc = read_json(CHALLENGES)
              if doc.get("status") != "frozen_package_preference_v1" or doc.get("frozen") is not True:
                  raise RuntimeError("unexpected/unfrozen challenge catalog")

              raw = [parse_row(r) for r in fetch_rows() if is_package_row(r)]
              raw = [r for r in raw if r is not None]
              capped,dropped = apply_daily_cap(raw)
              summary = summarize(capped, doc)

              result = {
                  "schema_version": 1,
                  "status": "research_only",
                  "consumer_changed": False,
                  "market_value_consumer_changed": False,
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "transport": "existing KTC Google Sheet via reserved __pkgv1__ rows",
                  "package_daily_cap_per_voter": MAX_VOTES_PER_VOTER_PER_DAY,
                  "voter_effective_lifetime_cap": VOTER_EFFECTIVE_LIFETIME_CAP,
                  "raw_package_rows": len(raw),
                  "daily_cap_dropped": dropped,
                  "summary": summary,
              }
              OUT_JSON.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              write_report(result)
              print(f"Wrote {OUT_JSON.relative_to(ROOT)}")
              print(f"Wrote {OUT_MD.relative_to(ROOT)}")

          if __name__ == "__main__":
              main()
          PY

          chmod +x scripts/market/package_vote_pipeline.py

      - name: Isolate package rows from normal KTC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/market/ktc_pipeline.py")
          text = p.read_text(encoding="utf-8")

          def rep(old,new,label):
              global text
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {n}")
              text = text.replace(old,new,1)

          rep(
              'MIN_PAIRWISE_FOR_SIGNAL = 30\n\n# Research-only voter-balance policy.',
              'MIN_PAIRWISE_FOR_SIGNAL = 30\n\n'
              '# Package Preference Voting V1 shares transport only. Remove its\n'
              '# reserved rows before normal KTC daily-cap and Bradley-Terry work.\n'
              'PACKAGE_VOTE_PREFIX = "__pkgv1__|"\n\n'
              'def is_package_vote_row(row):\n'
              '    return str(row.get("keep") or "").startswith(PACKAGE_VOTE_PREFIX)\n\n'
              '# Research-only voter-balance policy.',
              "insert package classifier",
          )

          rep(
              '    rows = fetch_votes()\n'
              '    rows = apply_daily_cap(rows)\n'
              '    print(f"  {len(rows)} votes counted after daily cap")',
              '    all_rows = fetch_votes()\n'
              '    package_transport_rows = [r for r in all_rows if is_package_vote_row(r)]\n'
              '    rows = [r for r in all_rows if not is_package_vote_row(r)]\n'
              '    if package_transport_rows:\n'
              '        print(f"  Excluded {len(package_transport_rows)} Package Preference V1 row(s) before normal KTC processing")\n'
              '    rows = apply_daily_cap(rows)\n'
              '    print(f"  {len(rows)} votes counted after daily cap")',
              "filter package rows before cap",
          )

          rep(
              'def run_selftest():\n    raw_pairs = [',
              'def run_selftest():\n'
              '    assert is_package_vote_row({"keep": "__pkgv1__|challenge|P"})\n'
              '    assert not is_package_vote_row({"keep": "alpha"})\n\n'
              '    raw_pairs = [',
              "add isolation selftest",
          )

          p.write_text(text, encoding="utf-8")
          print("Patched normal KTC package-vote isolation.")
          PY

      - name: Write Package Preference browser JavaScript
        shell: bash
        run: |
          cat > /tmp/package_vote_v1.js <<'JS'
          function packageVoteTodayKey(){
            return 'package_votes_v1_' + new Date().toISOString().slice(0,10);
          }

          function packageVotesToday(){
            return parseInt(localStorage.getItem(packageVoteTodayKey()) || '0', 10);
          }

          function packageVoteRecent(){
            try { return JSON.parse(localStorage.getItem('package_vote_recent_v1') || '[]'); }
            catch(e){ return []; }
          }

          function packageVoteRemember(id){
            const recent = packageVoteRecent().concat([id]).slice(-PACKAGE_VOTE_RECENT_MEMORY);
            localStorage.setItem('package_vote_recent_v1', JSON.stringify(recent));
          }

          function packageVoteOwnPlayers(){
            if(!(state.teamConfirmed && MY_ROSTER_ID)) return new Set();
            const team = LEAGUE_ROSTERS[MY_ROSTER_ID];
            return new Set((team && team.players || []).map(p => p.key));
          }

          function packageVoteEligibleChallenges(){
            if(!PACKAGE_VOTE_CHALLENGES) return [];
            const own = packageVoteOwnPlayers();
            const recent = new Set(packageVoteRecent());
            return PACKAGE_VOTE_CHALLENGES.filter(c => {
              if(recent.has(c.id)) return false;
              const keys = [c.target.key].concat(c.package.map(p => p.key));
              return !keys.some(k => own.has(k));
            });
          }

          function packageVoteSelectChallenge(){
            let pool = packageVoteEligibleChallenges();
            if(!pool.length && PACKAGE_VOTE_CHALLENGES){
              localStorage.removeItem('package_vote_recent_v1');
              pool = packageVoteEligibleChallenges();
            }
            if(!pool.length) return null;
            const challenge = pool[Math.floor(Math.random() * pool.length)];
            return { challenge, left: Math.random() < 0.5 ? 'T' : 'P' };
          }

          function packageVoteEnsureLoaded(){
            if(PACKAGE_VOTE_STATUS === 'loading' || PACKAGE_VOTE_STATUS === 'ready') return;
            PACKAGE_VOTE_STATUS = 'loading';
            fetch(PACKAGE_VOTE_CHALLENGES_URL)
              .then(r => {
                if(!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
              })
              .then(doc => {
                if(
                  doc.status !== 'frozen_package_preference_v1' ||
                  doc.frozen !== true ||
                  !Array.isArray(doc.challenges) ||
                  doc.challenges.length < 70
                ){
                  throw new Error('unexpected package challenge catalog');
                }
                PACKAGE_VOTE_CHALLENGES = doc.challenges;
                PACKAGE_VOTE_STATUS = 'ready';
                packageVoteCurrent = null;
                renderPackageVote();
              })
              .catch(err => {
                console.warn('Package Preference V1 load failed:', err);
                PACKAGE_VOTE_CHALLENGES = null;
                PACKAGE_VOTE_STATUS = 'failed';
                renderPackageVote();
              });
          }

          function packageVoteAssetCard(p){
            const age = (typeof p.age === 'number') ? ` &middot; ${p.age} y.o.` : '';
            const team = p.team ? ` &middot; ${ktcTeamLabel(p.team)}` : '';
            return `<div class="need-cell" style="text-align:left;padding:10px;">
              <div style="font-weight:600;font-size:14px;">${escapeHtml(p.name)}</div>
              <div style="color:var(--text-dim);font-size:11px;">${escapeHtml(p.pos)}${team}${age}</div>
            </div>`;
          }

          function packageVoteSubmit(displaySide){
            if(!packageVoteCurrent || packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT) return;

            const left = packageVoteCurrent.left;
            const choice = displaySide === 'L' ? left : (left === 'T' ? 'P' : 'T');
            const id = packageVoteCurrent.challenge.id;
            const voter = ktcCurrentVoterId();
            if(!voter) return;

            fetch(KTC_SUBMIT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                voterRosterId: voter,
                keep: `__pkgv1__|${id}|${choice}`,
                trade: `__pkgv1_meta__|${left}`,
                cut: '__pkgv1_schema__|1',
              }),
            }).catch(() => {});

            localStorage.setItem(packageVoteTodayKey(), String(packageVotesToday() + 1));
            packageVoteRemember(id);
            packageVoteCurrent = packageVoteSelectChallenge();
            renderPackageVote();
          }

          function renderPackageVote(){
            const el = document.getElementById('packageVoteWrap');
            if(!el) return;

            if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){
              el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
                Pick "Which team is yours?" above or enter guest mode in Keep / Trade / Cut first.
              </div>`;
              return;
            }

            if(packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT){
              el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
                You've completed today's ${PACKAGE_VOTE_DAILY_LIMIT} package research votes. Thank you.
              </div>`;
              return;
            }

            if(PACKAGE_VOTE_STATUS === 'idle'){
              packageVoteEnsureLoaded();
              el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen package comparisons...</div>`;
              return;
            }
            if(PACKAGE_VOTE_STATUS === 'loading'){
              el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen package comparisons...</div>`;
              return;
            }
            if(PACKAGE_VOTE_STATUS === 'failed'){
              el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Package research is temporarily unavailable. Normal KTC voting is unaffected.</div>`;
              return;
            }

            if(!packageVoteCurrent) packageVoteCurrent = packageVoteSelectChallenge();
            if(!packageVoteCurrent){
              el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">No eligible package comparison is available right now.</div>`;
              return;
            }

            const c = packageVoteCurrent.challenge;
            const targetHTML = packageVoteAssetCard(c.target);
            const packageHTML = c.package.map(packageVoteAssetCard).join('');
            const leftIsTarget = packageVoteCurrent.left === 'T';
            const leftHTML = leftIsTarget ? targetHTML : packageHTML;
            const rightHTML = leftIsTarget ? packageHTML : targetHTML;

            el.innerHTML = `
              <div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--text-dim);">
                <b style="color:var(--text);">Research question:</b> Which side would you rather have in a dynasty trade?
                Values are intentionally hidden. Vote on the assets themselves.
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;">
                <div>
                  <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:5px;text-align:center;">SIDE A</div>
                  <div style="display:flex;flex-direction:column;gap:6px;">${leftHTML}</div>
                  <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('L')">Choose Side A</button>
                </div>
                <div>
                  <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--violet);margin-bottom:5px;text-align:center;">SIDE B</div>
                  <div style="display:flex;flex-direction:column;gap:6px;">${rightHTML}</div>
                  <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('R')">Choose Side B</button>
                </div>
              </div>
              <div style="color:var(--text-dim);font-size:10px;margin-top:8px;text-align:center;">
                ${packageVotesToday()} / ${PACKAGE_VOTE_DAILY_LIMIT} package votes today &middot; display sides randomized
              </div>
            `;
          }
          JS

      - name: Patch browser Package Preference UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          js = Path("/tmp/package_vote_v1.js").read_text(encoding="utf-8")

          def rep(old,new,label):
              global text
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {n}")
              text = text.replace(old,new,1)

          rep(
              '  <div class="section-label" style="margin-top:20px;">Keep / Trade / Cut</div>\n'
              '  <div id="ktcWrap"></div>',
              '  <div class="section-label" style="margin-top:20px;">Keep / Trade / Cut</div>\n'
              '  <div id="ktcWrap"></div>\n\n'
              '  <div class="section-label" style="margin-top:20px;">Package Preference Research</div>\n'
              '  <div id="packageVoteWrap"></div>',
              "insert UI mount",
          )

          submit = "const KTC_SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbynz6A8jNOQonJhHtZW7DEx36PYTBXi_klXnacKF7I4kACPbTJIA5YFjY5ILxqpwgm8aw/exec'; // see ktc_vote_collector.gs setup instructions\n"
          constants = submit + (
              "\n/* Package Preference Voting V1: separate research; shared transport only. */\n"
              "const PACKAGE_VOTE_CHALLENGES_URL = 'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/main/research/package-adjustment-v1/package_vote_challenges.json';\n"
              "const PACKAGE_VOTE_DAILY_LIMIT = 10;\n"
              "const PACKAGE_VOTE_RECENT_MEMORY = 20;\n"
              "let PACKAGE_VOTE_CHALLENGES = null;\n"
              "let PACKAGE_VOTE_STATUS = 'idle';\n"
              "let packageVoteCurrent = null;\n"
          )
          rep(submit, constants, "insert package constants")

          marker = "function render(){\n"
          if text.count(marker) != 1:
              raise RuntimeError(f"render marker expected 1, found {text.count(marker)}")
          text = text.replace(marker, js + "\n" + marker, 1)

          rep(
              "  renderKTC();\n  renderFullRoster();",
              "  renderKTC();\n  renderPackageVote();\n  renderFullRoster();",
              "add package render call",
          )

          p.write_text(text, encoding="utf-8")
          print("Patched browser Package Preference Voting V1.")
          PY

      - name: Add persistent package-vote aggregation workflow
        shell: bash
        run: |
          cat > .github/workflows/package-vote-aggregation.yml <<'YML'
          name: Package Vote Aggregation

          on:
            workflow_dispatch:
            schedule:
              - cron: '23 11 * * *'

          permissions:
            contents: write

          concurrency:
            group: trade-desk-data-writes
            cancel-in-progress: false

          jobs:
            aggregate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: main
                    fetch-depth: 0

                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'

                - name: Aggregate package votes
                  run: |
                    pip install requests
                    python3 scripts/market/package_vote_pipeline.py --selftest
                    python3 scripts/market/package_vote_pipeline.py

                - name: Commit changed research results
                  run: |
                    git config user.name "trade-desk-research-bot"
                    git config user.email "actions@users.noreply.github.com"
                    git add research/package-adjustment-v1/package_vote_results.json
                    git add research/package-adjustment-v1/package_vote_results.md
                    if git diff --cached --quiet; then
                      echo "No package-vote result changes."
                      exit 0
                    fi
                    git commit -m "Update package preference vote research"
                    git push origin main
          YML

      - name: Install dependencies and run research self-tests
        shell: bash
        run: |
          pip install requests
          python3 scripts/market/ktc_pipeline.py --selftest
          python3 scripts/market/package_vote_pipeline.py --selftest
          python3 scripts/market/package_vote_pipeline.py

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise RuntimeError("No inline scripts found")
          Path("/tmp/trade-desk-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} script block(s)")
          PY
          node --check /tmp/trade-desk-inline.js

      - name: Verify isolation and frozen-design contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          challenges = json.loads(Path("research/package-adjustment-v1/package_vote_challenges.json").read_text())
          assert challenges["status"] == "frozen_package_preference_v1"
          assert challenges["frozen"] is True
          assert challenges["consumer_changed"] is False
          assert challenges["counts"]["challenge_count"] >= 70
          assert challenges["design"]["pick_assets_included"] is False
          assert set(challenges["design"]["package_sizes"]) == {2,3}
          assert len(challenges["counts"]["by_target_position"]) >= 6

          index = Path("index.html").read_text()
          assert "packageVoteWrap" in index
          assert "__pkgv1__|${id}|${choice}" in index
          assert "Values are intentionally hidden" in index

          ktc = Path("scripts/market/ktc_pipeline.py").read_text()
          assert 'PACKAGE_VOTE_PREFIX = "__pkgv1__|"' in ktc
          assert "rows = [r for r in all_rows if not is_package_vote_row(r)]" in ktc

          results = json.loads(Path("research/package-adjustment-v1/package_vote_results.json").read_text())
          assert results["status"] == "research_only"
          assert results["consumer_changed"] is False
          assert results["market_value_consumer_changed"] is False

          v0 = json.loads(Path("research/package-adjustment-v0/package_adjustment_v0.json").read_text())
          assert v0["production_formula_enabled"] is False

          print("Package Preference V1 contracts verified.")
          PY

      - name: Run repo regression checks
        shell: bash
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Remove one-time installer
        shell: bash
        run: rm -f .github/workflows/install-package-preference-voting-v1.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add scripts/market/ktc_pipeline.py
          git add scripts/market/package_vote_pipeline.py
          git add research/package-adjustment-v1/
          git add .github/workflows/package-vote-aggregation.yml
          git add -u .github/workflows/install-package-preference-voting-v1.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add Package Preference Voting V1 research"
          git push origin main
