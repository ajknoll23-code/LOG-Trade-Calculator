name: B3B Package Adjustment V8 - Read-Only 2v2 Calibration Decomposition

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: package-adjustment-v8-read-only-2v2-calibration-decomposition
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FREEZE_CUTOFF_UTC: "2026-10-05T04:16:06.632518+00:00"
  FREEZE_SOURCE_RUN_ID: "37262731480"
  FREEZE_SOURCE_ARTIFACT_ID: "11324269339"
  FREEZE_SOURCE_ARTIFACT_DIGEST: "sha256:ff59845f52379f1a5b26fe47ac21f1a63a7632423391b47c62fa204092709cd8"
  RESET16_CUTOFF_UTC: "2026-10-03T20:20:10.208764+00:00"
  RESET35_CUTOFF_UTC: "2026-10-04T14:08:53.081814+00:00"
  RESET44_CUTOFF_UTC: "2026-10-04T15:38:35.088288+00:00"
  EXPECTED_VOTER_HASHES_JSON: '{"1":"bab4ba8c228d1943","10":"e901f1cfb63ff15d","11":"776524a97611bcc9","12":"7953de0fe1f3214c","13":"bcc520701bc5f7ed","14":"7a3d41c6daf3c172","15":"60e8d29e4c8514b3","16":"ec884544219939ec","17":"61754fbda18cbc0e","18":"4e68eabb69905f08","19":"ac1b5996e9b545a8","2":"7837c2633da640dd","20":"54fc693381c94dc7","21":"b3660d2d970e2f7c","22":"098c75dd664c4963","23":"93e2a3e9f5b4e872","24":"5ec27569ba14304f","25":"cc84997bf98fa154","26":"0d77999a2411efb6","27":"97b1d88f8b471bfe","28":"d3def7089d837393","29":"20b1fe2510164171","3":"0eef434e45a2d72b","30":"a4b8c4db770e8f0f","31":"d27e98ea1a6897c5","32":"781b0a33548a5c51","33":"16b33ef9deea2dd9","34":"239de487321bcdcf","35":"068edf501684bc6f","36":"ddd6c1b08a08558c","37":"28b6d065018b3929","38":"09d64eb07fbe9d6c","39":"ffcb222eb09efb4e","4":"bf9e60bd7946c031","40":"bffe34084fb31711","41":"b66169d918e381a8","42":"f0c993f2f080905c","43":"c4c688248e66a5f9","44":"e59d41afd8a1fa4b","45":"c84897500d4046c8","46":"6dec03827c57c1bb","47":"183ae64de9acff08","48":"6cf6e1cb040a8b57","49":"afdc1d5140950ae4","5":"32bb6a6eed030c81","50":"ac79f462f394d8ce","6":"9e5d9fab9c81b570","7":"30ce49a02eb5b17a","8":"a7f9ecc192201f5a","9":"94da0b5e61652078"}'
  B3A_RUN_ID: "37263931701"
  B3A_ARTIFACT_ID: "11325577076"
  B3A_ARTIFACT_DIGEST: "sha256:fbe1909ed03270614d0b91730516247e753716847e4e3b0bf4ae1511a2b9b889"
  B3A_DATASET_SHA256: "e6d4beaae2699bd9a029e3d9c53d680cd30f6c2aaf4d460e6aca64dc3d18106d"
  EXPECTED_2V2_DELTA: "0.11357690451791291"
  EXPECTED_4V4_DELTA: "0.17081403548847707"

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen evaluator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" "numpy==2.3.3" "scipy==1.16.2"

      - name: Guard frozen evaluator and exact B3A source artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v8/topology_split_preregistration_v1.json"]="0861346a483ed9938246fd04173408c47c012ee9"
            ["research/package-adjustment-v8/evaluation_protocol_v1.json"]="263db22eb41be6b458479d7fb76ad61f55b0bcd8"
            ["research/package-adjustment-v8/evaluation_engine_manifest_v1.json"]="6d49b1a1be4c3dd108820de9db7c370b0185a10b"
            ["research/package-adjustment-v8/evaluate_development_v1.py"]="bef73c81bdff771f51b4f18bea011b30a71e9935"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
            ["research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json"]="8258fe8ca41d6ccef16529ea9ade9da19d3ca2e2"
            ["research/package-adjustment-v8/voting_randomization_schedule_v1.json"]="c499d85b8473798294eccfe9310ec9644c1db3fc"
            ["research/package-adjustment-v8/development_voting_activation_manifest_v1.json"]="938bf754c90adeda8f3a5f863acfda8967c3818d"
          )
          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: frozen V8 artifact drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          rm -rf /tmp/package-adjustment-v8-b3b
          mkdir -p /tmp/package-adjustment-v8-b3b/source

          python3 - <<'PY'
          import hashlib,io,json,os,zipfile
          from pathlib import Path
          import requests

          repo=os.environ['GITHUB_REPOSITORY']
          aid=int(os.environ['B3A_ARTIFACT_ID'])
          rid=int(os.environ['B3A_RUN_ID'])
          expected_digest=os.environ['B3A_ARTIFACT_DIGEST']
          headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28'}

          meta=requests.get(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}',headers=headers,timeout=30)
          meta.raise_for_status(); a=meta.json()
          assert a['workflow_run']['id']==rid
          assert a['name']=='package-adjustment-v8-b3a-frozen-development-evaluation'
          assert a.get('digest')==expected_digest,(a.get('digest'),expected_digest)
          assert not a.get('expired',False)

          zresp=requests.get(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip',headers=headers,timeout=60)
          zresp.raise_for_status(); data=zresp.content
          assert 'sha256:'+hashlib.sha256(data).hexdigest()==expected_digest
          z=zipfile.ZipFile(io.BytesIO(data))
          required={'development_evaluation.json','dataset_commitment.json','outcome_opening_manifest.json','report.md'}
          assert required.issubset(set(z.namelist()))
          assert 'frozen_opened_dataset.json' not in set(z.namelist())
          for n in required:
            (Path('/tmp/package-adjustment-v8-b3b/source')/n).write_bytes(z.read(n))

          r=json.loads((Path('/tmp/package-adjustment-v8-b3b/source')/'development_evaluation.json').read_text())
          c=json.loads((Path('/tmp/package-adjustment-v8-b3b/source')/'dataset_commitment.json').read_text())
          assert r['decision']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert c['dataset_sha256']==os.environ['B3A_DATASET_SHA256']
          assert c['accepted_voters']==50 and c['accepted_ballots']==2000 and c['accepted_slots']==50
          assert abs(r['topology_candidate_minus_c0']['2v2']-float(os.environ['EXPECTED_2V2_DELTA']))<1e-12
          assert abs(r['topology_candidate_minus_c0']['4v4']-float(os.environ['EXPECTED_4V4_DELTA']))<1e-12
          print('PASS: exact B3A source artifact and frozen scientific STOP verified.')
          PY

      - name: Reconstruct exact frozen 50-voter dataset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import csv,hashlib,io,json,os,re
          from collections import Counter,defaultdict
          from datetime import datetime,timezone
          from pathlib import Path
          import requests

          D=Path('research/package-adjustment-v8')
          OUT=Path('/tmp/package-adjustment-v8-b3b')
          SHEET_URL=(
            'https://docs.google.com/spreadsheets/d/e/'
            '2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/'
            'pub?gid=458294959&single=true&output=csv'
          )
          VOTE_PREFIX='__pkgv8dev__|'; SCHEMA_MARKER='__pkgv8dev_schema__|1'

          def load(n): return json.loads((D/n).read_text())
          def parse_utc(value):
            s=str(value or '').strip()
            if not s:return None
            if s.endswith('Z'):s=s[:-1]+'+00:00'
            try:dt=datetime.fromisoformat(s)
            except ValueError:return None
            if dt.tzinfo is None:dt=dt.replace(tzinfo=timezone.utc)
            return dt.astimezone(timezone.utc)

          act=load('development_voting_activation_manifest_v1.json')
          cat=load('package_vote_challenges_v8_development_v1.json')
          sched=load('voting_randomization_schedule_v1.json')
          challenges={str(c['id']):c for c in cat['challenges']}
          challenge_ids=set(challenges)
          activation_cutoff=parse_utc(act['valid_ballot_start_utc']); assert activation_cutoff
          freeze_cutoff=parse_utc(os.environ['FREEZE_CUTOFF_UTC']); assert freeze_cutoff
          reset_cutoffs={16:parse_utc(os.environ['RESET16_CUTOFF_UTC']),35:parse_utc(os.environ['RESET35_CUTOFF_UTC']),44:parse_utc(os.environ['RESET44_CUTOFF_UTC'])}
          expected_hashes=json.loads(os.environ['EXPECTED_VOTER_HASHES_JSON'])

          resp=requests.get(SHEET_URL,timeout=30); resp.raise_for_status()
          source_rows=list(csv.DictReader(io.StringIO(resp.text)))
          meta_re=re.compile(r'^__pkgv8dev_meta__\|([AB])\|([1-9]|[1-4][0-9]|50)\|([0-9]|[1-2][0-9]|3[0-9])$')
          reset_rows=defaultdict(list); structural=[]; post_freeze_v8_rows=0

          for source_index,row in enumerate(source_rows):
            keep=str(row.get('keep') or '')
            if not keep.startswith(VOTE_PREFIX):continue
            ts=parse_utc(row.get('timestamp'))
            if ts is None or ts<=activation_cutoff:continue
            if ts>freeze_cutoff:
              post_freeze_v8_rows+=1; continue
            voter=str(row.get('voter_roster_id') or '').strip()
            if not voter:continue
            payload=keep[len(VOTE_PREFIX):]
            challenge_id,sep,choice_payload=payload.partition('|')
            if not sep or challenge_id not in challenges:continue
            mm=meta_re.fullmatch(str(row.get('trade') or ''))
            if not mm or str(row.get('cut') or '')!=SCHEMA_MARKER:continue
            display_left=mm.group(1); slot=int(mm.group(2)); display_order=int(mm.group(3))
            spec=sched['slots'][str(slot)]
            if challenge_id not in spec['challenge_order']:continue
            if display_order!=spec['challenge_order'].index(challenge_id):continue
            if display_left!=spec['display_left_by_challenge'][challenge_id]:continue
            item={'timestamp':ts,'source_index':source_index,'voter':voter,'challenge_id':challenge_id,
                  'display_left':display_left,'slot':slot,'display_order':display_order}
            cutoff=reset_cutoffs.get(slot)
            if cutoff is not None and ts<=cutoff:
              reset_rows[slot].append(item); continue
            choice=choice_payload.strip()
            if choice not in {'A','B'}:continue
            item['choice']=choice; structural.append(item)

          assert len(reset_rows[16])==80 and len({r['voter'] for r in reset_rows[16]})==2
          assert len(reset_rows[35])==42 and len({r['voter'] for r in reset_rows[35]})==1
          assert len(reset_rows[44])==41 and len({r['voter'] for r in reset_rows[44]})==1
          assert sorted(Counter(r['challenge_id'] for r in reset_rows[35]).values())==[1]*38+[2]*2
          assert sorted(Counter(r['challenge_id'] for r in reset_rows[44]).values())==[1]*39+[2]

          structural.sort(key=lambda r:(r['timestamp'],r['source_index']))
          assert len(structural)==2000
          by_voter=defaultdict(list)
          for r in structural:by_voter[r['voter']].append(r)
          assert len(by_voter)==50

          ballots=[]; seen_slots=set(); observed_hashes={}
          for voter,rows in by_voter.items():
            assert len(rows)==40 and len({r['challenge_id'] for r in rows})==40
            slots={r['slot'] for r in rows}; assert len(slots)==1
            slot=next(iter(slots)); assert slot not in seen_slots; seen_slots.add(slot)
            ordered=sorted(rows,key=lambda r:r['display_order'])
            assert [r['display_order'] for r in ordered]==list(range(40))
            assert [r['challenge_id'] for r in ordered]==sched['slots'][str(slot)]['challenge_order']
            voter_hash=hashlib.sha256(('v8-maturity-voter|'+voter).encode()).hexdigest()[:16]
            assert voter_hash==expected_hashes[str(slot)]
            observed_hashes[str(slot)]=voter_hash
            for r in ordered:
              ballots.append({'voter_cluster':voter_hash,'challenge_id':r['challenge_id'],
                              'display_left':r['display_left'],'human_choice_left':r['choice']==r['display_left']})

          assert seen_slots==set(range(1,51)); assert observed_hashes==expected_hashes; assert len(ballots)==2000
          by_ch=Counter(b['challenge_id'] for b in ballots); assert set(by_ch.values())=={50}
          for cid in challenge_ids:
            assert Counter(b['display_left'] for b in ballots if b['challenge_id']==cid)=={'A':25,'B':25}

          dataset={'schema_version':1,'study_id':act['study_id'],'ballots':ballots}
          data=(json.dumps(dataset,sort_keys=True,separators=(',',':'))+'\n').encode()
          sha=hashlib.sha256(data).hexdigest()
          assert sha==os.environ['B3A_DATASET_SHA256'],(sha,os.environ['B3A_DATASET_SHA256'])
          (OUT/'frozen_opened_dataset.json').write_bytes(data)
          print(json.dumps({'status':'PASS_EXACT_B3A_DATASET_RECONSTRUCTED','dataset_sha256':sha,
                            'accepted_voters':50,'accepted_ballots':2000,'post_freeze_v8_rows_ignored':post_freeze_v8_rows},indent=2))
          PY

      - name: Read-only deterministic 2v2 calibration decomposition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,math,os
          from pathlib import Path
          from collections import defaultdict

          D=Path('research/package-adjustment-v8')
          OUT=Path('/tmp/package-adjustment-v8-b3b')
          spec=importlib.util.spec_from_file_location('v8eval',D/'evaluate_development_v1.py')
          ev=importlib.util.module_from_spec(spec); spec.loader.exec_module(ev)

          dataset=json.loads((OUT/'frozen_opened_dataset.json').read_text())
          ballots=dataset['ballots']
          catalog=json.loads((D/'development_catalog_v1.json').read_text())
          challenges={str(c['id']):c for c in catalog['challenges']}
          ev.validate_dataset(ballots,challenges)
          fmap=ev.deterministic_fold_map(challenges)

          # 1) Frozen score-form identity check: C0 and C1 must be exactly identical for every 2v2 side.
          score_checks=[]
          for cid,c in sorted(challenges.items()):
            if c['topology']!='2v2':continue
            row={'challenge_id':cid}
            for side in ('side_A','side_B'):
              vals=[a['fv'] for a in c[side]['assets']]
              s0=ev.score(vals,'2v2','C0_RAW_SUM')
              s1=ev.score(vals,'2v2','C1_TOPOLOGY_SPLIT_V6_TRANSFER')
              assert math.isclose(s0,s1,rel_tol=0,abs_tol=1e-12),(cid,side,s0,s1)
              row[f'{side}_c0_score']=s0; row[f'{side}_c1_score']=s1; row[f'{side}_difference']=s1-s0
            score_checks.append(row)
          assert len(score_checks)==10

          # 2) Replay each frozen CV fold and expose only the nuisance calibration + 2v2 losses.
          fold_rows=[]; all0=[]; all1=[]
          active=set(challenges)
          for f in range(5):
            valid={cid for cid in active if fmap[cid]==f}
            train=active-valid
            valid2={cid for cid in valid if challenges[cid]['topology']=='2v2'}
            assert valid2
            fit0=ev.fit_model(ballots,challenges,'C0_RAW_SUM',train)
            fit1=ev.fit_model(ballots,challenges,'C1_TOPOLOGY_SPLIT_V6_TRANSFER',train)
            p0=ev.predict(ballots,challenges,'C0_RAW_SUM',fit0,valid2)
            p1=ev.predict(ballots,challenges,'C1_TOPOLOGY_SPLIT_V6_TRANSFER',fit1,valid2)
            # Cross-application proves that the only 2v2 difference comes from candidate-specific pooled calibration.
            p1_with_c0fit=ev.predict(ballots,challenges,'C1_TOPOLOGY_SPLIT_V6_TRANSFER',fit0,valid2)
            p0_with_c1fit=ev.predict(ballots,challenges,'C0_RAW_SUM',fit1,valid2)
            l0=ev.macro_loss(p0); l1=ev.macro_loss(p1)
            l1_c0fit=ev.macro_loss(p1_with_c0fit); l0_c1fit=ev.macro_loss(p0_with_c1fit)
            assert math.isclose(l0,l1_c0fit,rel_tol=0,abs_tol=1e-12)
            assert math.isclose(l1,l0_c1fit,rel_tol=0,abs_tol=1e-12)
            all0.extend(p0); all1.extend(p1)
            fold_rows.append({
              'fold':f,
              'validation_2v2_challenges':sorted(valid2),
              'c0_beta':fit0['beta'],'c0_delta_left':fit0['delta_left'],
              'c1_beta':fit1['beta'],'c1_delta_left':fit1['delta_left'],
              'c0_2v2_loss':l0,'c1_2v2_loss':l1,'candidate_minus_c0_2v2_loss':l1-l0,
              'c1_score_with_c0_fit_loss':l1_c0fit,
              'c0_score_with_c1_fit_loss':l0_c1fit,
            })

          loss0=ev.macro_loss(all0); loss1=ev.macro_loss(all1); delta=loss1-loss0
          expected=float(os.environ['EXPECTED_2V2_DELTA'])
          assert math.isclose(delta,expected,rel_tol=0,abs_tol=1e-12),(delta,expected)

          # 3) Replay the frozen full CV result to prove the 4v4 failure remains independent.
          c0=ev.cv(ballots,challenges,fmap,'C0_RAW_SUM')
          c1=ev.cv(ballots,challenges,fmap,'C1_TOPOLOGY_SPLIT_V6_TRANSFER')
          topo={t:c1['topology_losses'][t]-c0['topology_losses'][t] for t in ev.TOPOLOGIES}
          assert math.isclose(topo['2v2'],expected,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(topo['4v4'],float(os.environ['EXPECTED_4V4_DELTA']),rel_tol=0,abs_tol=1e-12)

          # If the nuisance fits were identical, identical 2v2 scores would necessarily yield identical predictions/losses.
          # They are not identical because each candidate is pooled across all topologies during training.
          nuisance_diff_any=any(
            (not math.isclose(r['c0_beta'],r['c1_beta'],rel_tol=0,abs_tol=1e-12)) or
            (not math.isclose(r['c0_delta_left'],r['c1_delta_left'],rel_tol=0,abs_tol=1e-12))
            for r in fold_rows
          )
          assert nuisance_diff_any

          result={
            'schema_version':1,
            'study_id':'package-adjustment-v8-topology-split-multi-v-multi',
            'stage':'b3b_read_only_2v2_calibration_decomposition',
            'status':'PASS_MECHANISM_CONFIRMED_SHARED_NUISANCE_CALIBRATION',
            'scientific_decision_changed':False,
            'b3a_decision':'STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION',
            'score_identity_2v2_all_challenges':True,
            'score_identity_checked_challenges':len(score_checks),
            'mechanism':(
              'C0 and C1 2v2 scores are identical, but beta and delta_left are fitted once per candidate/fold '
              'across all training topologies. C1 therefore inherits nuisance calibration influenced by its non-2v2 '
              'generalized-mean score family, producing different 2v2 probabilities and loss despite identical 2v2 scores.'
            ),
            'c0_2v2_oof_loss':loss0,
            'c1_2v2_oof_loss':loss1,
            'candidate_minus_c0_2v2':delta,
            'candidate_minus_c0_4v4':topo['4v4'],
            'fold_decomposition':fold_rows,
            'score_checks':score_checks,
            'cross_application_identity_confirmed':True,
            'production_change_authorized':False,
            'posthoc_rescue_authorized':False,
            'recommended_next_step':'Amend and run B4 closeout with this decomposition included; keep V8 scientific STOP.',
          }
          (OUT/'b3b_2v2_calibration_decomposition.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')

          lines=[
            '# Package Adjustment V8 — B3B Read-Only 2v2 Calibration Decomposition','',
            '**Result:** `PASS_MECHANISM_CONFIRMED_SHARED_NUISANCE_CALIBRATION`','',
            '- C0 and C1 2v2 package scores are exactly identical for all 10 frozen 2v2 challenges.',
            '- The frozen evaluator fits one pooled `beta` and `delta_left` per candidate/fold across all training topologies.',
            '- Those nuisance parameters differ between C0 and C1 because C1 uses a different score family outside 2v2.',
            '- Applying the C0 nuisance fit to C1 2v2 scores reproduces C0 2v2 loss exactly; applying the C1 fit to C0 2v2 scores reproduces C1 loss exactly.',
            f'- Reproduced 2v2 candidate-minus-C0 loss: **{delta:+.12f}**.',
            f'- Independently reproduced 4v4 candidate-minus-C0 loss: **{topo["4v4"]:+.12f}**.',
            '', '## Fold nuisance calibration','',
            '| Fold | C0 beta | C1 beta | C0 delta | C1 delta | 2v2 delta |',
            '|---:|---:|---:|---:|---:|---:|',
          ]
          for r in fold_rows:
            lines.append(f"| {r['fold']} | {r['c0_beta']:.8f} | {r['c1_beta']:.8f} | {r['c0_delta_left']:.8f} | {r['c1_delta_left']:.8f} | {r['candidate_minus_c0_2v2_loss']:+.8f} |")
          lines += ['',
            '**Scientific interpretation:** the 2v2 regression is explained by the frozen candidate/evaluator architecture, not by a mismatch in the 2v2 score formula.',
            '', '**V8 decision remains:** `STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION`',
            '**Production change authorized:** NO',
            '**Post-hoc rescue authorized:** NO',
            '', 'Next: amend B4 to memorialize this mechanism, then close V8.',
          ]
          (OUT/'b3b_2v2_calibration_decomposition.md').write_text('\n'.join(lines)+'\n')
          Path('/tmp/b3b_summary.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
          cat /tmp/b3b_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove reconstructed per-ballot dataset before artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/package-adjustment-v8-b3b/frozen_opened_dataset.json

