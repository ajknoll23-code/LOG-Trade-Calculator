name: Package Adjustment V5 KTC Isolation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  isolate-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install regression dependency
        run: pip install requests

      - name: Baseline Package Adjustment validator
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Baseline full repository regression
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Patch V5 transport isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ktc = Path("scripts/market/ktc_pipeline.py")
          reg = Path("scripts/validation/repo_regression_checks.py")

          ktc_text = ktc.read_text(encoding="utf-8")
          old_comment = (
              "# Package Preference Voting V1/V2/V3/V4 shares transport only. Remove all\n"
              "# reserved row families before normal KTC daily-cap and Bradley-Terry work.\n"
              'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|")'
          )
          new_comment = (
              "# Package Preference Voting V1/V2/V3/V4/V5 shares transport only. Remove all\n"
              "# reserved row families before normal KTC daily-cap and Bradley-Terry work.\n"
              'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|", "__pkgv5__|")'
          )
          if ktc_text.count(old_comment) != 1:
              raise RuntimeError("Expected exact pre-V5 package-vote prefix block once")
          ktc_text = ktc_text.replace(old_comment, new_comment, 1)
          ktc.write_text(ktc_text, encoding="utf-8")

          reg_text = reg.read_text(encoding="utf-8")
          if "import ast\n" not in reg_text:
              if reg_text.count("import hashlib\n") != 1:
                  raise RuntimeError("Could not safely add ast import")
              reg_text = reg_text.replace("import hashlib\n", "import ast\nimport hashlib\n", 1)

          old_func_start = (
              'def check_aliases_and_ktc_positions():\n'
              '    subprocess.run([sys.executable, str(SCRIPT_DIR / "check_no_duplicate_prod_mult_keys.py")], cwd=REPO_ROOT, check=True)\n'
          )

          new_func_start = (
              'def check_aliases_and_ktc_positions():\n'
              '    # Package-research rows share the KTC Sheet transport but must never enter\n'
              '    # normal Keep/Trade/Cut Bradley-Terry fitting. Keep this exact reserved\n'
              '    # prefix family under permanent repo regression as new research versions\n'
              '    # are introduced.\n'
              '    ktc_path = SCRIPT_DIR.parent / "market" / "ktc_pipeline.py"\n'
              '    ktc_tree = ast.parse(ktc_path.read_text(encoding="utf-8"))\n'
              '    package_prefixes = None\n'
              '    for node in ktc_tree.body:\n'
              '        if isinstance(node, ast.Assign):\n'
              '            for target in node.targets:\n'
              '                if isinstance(target, ast.Name) and target.id == "PACKAGE_VOTE_PREFIXES":\n'
              '                    package_prefixes = ast.literal_eval(node.value)\n'
              '                    break\n'
              '        if package_prefixes is not None:\n'
              '            break\n'
              '\n'
              '    expected_package_prefixes = (\n'
              '        "__pkgv1__|",\n'
              '        "__pkgv2__|",\n'
              '        "__pkgv3__|",\n'
              '        "__pkgv4__|",\n'
              '        "__pkgv5__|",\n'
              '    )\n'
              '    assert package_prefixes == expected_package_prefixes, (\n'
              '        "KTC/package-vote transport isolation drift: "\n'
              '        f"{package_prefixes} != {expected_package_prefixes}"\n'
              '    )\n'
              '\n'
              '    subprocess.run([sys.executable, str(SCRIPT_DIR / "check_no_duplicate_prod_mult_keys.py")], cwd=REPO_ROOT, check=True)\n'
          )

          if reg_text.count(old_func_start) != 1:
              raise RuntimeError("Expected check_aliases_and_ktc_positions function start once")
          reg_text = reg_text.replace(old_func_start, new_func_start, 1)
          reg.write_text(reg_text, encoding="utf-8")

          print("Patched KTC package-vote isolation through V5.")
          print("Added permanent AST-based V1-V5 prefix regression guard.")

          PY

      - name: Verify KTC V5 exclusion behavior
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/market/ktc_pipeline.py")
          spec = importlib.util.spec_from_file_location("ktc_pipeline_v5_check", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          expected = (
              "__pkgv1__|",
              "__pkgv2__|",
              "__pkgv3__|",
              "__pkgv4__|",
              "__pkgv5__|",
          )
          assert mod.PACKAGE_VOTE_PREFIXES == expected

          for prefix in expected:
              assert mod.is_package_vote_row({"keep": prefix + "abc|P"})

          assert not mod.is_package_vote_row({"keep": "Ja'Marr Chase"})

          rows = [
              {"keep":"Player A","trade":"Player B","cut":"Player C","timestamp":"2026-09-09T00:00:00Z","voter_roster_id":"1"},
              {"keep":"__pkgv5__|abc|P","trade":"__pkgv5_meta__|T","cut":"__pkgv5_schema__|5","timestamp":"2026-09-09T00:00:01Z","voter_roster_id":"1"},
          ]
          normal = [r for r in rows if not mod.is_package_vote_row(r)]
          assert len(normal) == 1
          assert normal[0]["keep"] == "Player A"

          print("PASS V5 package rows cannot enter normal KTC vote fitting.")
          PY

      - name: Run KTC pipeline self-test
        run: python3 scripts/market/ktc_pipeline.py --selftest

      - name: Run Package Adjustment validator after patch
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Run full repository regression after patch
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Protect production and frozen Package Adjustment evidence
        shell: bash
        run: |
          git diff --exit-code -- index.html
          git diff --exit-code -- research/package-adjustment-v3
          git diff --exit-code -- research/package-adjustment-v4
          git diff --exit-code -- research/package-adjustment-v5
          git diff --exit-code -- research/package-adjustment-production-candidate-v1
          git diff --exit-code -- .github/workflows
          git diff --exit-code -- scripts/validation/check_package_adjustment_live.py

      - name: Verify only isolation files changed
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "scripts/market/ktc_pipeline.py",
              "scripts/validation/repo_regression_checks.py",
          }
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          paths = set()
          for row in rows:
              if not row.strip():
                  continue
              path = row[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)

          assert paths == allowed, f"Unexpected V5 isolation changes: {sorted(paths)}"
          print("V5 isolation change set verified.")
          PY

      - name: Validate Python and whitespace
        shell: bash
        run: |
          python3 -m py_compile scripts/market/ktc_pipeline.py
          python3 -m py_compile scripts/validation/repo_regression_checks.py
          git diff --check

      - name: Commit V5 KTC isolation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/market/ktc_pipeline.py
          git add scripts/validation/repo_regression_checks.py

          git commit -m "Isolate V5 package votes from KTC aggregation"
          git pull --rebase origin main
          git push origin main
