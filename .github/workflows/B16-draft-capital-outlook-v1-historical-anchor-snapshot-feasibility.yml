name: B16 Draft Capital Outlook V1 - Historical Anchor Snapshot Feasibility

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  feasibility:
    name: B16 audit consistent historical anchor snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B16 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard exact B15 pass and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b15_manifest.json").read_text())
          s=json.loads((D/"b15_2027_anchor_capture_summary.json").read_text())

          assert m["decision"]=="PASS_B15_2027_ANCHOR_ARCHIVE_AUTHORIZE_B16_HISTORICAL_SNAPSHOT_FEASIBILITY_ONLY"
          assert m["technical_gate_pass"] is True
          assert m["captured_n"]==7
          assert m["b16_historical_snapshot_feasibility_authorized"] is True
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["decision"]=="PASS_B15_2027_ANCHOR_ARCHIVE_AUTHORIZE_B16_HISTORICAL_SNAPSHOT_FEASIBILITY_ONLY"
          assert s["technical_gate_pass"] is True
          assert s["captured_n"]==7
          assert s["captured_distinct_domain_n"]==6
          assert s["captured_by_category"]["consensus_or_public_big_board"]==4
          assert s["captured_by_category"]["mock_draft_or_mock_consensus"]==3
          assert s["b16_historical_snapshot_feasibility_authorized"] is True
          assert s["c1_model_preregistration_authorized"] is False
          assert s["2027_class_scored"] is False
          assert s["production_change_authorized"] is False

          # Guard core B15 artifacts by their frozen manifest hashes.
          for name in [
              "b15_2027_source_catalog_frozen.json",
              "b15_2027_anchor_capture_ledger.json",
              "b15_2027_anchor_capture_summary.json",
              "b15_2027_anchor_capture_report.md",
          ]:
              expected=m["output_hashes"][name]
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          print("PASS: exact B15 pass and archive-only authority guarded.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B16 historical feasibility protocol before network access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b16-freeze
          python3 - <<'PY'
          import json
          from pathlib import Path

          class_years=list(range(2014,2027))

          protocol={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_historical_snapshot_feasibility_protocol",
              "frozen_before_network_access":True,

              "scientific_purpose":"Determine whether a consistent, timestamp-verifiable historical pre-draft anchor series exists for enough classes to support later composition-channel parsing, target construction, and power analysis.",

              "class_years":class_years,
              "class_n":len(class_years),

              "anchor_rule":{
                  "anchor_calendar_year":"class_year_minus_1",
                  "window_start_month_day":"09-15",
                  "window_end_month_day":"10-15",
                  "target_date_month_day":"09-30",
                  "selection_rule":"Among timestamp-verified archived mocks whose embedded publication/update date falls inside the anchor window, choose the one minimizing absolute calendar-day distance to Sep 30. Tie-break toward the earlier date, then lexicographic URL.",
                  "selection_uses_outcomes":False,
                  "selection_uses_actual_nfl_draft_results":False
              },

              "primary_source_family":{
                  "source_family_id":"walterfootball_walt_mock_archive",
                  "source_name":"WalterFootball Walt NFL Mock Draft Archive",
                  "archive_index_url_template":"https://walterfootball.com/draft{class_year}archive.php",
                  "archive_page_url_pattern":"draft{class_year}archiveMMDD.php",
                  "reason":"A single longitudinal source family minimizes cross-source definition drift and exposes dedicated dated archive-index pages."
              },

              "discovery_contract":{
                  "fetch_archive_index_first":True,
                  "extract_only_same_class_archive_links":True,
                  "candidate_href_regex_template":"draft{class_year}archive[0-9]{4}\\.php",
                  "fallback_daily_probe_if_index_yields_zero_candidates":True,
                  "fallback_probe_dates":"Every calendar date Sep 15 through Oct 15 in anchor year.",
                  "must_verify_embedded_date_from_page_content":True,
                  "must_verify_class_year_marker":True,
                  "raw_index_saved_before_parse":True,
                  "raw_selected_snapshot_saved_before_parse":True
              },

              "request_contract":{
                  "timeout_seconds":45,
                  "max_attempts":3,
                  "backoff_seconds":[0,2,6],
                  "user_agent":"LOG-Draft-Capital-Outlook-B16/1.0 (+historical feasibility archive)",
                  "accept":"text/html,*/*;q=0.5",
                  "minimum_snapshot_bytes":1000
              },

              "class_feasibility_definition":{
                  "requires_archive_index_or_fallback_discovery":True,
                  "requires_selected_snapshot_http_2xx":True,
                  "requires_embedded_anchor_date_inside_window":True,
                  "requires_202x_or_201x_class_year_mock_marker":True,
                  "requires_minimum_raw_bytes":1000,
                  "does_not_require_player_parse_yet":True
              },

              "formal_feasibility_gate":{
                  "minimum_feasible_classes":10,
                  "total_candidate_classes":13,
                  "minimum_fraction":10/13,
                  "pass_decision":"PASS_B16_HISTORICAL_ANCHOR_SERIES_AUTHORIZE_B17_PARSING_AND_TARGET_FEASIBILITY_ONLY",
                  "fail_decision":"STOP_B16_HISTORICAL_ANCHOR_SERIES_INSUFFICIENT_FOR_CONFIRMATORY_PATH",
                  "c1_model_preregistration_authorized_on_pass":False,
                  "production_authorized_on_pass":False
              },

              "secondary_diagnostics_non_gating":[
                  "Number of archive links discovered per class.",
                  "Distance in days from selected snapshot to Sep 30.",
                  "Whether fallback probing was required.",
                  "Selected snapshot raw byte size.",
                  "Whether companion archived pages appear to exist."
              ],

              "future_boundary":{
                  "b17_if_pass":"Parse the selected historical snapshots and assess whether a consistent fantasy-position projected-draft-capital target can be reconstructed without outcome-informed source changes.",
                  "c1_still_requires_separate_preregistration":True,
                  "future_power_gate_required_before_c1":True,
                  "2024_2026_h3_outcomes_not_needed_or_opened":True,
                  "2027_class_score_not_authorized":True
              },

              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }

          p=Path("/tmp/b16-freeze/b16_protocol_frozen.json")
          p.write_text(json.dumps(protocol,indent=2,sort_keys=True)+"\n")
          assert protocol["class_n"]==13
          assert protocol["formal_feasibility_gate"]["minimum_feasible_classes"]==10
          print("PASS: B16 historical feasibility protocol frozen before network access.")
          PY

      - name: Discover and capture historical anchor snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from datetime import date, datetime, timedelta, timezone
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests

          D=Path("research/draft-capital-outlook-v1")
          ARCH=D/"archive/historical-anchor-feasibility"
          IDX=ARCH/"indexes"
          RAW=ARCH/"selected"
          META=ARCH/"metadata"
          for p in (IDX,RAW,META):
              p.mkdir(parents=True,exist_ok=True)

          protocol=json.loads(Path("/tmp/b16-freeze/b16_protocol_frozen.json").read_text())
          req=protocol["request_contract"]

          session=requests.Session()
          session.headers.update({
              "User-Agent":req["user_agent"],
              "Accept":req["accept"],
              "Accept-Language":"en-US,en;q=0.9",
              "Accept-Encoding":"identity"
          })

          def get(url):
              attempts=[]
              response=None
              error=None
              for attempt in range(int(req["max_attempts"])):
                  delay=req["backoff_seconds"][attempt]
                  if delay:
                      time.sleep(delay)
                  try:
                      t0=time.time()
                      response=session.get(
                          url,
                          timeout=float(req["timeout_seconds"]),
                          allow_redirects=True
                      )
                      attempts.append({
                          "attempt":attempt+1,
                          "status_code":int(response.status_code),
                          "elapsed_seconds":round(time.time()-t0,3),
                          "final_url":response.url
                      })
                      if response.status_code not in {429,500,502,503,504}:
                          break
                  except Exception as e:
                      error=f"{type(e).__name__}: {e}"
                      attempts.append({"attempt":attempt+1,"error":error})
              return response,attempts,error

          def text_of(resp):
              enc=resp.encoding or "utf-8"
              try:
                  return resp.content.decode(enc,errors="replace")
              except LookupError:
                  return resp.content.decode("utf-8",errors="replace")

          def visibleish(html):
              s=re.sub(r"(?is)<script.*?</script>|<style.*?</style>|<noscript.*?</noscript>"," ",html)
              s=re.sub(r"(?s)<[^>]+>"," ",s)
              s=unescape(s)
              return " ".join(s.split())

          MONTHS={
              "jan":1,"january":1,"feb":2,"february":2,"mar":3,"march":3,
              "apr":4,"april":4,"may":5,"jun":6,"june":6,"jul":7,"july":7,
              "aug":8,"august":8,"sep":9,"sept":9,"september":9,"oct":10,
              "october":10,"nov":11,"november":11,"dec":12,"december":12
          }

          def embedded_dates(text,anchor_year):
              found=set()

              # Month-name dates, usually in "Last update" or archive labels.
              rx=re.compile(
                  r"\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|"
                  r"Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
                  r"\.?\s+([0-3]?\d)(?:st|nd|rd|th)?(?:,\s*|\s+)(20\d{2})\b",
                  re.I
              )
              for m in rx.finditer(text):
                  mon=MONTHS[m.group(1).lower().rstrip(".")]
                  day=int(m.group(2));yr=int(m.group(3))
                  try:
                      found.add(date(yr,mon,day))
                  except ValueError:
                      pass

              # Numeric ISO dates.
              for m in re.finditer(r"\b(20\d{2})-(0[1-9]|1[0-2])-([0-3]\d)\b",text):
                  try:
                      found.add(date(int(m.group(1)),int(m.group(2)),int(m.group(3))))
                  except ValueError:
                      pass

              # MM/DD/YY(YY)
              for m in re.finditer(r"\b(0?[1-9]|1[0-2])/([0-3]?\d)/(20\d{2}|\d{2})\b",text):
                  yr=int(m.group(3))
                  if yr<100:yr+=2000
                  try:
                      found.add(date(yr,int(m.group(1)),int(m.group(2))))
                  except ValueError:
                      pass

              return sorted(d for d in found if d.year==anchor_year)

          results=[]
          network_capture_started=datetime.now(timezone.utc).isoformat()

          for class_year in protocol["class_years"]:
              anchor_year=class_year-1
              window_start=date(anchor_year,9,15)
              window_end=date(anchor_year,10,15)
              target=date(anchor_year,9,30)
              index_url=protocol["primary_source_family"]["archive_index_url_template"].format(class_year=class_year)

              index_resp,index_attempts,index_error=get(index_url)
              index_status=int(index_resp.status_code) if index_resp is not None else None
              index_raw=index_resp.content if index_resp is not None else b""
              index_file=IDX/f"{class_year}_archive_index.html"
              if index_resp is not None:
                  index_file.write_bytes(index_raw)

              discovered=[]
              discovery_mode="archive_index"

              if index_resp is not None and 200<=index_resp.status_code<300:
                  html=text_of(index_resp)
                  pattern=re.compile(
                      rf'href=["\']([^"\']*draft{class_year}archive\d{{4}}\.php)["\']',
                      re.I
                  )
                  for href in pattern.findall(html):
                      u=urljoin(index_resp.url,href)
                      if u not in discovered:
                          discovered.append(u)

              # If the index does not expose archive links, use the preregistered deterministic fallback.
              if not discovered:
                  discovery_mode="deterministic_daily_probe"
                  d=window_start
                  while d<=window_end:
                      discovered.append(
                          f"https://walterfootball.com/draft{class_year}archive{d.strftime('%m%d')}.php"
                      )
                      d+=timedelta(days=1)

              candidates=[]
              probe_records=[]
              for url in discovered:
                  resp,attempts,error=get(url)
                  status=int(resp.status_code) if resp is not None else None
                  raw=resp.content if resp is not None else b""
                  rec={
                      "url":url,
                      "http_status":status,
                      "attempts":attempts,
                      "error":error,
                      "raw_bytes":len(raw)
                  }

                  if resp is None or not (200<=resp.status_code<300) or len(raw)<int(req["minimum_snapshot_bytes"]):
                      probe_records.append(rec)
                      continue

                  text=text_of(resp)
                  vis=visibleish(text)
                  dates=embedded_dates(vis,anchor_year)
                  in_window=[d for d in dates if window_start<=d<=window_end]
                  class_marker=(
                      f"{class_year} NFL Mock Draft".lower() in vis.lower()
                      or f"{class_year} NFL MOCK DRAFT".lower() in vis.lower()
                  )

                  rec["embedded_dates"]=[d.isoformat() for d in dates]
                  rec["anchor_dates"]=[d.isoformat() for d in in_window]
                  rec["class_year_marker"]=class_marker
                  rec["final_url"]=resp.url
                  probe_records.append(rec)

                  if not in_window or not class_marker:
                      continue

                  # If multiple anchor dates are embedded, use the one nearest target.
                  chosen_date=min(
                      in_window,
                      key=lambda d:(abs((d-target).days), d)
                  )

                  candidates.append({
                      "url":url,
                      "final_url":resp.url,
                      "embedded_anchor_date":chosen_date,
                      "distance_days":abs((chosen_date-target).days),
                      "raw_bytes":len(raw),
                      "raw":raw
                  })

              selected=None
              if candidates:
                  selected=min(
                      candidates,
                      key=lambda c:(c["distance_days"], c["embedded_anchor_date"], c["url"])
                  )

              selected_raw_path=None
              selected_sha=None
              selected_date=None
              feasible=False
              companion_candidates=[]

              if selected is not None:
                  selected_date=selected["embedded_anchor_date"].isoformat()
                  selected_file=RAW/f"{class_year}_{selected['embedded_anchor_date'].strftime('%Y%m%d')}.html"
                  selected_file.write_bytes(selected["raw"])
                  selected_raw_path=str(selected_file)
                  selected_sha=hashlib.sha256(selected["raw"]).hexdigest()
                  feasible=True

                  # Non-gating companion-page diagnostic only.
                  base=selected["url"][:-4] if selected["url"].lower().endswith(".php") else selected["url"]
                  companion_candidates=[base+"_1.php",base+"_2.php",base+"_3.php"]

              meta={
                  "schema_version":1,
                  "class_year":class_year,
                  "anchor_year":anchor_year,
                  "anchor_window_start":window_start.isoformat(),
                  "anchor_window_end":window_end.isoformat(),
                  "target_date":target.isoformat(),
                  "archive_index_url":index_url,
                  "archive_index_http_status":index_status,
                  "archive_index_attempts":index_attempts,
                  "archive_index_error":index_error,
                  "archive_index_raw_path":str(index_file) if index_resp is not None else None,
                  "archive_index_raw_sha256":hashlib.sha256(index_raw).hexdigest() if index_raw else None,
                  "discovery_mode":discovery_mode,
                  "discovered_candidate_n":len(discovered),
                  "probe_records":probe_records,
                  "valid_candidate_n":len(candidates),
                  "selected_url":selected["url"] if selected else None,
                  "selected_final_url":selected["final_url"] if selected else None,
                  "selected_embedded_anchor_date":selected_date,
                  "selected_distance_days":selected["distance_days"] if selected else None,
                  "selected_raw_bytes":selected["raw_bytes"] if selected else None,
                  "selected_raw_path":selected_raw_path,
                  "selected_raw_sha256":selected_sha,
                  "companion_candidates_non_gating":companion_candidates,
                  "feasible":feasible,
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }
              meta_file=META/f"{class_year}.json"
              meta_file.write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
              results.append(meta)

          out={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_historical_snapshot_feasibility_result",
              "network_capture_started_utc":network_capture_started,
              "network_capture_finished_utc":datetime.now(timezone.utc).isoformat(),
              "class_years":protocol["class_years"],
              "results":results,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          Path("/tmp/b16_results.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "class_n":len(results),
              "feasible_n":sum(r["feasible"] for r in results),
              "feasible_years":[r["class_year"] for r in results if r["feasible"]]
          },indent=2))
          PY

      - name: Apply frozen B16 feasibility gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, statistics
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          protocol=json.loads(Path("/tmp/b16-freeze/b16_protocol_frozen.json").read_text())
          raw=json.loads(Path("/tmp/b16_results.json").read_text())
          gate=protocol["formal_feasibility_gate"]

          feasible=[r for r in raw["results"] if r["feasible"]]
          feasible_n=len(feasible)
          passed=feasible_n>=int(gate["minimum_feasible_classes"])
          decision=gate["pass_decision"] if passed else gate["fail_decision"]

          distances=[int(r["selected_distance_days"]) for r in feasible if r["selected_distance_days"] is not None]

          summary={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_historical_snapshot_feasibility_summary",
              "decision":decision,
              "technical_feasibility_pass":passed,
              "candidate_class_n":len(raw["results"]),
              "minimum_feasible_classes_required":int(gate["minimum_feasible_classes"]),
              "feasible_class_n":feasible_n,
              "feasible_fraction":feasible_n/len(raw["results"]) if raw["results"] else 0.0,
              "feasible_class_years":[r["class_year"] for r in feasible],
              "infeasible_class_years":[r["class_year"] for r in raw["results"] if not r["feasible"]],
              "selected_snapshots":{
                  str(r["class_year"]):{
                      "selected_url":r["selected_url"],
                      "embedded_anchor_date":r["selected_embedded_anchor_date"],
                      "distance_days":r["selected_distance_days"],
                      "raw_bytes":r["selected_raw_bytes"],
                      "discovery_mode":r["discovery_mode"],
                      "valid_candidate_n":r["valid_candidate_n"]
                  }
                  for r in feasible
              },
              "distance_days_median":statistics.median(distances) if distances else None,
              "distance_days_max":max(distances) if distances else None,
              "b17_parsing_and_target_feasibility_authorized":passed,
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "scientific_note":"B16 tests only existence of a sufficiently long, timestamp-verified historical anchor series from one consistent source family. It does not test predictive skill."
          }

          (D/"b16_protocol_frozen.json").write_bytes(
              Path("/tmp/b16-freeze/b16_protocol_frozen.json").read_bytes()
          )
          (D/"b16_historical_snapshot_feasibility_result.json").write_bytes(
              Path("/tmp/b16_results.json").read_bytes()
          )
          (D/"b16_historical_snapshot_feasibility_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps(summary,indent=2))
          PY

      - name: Validate B16 archive integrity and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          P=json.loads((D/"b16_protocol_frozen.json").read_text())
          R=json.loads((D/"b16_historical_snapshot_feasibility_result.json").read_text())
          S=json.loads((D/"b16_historical_snapshot_feasibility_summary.json").read_text())

          assert P["frozen_before_network_access"] is True
          assert P["class_years"]==list(range(2014,2027))
          assert P["formal_feasibility_gate"]["minimum_feasible_classes"]==10
          assert P["anchor_rule"]["selection_uses_outcomes"] is False
          assert P["anchor_rule"]["selection_uses_actual_nfl_draft_results"] is False
          assert P["future_boundary"]["c1_still_requires_separate_preregistration"] is True
          assert P["future_boundary"]["future_power_gate_required_before_c1"] is True
          assert P["future_boundary"]["2024_2026_h3_outcomes_not_needed_or_opened"] is True

          assert len(R["results"])==13
          assert len({r["class_year"] for r in R["results"]})==13

          for r in R["results"]:
              assert r["predictor_fit_performed"] is False
              assert r["2027_class_scored"] is False
              assert r["production_change_authorized"] is False

              if r["feasible"]:
                  p=Path(r["selected_raw_path"])
                  assert p.is_file(),p
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==r["selected_raw_sha256"]
                  assert r["selected_embedded_anchor_date"] is not None
                  assert r["selected_distance_days"] is not None
                  assert r["selected_raw_bytes"]>=1000

          assert S["c1_model_preregistration_authorized"] is False
          assert S["predictor_fit_performed"] is False
          assert S["2027_class_scored"] is False
          assert S["production_change_authorized"] is False

          if S["technical_feasibility_pass"]:
              assert S["decision"]=="PASS_B16_HISTORICAL_ANCHOR_SERIES_AUTHORIZE_B17_PARSING_AND_TARGET_FEASIBILITY_ONLY"
              assert S["feasible_class_n"]>=10
              assert S["b17_parsing_and_target_feasibility_authorized"] is True
          else:
              assert S["decision"]=="STOP_B16_HISTORICAL_ANCHOR_SERIES_INSUFFICIENT_FOR_CONFIRMATORY_PATH"
              assert S["feasible_class_n"]<10
              assert S["b17_parsing_and_target_feasibility_authorized"] is False

          print("PASS: B16 selected-snapshot hashes and scientific boundaries validated.")
          PY

      - name: Freeze B16 report and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          S=json.loads((D/"b16_historical_snapshot_feasibility_summary.json").read_text())

          report=[
              "# Draft Capital Outlook V1 — B16 Historical Anchor Snapshot Feasibility",
              "",
              "## Decision",
              "",
              S["decision"],
              "",
              f'- Candidate classes: {S["candidate_class_n"]}',
              f'- Required feasible classes: {S["minimum_feasible_classes_required"]}',
              f'- Feasible classes: {S["feasible_class_n"]}',
              f'- Feasible years: {S["feasible_class_years"]}',
              f'- Infeasible years: {S["infeasible_class_years"]}',
              f'- Median selected-date distance from Sep 30: {S["distance_days_median"]}',
              f'- Maximum selected-date distance from Sep 30: {S["distance_days_max"]}',
              "",
              "## Authority",
              "",
              f'- B17 parsing/target feasibility authorized: {S["b17_parsing_and_target_feasibility_authorized"]}',
              "- C1 model preregistration authorized: false",
              "- Predictor fitting performed: false",
              "- 2027 class scored: false",
              "- Production change authorized: false",
              "",
              "B16 establishes historical point-in-time source availability only.",
              ""
          ]
          (D/"b16_historical_snapshot_feasibility_report.md").write_text("\n".join(report))

          core=[
              "b16_protocol_frozen.json",
              "b16_historical_snapshot_feasibility_result.json",
              "b16_historical_snapshot_feasibility_summary.json",
              "b16_historical_snapshot_feasibility_report.md",
          ]
          archive_files=sorted(
              p for p in (D/"archive/historical-anchor-feasibility").rglob("*")
              if p.is_file()
          )
          hashes={n:hashlib.sha256((D/n).read_bytes()).hexdigest() for n in core}
          hashes.update({
              str(p.relative_to(D)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in archive_files
          })

          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_manifest",
              "decision":S["decision"],
              "technical_feasibility_pass":S["technical_feasibility_pass"],
              "feasible_class_n":S["feasible_class_n"],
              "output_hashes":hashes,
              "b17_parsing_and_target_feasibility_authorized":S["b17_parsing_and_target_feasibility_authorized"],
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (D/"b16_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("PASS: B16 manifest frozen.")
          PY

      - name: Run post-B16 repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove B16 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith("research/draft-capital-outlook-v1/b16_")
              or p.startswith("research/draft-capital-outlook-v1/archive/historical-anchor-feasibility/")
              for p in touched
          ),touched
          assert not any(p.startswith(("model/","scripts/","data/")) for p in touched),touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: B16 mutation scope is research-only.")
          PY

      - name: Commit B16 historical feasibility result
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B16."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-capital-outlook-v1/b16_protocol_frozen.json \
            research/draft-capital-outlook-v1/b16_historical_snapshot_feasibility_result.json \
            research/draft-capital-outlook-v1/b16_historical_snapshot_feasibility_summary.json \
            research/draft-capital-outlook-v1/b16_historical_snapshot_feasibility_report.md \
            research/draft-capital-outlook-v1/b16_manifest.json \
            research/draft-capital-outlook-v1/archive/historical-anchor-feasibility/

          git commit -m "Audit historical Draft Capital Outlook anchor snapshots"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B16 historical feasibility result committed."
