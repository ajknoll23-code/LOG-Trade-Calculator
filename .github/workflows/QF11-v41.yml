# QF11 V41: READ ONLY. No Google Apps Script calls, real participants, source writes, or production changes.
name: QF11 V41 - KTC V2 Batched Privacy and Transport Audit (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qf11-v41-privacy-transport-read-only
  cancel-in-progress: false
jobs:
  audit:
    name: Pinned source, 23 new synthetic checks, privacy blocker report; no Google calls
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - name: Checkout pinned main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install regression dependency
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Verify V40r1 and frozen production source pins
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_SHA_DRIFT; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_WORKTREE_CHANGED; exit 1; }

        check() { test -f "$1" && test "$(git hash-object "$1")" = "$2" || { echo "STOP_SOURCE_PIN_DRIFT:$1"; exit
        1; }; }

        check .github/workflows/QF11-v40r1.yml a0b103bf7a80c7c33a990fe2962f0b6404ddef27

        check research/ktc-v2-isolated/collector.gs ced5f95d3e34023d37b95cf7029c94ccdcdca483

        check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a

        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d

        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7

        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860

        check research/ktc-v2-isolated/client-bridge.js a7dd731fd013c0ce7e547eb05ae8c825e85ccd9b

        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167

        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28

        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        [[ -f data/players_cache.json ]] || { echo STOP_PRODUCTION_CACHE_MISSING; exit 1; }

        echo QF11_V41_SOURCE_AND_PRODUCTION_PINS_PASS'
    - name: Run existing isolated KTC and frozen production regression suites
      run: 'set -euo pipefail

        node --check research/ktc-v2-isolated/collector.gs

        node --check research/ktc-v2-isolated/frame-host.gs

        node research/ktc-v2-isolated/collector.test.js

        node research/ktc-v2-isolated/client-bridge.test.js

        node research/ktc-v2-isolated/frame-host.test.js

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V41_EXISTING_SYNTHETIC_AND_FROZEN_REGRESSIONS_PASS'
    - name: Run new synthetic retention, disabled gates and iframe boundary tests
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v41\ncat > /tmp/qf11-v41/audit.js <<'QF11V41AUDIT'\n\"use strict\"\
        ;\n// All storage, tokens, time and Apps Script APIs in this test are synthetic.\nconst fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),crypto=require('node:crypto');\n\
        const base='research/ktc-v2-isolated/';\nconst collector=fs.readFileSync(base+'collector.gs','utf8');\n\
        const host=fs.readFileSync(base+'frame-host.gs','utf8');\nconst html=fs.readFileSync(base+'pilot-frame.html','utf8');\n\
        const code=collector+'\\n'+host;\nconst KEYS=['QF11_V2_ENABLED','QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'];\n\
        const HEAD=['received_utc','delete_due_utc','schema','slot','display_order','token_hmac','keep','trade','cut','q1','q2','q3','review_status'];\n\
        const SCHEMA='QF11_KTC_V2_PILOT_RESPONSE_V1',NOW=Date.parse('2026-10-13T12:00:00.000Z'),DAY=86400000;\n\
        const token='SYNTHETIC_QF11_V41_TOKEN_12345678901234567890',secret='SYNTHETIC_QF11_V41_SECRET_12345678901234567890';\n\
        const digest=crypto.createHmac('sha256',secret).update(token).digest('base64url');\nclass TestDate extends\
        \ Date{static now(){return NOW;}}\nlet passed=0;const names=[];\nfunction check(name,fn){fn();names.push(name);passed++;process.stdout.write('PASS\
        \ '+name+'\\n');}\nfunction fixture(authorized=false){\n  const state={rows:[HEAD.slice()],events:[],failDelete:false,lockBusy:false,lockHeld:false};\n\
        \  const cfg={QF11_V1_SHEET_ID:'SYNTHETIC_V1',QF11_V2_SHEET_ID:'SYNTHETIC_V2',QF11_V2_SEPARATE_SHEET_VERIFIED:'YES',QF11_V2_HALTED:'false',QF11_V2_CLOSED:'false',QF11_V2_HMAC_SECRET:secret,QF11_V2_INVITES_JSON:JSON.stringify({[digest]:{slot:1,display_order:0}}),QF11_V2_PLAYER_KEYS_JSON:JSON.stringify(['test_a','test_b','test_c']),QF11_V2_PLAYER_LABELS_JSON:JSON.stringify(['Test\
        \ A','Test B','Test C'])};\n  for(const key of KEYS)cfg[key]=authorized?'true':'false';\n  const props={getProperty:k=>Object.prototype.hasOwnProperty.call(cfg,k)?cfg[k]:null,setProperty:(k,v)=>{cfg[k]=String(v);state.events.push('set:'+k+':'+v)}};\n\
        \  const sheet={getLastRow:()=>state.rows.length,\n    getRange:(r,c,n)=>({getValues:()=>state.rows.slice(r-1,r-1+n).map(row=>row.slice(c-1,c-1+HEAD.length))}),\n\
        \    getDataRange:()=>({getValues:()=>state.rows.map(x=>x.slice())}),\n    appendRow:row=>{state.events.push('append');state.rows.push(row.slice());},\n\
        \    deleteRow:i=>{state.events.push('delete:'+i);if(state.failDelete)throw Error('SYNTHETIC_DELETE_FAILURE');state.rows.splice(i-1,1)}};\n\
        \  const env={\n    PropertiesService:{getScriptProperties:()=>props},\n    SpreadsheetApp:{openById:id=>{assert.equal(id,'SYNTHETIC_V2');return\
        \ {getSheetByName:name=>name==='Responses'?sheet:null}}},\n    LockService:{getScriptLock:()=>({tryLock:()=>{if(state.lockBusy)return\
        \ false;state.lockHeld=true;return true;},releaseLock:()=>{state.lockHeld=false;}})},\n    Utilities:{computeHmacSha256Signature:(t,s)=>Array.from(crypto.createHmac('sha256',s).update(t).digest()),base64EncodeWebSafe:x=>Buffer.from(x).toString('base64url')},\n\
        \    ContentService:{MimeType:{JSON:'application/json'},createTextOutput:s=>({getContent:()=>s,setMimeType(){return\
        \ this}})},\n    HtmlService:{createHtmlOutput:s=>({getContent:()=>s})},Date:TestDate,JSON,Object,Array,String,Number,Set,Error,Math\n\
        \  };\n  vm.createContext(env);vm.runInContext(code,env,{timeout:3000});\n  const payload=()=>({schema:SCHEMA,participant_token:token,display_order:0,consent:true,adult:true,sf_idp_experience:true,keep:'test_a',trade:'test_b',cut:'test_c',mc:[1,1,0]});\n\
        \  const post=()=>JSON.parse(env.doPost({postData:{contents:JSON.stringify(payload())}}).getContent()).status;\n\
        \  return {state,cfg,env,payload,post};\n}\ncheck('collector and frame-host parse together',()=>{new vm.Script(code)});\n\
        check('all nine safety properties false blocks GET',()=>{const f=fixture();assert.match(f.env.doGet({}).getContent(),/not\
        \ accepting pilot responses/)});\ncheck('all nine safety properties false blocks bootstrap',()=>{const f=fixture();assert.equal(f.env.qf11v33Bootstrap(token).status,'DISABLED')});\n\
        check('all nine safety properties false blocks RPC submit',()=>{const f=fixture();assert.equal(f.env.qf11v33Submit(f.payload()).status,'DISABLED')});\n\
        check('all nine safety properties false blocks direct POST',()=>{const f=fixture();assert.equal(f.post(),'DISABLED');assert.equal(f.state.rows.length,1)});\n\
        check('ENABLED alone does not authorize POST or RPC',()=>{const f=fixture();f.cfg.QF11_V2_ENABLED='true';assert.equal(f.post(),'DISABLED');assert.equal(f.env.qf11v33Submit(f.payload()).status,'DISABLED')});\n\
        check('each individual approval gate independently blocks direct POST',()=>{for(const k of KEYS){const f=fixture(true);f.cfg[k]='false';assert.equal(f.post(),'DISABLED',k);assert.equal(f.state.rows.length,1)}});\n\
        check('synthetic authorized row is hashed and expires exactly at 30 days',()=>{const f=fixture(true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');assert.equal(f.state.rows.length,2);assert.equal(Date.parse(f.state.rows[1][1])-Date.parse(f.state.rows[1][0]),30*DAY);assert(!JSON.stringify(f.state.rows).includes(token))});\n\
        check('unexpired synthetic row is retained on manual purge',()=>{const f=fixture();f.state.rows.push(['',new\
        \ Date(NOW+DAY).toISOString()]);assert.equal(f.env.purgeExpiredQF11V2Rows(),0);assert.equal(f.state.rows.length,2)});\n\
        check('expired synthetic row is deleted and intake halted first',()=>{const f=fixture();f.state.rows.push(['',new\
        \ Date(NOW-1).toISOString()]);assert.equal(f.env.purgeExpiredQF11V2Rows(),1);assert.equal(f.state.rows.length,1);assert(f.state.events.indexOf('set:QF11_V2_HALTED:true')<f.state.events.indexOf('delete:2'))});\n\
        check('multiple expired rows delete in descending row order',()=>{const f=fixture();f.state.rows.push(['',new\
        \ Date(NOW-2*DAY).toISOString()],['',new Date(NOW+DAY).toISOString()],['',new Date(NOW-1).toISOString()]);assert.equal(f.env.purgeExpiredQF11V2Rows(),2);assert.equal(f.state.rows.length,2);assert.deepEqual(f.state.events.filter(x=>x.startsWith('delete:')),['delete:4','delete:2'])});\n\
        check('corrupt deadline is treated as expired and deleted',()=>{const f=fixture();f.state.rows.push(['','not-a-date']);assert.equal(f.env.purgeExpiredQF11V2Rows(),1);assert.equal(f.cfg.QF11_V2_HALTED,'true')});\n\
        check('delete failure propagates and leaves intake halted',()=>{const f=fixture();f.state.rows.push(['',new\
        \ Date(NOW-1).toISOString()]);f.state.failDelete=true;assert.throws(()=>f.env.purgeExpiredQF11V2Rows(),/SYNTHETIC_DELETE_FAILURE/);assert.equal(f.cfg.QF11_V2_HALTED,'true');assert.equal(f.state.lockHeld,false)});\n\
        check('purge lock acquisition failure halts intake',()=>{const f=fixture();f.state.lockBusy=true;assert.throws(()=>f.env.purgeExpiredQF11V2Rows(),/LOCK_UNAVAILABLE/);assert.equal(f.cfg.QF11_V2_HALTED,'true')});\n\
        check('expired response blocks newly authorized intake even before purge',()=>{const f=fixture(true);f.state.rows.push(['',new\
        \ Date(NOW-1).toISOString()]);assert.equal(f.post(),'HALTED');assert.equal(f.cfg.QF11_V2_HALTED,'true');assert.equal(f.state.rows.length,2)});\n\
        check('a daily timer can exceed a 30-day deadline',()=>{const start=Date.parse('2026-10-13T00:00:01.000Z');const\
        \ expiry=start+30*DAY;const nextDailyMidnight=(Math.floor(expiry/DAY)+1)*DAY;assert(nextDailyMidnight>expiry);assert(nextDailyMidnight-expiry>=23*60*60*1000)});\n\
        check('collector source does not install or schedule a purge trigger',()=>{assert(!collector.includes('ScriptApp.newTrigger('));assert.equal((collector.match(/function\
        \ purgeExpiredQF11V2Rows\\(/g)||[]).length,1)});\ncheck('iframe uses ALLOWALL and only client referrer screening',()=>{assert(host.includes('setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)'));assert(html.includes('document.referrer'));assert(html.includes('EXPECTED_ORIGIN'));assert.equal((host.match(/QF11_V33_TRUSTED_PARENT_ORIGIN/g)||[]).length,1)});\n\
        check('iframe relies on Google RPC and no direct browser POST',()=>{assert(html.includes('google.script.run.withSuccessHandler'));for(const\
        \ v of ['fetch(', 'XMLHttpRequest', 'postMessage(', 'localStorage', 'sessionStorage'])assert(!html.includes(v),v)});\n\
        check('participant player labels use textContent',()=>{assert(html.includes('head.textContent=p.label'));assert(!html.includes('innerHTML'))});\n\
        check('consent text cites separately supplied information not independent signoff',()=>{assert(html.includes('approved\
        \ separate pilot consent information provided by the moderator'))});\ncheck('collector rejects unsolicited\
        \ freeform Q4 and keeps schema narrow',()=>{assert(collector.includes(\"var allowed=['schema','participant_token'\"\
        ));assert(!collector.includes(\"'q4'\"));assert(html.includes('never sent through this form'))});\ncheck('source\
        \ contains no direct live V1 endpoint and no live-script fetch',()=>{assert(!collector.includes('script.google.com/macros/s/'));assert(!host.includes('script.google.com/macros/s/'))});\n\
        fs.mkdirSync('/tmp/qf11-v41',{recursive:true});\nfs.writeFileSync('/tmp/qf11-v41/synthetic-tests.json',JSON.stringify({schema:'QF11_V41_SYNTHETIC_TESTS_V1',count:passed,cases:names,real_google_calls:0,real_participants:0,live_submissions:0},null,2)+'\\\
        n');\nconsole.log('QF11_V41_SYNTHETIC_SOURCE_TESTS_GREEN '+passed);\nQF11V41AUDIT\nnode --check /tmp/qf11-v41/audit.js\n\
        node /tmp/qf11-v41/audit.js\n"
    - name: Publish truthful consolidated blocker and next-step reports
      run: "set -euo pipefail\ncat > /tmp/qf11-v41/report.py <<'QF11V41REPORT'\nfrom pathlib import Path\nimport\
        \ json,subprocess\nout=Path('/tmp/qf11-v41')\nassert (out/'synthetic-tests.json').exists()\ntests=json.loads((out/'synthetic-tests.json').read_text())\n\
        issues=[\n {'id':'RETENTION_WINDOW','classification':'BLOCKER','evidence':'30-day expiry timestamp is written;\
        \ a once-daily purge can fire after the exact expiry, so a hard <=30-day guarantee is not established.',\
        \ 'next':'Preregister an earlier purge deadline and bounded monitoring/failure escalation; independently\
        \ validate actual execution and all retained copies.'},\n {'id':'SCHEDULED_EXECUTION','classification':'PENDING_REAL_EVIDENCE','evidence':'Owner\
        \ reports one configured deletion trigger and a successful manual empty-sheet run. This read-only GitHub\
        \ workflow cannot read Google trigger execution history.', 'next':'After the first scheduled window inspect\
        \ Apps Script Executions for purgeExpiredQF11V2Rows success, with no participant data.'},\n {'id':'IFRAME_ORIGIN','classification':'BLOCKER','evidence':'HTML\
        \ referrer check is client-side and host uses ALLOWALL. No server-authenticated parent origin or real Google\
        \ iframe policy validation established.', 'next':'Independent review of framing and authorization strategy;\
        \ test owner-only browser origin and deny-path in actual Google environment.'},\n {'id':'GOOGLE_RPC','classification':'PENDING_REAL_EVIDENCE','evidence':'google.script.run\
        \ is only tested via mocks; no genuine owner-only RPC acknowledgement/failure probe occurred.', 'next':'Design\
        \ and approve a disabled-only owner test without voting or opening seven approval flags.'},\n {'id':'CONSENT_AND_Q4','classification':'HUMAN_REVIEW_REQUIRED','evidence':'Consent\
        \ is obtained by checkbox referencing external moderator information; independent consent, Q1-Q4 review,\
        \ moderator SOP and data-copy deletion are unverified.', 'next':'Review and approve standalone consent text,\
        \ eligibility, Q4 rubric, logs/exports/invitation retention and deletion SOP.'},\n {'id':'PRODUCTION_ISOLATION','classification':'SOURCE_PINNED_LIVE_UNVERIFIED','evidence':'V41\
        \ only reads pinned KTC V2 source and frozen production artifacts; actual Google access and spreadsheet\
        \ permissions are outside this workflow.', 'next':'Operator review of project permissions and isolated sheet;\
        \ no market calibration or production change.'}\n]\nresult={'schema':'QF11_V41_BATCHED_PRIVACY_TRANSPORT_AUDIT_V1',\n\
        \ 'decision':'RESEARCH_GREEN_WITH_BLOCKERS__LIVE_PILOT_DISABLED',\n 'synthetic_test_count':tests['count'],'synthetic_test_names':tests['cases'],\n\
        \ 'source_test_pass':True,'issues':issues,\n 'real_google_calls':0,'live_votes_written':0,'google_project_changes':0,\n\
        \ 'production_changes':0,'trigger_installed_verified_by_workflow':False,\n 'scheduled_trigger_execution_verified':False,'hard_30_day_retention_proven':False,\n\
        \ 'actual_iframe_rpc_verified':False,'owner_launch_authorization':False,\n 'next_recommended_stage':'QF11\
        \ V42 retention-bound remediation preregistration and real-environment owner-only test plan; no activation.'}\n\
        (out/'readiness.json').write_text(json.dumps(result,indent=2)+'\\n')\nmd=['# QF11 V41 — Batched privacy/transport\
        \ readiness','',\n '**Verdict:** Synthetic/source audit GREEN with blocking findings; **do not activate\
        \ KTC V2**.','',\n f\"Synthetic runtime checks: **{tests['count']} PASS** (all mocks; no Google calls).\"\
        ,\n 'Existing collector, client bridge, iframe, and frozen production regression suites rerun independently.','',\n\
        \ 'This workflow does not inspect your actual Apps Script deployment, install a trigger, alter source, or\
        \ write votes.','',\n 'Owner-supplied evidence preceding V41: both disabled verifiers passed, exactly one\
        \ deletion trigger was seen by read-only inventory, and the manual purge completed without error against\
        \ an apparently empty response sheet. Those observations are **not** reproduced or certified by GitHub.','']\n\
        for item in issues:\n md += [f\"## {item['id']} — {item['classification']}\",item['evidence'],'',f\"Next:\
        \ {item['next']}\",'']\nmd += ['## Next recommended operator checks','',\n '1. Keep all nine QF11 V2 safety\
        \ flags literally `false`. Do **not** alter the existing spreadsheet or Apps Script source in this audit.',\n\
        \ '2. After a scheduled trigger window, inspect Apps Script **Executions** for `purgeExpiredQF11V2Rows`.\
        \ A manual run does not prove the schedule fired.',\n '3. Do not insert a fake expired row into the live\
        \ Responses sheet merely to create a successful deletion test. Use a separate fully synthetic fixture in\
        \ a future reviewed harness.',\n '4. Build V42 as a **source-only retention-bound remediation and owner-only\
        \ Google transport protocol**; obtain independent review before any live pilot authorization.',\n '5. Preserve\
        \ a strict separation from live KTC V1 votes and Market Value; no production coefficient changes.',\n '',\
        \ '**A green workflow is not an approval to recruit or collect responses.**','']\n(out/'OWNER-REVIEW.md').write_text('\\\
        n'.join(md))\nprint('QF11_V41_REPORT_READY_'+str(tests['count'])+'_SYNTHETIC_CHECKS_LIVE_BLOCKED')\nQF11V41REPORT\n\
        python3 /tmp/qf11-v41/report.py\n[[ -z \"$(git status --porcelain)\" ]] || { echo STOP_REPOSITORY_MODIFIED;\
        \ exit 1; }\necho QF11_V41_GREEN_RESEARCH_ONLY__LIVE_PILOT_BLOCKED\n"
    - name: Upload QF11 V41 read-only report
      uses: actions/upload-artifact@v4
      with:
        name: QF11-V41-BATCHED-PRIVACY-TRANSPORT-READ-ONLY
        path: '/tmp/qf11-v41/synthetic-tests.json

          /tmp/qf11-v41/readiness.json

          /tmp/qf11-v41/OWNER-REVIEW.md'
        retention-days: 14
        if-no-files-found: error
