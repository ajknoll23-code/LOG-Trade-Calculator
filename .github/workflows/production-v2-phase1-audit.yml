name: Production V2 Phase 1 Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-v2-phase1-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Phase 1 standalone self-test
        run: python3 research/production-v2/production_v2_phase1_audit.py --selftest

      - name: Canonical history self-test
        run: python3 scripts/model/production_history_component.py --selftest

      - name: Canonical IDP V1 self-test
        run: python3 scripts/model/idp_v1_projection.py

      - name: Current valuation source self-test
        run: python3 scripts/validation/snapshot_values.py --selftest

      - name: Build Production V2 Phase 1 audit
        run: python3 research/production-v2/production_v2_phase1_audit.py --write

      - name: Verify deterministic Phase 1 outputs
        run: python3 research/production-v2/production_v2_phase1_audit.py --check

      - name: Show Phase 1 report
        run: cat research/production-v2/production_v2_phase1_audit.md

      - name: Diff safety check
        shell: bash
        run: |
          git diff --check
          allowed="$(printf '%s\n' \
            research/production-v2/production_v2_phase1_audit.json \
            research/production-v2/production_v2_phase1_audit.md)"

          # Use git status rather than git diff so first-run UNTRACKED outputs
          # are included in the safety boundary too.
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sed '/^$/d')"
          unexpected="$(comm -23 <(printf '%s\n' "$changed" | sort -u) <(printf '%s\n' "$allowed" | sort -u))"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by research-only audit:"
            echo "$unexpected"
            exit 1
          fi

          # Stage only the two declared research outputs, then validate the
          # exact staged set and whitespace before any commit is possible.
          git add \
            research/production-v2/production_v2_phase1_audit.json \
            research/production-v2/production_v2_phase1_audit.md
          git diff --cached --check

          staged="$(git diff --cached --name-only)"
          unexpected_staged="$(comm -23 <(printf '%s\n' "$staged" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sort -u))"
          if [ -n "$unexpected_staged" ]; then
            echo "Unexpected files staged by research-only audit:"
            echo "$unexpected_staged"
            exit 1
          fi

      - name: Commit research outputs
        shell: bash
        run: |
          git config user.name "production-v2-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            research/production-v2/production_v2_phase1_audit.json \
            research/production-v2/production_v2_phase1_audit.md

          if git diff --cached --quiet; then
            echo "No Phase-1 audit-result changes to commit."
            exit 0
          fi

          git commit -m "Audit Production V2 Phase 1"
          git push origin main
