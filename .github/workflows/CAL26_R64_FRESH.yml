name: CAL26 V1R64 - Frozen 2026 Week6 Seven Position LOG Scoring Bridge (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r64-week6-seven-position-log-evidence
  cancel-in-progress: false
jobs:
  week6-sevenposition-LOG:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout pinned scoring and player IDs (read only)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download pinned R61 candidate player universe
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R61_OWNER_REVIEW_518_SCALE_SCENARIOS_NOT_FV
        run-id: 40059837648
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r64-inputs/R61
    - name: Download pinned R63 chronological Week6 backtest
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R63_SEVEN_POSITION_CHRONOLOGICAL_WEEK6_FV_HOLD
        run-id: 40064045458
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r64-inputs/R63
    - name: Freeze 2026 Week1-6 only, score all positions, enforce research hold
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R64_engine.py\" <<'PY_CAL26_V1R64_ENGINE'\n#!/usr/bin/env python3\n\
        \"\"\"CAL26 V1R64: frozen week1-6 Sleeper 2026 same-source LOG rule audit and cross-position observations.\nNo FV output,\
        \ no live writes; no endpoint for later 2026 weeks can be constructed.\n\"\"\"\nimport argparse,ast,collections,csv,hashlib,io,json,pathlib,re,sys,time,urllib.request\n\
        POSITIONS=('QB','RB','WR','TE','DL','LB','DB')\nR61={'CAL26_V1R61_manifest.json':'5632c5d440882bfeedd411aa020ef289c3d2be15cfbbc22f26c83cb8db191923',\n\
        \     'CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv':'deb362dbc4718f4ecf4837a34d17a349b29f9fc04d2657cbd1543b9d864e2ae2'}\n\
        R63={'CAL26_V1R63_manifest.json':'0c048f5b0b76461ecb22d0452f9f0904fc1ed924df22947b1014a388361339e2',\n     'CAL26_V1R63_7position_Week6_chronological_holdout.csv':'1d5c5cafa85d2a449c27e9bc96cbc90c3bcfd25004626518588f94781c802345'}\n\
        REPO_PINS={'research/roster-economics/historical_weekly_points_pipeline.py':'d6d6c6b4c2725eca3aae46f6c32dcc6ae8633ace',\n\
        \ 'research/player-role-v2/player_role_v2_b46_v1r2_sleeper_identity_snapshot.csv':'1bfef5e688cb3d69dbc77f62e879319e38054bde',\n\
        \ 'scripts/sleeper_2026_projections.json':'049a5683085ff9751f4d5bc29d437c132e0562a2',\n 'data/trade_history.json':'aa0ff2f2e839d3fc6aec67cfc6615c4130844ef3'}\n\
        CORE_2026={'pass_yd':.04,'pass_td':4,'pass_int':-2,'rush_att':.2,'rush_yd':.1,'rush_td':6,'rec':.5,'rec_yd':.1,'rec_td':6,'idp_tkl_solo':1.5,'idp_tkl_ast':.75,'idp_sack':3,'idp_qb_hit':2,'idp_tkl_loss':2,'idp_int':6,'idp_ff':3,'idp_fum_rec':4,'idp_pass_def':3,'idp_blk_kick':6,'bonus_pass_yd_300':2,'bonus_pass_yd_400':3,'bonus_rec_yd_100':2,'bonus_rush_yd_100':2,'bonus_tkl_10p':2,'bonus_sack_2p':2,'idp_pass_def_3p':2}\n\
        def req(v,msg):\n if not v:raise AssertionError(msg)\ndef digest(blob):return hashlib.sha256(blob).hexdigest()\ndef read_pin(path,sha):\n\
        \ b=path.read_bytes()\n actual = digest(b) if len(sha)==64 else hashlib.sha1(f'blob {len(b)}\\0'.encode()+b).hexdigest()\
        \ if len(sha)==40 else ''\n req(actual==sha,'SOURCE_PIN_DRIFT_'+path.name);return b\ndef namekey(s):return ''.join(c for\
        \ c in str(s).lower() if c.isalnum())\ndef posbucket(s):\n s=str(s).upper()\n if s in POSITIONS:return s\n if s in ('DE','DT','NT'):return\
        \ 'DL'\n if s in ('ILB','OLB','MLB'):return 'LB'\n if s in ('CB','S','SS','FS'):return 'DB'\n return ''\ndef score_func(script):\n\
        \ tree=ast.parse(script.decode()); f=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='score_week'];req(len(f)==1,'SCORER_NOT_UNIQUE')\n\
        \ ns={};exec(compile(ast.Module(body=f,type_ignores=[]),'<pinned-scorer>','exec'),ns)\n score=ns['score_week'];req(abs(score({'pass_yd':300})-14)<1e-8,'PASS_300_BONUS_TEST');req(abs(score({'idp_tkl_solo':2,'idp_tkl_ast':2})-4.5)<1e-8,'IDP_2026_SCORER_TEST');return\
        \ score\ndef load_candidates(folder):\n for name,sha in R61.items():read_pin(folder/name,sha)\n m=json.loads((folder/'CAL26_V1R61_manifest.json').read_text());req(m['n_full_projected_players']==518\
        \ and not m['production_change_authorized'],'R61_FROZEN_CONTRACT')\n rows=list(csv.DictReader((folder/'CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv').open()))\n\
        \ req(len(rows)==518 and len(set((namekey(r['name']),r['position']) for r in rows))==518,'R61_518_UNIQUE_REQUIRED');return\
        \ rows\ndef load_historical(folder):\n for name,sha in R63.items():read_pin(folder/name,sha)\n m=json.loads((folder/'CAL26_V1R63_manifest.json').read_text());req(m['accepted_recency_positions']==[]\
        \ and m['outer_origin_year']==2024 and not m['production_change_authorized'],'R63_EXPECTED_NO_RECENCY')\n rs=list(csv.DictReader((folder/'CAL26_V1R63_7position_Week6_chronological_holdout.csv').open()))\n\
        \ req(len(rs)==7 and set(x['position'] for x in rs)==set(POSITIONS),'R63_POSITIONS_MISSING')\n req(all(x['selected_signal_passes_gate']=='False'\
        \ for x in rs),'R63_SIGNAL_CHANGED');return {r['position']:r for r in rs}\ndef load_repo(repo):\n for name,sha in REPO_PINS.items():read_pin(repo/name,sha)\n\
        \ settings=json.loads((repo/'data/trade_history.json').read_text())['seasons']\n byyear={str(x['season']):x['scoring_settings']\
        \ for x in settings};req(set(('2024','2025','2026'))<=set(byyear),'LEAGUE_SEASONS_MISSING')\n for k,v in CORE_2026.items():req(abs(float(byyear['2026'][k])-v)<1e-9,'2026_SCORING_SETTINGS_CHANGED_'+k)\n\
        \ scored=score_func((repo/'research/roster-economics/historical_weekly_points_pipeline.py').read_bytes())\n drift={k:{y:byyear[y][k]\
        \ for y in ('2024','2025','2026')} for k in sorted(byyear['2026']) if any(byyear[x].get(k)!=byyear['2026'].get(k) for x\
        \ in ('2024','2025'))}\n req(set(drift)=={'xpmiss','idp_tkl_solo','idp_sack','idp_fum_rec','idp_tkl_ast'},'2024_25_RULE_CHANGE_AUDIT_DRIFT')\n\
        \ aliases=collections.defaultdict(set)\n p=json.loads((repo/'scripts/sleeper_2026_projections.json').read_text());req(isinstance(p,list)\
        \ and len(p)>500,'PROJECTION_ID_INDEX_UNAVAILABLE')\n for x in p:\n  b=posbucket(x.get('pos'));k=(namekey(x.get('player','')),b)\n\
        \  if k[0] and b and str(x.get('sleeper_id')):aliases[k].add(str(x['sleeper_id']))\n with (repo/'research/player-role-v2/player_role_v2_b46_v1r2_sleeper_identity_snapshot.csv').open()\
        \ as f:\n  for x in csv.DictReader(f):\n   b=posbucket(x.get('position'));k=(namekey(x.get('full_name','')),b)\n   if k[0]\
        \ and b and x.get('sleeper_id'):\n    aliases[k].add(str(x['sleeper_id']))\n return scored,drift,aliases\n\ndef fetch_week(week,fixtures):\n\
        \ req(week in (1,2,3,4,5,6),'WEEK7_PLUS_BLOCKED')\n if fixtures is not None:\n  b=(fixtures/f'week{week}.json').read_bytes()\n\
        \ else:\n  url=f'https://api.sleeper.app/v1/stats/nfl/regular/2026/{week}'\n  try:\n   with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CAL26-V1R64-readonly-frozen-Week6'}),timeout=45)\
        \ as r:\n    req(r.status==200,'SLEEPER_HTTP_NOT_200');b=r.read(35_000_000)\n  except Exception as e:raise RuntimeError(f'SLEEPER_WEEK_{week}_FETCH_FAILED:\
        \ {e}')\n j=json.loads(b);req(isinstance(j,dict),'BAD_WEEK_JSON');req(len(j)>=2 if fixtures is not None else len(j)>=150,f'UNEXPECTED_WEEK_{week}_STAT_VOLUME')\n\
        \ return j,{'week':week,'url':f'https://api.sleeper.app/v1/stats/nfl/regular/2026/{week}','raw_sha256':digest(b),'raw_bytes':len(b),'player_ids':len(j)}\n\
        def fmt(v):return '' if v is None else str(round(v,6))\ndef tocsv(path,rows,columns):\n with path.open('w',newline='')\
        \ as f:\n  w=csv.DictWriter(f,columns,extrasaction='ignore');w.writeheader();w.writerows(rows)\ndef main(args):\n dst=pathlib.Path(args.out);dst.mkdir(parents=True,exist_ok=True)\n\
        \ repo=pathlib.Path(args.repo);fixture=pathlib.Path(args.fixtures) if args.fixtures else None\n candidates=load_candidates(pathlib.Path(args.r61));historical=load_historical(pathlib.Path(args.r63));scorer,drift,identities=load_repo(repo)\n\
        \ source={};weeks={}\n for w in range(1,7):weeks[w],r=fetch_week(w,fixture);source[str(w)]=r\n n_actual_with_score=0\n\
        \ out=[];ambiguous=[];unmapped=[];source_stats_issues=collections.Counter()\n for c in candidates:\n  key=(namekey(c['name']),c['position']);ids=identities.get(key,set())\n\
        \  observed={pid for pid in ids if any(pid in weeks[w] for w in range(1,7))}\n  # A unique observed ID resolves duplicate\
        \ historical id records when only one has actual stats\n  if len(observed)==1:pid=next(iter(observed));status='OBSERVED_UNIQUE_ID'\n\
        \  elif len(ids)==1:pid=next(iter(ids));status='INDEX_UNIQUE_NO_OBSERVATION' if not observed else 'OBSERVED_UNIQUE_ID'\n\
        \  elif len(ids)==0:pid=None;status='UNMAPPED_ID';unmapped.append(c['name'])\n  else:pid=None;status='AMBIGUOUS_MULTIPLE_IDS';ambiguous.append(c['name'])\n\
        \  scores={};active_weeks=0;seen_stats_weeks=0\n  if pid:\n   for w in range(1,7):\n    s=weeks[w].get(pid,{})\n    req(isinstance(s,dict),'MALFORMED_PLAYER_WEEK_STATS')\n\
        \    if s:\n     seen_stats_weeks+=1\n     if (s.get('gp') or 0)>=1:active_weeks+=1\n     # Expose potential safety mismatch\
        \ between Sleeper stat names and pinned scorer.\n     if (s.get('idp_safe') or 0)>0 and (s.get('idp_safety') or 0)==0:source_stats_issues['idp_safe_not_recognized_by_scorer']+=1\n\
        \     if (s.get('idp_def_td') or 0)>0 and (s.get('idp_td') or 0)==0:source_stats_issues['idp_def_td_not_recognized_by_scorer']+=1\n\
        \     # Only count game-week stats if the player appeared. Matches repository historical scorer semantics.\n     if (s.get('gp')\
        \ or 0)>=1:\n      pts=float(scorer(s));req(-70<=pts<=140 and pts==pts,'IMPLAUSIBLE_WEEKLY_SCORE');scores[w]=pts\n   if\
        \ seen_stats_weeks:n_actual_with_score+=1\n  ytd=sum(scores.values());last3=sum(scores.get(w,0) for w in (4,5,6))\n  h=historical[c['position']];regression_proxy=None\n\
        \  if status=='OBSERVED_UNIQUE_ID' and h['outer_win_vs_mean']=='True':\n   regression_proxy=max(0.,float(h['fit_intercept_points'])+float(h['fit_slope_per_ppg'])*(ytd/6))\n\
        \  out.append({'name':c['name'],'position':c['position'],'frozen_FV_UNCHANGED':c['frozen_FV_REFERENCE_ONLY'],\n   'sleeper_id':pid\
        \ or '','identity_status':status,'stats_weeks_seen':seen_stats_weeks,'played_weeks_gp':active_weeks,\n   '2026_week1_6_LOG_2026_rules_points':fmt(ytd)\
        \ if pid else '',\n   '2026_week1_6_LOG_2026_rules_calendar_ppg':fmt(ytd/6) if pid else '',\n   '2026_week4_6_LOG_2026_rules_calendar_ppg':fmt(last3/3)\
        \ if pid else '',\n   '2026_week6_ytd_vs_frozen_preseason_fullseason_POINTS_NOT_SAME_HORIZON':'DO_NOT_COMPARE_DIRECTLY',\n\
        \   '2026_frozen_preseason_fullseason_points_NOT_EXACT_LOG':c['projected_2026_points_NOT_EXACT_LOG'],\n   'R63_outer_2024_2025_YTD_prediction_better_than_mean':h['outer_win_vs_mean'],\n\
        \   'R63_recency_uplift_out_of_sample_approved':False,\n   'H1_2027_R63_ytd_only_RESEARCH_TRANSFER_UNVERIFIED_NOT_FV':fmt(regression_proxy),\n\
        \   '2026_exact_scoring_all_categories_verified':False,\n   '2026_to_2027_prospective_forecast_validated':False,'price_per_point_empirically_calibrated':False,\n\
        \   'production_change_authorized':False})\n req(len(out)==518 and len({(x['name'],x['position']) for x in out})==518,'PLAYER_OUTPUT_MISMATCH')\n\
        \ coverage=collections.Counter(x['position'] for x in out if x['identity_status']=='OBSERVED_UNIQUE_ID');base=collections.Counter(x['position']\
        \ for x in out)\n report=[{'position':pos,'candidate_players':base[pos],'observed_unique_week1_6':coverage[pos],\n    \
        \      'identifiable_pct':round(100*coverage[pos]/base[pos],2),'R63_2024_outer_n':historical[pos]['outer_origin_2024_n'],\n\
        \          'R63_chronological_recency_uplift_approved':False,\n          '2026_history_scored_with_2026_rules_not_original_2024_25_rules':True,\n\
        \          'prediction_or_pricing_production_approved':False} for pos in POSITIONS]\n # Strict failure if stats fetched\
        \ successfully but identity pipeline catastrophically fails.\n if fixture is None:req(n_actual_with_score>=180,'ID_MATCH_FAILURE_BELOW_180_OBSERVED')\n\
        \ cols=list(out[0]);tocsv(dst/'CAL26_V1R64_518_frozen_week6_2026_LOG_observations_NOT_FV.csv',out,cols)\n tocsv(dst/'CAL26_V1R64_7position_identity_and_recency_decision.csv',report,list(report[0]))\n\
        \ ledger=[source[str(i)] for i in range(1,7)];tocsv(dst/'CAL26_V1R64_2026_Sleeper_week1_6_source_digests.csv',ledger,list(ledger[0]))\n\
        \ note='# CAL26 V1R64 \u2014 Frozen 2026 Week 1\u20136 seven-position feature bridge (read only)\\n\\n'\n note+='Decision:\
        \ **2026_SIX_WEEK_LOG_2026_RULES_OBSERVATIONS_ONLY__FV_HOLD**.\\n\\n'\n note+='Only six explicitly enumerated Sleeper API\
        \ calls, for weeks 1 through 6 of the 2026 regular season. No Week 7 or later input. Each response byte SHA is emitted\
        \ to support reproducibility.\\n\\n'\n note+='**Critical scoring provenance:** repository historical scorer uses 2026 scoring\
        \ rules. The 2024\u201325 actual league settings differed in five categories: '+', '.join(sorted(drift))+'. R63 effectively\
        \ back-scores historical records to a common 2026 rulebook; it does not reproduce the fantasy points owners received in\
        \ those earlier years.\\n\\n'\n note+='This is a **source-consistent observational bridge**, NOT a forecast calibrated\
        \ to 2026 rest-of-season projections and NOT the final all-category Sleeper point total. Score fields not supported by\
        \ the archive scorer must be reconciled before any FV production change.\\n\\n'\n note+='R63 rejected blanket recent-three-week\
        \ uplift in all seven positions on its independent holdout. R64 uses its **YTD-only** model strictly as labeled transfer-unverified\
        \ 2027 research sensitivity, not future FV or point-price.\\n\\n'\n note+='|Position|518-candidate pool|Observed unique\
        \ ID in Week1\u20136|R63 recency approved|\\n|---|---:|---:|---|\\n'\n for r in report:note+=f\"|{r['position']}|{r['candidate_players']}|{r['observed_unique_week1_6']}|No|\\\
        n\"\n note+='\\nKnown unresolved scorer field aliases (observed weeks): '+json.dumps(dict(source_stats_issues),sort_keys=True)+'\\\
        n\\n'\n note+='No changes to frozen FV, Market Value, age curves, position weights, index.html, or trade verdicts. 2026\
        \ full-season historical forecast and FV calibration still require evidence.\\n'\n (dst/'CAL26_V1R64_decision.md').write_text(note)\n\
        \ filenames=['CAL26_V1R64_518_frozen_week6_2026_LOG_observations_NOT_FV.csv','CAL26_V1R64_7position_identity_and_recency_decision.csv','CAL26_V1R64_2026_Sleeper_week1_6_source_digests.csv','CAL26_V1R64_decision.md']\n\
        \ manifest={'workflow':'CAL26 V1R64 - 2026 Week6 Full-Pool LOG Scoring Observations and Seven-Position Bridge (Read Only)',\n\
        \ 'semantic_status':'2026_SIX_WEEK_SAME_RULE_SCORING_OBSERVATIONS__RESEARCH_ONLY_FV_HOLD','fixture':fixture is not None,\n\
        \ 'source_weeks':[1,2,3,4,5,6],'source_year':2026,'source_type':'Sleeper_regular_2026_weekly_stats',\n 'raw_week6_and_earlier_only':True,'2026_week7_or_later_fetched':False,'protected_week8_12_data_read':False,\n\
        \ 'n_518_frozen_candidates':len(out),'n_2026_observed_unique_ids':sum(coverage.values()),\n 'n_2026_stats_seen':n_actual_with_score,'historical_2024_25_rule_drift':drift,\n\
        \ 'scorer_all_2026_categories_certified':False,'observed_unreconciled_stat_alias_counts':dict(source_stats_issues),\n 'source_week_sha256':{str(i):source[str(i)]['raw_sha256']\
        \ for i in range(1,7)},\n 'repo_pins':REPO_PINS,'R61_run_id':40059837648,'R63_run_id':40064045458,\n 'R63_chronological_position_recency_accepted':[],\n\
        \ '2026_2027_forecast_transfer_validated':False,'2026_ROS_projection_inputs_validated':False,\n 'cardinal_FV_scale_identified':False,'production_change_authorized':False,'live_index_modified':False,\n\
        \ 'output_sha256':{f:digest((dst/f).read_bytes()) for f in filenames}}\n (dst/'CAL26_V1R64_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\\
        n')\n print(note)\n print('R64_COMPLETED_RESEARCH_ONLY',json.dumps({k:manifest[k] for k in ('fixture','n_518_frozen_candidates','n_2026_observed_unique_ids','source_weeks','production_change_authorized')}))\n\
        \ndef selftest():\n req(namekey('C.J. Stroud')==namekey('CJ Stroud'),'NORMALIZATION_TEST')\n req(posbucket('DE')=='DL'\
        \ and posbucket('SS')=='DB' and posbucket('OLB')=='LB','POSITION_TEST')\n try:fetch_week(7,None)\n except AssertionError\
        \ as e:req('WEEK7_PLUS_BLOCKED' in str(e),'WEEK7_FAIL_TEST')\n else:raise AssertionError('WEEK7_LEAK_TEST_FAILED')\n print('R64_SELFTEST_GREEN\
        \ name normalization, defensive positional families, week7 hard block, extracted scorer')\nif __name__=='__main__':\n p=argparse.ArgumentParser();p.add_argument('--repo');p.add_argument('--r61');p.add_argument('--r63');p.add_argument('--out');p.add_argument('--fixtures');p.add_argument('--selftest',action='store_true');a=p.parse_args()\n\
        \ if a.selftest:selftest()\n else:main(a)\n\nPY_CAL26_V1R64_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_V1R64_engine.py\"\
        \npython \"$RUNNER_TEMP/CAL26_V1R64_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_V1R64_engine.py\" \\\n --repo \"\
        $GITHUB_WORKSPACE\" \\\n --r61 \"$RUNNER_TEMP/cal26-r64-inputs/R61\" \\\n --r63 \"$RUNNER_TEMP/cal26-r64-inputs/R63\" \\\
        \n --out \"$RUNNER_TEMP/cal26-r64-results\"\npython - \"$RUNNER_TEMP/cal26-r64-results\" <<'PY_CAL26_V1R64_VERIFY'\nimport\
        \ csv,hashlib,json,pathlib,sys\np=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R64_manifest.json').read_text())\n\
        assert m['semantic_status']=='2026_SIX_WEEK_SAME_RULE_SCORING_OBSERVATIONS__RESEARCH_ONLY_FV_HOLD'\nassert not m['fixture']\
        \ and m['n_518_frozen_candidates']==518\nassert m['source_weeks']==[1,2,3,4,5,6] and not m['2026_week7_or_later_fetched']\n\
        assert not m['protected_week8_12_data_read'] and not m['production_change_authorized']\nassert not m['cardinal_FV_scale_identified']\
        \ and not m['2026_ROS_projection_inputs_validated']\nassert m['R63_chronological_position_recency_accepted']==[]\nassert\
        \ len(m['source_week_sha256'])==6\nfor name,h in m['output_sha256'].items():\n assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h,name\n\
        with (p/'CAL26_V1R64_518_frozen_week6_2026_LOG_observations_NOT_FV.csv').open() as f:rows=list(csv.DictReader(f))\nassert\
        \ len(rows)==518 and all(r['production_change_authorized']=='False' for r in rows)\nassert len({(r['name'],r['position'])\
        \ for r in rows})==518\nwith (p/'CAL26_V1R64_7position_identity_and_recency_decision.csv').open() as f:d=list(csv.DictReader(f))\n\
        assert len(d)==7 and sum(int(x['candidate_players']) for x in d)==518\nprint('CAL26_V1R64_SIX_WEEK_2026_LOG_7POSITION_BRIDGE_READONLY_GREEN')\n\
        PY_CAL26_V1R64_VERIFY\ntest -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r64-results/CAL26_V1R64_decision.md\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload R64 read only research evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_V1R64_2026_WEEK6_SEVEN_POSITION_LOG_OBSERVATIONS_FV_HOLD
        path: ${{ runner.temp }}/cal26-r64-results/
        retention-days: 60
        if-no-files-found: warn
