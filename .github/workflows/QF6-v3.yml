# LOG QF6 / A5-F04: exact V2R1 visible-starter-warning review candidate gate.
# DEFAULT is READ-ONLY preflight. Separate owner-entered confirmation required to promote.
# Source proof: V2R1 review 38139778393, commit c6b80d9c44afe0104c6504a78c522d1bd0f39816.
# Only index.html may be deployed. No frozen model changes, no hidden-panel reactivation.
name: QF6 V3 - Visible Starter Warning Production Preflight and Explicit Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight is read only; promote writes exact reviewed index.html to main'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - promote
      confirmation:
        description: 'Promotion only: enter PROMOTE_QF6_A5F04_ONE_FILE_TO_MAIN; blank for preflight'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF6_TMP: /tmp/log-qf6-v3
  QF6_REVIEW_BRANCH: 'qf6-a5f04-v2r1-visible-warning-review-2026-10-11'
  QF6_REVIEW_SHA: 'c6b80d9c44afe0104c6504a78c522d1bd0f39816'
  QF6_REVIEW_PARENT: 'a7e2767a9de574f7dca821442e905df9b0466e40'
  QF6_ORIGINAL_INDEX: '2666f7f8b167e48b7d1571ab527450b521d32c75'
  QF6_REVIEWED_INDEX: '0fe2670c67cbea8d057c3c8ec5a6b2dfcce61b8e'
  QF6_REVIEW_WF_BLOB: 'f2de07ae3a79683cf950b8a7e9333d7c081b8350'

jobs:
  exact-review-preflight:
    name: Read-only QF6 one-file preflight with full real-browser replay
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout exact triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed validation and browser dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Owner mode, exact review lineage and protected main source guards
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP QF6 only main dispatch allowed'; exit 1; }
          if [[ "${RELEASE_MODE}" == 'promote' ]]; then
            [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF6_A5F04_ONE_FILE_TO_MAIN' ]] || { echo 'STOP QF6 explicit promotion consent absent'; exit 1; }
          else
            [[ "${RELEASE_MODE}" == 'preflight' && -z "${RELEASE_CONFIRMATION}" ]] || { echo 'STOP QF6 preflight must have blank confirmation'; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP checkout mismatch'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF6_REVIEW_BRANCH}:refs/remotes/origin/${QF6_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main advanced after workflow dispatch'; exit 1; }
          [[ "$(git rev-parse origin/${QF6_REVIEW_BRANCH})" == "${QF6_REVIEW_SHA}" ]] || { echo 'STOP QF6 review branch moved'; exit 1; }
          [[ "$(git rev-parse "${QF6_REVIEW_SHA}^")" == "${QF6_REVIEW_PARENT}" ]] || { echo 'STOP review commit no longer direct child of audited main'; exit 1; }
          git merge-base --is-ancestor '84b6a3f9e3f2e247a8863bcb8bf702038eff2e5e' HEAD || { echo 'STOP QF5 production lineage missing'; exit 1; }
          python3 - <<'PY'
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='a7e2767a9de574f7dca821442e905df9b0466e40'
          review='c6b80d9c44afe0104c6504a78c522d1bd0f39816'
          original='2666f7f8b167e48b7d1571ab527450b521d32c75'
          candidate='0fe2670c67cbea8d057c3c8ec5a6b2dfcce61b8e'
          assert git('hash-object','index.html')==original,'STOP production index source drift'
          assert git('rev-parse',f'{base}:index.html')==original,'STOP audited parent index changed'
          assert git('rev-parse',f'{review}:index.html')==candidate,'STOP approved candidate index changed'
          assert git('diff','--name-only',base,review).splitlines()==['index.html'],'STOP candidate modifies files beyond index'
          assert git('hash-object','.github/workflows/QF6-v2r1.yml')=='f2de07ae3a79683cf950b8a7e9333d7c081b8350','STOP original green QA workflow changed'
          # Daily/weekly data refreshes are allowed only for explicit data/artifact paths;
          # any changed source code, release, research, or non-QF6 workflow is a STOP.
          allowed_data={
            'data/free_agents.json','data/free_agent_utility_v1.json',
            'data/my_roster.json','data/league_rosters.json','data/last_synced.json',
            'data/players_cache.json','data/player_team_refresh.json',
            'data/players.json','data/sleeper_players.json',
            'scripts/artifacts/generated/team_utility_lineup_projections.json',
            'scripts/artifacts/reports/team_utility_lineup_projection_report.md',
          }
          changed=set(git('diff','--name-only',base,'HEAD').splitlines())
          unexpected=changed-allowed_data-{'.github/workflows/QF6-v3.yml'}
          assert '.github/workflows/QF6-v3.yml' in changed,'STOP QF6 V3 workflow upload not found'
          assert not unexpected,f'STOP unapproved main drift after QF6 review: {sorted(unexpected)}'
          protected={
            'scripts/team_utility_projection_runtime.js':'1620edf05e56a56b4a874c71b32777a443422de5',
            'scripts/validation/repo_regression_checks.py':'5191e1160c966ed14401b70c86c6f63808e1265d',
            'free-agent-board.html':'975efe51091a2315475678a9db0842b05c4fc3aa',
            'scripts/validation/validate_free_agent_valuation_parity.py':'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc',
            'model/releases/free-agent-production-v2/release.json':'75c9665c0493d8ac4900479b6802c807aaa45633',
            'scripts/projections/build_team_utility_lineup_projections.py':'b2affac777de89fca88301a07b16f39482c8dcdd',
          }
          for path,sha in protected.items():
            assert git('hash-object',path)==sha,f'STOP protected production code/model drift: {path}'
            assert git('rev-parse',f'{review}:{path}')==sha,f'STOP review did not preserve protected file: {path}'
          print('PASS QF6 pinned source, approved one-file candidate, no model drift and controlled routine data freshness')
          PY
      - name: Recover exact successful V2R1 QA and browser scripts in runner scratch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          wf=Path('.github/workflows/QF6-v2r1.yml').read_text(encoding='utf-8')
          targets=[
            'Write isolated patch and exact-source acceptance scripts',
            'Test actual legacy optimizer, incomplete slot diagnostics and protected logic',
            'Run real headless Chrome for visible Build Trade 17/17 to 16/17 warning',
            'Run 14 full repo regression groups and frozen guard controls',
          ]
          tmp=Path('/tmp/log-qf6-v3');tmp.mkdir(mode=0o700,exist_ok=True)
          for i,name in enumerate(targets):
            heading='      - name: '+name+'\n'
            assert wf.count(heading)==1,f'STOP original QA step missing/duplicated: {name}'
            step=wf.split(heading,1)[1].split('        run: |\n',1)[1].split('\n      - name: ',1)[0]
            raw=step.splitlines()
            assert len(raw)>=2 and (i!=0 or len(raw)>20) and all(not x.strip() or x.startswith('          ') for x in raw),name
            body='\n'.join(x[10:] if x.strip() else '' for x in raw)+'\n'
            if i==0:
              assert 'cat > "${QF6_TMP}/qa.js"' in body and 'cat > "${QF6_TMP}/browser.py"' in body
              assert 'python3 "${QF6_TMP}/patch.py"' not in body,'STOP QA extraction tries to patch twice'
            if i==1: assert 'node "${QF6_TMP}/qa.js"' in body
            if i==2: assert 'python3 "${QF6_TMP}/browser.py"' in body
            if i==3: assert 'repo_regression_checks.py' in body
            path=tmp/f'green_{i}.sh';path.write_text(body,encoding='utf-8')
            subprocess.run(['bash','-n',str(path)],check=True)
          print('PASS recovered exact green QA, source fixtures, Chrome and 14-group regression steps')
          PY
          bash "${QF6_TMP}/green_0.sh"
      - name: Stage only exact reviewed index in ephemeral checkout
        shell: bash
        run: |
          set -euo pipefail
          git show "${QF6_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "${QF6_REVIEWED_INDEX}" ]] || { echo 'STOP reviewed index hash drift'; exit 1; }
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP candidate modified files beyond index'; exit 1; }
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('/* QF6_A5F04_VISIBLE_STARTER_WARNING_V1\n')==1,'STOP missing QF6 helper marker'
          assert s.count('qf6ShowLineupWarning(tuBeforeRoster, tuAfterPool);')==1,'STOP unexpected warning wiring'
          assert s.count('impactShell.hidden = true;')==1 and s.count("impactShell.setAttribute('aria-hidden', 'true');")==1,'STOP legacy Team Impact reactivated'
          assert 'const TU_BENCH_WEIGHT = 0.15;' in s,'STOP Team Utility weighting drift'
          print('PASS reviewed index exact; B56 hidden panel unchanged; Team Utility coefficient unchanged')
          PY
      - name: Execute exact green V2R1 fixture and projection validations
        shell: bash
        run: |
          set -euo pipefail
          bash "${QF6_TMP}/green_1.sh"
      - name: Execute exact green V2R1 real headless Chrome UI checks
        shell: bash
        run: |
          set -euo pipefail
          bash "${QF6_TMP}/green_2.sh"
      - name: Execute exact green V2R1 full regression and IDP checks
        shell: bash
        run: |
          set -euo pipefail
          bash "${QF6_TMP}/green_3.sh"
      - name: Reconfirm candidate unchanged and finish without production mutation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object index.html)" == "${QF6_REVIEWED_INDEX}" ]] || { echo 'STOP index drift during QA'; exit 1; }
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP additional source modified'; exit 1; }
          git diff --check
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main advanced during preflight'; exit 1; }
          echo "QF6 V3 PREFLIGHT GREEN; exact index ${QF6_REVIEWED_INDEX}; main unchanged"
      - name: Remove temporary QA scripts
        if: always()
        shell: bash
        run: rm -rf /tmp/log-qf6-v3

  explicitly-confirmed-promotion:
    name: Promote only the exact reviewed index after owner confirmation
    needs: exact-review-preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout same preflighted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reconfirm owner permission, hashes, controlled drift, then push one file
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP non-main promotion'; exit 1; }
          [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF6_A5F04_ONE_FILE_TO_MAIN' ]] || { echo 'STOP missing explicit owner authorization'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP wrong promotion checkout'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty promotion checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF6_REVIEW_BRANCH}:refs/remotes/origin/${QF6_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main advanced after preflight'; exit 1; }
          [[ "$(git rev-parse origin/${QF6_REVIEW_BRANCH})" == "${QF6_REVIEW_SHA}" ]] || { echo 'STOP review branch changed'; exit 1; }
          [[ "$(git rev-parse "${QF6_REVIEW_SHA}^")" == "${QF6_REVIEW_PARENT}" ]] || { echo 'STOP review parent changed'; exit 1; }
          python3 - <<'PY'
          import subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          base='a7e2767a9de574f7dca821442e905df9b0466e40'
          review='c6b80d9c44afe0104c6504a78c522d1bd0f39816'
          original='2666f7f8b167e48b7d1571ab527450b521d32c75'
          candidate='0fe2670c67cbea8d057c3c8ec5a6b2dfcce61b8e'
          assert git('hash-object','index.html')==original,'STOP current index different from approved original'
          assert git('rev-parse',f'{review}:index.html')==candidate,'STOP reviewed index blob mismatch'
          assert git('diff','--name-only',base,review).splitlines()==['index.html'],'STOP review file budget drift'
          assert git('hash-object','.github/workflows/QF6-v2r1.yml')=='f2de07ae3a79683cf950b8a7e9333d7c081b8350','STOP original QA harness modified'
          allowed_data={
            'data/free_agents.json','data/free_agent_utility_v1.json',
            'data/my_roster.json','data/league_rosters.json','data/last_synced.json',
            'data/players_cache.json','data/player_team_refresh.json',
            'data/players.json','data/sleeper_players.json',
            'scripts/artifacts/generated/team_utility_lineup_projections.json',
            'scripts/artifacts/reports/team_utility_lineup_projection_report.md',
          }
          changed=set(git('diff','--name-only',base,'HEAD').splitlines())
          assert '.github/workflows/QF6-v3.yml' in changed,'STOP promotion workflow absent'
          assert not changed-allowed_data-{'.github/workflows/QF6-v3.yml'},f'STOP unexpected changes to main since review: {sorted(changed-allowed_data-{".github/workflows/QF6-v3.yml"})}'
          protected={
            'scripts/team_utility_projection_runtime.js':'1620edf05e56a56b4a874c71b32777a443422de5',
            'scripts/validation/repo_regression_checks.py':'5191e1160c966ed14401b70c86c6f63808e1265d',
            'free-agent-board.html':'975efe51091a2315475678a9db0842b05c4fc3aa',
            'scripts/validation/validate_free_agent_valuation_parity.py':'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc',
            'model/releases/free-agent-production-v2/release.json':'75c9665c0493d8ac4900479b6802c807aaa45633',
            'scripts/projections/build_team_utility_lineup_projections.py':'b2affac777de89fca88301a07b16f39482c8dcdd',
          }
          for path,sha in protected.items():
            assert git('hash-object',path)==sha,f'STOP protected code changed: {path}'
          print('PASS QF6 exact reviewed index and protected production code reverified')
          PY
          git show "${QF6_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "${QF6_REVIEWED_INDEX}" ]] || { echo 'STOP staged index blob changed'; exit 1; }
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP unexpected source difference'; exit 1; }
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || { echo 'STOP non-index file staged'; exit 1; }
          git diff --cached --check
          git commit -m 'QF6 A5-F04: visible 17-starter completeness warning'
          git push origin HEAD:refs/heads/main
          echo "QF6 PROMOTED exact reviewed one-file warning: $(git rev-parse HEAD)"
