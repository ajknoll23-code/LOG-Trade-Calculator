name: CAL26 V1R54 - QB Numerical Surplus FV Shadow and Scoring Transfer Sensitivity (Read Only)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r54-qb-numerical-shadow-read-only
  cancel-in-progress: false

jobs:
  qb-numeric-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned R42 multi-year historical QB artifact
        uses: actions/download-artifact@v4
        with:
          name: CAL26_V1R42_HISTORICAL_QB_RESEARCH_ONLY
          run-id: 40021246762
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-v1r54-in/R42
      - name: Download pinned R53R1 LOG scoring and position surplus artifact
        uses: actions/download-artifact@v4
        with:
          name: CAL26_V1R53R1_HISTORICAL_LOG_SEASONS_REPLACEMENT_SHARED_SURPLUS_READ_ONLY
          run-id: 40045370120
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-v1r54-in/R53
      - name: Build read-only 54-QB numeric shadow and cross-position scale sensitivity
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r54_engine.py" <<'PY_CAL26_V1R54_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R54: Explicit numerical QB surplus shadow & cardinal conversion sensitivity.
          No production mutation. All candidate price figures are conventions (NOT validated FV).
          Inputs: exact R42 (pre-2026 standard ratios) and R53R1 (LOG score and demand).
          """
          from __future__ import annotations
          import argparse, csv, hashlib, io, json, math, pathlib, sys
          from collections import Counter
          
          ROOT = 'CAL26_V1R54'
          INPUTS = {
              'R42': {
                  'manifest': ('CAL26_V1R42_manifest.json', '6f378970384f5b3c74304def7a1ab7a8d7e1e8158e612d28c2c7c8786e679617'),
                  'qb': ('CAL26_V1R42_54_QB_empirical_shadow.csv', '38d0d4d62a0a1c2722feffafb124e6def853b26dbf838f6639612ca0964ab1c4'),
                  'year_std': ('CAL26_V1R42_year_qb24_proxy.csv', '3bd9e0cb7af2ac64ee31240cb23fd81acdb2e2178e1097191d20f03a82460e05'),
                  'validation': ('CAL26_V1R42_temporal_validation.csv', '2738ad34ac71b810cc7d61e60e35791eff0667fd5d1bd661055daa7421132cc5'),
              },
              'R53': {
                  'manifest': ('CAL26_V1R53_manifest.json','8d2227cee818345e048dfc689ea54ebe60a299419e6e0faa133c98d4913af5ed'),
                  'qb': ('CAL26_V1R53_54_QB_same_unit_surplus_bridge.csv', '334576bb6a3bf9bece6696efbc117a97c7a4e016483fd9b2e1eb4e81b768842d'),
                  'history': ('CAL26_V1R53_2024_2025_historical_LOG_replacement_ranks.csv','b093956d3e929a2217ecd1a12c81bc5a990897c8e02e0fa3dc40e4bd26a24e89'),
                  'pool': ('CAL26_V1R53_full_pool_year0_shared_surplus_units.csv','62cdba0623e616e2e0dffef490c2ba294950e3c2c21811c081e12e10aed30527'),
                  'positions': ('CAL26_V1R53_2026_position_reference_sensitivity.csv','3cc7919550fadcbf0bbb713aa8209c83db161a68c6856de5123995bf0c492be9'),
              },
          }
          POS=('QB','RB','WR','TE','DL','LB','DB')
          HORIZONS=(1,2,3)
          DISCOUNT=0.9
          SCALES=(15,20,25)
          
          def require(cond, reason):
              if not cond: raise AssertionError(reason)
          def sha(b): return hashlib.sha256(b).hexdigest()
          def f(x):
              v=float(x); require(math.isfinite(v),'NONFINITE_INPUT');return v
          
          def csv_out(rows,cols):
              s=io.StringIO(newline='')
              w=csv.DictWriter(s,fieldnames=cols,extrasaction='raise',lineterminator='\n')
              w.writeheader();w.writerows(rows);return s.getvalue()
          
          def get_csv(data):return list(csv.DictReader(io.StringIO(data.decode('utf-8'))))
          
          def read_inputs(root):
              content={};provenance={}
              for origin,parts in INPUTS.items():
                  content[origin]={};provenance[origin]={}
                  for label,(filename,expected) in parts.items():
                      b=(root/origin/filename).read_bytes()
                      observed=sha(b)
                      require(observed==expected,f'{origin}_{label}_SOURCE_HASH_DRIFT_EXPECTED_{expected}_GOT_{observed}')
                      content[origin][label]=b
                      provenance[origin][label]=observed
              m42=json.loads(content['R42']['manifest'])
              m53=json.loads(content['R53']['manifest'])
              require(m42['n_2026_frozen_forward_QBs']==54 and m42['future_2026_holdout_read'] is False and not m42['production_change_authorized'],'R42_RELEASE_CONTRACT')
              require(m42['unvalidated_horizons']==[4] and m42['validated_horizons']==[1,2,3], 'R42_HORIZON_CONTRACT')
              require(m53['n_R51_54_qbs']==54 and m53['n_projected_rows']==518 and not m53['production_change_authorized'],'R53_RELEASE_CONTRACT')
              require(m53['historical_2024_2025_points_use_LOG_scorer'] and m53['future_year_h1_h3_standard_scoring_not_convertible_with_current_data'],'R53_SCORE_CONTRACT')
              for filename, expected in m53['output_sha256'].items():
                  source=(root/'R53'/filename).read_bytes()
                  require(sha(source)==expected,f'R53_OUTPUT_HASH_DRIFT_{filename}')
              return content,provenance,m42,m53
          
          def run(root,out):
              c,prov,m42,m53=read_inputs(root)
              r42=get_csv(c['R42']['qb']);r53=get_csv(c['R53']['qb']);year_std=get_csv(c['R42']['year_std']);logs=get_csv(c['R53']['history']);pool=get_csv(c['R53']['pool']);positions=get_csv(c['R53']['positions'])
              require(len(r42)==len(r53)==54,'QB_COUNT_NOT_54')
              a={p['name']:p for p in r42};b={p['name']:p for p in r53}; require(len(a)==len(b)==54 and a.keys()==b.keys(),'QB_NAME_MISMATCH')
              require(len(pool)==518 and len(positions)==7,'POOL_OR_POS_SENSITIVITY_DRIFT')
              require(set(x['position'] for x in positions)==set(POS),'BAD_POSITION_SET')
              require(set(x['position'] for x in pool)==set(POS),'POOL_POSITION_SET')
              require(all(x['production_change_authorized']=='False' for x in pool+r53),'PRODUCTION_WRITE_LEAK')
              q24={f(v['QB24_2026_frozen']) for v in r42}
              require(len(q24)==1 and abs(next(iter(q24))-270.855)<0.00001,'QB24_2026_SCALE_DRIFT')
              qb24=q24.pop();qb28=next(f(x['QB28_all_pool_reference_pts']) for x in r53)
              require(all(abs(f(x['QB28_all_pool_reference_pts'])-qb28)<1e-8 for x in r53),'QB28_BASELINE_DRIFT')
              require(qb24>qb28>0,'QB24_QB28_EXPECTED_ORDER')
              relhist={}
              for yr in (2024,2025):
                  std=[f(x['qb24_points']) for x in year_std if int(x['season'])==yr]
                  actual=[f(x['points_exact_LOG_weekly_scored']) for x in logs if x['season']==str(yr) and x['position']=='QB' and int(x['rank'])==24]
                  actual28=[f(x['points_exact_LOG_weekly_scored']) for x in logs if x['season']==str(yr) and x['position']=='QB' and int(x['rank'])==28]
                  require(len(std)==len(actual)==len(actual28)==1 and min(std[0],actual[0],actual28[0])>0,'QB24_YEAR_PAIR_MISSING')
                  relhist[yr]={'standard_QB24':std[0],'LOG_QB24':actual[0],'LOG_QB28':actual28[0],'LOG_over_standard_QB24_ratio':round(actual[0]/std[0],6),'same_cohort_or_ID_matched':False}
              require(all(1.0<relhist[yr]['LOG_over_standard_QB24_ratio']<1.5 for yr in (2024,2025)),'SCORING_RATIO_UNEXPECTED')
              hist_rows=[{'year':yr,**v,'comparison':'YEARLY_RANK_BENCHMARK_ONLY_NOT_PLAYER_ID_MATCHED'} for yr,v in relhist.items()]
              # A projection-vs-realized population measurement discrepancy is NOT itself a forecast bias estimate.
              shift=qb24/(sum(relhist[y]['LOG_QB24'] for y in relhist)/len(relhist))
              qb=[]
              for name, rr in a.items():
                  v=b[name]
                  proj=f(rr['frozen_2026_forward'])
                  require(abs(proj-f(v['2026_projected_LOG_core_points']))<.001,'FROZEN_PROJECTION_JOIN_DRIFT_'+name)
                  require(str(rr['frozen_FV_reference_only'])==str(v['frozen_FV_UNCHANGED']),'FROZEN_FV_JOIN_DRIFT_'+name)
                  yr0=max(0,proj-qb24)
                  yr0_demand=max(0,proj-qb28)
                  future=[]
                  for h in HORIZONS:
                      y=f(rr[f'h{h}_expected_ratio_surplus'])
                      require(0<=y<4,'FUTURE_RATIO_OUT_OF_RANGE_'+name)
                      future.append(qb24*y*(DISCOUNT**h))
                  future_total=sum(future); four=yr0+future_total
                  # This is a fixed disclosure convention. It is NOT estimated by data or a market fit.
                  numeric=[int(round(four*scale)) for scale in SCALES]
                  require(all(0<=u<=10000 for u in numeric),'ILLUSTRATIVE_PRICE_OUT_OF_RANGE_'+name)
                  qb.append({
                    'name':name,'age_2026':rr['age_2026_frozen'],'age_band_R42':rr['age_band'],'R42_tier':rr['baseline_tier'],
                    'frozen_FV_UNCHANGED':int(rr['frozen_FV_reference_only']),'current_year_LOG_projected_points':round(proj,3),
                    'year0_QB24_LOG_projection_proxy_surplus':round(yr0,4),
                    'year0_QB28_demand_sensitivity_surplus_NOT_WAIVER':round(yr0_demand,4),
                    'future_year1_proxy_discounted_points':round(future[0],4),
                    'future_year2_proxy_discounted_points':round(future[1],4),
                    'future_year3_proxy_discounted_points':round(future[2],4),
                    'future_sum_UNVALIDATED_scoring_transfer':round(future_total,4),
                    'discounted_four_year_QB24_LOG_equivalent_PROXY_points':round(four,4),
                    'illustrative_15units_per_proxy_point_NOT_FV':numeric[0],
                    'illustrative_20units_per_proxy_point_NOT_FV':numeric[1],
                    'illustrative_25units_per_proxy_point_NOT_FV':numeric[2],
                    'owner_target_not_used':True,
                    'historical_scoring_ratio_portability_VALIDATED':False,
                    'future_2026_surplus_LOG_points_directly_observed':False,
                    'production_reprice_authorized':False,
                  })
              qb.sort(key=lambda r:(-r['discounted_four_year_QB24_LOG_equivalent_PROXY_points'],r['name']))
              for rank,r in enumerate(qb,1): r['shadow_QB_rank']=rank
              require(len(qb)==54 and len({p['name'] for p in qb})==54,'QB_ROWS_DRIFT')
              require(any(q['name']=='matthew stafford' for q in qb),'MISSING_VETERAN_DIAGNOSTIC')
              combined=[]
              for r in pool:
                  pt=f(r['one_season_same_unit_surplus_points']);require(pt>=0,'NEGATIVE_ONE_SEASON_SURPLUS')
                  require(r['status']=='YEAR_ZERO_SHARED_POINTS_NOT_DYNASTY_FV','POOL_STATUS_DRIFT')
                  combined.append({'name':r['name'],'position':r['position'],'frozen_FV_UNCHANGED':r['frozen_FV_UNCHANGED'],
                   '2026_LOGrules_core_points':r['2026_projected_points'],
                   'one_season_above_demand_rank_projected_LOG_surplus_points':round(pt,4),
                   'one_season_20units_per_point_ILLUSTRATIVE_NOT_DYNASTY_FV':int(round(pt*20)),
                   'future_season_production_known_under_LOG':False,'production_reprice_authorized':False})
              combined.sort(key=lambda r:(-r['one_season_above_demand_rank_projected_LOG_surplus_points'],r['name']))
              diag=[]
              for r in qb:
                  diag.append({'name':r['name'],'frozen_FV':r['frozen_FV_UNCHANGED'],
                    'illustrative_20units_proxy_NOT_FV':r['illustrative_20units_per_proxy_point_NOT_FV'],
                    'numeric_difference_IS_NOT_MISPRICING':r['illustrative_20units_per_proxy_point_NOT_FV']-r['frozen_FV_UNCHANGED'],
                    'reason_for_hold':'FUTURE_R42_STANDARD_TO_LOG_RATIO_TRANSFER_AND_SCALE_NOT_VALIDATED'})
              order=['bryce young','jayden daniels','cj stroud','caleb williams','drake maye','matthew stafford']
              keynotes={r['name']:r for r in qb}
              text=[
                '# CAL26 V1R54 — Numerical QB FV shadow bridge (read-only)',
                '**Status: NUMERICAL_SHADOW_GENERATED_REVIEW_REQUIRED__PRODUCTION_HOLD**. These are *illustrative* 0–10,000-style values based on a FIXED user-visible conversion convention, **not evidence-calibrated FV prices**.',
                '', '## What R53R1 established',
                f'- Verified actual 54-QB and 518 projected-player source files. The frozen 2026 forecast QB24 baseline is {qb24:.3f} points; QB28 starter-demand sensitivity is {qb28:.3f} points. Demand rank is not the waiver replacement rank.',
                '- Core LOG scoring source is verified for these 2026 provider projections, but weekly milestone projection coverage remains imperfect.',
                '- R42 career horizon ratios are *historical standard-scoring*, not matched LOG scoring. No future-season LOG forecast has been learned here.',
                '', '## Historical QB24 full-season scoring-system cross-check',
                '| Year | R42 annual QB24 standard pts | R53 annual QB24 LOG pts | LOG/std rank ratio | Same person/cohort? |',
                '|---|---:|---:|---:|---|',
              ]
              for yr,x in relhist.items():text.append(f'| {yr} | {x["standard_QB24"]:.2f} | {x["LOG_QB24"]:.2f} | {x["LOG_over_standard_QB24_ratio"]:.3f} | No — rank benchmarks only |')
              text+=['',f'Frozen 2026 projected QB24 / 2024–25 average *realized* LOG QB24 = {shift:.3f}×. This is a **different sample and forecast/outcome statistic**, not evidence of forecast bias or a correction factor.',
                     '', '## Four-season illustrative candidate method',
                     'Year 0 = max(2026 LOG-core preseason projected points − projected QB24, 0).',
                     'For future horizons 1–3, the R42 unconditionally expected *standard-scoring QB24-relative* surplus ratio is multiplied by the frozen 2026 LOG-core projected QB24 reference, and discounted by 0.9^h. **That multiplication is an unvalidated cross-scoring transfer assumption.** It may change ranks and absolute levels.',
                     'R42 horizon 4 is EXCLUDED because its 2022+ temporal holdout is unobserved. The R42 future-year ratio already includes opportunity; no additional survival factor is multiplied.',
                     '**Illustrative quote conversion:** expected discounted surplus proxy points × 20. This is a **declared scale convention**, not determined by market data, actual pricing, or owner desired numbers. 15× and 25× show sensitivity. No cap/clipping is applied.',
                     'The model does **not** yet incorporate R50R1 next-season recency into these numbers, because the R50 signal has not been LOG-scoring-calibrated. A low breakout QB shadow is not evidence his breakout was ignored by football experts; it reflects missing integrated recency.',
                     '', '## Six diagnostic QBs — numerical SHADOW only',
                     '| QB | Frozen FV | Discounted proxy points | Illustrative ×20 (NOT FV) | ×15 | ×25 |', '|---|---:|---:|---:|---:|---:|']
              for nm in order:
                  p=keynotes[nm]
                  text.append(f'| {nm} | {p["frozen_FV_UNCHANGED"]} | {p["discounted_four_year_QB24_LOG_equivalent_PROXY_points"]:.1f} | {p["illustrative_20units_per_proxy_point_NOT_FV"]} | {p["illustrative_15units_per_proxy_point_NOT_FV"]} | {p["illustrative_25units_per_proxy_point_NOT_FV"]} |')
              text+=['','## Evidence and limitations',
                     '- Numerical difference from frozen FV is **not a proven mispricing**. Existing FV may include independently justified league/dynasty factors.',
                     '- Empirical QB lineup demand approximately 27.65 is not a verified waiver replacement point; QB28-only year-zero sensitivity is separate from future QB24 ratio components.',
                     '- The 2024/2025 cross-scoring table matches annual ordinal QB24, **not the same individual QBs**. It does not validate player-level portability of standard-scoring ratio to LOG. This is a material remaining obstacle to production.',
                     '- The 518-player cross-position CSV is **one-year, same-unit illustration only**, not a dynasty-long asset-value comparison. No attempt is made to project non-QB four-year surplus with unsupported multipliers.',
                     '- No owner preferred player ranges, DLF market valuations, existing price labels, or 2026 realized/held-out outcomes are fitted. No data past 2025 outcomes is read.',
                     '', '## Specific next production-oriented action',
                     'R55 should build a LOG-score-compatible historical 1–3 year QB surplus model from the pinned historical source (rather than transferring R42 standard ratios), and compare the numerical *shadows* to the frozen baseline. If the evidence supports a defensible model and cross-position cardinal convention, request owner approval for a narrow deployment. Avoid another broad model search.',
                     '', '**No production changes are authorized. Existing FV and 15 owner overrides remain untouched.**']
              data={
                ROOT+'_54_QB_numerical_SHADOW_not_FV.csv':csv_out(qb,list(qb[0])),
                ROOT+'_518_player_one_season_shared_scale_DIAGNOSTIC.csv':csv_out(combined,list(combined[0])),
                ROOT+'_54_QB_vs_frozen_FV_not_mispricing.csv':csv_out(diag,list(diag[0])),
                ROOT+'_2024_2025_scoring_ratio_qa.csv':csv_out(hist_rows,list(hist_rows[0])),
                ROOT+'_findings.md':'\n'.join(text)+'\n'
              }
              manifest={
                'workflow':'CAL26 V1R54 - QB Numerical Surplus FV Shadow and Scoring Transfer Sensitivity (Read Only)',
                'semantic_status':'NUMERICAL_QB_SHADOW_GENERATED_REVIEW_REQUIRED__PRODUCTION_HOLD',
                'production_change_authorized':False,'index_html_modified':False,'owner_overrides_modified':False,
                '2026_realized_outcomes_read':False,'protected_weeks8_12_read':False,'market_or_owner_FV_fit':False,
                'n_QB_shadows':len(qb),'n_position_one_year_diagnostics':len(combined),
                'horizon4_excluded_unvalidated':True,'opportunity_counted_only_once':True,
                'historical_standard_to_LOG_surplus_transfer_validated':False,
                'numerical_scale_convention_not_empirically_calibrated':True,
                'R50_next_season_signal_fitted_into_QB_prices':False,
                'scoring_ratio_qa':relhist,'projection_to_outcome_rank_comparison_NOT_calibration':shift,
                'qb24_2026_projected_core_LOG_reference_points':qb24,'qb28_2026_demand_projection_sensitivity_points':qb28,
                'discount_factor_per_year':DISCOUNT,'illustrative_quote_points_per_proxy_point':list(SCALES),
                'source_run_id':{'R42':40021246762,'R53R1':40045370120},
                'source_sha256':prov,
                'output_sha256':{nm:sha(b.encode('utf8')) for nm,b in data.items()}
              }
              out.mkdir(parents=True,exist_ok=True)
              for nm,s in data.items():(out/nm).write_text(s,encoding='utf-8')
              (out/(ROOT+'_manifest.json')).write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps({'status':manifest['semantic_status'],'qbs':len(qb),'cross_position_one_year_rows':len(combined),'LOG_ratio_2024':relhist[2024]['LOG_over_standard_QB24_ratio'],'LOG_ratio_2025':relhist[2025]['LOG_over_standard_QB24_ratio'],'top5':[r['name'] for r in qb[:5]],'production_change':False},sort_keys=True))
              return manifest
          
          def selftest():
              require(all(len(hexdigest)==64 and len(filename)>5 and all(k in '0123456789abcdef' for k in hexdigest) for origin in INPUTS.values() for filename,hexdigest in origin.values()),'SOURCE_HASH_SYNTAX')
              require(sha(b'test')=='9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08','HASH_TEST')
              require(abs((100+0.9*50+0.9**2*10)-153.1)<1e-9,'DISCOUNT_UNIT_TEST')
              require(abs(f(270.855)-270.855)<1e-10,'FLOAT_TEST')
              print('R54_SELFTEST_GREEN exact source hashes, economics units, discount and frozen forecast')
          
          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--source',type=pathlib.Path)
              p.add_argument('--out',type=pathlib.Path)
              p.add_argument('--selftest',action='store_true')
              v=p.parse_args()
              if v.selftest:selftest();return
              require(v.source is not None and v.out is not None,'SOURCE_AND_OUT_REQUIRED')
              run(v.source,v.out)
          if __name__=='__main__':main()
          PY_CAL26_V1R54_ENGINE
          python -m py_compile "$RUNNER_TEMP/cal26_v1r54_engine.py"
          python "$RUNNER_TEMP/cal26_v1r54_engine.py" --selftest
          python "$RUNNER_TEMP/cal26_v1r54_engine.py" \
            --source "$RUNNER_TEMP/cal26-v1r54-in" \
            --out "$RUNNER_TEMP/cal26-v1r54-out"
          python - "$RUNNER_TEMP/cal26-v1r54-out" <<'PY_CAL26_V1R54_VALIDATE'
          import pathlib, hashlib, json, csv, sys
          out=pathlib.Path(sys.argv[1])
          m=json.loads((out/'CAL26_V1R54_manifest.json').read_text())
          assert m['semantic_status']=='NUMERICAL_QB_SHADOW_GENERATED_REVIEW_REQUIRED__PRODUCTION_HOLD'
          assert m['n_QB_shadows']==54 and m['n_position_one_year_diagnostics']==518
          assert m['production_change_authorized'] is False and m['index_html_modified'] is False
          assert m['owner_overrides_modified'] is False and m['protected_weeks8_12_read'] is False
          assert m['2026_realized_outcomes_read'] is False and m['market_or_owner_FV_fit'] is False
          assert m['numerical_scale_convention_not_empirically_calibrated'] is True
          assert m['historical_standard_to_LOG_surplus_transfer_validated'] is False
          assert m['horizon4_excluded_unvalidated'] is True and m['opportunity_counted_only_once'] is True
          assert m['R50_next_season_signal_fitted_into_QB_prices'] is False
          assert m['source_run_id']=={'R42':40021246762,'R53R1':40045370120}
          assert sorted(m['illustrative_quote_points_per_proxy_point'])==[15,20,25]
          for name, h in m['output_sha256'].items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==h, name
          with (out/'CAL26_V1R54_54_QB_numerical_SHADOW_not_FV.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==54 and len({r['name'] for r in rows})==54
          assert all(r['production_reprice_authorized']=='False' and r['owner_target_not_used']=='True' and r['historical_scoring_ratio_portability_VALIDATED']=='False' for r in rows)
          assert all(0<=int(r['illustrative_20units_per_proxy_point_NOT_FV'])<=10000 for r in rows)
          with (out/'CAL26_V1R54_518_player_one_season_shared_scale_DIAGNOSTIC.csv').open() as f:
              other=list(csv.DictReader(f))
          assert len(other)==518 and all(r['production_reprice_authorized']=='False' for r in other)
          print('R54_NUMERICAL_SHADOW_EVIDENCE_GREEN_54_QBS_518_PLAYERS_RELEASE_HOLD')
          PY_CAL26_V1R54_VALIDATE
          git rev-parse --is-inside-work-tree | grep -qx true
          test -z "$(git status --porcelain)"
          echo '## CAL26 V1R54 — QB Numeric FV Shadow, Research Only' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cal26-v1r54-out/CAL26_V1R54_findings.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified numerical shadow evidence (not production pricing)
