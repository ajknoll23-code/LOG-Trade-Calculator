# QF2 V1R1: manual, self-contained Quick Fix Wave 2 review-branch workflow.
# Upload ONLY this YAML to .github/workflows/QF2-v1r1.yml on main.
# Run Actions > QF2 V1R1 - Trade Desk Review Branch > Run workflow (main).
# Four tickets: display ages, all-asset Raw FV, invalid pick guard, keyboard search.
# Will NOT write to main, deploy Pages, modify frozen releases, or open science.
# Review branch must be independently approved before a separate promotion YAML.
name: QF2 V1R1 - Trade Desk Review Branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  qf2-review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      REVIEW_BRANCH: qf2-wave2-v1-review-2026-10-10
      ORIGINAL_INDEX_BLOB: 634d1c1f18a2cec810c2b0971956307009168915
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression dependency
        run: python3 -m pip install requests
      - name: Fail-closed source and branch preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain)" ]] || { git status --short; exit 1; }
          [[ "$(git hash-object index.html)" == "${ORIGINAL_INDEX_BLOB}" ]] || {
            echo 'STOP: live index.html changed after the QF2 source review; do not apply stale edits.'
            exit 1
          }
          if git ls-remote --exit-code --heads origin "${REVIEW_BRANCH}" >/dev/null; then
            echo "STOP: branch ${REVIEW_BRANCH} already exists (no overwrite)"
            exit 1
          fi
          echo "PASS pinned source: ${ORIGINAL_INDEX_BLOB}"
      - name: Make exact QF2 source-only changes (24 unique anchors)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess, tempfile, os

          TARGET = Path('index.html')
          EXPECTED = '634d1c1f18a2cec810c2b0971956307009168915'
          def git_blob(data):
              import hashlib
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          original = TARGET.read_bytes()
          assert git_blob(original) == EXPECTED, f'FAIL CLOSED: expected {EXPECTED}, got {git_blob(original)}'
          source = original.decode('utf8')
          changed = []
          def patch(ticket, old, new):
              global source
              n = source.count(old)
              assert n == 1, f'FAIL CLOSED {ticket}: expected exactly one anchor, found {n}'
              assert old != new
              source = source.replace(old,new,1)
              changed.append(ticket)

          # QF2-01: only presentation uses DOB-based continuous RB age; model age/floor stays untouched.
          patch('QF2-01: DOB age presentation helper',
          '''function rbMonotoneAgeAnchor(age, role, realProduction, rawProduction){''',
          '''/* QF2_AGE_DISPLAY_ONLY: always describe the age actually used by the approved
             continuous RB/DOB path; do not change PLAYER_DB or playerValue inputs. */
          function displayPlayerAge(pos, age, name){
            if(pos !== 'RB') return String(age);
            const key = normalizeName(name || '');
            const info = PLAYER_DB[key];
            const dob = ((info && typeof info.birth_date === 'string' && info.birth_date) ||
                         RB_BIRTH_DATE_DATA[key] || null);
            if(!dob) return String(age);
            const precise = fractionalAgeFromBirthDate(dob, age);
            return typeof precise === 'number' && Number.isFinite(precise) ? precise.toFixed(1) : String(age);
          }

          function rbMonotoneAgeAnchor(age, role, realProduction, rawProduction){''')
          patch('QF2-01: trade player age',
          '''`${a.pos} · Age ${a.age} · ${a.role}${tag}${inj}`''',
          '''`${a.pos} · Age ${displayPlayerAge(a.pos, a.age, a.name)} · ${a.role}${tag}${inj}`''')
          patch('QF2-01: roster needs age',
          '''${r.info.pos} · Age ${r.info.age} · ${r.info.role}${injuryBadge(r.info.injury)}''',
          '''${r.info.pos} · Age ${displayPlayerAge(r.info.pos, r.info.age, r.key)} · ${r.info.role}${injuryBadge(r.info.injury)}''')
          patch('QF2-01: full roster age',
          ''' · Age ${r.info.age} · ${r.info.role}${injuryBadge(r.info.injury)}''',
          ''' · Age ${displayPlayerAge(r.info.pos, r.info.age, r.key)} · ${r.info.role}${injuryBadge(r.info.injury)}''')
          patch('QF2-01: trade targets age',
          '''${r.pos} · Age ${r.age} · ${r.role} · ${r.slot === 'taxi' ''',
          '''${r.pos} · Age ${displayPlayerAge(r.pos, r.age, r.key)} · ${r.role} · ${r.slot === 'taxi' ''')
          patch('QF2-01: position leaders age',
          '''Age ${p.age} · ${p.role}${injuryBadge(p.injury)}${ownerText''',
          '''Age ${displayPlayerAge(pos, p.age, p.key)} · ${p.role}${injuryBadge(p.injury)}${ownerText''')
          patch('QF2-01: autocomplete age',
          '''${p.pos} · Age ${p.age}${injuryBadge(p.injury)}''',
          '''${escapeHtml(p.pos)} · Age ${displayPlayerAge(p.pos, p.age, k)}${injuryBadge(p.injury)}''')

          # QF2-02: all-assets raw FV includes draft picks; the player-only comparison and
          # 2026/27 team utility calculation remain independent. Hidden panel stays hidden.
          patch('QF2-02: separate all-assets from player-only sets',
          '''  const outgoing = state[mySide].filter(a => a.type === 'player');
            const incoming = state[otherSide].filter(a => a.type === 'player');

            if(outgoing.length === 0 && incoming.length === 0){''',
          '''  const outgoingAssets = state[mySide];
            const incomingAssets = state[otherSide];
            const outgoing = outgoingAssets.filter(a => a.type === 'player');
            const incoming = incomingAssets.filter(a => a.type === 'player');

            if(outgoingAssets.length === 0 && incomingAssets.length === 0){''')
          patch('QF2-02: full raw-value arithmetic',
          '''  const outValue = outgoing.reduce((s,a) => s + a.value, 0);
            const inValue = incoming.reduce((s,a) => s + a.value, 0);
            const netValue = inValue - outValue;
            const netColor = netValue >= 0 ? 'var(--green)' : 'var(--red)';
            const netSign = netValue >= 0 ? '+' : '';''',
          '''  const outValue = outgoingAssets.reduce((s,a) => s + a.value, 0);
            const inValue = incomingAssets.reduce((s,a) => s + a.value, 0);
            const netValue = inValue - outValue; // QF2_ALL_ASSETS_RAW_FV, no Package Adjustment
            const netColor = netValue >= 0 ? 'var(--green)' : 'var(--red)';
            const netSign = netValue >= 0 ? '+' : '';
            const includesPicks = [...outgoingAssets, ...incomingAssets].some(a => a.type === 'pick');
            const playerOnlyDelta = incoming.reduce((s,a) => s + a.value, 0) - outgoing.reduce((s,a) => s + a.value, 0);
            const playerOnlySign = playerOnlyDelta >= 0 ? '+' : '';
            const playerOnlyLine = includesPicks ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:4px;">Player-only FV: ${playerOnlySign}${playerOnlyDelta.toLocaleString()} <span style="color:var(--text-dim);">— excludes picks; used for roster-based diagnostics</span></div>` : '';''')
          patch('QF2-02: full vs player-only label',
          '''        Fundamental Value: <span style="color:${netColor};font-weight:600;">${netSign}${netValue.toLocaleString()}</span>
                  <span style="color:var(--text-dim);"> — what the deployed model says the player-value balance is</span>
                </div>
                ${marketLine}''',
          '''        Raw FV (all assets): <span style="color:${netColor};font-weight:600;">${netSign}${netValue.toLocaleString()}</span>
                  <span style="color:var(--text-dim);"> — players plus draft picks; before Package Adjustment</span>
                </div>
                ${playerOnlyLine}
                ${marketLine}''')

          # QF2-03: reject malformed rounds and tiers instead of silently selling an R6.
          # Retain the existing allowed fallback year factor 0.60 verbatim.
          patch('QF2-03: defensive pickValue guard',
          '''function pickValue(round, slot, year){
            const base = (PICK_BASE[round] || PICK_BASE[6])[slot] ?? PICK_BASE[6].late;
            const disc = YEAR_DISCOUNT[year] ?? 0.6;
            return Math.round(base * disc);
          }''',
          '''function pickValue(round, slot, year){
            // QF2_PICK_INPUT_FAIL_CLOSED: unknown round/slot is never silently mapped to R6.
            if(!Object.prototype.hasOwnProperty.call(PICK_BASE, String(round)) ||
               !['early','mid','late'].includes(slot)) return null;
            const base = PICK_BASE[round][slot];
            const disc = YEAR_DISCOUNT[year] ?? 0.6; // Preserve frozen V10 year fallback.
            return Math.round(base * disc);
          }''')
          patch('QF2-03: reject invalid additions',
          '''function addPickAsset(side, year, round, slot){
            const val = pickValue(round, slot, year);
            const label = `${year} Rd ${round} (${slot})`;
            state[side].push({ id:uid(), type:'pick', name:label, value:val });
            render();
          }''',
          '''function addPickAsset(side, year, round, slot){
            const val = pickValue(round, slot, year);
            if(!Number.isFinite(val) || val <= 0){
              console.warn('Unsupported draft-pick round/slot; no asset was added.');
              return false;
            }
            const label = `${year} Rd ${round} (${slot})`;
            state[side].push({ id:uid(), type:'pick', name:label, value:val });
            render();
            return true;
          }''')

          # QF2-04: native suggestion buttons support Tab, Enter, click and touch;
          # focus-safe blur and Escape/ArrowDown. 7 labels are associated to inputs.
          patch('QF2-04: button accessibility styles',
          '''  .suggest-item:active{ background:var(--bg); }
            .suggest-meta{''',
          '''  .suggest-item:active{ background:var(--bg); }
            button.suggest-item{width:100%;background:transparent;color:var(--text);text-align:left;
              border-top:0;border-left:0;border-right:0;border-radius:0;font:inherit;}
            button.suggest-item:focus-visible{outline:2px solid var(--text);outline-offset:-2px;background:var(--panel-alt);}
            .suggest-meta{''')
          for ident, label in [
              ('pname','Player Name <span id="matchTag-${side}" class="match-tag"></span>'),
              ('ppos','Position'),('page','Age'),('prole','Role Tier'),
              ('pyyear','Year'),('pyround','Round'),('pyslot','Estimated Slot')]:
              patch('QF2-04: accessible label '+ident,
                    f'<label>{label}</label>',
                    f'<label for="{ident}-$' + '{side}">' + label + '</label>')
          patch('QF2-04: input key events and dropdown association',
          '''                  oninput="handleNameInput('${side}')"
                            onfocus="handleNameInput('${side}')"
                            onblur="hideSuggestSoon('${side}')" />
                     <div class="suggest-box" id="suggest-${side}" style="display:none;"></div>''',
          '''                  oninput="handleNameInput('${side}')"
                            onfocus="handleNameInput('${side}')"
                            onkeydown="handleSuggestKeydown(event,'${side}')"
                            aria-controls="suggest-${side}" aria-autocomplete="list"
                            onblur="hideSuggestSoon('${side}')" />
                     <div class="suggest-box" id="suggest-${side}" role="group"
                          aria-label="Player suggestions" onfocusout="hideSuggestSoon('${side}')" style="display:none;"></div>''')
          patch('QF2-04: semantic keyboard and touch suggestions',
          '''    return `<div class="suggest-item" onmousedown="selectAndAddMatch('${side}','${k}')">
                <span>${titleCase(k)}</span>
                <span class="suggest-meta">${escapeHtml(p.pos)} · Age ${displayPlayerAge(p.pos, p.age, k)}${injuryBadge(p.injury)}</span>
              </div>`;''',
          '''    return `<button type="button" class="suggest-item" data-key="${escapeHtml(k)}"
                 onmousedown="event.preventDefault()" onclick="selectAndAddMatch('${side}',this.dataset.key)">
                <span>${escapeHtml(titleCase(k))}</span>
                <span class="suggest-meta">${escapeHtml(p.pos)} · Age ${displayPlayerAge(p.pos, p.age, k)}${injuryBadge(p.injury)}</span>
              </button>`;''')
          patch('QF2-04: keyboard Escape/ArrowDown and focus-safe blur',
          '''function hideSuggestSoon(side){
            setTimeout(() => {
              const box = document.getElementById(`suggest-${side}`);
              if(box) box.style.display = 'none';
            }, 150);
          }''',
          '''function handleSuggestKeydown(event, side){
            const box = document.getElementById(`suggest-${side}`);
            if(event.key === 'Escape'){
              if(box){ box.style.display = 'none'; box.innerHTML = ''; }
              event.preventDefault();
            } else if(event.key === 'ArrowDown' && box && box.style.display === 'block'){
              const first = box.querySelector('button.suggest-item');
              if(first){ event.preventDefault(); first.focus(); }
            }
          }

          function hideSuggestSoon(side){
            setTimeout(() => {
              const box = document.getElementById(`suggest-${side}`);
              const input = document.getElementById(`pname-${side}`);
              const focused = document.activeElement;
              if(box && focused !== input && !box.contains(focused)) box.style.display = 'none';
            }, 150);
          }''')

          # Ensure frozen math constants and behavior-sensitive source remain unchanged.
          assert len(changed) == 24, f'unexpected replacement count {len(changed)}: {changed}'
          assert 'QF2_AGE_DISPLAY_ONLY' in source and 'QF2_ALL_ASSETS_RAW_FV' in source
          assert 'QF2_PICK_INPUT_FAIL_CLOSED' in source
          assert 'TEAM_IMPACT_UI_RETIRED_V1' in source
          assert source.count('const YEAR_DISCOUNT =') == 1
          assert original != source.encode('utf8')
          TARGET.write_text(source,encoding='utf8')
          print('QF2 PATCH PASS',len(changed),'unique anchors; wrote index.html only')
          for c in changed: print('  '+c)
          PY
      - name: Focused QF2 semantic, V10 and syntax tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, tempfile, subprocess, os
          s=Path('index.html').read_text(encoding='utf8')
          o=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          assert s != o
          assert s.count('QF2_AGE_DISPLAY_ONLY') == 1
          assert s.count('QF2_ALL_ASSETS_RAW_FV') == 1
          assert s.count('QF2_PICK_INPUT_FAIL_CLOSED') == 1
          assert 'TEAM_IMPACT_UI_RETIRED_V1' in s
          assert 'qf2' not in (o[:100].lower())
          for key in ('PICK_BASE','YEAR_DISCOUNT','POSITION_WEIGHT','AGE_CURVE','ROLE_MULT','PROD_MULT_DATA','PLAYER_DB','RB_BIRTH_DATE_DATA'):
              pattern=rf'const {key}\s*=\s*\{{.*?\n\}};'
              a=re.search(pattern,o,re.S)
              b=re.search(pattern,s,re.S)
              assert a and b and a.group()==b.group(),f'Frozen {key} changed'
          # Candidate still has QF1 guards and no protected model signoffs altered.
          for mark in ('const tradeComplete = state.A.length > 0 && state.B.length > 0;',
                       "verdictEl.textContent = 'Add at least one asset to each side'", 'PACKAGE_ADJUSTMENT_V1_7_UI_CLARITY'):
              assert mark in s, f'QF1 prior behavior missing: {mark}'
          assert 'onmousedown="selectAndAddMatch' not in s
          for ident in ('pname','ppos','page','prole','pyyear','pyround','pyslot'):
              assert (f'<label for="{ident}-$' + '{side}">') in s, f'unbound label: {ident}'
          assert 'role="group"' in s and 'handleSuggestKeydown(event' in s
          assert 'button.suggest-item:focus-visible' in s
          assert 'aria-label="Player suggestions"' in s
          assert 'Raw FV (all assets):' in s and '${playerOnlyLine}' in s
          assert 'function displayPlayerAge(' in s
          assert 'function addPickAsset(' in s and 'return false;' in s
          # Every script block, not just a hand-selected function, must parse.
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          assert scripts, 'no embedded scripts'
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf8') as f:
              f.write('\n'.join(scripts)); path=f.name
          try: subprocess.run(['node','--check',path],check=True)
          finally: Path(path).unlink(missing_ok=True)
          # Execute the *deployed* pick code and check all 54 cells exactly parity
          # with the unpatched QF1 source, plus negative probes and 2030 fallback.
          pickconst=re.search(r'const PICK_BASE\s*=\s*\{.*?\n\};\s*/\* V10 YEAR_DISCOUNT.*?\*/\s*const YEAR_DISCOUNT\s*=\s*\{.*?\};',s,re.S)
          assert pickconst
          pf=re.search(r'function pickValue\(round, slot, year\)\{.*?\n\}',s,re.S)
          oldpf=re.search(r'function pickValue\(round, slot, year\)\{.*?\n\}',o,re.S)
          assert pf and oldpf
          js=(pickconst.group()+'\n'+oldpf.group().replace('function pickValue(','function baselinePickValue(',1)+'\n'+pf.group()+r'''
          const assert = require('node:assert/strict');
          let checked = 0;
          for(const year of ['2027','2028','2029']) for(const round of [1,2,3,4,5,6]) for(const slot of ['early','mid','late']){
            assert.equal(pickValue(round,slot,year),baselinePickValue(round,slot,year));
            checked++;
          }
          assert.equal(checked,54);
          assert.equal(pickValue(1,'early','2030'),Math.round(PICK_BASE[1].early*0.6));
          for(const [round,slot] of [[0,'early'],[7,'mid'],[1,'unknown'],[1,null],[null,'late'],['abc','early']]){
            assert.equal(pickValue(round,slot,'2027'),null);
          }
          assert.equal(6578 - pickValue(1,'early','2027'), 446);
          console.log('PASS 54/54 original V10 prices; 6 invalids rejected; 2030 fallback; mixed asset +446');
          ''')
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf8') as f:
              f.write(js); p=f.name
          try: subprocess.run(['node',p],check=True)
          finally: Path(p).unlink(missing_ok=True)
          print('PASS QF2 focused static/JS gates; unchanged FV and frozen Pick V10 constants')
          PY
      - name: Full repository, IDP, FA and package regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts/validation')
          import validate_idp_v1_final_deployment as v
          report=v.validate_deployment()
          assert report['actual_changed_entry_count'] == 320
          print('PASS frozen IDP approved delta count 320')
          PY
      - name: Publish isolated review branch only after green gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only)" == 'index.html' ]] || { git status --short; exit 1; }
          git diff --check
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo 'STOP: main advanced during run, cannot publish unreviewed candidate'; exit 1;
          }
          if git ls-remote --exit-code --heads origin "${REVIEW_BRANCH}" >/dev/null; then
            echo 'STOP: review branch appeared while running'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${REVIEW_BRANCH}"
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || exit 1
          git diff --cached --check
          git commit -m 'QF2 v1: exact scoped review fixes, no valuation coefficient change'
          git push --force-with-lease="refs/heads/${REVIEW_BRANCH}:" origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          echo "QF2 REVIEW BRANCH GREEN: ${REVIEW_BRANCH}"
          echo "REVIEW COMMIT: $(git rev-parse HEAD)"
          echo "REVIEW INDEX BLOB: $(git hash-object index.html)"
          echo 'main and live Pages untouched: owner approval required for promotion.'
