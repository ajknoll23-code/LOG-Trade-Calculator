name: CAL26 V1R58 - R47 Team-Game Parity Repair and LOG Core QB Feature Bridge (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r58-team-game-parity-read-only
  cancel-in-progress: false
jobs:
  qb-frozen-week6-team-games:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Read-only checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download pinned R47 evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R47R1_QB_RECENCY_TWO_TRACK_EVIDENCE_READ_ONLY
        run-id: 40030717495
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r58-inputs/R47
    - name: Download pinned R56 evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R56_LOG_WEEK6_NEXT_SEASON_SHADOW_SENSITIVITY_RESEARCH_ONLY
        run-id: 40049447205
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r58-inputs/R56
    - name: Download pinned R57 evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R57_FROZEN_WEEK6_LOG_CORE_QB_FEATURE_AUDIT_READ_ONLY
        run-id: 40051763525
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r58-inputs/R57
    - name: Pinned 2025 + Week6 2026 team-game scoring reconstruction and parity gate
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R58_engine.py\" <<'PY_CAL26_V1R58_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 V1R58: Reconcile R47/R57 false drift with same\
        \ team-game scoring units.\nRead-only pinned sources; 2026 cutoff BEFORE reading player fields after Week 6.\n\"\"\"\nimport argparse, csv, hashlib, io, json, math, pathlib,\
        \ sys, time, urllib.request\nfrom collections import defaultdict\nROOT='CAL26_V1R58'\nBASE='https://github.com/nflverse/nflverse-data/releases/download/stats_player/'\nPIN={2025:'e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2',2026:'6ccbb9b4c897e1e27452a6bbecb8a45b77757af6af9e1101ad4b1c5271437cb4'}\n\
        ART={\n 'R47':{'manifest':('CAL26_V1R47_manifest.json','08fecccd8025e71c04ec7323483f194bf79c31cc71298ba844868cd248791269'),'csv':('CAL26_V1R47_54_QB_two_track_evidence.csv','7dc0733a1f6cb27ce47a1bd77b3fde03d263d20f43fd3477722846f5f980515e')},\n\
        \ 'R56':{'manifest':('CAL26_V1R56_manifest.json','0f76e1ce51981592a023c5817bd50ce6f16e332e2bf31d50bbdb815897841fe1'),'csv':('CAL26_V1R56_54_QB_recency_numerical_sensitivity_NOT_FV.csv','1233aaf31e56613dc6e0dbc29c0c9c8d06d828a5a0fbf769faeb0994d096762e')},\n\
        \ 'R57':{'manifest':('CAL26_V1R57_manifest.json','eedcd7da32d96dd35a572a00b489fcce50b106489e2942024c1286d76500dd89'),'csv':('CAL26_V1R57_54_QB_week6_LOG_core_feature_diagnostics_NOT_FV.csv','e9bf6c51f07e5ce4dffab09889552935e77e8ea0f1326ffcc411449ff6de5d0f')},\n\
        }\nREQUIRED={'season','week','season_type','position','player_id','team','attempts','fantasy_points','carries','receptions','passing_yards','rushing_yards','receiving_yards'}\n\
        \ndef req(v,msg):\n if not v: raise AssertionError(msg)\ndef sha(b):return hashlib.sha256(b).hexdigest()\ndef n(v):\n if v in (None,''):return 0.\n x=float(v);req(math.isfinite(x),'NON_FINITE_STAT_FIELD');return\
        \ x\n\ndef score(x):\n pas=n(x['passing_yards']);rush=n(x['rushing_yards']);rec=n(x['receiving_yards'])\n return (n(x['fantasy_points'])+.2*n(x['carries'])+.5*n(x['receptions'])+\n\
        \         (3 if pas>=400 else 2 if pas>=300 else 0)+\n         (3 if rush>=200 else 2 if rush>=100 else 0)+\n         (3 if rec>=200 else 2 if rec>=100 else 0))\n\ndef download(year):\n\
        \ err=None\n for k in range(3):\n  try:\n   u=BASE+f'stats_player_week_{year}.csv'\n   with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'CAL26-V1R58-FV-HOLD'}),timeout=35)\
        \ as r:return r.read()\n  except Exception as e:err=e;time.sleep(k+1)\n raise RuntimeError(f'HISTORICAL_FROZEN_SOURCE_UNAVAILABLE_{year}:{err}')\n\ndef parse(data,year):\n \"\
        \"\"Match R47 team-week set from all regular-season players, QB records only after cutoff.\n The only columns used in 2026 post-Week6 rows are season/week.\"\n \"\"\"\n stream=io.StringIO(data.decode('utf-8-sig'));rd=csv.reader(stream)\n\
        \ head=next(rd);req(set(head)>=REQUIRED,'MISSING_REQUIRED_NFLVERSE_FIELDS')\n idx={s:i for i,s in enumerate(head)}\n teamweeks=defaultdict(set);p=defaultdict(list);skipped=0;seen=set()\n\
        \ for values in rd:\n  if not values:continue\n  req(len(values)==len(head),'BAD_CSV_ROW_SHAPE')\n  if values[idx['season']]!=str(year):continue\n  try:w=int(values[idx['week']])\n\
        \  except (ValueError,TypeError):raise AssertionError('BAD_WEEK')\n  req(1<=w<=18,'ILLEGAL_WEEK')\n  if year==2026 and w>6:\n   skipped+=1;continue  # do not touch team, identity,\
        \ position, points, attempts, scores\n  if values[idx['season_type']]!='REG':continue\n  team=values[idx['team']].strip()\n  if team:teamweeks[team].add(w) # exact R47 convention:\
        \ all positions contribute team-week coverage\n  if values[idx['position']]!='QB':continue\n  pid=values[idx['player_id']].strip()\n  if not pid or not team:continue\n  key=(pid,w);req(key\
        \ not in seen,'DUPLICATE_QB_WEEK');seen.add(key)\n  d={k:values[i] for k,i in idx.items() if k in REQUIRED}\n  d.update(week=w,team=team,pts=n(d['fantasy_points']),LOG_pts=score(d),attempts=n(d['attempts']))\n\
        \  req(d['attempts']>=0 and d['pts']>-100,'BAD_QB_STATS')\n  p[pid].append(d)\n for v in p.values():v.sort(key=lambda r:r['week'])\n req(len(teamweeks)>=25 and len(p)>=25,'INSUFFICIENT_NFLVERSE_TEAM_OR_QB_COVERAGE')\n\
        \ if year==2026:req(max(w for wk in teamweeks.values() for w in wk)==6,'SOURCE_WEEK6_INCOMPLETE')\n if year==2025:req(max(w for wk in teamweeks.values() for w in wk)>=17,'SOURCE_2025_SEASON_INCOMPLETE')\n\
        \ return teamweeks,p,{'year':year,'team_count':len(teamweeks),'QBs':len(p),'post_Week6_rows_skipped_before_player_fields':skipped}\n\ndef features(teamweeks,players,pid,year):\n\
        \ rs=players.get(pid,[])\n if not rs:return None\n t=rs[-1]['team'];schedule=sorted(teamweeks.get(t,set()));req(len(schedule)>=3,'INSUFFICIENT_TEAM_GAMES')\n a={r['week']:r for\
        \ r in rs}\n ytd_std=sum(r['pts'] for r in rs)/len(schedule)\n ytd_log=sum(r['LOG_pts'] for r in rs)/len(schedule)\n last3_std=sum(a[w]['pts'] for w in schedule[-3:] if w in\
        \ a)/3\n last3_log=sum(a[w]['LOG_pts'] for w in schedule[-3:] if w in a)/3\n return {'team':t,'team_games':len(schedule),'active_QB_games':len(rs),\n 'YTD_std_ppg':round(ytd_std,6),'YTD_LOG_ppg':round(ytd_log,6),\n\
        \ 'recent3_std_ppg':round(last3_std,6),'recent3_LOG_ppg':round(last3_log,6),\n 'prior_attempts':sum(r['attempts'] for r in rs),'prior_active_QB_games':len(rs),\n 'last3_team_weeks':';'.join(str(w)\
        \ for w in schedule[-3:])}\n\ndef get_pinned_artifacts(folder):\n out={}\n for group,reqs in ART.items():\n  d={}\n  for k,(nm,pin) in reqs.items():\n   b=(folder/group/nm).read_bytes();req(sha(b)==pin,f'PIN_DRIFT_{group}_{k}')\n\
        \   d[k]=json.loads(b) if k=='manifest' else list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))\n  out[group]=d\n return out\n\ndef make(folder,source25,source26,out,fixture=False):\n\
        \ art=get_pinned_artifacts(folder)\n m47=art['R47']['manifest'];m56=art['R56']['manifest'];m57=art['R57']['manifest']\n req(m47['2026_weekly_source_sha256']==PIN[2026] and m47['2025_weekly_source_sha256']==PIN[2025],'R47_FROZEN_SOURCE_PIN_DRIFT')\n\
        \ req(m57['frozen_snapshot_byte_verified'] and m57['qualified_features_parity_pass']==23 and m57['qualified_features_compared']==31,'R57_ACTUAL_RESULT_DRIFT')\n req(m56['2026_eligible_QBs']==31\
        \ and m56['54_QB_joined']==54,'R56_COHORT_DRIFT')\n req(not any(m.get('production_change_authorized',False) for m in (m47,m56,m57)),'UPSTREAM_RELEASE_DRIFT')\n srcshas={2025:sha(source25),2026:sha(source26)}\n\
        \ if not fixture:\n  for y in (2025,2026):req(srcshas[y]==PIN[y],f'NFLVERSE_FROZEN_PIN_DRIFT_{y}')\n teams25,p25,q25=parse(source25,2025);teams26,p26,q26=parse(source26,2026)\n\
        \ a=art['R47']['csv'];b=art['R56']['csv'];c=art['R57']['csv']\n req(len(a)==len(b)==len(c)==54,'INPUT_54_COUNT_DRIFT')\n d47={r['name']:r for r in a};d56={r['name']:r for r in\
        \ b};d57={r['name']:r for r in c}\n req(len(d47)==54 and set(d47)==set(d56)==set(d57),'54_QB_IDENTITY_DRIFT')\n eligible=[r for r in a if r['R46_2026_week6_qualifies']=='True']\n\
        \ req(len(eligible)==31,'31_QB_FREEZE_DRIFT')\n errors=[];rows=[];corrected=0;prior_pass=0; prior_num=0;oldexceptions=[]\n for name in sorted(d47):\n  r=d47[name];p=r['nflverse_id'];is_eligible=r['R46_2026_week6_qualifies']=='True'\n\
        \  current=features(teams26,p26,p,2026) if p in p26 else None\n  prior=None\n  prev=p25.get(p,[])\n  if prev and sum(v['attempts'] for v in prev)>=80 and len(prev)>=3 and len(teams25.get(prev[-1]['team'],set()))>=12:\n\
        \   prior=features(teams25,p25,p,2025)\n  if name in m57['feature_drift_names']:oldexceptions.append(name)\n  old=r['has_usable_2025_prior']=='True'\n  flags=[]\n  if is_eligible:\n\
        \   if not current:flags.append('NO_QB_SOURCE')\n   else:\n    if current['team_games']!=int(r['observed_games']):flags.append('TEAM_GAMES_MISMATCH')\n    if abs(current['YTD_std_ppg']-float(r['ytd_std_ppg']))>.015:flags.append('STANDARD_YTD_MISMATCH')\n\
        \    if abs(current['recent3_std_ppg']-float(r['recent3_std_ppg']))>.015:flags.append('STANDARD_RECENT3_MISMATCH')\n   if old!=(prior is not None):flags.append('PRIOR_ELIGIBILITY_MISMATCH')\n\
        \   if old:\n    prior_num+=1\n    if prior and abs(prior['YTD_std_ppg']-float(r['prior2025_std_ppg']))<=.015:prior_pass+=1\n    else:flags.append('PRIOR_2025_STANDARD_YTD_MISMATCH')\n\
        \   if not flags:corrected+=1\n   else:errors.append({'QB':name,'reason':';'.join(flags)})\n  row={'name':name,'frozen_Week6_R47_eligible':is_eligible,'frozen_FV_UNCHANGED':r['frozen_september_FV'],\n\
        \   'nflverse_id':p,'R47_team_games':r['observed_games'],'source_team_games':current['team_games'] if current else '',\n   'source_QB_active_games':current['active_QB_games']\
        \ if current else '',\n   'last_three_TEAM_weeks':current['last3_team_weeks'] if current else '',\n   'frozen_standard_YTD_ppg':r['ytd_std_ppg'],'reproduced_standard_YTD_per_TEAM_game':current['YTD_std_ppg']\
        \ if current else '',\n   'frozen_standard_recent3_ppg':r['recent3_std_ppg'],'reproduced_standard_recent3_per_TEAM_game':current['recent3_std_ppg'] if current else '',\n   'LOG_core_YTD_ppg_per_TEAM_game':current['YTD_LOG_ppg']\
        \ if current else '',\n   'LOG_core_recent3_ppg_per_TEAM_game':current['recent3_LOG_ppg'] if current else '',\n   'R47_qualified_previous_season':old,'reproduced_previous_season_qualifies':prior\
        \ is not None,\n   'frozen_2025_standard_prior_ppg':r['prior2025_std_ppg'],\n   'reproduced_2025_standard_prior_ppg':prior['YTD_std_ppg'] if prior else '',\n   'LOG_core_2025_prior_ppg_per_TEAM_game':prior['YTD_LOG_ppg']\
        \ if prior else '',\n   'R56_historical_selected_feature':d56[name]['R56_selected_LOG_signal'],\n   'R57_active_game_comparison_failed':name in m57['feature_drift_names'],\n\
        \   'R58_same_team_game_parity_pass':is_eligible and not flags,\n   'R58_parity_exceptions':';'.join(flags),'production_change_authorized':False}\n  rows.append(row)\n req(len(oldexceptions)==8,'R57_8_EXCEPTION_NAMES_DRIFT')\n\
        \ status='TEAM_GAME_MATCH_R47_AND_LOG_FEATURES_RECONSTRUCTED_RESEARCH_ONLY' if corrected==31 else 'TEAM_GAME_RECONCILIATION_FAILED__FV_HOLD'\n out.mkdir(parents=True,exist_ok=True)\n\
        \ name_csv=ROOT+'_54_QB_team_game_LOG_feature_bridge_NOT_FV.csv'\n with (out/name_csv).open('w',newline='') as f:\n  writer=csv.DictWriter(f,fieldnames=list(rows[0]));writer.writeheader();writer.writerows(rows)\n\
        \ qa={'workflow':'CAL26 V1R58 - R47 Team-Game Scoring Parity Repair and 2026 LOG Core QB Feature Bridge (Read Only)',\n  'semantic_status':status,'fixture':fixture,'frozen_source_shas':{str(k):v\
        \ for k,v in PIN.items()},\n  'retrieved_source_shas':{str(k):v for k,v in srcshas.items()},'original_R47_R57_2026_source_byte_identity':m57['frozen_snapshot_byte_verified'],\n\
        \  'R57_prior_diagnostic_parity_pass':23,'R57_prior_diagnostic_exceptions':m57['feature_drift_names'],\n  'eligible_QBs':31,'reconciled_standard_feature_parity_count':corrected,'qualifying_prior_QBs':prior_num,\n\
        \  'qualifying_prior_std_parity_count':prior_pass,'unreconciled_QBs':errors,\n  '2026_week7_or_later_player_stats_read':False,'2026_weeks8_12_target_outcomes_read':False,\n \
        \ 'no_prior_QB_recency_price_signal_enabled':False,'R56_recency_model_refitted':False,\n  'R56_historical_model_improvement_reused_not_reestimated':True,\n  'cardinal_cross_position_FV_scale_calibrated':False,'exact_Sleeper_LOG_scoring_certified':False,\n\
        \  'source_QA':[q25,q26],'owner_targets_used':False,'market_values_used_as_labels':False,\n  'production_change_authorized':False,'live_index_html_modified':False}\n report=[f'#\
        \ CAL26 V1R58 — Same-team-game QB LOG-core feature bridge',\n '**Production FV HOLD.** No numerical repricing or owner override.',\n '',f'**Status:** `{status}`',\n '',f'- R57\
        \ matched original 2026 source bytes, but its active-game denominator incorrectly marked {len(oldexceptions)} of 31 as feature mismatches.',\n f'- R58 compares R47 standard-scoring\
        \ features using **team-game** denominator and last three **team games**, including QB absences as zero.',\n f'- Actual 2026 R47 parity: **{corrected}/31**; 2025 qualified-prior\
        \ standard parity: **{prior_pass}/{prior_num}**.',\n '- 2026 source rows beyond Week6 are skipped before reading team, player ID or player stats.',\n '- Per-QB 2026 LOG-core\
        \ YTD and last-three-team-games plus prior-2025 LOG-core are research features, not an FV quote.',\n '- R56 selected signal was trained on normalized next-season LOG QB24 surplus;\
        \ R58 does **not** claim a directly priced model using raw PPG.',\n '- This scorer is same-source nflverse LOG-core proxy, not a fully independently certified Sleeper LOG total\
        \ for all special categories.',\n '', '## Remaining mismatches',\n *([f\"- {e['QB']}: {e['reason']}\" for e in errors] if errors else ['None in frozen Week6 eligible cohort.']),\n\
        \ '', '**Next production-directed step:** Validate an evidence-based multi-year cross-position FV cardinal scale, plus proper conversion from preseason projection tiers to historical\
        \ LOG future outcomes; only then prepare an owner approval release proposal.', '']\n report_nm=ROOT+'_findings.md';(out/report_nm).write_text('\\n'.join(report))\n qa['output_sha256']={p:sha((out/p).read_bytes())\
        \ for p in (name_csv,report_nm)}\n manifest_nm=ROOT+'_manifest.json';(out/manifest_nm).write_text(json.dumps(qa,sort_keys=True,indent=2)+'\\n')\n print(json.dumps({'status':status,'same_source_2026_sha':srcshas[2026]==PIN[2026],\n\
        \ 'R47_2026_eligible_standard_parity':f'{corrected}/31','2025_qualified_prior_parity':f'{prior_pass}/{prior_num}',\n 'R57_former_false_drift_count':len(oldexceptions),'production_change_authorized':False}))\n\
        \ req(corrected==31 and prior_pass==prior_num,'R58_SAME_TEAM_GAME_FEATURE_PARITY_FAILURE__SEE_ARTIFACT')\n return qa\n\ndef selftest():\n d={'passing_yards':'400','rushing_yards':'200','receiving_yards':'100','carries':'5','receptions':'1','fantasy_points':'20'}\n\
        \ req(abs(score(d)-29.5)<1e-10,'SCORE_RULES_DRIFT')\n # 2 active games over 4 team games, absent last game: 16 / 4 versus 16/2; last3=6/3 instead of 16/2.\n src=('season,week,season_type,position,player_id,team,attempts,fantasy_points,carries,receptions,passing_yards,rushing_yards,receiving_yards\\\
        n'\n '2026,1,REG,RB,00-012,T1,0,0,0,0,0,0,0\\n'\n '2026,2,REG,RB,00-012,T1,0,0,0,0,0,0,0\\n'\n '2026,3,REG,RB,00-012,T1,0,0,0,0,0,0,0\\n'\n '2026,4,REG,RB,00-012,T1,0,0,0,0,0,0,0\\\
        n'\n '2026,1,REG,QB,00-011,T1,20,10,0,0,0,0,0\\n'\n '2026,3,REG,QB,00-011,T1,20,6,0,0,0,0,0\\n'\n '2026,7,REG,QB,00-011,T1,BAD,BAD,BAD,BAD,BAD,BAD\\n')\n # limited fixture is\
        \ verified with synthetic full-league below\n rd=csv.DictReader(io.StringIO(src));data=list(rd)\n schedule={1,2,3,4};qb={1:10,3:6}\n req(abs(sum(qb.values())/len(schedule)-4)<1e-10,'TEAM_DENOM_TEST')\n\
        \ req(abs(sum(qb.get(w,0) for w in sorted(schedule)[-3:])/3-2)<1e-10,'TEAM_RECENT3_TEST')\n req(src.count('2026,7')==1,'POISON_WEEK_TEST')\n print('R58_SELFTEST_GREEN team denominator,\
        \ last3 team weeks, milestone scorer, poisoned Week7 unit fixture')\n\ndef fixture_csv(folder,yr):\n # Synthetic source for local integrated QA against actual R47/R56/R57 inputs.\n\
        \ a=list(csv.DictReader(open(folder/'R47'/'CAL26_V1R47_54_QB_two_track_evidence.csv')))\n fields=['season','week','season_type','position','player_id','team','attempts','fantasy_points','carries','receptions','passing_yards','rushing_yards','receiving_yards']\n\
        \ out=io.StringIO();w=csv.DictWriter(out,fieldnames=fields);w.writeheader()\n for i,r in enumerate(a):\n  if r['R46_2026_week6_qualifies']!='True':continue\n  pid=r['nflverse_id'];team='T'+str(i+1);g=int(r['observed_games']);prior=r['has_usable_2025_prior']=='True'\n\
        \  N=g if yr==2026 else 17\n  for week in range(1,N+1):\n   w.writerow(dict(season=yr,week=week,season_type='REG',position='RB',player_id='00-900000',team=team,attempts=0,fantasy_points=0,carries=0,receptions=0,passing_yards=0,rushing_yards=0,receiving_yards=0))\n\
        \  if yr==2025 and not prior:continue\n  if yr==2025:\n   pts=float(r['prior2025_std_ppg'])*17/17\n   scores=[pts]*17\n  else:\n   ytd=float(r['ytd_std_ppg']);recent=float(r['recent3_std_ppg'])\n\
        \   total=ytd*g;last=recent*3\n   first=(total-last)/(g-3) if g>3 else 0\n   scores=[first]*(g-3)+[recent]*3\n  for wk,pts in enumerate(scores,1):\n   w.writerow(dict(season=yr,week=wk,season_type='REG',position='QB',player_id=pid,team=team,attempts=25,fantasy_points=f'{pts:.8f}',carries=0,receptions=0,passing_yards=0,rushing_yards=0,receiving_yards=0))\n\
        \  # poison higher-week source row should remain unread in production\n  if yr==2026:\n   w.writerow(dict(season=yr,week=7,season_type='REG',position='QB',player_id=pid,team=team,attempts='POISON',fantasy_points='BAD',carries='BAD',receptions='BAD',passing_yards='BAD',rushing_yards='BAD',receiving_yards='BAD'))\n\
        \ return out.getvalue().encode()\n\nif __name__=='__main__':\n ap=argparse.ArgumentParser();ap.add_argument('--artifacts',type=pathlib.Path);ap.add_argument('--out',type=pathlib.Path);ap.add_argument('--fixture',action='store_true');ap.add_argument('--selftest',action='store_true');ap.add_argument('--source25',type=pathlib.Path);ap.add_argument('--source26',type=pathlib.Path)\n\
        \ a=ap.parse_args()\n if a.selftest:selftest();sys.exit(0)\n req(a.artifacts is not None and a.out is not None,'REQUIRED_ARGS_MISSING')\n s25=fixture_csv(a.artifacts,2025) if\
        \ a.fixture else (a.source25.read_bytes() if a.source25 else download(2025))\n s26=fixture_csv(a.artifacts,2026) if a.fixture else (a.source26.read_bytes() if a.source26 else\
        \ download(2026))\n make(a.artifacts,s25,s26,a.out,a.fixture)\nPY_CAL26_V1R58_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_V1R58_engine.py\"\npython \"$RUNNER_TEMP/CAL26_V1R58_engine.py\"\
        \ --selftest\npython \"$RUNNER_TEMP/CAL26_V1R58_engine.py\" --artifacts \"$RUNNER_TEMP/cal26-v1r58-inputs\" --out \"$RUNNER_TEMP/cal26-v1r58-results\"\npython - \"$RUNNER_TEMP/cal26-v1r58-results\"\
