name: CAL26 V1R17 - Age Neutral vs Multi Year Dynasty Horizon 565 Player READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cal26-v1r17-age-horizon-read-only
  cancel-in-progress: false
jobs:
  full_age_horizon_review:
    name: Compare deployed vs no age vs 3 6 10 year career horizon; guard 33 owner values
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Check out current production without write permissions
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
    - name: Verify canonical calculator evaluator and synced free-agent board
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = 'refs/heads/main'
        python3 - <<'PY_SYNTAX'
        from pathlib import Path
        p=Path('scripts/validation/snapshot_values.py')
        compile(p.read_text(),str(p),'exec')
        print('PASS canonical Python evaluator syntax')
        PY_SYNTAX
        python3 scripts/validation/snapshot_values.py --selftest
        python3 - <<'PY_PARITY'
        from pathlib import Path
        import sys
        sys.path.insert(0,'scripts/sync')
        import sync_free_agent_valuation as sync
        i=Path('index.html').read_text();b=Path('free-agent-board.html').read_text()
        assert all(sync.parity_regions(i,b).values()),'SOURCE_REGION_PARITY'
        assert sync.render_synced(i,b)==b,'BOARD_SYNC_PARITY'
        print('PASS: deployed calculator and free agent board exact source parity')
        PY_PARITY
    - name: Materialize exact frozen read-only V1R17 research engine outside repository
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R17_engine.py\" <<'PY_CAL26_V1R17_ENGINE'\n#!/usr/bin/env python3\n\
        \"\"\"CAL26 V1R17 read-only age-neutral vs career-horizon shadow.\n\nDoes not predict actual career length, fit survival\
        \ probabilities, or set FV policy.\nAnnual role-retention rates are deliberately explicit scenario assumptions.\n\
        This file is bundled *inside* the GH Actions workflow; no repo writes.\n\"\"\"\nfrom __future__ import annotations\n\
        import argparse, csv, hashlib, json, math, re, statistics, sys\nfrom pathlib import Path\nfrom collections import\
        \ Counter\nfrom datetime import datetime, timezone\n\nPOSITION_PEAK_REFERENCE = {'QB':28,'RB':24,'WR':26,'TE':27,'DL':27,'LB':27,'DB':26}\n\
        PROTECTED_18 = set('''daniel jones|devin lloyd|dj giddens|george karlaftis|jack campbell|jake ferguson|jamien sherwood|kenny\
        \ gainwell|luther burden|malik davis|malik willis|puka nacua|quay walker|quentin lake|tj watt|trevon moehrig|tuli\
        \ tuipulotu|zack baun'''.split('|'))\nAPPROVED_15 = {'breece hall':5336,'brian branch':3436,'derrick henry':4112,'fred\
        \ warner':5071,'jahmyr gibbs':9497,'jaxson dart':5091,'jeremiyah love':5015,'jonathan taylor':6025,'marvin harrison':4207,'nik\
        \ bonitto':4919,'patrick mahomes':5756,'roquan smith':5188,'tetairoa mcmillan':5252,'trevor lawrence':6509,'trey mcbride':5823}\n\
        FEEDBACK = {'caleb williams':('Too Low',6153),'drake maye':('Too Low',6371),'cj stroud':('Too Low',4750),'jayden daniels':('Too\
        \ Low',5378),'josh allen':('Too Low',7697),'lamar jackson':('Too Low',6131),'brock purdy':('Too Low',5736),'jaxson\
        \ dart':('Correct',5091),'trevor lawrence':('Correct',6509),'bo nix':('Too High',6249),'dak prescott':('Too High',6422),'jalen\
        \ hurts':('Too High',6596),'jared goff':('Too High',5932),'justin herbert':('Too High',6197)}\n# Scenario-only annual\
        \ probability of retaining a fantasy-relevant role, assuming\n# player is currently active. These are NOT estimated\
        \ hazards and do not treat\n# injury, salary, rookie draft capital, and contract guarantees individually.\nRETENTION\
        \ = {\n 'QB': [(29,.970),(32,.955),(34,.900),(36,.730),(38,.540),(99,.320)],\n 'RB': [(24,.940),(26,.875),(28,.740),(29,.590),(31,.400),(99,.220)],\n\
        \ 'WR': [(25,.950),(28,.925),(30,.845),(32,.660),(34,.470),(99,.270)],\n 'TE': [(25,.950),(29,.925),(31,.825),(33,.650),(35,.450),(99,.270)],\n\
        \ 'DL': [(26,.950),(29,.915),(31,.800),(33,.630),(35,.450),(99,.270)],\n 'LB': [(25,.950),(28,.910),(30,.800),(32,.610),(34,.430),(99,.240)],\n\
        \ 'DB': [(25,.950),(28,.905),(30,.780),(32,.610),(34,.410),(99,.220)],\n}\nDISCOUNT = 0.90\nVARIANTS = {'NO_AGE':0,'HORIZON_3':3,'HORIZON_6':6,'HORIZON_10':10}\n\
        \ndef ensure(test,code):\n    if not test: raise AssertionError(code)\ndef sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\
        def jsround(x): return int(math.floor(x+0.5))\ndef writecsv(path,rows,fields):\n    with Path(path).open('w',newline='',encoding='utf-8')\
        \ as f:\n        w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');w.writeheader();w.writerows(rows)\ndef\
        \ retention(pos, age):\n    for limit,rate in RETENTION[pos]:\n        if age <= limit:return rate\n    raise AssertionError('RETENTION_TABLE')\n\
        def career_factor(pos,age,years):\n    \"\"\"Discounted expected retained active seasons divided by age-reference\
        \ seasons.\n\n    Production per active season is held at today's level; no extra direct AM.\n    Normalization prevents\
        \ arbitrary position-scale blowups.\n    \"\"\"\n    def horizon_sum(start):\n        active_prob=1.0;total=0.0\n\
        \        for t in range(years):\n            # season 0 is currently assigned, so retention acts on later seasons.\n\
        \            if t>0: active_prob *= retention(pos,start+t-1)\n            total += DISCOUNT**t*active_prob\n     \
        \   return total\n    return horizon_sum(age)/horizon_sum(POSITION_PEAK_REFERENCE[pos])\n\ndef main():\n    ap=argparse.ArgumentParser()\n\
        \    ap.add_argument('--repo',default='.')\n    ap.add_argument('--out',required=True)\n    ap.add_argument('--local-source',default='')\n\
        \    args=ap.parse_args();repo=Path(args.repo).resolve();out=Path(args.out).resolve();out.mkdir(parents=True,exist_ok=True)\n\
        \    src=Path(args.local_source).resolve() if args.local_source else repo/'index.html'\n    ensure(src.is_file(),'INDEX_MISSING')\n\
        \    sys.path.insert(0,str(repo/'scripts/validation'));sys.path.insert(0,str(repo/'scripts/sync'))\n    try: import\
        \ snapshot_values as sv\n    except ModuleNotFoundError: \n        sys.path.insert(0,str(repo));import local_sv as\
        \ sv\n    cfg=sv.load_from_html(src)\n    live=sv.compute_all_values(cfg)\n    ensure(len(live)==565 and len(set(live))==565,'LIVE_565_PARITY')\n\
        \    ensure(len([k for k,v in live.items() if v['pos']=='QB'])==64,'LIVE_QB_COUNT')\n    assert cfg['cal26_fv_owner_anchors']==APPROVED_15,\
        \ 'PINNED_APPROVED_15_DRIFT'\n    assert len(PROTECTED_18)==18 and not (PROTECTED_18&set(APPROVED_15)), 'PROTECTED_18_ERROR'\n\
        \    for name,price in APPROVED_15.items():\n        ensure(live[name]['value']==price, 'EXACT_OWNER_ANCHOR_DRIFT_'+name)\n\
        \    prior11=repo/'model/releases/cal26-v1r11-owner-selected-fv-2026-10-21-v1/release.json'\n    prior14=repo/'model/releases/cal26-v1r14-two-owner-rated-qb-fv-2026-10-21-v1/release.json'\n\
        \    if prior11.is_file() and prior14.is_file():\n        p11=json.loads(prior11.read_text());p14=json.loads(prior14.read_text())\n\
        \        ensure(p11['owner_selected_exact_fv']=={k:APPROVED_15[k] for k in p11['owner_selected_players']},'OWNER_V1R11_RELEASE_DRIFT')\n\
        \        ensure(p14['new_exact_prices']=={'jaxson dart':5091,'trevor lawrence':6509} and p14['production_authorized'],'OWNER_V1R14_RELEASE_DRIFT')\n\
        \    if (repo/'scripts/sync/sync_free_agent_valuation.py').is_file():\n        import sync_free_agent_valuation as\
        \ sync\n        board=(repo/'free-agent-board.html').read_text();index=(repo/'index.html').read_text()\n        ensure(all(sync.parity_regions(index,board).values()),'BOARD_PARITY_FAILED')\n\
        \        ensure(sync.render_synced(index,board)==board,'BOARD_NOT_SYNCED')\n    hist=repo/'research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.md'\n\
        \    hist2=repo/'research/age-curve-v2/age_curve_v2_phase5_evaluation.md'\n    if hist.is_file():ensure('14102' in\
        \ hist.read_text() or '14,102' in hist.read_text(),'HISTORICAL_AGE_REFERENCE_MISSING')\n    if hist2.is_file():ensure('EARLY_DIAGNOSTIC_ONLY'\
        \ in hist2.read_text(),'PROSPECTIVE_PHASE5_STATUS_DRIFT')\n    ensure(set(POSITION_PEAK_REFERENCE)==set(RETENTION),'COVERAGE_RETENTION')\n\
        \    ensure(all(0<r<=1 for ranges in RETENTION.values() for _,r in ranges),'INVALID_RETENTION')\n    rows=[];samples=[];metrics=[]\n\
        \    for key,v in sorted(live.items()):\n        info=cfg['player_db'][key];pos=info['pos'];age=info['age'];role=info['role'];fv=v['value']\n\
        \        rm,raw=sv.production_multiplier(key,role,cfg['prod_mult'],cfg['no_real_history'],cfg['role_mult'],cfg.get('cal22_keys',set()))\n\
        \        pw=cfg['position_weight'][pos]\n        am=sv.effective_age_multiplier(pos,age,role,key,rm,raw,cfg)\n   \
        \     # Special kicker 0.5 is a constant, not aging; preserve for all variants.\n        constant_without_age=0.5\
        \ if pos=='K' else 1.0\n        raw_base=100*pw*rm*55\n        expected=jsround(raw_base*am)\n        ensure(key in\
        \ APPROVED_15 or expected==fv,'BASELINE_CALCULATOR_PARITY_'+key)\n        variants={}\n        for name,years in VARIANTS.items():\n\
        \            if pos=='K':factor=constant_without_age\n            elif years==0:factor=1.0\n            else:factor=career_factor(pos,age,years)\n\
        \            candidate=APPROVED_15[key] if key in APPROVED_15 else (fv if key in PROTECTED_18 else jsround(raw_base*factor))\n\
        \            variants[name]=candidate\n            if key in APPROVED_15 or key in PROTECTED_18:\n               \
        \ ensure(candidate==fv,'FROZEN_CONTROL_CHANGED_'+key+'_'+name)\n        row={'player':key,'position':pos,'age':age,'role':role,'real_production':raw\
        \ is not None,\n             'production_multiplier':round(rm,6),'deployed_age_multiplier':round(am,6),\n        \
        \     'current_fv':fv,'approved15':key in APPROVED_15,'accepted18':key in PROTECTED_18}\n        row.update({x+'_fv':val\
        \ for x,val in variants.items()})\n        row.update({x+'_delta':val-fv for x,val in variants.items()})\n       \
        \ rows.append(row)\n        if key in FEEDBACK:\n            rating,comparison=FEEDBACK[key]\n            sample={'player':key,'current_fv':fv,'rating':rating,'price_rated':comparison}\n\
        \            for scen,price in variants.items():\n                sample[scen+'_fv']=price\n                sample[scen+'_meets_lower_bound']=(price>comparison\
        \ if rating=='Too Low' else '')\n                sample[scen+'_does_not_exceed_high_test']=(price<comparison if rating=='Too\
        \ High' else '')\n            samples.append(sample)\n    assert len(rows)==565 and len(samples)==14\n    # Deterministic\
        \ ranking within position (ties broken by canonical key).\n    for pos in sorted({r['position'] for r in rows}):\n\
        \        subset=[r for r in rows if r['position']==pos]\n        for src_col,rank_col in [('current_fv','live_position_rank')]+[(s+'_fv',s+'_position_rank')\
        \ for s in VARIANTS]:\n            order=sorted(subset,key=lambda x:(-int(x[src_col]),x['player']))\n            for\
        \ rank,r in enumerate(order,start=1):r[rank_col]=rank\n    shiftlist=sorted(rows,key=lambda r:(-max(abs(r[x+'_delta'])\
        \ for x in VARIANTS),r['player']))[:100]\n    for scen in VARIANTS:\n\n        for pos in ['QB','RB','WR','TE','DL','LB','DB','K']:\n\
        \            subset=[x for x in rows if x['position']==pos]\n            delta=[x[scen+'_delta'] for x in subset]\n\
        \            changed=[x for x in subset if x[scen+'_delta']]\n            metrics.append({'scenario':scen,'position':pos,'total_players':len(subset),'changed_players':len(changed),\n\
        \                            'total_fv_delta':sum(delta),'median_delta':statistics.median(delta),'min_delta':min(delta),'max_delta':max(delta),\n\
        \                            'max_abs_delta':max(map(abs,delta)),'approved15_changed':sum(x['approved15'] and x[scen+'_delta']!=0\
        \ for x in subset),\n                            'accepted18_changed':sum(x['accepted18'] and x[scen+'_delta']!=0\
        \ for x in subset)})\n    writecsv(out/'CAL26_V1R17_All_565_Age_and_Horizon_Comparison.csv',rows,list(rows[0]))\n\
        \    writecsv(out/'CAL26_V1R17_Position_Scenario_Impact.csv',metrics,list(metrics[0]))\n    writecsv(out/'CAL26_V1R17_QB_Owner_Feedback_Constraints.csv',samples,list(samples[0]))\n\
        \    writecsv(out/'CAL26_V1R17_100_Largest_Price_Shifts_With_Ranks.csv',shiftlist,list(rows[0]))\n    (out/'CAL26_V1R17_Horizon_Assumptions.json').write_text(json.dumps({'discount_per_season':DISCOUNT,'annual_retention_by_position':RETENTION,'reference_age_by_position':POSITION_PEAK_REFERENCE,'provenance':'HYPOTHETICAL_EXPLICIT_SCENARIO_NOT_HISTORICAL_FIT','scenario_horizons':[3,6,10]},sort_keys=True,indent=2)+'\\\
        n')\n    summary={scen:{'changed':sum(x[scen+'_delta']!=0 for x in rows),'total_delta':sum(x[scen+'_delta'] for x\
        \ in rows),\n                   'qbs_changed':sum(x['position']=='QB' and x[scen+'_delta']!=0 for x in rows),\n  \
        \                 'qbs_older_36_plus_changed':sum(x['position']=='QB' and x['age']>=36 and x[scen+'_delta']!=0 for\
        \ x in rows),\n                   'owner_low_bounds_strictly_exceeded':sum(x[scen+'_fv']>FEEDBACK[x['player']][1]\
        \ for x in samples if x['rating']=='Too Low'),\n                   'too_high_review_upper_bounds_avoided':sum(x[scen+'_fv']<FEEDBACK[x['player']][1]\
        \ for x in samples if x['rating']=='Too High')}\n             for scen in VARIANTS}\n    manifest={'status':'PASS_CAL26_V1R17_AGE_NEUTRAL_VS_CAREER_HORIZON_SHADOW','model_authorized':False,'production_mutations':0,\n\
        \              'live_players':len(rows),'live_qbs':64,'owner_approved_15_protected':True,'owner_accepted_18_protected':True,\n\
        \              'horizon_rates_source':'SCENARIO_ASSUMPTIONS_NOT_HISTORICALLY_ESTIMATED',\n              'lifetime_forecast_verified':False,\n\
        \              'seasonal_production_assumption':'Current effective production multiplier constant per active year',\n\
        \              'role_persistence_assumption':'Position-age annual retention; not player-specific',\n             \
        \ 'discount_rate_per_forward_season':DISCOUNT,'reference_peak_ages':POSITION_PEAK_REFERENCE,\n              'historical_evidence':'Age\
        \ Curve V2 LOBO Year+1/Year+2 score: no-age MAE 2.3507, deployed proxy MAE 2.2576, best empirical 1.9696. Not a dynasty\
        \ FV backtest.',\n              'variants':summary,'source_sha256':sha(src),'files':{},\n              'run_utc':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}\n\
        \    for fname in ('CAL26_V1R17_All_565_Age_and_Horizon_Comparison.csv','CAL26_V1R17_Position_Scenario_Impact.csv','CAL26_V1R17_QB_Owner_Feedback_Constraints.csv','CAL26_V1R17_100_Largest_Price_Shifts_With_Ranks.csv','CAL26_V1R17_Horizon_Assumptions.json'):\n\
        \        manifest['files'][fname]=sha(out/fname)\n    (out/'CAL26_V1R17_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\\
        n')\n    print(json.dumps({'status':manifest['status'],'variants':summary,'file_count':5},sort_keys=True))\n    return\
        \ manifest\nif __name__=='__main__':main()\nPY_CAL26_V1R17_ENGINE\npython3 -m py_compile \"$RUNNER_TEMP/CAL26_V1R17_engine.py\"\
        \n"
    - name: Produce complete 565-player career-horizon and no-age shadow
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/CAL26_V1R17_Research"
        python3 "$RUNNER_TEMP/CAL26_V1R17_engine.py" \
          --repo "$GITHUB_WORKSPACE" \
          --out "$RUNNER_TEMP/CAL26_V1R17_Research"
    - name: Independently validate all 565 players, 64 QBs, 33 controls and four model scenarios
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_INDEPENDENT'
        from pathlib import Path
        import csv,json,hashlib,sys,os,collections
        out=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R17_Research'
        manifest=json.loads((out/'CAL26_V1R17_Manifest.json').read_text())
        assert manifest['status']=='PASS_CAL26_V1R17_AGE_NEUTRAL_VS_CAREER_HORIZON_SHADOW'
        assert manifest['live_players']==565 and manifest['live_qbs']==64
        assert manifest['owner_approved_15_protected'] is True and manifest['owner_accepted_18_protected'] is True
        assert manifest['production_mutations']==0 and manifest['model_authorized'] is False
        assert manifest['horizon_rates_source']=='SCENARIO_ASSUMPTIONS_NOT_HISTORICALLY_ESTIMATED'
        for f,h in manifest['files'].items():
            assert hashlib.sha256((out/f).read_bytes()).hexdigest()==h,('CHECKSUM',f)
        with (out/'CAL26_V1R17_All_565_Age_and_Horizon_Comparison.csv').open(newline='') as f:
            rows=list(csv.DictReader(f))
        assert len(rows)==565 and len({x['player'] for x in rows})==565
        assert collections.Counter(x['position'] for x in rows)['QB']==64
        assert sum(x['approved15']=='True' for x in rows)==15
        assert sum(x['accepted18']=='True' for x in rows)==18
        for scen in ('NO_AGE','HORIZON_3','HORIZON_6','HORIZON_10'):
            assert all(x[scen+'_delta']=='0' for x in rows if x['approved15']=='True' or x['accepted18']=='True'),scen
            assert sum(int(x[scen+'_delta']) for x in rows)==manifest['variants'][scen]['total_delta'],scen
            assert sum(int(x[scen+'_delta'])!=0 for x in rows)==manifest['variants'][scen]['changed'],scen
            assert all(x[scen+'_fv']==x['current_fv'] for x in rows if x['position']=='K')
            for p in ('QB','RB','WR','TE','DL','LB','DB','K'):
                ranks=sorted(int(x[scen+'_position_rank']) for x in rows if x['position']==p)
                assert ranks==list(range(1,len(ranks)+1)),(scen,p)
        with (out/'CAL26_V1R17_QB_Owner_Feedback_Constraints.csv').open(newline='') as f:
            review=list(csv.DictReader(f))
        assert len(review)==14 and collections.Counter(x['rating'] for x in review)=={'Too Low':7,'Correct':2,'Too High':5}
        sys.path.insert(0,'scripts/validation')
        import snapshot_values as sv
        live=sv.compute_all_values(sv.load_from_html('index.html'))
        assert all(int(x['current_fv'])==live[x['player']]['value'] for x in rows)
        assert (out/'CAL26_V1R17_Horizon_Assumptions.json').is_file()
        print('PASS independent 565-player current-price parity, 64 QBs, 33 controls, 14 ratings, 4 scenarios, SHA256 and ranks')
        PY_INDEPENDENT
    - name: Negative price-tamper test and clean production checkout
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_NEGATIVE'
        import subprocess,os,sys,tempfile,pathlib
        root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        s=root.joinpath('index.html').read_text()
        assert s.count("'jaxson dart':5091") == 1
        bad=s.replace("'jaxson dart':5091","'jaxson dart':5092",1)
        with tempfile.TemporaryDirectory() as t:
            tamper=pathlib.Path(t)/'index.html';tamper.write_text(bad)
            cmd=[sys.executable,os.environ['RUNNER_TEMP']+'/CAL26_V1R17_engine.py','--repo',str(root),'--local-source',str(tamper),'--out',str(pathlib.Path(t)/'evidence')]
            p=subprocess.run(cmd,capture_output=True,text=True)
            assert p.returncode!=0,'TAMPERED_FV_WAS_ACCEPTED'
            assert 'PINNED_APPROVED_15_DRIFT' in p.stderr,'UNEXPECTED_TAMPER_FAILURE: '+p.stderr[-700:]
        print('PASS negative test: changed approved FV rejected before any modeling')
        PY_NEGATIVE
        test -z "$(git status --porcelain --untracked-files=all)"
        echo "PASS read-only: GitHub checkout clean and no production files changed"
    - name: Upload age-horizon experimental results without publishing prices
      uses: actions/upload-artifact@v4
      with:
        name: CAL26-V1R17-Full-565-Age-Neutral-And-Career-Horizon-READ-ONLY
        path: ${{ runner.temp }}/CAL26_V1R17_Research/
        if-no-files-found: error
        retention-days: 30
