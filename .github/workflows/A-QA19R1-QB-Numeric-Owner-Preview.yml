name: A-QA19 - Four QB Evidence-Calibrated Numeric Owner Preview (Read Only)
run-name: A-QA19 QB owner numeric pricing shadows NO RELEASE

'on':
  workflow_dispatch:
    inputs:
      qa18_run_id:
        description: Exact green QA18 FantasyPros and DLF crosscheck source
        required: true
        type: string
        default: '41206790775'

permissions:
  contents: read
  actions: read

concurrency:
  group: a-qa19-four-qb-owner-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA19_QA18_RUN: ${{ inputs.qa18_run_id }}
      QA19_QA18: /tmp/qa19-qa18
      QA19_QA16: /tmp/qa19-qa16
      QA19_OUT: /tmp/qa19-output
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout with no persistent write permissions
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify QA18 actual successful run and upstream identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$QA19_QA18_RUN" =~ ^[0-9]{7,15}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA19_QA18_RUN" > "$RUNNER_TEMP/qa19_source.json"
          python3 - <<'PY_RUN'
          import os,json,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'qa19_source.json').read_text())
          want={'status':'completed','conclusion':'success','event':'workflow_dispatch',
                'path':'.github/workflows/A-QA18R2-QB-Rank-Review.yml',
                'display_title':'A-QA18 four-QB FP dynasty confirmation NO RELEASE',
                'head_branch':'main'}
          for k,v in want.items():assert r.get(k)==v,(k,r.get(k),v)
          assert r['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY_RUN
      - name: Download exact QA18 verified source artifact
        uses: actions/download-artifact@v4
        with:
          name: A-QA18-Independent-QB-FantasyPros-Check
          run-id: ${{ inputs.qa18_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/qa19-qa18
      - name: Download pinned QA16 original numeric comparator review
        uses: actions/download-artifact@v4
        with:
          name: A-QA16-Paired-QB-Price-Review
          run-id: '41107911946'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/qa19-qa16
      - name: Verify source manifests and immutable pricing snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          import json,os,pathlib,re
          p=pathlib.Path(os.environ['QA19_QA18'])
          m=json.loads((p/'QA18_Manifest.json').read_text())
          assert m['status']=='QA18_FANTASYPROS_DYNASTY_QB_INDEPENDENT_CHECK_READ_ONLY'
          assert m['qa17_source_run']=='41110626141' and m['fp_source_status']=='PASS_DYNASTY_QB_SOURCE'
          assert m['four_qb_count']==4 and m['fp_matched_target_qbs']==4
          assert m['fp_source_qb_count']>=70
          assert m['fp_response_sha256'] and re.fullmatch('[a-f0-9]{64}',m['fp_response_sha256'])
          assert not m['fp_superflex_semantics_verified'] and not m['provider_data_vintage_verified']
          assert not m['owner_release_authorized'] and m['read_only']
          assert all(m[k]==0 for k in ('fv_changes','fv_plus_changes','mv_changes','repo_mutations','new_fv_recommended'))
          qa16=json.loads((pathlib.Path(os.environ['QA19_QA16'])/'QA16_Manifest.json').read_text())
          assert qa16['status']=='QA16_PAIRED_BACKTEST_AND_QB_OWNER_REVIEW_READ_ONLY'
          assert qa16['source_git_sha']==m['source_git_sha']
          assert qa16['paired_qb_count']==39 and not qa16['owner_release_authorized']
          assert re.fullmatch('[a-f0-9]{40}',m['source_git_sha'])
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'qa19_source_sha').write_text(m['source_git_sha'])
          PY_SOURCE
          git fetch --depth=1 origin "$(cat "$RUNNER_TEMP/qa19_source_sha")"
          git checkout --detach "$(cat "$RUNNER_TEMP/qa19_source_sha")"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/qa19_source_sha")"
      - name: Produce independent-order-informed and internally priced owner scenarios
        shell: bash
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$QA19_OUT"
          cat > "$RUNNER_TEMP/qa19_engine.py" <<'PY_ENGINE'
          #!/usr/bin/env python3
          """QA19 owner numerical shadows: FP rankings only order PEERS; no provider raw rankings exported.
          Internal FV anchors are not external cardinal prices and cannot authorize deployment.
          """
          import csv,datetime,hashlib,json,math,os,pathlib,re,statistics,urllib.parse,urllib.request,urllib.error
          SRC=pathlib.Path(os.environ['QA19_QA18']);SRC16=pathlib.Path(os.environ['QA19_QA16'])
          OUT=pathlib.Path(os.environ['QA19_OUT']);OUT.mkdir(parents=True,exist_ok=True)
          def halt(s):raise RuntimeError('QA19 SOURCE INTEGRITY FAILURE: '+s)
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def load(p):return json.loads(p.read_text())
          def norm(s):
              s=str(s or '').strip().lower().replace('’',"'")
              s=re.sub(r"[.\-']",'',s)
              s=re.sub(r'\b(jr|sr|ii|iii|iv)\b','',s)
              return ' '.join(s.split())
          def pct(seq,q):
              z=sorted(seq)
              if not z:return None
              v=(len(z)-1)*q;i=math.floor(v);j=math.ceil(v)
              return z[i]+(z[j]-z[i])*(v-i)
          def round_int(x):return int(round(x))
          def fp_tier(value,allvalues):
              if value is None:return 'NOT_RANKED_OR_MISSING'
              pr=100*(sum(x<value for x in allvalues)+.5*sum(x==value for x in allvalues))/len(allvalues)
              return 'TOP_QUARTILE' if pr<=25 else 'SECOND_QUARTILE' if pr<=50 else 'THIRD_QUARTILE' if pr<=75 else 'BOTTOM_QUARTILE'
          manifest=load(SRC/'QA18_Manifest.json')
          cases=list(csv.DictReader((SRC/'QA18_Four_QB_Independent_Rank_Check.csv').open(newline='')))
          prior=list(csv.DictReader((SRC16/'QA16_16_Case_Owner_Review.csv').open(newline='')))
          expected={'7083':'Tyler Huntley','5854':'Drew Lock','8162':'Sam Howell','1737':'Case Keenum'}
          if len(cases)!=4 or {c['sleeper_id'] for c in cases}!=set(expected):halt('QA18 four-QB cohort')
          p16={r['sleeper_id']:r for r in prior}
          for c in cases:
              sid=c['sleeper_id']
              if c['player']!=expected[sid] or sid not in p16:halt('Source stable identity mismatch')
              if int(c['current_FV_UNCHANGED'])!=int(p16[sid]['current_fv_UNCHANGED']):halt('Current FV baseline mismatch')
              if c['candidate_FV']!='' or c['FV_changed']!='NO':halt('Unexpected source pricing authorization')
          data=load(pathlib.Path('scripts/artifacts/generated/value_uncertainty.json'))
          if data.get('counts',{}).get('player_count')!=565:halt('Internal FV cohort drift')
          refs=[]
          for nm,p in data['players'].items():
              if p.get('pos')!='QB':continue
              age=p.get('age');fv=p.get('center_value')
              if type(age) not in (float,int) or type(fv) not in (float,int) or not (18<=age<=45 and 0<fv<20000):continue
              refs.append({'name':nm,'fv':int(fv),'age':age,'id':str(p.get('sleeper_id') or '')})
          if len(refs)!=64:halt('Original curated QB cohort not intact')
          key=os.environ.get('FANTASYPROS_API_KEY','').strip()
          source_status='HOLD_MISSING_FANTASYPROS_SECRET';fp={};response_hash=None
          if key:
              query=urllib.parse.urlencode({'position':'QB','type':'DYNASTY','scoring':'PPR'})
              url='https://api.fantasypros.com/public/v2/json/nfl/2026/consensus-rankings?'+query
              req=urllib.request.Request(url,headers={'x-api-key':key,'Accept':'application/json',
                         'User-Agent':'LOG-A-QA19-ReadOnly','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:raw=response.read(12_000_001)
                  if len(raw)>12_000_000:halt('FP document exceeds size budget')
                  response_hash=hashlib.sha256(raw).hexdigest();doc=json.loads(raw)
                  if response_hash!=manifest['fp_response_sha256']:
                      source_status='HOLD_FP_SOURCE_HASH_CHANGED_SINCE_QA18'
                  elif doc.get('ranking_type_name')!='dynasty' or not isinstance(doc.get('players'),list):
                      source_status='HOLD_FP_SCHEMA_OR_RANKING_TYPE'
                  else:
                      source_status='PASS_EXACT_QA18_RANKING_SNAPSHOT'
                      for item in doc['players']:
                          if not isinstance(item,dict):halt('Unrecognized FP player row')
                          if str(item.get('player_position_id') or item.get('position_id') or item.get('position') or '').upper()!='QB':continue
                          n=norm(item.get('player_name') or item.get('name'))
                          try:r=float(item.get('rank_ecr'))
                          except (TypeError,ValueError):continue
                          if not n or not math.isfinite(r) or r<=0:continue
                          if n in fp:halt('Duplicate normalized FP QB identity')
                          fp[n]=r
                      if len(fp)<70:halt('Unexpected FP coverage')
              except (OSError,urllib.error.URLError,ValueError,json.JSONDecodeError) as err:
                  source_status='HOLD_API_ERROR_'+type(err).__name__
          if not source_status.startswith('PASS_'):fp={}
          vals=list(fp.values())
          for p in refs:p['rank']=fp.get(norm(p['name']))
          ranked=[x for x in refs if x['rank'] is not None]
          def neighbors(rank,exclude):
              n=[p for p in ranked if p['id']!=exclude]
              n.sort(key=lambda p:(abs(p['rank']-rank),p['rank'],p['id']))
              return n[:10]
          # Same-cohort LOO is ONLY coherence with existing reference FV, not independent price accuracy.
          errors=[]
          if len(ranked)>=28:
              for ref in ranked:
                  n=neighbors(ref['rank'],ref['id'])
                  if len(n)>=8:
                      estimate=statistics.median(v['fv'] for v in n)
                      errors.append(abs(estimate-ref['fv'])/ref['fv']*100)
          loo_p75=round(pct(errors,.75),1) if errors else None
          details=[]
          for c in cases:
              sid=c['sleeper_id'];q=p16[sid]
              prior_lo=int(q['qa15_opportunity_lower_quartile_INTERNAL_ONLY'])
              prior_mid=int(q['qa15_opportunity_median_INTERNAL_ONLY'])
              prior_hi=int(q['qa15_opportunity_upper_quartile_INTERNAL_ONLY'])
              output={'sleeper_id':sid,'player':c['player'],'current_fv_UNCHANGED':int(c['current_FV_UNCHANGED']),
                'FP_ordinal_tier_from_QA18':c['FantasyPros_2026_dynasty_QB_quartile'],
                'DLF_ordinal_tier_from_QA18':c['DLF_relative_QB_quartile_FROM_QA17'],
                'QA15_internal_IQR_low':prior_lo,'QA15_internal_median':prior_mid,
                'QA15_internal_IQR_high':prior_hi,
                'external_rank_ordered_internal_peer_count':0,'external_rank_ordered_internal_peer_q25':None,
                'external_rank_ordered_internal_peer_median':None,'external_rank_ordered_internal_peer_q75':None,
                'ordinal_peer_max_rank_distance':None,'overlapping_internal_FV_range_low':None,
                'overlapping_internal_FV_range_high':None,'illustrative_owner_FV_center_NOT_APPROVED':None,
                'source_status':source_status,'decision_gate':'HOLD_NO_VERIFIED_RANKED_PEERS',
                'independent_cardinal_price_anchor':'NOT_ESTABLISHED','owner_approved':'NO',
                'production_FV_changed':'NO'}
              if fp:
                  rank=fp.get(norm(c['player']))
                  if rank is None:output['decision_gate']='HOLD_FP_TARGET_UNRANKED'
                  elif fp_tier(rank,vals)!=c['FantasyPros_2026_dynasty_QB_quartile']:
                      output['decision_gate']='HOLD_FP_QUARTILE_MISMATCH'
                  else:
                      peers=neighbors(rank,sid)
                      if len(peers)<8:output['decision_gate']='HOLD_TOO_FEW_RANKED_INTERNAL_PEERS'
                      else:
                          pvals=[p['fv'] for p in peers]
                          v25=round_int(pct(pvals,.25));v50=round_int(statistics.median(pvals));v75=round_int(pct(pvals,.75))
                          worst=round(max(abs(p['rank']-rank) for p in peers),2)
                          output.update({'external_rank_ordered_internal_peer_count':len(peers),
                             'external_rank_ordered_internal_peer_q25':v25,
                             'external_rank_ordered_internal_peer_median':v50,
                             'external_rank_ordered_internal_peer_q75':v75,
                             'ordinal_peer_max_rank_distance':worst})
                          low=max(prior_lo,v25);high=min(prior_hi,v75)
                          if q['qa16_review_gate']=='QB_NEIGHBOR_STABILITY_HOLD':
                              output['decision_gate']='HOLD_QA16_PRIOR_COMPARATOR_UNSTABLE'
                          elif loo_p75 is None or loo_p75>75:
                              output['decision_gate']='HOLD_RANK_PEER_BACKTEST_WEAK'
                          elif worst>32:
                              output['decision_gate']='HOLD_RANK_NEIGHBOR_TOO_DISTANT'
                          elif v75-v25>1.2*max(v50,1):
                              output['decision_gate']='HOLD_RANK_PEER_SPREAD_TOO_WIDE'
                          elif low>high:
                              output['decision_gate']='HOLD_COMPARATOR_RANGES_DO_NOT_OVERLAP'
                          else:
                              output['overlapping_internal_FV_range_low']=low
                              output['overlapping_internal_FV_range_high']=high
                              output['illustrative_owner_FV_center_NOT_APPROVED']=round_int((low+high)/2)
                              output['decision_gate']='NUMERIC_OWNER_PREVIEW_ONLY_NOT_DEPLOYABLE'
              details.append(output)
          details.sort(key=lambda x:-x['current_fv_UNCHANGED'])
          with (OUT/'QA19_Four_QB_Numeric_Owner_Scenarios.csv').open('w',newline='',encoding='utf8') as f:
              w=csv.DictWriter(f,fieldnames=list(details[0]));w.writeheader();w.writerows(details)
          (OUT/'QA19_Four_QB_Numeric_Owner_Scenarios.json').write_text(json.dumps(details,indent=2)+'\n')
          report=['# A-QA19 — Four QB Evidence-Bounded Numerical Owner Preview','',
            '**READ ONLY: no live price proposal or release.**','',
            f'- FP source: **{source_status}**. Requires exact QA18 response SHA; any changing response fails closed.',
            f'- Curated QB reference matches with FP: **{len(ranked)}/{len(refs)}**.',
            f'- External-rank-nearest-peers LOO p75 error against internal FV: **{loo_p75 if loo_p75 is not None else "N/A"}%**.',
            '- External FantasyPros rankings select neighbors by order. Their licensed numerical ranks are not saved or printed.',
            '- The comparable-player values are OUR existing internal FV, not independent DLF or FantasyPros prices.',
            '- A hypothetical center is the midpoint of the intersection of QA15 and ranked-peer middle-50% internal FV intervals, only when both pass conservative gates.',
            '- No new FV is estimated from a raw rank-to-price formula, and no age/role or projection blind boost is applied.',
            '', '| QB | Current FV | QA15 median | FP-order peer median | Overlap band | Owner shadow center | Gate |',
            '|---|---:|---:|---:|---|---:|---|']
          for r in details:
              fmt=lambda v:('—' if v is None else f'{v:,}')
              rng='—' if r['overlapping_internal_FV_range_low'] is None else f"{fmt(r['overlapping_internal_FV_range_low'])}–{fmt(r['overlapping_internal_FV_range_high'])}"
              report.append(f"| {r['player']} | {fmt(r['current_fv_UNCHANGED'])} | {fmt(r['QA15_internal_median'])} | {fmt(r['external_rank_ordered_internal_peer_median'])} | {rng} | {fmt(r['illustrative_owner_FV_center_NOT_APPROVED'])} | {r['decision_gate']} |")
          report+=['','## Interpretation and controls','',
              '- The result is an owner research preview, **not a production FV recommendation**.',
              '- Even when two internal ranges overlap, neither is an independently calibrated cardinal market price.',
              '- The live production role-provenance defect remains and needs separate mitigation before release.',
              '- Cases with weak backtests, source drift, wide peer spreads, missing ranking or non-overlap are held.',
              '- For numerical decisions, independently verify role, actual usage, provider vintage, opportunity horizon and owner approval.',
              '- No FV, FV+, MV, model formula, position weight, role or repository file was modified.', '']
          (OUT/'QA19_Report.md').write_text('\n'.join(report)+'\n')
          result={'status':'QA19_FOUR_QB_NUMERIC_OWNER_SHADOW_READ_ONLY',
              'qa18_verified_run':os.environ['QA19_QA18_RUN'],
              'qa16_source_run':'41107911946','source_git_sha':manifest['source_git_sha'],
              'qa18_manifest_sha256':sha(SRC/'QA18_Manifest.json'),
              'qa16_case_sha256':sha(SRC16/'QA16_16_Case_Owner_Review.csv'),
              'fp_source_status':source_status,'fp_response_same_as_qa18':response_hash==manifest['fp_response_sha256'],
              'curated_qbs':len(refs),'ranked_curated_qbs':len(ranked),'loo_sample_count':len(errors),
              'loo_p75_error_pct':loo_p75,'owner_shadow_preview_count':sum(x['illustrative_owner_FV_center_NOT_APPROVED'] is not None for x in details),
              'independent_cardinal_market_price_calibrated':False,'owner_release_authorized':False,
              'new_fv_recommended':0,'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,
              'repo_mutations':0,'provider_raw_rank_values_exported':0,'read_only':True,
              'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (OUT/'QA19_Manifest.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'status':result['status'],'fp_snapshot':source_status,
              'matched_qb_peers':len(ranked),'owner_preview_cases':result['owner_shadow_preview_count'],
              'production_changes':0}))
          PY_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/qa19_engine.py"
          python3 "$RUNNER_TEMP/qa19_engine.py"
      - name: Verify no mutation or deployment
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY_HOLD'
          import json,os,pathlib
          m=json.loads((pathlib.Path(os.environ['QA19_OUT'])/'QA19_Manifest.json').read_text())
          assert m['status']=='QA19_FOUR_QB_NUMERIC_OWNER_SHADOW_READ_ONLY'
          assert m['read_only'] and not m['owner_release_authorized']
          assert not m['independent_cardinal_market_price_calibrated']
          for k in ('new_fv_recommended','fv_changes','fv_plus_changes','mv_changes',
                    'repo_mutations','provider_raw_rank_values_exported'):
              assert m[k]==0,(k,m[k])
          PY_HOLD
      - name: Upload QA19 owner numerical review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-QA19-Four-QB-Numeric-Owner-Preview
          path: /tmp/qa19-output/
          retention-days: 30
          if-no-files-found: error
      - name: Mobile owner review summary
        if: always()
        shell: bash
        run: |
          if test -f "$QA19_OUT/QA19_Report.md"; then
            cat "$QA19_OUT/QA19_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'A-QA19 stopped before a complete numeric preview; production prices remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
