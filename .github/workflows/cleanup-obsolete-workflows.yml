name: Cleanup Obsolete Workflows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete workflows
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch \
            .github/workflows/add-free-agent-password-gate.yml \
            .github/workflows/add-ktc-minimum-value.yml \
            .github/workflows/apply-free-agent-ui.yml \
            .github/workflows/clarify-player-value-labels.yml \
            .github/workflows/compact-total-roster-strength.yml \
            .github/workflows/fix-player-value-card-layout.yml \
            .github/workflows/fix-trade-desk-ui21-add-controls.yml \
            .github/workflows/fix-trade-desk-ui21-launcher-visibility.yml \
            .github/workflows/move-total-roster-strength-top.yml \
            .github/workflows/promote-trade-desk-ui2-live.yml \
            .github/workflows/rename-log-dynasty-trade-calculator.yml \
            .github/workflows/simplify-trade-desk-ui2-preview.yml \
            .github/workflows/cleanup-obsolete-workflows.yml

          if git diff --cached --quiet; then
            echo "Nothing to remove."
            exit 0
          fi

          echo "Removing:"
          git diff --cached --name-status

          git commit -m "Remove obsolete one-time workflows"
          git push origin HEAD:main
