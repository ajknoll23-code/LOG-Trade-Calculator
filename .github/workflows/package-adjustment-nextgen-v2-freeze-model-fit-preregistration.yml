name: Package Adjustment NextGen V2 Freeze Model Fit Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-model-fit-preregistration
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frozen-method dependencies
        run: python3 -m pip install requests numpy scipy

      - name: Guard exact frozen evidence and maturity plan
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          test -z "$(git status --porcelain=v1)"

          # Frozen challenge evidence.
          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/challenge_catalog_design.md")" = "2ff9ab79043d9bf91f825575fe404c0ccc0ea11e"
          test "$(git hash-object "$D/generate_package_vote_challenges_nextgen_v2.py")" = "8d4746d00b57187a74b8add75ff7b72fc5a9342d"
          test "$(git hash-object "$D/package_adjustment_nextgen_v2_research_spec.md")" = "6dca31266a0e22a750f0a15f6aaf87a6648fb77a"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"

          # Committed maturity preregistration.
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/evidence_maturity_plan.md")" = "c5450716854e26049efd89102fc9ac5e01b06aa7"
          test "$(git hash-object "$D/evidence_maturity_plan_manifest.json")" = "59b198decae348c9821e67eb42911adad0e87e77"

          test "$(sha256sum "$D/evidence_maturity_plan.json" | awk '{print $1}')" = "52a032e85f9b7989fd48fb2ae927b8af79e3a1a3cd221a3da08d0ac9381c519e"
          test "$(sha256sum "$D/evidence_maturity_plan.md" | awk '{print $1}')" = "6ffc16fa04fd77c34bb02c9698fff8267c513be5e2ea2c0080817b4f74555a3e"
          test "$(sha256sum "$D/evidence_maturity_plan_manifest.json" | awk '{print $1}')" = "c63467e38d9d21b2ac0b2d7b99a2fde845840a451f1f0d7e5727e13aaefb971c"

          # Frozen source snapshots used to derive deterministic spline knots.
          test "$(sha256sum scripts/artifacts/generated/value_uncertainty.json | awk '{print $1}')" = "a12a0fed97a95f8bbd3b33d56d1f8151de228a344af98982e6fb01b9a610012d"
          test "$(sha256sum data/league_rosters.json | awk '{print $1}')" = "0d49ee988dc07afa7b0e34daa7d5e7a62cc9e263dca637dc760e27994bc9c716"

          test ! -e "$D/fit_package_adjustment_nextgen_v2.py"
          test ! -e "$D/model_fit_preregistration.json"
          test ! -e "$D/model_fit_preregistration.md"
          test ! -e "$D/model_fit_preregistration_manifest.json"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PASS: exact frozen evidence + maturity-plan boundary confirmed."

      - name: Verify production before model-fit preregistration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Write executable preregistered fitter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          payload = """"""
          path = Path("research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py")
          path.write_bytes(base64.b64decode(payload))
          path.chmod(0o755)
          print("Wrote:", path)
          PY

          python3 -m py_compile             research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py

      - name: Freeze exact fit configuration and methodology
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import math
          import platform
          import textwrap
          from pathlib import Path

          import numpy as np
          import scipy

          root = Path.cwd()
          d = root / "research/package-adjustment-nextgen-v2"
          fitter = d / "fit_package_adjustment_nextgen_v2.py"
          config_path = d / "model_fit_preregistration.json"
          methodology_path = d / "model_fit_preregistration.md"
          manifest_path = d / "model_fit_preregistration_manifest.json"
          catalog_path = d / "package_vote_challenges_nextgen_v2.json"
          maturity_path = d / "evidence_maturity_plan.json"
          generator_path = d / "generate_package_vote_challenges_nextgen_v2.py"

          def read(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          # Reuse the already-frozen generator's exact universe-resolution and
          # nearest-rank rules. No generator output is written.
          spec = importlib.util.spec_from_file_location(
              "pkgnv2_frozen_generator",
              generator_path,
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          values = read(root / "scripts/artifacts/generated/value_uncertainty.json")
          rosters = read(root / "data/league_rosters.json")
          players, unresolved, _pos_counts = mod.build_player_universe(
              values,
              rosters,
              min_rostered_players=350,
          )
          assert len(players) == 493
          fv = [float(p["fv"]) for p in players]

          q25 = float(mod.nearest_rank(fv, 0.25))
          q50 = float(mod.nearest_rank(fv, 0.50))
          q75 = float(mod.nearest_rank(fv, 0.75))
          q95 = float(mod.nearest_rank(fv, 0.95))
          assert q95 == 5401.0
          assert 0 < q25 < q50 < q75 < q95

          catalog = read(catalog_path)
          challenges = catalog["challenges"]
          assert len(challenges) == 129
          assert all(
              len(c["side_a"]["assets"]) >= 2 and len(c["side_b"]["assets"]) >= 2
              for c in challenges
          )

          max_raw_side = max(
              float(c[side]["raw_fv"])
              for c in challenges
              for side in ("side_a", "side_b")
          )
          domain_max = math.ceil((max_raw_side / q95) * 1_000_000) / 1_000_000
          assert domain_max > 1.0

          knots = [
              0.0,
              q25 / q95,
              q50 / q95,
              q75 / q95,
              1.0,
              domain_max,
          ]
          assert all(b > a for a, b in zip(knots, knots[1:]))

          maturity = read(maturity_path)
          assert maturity["status"] == "preregistered_before_nextgen_voting"
          assert maturity["voting_activated"] is False

          # Exact live validator proves V1.6's fail-closed multi-v-multi
          # behavior; every frozen NextGen challenge is multi-piece on both sides.
          live_validator = root / "scripts/validation/check_package_adjustment_live.py"
          live_text = live_validator.read_text(encoding="utf-8")
          assert "check(r.status==='unsupported','multi-v-multi')" in live_text

          config = {
              "schema_version": 1,
              "status": "frozen_model_fit_preregistration",
              "frozen": True,
              "research_only": True,
              "voting_activated": False,
              "production_change_authorized": False,
              "automatic_production_change_allowed": False,
              "anchors": {
                  "production_revision": "v1.6-v5-size2-composition-overlay",
                  "production_exact_live_formula_sha256": "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7",
                  "canonical_challenge_payload_sha256": "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab",
                  "frozen_catalog_sha256": "953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5",
                  "maturity_plan_sha256": "52a032e85f9b7989fd48fb2ae927b8af79e3a1a3cd221a3da08d0ac9381c519e",
                  "maturity_plan_manifest_sha256": "c63467e38d9d21b2ac0b2d7b99a2fde845840a451f1f0d7e5727e13aaefb971c",
                  "player_fv_sha256": "a12a0fed97a95f8bbd3b33d56d1f8151de228a344af98982e6fb01b9a610012d",
                  "league_rosters_sha256": "0d49ee988dc07afa7b0e34daa7d5e7a62cc9e263dca637dc760e27994bc9c716",
              },
              "environment": {
                  "python_version_at_freeze": platform.python_version(),
                  "python_major_minor": f"{__import__('sys').version_info.major}.{__import__('sys').version_info.minor}",
                  "numpy_version": np.__version__,
                  "scipy_version": scipy.__version__,
                  "numeric_library_versions_must_match_for_replay": True,
              },
              "source_provenance": {
                  "frozen_generator_sha256": sha(generator_path),
                  "v5_fit_diagnostics_sha256": sha(root / "scripts/market/package_vote_v5_fit_diagnostics.py"),
                  "v5_fit_methodology_sha256": sha(root / "research/package-adjustment-v5/fit_diagnostic_methodology.md"),
                  "controlled_live_validator_sha256": sha(live_validator),
                  "fitter_sha256": sha(fitter),
              },
              "normalization": {
                  "v_ref": q95,
                  "eligible_player_count": len(players),
                  "eligible_roster_entries_unresolved_at_catalog_generation": len(unresolved),
                  "nearest_rank_fv_quantiles": {
                      "q25": q25,
                      "q50": q50,
                      "q75": q75,
                      "q95": q95,
                  },
              },
              "ballot_input_contract": {
                  "schema_version": 1,
                  "required_top_level_fields": [
                      "schema_version",
                      "released_at_utc",
                      "catalog_payload_sha256",
                      "maturity_plan_sha256",
                      "ballots",
                  ],
                  "required_ballot_fields": [
                      "timestamp",
                      "voter_id",
                      "challenge_id",
                      "choice_side",
                      "displayed_left_side",
                  ],
                  "canonical_side_values": ["A", "B"],
                  "release_filter": "timestamp_strictly_after_released_at_utc",
                  "invalid_or_unknown_rows": "exclude_and_report",
              },
              "voter_protections": {
                  "daily_valid_nextgen_vote_cap": 20,
                  "daily_cap_order": "timestamp_then_voter_then_challenge_then_choice_then_display_side",
                  "primary_evidence_effective_lifetime_cap": 20.0,
                  "ballot_weight": "min(1, 20 / valid_post_daily_cap_ballot_count_for_voter)",
              },
              "maturity_gate": {
                  "minimum_valid_effective_votes": 800.0,
                  "minimum_distinct_voters": 40,
                  "minimum_valid_effective_votes_per_cell": 15.0,
                  "minimum_distinct_voters_per_cell": 10,
                  "required_cell_count": 24,
                  "all_conditions_required": True,
              },
              "stopping": {
                  "first_checkpoint_valid_effective_votes": 800,
                  "coverage_only_increment": 100,
                  "hard_collection_cap_valid_effective_votes": 1200.0,
                  "fitter_behavior_if_hard_cap_is_exceeded": "refuse_fit",
                  "effect_direction_may_change_stopping": False,
                  "significance_may_change_stopping": False,
              },
              "choice_model": {
                  "probability": "logistic(beta * (ScoreA - ScoreB) / V_REF + delta_left * I(A_displayed_left))",
                  "beta_constraint": "strictly_positive_via_log_beta",
                  "generic_intercept": False,
                  "left_indicator": "1_if_canonical_A_displayed_left_else_0",
                  "probability_clip_for_reporting_only": 1e-12,
                  "fit_objective": "equal_cell_macro_weighted_negative_log_likelihood",
              },
              "models": {
                  "M0": {
                      "name": "raw_fv_control",
                      "score": "sum(asset_fv)",
                      "fit_parameters": ["log_beta", "delta_left"],
                  },
                  "M1": {
                      "name": "frozen_production_v1_6_benchmark",
                      "current_frozen_catalog_behavior": "exactly_M0",
                      "reason": "all_129_challenges_are_multi_piece_vs_multi_piece_and_V1_6_fails_closed_for_multi_v_multi",
                      "invented_support_allowed": False,
                  },
                  "M2a": {
                      "name": "homogeneous_power_equivalent",
                      "score": "(sum(FV_i ** p)) ** (1/p)",
                      "p_bounds": [1.0, 3.0],
                      "p_lower_boundary_allowed": True,
                      "p_upper_boundary_is_unresolved": True,
                  },
                  "M2b": {
                      "name": "normalized_convex_monotone_piecewise_linear_spline_equivalent",
                      "degree": 1,
                      "knots_rule": "0,q25/q95,q50/q95,q75/q95,1,max_frozen_raw_side_total/q95_rounded_up_1e-6",
                      "knots_normalized": knots,
                      "inverse_domain_max_normalized": domain_max,
                      "max_frozen_raw_side_total": max_raw_side,
                      "raw_segment_slope_rule": "s0=1; s_j=s_(j-1)+d_j",
                      "slope_increment_count": 4,
                      "slope_increment_bounds": [0.0, 2.0],
                      "lower_increment_boundary_allowed": True,
                      "upper_increment_boundary_is_unresolved": True,
                      "normalization": "divide_all_raw_spline_values_and_slopes_by_g_raw(1)_so_g(1)=1",
                      "properties": [
                          "continuous",
                          "strictly_increasing",
                          "convex",
                          "g(0)=0",
                          "g(1)=1",
                          "permutation_invariant",
                          "singleton_identity",
                          "no_inverse_extrapolation",
                      ],
                      "regularization": "lambda * mean(square(diff(normalized_segment_slopes)))",
                      "regularization_lambda_grid": [0.0, 0.001, 0.01, 0.1, 1.0],
                  },
                  "M3": {
                      "status": "inactive",
                      "reason": "production_draft_pick_fv_source_not_verified",
                  },
                  "M4": {
                      "status": "not_eligible_first_wave",
                      "reason": "roster_friction_challenger_requires_separate_future_preregistration",
                  },
                  "M5": {
                      "status": "not_eligible_first_wave",
                      "reason": "order_statistic_challenger_requires_separate_future_preregistration",
                  },
                  "M6": {
                      "status": "not_eligible_first_wave",
                      "reason": "explicit_concentration_challenger_requires_separate_future_preregistration",
                  },
              },
              "optimizer": {
                  "method": "scipy.optimize.minimize_L_BFGS_B",
                  "log_beta_bounds": [math.log(0.001), math.log(50.0)],
                  "delta_left_bounds": [-2.5, 2.5],
                  "boundary_tolerance": 1e-5,
                  "lower_beta_boundary_allowed": True,
                  "upper_beta_boundary_is_unresolved": True,
                  "delta_boundary_is_unresolved": True,
                  "scipy_options": {
                      "maxiter": 2000,
                      "maxls": 50,
                      "ftol": 1e-12,
                      "gtol": 1e-8,
                  },
                  "multistarts": {
                      "M0": [
                          [math.log(0.1), 0.0],
                          [math.log(1.0), 0.0],
                          [math.log(10.0), 0.0],
                      ],
                      "M2a": [
                          [1.05, math.log(1.0), 0.0],
                          [1.20, math.log(5.0), 0.0],
                          [1.50, math.log(10.0), 0.0],
                          [2.00, math.log(5.0), 0.0],
                          [2.50, math.log(2.0), 0.0],
                      ],
                      "M2b": [
                          [0.0, 0.0, 0.0, 0.0, math.log(1.0), 0.0],
                          [0.1, 0.1, 0.1, 0.1, math.log(5.0), 0.0],
                          [0.3, 0.3, 0.3, 0.3, math.log(5.0), 0.0],
                          [0.0, 0.2, 0.4, 0.6, math.log(5.0), 0.0],
                      ],
                  },
                  "bootstrap_multistarts": "original_sample_optimum_plus_first_canonical_start",
              },
              "cross_validation": {
                  "applies_to": "M2b_regularization_only",
                  "split_unit": "voter",
                  "fold_count": 5,
                  "fold_assignment": "sort_unique_voters_by_sha256(fixed_salt+voter_id)_then_round_robin",
                  "fold_hash_salt": "pkgnv2-m2b-regularization-v1|",
                  "fit_data": "train_split_only",
                  "structural_holdouts_visible_to_cv": False,
                  "validation_metric": "equal_macro_mean_log_loss_across_validation_cells_present_in_fold",
                  "original_voter_weights_frozen_across_folds": True,
                  "prefer_smoother_within_log_loss": 0.001,
                  "tie_rule": "choose_largest_lambda_with_mean_validation_loss_within_0.001_of_minimum",
              },
              "holdout": {
                  "fit_eligible_split": "train",
                  "structural_scale_holdout_used_for_fitting_or_tuning": False,
                  "structural_topology_holdout_used_for_fitting_or_tuning": False,
                  "primary_model_selection_metric": "equal_cell_macro_log_loss_across_all_11_structural_holdout_cells",
                  "secondary_required_non_regression_metrics": [
                      "equal_cell_macro_log_loss_5_scale_holdout_cells",
                      "equal_cell_macro_log_loss_6_topology_holdout_cells",
                  ],
                  "prospective_time_holdout_required_after_candidate_freeze": True,
              },
              "bootstrap": {
                  "method": "nonparametric_voter_cluster_bootstrap",
                  "valid_draws": 500,
                  "max_attempts": 2500,
                  "seed": 20260911,
                  "resampling_unit": "voter",
                  "original_capped_voter_weights_frozen_before_resampling": True,
                  "cluster_multiplicity_scales_frozen_original_ballot_weight": True,
                  "lifetime_cap_reapplied_inside_draw": False,
                  "M2b_lambda_reselected_inside_draw": False,
                  "M2b_lambda_rule": "use_original_sample_train_only_cross_validated_lambda",
                  "bootstrap_optimizer_starts": "original_sample_optimum_plus_canonical_neutral_start",
                  "draw_invalid_if_any_required_train_or_structural_holdout_cell_missing": True,
                  "draw_invalid_if_optimizer_or_disallowed_boundary_unresolved": True,
                  "interval": "90_percent_percentile_5th_to_95th",
              },
              "model_selection": {
                  "simplicity_order": ["M0", "M2a", "M2b"],
                  "M1_reporting_only_due_exact_M0_identity_on_frozen_catalog": True,
                  "minimum_absolute_combined_holdout_log_loss_improvement": 0.005,
                  "maximum_absolute_regression_per_structural_holdout_split": 0.005,
                  "minimum_bootstrap_favorable_fraction": 0.80,
                  "progressive_rule": [
                      "M2a_may_replace_M0_only_if_all_thresholds_pass",
                      "M2b_is_then_compared_to_current_incumbent_using_same_thresholds",
                      "otherwise_keep_simpler_incumbent",
                  ],
                  "bootstrap_favorable_definition": "challenger_combined_structural_holdout_log_loss_lower_than_incumbent",
                  "if_bootstrap_or_optimizer_unresolved": "no_research_candidate_selected",
                  "automatic_production_promotion": False,
              },
              "future_evidence": {
                  "structural_holdouts_become_spent_for_first_wave_model_selection_after_results_are_viewed": True,
                  "new_M3_to_M6_challenger_requires_separate_preregistration_and_fresh_or_prospective_evidence": True,
                  "prospective_time_holdout_required_before_any_production_candidate": True,
              },
          }

          config_path.write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          methodology = """
          # Package Adjustment NextGen V2 — Frozen Model-Fit Preregistration

          **Status: FROZEN BEFORE NEXTGEN VOTING. RESEARCH ONLY. VOTING IS NOT ACTIVATED. PRODUCTION V1.6 IS UNCHANGED.**

          ## Evidence boundary

          The exact 129-row challenge catalog and the evidence-maturity plan are already frozen.
          This document freezes the executable fitting and selection method before any fit-eligible
          NextGen vote is observed.

          The executable specification is `fit_package_adjustment_nextgen_v2.py`. The JSON
          preregistration records the exact numerical-library versions, fixed FV-derived knots,
          optimizer settings, cross-validation rule, bootstrap rule, and model-selection thresholds.

          ## Models eligible in the first wave

          M0 is raw summed FV. M1 is the exact frozen production V1.6 benchmark. Because every
          frozen NextGen challenge is multi-piece versus multi-piece and controlled-live V1.6
          deliberately fails closed for multi-v-multi, M1 is exactly identical to M0 on this
          catalog. No V1.6 behavior is invented outside production support.

          M2a is the homogeneous power equivalent:

          `E_p(S) = (sum FV_i^p)^(1/p)`, with `1 <= p <= 3`.

          M2b is a continuous degree-1 monotone-convex spline over normalized FV. Its knots are
          frozen numerically from the frozen rostered-player FV distribution at 0, Q25, Q50,
          Q75, V_REF, and the maximum frozen side-total domain. Segment slopes start at 1 and
          can only increase. The whole spline is normalized so `g(1)=1`.

          M2b therefore preserves singleton identity, is strictly increasing and
          permutation-invariant, rewards concentration without a hard stud/filler threshold,
          and supports an exact inverse without silent extrapolation. Any inverse-domain failure
          is unresolved/fail-closed.

          M3 is inactive because the exact production draft-pick FV source is not verified.
          M4-M6 are not eligible for first-wave selection. Once structural holdout results have
          been viewed, those challengers require a separate preregistration and fresh or
          prospective evidence.

          ## Choice likelihood

          For canonical Side A:

          `P(A) = logistic(beta * (Score(A)-Score(B))/V_REF + delta_left * I(A displayed left))`

          `beta > 0`. There is no generic intercept. The primary fitting loss is voter-capped
          negative log likelihood averaged equally across experimental cells, preventing random
          vote-count imbalance from making one cell dominate.

          ## Optimization

          All fits use deterministic SciPy L-BFGS-B with the exact bounds, multistarts and
          convergence tolerances stored in the JSON preregistration. A parameter hitting a
          preregistered disallowed upper/bias boundary makes that fit unresolved rather than
          triggering a wider post-hoc search.

          ## M2b regularization

          The spline roughness penalty is the mean squared adjacent change in normalized segment
          slopes. Lambda is chosen from the frozen grid using five-fold voter-cluster
          cross-validation on **training cells only**. Voters are assigned to folds by a
          deterministic salted SHA-256 ordering. Structural holdouts are never used to choose
          knots, lambda, or any hyperparameter.

          If multiple lambdas are within 0.001 log loss of the best training-CV value, choose the
          largest lambda (the smoother model).

          ## Structural holdouts and selection

          Primary selection uses equal-cell macro log loss across all 11 frozen structural
          holdout cells. Scale and topology holdout losses are also required separately.

          Starting from M0, a challenger must satisfy all of the following:

          - improve combined structural-holdout log loss by at least 0.005;
          - regress by no more than 0.005 on either the scale or topology holdout split;
          - be favored in at least 80% of valid voter-cluster bootstrap draws; and
          - pass optimizer, support, and hard mathematical invariants.

          M2a is tested first. M2b is then compared to the current incumbent. If a threshold is
          not met, retain the simpler incumbent. Incomplete bootstrap/optimizer evidence is
          unresolved, not permission to relax a threshold.

          ## Bootstrap

          Use 500 valid nonparametric voter-cluster bootstrap draws with the frozen seed.
          Each voter's original capped ballot weight is computed once from the original sample
          before resampling. Bootstrap multiplicity scales the entire voter cluster. The lifetime
          cap is **not** recomputed inside a draw, inheriting the corrected V5 uncertainty method.

          M2b's lambda is fixed to the original-sample training-CV choice inside bootstrap draws.
          Draws missing any required training or structural-holdout cell, or with unresolved
          optimization, are discarded and resampled up to the preregistered attempt cap.

          ## Production and prospective boundary

          This procedure may select a **research candidate only**. It cannot alter production.
          A later prospective-time holdout remains mandatory after candidate freeze. Any
          production candidate still requires separate shadow/prospective evidence and explicit
          human approval.
          """
          methodology_path.write_text(
              textwrap.dedent(methodology).strip() + "\n",
              encoding="utf-8",
          )

          manifest = {
              "schema_version": 1,
              "status": "frozen_model_fit_preregistration_manifest",
              "frozen": True,
              "research_only": True,
              "voting_activated": False,
              "production_change_authorized": False,
              "artifacts": {
                  "fitter": {
                      "path": fitter.relative_to(root).as_posix(),
                      "sha256": sha(fitter),
                  },
                  "config": {
                      "path": config_path.relative_to(root).as_posix(),
                      "sha256": sha(config_path),
                  },
                  "methodology": {
                      "path": methodology_path.relative_to(root).as_posix(),
                      "sha256": sha(methodology_path),
                  },
              },
              "anchors": {
                  "catalog_payload_sha256": config["anchors"]["canonical_challenge_payload_sha256"],
                  "catalog_sha256": config["anchors"]["frozen_catalog_sha256"],
                  "maturity_plan_sha256": config["anchors"]["maturity_plan_sha256"],
                  "production_formula_sha256": config["anchors"]["production_exact_live_formula_sha256"],
              },
              "next_required_step": "separate_human_reviewed_nextgen_voting_activation",
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("Frozen numeric knots:", knots)
          print("Python:", config["environment"]["python_version_at_freeze"])
          print("NumPy:", config["environment"]["numpy_version"])
          print("SciPy:", config["environment"]["scipy_version"])
          print("Fitter SHA-256:", sha(fitter))
          print("Config SHA-256:", sha(config_path))
          print("Methodology SHA-256:", sha(methodology_path))
          print("Manifest SHA-256:", sha(manifest_path))
          PY

      - name: Run executable preregistration self-test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3             research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py             --selftest

      - name: Validate preregistration semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          cfg = json.loads((d / "model_fit_preregistration.json").read_text())
          manifest = json.loads((d / "model_fit_preregistration_manifest.json").read_text())

          assert cfg["status"] == "frozen_model_fit_preregistration"
          assert cfg["frozen"] is True
          assert cfg["voting_activated"] is False
          assert cfg["production_change_authorized"] is False

          assert cfg["models"]["M1"]["current_frozen_catalog_behavior"] == "exactly_M0"
          assert cfg["models"]["M3"]["status"] == "inactive"
          for model in ("M4", "M5", "M6"):
              assert cfg["models"][model]["status"] == "not_eligible_first_wave"

          assert cfg["normalization"]["v_ref"] == 5401.0
          assert cfg["normalization"]["eligible_player_count"] == 493
          knots = cfg["models"]["M2b"]["knots_normalized"]
          assert len(knots) == 6
          assert knots[0] == 0.0
          assert knots[-2] == 1.0
          assert all(b > a for a, b in zip(knots, knots[1:]))

          assert cfg["maturity_gate"] == {
              "all_conditions_required": True,
              "minimum_distinct_voters": 40,
              "minimum_distinct_voters_per_cell": 10,
              "minimum_valid_effective_votes": 800.0,
              "minimum_valid_effective_votes_per_cell": 15.0,
              "required_cell_count": 24,
          }
          assert cfg["voter_protections"]["daily_valid_nextgen_vote_cap"] == 20
          assert cfg["voter_protections"]["primary_evidence_effective_lifetime_cap"] == 20.0

          assert cfg["bootstrap"]["valid_draws"] == 500
          assert cfg["bootstrap"]["resampling_unit"] == "voter"
          assert cfg["bootstrap"]["original_capped_voter_weights_frozen_before_resampling"] is True
          assert cfg["bootstrap"]["lifetime_cap_reapplied_inside_draw"] is False

          ms = cfg["model_selection"]
          assert ms["minimum_absolute_combined_holdout_log_loss_improvement"] == 0.005
          assert ms["maximum_absolute_regression_per_structural_holdout_split"] == 0.005
          assert ms["minimum_bootstrap_favorable_fraction"] == 0.80
          assert ms["automatic_production_promotion"] is False

          assert manifest["status"] == "frozen_model_fit_preregistration_manifest"
          assert manifest["voting_activated"] is False
          assert manifest["production_change_authorized"] is False

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for name, filename in {
              "fitter": "fit_package_adjustment_nextgen_v2.py",
              "config": "model_fit_preregistration.json",
              "methodology": "model_fit_preregistration.md",
          }.items():
              assert manifest["artifacts"][name]["sha256"] == sha(d / filename)

          print("PASS: exact model-fit preregistration semantics validated.")
          PY

