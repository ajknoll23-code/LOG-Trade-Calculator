name: QF11 V19 - Sleeper Identity Linkage and KTC Pilot Design (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V18_ROOT: .
  QF11_V18_INPUT: /tmp/qf11-v18-input
  QF11_V18_OUTPUT: /tmp/qf11-v18-output
  QF11_V19_ROOT: .
  QF11_V19_INPUT: /tmp/qf11-v19-input/v18
  QF11_V19_OUTPUT: /tmp/qf11-v19-output
jobs:
  research:
    name: Compare seven held players to independent Sleeper snapshot and draft non-voting comprehension design
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin frozen valuation model crosswalk and market source (mutable Sleeper cache observed only)
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_WRONG_COMMIT; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # data/players_cache.json is updated independently by scheduled Sleeper refresh.

        # V18 does NOT consume that mutable cache for identity adjudication; record its

        # checked-out blob SHA for reproducibility but never interpret drift as clearance.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_ABSENT; exit 1; }

        printf ''QF11_V18_DYNAMIC_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V18_FROZEN_SOURCE_PINS_GREEN

        '
    - name: Download original V14 Green exact global options
      uses: actions/download-artifact@v4
      with:
        name: QF11-v14-RESEARCH-ONLY-conditional-global-options
        run-id: 38310177563
        github-token: ${{ github.token }}
        path: /tmp/qf11-v18-input/v14
    - name: Download original V16 Green seven identity evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v16-RESEARCH-ONLY-owner-identity-and-TE-choice
        run-id: 38313026848
        github-token: ${{ github.token }}
        path: /tmp/qf11-v18-input/v16
    - name: Download V17 owner-selected tentative trio evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v17-RESEARCH-ONLY-owner-tentative-TE-selection
        run-id: 38315206531
        github-token: ${{ github.token }}
        path: /tmp/qf11-v18-input/v17
    - name: Download exact V18 Green identity and realism source
      uses: actions/download-artifact@v4
      with:
        name: QF11-v18-RESEARCH-ONLY-identity-evidence-and-ballot-realism
        run-id: 38317692706
        github-token: ${{ github.token }}
        path: /tmp/qf11-v19-input/v18
    - name: Verify pinned archive and exact model positions and write seven-ID and realism decision packet
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/qf11-v18-owner-gates.py <<'PY_V18_MAIN'\n#!/usr/bin/env python3\n\"\"\"QF11 V18\
        \ evidence-only seven-identity and KTC realism owner gate.\nNothing in this program approves release, changes sources,\
        \ or creates voter links.\n\"\"\"\nimport collections\nimport hashlib\nimport json\nimport os\nimport re\nimport sys\n\
        from pathlib import Path\n\nFIXTURE = '--fixture' in sys.argv\nHERE = Path(os.environ.get('QF11_V18_INPUT', '/tmp/qf11-v18-input'))\n\
        OUT = Path(os.environ.get('QF11_V18_OUTPUT', '/tmp/qf11-v18-output'))\nROOT = Path(os.environ.get('QF11_V18_ROOT',\
        \ '.'))\nOUT.mkdir(parents=True, exist_ok=True)\n\nPINS = {\n    'v17_selection': ('v17/RESEARCH_ONLY_v17_tentative_owner_selection.json',\
        \ '046a752fd319dd942af1593631aaddd998c5f9f242a4536adfc3237e4ba69465'),\n    'v16_seven': ('v16/RESEARCH_ONLY_v16_seven_identity_review.json',\
        \ '9e39c89b670b39e3283f38f469cdceed86b96e78980edac47e177a894ea2aa63'),\n    'v16_summary': ('v16/RESEARCH_ONLY_v16_owner_gate_summary.json',\
        \ '18deae02052106440c9e4f8475693379ce77c281120d00189e8f5cd7ace8d09d'),\n    'v14_choice': ('v14/RESEARCH_ONLY_v14_owner_choice_matrix.json',\
        \ '903cac50818e9e9b8255b4d9b00de014b01a772dfe654ea431de704d732dec0f'),\n}\narchive = {}\nfor key, (relative, expected)\
        \ in PINS.items():\n    p = HERE / relative\n    assert p.is_file(), 'STOP_MISSING_ARCHIVED_EVIDENCE_' + key\n   \
        \ actual = hashlib.sha256(p.read_bytes()).hexdigest()\n    assert actual == expected, 'STOP_ARCHIVE_DRIFT_' + key\n\
        \    archive[key] = json.loads(p.read_text())\n\nv17 = archive['v17_selection']\nv16 = archive['v16_seven']\nv16sum\
        \ = archive['v16_summary']\nv14 = archive['v14_choice']\nTRIO = ['brock bowers', 'tyler warren', 'treveyon henderson']\n\
        assert v17['selected_player_keys'] == TRIO\nassert v17['status'] == 'OWNER_TENTATIVE_RESEARCH_CANDIDATE_RECORDED_NOT_VOTE_APPROVAL'\n\
        assert v17['owner_tentative_research_selection_approved'] is True\nassert v17['fv_ratio_descriptive'] == 1.182106\n\
        assert v17['with_research_slot11_conditional_slots'] == 26\nassert v17['identity_holds_cleared'] == 0\nassert v17['unresolved_original_slots']\
        \ == [5, 21]\nfor key in ('ballot_activated', 'voting_activated', 'production_change_authorized',\n            'owner_identity_clearance_approved',\
        \ 'owner_voter_issuance_approved',\n            'owner_market_value_promotion_approved', 'independent_voter_assignment_completed',\n\
        \            'preregistered_stability_and_recruitment_approved'):\n    assert v17[key] is False, 'STOP_PREVIOUS_GATE_NOT_FROZEN_'\
        \ + key\nassert v16sum['seven_identity_holds'] == 7 and v16sum['distinct_te_pairs'] == 3\nassert v16sum['identity_auto_cleared']\
        \ is False and v16sum['voting_activated'] is False\ncases = v16['identity_cases']\nif not FIXTURE:\n    from scripts.validation.snapshot_values\
        \ import extract_object_body\n    html = (ROOT / 'index.html').read_text()\n    body = extract_object_body(html, 'PLAYER_DB')\n\
        \    model_rows = {name:{'pos':pos, 'team':team}\n                  for name, pos, team in re.findall(\n         \
        \         r\"'([^']+)':\\{pos:'([A-Z]+)',age:\\d+,role:'[^']+',team:'([^']+)'\", body)}\n    assert len(model_rows)\
        \ >= 500, 'STOP_MODEL_EXTRACTION_CHANGED'\n    for record in cases:\n        expected = {'pos':record['model_pos'],\
        \ 'team':record['model_team']}\n        assert model_rows.get(record['player']) == expected, 'STOP_FROZEN_MODEL_ROLE_TEAM_DRIFT_'\
        \ + record['player']\nexpected_players = set(v17['seven_identity_holds'])\nassert len(cases) == 7 and set(x['player']\
        \ for x in cases) == expected_players\nassert len(v14['all_global_26_candidates_no_owner_approval']) == 191\nchoices\
        \ = [x for x in v14['all_global_26_candidates_no_owner_approval'] if x['players'] == TRIO]\nassert len(choices) ==\
        \ 1, 'STOP_OWNER_CANDIDATE_NOT_UNIQUE_IN_FROZEN_V14'\nchosen = choices[0]\nassert chosen['candidate_26_slot_globally_consistent']\
        \ is True\nassert chosen['theoretical_28_slot_if_individual_identity_holds_cleared'] is True\nassert chosen['third_position']\
        \ == 'RB'\nassert chosen['fv_ratio'] == 1.182106\nassert [v17['direct_ballots_descriptive_not_new_votes'][k] for k\
        \ in\n        ('pair1_direct_ballots', 'pair2_direct_ballots', 'third_direct_ballots')] == [7, 4, 9]\n\n# Crosswalk\
        \ is evidence, not truth or an authority for league-specific position.\n# The same archived V16 categories must still\
        \ hold; changes require a NEW study.\nif FIXTURE:\n    crosswalk = []\n    for c in cases:\n        for obs in c['exact_name_source_observations']:\n\
        \            crosswalk.append({\n                'name': obs['source_name'],\n                'fantasypros_id': 999999,\n\
        \                'sleeper_id': 'fixture-id' if obs['sleeper_id_present'] else None,\n                'fp_position':\
        \ obs['source_fp_position'],\n                'sleeper_pos': obs['source_sleeper_position'],\n                'fp_team':\
        \ obs['source_fp_team'],\n                'sleeper_team': obs['source_sleeper_team'],\n            })\n    crosswalk\
        \ += [\n        {'name':'James Cook III','fantasypros_id':999998,'sleeper_id':None,'fp_position':'RB','sleeper_pos':None,'fp_team':'BUF','sleeper_team':None},\n\
        \        {'name':'Will Anderson Jr.','fantasypros_id':999997,'sleeper_id':None,'fp_position':'DL','sleeper_pos':None,'fp_team':'HOU','sleeper_team':None},\n\
        \    ]\nelse:\n    crosswalk = json.loads((ROOT / 'scripts/identity_crosswalk.json').read_text())\n    assert isinstance(crosswalk,\
        \ list) and len(crosswalk) > 150\n\ndef normalize(name):\n    return re.sub(r'\\s+', ' ', str(name or '').strip().lower())\n\
        \ndef summary(row):\n    return {k: row.get(k) for k in ('name','fantasypros_id','sleeper_id','fp_position','sleeper_pos','fp_team','sleeper_team')}\n\
        \nidentity_rows = []\nfor c in cases:\n    key = c['player']\n    exact = [x for x in crosswalk if normalize(x.get('name'))\
        \ == key]\n    assert len(exact) == c['strict_name_matches_in_current_pinned_crosswalk'], 'STOP_EXACT_CROSSWALK_COUNT_CHANGED_'\
        \ + key\n    observed = sorted([{\n        'source_name': r.get('name'),\n        'source_fp_position': r.get('fp_position'),\n\
        \        'source_sleeper_position': r.get('sleeper_pos'),\n        'source_fp_team': r.get('fp_team'),\n        'source_sleeper_team':\
        \ r.get('sleeper_team'),\n        'sleeper_id_present': bool(r.get('sleeper_id')),\n    } for r in exact], key=lambda\
        \ r: str(r['source_name']))\n    assert observed == sorted(c['exact_name_source_observations'], key=lambda r: str(r['source_name'])),\
        \ 'STOP_CROSSWALK_SOURCE_OBSERVATION_DRIFT_' + key\n    suggestions = []\n    # Only known name variants from frozen\
        \ V11; no fuzzy search or auto alias registration.\n    for name in c['archived_v11_source_names']:\n        for row\
        \ in crosswalk:\n            if normalize(row.get('name')) == normalize(name) and normalize(name) != key:\n      \
        \          suggestions.append(summary(row))\n    exact_evidence = [summary(r) for r in exact]\n    identity_rows.append({\n\
        \        'player': key, 'model_pos': c['model_pos'], 'model_team': c['model_team'],\n        'hold_class': c['category'],\
        \ 'exact_crosswalk_evidence': exact_evidence,\n        'archived_name_variant_evidence': suggestions,\n        'archived_v11_resolution':\
        \ c['archived_v11_resolution'],\n        'owner_action': c['owner_review_action'],\n        'stable_id_in_current_exact_crosswalk':\
        \ [str(x['sleeper_id']) for x in exact_evidence if x['sleeper_id']],\n        'evidence_not_identity_signoff': True,\
        \ 'identity_cleared': False,\n        'cannot_use_for_voter_release': True,\n    })\nassert collections.Counter(x['hold_class']\
        \ for x in identity_rows) == {\n    'NO_EXACT_CROSSWALK_NAME':3, 'POSITION_TAXONOMY_CONFLICT':3, 'TEAM_OR_TEAM_CODE_CONFLICT':1\n\
        }\n\n# Distinguish reproducibility of value ratio from human respondent realism.\nthird_pos_counts = dict(sorted(collections.Counter(x['third_position']\
        \ for x in v14['all_global_26_candidates_no_owner_approval'] if x['players'][:2] == TRIO[:2]).items()))\nchoice_review\
        \ = {\n    'status': 'OWNER_RESEARCH_SELECTION_RETAINED_REALISM_NOT_APPROVED',\n    'trio': TRIO,\n    'ratio': chosen['fv_ratio'],\
        \ 'three_way_comparison': {'te_pair_same_position':True, 'third_player_different_position':'RB'},\n    'direct_historical_ballots_descriptive_only':\
        \ v17['direct_ballots_descriptive_not_new_votes'],\n    'same_te_pair_third_position_variation_counts': third_pos_counts,\n\
        \    'respondent_comprehension_review_completed': False,\n    'actual_voter_sample_size_planned_and_approved': False,\n\
        \    'question_order_randomization_preregistered': False,\n    'voter_coverage_independence_preregistered': False,\n\
        \    'exposure_cap_and_per_player_balance_preregistered': False,\n    'prospective_holdout_and_stopping_rules_preregistered':\
        \ False,\n    'final_28_ballot_catalog_approved': False,\n    'source_linkage_to_oct_07_market_values_proven': False,\n\
        \    'voter_issuance_approved': False, 'voting_activated': False,\n    'no_new_votes': True, 'no_model_or_market_changes':\
        \ True,\n    'owner_followup': 'Decide whether this particular KTC keep-trade-cut trio is realistic for respondents,\
        \ with a written scientific plan before any actual ballots.',\n}\nidentity_packet = {\n    'status': 'SEVEN_IDENTITY_HOLDS_STILL_NEED_INDEPENDENT_OWNER_AND_SOURCE_ADJUDICATION',\n\
        \    'source_fixture': FIXTURE, 'seven_cases': identity_rows,\n    'original_slots_held': [5,21], 'existing_conditional_priority_slots':[1,8,12,15],\n\
        \    'cleared_count': 0, 'identity_reclassification_authorized': False,\n    'owner_identity_signoff': False, 'voting_activated':\
        \ False, 'no_repo_mutation': True,\n    'source_sha256': {k:v[1] for k,v in PINS.items()},\n}\n(OUT/'RESEARCH_ONLY_v18_seven_identity_adjudication_evidence.json').write_text(json.dumps(identity_packet,indent=2,sort_keys=True)+'\\\
        n')\n(OUT/'RESEARCH_ONLY_v18_ballot_realism_and_voter_design.json').write_text(json.dumps(choice_review,indent=2,sort_keys=True)+'\\\
        n')\nlines = [\n    '# QF11 V18 — Evidence-separated identity adjudication and selected-ballot realism',\n    '',\
        \ '**RESEARCH ONLY: stop before any voter links, ballot allocations, market repricing or production updates.**',\n\
        \    '', '## Tentative slot 11',\n    '- **Brock Bowers / Tyler Warren / TreVeyon Henderson** remains the owner-selected\
        \ research-only candidate.',\n    f\"- Archived FV comparability ratio: **{chosen['fv_ratio']}**; descriptive historical\
        \ direct ballot counts: **7 / 4 / 9**.\",\n    '- Mechanics do not establish respondent realism. No independent pilot\
        \ comprehension or prospective voter review has been done.',\n    '- **26 conditional slots** only; 28 remains blocked\
        \ by original held slots 5 and 21.',\n    '', '## Frozen identity holds (zero cleared)',\n    '| Model player | Position\
        \ / team | Case | Stable ID in exact crosswalk | Required decision |',\n    '|---|---|---|---|---|',\n]\nfor row in\
        \ identity_rows:\n    stable = ', '.join(row['stable_id_in_current_exact_crosswalk']) or 'Missing on exact model name'\n\
        \    lines.append(f\"| {row['player']} | {row['model_pos']} / {row['model_team']} | {row['hold_class']} | {stable}\
        \ | {row['owner_action']} |\")\nlines += [\n    '', '## Required next decisions before ballot release',\n    '1. Verify\
        \ exact player identity and stable ID from an independent league/source reference for all seven held names; do not\
        \ accept suffix stripping as a proof.',\n    '2. Resolve league-specific DL/LB/DB eligibility for Byron Young, Jaylon\
        \ Carlies, and Micah Parsons, and the dated Malik Willis team conflict, without rewriting frozen model values.',\n\
        \    '3. Review whether Bowers/Warren/Henderson is a realistic, clear Keep/Trade/Cut ballot rather than merely close\
        \ on FV.',\n    '4. Preregister voter independence, randomized display order, exposure caps, slot coverage, sample\
        \ size, stopping rules and prospective holdout before creating any link.',\n    '5. Recompute all 28 slots after actual\
        \ identity decisions; do not treat conditional compatibility as approval.',\n    '', '## Explicit safeguards',\n \
        \   '- No automatic identity clearance. No live votes collected. No Market Value backfill. No production/model edits.',\n\
        \    '- V17 owner approval is only of a **tentative research candidate**.',\n    '- The A0–A8 audit remains **13/20**\
        \ closed. The seven remaining findings do not close from this Green.',\n]\n(OUT/'RESEARCH_ONLY_v18_owner_readiness.md').write_text('\\\
        n'.join(lines)+'\\n')\nassert {p.name for p in OUT.iterdir()} == {\n    'RESEARCH_ONLY_v18_seven_identity_adjudication_evidence.json',\n\
        \    'RESEARCH_ONLY_v18_ballot_realism_and_voter_design.json',\n    'RESEARCH_ONLY_v18_owner_readiness.md'\n}\nprint('QF11_V18_OWNER_GATE_RESEARCH_GREEN\
        \ '+json.dumps({\n    'tentative_triplet':TRIO,'identity_holds':len(identity_rows),\n    'automatic_clears':0,'archived_conditional_slots':26,\n\
        \    'respondent_realism_approved':False,'voter_release_approved':False,\n    'source_fixture':FIXTURE\n},sort_keys=True))\n\
        \nPY_V18_MAIN\npython3 -m py_compile /tmp/qf11-v18-owner-gates.py\npython3 /tmp/qf11-v18-owner-gates.py\n"
    - name: Pin V18 findings and inspect seven player IDs in Sleeper cache; draft paper-only voter pilot
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/qf11-v19-research.py <<'V19_PY'\n#!/usr/bin/env python3\n\"\"\"QF11 V19: source-evidence\
        \ packet and paper-only pilot design. Never grants clearance.\"\"\"\nimport hashlib, itertools, json, os, re\nfrom\
        \ pathlib import Path\n\nROOT = Path(os.getenv('QF11_V19_ROOT', '.'))\nIN = Path(os.getenv('QF11_V19_INPUT','/tmp/qf11-v19-input'))\n\
        OUT = Path(os.getenv('QF11_V19_OUTPUT','/tmp/qf11-v19-output'))\nOUT.mkdir(parents=True, exist_ok=True)\nPINS = {\n\
        \    'identity': ('RESEARCH_ONLY_v18_seven_identity_adjudication_evidence.json','05bed7efbb4a20d634c0d78384e5bf3f271f765b35124f76bc21d9f0d6f5f203'),\n\
        \    'ballot': ('RESEARCH_ONLY_v18_ballot_realism_and_voter_design.json','d0d214b6cd75e71c3ef77272432117c50b06e71042f2d672da2dfb6c1fd63127')\n\
        }\nevidence={}\nfor key,(fname,sha) in PINS.items():\n    p=IN/fname\n    assert p.is_file(), 'STOP_MISSING_V18_EVIDENCE_'+fname\n\
        \    assert hashlib.sha256(p.read_bytes()).hexdigest()==sha, 'STOP_V18_EVIDENCE_DRIFT_'+fname\n    evidence[key]=json.loads(p.read_text())\n\
        ids, ballot = evidence['identity'], evidence['ballot']\nassert ids['cleared_count']==0 and ids['owner_identity_signoff']\
        \ is False and ids['voting_activated'] is False\nassert len(ids['seven_cases'])==7 and ids['original_slots_held']==[5,21]\n\
        assert ballot['trio']==['brock bowers','tyler warren','treveyon henderson'] and ballot['ratio']==1.182106\nassert\
        \ ballot['voting_activated'] is False and ballot['respondent_comprehension_review_completed'] is False\n\ncache_path=ROOT/'data/players_cache.json'\n\
        assert cache_path.is_file(), 'STOP_SNAPSHOT_MISSING'\ncache=json.loads(cache_path.read_text())\nassert isinstance(cache,dict)\
        \ and isinstance(cache.get('players'),dict) and len(cache['players'])>1000, 'STOP_SNAPSHOT_SCHEMA'\nassert isinstance(cache.get('_fetched_at'),(float,int)),\
        \ 'STOP_SNAPSHOT_MISSING_TIME'\ncross=json.loads((ROOT/'scripts/identity_crosswalk.json').read_text())\nassert isinstance(cross,list)\
        \ and len(cross)>100,'STOP_CROSSWALK_SCHEMA'\n\ndef norm(s):\n    return ' '.join(re.findall(r'[a-z0-9]+',str(s or\
        \ '').lower()))\ndef no_suffix(s):\n    a=norm(s).split();return ' '.join(a[:-1] if a and a[-1] in ('jr','sr','ii','iii','iv')\
        \ else a)\n\ndef clean_row(pid,p):\n    # Restricted to source player identity and eligibility evidence; do not export\
        \ cache dumps.\n    return {'sleeper_id':str(pid), 'name':str(p.get('full_name') or (str(p.get('first_name') or '')+'\
        \ '+str(p.get('last_name') or '')).strip()),\n            'team':p.get('team'), 'position':p.get('position'), 'fantasy_positions':p.get('fantasy_positions'),\n\
        \            'status':p.get('status'), 'age':p.get('age')}\n\nplayers=cache['players']; named={}\nfor pid,p in players.items():\n\
        \    if not isinstance(p,dict): continue\n    name = str(p.get('full_name') or (str(p.get('first_name') or '')+' '+str(p.get('last_name')\
        \ or '')).strip())\n    if name: named.setdefault(no_suffix(name),[]).append((str(pid),p))\n\nrows=[]\nfor case in\
        \ ids['seven_cases']:\n    key=case['player']; stable=case['stable_id_in_current_exact_crosswalk']\n    by_id=[clean_row(pid,players[pid])\
        \ for pid in stable if pid in players and isinstance(players[pid],dict)]\n    name_candidates=[clean_row(pid,p) for\
        \ pid,p in named.get(no_suffix(key),[])][:15]\n    # Separate identity, roster-position and team discrepancies. No\
        \ source automatically resolves a ballot.\n    potential=set([v['sleeper_id'] for v in by_id]+[v['sleeper_id'] for\
        \ v in name_candidates])\n    rows.append({'model_player':key,'frozen_model_team':case['model_team'],'frozen_model_position':case['model_pos'],\n\
        \         'prior_hold_class':case['hold_class'],'crosswalk_stable_ids':stable,\n         'raw_sleeper_id_matches':by_id,'name_or_suffix_candidates':name_candidates,\n\
        \         'name_candidate_count':len(named.get(no_suffix(key),[])),\n         'candidate_id_count':len(potential),\n\
        \         'may_not_assume_suffix_equivalence':True,\n         'eligible_position_requires_league_rule_adjudication':case['hold_class']=='POSITION_TAXONOMY_CONFLICT',\n\
        \         'evidence_not_permission':True,'identity_cleared':False})\nassert {x['model_player'] for x in rows}=={x['player']\
        \ for x in ids['seven_cases']}\nresult={\n 'status':'EVIDENCE_ONLY_NO_IDENTITIES_CLEARED',\n 'cache_blob_observed_sha256':hashlib.sha256(cache_path.read_bytes()).hexdigest(),\n\
        \ 'sleeper_cache_fetched_at_unix':cache['_fetched_at'],'snapshot_rows':len(players),\n 'crosswalk_sha256':hashlib.sha256((ROOT/'scripts/identity_crosswalk.json').read_bytes()).hexdigest(),\n\
        \ 'held_slots':[5,21],'priority_holds_remain_open':True,'identity_clears':0,'cases':rows,\n 'owner_signoff':False,'voting_activated':False,'market_value_changed':False}\n\
        (OUT/'RESEARCH_ONLY_v19_sleeper_identity_evidence.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\\\
        n')\n\nTRIO=['Brock Bowers','Tyler Warren','TreVeyon Henderson']\npilot={\n 'status':'PAPER_ONLY_DESIGN_PROPOSAL_NOT_PREREGISTERED_NOT_APPROVED',\n\
        \ 'owner_selected_trio':['brock bowers','tyler warren','treveyon henderson'],\n 'prompt_draft':'Assuming standard\
        \ dynasty 12-team Superflex with IDP, rank these three assets as Keep / Trade / Cut. What assumptions did you need\
        \ to make?',\n 'permuted_order_design':[list(x) for x in itertools.permutations(TRIO)],\n 'unique_display_orders':6,\n\
        \ 'pilot_respondent_target':None,'consent_and_independence_review_completed':False,\n 'random_assignment_design_reviewed':False,'min_cell_exposure_and_imbalance_bounds_approved':False,\n\
        \ 'respondent_comprehension_scoring_predefined':False,'position_mix_clarity_review_completed':False,\n 'stratified_sample_size_and_stopping_rules_approved':False,'prospective_holdout_protocol_approved':False,\n\
        \ 'historical_votes_are_descriptive_not_independent_new_evidence':ballot['direct_historical_ballots_descriptive_only'],\n\
        \ 'suggested_comprehension_prompts':['Which player is a running back?',\n   'Did you evaluate the three players using\
        \ the same dynasty timeframe?',\n   'How confident are you that Keep, Trade and Cut refer to the same trade context?'],\n\
        \ 'third_player_RB_vs_two_TEs_is_cross_position_pilot_risk':True,\n 'ballot_realism_approved':False,'voter_links_created':False,'voting_activated':False,\n\
        \ 'not_usable_for_market_repricing':True}\n(OUT/'RESEARCH_ONLY_v19_voter_pilot_design_DRAFT.json').write_text(json.dumps(pilot,indent=2,sort_keys=True)+'\\\
        n')\nlines=['# QF11 V19 — Sleeper source evidence and unapproved pilot design','',\n '**RESEARCH ONLY. NO IDENTITY\
        \ CLEARS, VOTER LINKS, BALLOT RELEASE OR PRODUCTION UPDATES.**','',\n f\"- V18 pinned evidence verified; current Sleeper\
        \ cache contains **{len(players)}** public player records.\",\n f\"- Cache fetched-at epoch: `{cache['_fetched_at']}`.\
        \ Evidence is time-dependent and is not a frozen source of valuation.\",\n '- All **seven identity holds** persist;\
        \ conditional 26 of 28 remains.','',\n '## Independent source evidence, still awaiting league and owner adjudication','',\n\
        \ '| Model key | Hold class | Crosswalk stable IDs | Cached candidate IDs | Next decision |','|---|---|---|---:|---|']\n\
        for x in rows:\n    crit='Review source ID and team' if x['prior_hold_class']=='TEAM_OR_TEAM_CODE_CONFLICT' else ('Resolve\
        \ league IDP slot classification' if x['prior_hold_class']=='POSITION_TAXONOMY_CONFLICT' else 'Prove exact name-to-ID\
        \ linkage')\n    lines.append('| '+' | '.join([x['model_player'],x['prior_hold_class'],','.join(x['crosswalk_stable_ids'])\
        \ or 'none',str(x['candidate_id_count']),crit])+' |')\nlines+=['','## Research-only ballot pilot proposal','',\n '-\
        \ Tentative owner choice: **Brock Bowers / Tyler Warren / TreVeyon Henderson**.',\n '- All 6 presentation-order permutations\
        \ enumerated in JSON, **not deployed**.',\n '- No respondent sample size, independent-voter method, assignment algorithm,\
        \ stopping rule or comprehension cutoff approved.',\n '- Potential ambiguity: comparing two tight ends against one\
        \ running back may be mechanically comparable but confusing for respondents.',\n '- Next owner gate: approve a complete\
        \ written prospective pilot protocol, and separately adjudicate seven identities.','',\n '## Safety',\n '- Never upload\
        \ raw Sleeper cache; output contains only seven public candidate pools and diagnostics.',\n '- No speculative ID mappings\
        \ enter the crosswalk; no market, FV, lineup, IDP or package adjustment changes.',\n '- Original A0–A8 audit remains\
        \ **13/20** closed.']\n(OUT/'RESEARCH_ONLY_v19_owner_review.md').write_text('\\n'.join(lines)+'\\n')\nassert {p.name\
        \ for p in OUT.iterdir()}=={'RESEARCH_ONLY_v19_sleeper_identity_evidence.json','RESEARCH_ONLY_v19_voter_pilot_design_DRAFT.json','RESEARCH_ONLY_v19_owner_review.md'}\n\
        print('QF11_V19_LINKAGE_PILOT_RESEARCH_GREEN '+json.dumps({'cache_rows':len(players),'seven_holds':7,'identity_clears':0,'display_order_variants':6,'voting_activated':False,'artifact_status':result['status']},sort_keys=True))\n\
        V19_PY\npython3 -m py_compile /tmp/qf11-v19-research.py\npython3 /tmp/qf11-v19-research.py"
