name: A-NL56R1 - NL47 Release Identity Repair Preview (Read Only)
run-name: A-NL56R1 - Compare immutable W${{ inputs.war_week }} NL39/NL44 articles vs publication metadata
'on':
  workflow_dispatch:
    inputs:
      war_week:
        description: War Room week to verify (target W10 by default)
        required: true
        type: string
        default: '10'
      scored_week:
        description: Completed Week for Aftermath and NL45 scoring; must equal war_week minus 1
        required: true
        type: string
        default: '9'
      nl39_run_id:
        description: Successful NL39 source with six matchup articles
        required: true
        type: string
        default: '42837666274'
      nl44_run_id:
        description: Successful NL44 V7 War Room release source
        required: true
        type: string
        default: '42837956712'
      nl45_run_id:
        description: Successful NL45 exact scored-week offense/IDP evidence
        required: true
        type: string
        default: '42838026515'
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl56r1-release-identity-readonly
  cancel-in-progress: false
jobs:
  release-identity-preview:
    name: Verify six approved matchup stories are unchanged despite release cover and footer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm successful upstream GitHub run IDs and immutable release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WAR_WEEK: ${{ inputs.war_week }}
          SCORED_WEEK: ${{ inputs.scored_week }}
          NL39_RUN: ${{ inputs.nl39_run_id }}
          NL44_RUN: ${{ inputs.nl44_run_id }}
          NL45_RUN: ${{ inputs.nl45_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY_NL56_SOURCES'
          import json, os, sys, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          if int(os.environ['WAR_WEEK'])-int(os.environ['SCORED_WEEK'])!=1:raise SystemExit('Incorrect War Room/Aftermath week pairing')
          base=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'LOG-NL56R1-ReadOnly'}
          sources={
              'nl39':(int(os.environ['NL39_RUN']),'.github/workflows/A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml',f'LOG-NL39R1-Weekly-Newsroom-Shadow-{os.environ["NL39_RUN"]}'),
              'nl44':(int(os.environ['NL44_RUN']),'.github/workflows/A-NL44R1-V7-WarRoom-Release-Renamed-v2.yml',f'LOG-W{os.environ["WAR_WEEK"]}-V7-WarRoom-RELEASE-{os.environ["NL44_RUN"]}'),
              'nl45':(int(os.environ['NL45_RUN']),'.github/workflows/A-NL45R1-Offense-IDP-Leaderboard-ReadOnly.yml',f'LOG-NL45R1-Offense-IDP-Scoring-Through-W{os.environ["SCORED_WEEK"]}-{os.environ["NL45_RUN"]}'),
          }
          def gh(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as resp:return json.load(resp)
          for key,(rid,wf,artifact) in sources.items():
              run=gh('/actions/runs/'+str(rid))
              if (run.get('path')!=wf or run.get('status')!='completed' or run.get('conclusion')!='success' or run.get('head_branch')!='main' or run.get('event')!='workflow_dispatch'):
                  raise SystemExit(f'FAIL {key}: run identity not approved: '+str({k:run.get(k) for k in ('path','status','conclusion','head_branch','event')}))
              arts=gh(f'/actions/runs/{rid}/artifacts?per_page=100').get('artifacts',[])
              found=[x for x in arts if x.get('name')==artifact and not x.get('expired')]
              if len(found)!=1:raise SystemExit(f'FAIL {key}: expected unique unexpired artifact {artifact!r}, got {len(found)}')
              print(f'PASS {key}: approved exact source run #{rid}; artifact #{found[0]["id"]}',flush=True)
          print('PASS: all three source lineages and artifact names verified; no write permissions',flush=True)
          PY_NL56_SOURCES
      - name: Download verified NL39 source PDFs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.nl39_run_id }}
          name: LOG-NL39R1-Weekly-Newsroom-Shadow-${{ inputs.nl39_run_id }}
          path: nl56_input/nl39
      - name: Download immutable NL44 V7 source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.nl44_run_id }}
          name: LOG-W${{ inputs.war_week }}-V7-WarRoom-RELEASE-${{ inputs.nl44_run_id }}
          path: nl56_input/nl44
      - name: Download reconciled NL45 offense and IDP data
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.nl45_run_id }}
          name: LOG-NL45R1-Offense-IDP-Scoring-Through-W${{ inputs.scored_week }}-${{ inputs.nl45_run_id }}
          path: nl56_input/nl45
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source-PDF inspector
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pymupdf==1.26.5
