        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/nl56_preview.py" --input nl56_input --output nl56_output \
            --war-week "${{ inputs.war_week }}" \
            --nl39-run-id "${{ inputs.nl39_run_id }}" \
            --nl44-run-id "${{ inputs.nl44_run_id }}" \
            --nl45-run-id "${{ inputs.nl45_run_id }}"
      - name: Upload read-only compatibility report without releasing PDFs
