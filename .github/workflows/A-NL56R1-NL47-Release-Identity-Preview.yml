          name: LOG-NL56R1-NL47-Identity-PREVIEW-${{ github.run_id }}
          path: nl56_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Display compatibility verdict and originality restriction
        if: always()
        shell: bash
        run: |
          if test -s nl56_output/NL56R1-RELEASE-IDENTITY-PREVIEW.md; then
            cat nl56_output/NL56R1-RELEASE-IDENTITY-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NL56 failed: NOT approved for newsletter release.' >> "$GITHUB_STEP_SUMMARY"
          fi
