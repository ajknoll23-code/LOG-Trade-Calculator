name: Durability V2 Phase 4 Bridge Calibration

# Research-only historical bridge calibration.
# Does not change deployed durability, production, or player values.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  bridge-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 4 self-test
        run: python3 research/durability-v2/durability_v2_phase4_bridge_calibration.py --selftest

      - name: Calibrate Durability V2 bridges
        run: python3 research/durability-v2/durability_v2_phase4_bridge_calibration.py --write

      - name: Verify Phase 4 outputs
        run: python3 research/durability-v2/durability_v2_phase4_bridge_calibration.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/durability-v2/durability_v2_phase4_bridge_calibration.json
          git add research/durability-v2/durability_v2_phase4_bridge_calibration.md
          git diff --staged --quiet || git commit -m "Add Durability V2 Phase 4 bridge calibration"
          git push
