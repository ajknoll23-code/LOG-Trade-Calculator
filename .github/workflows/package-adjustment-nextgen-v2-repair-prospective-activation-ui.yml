name: Package Adjustment NextGen V2 Repair Prospective Activation UI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-repair-prospective-activation-ui
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install requests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard, audit, and repair index
        env:
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -z "$(git status --porcelain=v1)"
          git merge-base --is-ancestor 14eaa706f2dcc711c3a2f39e1d64c4889c44f2e8 HEAD

          test "$(git hash-object index.html)" = \
            "6c9c23e7f44ab66415690011460f6df527ec51f5"
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = \
            "3d44e567270e597b5543e739feb716b5111d1eec"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = \
            "fa3c366b0a6fc9db1fef448184c4ff6072a634dd"

          echo "REPAIR_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import csv, hashlib, io, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          D = Path("research/package-adjustment-nextgen-v2")
          activation = json.loads((D / "prospective_voting_activation_manifest_v1.json").read_text())
          assert activation["valid_ballot_start_utc"] == "2026-09-12T05:01:14.788516+00:00"

          # Fail closed unless ZERO prospective rows exist.
          url = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )
          r = requests.get(url, timeout=30)
          r.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(r.text)))
          prospective_rows = sum(
              1 for row in rows
              if str(row.get("keep") or "").startswith("__pkgnv2p1__|")
          )
          if prospective_rows != 0:
              raise RuntimeError(
                  f"prospective evidence already exists; refusing repair: {prospective_rows} rows"
              )

          current = Path("index.html").read_text()
          assert "function ktcTeamLabel(abbr)" not in current
          assert "function ktcCurrentVoterId()" not in current
          assert "__pkgnv2p1__|${id}|${choice}" in current

          parent = subprocess.check_output(
              ["git", "show", "609f172e9dc6946cc0fb632bc30f9c24f3a2cc48:index.html"],
              text=True,
          )

          cur_marker = "/* Package Adjustment NextGen V2 Prospective V1:"
          old_marker = "/* Package Adjustment NextGen V2: frozen multi-v-multi research catalog."
          shared_marker = "/* Real, static NFL team abbreviation -> nickname map"
          pkg_marker = "function packageVoteTodayKey(){"
          render_marker = "\nfunction render(){"

          c0 = current.index(cur_marker)
          c1 = current.index(pkg_marker, c0)
          c2 = current.index(render_marker, c1)
          prospective_header = current[c0:c1]
          prospective_functions = current[c1:c2]

          p0 = parent.index(old_marker)
          ps = parent.index(shared_marker, p0)
          pp = parent.index(pkg_marker, ps)
          pr = parent.index(render_marker, pp)
          shared_ktc = parent[ps:pp]

          repaired = (
              parent[:p0]
              + prospective_header
              + shared_ktc
              + prospective_functions
              + parent[pr:]
          )

          required = [
              "function ktcTeamLabel(abbr)",
              "function ktcGuestId()",
              "function ktcCurrentVoterId()",
              "function ktcEligiblePool()",
              "const KTC_VALIDATION_QUEUE = [",
              "function renderKTC()",
              "package_vote_challenges_prospective_v1.json",
              "__pkgnv2p1__|${id}|${choice}",
              "__pkgnv2p1_meta__|${left}",
              "__pkgnv2p1_schema__|1",
              "2026-09-12T05:01:14.788516+00:00",
              "PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2",
          ]
          for needle in required:
              assert needle in repaired, needle

          assert repaired.count("function ktcCurrentVoterId()") == 1
          assert repaired.count("function packageVoteTodayKey(){") == 1
          assert repaired.count("const PACKAGE_VOTE_CHALLENGES_URL =") == 1

          rs = repaired.index(shared_marker)
          rp = repaired.index(pkg_marker, rs)
          assert repaired[rs:rp] == shared_ktc

          Path("index.html").write_text(repaired)

          repair = {
              "schema_version": 1,
              "status": "prospective_activation_ui_repaired_before_evidence",
              "repair_id": "pkgnv2-prospective-activation-ui-repair-v1",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "broken_activation_commit": "14eaa706f2dcc711c3a2f39e1d64c4889c44f2e8",
              "pre_activation_parent_commit": "609f172e9dc6946cc0fb632bc30f9c24f3a2cc48",
              "prospective_rows_before_repair": 0,
              "choice_fields_inspected": False,
              "prospective_evidence_started_before_repair": False,
              "original_valid_ballot_start_utc": "2026-09-12T05:01:14.788516+00:00",
              "valid_ballot_start_changed": False,
              "catalog_changed": False,
              "sampling_changed": False,
              "transport_namespace_changed": False,
              "candidate_or_model_changed": False,
              "production_formula_changed": False,
              "production_change_authorized": False,
              "repaired_index_sha256": hashlib.sha256(repaired.encode()).hexdigest(),
          }
          (D / "prospective_voting_activation_ui_repair_v1.json").write_text(
              json.dumps(repair, indent=2, sort_keys=True) + "\n"
          )
          (D / "prospective_voting_activation_ui_repair_v1.md").write_text(
              "# Package Adjustment NextGen V2 — Prospective Activation UI Repair V1\n\n"
              "The first prospective activation commit accidentally removed shared KTC browser "
              "helpers. This repair restores that shared block byte-for-byte from the immediate "
              "pre-activation parent while retaining the frozen prospective catalog, sampler, "
              "transport namespace, and original valid-ballot cutoff.\n\n"
              "An outcome-blind audit found **zero prospective rows before repair**, so no "
              "prospective evidence was collected under the broken UI. Production V1.6 is unchanged.\n"
          )
          print("PASS: zero prospective rows; repaired index built.")
          PY

      - name: Validate repaired browser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          text = Path("index.html").read_text()
          for needle in (
              "function ktcTeamLabel(abbr)",
              "function ktcCurrentVoterId()",
              "function ktcEligiblePool()",
              "function renderKTC()",
              "__pkgnv2p1__|${id}|${choice}",
              "package_vote_challenges_prospective_v1.json",
          ):
              assert needle in text

          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, re.S | re.I)
          Path("/tmp/index-inline.js").write_text("\n".join(scripts))

          expected = {
              "index.html",
              "research/package-adjustment-nextgen-v2/prospective_voting_activation_ui_repair_v1.json",
              "research/package-adjustment-nextgen-v2/prospective_voting_activation_ui_repair_v1.md",
          }
          rows = subprocess.check_output(["git","status","--porcelain=v1"], text=True).splitlines()
          paths = {r[3:] for r in rows if r.strip()}
          assert paths == expected, sorted(paths)
          print("PASS: exact 3-file repair boundary.")
          PY

          node --check /tmp/index-inline.js
          git diff --check

      - name: Protect frozen contracts and run regressions
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- scripts/market/ktc_pipeline.py
          git diff --exit-code -- scripts/validation/repo_regression_checks.py
          git diff --exit-code -- research/package-adjustment-nextgen-v2/package_vote_challenges_prospective_v1.json
          git diff --exit-code -- research/package-adjustment-nextgen-v2/prospective_time_holdout_preregistration_v1.json
          git diff --exit-code -- research/package-adjustment-nextgen-v2/prospective_voting_activation_manifest_v1.json
          git diff --exit-code -- research/package-adjustment-nextgen-v2/research_candidate_m2b_v1.json
          git diff --exit-code -- research/package-adjustment-production-candidate-v1

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add research/package-adjustment-nextgen-v2/prospective_voting_activation_ui_repair_v1.json
          git add research/package-adjustment-nextgen-v2/prospective_voting_activation_ui_repair_v1.md

          staged=( $(git diff --cached --name-only) )
          test "${#staged[@]}" -eq 3

          git commit -m "Repair NextGen V2 prospective activation UI"
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

          python3 - <<'PY'
          import os, requests
          commit = os.environ["REPAIR_COMMIT"]
          url = f"https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/{commit}/index.html"
          r = requests.get(url, timeout=30)
          r.raise_for_status()
          text = r.text
          assert "function ktcCurrentVoterId()" in text
          assert "function renderKTC()" in text
          assert "__pkgnv2p1__|${id}|${choice}" in text
          assert "2026-09-12T05:01:14.788516+00:00" in text
          print("PASS: pushed UI repair verified.")
          print("PROSPECTIVE VOTING IS NOW SAFE TO START.")
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py
