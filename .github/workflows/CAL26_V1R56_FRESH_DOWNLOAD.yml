name: "CAL26 V1R56 - LOG Week6 Next-Season Breakout and Numerical Shadow Sensitivity (Read Only)"
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r56-log-week6-breakout-pricing-shadow-read-only
  cancel-in-progress: false
jobs:
  qb-log-week6-nextseason:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned frozen Week6 R47R1 54-QB evidence
        uses: actions/download-artifact@v4
        with:
          name: CAL26_V1R47R1_QB_RECENCY_TWO_TRACK_EVIDENCE_READ_ONLY
          run-id: 40030717495
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-v1r56-inputs/R47
      - name: Pinned empirical LOG R55 54-QB shadow
        uses: actions/download-artifact@v4
        with:
          name: CAL26_V1R55_EMPIRICAL_LOG_MULTISEASON_QB_SHADOW_RESEARCH_ONLY
          run-id: 40048264245
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-v1r56-inputs/R55
      - name: Historical LOG core Week6 next-season holdout and 54 QB sensitivity
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r56_r50_core.py" <<'PY_CAL26_V1R56_R50_CORE'
          #!/usr/bin/env python3
          """CAL26 V1R50R1: Chronological Week6 -> next-season QB outcome test, no price changes.

          R46 validated short-horizon recency, R49 did not validate age survival for surplus.
          This experiment tests transfer to FUTURE SEASONS instead of handwaving that ROS==FV.
          Only 2016-2025 nflverse standard-scoring weekly inputs; never 2026 outcomes.
          """
          from __future__ import annotations
          import argparse, collections, csv, hashlib, io, json, math, pathlib, statistics, urllib.request, time, re

          YEARS=tuple(range(2016,2026))
          FIT_INNER=(2017,2018)
          INNER=(2020,2021)
          FIT_FINAL=(2017,2018,2019,2020,2021)
          TEST=(2023,2024)
          CUTOFF_WEEK=6
          MIN_ATTEMPTS=80
          MIN_GAMES=3
          SRC='https://github.com/nflverse/nflverse-data/releases/download/stats_player/'
          ORIGIN='CAL26_V1R50'
          PIN={
           2016:'eb0264c65d1ef593196afcd4ba24e9f2e9b7942923bf6f4bb4639684e2c4d470',
           2017:'592b0916065987b0b3afb0480162f03350d16b12250dc42b0f194e2ab1378563',
           2018:'c53021bcfc9f89d30edd6f1fe145a1d7d6ce469efeec75974fe9f0adac568642',
           2019:'a05558126b1209b80fe11a8f18938cb35816370bf9990975a87de49e9eed7376',
           2020:'05b992676faccc8940efbf6242cb76358069372d31d7c2e02c1a4acdcd3cbe18',
           2021:'41915fb49238902ad1f129ebf0405b11a1e710454ae0fe8f7b3e4f9145875f48',
           2022:'ad426c3fe5bf1cc30c3f137fdfe96d054e19d400879ee4413129da49fa7b54be',
           2023:'f19cb71a5de0dce7fd09376026237c9ee9d5a93fe13815a2ea3ec2d37204cb17',
           2024:'3ddc45a84f759aa348ce465ae001752c530575455717657cdfe1f8abfcdb4759',
           2025:'e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2',
          }
          PINSET_MANIFEST_DIGEST='782c8eae5d004bb2c4722f9790d0c486beaf538e5161f5e614a5f8e3a4fa556b'  # Successful R46 GitHub artifact source_sha256, run 40027917152
          FEATURES=('previous_season','ytd','recent_three','r46_week6_selected','equal_recent_ytd','equal_all_three')
          OUTCOMES=('future_150_pass_attempts','future_above_QB24','future_ratio_surplus')

          def require(t,msg):
           if not t: raise AssertionError(msg)

          def sha(x):return hashlib.sha256(x).hexdigest()

          def fnum(x):
           try:v=float(x or 0)
           except (TypeError,ValueError):raise AssertionError('NONNUMERIC_STATS')
           require(math.isfinite(v),'NONFINITE_STATS');return v

          def emit_csv(rows,fields):
           b=io.StringIO(newline='');w=csv.DictWriter(b,fieldnames=fields,extrasaction='ignore',lineterminator='\n');w.writeheader()
           for r in rows:w.writerow(r)
           return b.getvalue()

          def load_bytes(year,assets,download,fixture):
           p=assets/f'stats_player_week_{year}.csv'
           if download:
            err=None
            for attempt in range(3):
             try:
              req=urllib.request.Request(SRC+p.name,headers={'User-Agent':'CAL26-R50-Longitudinal-Read-Only'})
              with urllib.request.urlopen(req,timeout=65) as v:
               require(v.status==200,'HTTP_NOT_200');data=v.read(13_000_001)
              require(300<len(data)<13_000_000,'SOURCE_BAD_BYTES')
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              break
             except Exception as ex:
              err=ex
              if attempt<2:time.sleep(2*(attempt+1))
            else:raise RuntimeError(f'SOURCE_DOWNLOAD_FAILED_{year}:{err}')
           else:
            require(p.is_file(),f'SOURCE_FILE_MISSING_{year}');data=p.read_bytes()
           require(data[:2]!=b'PK','CSV_REQUIRED_NOT_ZIP')
           require(b'player_id' in data[:2400] and b'fantasy_points' in data[:2400],'SOURCE_HEADER_NOT_FOUND')
           if not fixture:require(sha(data)==PIN[year],f'R46_SOURCE_SHA_DRIFT_{year}: {sha(data)}')
           return data

          def parse_all(blobs):
           season={};teams={};qa=[]
           required={'player_id','position','season','season_type','week','team','attempts','fantasy_points'}
           for yr,blob in sorted(blobs.items()):
            rdr=csv.DictReader(io.StringIO(blob.decode('utf-8-sig')))
            require(required.issubset(set(rdr.fieldnames or [])),f'MISSING_FIELDS_{yr}')
            bypid=collections.defaultdict(list);teamweeks=collections.defaultdict(set);rows=0
            for item in rdr:
             if (item.get('season_type') or '').upper().strip()!='REG':continue
             try:y=int(item.get('season'));week=int(item.get('week'))
             except (TypeError,ValueError):raise AssertionError('BAD_YEAR_WEEK')
             require(y==yr and 1<=week<=18,f'INVALID_WEEK_{yr}')
             t=(item.get('team') or '').strip()
             if t:teamweeks[t].add(week)
             if item.get('position')!='QB':continue
             pid=(item.get('player_id') or '').strip()
             if not pid or not t:continue
             a=fnum(item.get('attempts'));p=fnum(item.get('fantasy_points'))
             require(a>=0 and p>-100,'INVALID_POINTS_OR_ATTEMPTS')
             bypid[pid].append({'team':t,'week':week,'attempts':a,'points':p})
             rows+=1
            for pid,rs in bypid.items():
             rs.sort(key=lambda x:(x['week'],x['team']))
             require(len({x['week'] for x in rs})==len(rs),f'DUPLICATE_QB_WEEK_{yr}_{pid}')
            if yr>=2017:require(len(bypid)>=28 and len(teamweeks)>=25,f'BAD_HISTORICAL_COVERAGE_{yr}')
            season[yr]=dict(bypid);teams[yr]={t:tuple(sorted(w)) for t,w in teamweeks.items()}
            qa.append({'year':yr,'qb_unique':len(bypid),'qb_week_rows':rows,'team_count':len(teamweeks)})
           require(set(season)==set(YEARS),'SOURCE_YEAR_GAP')
           return season,teams,qa

          def build_cases(season,teams):
           # Future seasons are fully complete (2018-25); only these labels are used.
           q24={}
           for year in YEARS[1:]:
            ss=[sum(x['points'] for x in rs) for rs in season[year].values()]
            scores=sorted((s for s in ss if s>0),reverse=True)
            require(len(scores)>=30,f'QB24_COVERAGE_LOW_{year}')
            q24[year]=scores[23]
            require(q24[year]>10,f'QB24_INVALID_{year}')
           examples=[];skips=collections.Counter()
           for year in (*FIT_FINAL,*TEST):
            for pid,rs in season[year].items():
             prefix=[x for x in rs if x['week']<=CUTOFF_WEEK]
             if not prefix:continue
             att=sum(x['attempts'] for x in prefix)
             active=sum(x['attempts']>=10 for x in prefix)
             if att<MIN_ATTEMPTS or active<MIN_GAMES:
              skips['too_few_attempts_or_starts']+=1;continue
             team=prefix[-1]['team'];past=[w for w in teams[year].get(team,()) if w<=CUTOFF_WEEK]
             if len(past)<3:
              skips['too_few_team_games']+=1;continue
             pt={x['week']:x['points'] for x in prefix}
             ytd=sum(x['points'] for x in prefix)/len(past)
             last3=sum(pt.get(w,0) for w in past[-3:])/3
             previous=season[year-1].get(pid)
             prior=None
             if previous:
              oldatt=sum(x['attempts'] for x in previous)
              oldteam=previous[-1]['team']
              oldgames=teams[year-1].get(oldteam,())
              if oldatt>=MIN_ATTEMPTS and len(previous)>=MIN_GAMES and len(oldgames)>=12:
               prior=sum(x['points'] for x in previous)/len(oldgames)
             future=season[year+1].get(pid,[])
             future_attempts=sum(x['attempts'] for x in future)
             future_points=sum(x['points'] for x in future)
             ratio=max(0,future_points/q24[year+1])
             # R46 Week6: prior available = 50% last3/50% prior; otherwise YTD (R47 winning fallback).
             base={'previous_season':prior,'ytd':ytd,'recent_three':last3,
                   'r46_week6_selected':(last3+prior)/2 if prior is not None else ytd,
                   'equal_recent_ytd':(last3+ytd)/2,
                   'equal_all_three':(last3+ytd+prior)/3 if prior is not None else (last3+ytd)/2}
             require(all(x is None or math.isfinite(x) for x in base.values()),'NONFINITE_FEATURE')
             examples.append({'year':year,'pid':pid,'prior_available':prior is not None,
               'n_week6_games':len(past),'week6_attempts':att,'future_qb24':q24[year+1],
               'future_150_pass_attempts':int(future_attempts>=150),
               'future_above_QB24':int(ratio>=1),
               'future_ratio_surplus':max(0,min(ratio-1,3)),
               'features':base})
           for y in (*FIT_FINAL,*TEST):require(sum(x['year']==y for x in examples)>=10,f'ANCHOR_YEAR_LOW_{y}')
           return examples,q24,dict(skips)

          def regress(train,feature,target):
           rows=[(r['features'][feature],r[target]) for r in train if r['features'][feature] is not None]
           require(len(rows)>0,'EMPTY_FIT')
           mx=sum(x for x,_ in rows)/len(rows);my=sum(y for _,y in rows)/len(rows)
           ssxx=sum((x-mx)**2 for x,_ in rows);ssxy=sum((x-mx)*(y-my) for x,y in rows)
           slope=(ssxy/(ssxx*(1+12/len(rows)))) if ssxx>1e-8 else 0
           return {'n':len(rows),'mx':mx,'my':my,'slope':slope}

          def predict(r,params,feature,target):
           x=r['features'][feature]
           require(x is not None,'PREDICT_FEATURE_UNAVAILABLE')
           p=params['my']+params['slope']*(x-params['mx'])
           return min(max(p,0),3) if target=='future_ratio_surplus' else min(max(p,0),1)

          def score(rs,fit,feature,target):
           require(bool(rs),'EMPTY_SCORING_SAMPLE')
           return sum((predict(r,fit,feature,target)-r[target])**2 for r in rs)/len(rs)

          def safe_count(rs,feature):return sum(r['features'][feature] is not None for r in rs)

          def adjudicate(examples):
           res=[];decision=[]
           for cohort in ('has_prior','no_prior'):
            filt=(lambda x:x['prior_available']) if cohort=='has_prior' else (lambda x:not x['prior_available'])
            innerfit=[x for x in examples if x['year'] in FIT_INNER and filt(x)]
            inner=[x for x in examples if x['year'] in INNER and filt(x)]
            outerfit=[x for x in examples if x['year'] in FIT_FINAL and filt(x)]
            test=[x for x in examples if x['year'] in TEST and filt(x)]
            for outcome in OUTCOMES:
             errors=[];fits={};ranks=[]
             for feature in FEATURES:
              nfit=safe_count(innerfit,feature);nv=safe_count(inner,feature);nout=safe_count(test,feature)
              if nfit<10 or nv<6 or nout<6:continue
              tr=[r for r in innerfit if r['features'][feature] is not None]
              va=[r for r in inner if r['features'][feature] is not None]
              ff=regress(tr,feature,outcome)
              vscore=score(va,ff,feature,outcome)
              ranks.append((vscore,feature))
             if not ranks:
              res.append({'cohort':cohort,'outcome':outcome,'selected':'INSUFFICIENT_INNER_VALIDATION','n_final_test':len(test),'status':'NO_SELECTION'})
              continue
             chosen=min(ranks,key=lambda t:(round(t[0],12),FEATURES.index(t[1])))[1]
             # Historical baseline controls: unconditional mean, plus YTD as default comparator (the available production-only approach).
             base='ytd'
             for candidate in ('historical_mean',base,chosen,'r46_week6_selected','recent_three','previous_season'):
              if candidate!='historical_mean' and safe_count(outerfit,candidate)<10:continue
              test_rows=test if candidate=='historical_mean' else [r for r in test if r['features'][candidate] is not None]
              tr=outerfit if candidate=='historical_mean' else [r for r in outerfit if r['features'][candidate] is not None]
              if not test_rows:continue
              par={'mx':0,'my':sum(r[outcome] for r in outerfit)/len(outerfit),'slope':0} if candidate=='historical_mean' else regress(tr,candidate,outcome)
              loss=score(test_rows,par,'ytd' if candidate=='historical_mean' else candidate,outcome)
              res.append({'cohort':cohort,'outcome':outcome,'selected':chosen,'candidate':candidate,'inner_loss_selected':next(v for v,f in ranks if f==chosen),
                'n_fit_pre2023':len(outerfit),'n_2023_25_test':len(test_rows),'test_years':'2023-2024 origins -> 2024-2025 labels',
                'test_loss':round(loss,7),'status':'HISTORICAL_TEST_READ_ONLY'})
             chosen_rows=[r for r in res if r.get('cohort')==cohort and r.get('outcome')==outcome and r.get('candidate')==chosen]
             control_rows=[r for r in res if r.get('cohort')==cohort and r.get('outcome')==outcome and r.get('candidate')=='ytd']
             if chosen_rows and control_rows:
              a,b=chosen_rows[-1]['test_loss'],control_rows[-1]['test_loss']
              decision.append({'cohort':cohort,'outcome':outcome,'selected_on_inner_2020_2021':chosen,
                               'n_2023_2024_origin_holdout':len(test),'test_selected_loss':a,'test_ytd_loss':b,
                               'improvement_pct':round(100*(b-a)/b,3) if b else None,
                               'beat_YTD':a<b-1e-9,
                               'prior_indicator_predicts_future_season':chosen in ('previous_season','r46_week6_selected','equal_all_three'),
                               'production_price_change_authorized':False})
           return res,decision

          def main_engine(assets,out,download=False,fixture=False):
           blobs={y:load_bytes(y,assets,download,fixture) for y in YEARS}
           ss,team,qa=parse_all(blobs)
           examples,q24,skips=build_cases(ss,team)
           rows,decision=adjudicate(examples)
           require(sum(r['cohort']=='has_prior' for r in decision)==3,'ESTABLISHED_QB_VALIDATION_MISSING')
           years=[{'year':y,'QB24_year_end_standard_points':round(q24[y],4)} for y in sorted(q24)]
           q=collections.Counter(x['year'] for x in examples)
           report=['# CAL26 V1R50 — Does Week 6 QB recency predict next season?','',
           '**Status:** WEEK6_TO_NEXT_SEASON_TEMPORAL_EVIDENCE_REVIEW_REQUIRED__NO_FV_CHANGE','',
           'R46 supported selected recency combinations for remaining-season scoring. R49 did not validate the age-risk multiplier for future surplus. R50 directly tests next season, not ROS.','',
           'Source: nflverse official stats_player weekly regular-season CSV 2016–2025; verified against all ten SHA256 byte pins in the successful R46 artifact, with a corrected 2017 SHA256 source-pin transcription; standard four-point passing TD scoring, NOT exact LOG scoring.',
           'Eligibility and zero-team-game rules match R46 Week6: >=80 passes, 3 QB games with >=10 passes, actual team game weeks, missing player outcome next COMPLETE season = zero NFL output, NOT retirement.',
           'Features strictly use Week1–6 of anchor season (plus previous completed season); no information from later games of anchor season enters predictors. Outcomes are NEXT complete season.',
           'Temporal split: inner fit anchor years 2017–2018 (labels through 2019), inner selection years 2020–2021 (labels 2021–22), final fitting anchors 2017–2021 (labels through 2022), unseen final test anchor years 2023–2024 (labels 2024–25). The 2022 anchor is embargoed from test because its future outcome was used in final model fitting/selection.',
           'Predictors are separate univariate intercept+slope ridge estimates; shrink slope by 12 pseudo-cases. No user prices, DLF MV, 2026 stats or protected holdouts are read. Candidate weights were fixed before outcome evaluation.',
           'Outcome QB24 threshold is computed independently from future season completed NFLverse points; historical missing season output counted 0 as participation/output outcome.',
           '', '## Results: improvement vs YTD-only calibrated predictor (positive means better)',
           '| Cohort | Next season target | Inner-selected signal | Final test n | Change in MSE/Brier | Beats YTD? |',
           '|---|---|---|---:|---:|---|']
           for row in decision:
            improvement='N/A (zero baseline loss)' if row['improvement_pct'] is None else f"{row['improvement_pct']:+.2f}%"
            report.append(f"| {row['cohort']} | {row['outcome']} | {row['selected_on_inner_2020_2021']} | {row['n_2023_2024_origin_holdout']} | {improvement} | {row['beat_YTD']} |")
           report.extend(['','## Rigor and limitations',
           'The R46 policy is a prespecified candidate, **not** assumed to win future-season prediction; best inner model is selected before final test. Neither a gain in ROS nor better rank correlation proves better dynasty prices.',
           'Individual next-season labels are player-specific (same stable NFLverse QB ID). Each year may appear as the following-season label of previous origin, but training and outer labels have no chronological overlap.',
           'One-year follow-up only; no one-year result establishes 3+ year career value, missing opportunity for rookie/developing QBs, or expected retirement.',
           'Scoring and preseason-to-realized projections remain unresolved. Numerical FV repricing **not permitted**. R45R1 54-QB shadow and R47R1 matched-QB table remain unmodified.',
           'Promotion requires repeated temporal evaluation, model improvements in appropriate cohorts, and compatible scoring/scale; green workflow means valid execution only.',''])
           out.mkdir(parents=True,exist_ok=True)
           data={
            ORIGIN+'_holdout_model_comparisons.csv':emit_csv(rows,['cohort','outcome','selected','candidate','inner_loss_selected','n_fit_pre2023','n_2023_25_test','test_years','test_loss','status']),
            ORIGIN+'_six_decisions.csv':emit_csv(decision,['cohort','outcome','selected_on_inner_2020_2021','n_2023_2024_origin_holdout','test_selected_loss','test_ytd_loss','improvement_pct','beat_YTD','prior_indicator_predicts_future_season','production_price_change_authorized']),
            ORIGIN+'_annual_QB24.csv':emit_csv(years,['year','QB24_year_end_standard_points']),
            ORIGIN+'_historical_source_QA.csv':emit_csv(qa,['year','qb_unique','qb_week_rows','team_count']),
            ORIGIN+'_findings.md':'\n'.join(report),
           }
           for n,s in data.items():(out/n).write_text(s,encoding='utf-8')
           m={'workflow':'CAL26 V1R50R1 - QB Week6 Recency Source SHA256 Pin Repair (Read Only)',
           'semantic_status':'WEEK6_TO_NEXT_SEASON_TEMPORAL_EVIDENCE_REVIEW_REQUIRED__NO_FV_CHANGE',
           'production_change_authorized':False,'index_html_modified':False,'R45_R47_shadow_pricing_modified':False,
           'R46_recency_merged_as_predeclared_candidate':True,'R49_age_guard_promoted':False,
           '2026_realized_outcomes_read':False,'protected_2026_holdout_read':False,'owner_prices_or_DLF_MV_fit':False,
           'R46_PINSET_MANIFEST_DIGEST':PINSET_MANIFEST_DIGEST, 'R46_2017_SHA256_PIN_REPAIRED':True,
           'source_scoring':'nflverse_standard_not_exact_LOG', 'n_source_years':len(blobs),'source_sha256':{str(y):sha(b) for y,b in blobs.items()},
           'qb_annual_sample_count':len(examples),'anchor_year_counts':{str(y):q[y] for y in (*FIT_FINAL,*TEST)},
           'n_holdout_decisions':len(decision),'n_model_comparison_rows':len(rows),
           'candidate_signals':list(FEATURES),'inner_fit_origins':list(FIT_INNER),'inner_select_origins':list(INNER),
           'outer_fit_origins':list(FIT_FINAL),'outer_test_origins':list(TEST),'test_outcome_last_season':2025,
           'R46_source_shas_pin_verified':not fixture,'source_QA':qa,'skips':skips,'output_sha256':{n:sha(s.encode()) for n,s in data.items()}}
           (out/(ORIGIN+'_manifest.json')).write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
           print(json.dumps({'status':m['semantic_status'],'n_examples':len(examples),'decision_rows':len(decision),'wins':sum(v['beat_YTD'] for v in decision),'source_pin_verified':m['R46_source_shas_pin_verified']}))
           return m

          def selftest():
           require(set(PIN)==set(YEARS),'PIN_YEAR_COVERAGE')
           require(all(re.fullmatch('[0-9a-f]{64}',v) for v in PIN.values()),'PIN_SHA256_HEX_LENGTH_INVALID')
           pinset=json.dumps({str(y):PIN[y] for y in sorted(PIN)},sort_keys=True,separators=(',',':')).encode()
           require(sha(pinset)==PINSET_MANIFEST_DIGEST,'R46_VERIFIED_PINSET_MANIFEST_MISMATCH')
           assert set(FIT_FINAL).isdisjoint(TEST)
           assert max(FIT_FINAL)+1<min(TEST) and max(FIT_INNER)+1<min(INNER)
           r=[{'features':{'ytd':0},'future_ratio_surplus':0},{'features':{'ytd':8},'future_ratio_surplus':1}]
           a=regress(r,'ytd','future_ratio_surplus');require(0<a['slope']<.125,'RIDGE_SHRINK_TEST')
           require(abs(predict(r[0],a,'ytd','future_ratio_surplus')-a['my']+a['slope']*a['mx'])<1e-9,'PREDICT_TEST')
           print('SELFTEST_GREEN chronology, ridge shrink, prediction and frozen years')

          def main():
           p=argparse.ArgumentParser()
           p.add_argument('--assets',type=pathlib.Path,default=pathlib.Path('r50-assets'))
           p.add_argument('--out',type=pathlib.Path,default=pathlib.Path('r50-results'))
           p.add_argument('--download',action='store_true');p.add_argument('--fixture',action='store_true');p.add_argument('--selftest',action='store_true')
           a=p.parse_args()
           if a.selftest:selftest();return
           main_engine(a.assets,a.out,a.download,a.fixture)

          if __name__=='__main__':main()
          PY_CAL26_V1R56_R50_CORE
          cat > "$RUNNER_TEMP/CAL26_V1R56_engine.py" <<'PY_CAL26_V1R56_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R56: LOG-core Week6 -> next-season QB recency; numerical sensitivity only.
          2026 Week6 source is frozen R47R1 artifact, no 2026 nflverse retrieval, no post-W6 outcomes.
          Historical source 2016-2025 pinned to successful R55 byte digests.
          """
          from __future__ import annotations
          import argparse, collections, csv, hashlib, io, json, math, pathlib, sys
          import cal26_v1r56_r50_core as r50
          ROOT='CAL26_V1R56'
          PINS={
           'R55':{
           'qb':('CAL26_V1R55_54_QB_LOG_calibrated_num_SHADOW_not_FV.csv','86b12e2a29b33737a8d308378f8aab5052a4b75c69a59443fbd1f8fabf7d590a'),
           'manifest':('CAL26_V1R55_manifest.json','3c970e52c25759e6b8e1e4de62eda12e31f0aab6b079179dd82b145fc6c5cf2e')},
           'R47':{
           'qb':('CAL26_V1R47_54_QB_two_track_evidence.csv','7dc0733a1f6cb27ce47a1bd77b3fde03d263d20f43fd3477722846f5f980515e'),
           'manifest':('CAL26_V1R47_manifest.json','08fecccd8025e71c04ec7323483f194bf79c31cc71298ba844868cd248791269')}
          }
          REQUIRED_LOG={'passing_yards','rushing_yards','receiving_yards','carries','receptions','fantasy_points'}
          DIAG=('bryce young','jayden daniels','cj stroud','caleb williams','drake maye','matthew stafford')

          def req(ok,msg):
           if not ok:raise AssertionError(msg)
          def sha(b):return hashlib.sha256(b).hexdigest()
          def fnum(x):return r50.fnum(x)
          def csvtxt(rs,cols):return r50.emit_csv(rs,cols)
          def input_art(path,fixture):
           d={};provenance={}
           for group,files in PINS.items():
            d[group]={};provenance[group]={}
            for label,(name,h) in files.items():
             req(len(h)==64 and all(c in '0123456789abcdef' for c in h),'MALFORMED_ARTIFACT_DIGEST')
             v=(path/group/name).read_bytes()
             req(sha(v)==h,f'PIN_DRIFT_{group}_{label}');d[group][label]=v;provenance[group][label]=h
           m55=json.loads(d['R55']['manifest']);m47=json.loads(d['R47']['manifest'])
           req(m55['n_54_QB_candidates']==54 and m55['production_change_authorized'] is False and m55['2026_realized_read'] is False,'R55_HOLD_VIOLATION')
           req(m47['QB_54_frozen_rows']==54 and m47['QB_week6_eligible_matched']==31 and m47['weeks7_or_later_QB_stats_parsed'] is False,'R47_FROZEN_WEEK6_VIOLATION')
           rows55=list(csv.DictReader(io.StringIO(d['R55']['qb'].decode())));rows47=list(csv.DictReader(io.StringIO(d['R47']['qb'].decode())))
           req(len(rows55)==len(rows47)==54,'EXPECTED_54_QB_ROWS')
           return rows55,rows47,provenance

          def log_score(item):
           pas=fnum(item['passing_yards']);rush=fnum(item['rushing_yards']);rec=fnum(item['receiving_yards'])
           x=fnum(item['fantasy_points'])+.2*fnum(item['carries'])+.5*fnum(item['receptions'])
           return x+(3 if pas>=400 else 2 if pas>=300 else 0)+(3 if rush>=200 else 2 if rush>=100 else 0)+(3 if rec>=200 else 2 if rec>=100 else 0)

          def convert(blob,year):
           rdr=csv.DictReader(io.StringIO(blob.decode('utf-8-sig')))
           fields=list(rdr.fieldnames or [])
           req(REQUIRED_LOG<=set(fields),f'R55_LOG_CORE_FIELDS_MISSING_{year}:{sorted(REQUIRED_LOG-set(fields))}')
           out=io.StringIO(newline='');w=csv.DictWriter(out,fieldnames=fields,lineterminator='\n');w.writeheader()
           n=0
           for item in rdr:
            if item['position']=='QB' and item['season_type'].strip().upper()=='REG':
             item['fantasy_points']=format(log_score(item),'.8f');n+=1
            w.writerow(item)
           req(n>100 or n>=40 and year==2016,'INSUFFICIENT_QB_WEEK_ROWS')
           return out.getvalue().encode(),n

          def fit_ppg_conversion(std,log):
           # Historical same-QB same-origin Week6 YTD. This calibration is restricted to training anchors.
           k={(r['year'],r['pid']):r for r in log}
           pairs=[]
           for s in std:
            t=k.get((s['year'],s['pid']))
            if t is None:continue
            pairs.append({'year':s['year'],'pid':s['pid'],'std_ytd':s['features']['ytd'],'log_ytd':t['features']['ytd']})
           fit=[r for r in pairs if r['year'] in r50.FIT_FINAL]
           test=[r for r in pairs if r['year'] in r50.TEST]
           req(len(fit)>=40 and len(test)>=25,'PPG_TRANSFER_SAMPLE_SMALL')
           # Use a single nonnegative slope through origin, shrink towards identity by 20 standard samples.
           sxx=sum(r['std_ytd']**2 for r in fit);sxy=sum(r['std_ytd']*r['log_ytd'] for r in fit)
           alpha=(sxy+20)/(sxx+20)
           req(.8<=alpha<=1.8,'PPG_TRANSFER_SLOPE_IMPLAUSIBLE')
           def mse(rows,a):return sum((r['log_ytd']-a*r['std_ytd'])**2 for r in rows)/len(rows)
           return {'factor':alpha,'train_n':len(fit),'test_n':len(test),'test_mse_identity':mse(test,1),'test_mse_factor':mse(test,alpha),'test_years':'2023;2024'}

          def holdout_benchmark(cases):
           # Next-season ratio surplus, directly matching R50 target and outer holdout cohorts.
           results=[];decisions=[];models={}
           for cohort in ('has_prior','no_prior'):
            filt=lambda r: r['prior_available']==(cohort=='has_prior')
            fit_inner=[x for x in cases if x['year'] in r50.FIT_INNER and filt(x)]
            select_inner=[x for x in cases if x['year'] in r50.INNER and filt(x)]
            fit_final=[x for x in cases if x['year'] in r50.FIT_FINAL and filt(x)]
            test=[x for x in cases if x['year'] in r50.TEST and filt(x)]
            available=[]
            for feat in r50.FEATURES:
             fit=[x for x in fit_inner if x['features'][feat] is not None]
             validate=[x for x in select_inner if x['features'][feat] is not None]
             held=[x for x in test if x['features'][feat] is not None]
             if min(len(fit),len(validate),len(held))<6 or len(fit)<10:continue
             p=r50.regress(fit,feat,'future_ratio_surplus')
             err=r50.score(validate,p,feat,'future_ratio_surplus')
             available.append((err,feat))
            req(any(z[1]=='ytd' for z in available),f'YTD_VALIDATION_MISSING_{cohort}')
            chosen=min(available,key=lambda z:(round(z[0],12),r50.FEATURES.index(z[1])))[1]
            selected_fit=r50.regress([x for x in fit_final if x['features'][chosen] is not None],chosen,'future_ratio_surplus')
            baseline_fit=r50.regress([x for x in fit_final if x['features']['ytd'] is not None],'ytd','future_ratio_surplus')
            test_matched=[r for r in test if r['features'][chosen] is not None and r['features']['ytd'] is not None]
            req(len(test_matched)>=6,f'NO_OUTER_TEST_CASES_{cohort}')
            a=r50.score(test_matched,selected_fit,chosen,'future_ratio_surplus')
            b=r50.score(test_matched,baseline_fit,'ytd','future_ratio_surplus')
            enabled=(chosen!='ytd' and a<b-1e-9 and len(test_matched)>=(25 if cohort=='no_prior' else 20) and len(fit_final)>=25)
            row={'cohort':cohort,'selected_inner_2020_2021':chosen,'holdout_origins':'2023;2024','holdout_n':len(test_matched),
             'train_final_n':len(fit_final),'selected_MSE':round(a,8),'YTD_MSE':round(b,8),
             'MSE_gain_pct':round(100*(b-a)/b,4) if b else None,
             'model_beats_YTD':a<b-1e-9,'numerical_recency_sensitivity_enabled':enabled,
             'FV_production_reprice_authorized':False}
            decisions.append(row);models[cohort]={'selected':selected_fit,'baseline':baseline_fit,'signal':chosen,'enabled':enabled}
            for feat in ('ytd',chosen,'equal_all_three','r46_week6_selected','previous_season','recent_three'):
             if r50.safe_count(fit_final,feat)<10:continue
             valid=[x for x in test if x['features'][feat] is not None]
             if not valid:continue
             p=r50.regress([x for x in fit_final if x['features'][feat] is not None],feat,'future_ratio_surplus')
             results.append({'cohort':cohort,'signal':feat,'n':len(valid),'holdout_MSE':round(r50.score(valid,p,feat,'future_ratio_surplus'),8),'selected_inner':chosen})
           return decisions,results,models

          def make(assets,art,out,download,fixture):
           raw={y:r50.load_bytes(y,assets,download,fixture) for y in r50.YEARS}
           logblobs={};coverage=[]
           for y,b in raw.items():
            logblobs[y],n=convert(b,y);coverage.append({'year':y,'qb_week_rows_LOG_converted':n,'raw_source_SHA256':sha(b)})
           stdseason,stdteams,_=r50.parse_all(raw)
           logseason,logteams,logqa=r50.parse_all(logblobs)
           standard,_,_=r50.build_cases(stdseason,stdteams)
           logcases,thresholds,skips=r50.build_cases(logseason,logteams)
           req([(r['year'],r['pid']) for r in standard]==[(r['year'],r['pid']) for r in logcases],'STD_LOG_COHORT_MISMATCH')
           ppg=fit_ppg_conversion(standard,logcases)
           decisions,comparisons,models=holdout_benchmark(logcases)
           qbs55,qbs47,pins=input_art(art,fixture)
           by47={r['name']:r for r in qbs47}
           req(set(by47)=={r['name'] for r in qbs55},'NAME_MATCH_DRIFT')
           outrows=[]
           for v in qbs55:
            name=v['name'];s=by47[name]
            qualified=s['R46_2026_week6_qualifies']=='True'
            prior=s['has_usable_2025_prior']=='True'
            cohort='has_prior' if prior else 'no_prior'
            mdl=models[cohort]
            row={'name':name,'frozen_FV_UNCHANGED':v['frozen_FV_UNCHANGED'],
             'R55_paired_20units_ILLUSTRATIVE_NOT_FV':v['R55_paired_20units_ILLUSTRATIVE_NOT_FV'],
             'R47_Week6_qualified':qualified,'historical_cohort':cohort,
             'R56_selected_LOG_signal':mdl['signal'] if qualified else 'NOT_ELIGIBLE',
             'R56_inner_selected_holdout_better':mdl['enabled'] if qualified else False,
             '2026_std_to_LOG_PPG_factor_HISTORICALLY_ESTIMATED':round(ppg['factor'],6),
             'R56_next_season_LOG_QB24_surplus_ratio_baseline':None,
             'R56_next_season_LOG_QB24_surplus_ratio_selected':None,
             'R56_next_season_QB24_ratio_delta_NOT_FV':None,
             'hypothetical_next_year_20_units_proxy_difference_NOT_FV':None,
             'hypothetical_R55_shadow_plus_one_year_delta_NOT_FV':None,
             '2026_exact_player_specific_last3_LOG_scoring_verified':False,
             'future_2026_holdout_read':False,'production_reprice_authorized':False}
            if qualified:
             # R47 locked 2026 Week6 standard nflverse features. Do not download 2026 or touch future outcomes.
             def c(key):
              raw=s[key]
              return None if raw in ('',None) else r50.fnum(raw)*ppg['factor']
             last=c('recent3_std_ppg');ytd=c('ytd_std_ppg');previous=c('prior2025_std_ppg') if prior else None
             vals={'previous_season':previous,'ytd':ytd,'recent_three':last,
              'r46_week6_selected':(previous+last)/2 if previous is not None else ytd,
              'equal_recent_ytd':(last+ytd)/2,
              'equal_all_three':(last+ytd+previous)/3 if previous is not None else (last+ytd)/2}
             feat=mdl['signal'];req(vals[feat] is not None,'2026_REQUIRED_FEATURE_MISSING')
             guess={'features':vals}
             baseline=r50.predict(guess,mdl['baseline'],'ytd','future_ratio_surplus')
             candidate=r50.predict(guess,mdl['selected'],feat,'future_ratio_surplus')
             row['R56_next_season_LOG_QB24_surplus_ratio_baseline']=round(baseline,5)
             row['R56_next_season_LOG_QB24_surplus_ratio_selected']=round(candidate,5)
             # Do not treat real 2025 QB24 as 2027 target; this is just a comparative 2026 QB24 UNIT sensitivity.
             if mdl['enabled']:
              delta=candidate-baseline
              pts=delta*float(v['QB24_projected_baseline'])
              hypothetical=round(.9*20*pts)
              row['R56_next_season_QB24_ratio_delta_NOT_FV']=round(delta,5)
              row['hypothetical_next_year_20_units_proxy_difference_NOT_FV']=hypothetical
              row['hypothetical_R55_shadow_plus_one_year_delta_NOT_FV']=int(v['R55_paired_20units_ILLUSTRATIVE_NOT_FV'])+hypothetical
            outrows.append(row)
           req(len(outrows)==54 and len({r['name'] for r in outrows})==54,'OUTPUT_INCOMPLETE')
           req(sum(r['R47_Week6_qualified'] for r in outrows)==31,'R47_MATCHED_COUNT_DRIFT')
           qa={'workflow':'CAL26 V1R56 - LOG Week6 Breakout Persistence and QB FV Shadow Sensitivity (Read Only)',
           'semantic_status':'LOG_WEEK6_TO_NEXTSEASON_HOLDOUT_AND_NUMERICAL_SENSITIVITY__FV_HOLD',
           'historical_source_years':list(r50.YEARS),'R55_source_shas_pins_verified':not fixture,
           'historical_scoring':'LOG_CORE_nflverse_delta_not_full_exact_Sleeper',
           'R50_temporal_inner_fit':list(r50.FIT_INNER),'R50_temporal_inner_selection':list(r50.INNER),
           'final_train_origin_years':list(r50.FIT_FINAL),'final_test_origin_years':list(r50.TEST),
           'embargo_2022_origin':True,'2026_observations_read':'R47R1_FROZEN_WEEK6_ONLY',
           'protected_2026_weeks8_12_read':False,'2026_week7_or_later_stats_read':False,
           '2026_2027_outcomes_read':False,'owner_targets_used':False,'market_values_used_as_labels':False,
           'production_change_authorized':False,'index_html_modified':False,'owner_overrides_changed':False,
           'R55_paired_num_shadow_repriced':False,'54_QB_joined':len(outrows),
           '2026_eligible_QBs':sum(x['R47_Week6_qualified'] for x in outrows),
           '2026_sensitivity_rows':sum(x['hypothetical_next_year_20_units_proxy_difference_NOT_FV'] is not None for x in outrows),
           'historical_training_case_count':len(logcases), 'LOG_core_ppg_conversion':ppg,
           'cohort_holdout_decisions':decisions,'missing_exact_2026_player_week_LOG_last3':True,
           '2027_replacement_levels_derived':False,'shared_cardinal_FV_scale_authorized':False,
           'input_artifact_pins':pins, 'skips':skips}
           report=['# CAL26 V1R56 — LOG-core Week6 next-season breakout persistence and numeric sensitivity','',
            '**Production:** HOLD — no FV repricing, no index.html edits, no overrides modified.','',
            'R55 paired LOG conversion and multi-year historical tiers established a credible research starting point. R56 directly tests whether the 2026 Week6 breakout signal forecasts NEXT season when both features and target are LOG-core normalized (not standard units).','',
            'Historical origins 2017–21 fit (2017–18 inner fit; 2020–21 inner selection), 2022 embargoed, 2023–24 unseen chronological final test, labels complete through 2025. Missing future QB output counted 0, not assumed retirement. Historical same-player NFLverse LOG-core scoring adds rushing attempts, half-PPR and weekly milestones over standard.',
            '', '## Final holdout — next-season above-QB24 surplus ratio',
            '| Cohort | Inner selected | Holdout n | Selected MSE | YTD MSE | Gain vs YTD | Sensitivity allowed? |',
            '|---|---|---:|---:|---:|---:|---|']
           for d in decisions:
            report.append(f"| {d['cohort']} | {d['selected_inner_2020_2021']} | {d['holdout_n']} | {d['selected_MSE']:.6f} | {d['YTD_MSE']:.6f} | {d['MSE_gain_pct']:+.2f}% | {d['numerical_recency_sensitivity_enabled']} |")
           report.extend(['','## Scoring compatibility on held-out 2023–24 Week6 features',
           f"Standard-to-LOG-core Week6 PPG factor {ppg['factor']:.5f}, historical train n={ppg['train_n']} and holdout n={ppg['test_n']}; heldout MSE identity={ppg['test_mse_identity']:.4f} vs fitted={ppg['test_mse_factor']:.4f}.",
           'This is a single historical average transfer and NOT an exact player-specific conversion of 2026 recent3 or prior year. The 2026 R47 Week6 data were frozen as STANDARD PPG; only R47 historical LOG active PPG is available separately. Do NOT consider 2026 player-specific conversion established.',
           '', '## Numeric sensitivity on the frozen R55 QB shadow',
           'Where the heldout LOG recency estimator beats YTD and has sample coverage, R56 computes the one-year estimate difference vs same-cohort YTD baseline, then a deliberately ILLUSTRATIVE 20 units per 2026 projected QB24 point, 10% year1 discount. It is shown as a possible sensitivity to R55 shadow only, not a recommended FV adjustment. Nothing else in R55 changes.',
           '| QB | Current FV | R55 illustrative | R56 chosen feature | One-year effect if empirically enabled (not FV) |',
           '|---|---:|---:|---|---:|'])
           ix={r['name']:r for r in outrows}
           for nm in DIAG:
            r=ix[nm];d=r['hypothetical_next_year_20_units_proxy_difference_NOT_FV'];report.append(f"| {nm} | {r['frozen_FV_UNCHANGED']} | {r['R55_paired_20units_ILLUSTRATIVE_NOT_FV']} | {r['R56_selected_LOG_signal']} | {d if d is not None else 'WITHHELD'} |")
           report.extend(['', '## Limitations and exact next step',
           'The test validates one future season only; not every 2–3 year future or veteran career continuation. R55 future horizons 2/3 retain their separate evidence. Test counts for no-prior QBs may be small; positive point estimate without support will not trigger proxy modification.',
           'The frozen 2026 Week6 standard-to-LOG factor cannot account for QB rushing-specific scoring or individual yardage bonuses. A fully LOG-native 2026 last-three-game feed and prospectively validated starter-level replacement standard remain necessary before real pricing.',
           'A positive or negative dollar-like 20x sensitivity is NOT a calibrated dynasty FV. Do not compare it directly with live FV to declare player mispricing. Do not target owner expected QB prices or DLF MV.',
           '**Next production-directed step:** use the cohort LOG-core holdout decision to identify usable recency signal, then pair with exact 2026 LOG weeks1–6 and a shared cross-position replacement/scale review for a genuine owner-approval proposal.',''])
           out.mkdir(parents=True,exist_ok=True)
           products={ROOT+'_cohort_LOG_next_season_holdout.csv':csvtxt(decisions,list(decisions[0])),
            ROOT+'_candidate_LOG_holdout_loss.csv':csvtxt(comparisons,list(comparisons[0])),
            ROOT+'_54_QB_recency_numerical_sensitivity_NOT_FV.csv':csvtxt(outrows,list(outrows[0])),
            ROOT+'_source_QA.csv':csvtxt(coverage,list(coverage[0])),
            ROOT+'_findings.md':'\n'.join(report)}
           for name,data in products.items():(out/name).write_text(data,encoding='utf-8')
           qa['output_sha256']={name:sha(data.encode()) for name,data in products.items()}
           (out/(ROOT+'_manifest.json')).write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n')
           print(json.dumps({'status':qa['semantic_status'],'historical_cases':len(logcases), 'holdout_n':{x['cohort']:x['holdout_n'] for x in decisions}, 'decision_wins':{x['cohort']:x['model_beats_YTD'] for x in decisions}, 'qualified_2026':qa['2026_eligible_QBs'],'sensitivity_rows':qa['2026_sensitivity_rows'],'research_only':True}))
           return qa

