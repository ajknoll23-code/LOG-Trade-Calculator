name: Fix Trade Desk UI21 Launcher Visibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify locked preview and production
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PREVIEW_BLOB="216015cc479184e288f80dffc3c57a5cdafa36dd"
          EXPECTED_INDEX_BLOB="0f587dcb9740d0986acc705b305cdaa6217c0ae9"

          ACTUAL_PREVIEW_BLOB="$(git hash-object trade-desk-preview.html)"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"

          echo "Expected preview: $EXPECTED_PREVIEW_BLOB"
          echo "Actual preview:   $ACTUAL_PREVIEW_BLOB"
          echo "Expected index:   $EXPECTED_INDEX_BLOB"
          echo "Actual index:     $ACTUAL_INDEX_BLOB"

          test "$ACTUAL_PREVIEW_BLOB" = "$EXPECTED_PREVIEW_BLOB"
          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Apply launcher visibility override
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade-desk-preview.html")
          text = path.read_text(encoding="utf-8")

          marker = "UI21_LAUNCHER_VISIBILITY_FIX_V1"

          if marker in text:
              raise SystemExit(f"{marker} already present; refusing to double-apply.")

          required = [
              "UI21_ADD_CONTROLS_RENDER_FIX_V1",
              ".ui21-add-launcher",
              ".ui21-add-launcher-btn",
              ".side:not(.ui21-add-open) .add-controls > :not(.ui21-add-asset-toggle)",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(
                  "Expected UI2.1 add-controls code missing: " + ", ".join(missing)
              )

          css = r'''
          <style id="ui21-launcher-visibility-fix">
          /* UI21_LAUNCHER_VISIBILITY_FIX_V1
             Fixes specificity conflict with the earlier UI2.1 closed-form rule.
             The launcher was in the DOM but the older selector hid it. */

          .side:not(.ui21-add-open) .add-controls > .ui21-add-launcher{
            display:grid!important;
          }

          /* Safety fallback: if the launcher script ever fails to insert its
             replacement controls, keep the original Player / Draft Pick tabs
             visible instead of leaving a blank side card. */
          .side:not(.ui21-add-open) .add-controls:not(:has(.ui21-add-launcher)) > .tab-row{
            display:flex!important;
          }
          </style>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())

          if "</head>" not in text:
              raise RuntimeError("Preview missing closing </head>")

          text = text.replace("</head>", css + "\n</head>", 1)

          old_selector = (
              ".side:not(.ui21-add-open) .add-controls > "
              ":not(.ui21-add-asset-toggle)"
          )
          fix_selector = (
              ".side:not(.ui21-add-open) .add-controls > "
              ".ui21-add-launcher"
          )

          if text.rfind(fix_selector) <= text.find(old_selector):
              raise RuntimeError(
                  "Visibility override does not occur after conflicting rule"
              )

          if text.count(marker) != 1:
              raise RuntimeError(
                  f"Unexpected {marker} count: {text.count(marker)}"
              )

          path.write_text(text, encoding="utf-8")
          print("PASS launcher visibility specificity fix")
          PY

      - name: Validate visual-state selectors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("trade-desk-preview.html").read_text(encoding="utf-8")

          block = re.search(
              r'<style id="ui21-launcher-visibility-fix">(.*?)</style>',
              html,
              flags=re.S,
          )
          if not block:
              raise SystemExit("Launcher visibility style block missing")

          css = block.group(1)

          required = [
              ".side:not(.ui21-add-open) .add-controls > .ui21-add-launcher",
              "display:grid!important",
              ".add-controls:not(:has(.ui21-add-launcher)) > .tab-row",
              "display:flex!important",
          ]
          missing = [token for token in required if token not in css]
          if missing:
              raise SystemExit(f"Visibility fix missing: {missing}")

          bad = [
              i for i, line in enumerate(css.splitlines(), 1)
              if line != line.rstrip()
          ]
          if bad:
              raise SystemExit(
                  f"Visibility CSS trailing whitespace at relative lines {bad[:10]}"
              )

          print("PASS closed launcher explicitly visible")
          print("PASS original tabs provide no-JS fallback")
          print("PASS visibility CSS whitespace")
          PY

      - name: Validate existing runtime guards
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Verify production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0f587dcb9740d0986acc705b305cdaa6217c0ae9"
          git diff --exit-code -- index.html

      - name: Commit preview visibility fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trade-desk-preview.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "trade-desk-preview.html"

          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi

          git commit -m "Fix Trade Desk UI2 launcher visibility"
          git push origin HEAD:main
