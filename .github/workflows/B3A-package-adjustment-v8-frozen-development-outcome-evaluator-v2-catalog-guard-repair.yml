name: B3A Package Adjustment V8 - Frozen Development Outcome Evaluator V2 Catalog Guard Repair

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: package-adjustment-v8-frozen-development-outcome-evaluator-v2-catalog-guard-repair
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FREEZE_CUTOFF_UTC: "2026-10-05T04:16:06.632518+00:00"
  FREEZE_SOURCE_RUN_ID: "37262731480"
  FREEZE_SOURCE_ARTIFACT_ID: "11324269339"
  FREEZE_SOURCE_ARTIFACT_DIGEST: "sha256:ff59845f52379f1a5b26fe47ac21f1a63a7632423391b47c62fa204092709cd8"
  FREEZE_SOURCE_SHEET_SHA256: "860a10d846f729682073c5cbeffb9a732109c49fb198ce1b215a9f4dd8826a0d"
  RESET16_CUTOFF_UTC: "2026-10-03T20:20:10.208764+00:00"
  RESET35_CUTOFF_UTC: "2026-10-04T14:08:53.081814+00:00"
  RESET44_CUTOFF_UTC: "2026-10-04T15:38:35.088288+00:00"
  EXPECTED_VOTER_HASHES_JSON: '{"1":"bab4ba8c228d1943","10":"e901f1cfb63ff15d","11":"776524a97611bcc9","12":"7953de0fe1f3214c","13":"bcc520701bc5f7ed","14":"7a3d41c6daf3c172","15":"60e8d29e4c8514b3","16":"ec884544219939ec","17":"61754fbda18cbc0e","18":"4e68eabb69905f08","19":"ac1b5996e9b545a8","2":"7837c2633da640dd","20":"54fc693381c94dc7","21":"b3660d2d970e2f7c","22":"098c75dd664c4963","23":"93e2a3e9f5b4e872","24":"5ec27569ba14304f","25":"cc84997bf98fa154","26":"0d77999a2411efb6","27":"97b1d88f8b471bfe","28":"d3def7089d837393","29":"20b1fe2510164171","3":"0eef434e45a2d72b","30":"a4b8c4db770e8f0f","31":"d27e98ea1a6897c5","32":"781b0a33548a5c51","33":"16b33ef9deea2dd9","34":"239de487321bcdcf","35":"068edf501684bc6f","36":"ddd6c1b08a08558c","37":"28b6d065018b3929","38":"09d64eb07fbe9d6c","39":"ffcb222eb09efb4e","4":"bf9e60bd7946c031","40":"bffe34084fb31711","41":"b66169d918e381a8","42":"f0c993f2f080905c","43":"c4c688248e66a5f9","44":"e59d41afd8a1fa4b","45":"c84897500d4046c8","46":"6dec03827c57c1bb","47":"183ae64de9acff08","48":"6cf6e1cb040a8b57","49":"afdc1d5140950ae4","5":"32bb6a6eed030c81","50":"ac79f462f394d8ce","6":"9e5d9fab9c81b570","7":"30ce49a02eb5b17a","8":"a7f9ecc192201f5a","9":"94da0b5e61652078"}'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frozen evaluator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" "numpy==2.3.3" "scipy==1.16.2"

      - name: Guard pre-vote scientific contract and B2C #6 freeze provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v8/topology_split_preregistration_v1.json"]="0861346a483ed9938246fd04173408c47c012ee9"
            ["research/package-adjustment-v8/fixed50_protocol_amendment_v1.json"]="d2b931dc03acee62b10091f064737b125467b705"
            ["research/package-adjustment-v8/fixed50_protocol_amendment_manifest_v1.json"]="bbb41fa5a9ce3d3c95d5d5f808e181ebd64f2ef4"
            ["research/package-adjustment-v8/evaluation_protocol_v1.json"]="263db22eb41be6b458479d7fb76ad61f55b0bcd8"
            ["research/package-adjustment-v8/evaluation_engine_manifest_v1.json"]="6d49b1a1be4c3dd108820de9db7c370b0185a10b"
            ["research/package-adjustment-v8/evaluate_development_v1.py"]="bef73c81bdff771f51b4f18bea011b30a71e9935"
            ["research/package-adjustment-v8/evaluation_fold_assignment_v1.json"]="c9551211d4369d8234321e98223111cabee28d82"
            ["research/package-adjustment-v8/evaluation_harness_selftest_v1.json"]="ff8d6791a7cbb911bb73f55ce5f41e96d82e8162"
            ["research/package-adjustment-v8/development_catalog_manifest_v1.json"]="970d52eb39d093c27f6086ba018f62bd6d53217a"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
            ["research/package-adjustment-v8/development_voting_activation_manifest_v1.json"]="938bf754c90adeda8f3a5f863acfda8967c3818d"
            ["research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json"]="8258fe8ca41d6ccef16529ea9ade9da19d3ca2e2"
            ["research/package-adjustment-v8/voting_randomization_schedule_v1.json"]="c499d85b8473798294eccfe9310ec9644c1db3fc"
            ["research/package-adjustment-v8/voting_integrity_contract_v1.json"]="203fd97e27e31413b5c18e3f8c7ecd6fd06cfeb8"
          )
          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: frozen scientific artifact drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY2'
          import hashlib,json,os,requests
          from pathlib import Path

          d=Path('research/package-adjustment-v8')
          def load(n): return json.loads((d/n).read_text())
          def sha(n): return hashlib.sha256((d/n).read_bytes()).hexdigest()

          prereg=load('topology_split_preregistration_v1.json')
          amend=load('fixed50_protocol_amendment_v1.json')
          proto=load('evaluation_protocol_v1.json')
          mani=load('evaluation_engine_manifest_v1.json')
          catmani=load('development_catalog_manifest_v1.json')
          act=load('development_voting_activation_manifest_v1.json')
          integ=load('voting_integrity_contract_v1.json')

          assert prereg['status']=='FROZEN_PRE_POWER_PRE_CATALOG_PRE_VOTE'
          assert prereg['development_evaluation']['if_candidate_fails_any_gate']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert prereg['development_evaluation']['if_candidate_passes_all_gates']=='FREEZE_V8_TOPOLOGY_SPLIT_DEVELOPMENT_CANDIDATE_AND_BUILD_FRESH_CONFIRMATION_POWER'
          assert prereg['development_evaluation']['no_posthoc_rescue_model'] is True
          assert prereg['confirmation_if_development_passes']['fresh_nonoverlapping_challenge_catalog_required'] is True
          assert prereg['confirmation_if_development_passes']['automatic_production_promotion_allowed'] is False

          assert amend['status']=='FROZEN_PRE_CATALOG_PRE_VOTE_FIXED_50'
          assert amend['amended_development_maturity']['required_accepted_complete_voters']==50
          assert amend['amended_development_maturity']['required_accepted_ballots']==2000
          assert amend['amended_development_maturity']['early_stop_before_50_allowed'] is False

          assert proto['status']=='FROZEN_PRE_VOTE_EVALUATOR'
          assert proto['v8_votes_read'] is False
          assert proto['production_change_authorized'] is False
          assert proto['no_posthoc_rescue_model'] is True
          assert proto['accepted_dataset']=={'ballots':2000,'challenges':40,'complete_session_required':True,'duplicates_allowed':False,'voters':50}
          assert proto['candidates']==['C0_RAW_SUM','C1_TOPOLOGY_SPLIT_V6_TRANSFER']
          assert proto['gates']=={
            'all_six_topologies_improve_or_within':0.002,
            'bootstrap_one_sided_95_ucb_lt':0.0,
            'combined_cv_improvement_min':0.005,
            'delta_left_zero_ranking_unchanged':True,
            'folds_improved_min':4,
            'leave_one_player_out_positive_every_player':True,
            'mathematical_invariants_pass':True,
            'worst_topology_regression_max':0.01,
          }

          assert mani['status']=='PASS' and mani['v8_votes_read'] is False
          checks={
            'catalog_sha256':'development_catalog_v1.json',
            'evaluator_sha256':'evaluate_development_v1.py',
            'fixed50_amendment_manifest_sha256':'fixed50_protocol_amendment_manifest_v1.json',
            'fixed50_amendment_sha256':'fixed50_protocol_amendment_v1.json',
            'fold_assignment_sha256':'evaluation_fold_assignment_v1.json',
            'protocol_sha256':'evaluation_protocol_v1.json',
            'selftest_sha256':'evaluation_harness_selftest_v1.json',
          }
          for key,name in checks.items():
            assert mani[key]==sha(name),(key,mani[key],sha(name))
          assert proto['evaluator_sha256']==sha('evaluate_development_v1.py')
          assert proto['catalog_sha256']==sha('development_catalog_v1.json')

          # The evaluator was frozen against the full scientific catalog (contains FVs and
          # contrast metadata). Voting was activated from a deliberately voter-safe projection
          # that removes those hidden fields. Guard both hashes separately and prove that their
          # 40 challenge identities / displayed assets are exactly the same.
          assert catmani['outputs']['development_catalog_sha256']==sha('development_catalog_v1.json')
          assert catmani['outputs']['voter_safe_catalog_sha256']==sha('package_vote_challenges_v8_development_v1.json')
          assert catmani['challenge_signature_sha256']==proto['catalog_challenge_signature_sha256']
          assert act['catalog_sha256']==sha('package_vote_challenges_v8_development_v1.json')

          full_catalog=load('development_catalog_v1.json')
          voter_safe=load('package_vote_challenges_v8_development_v1.json')
          assert full_catalog['challenge_count']==voter_safe['challenge_count']==40
          def challenge_identity(c):
            return {
              'id':str(c['id']),
              'topology':c['topology'],
              'side_A':{
                'asset_count':c['side_A']['asset_count'],
                'assets':[{k:a[k] for k in ('key','name','pos','team')} for a in c['side_A']['assets']],
              },
              'side_B':{
                'asset_count':c['side_B']['asset_count'],
                'assets':[{k:a[k] for k in ('key','name','pos','team')} for a in c['side_B']['assets']],
              },
            }
          full_identity={str(c['id']):challenge_identity(c) for c in full_catalog['challenges']}
          safe_identity={str(c['id']):challenge_identity(c) for c in voter_safe['challenges']}
          assert full_identity==safe_identity

          assert act['accepted_complete_voters_exactly']==50 and act['accepted_ballots_exactly']==2000
          assert integ['accepted_voters']==50 and integ['accepted_ballots']==2000
          assert integ['maturity_monitor_outcome_blind'] is True

          expected_hashes=json.loads(os.environ['EXPECTED_VOTER_HASHES_JSON'])
          assert set(expected_hashes)=={str(i) for i in range(1,51)}
          assert len(set(expected_hashes.values()))==50

          # Verify the exact B2C #6 artifact metadata without opening any vote outcomes.
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{os.environ['FREEZE_SOURCE_ARTIFACT_ID']}"
          headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28'}
          r=requests.get(url,headers=headers,timeout=30); r.raise_for_status(); a=r.json()
          assert a['workflow_run']['id']==int(os.environ['FREEZE_SOURCE_RUN_ID'])
          assert a.get('digest')==os.environ['FREEZE_SOURCE_ARTIFACT_DIGEST'],(a.get('digest'),os.environ['FREEZE_SOURCE_ARTIFACT_DIGEST'])
          assert a['name']=='package-adjustment-v8-development-maturity-v5-slot44-reset'
          print('PASS: pre-vote evaluator, dual catalog provenance, gates, fixed-50 contract, and exact B2C #6 freeze provenance are unchanged.')
          PY2

      - name: Frozen evaluator self-test before outcome opening
        shell: bash
        run: |
          set -euo pipefail
          python3 research/package-adjustment-v8/evaluate_development_v1.py \
            --catalog research/package-adjustment-v8/development_catalog_v1.json \
            --selftest > /tmp/v8-evaluator-selftest.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/v8-evaluator-selftest.json'))
          assert x['status']=='PASS'
          assert x['synthetic_dataset_validation']=={'voters':50,'ballots':2000,'challenges':40}
          assert x['math_invariants'] is True
          print('PASS: frozen evaluator self-test completed before human outcomes were opened.')
          PY

      - name: Write immutable outcome-opening manifest while still outcome-blind
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v8-b3
          mkdir -p /tmp/package-adjustment-v8-b3
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          doc={
            'schema_version':1,
            'study_id':'package-adjustment-v8-topology-split-multi-v-multi',
            'stage':'b3_frozen_development_outcome_opening',
            'status':'FROZEN_BEFORE_OUTCOME_OPENING',
            'source_maturity_workflow':'B2C Package Adjustment V8 - Outcome-Blind Maturity Monitor V5 Slot 44 Reset',
            'source_run_id':int(os.environ['FREEZE_SOURCE_RUN_ID']),
            'source_artifact_id':int(os.environ['FREEZE_SOURCE_ARTIFACT_ID']),
            'source_artifact_digest':os.environ['FREEZE_SOURCE_ARTIFACT_DIGEST'],
            'source_maturity_generated_at_utc':os.environ['FREEZE_CUTOFF_UTC'],
            'source_sheet_sha256_at_maturity':os.environ['FREEZE_SOURCE_SHEET_SHA256'],
            'accepted_voters_exactly':50,
            'accepted_ballots_exactly':2000,
            'accepted_slots_exactly':'1-50',
            'expected_voter_hash_by_slot':json.loads(os.environ['EXPECTED_VOTER_HASHES_JSON']),
            'reset_cutoffs_utc':{'16':os.environ['RESET16_CUTOFF_UTC'],'35':os.environ['RESET35_CUTOFF_UTC'],'44':os.environ['RESET44_CUTOFF_UTC']},
            'evaluation_protocol':'research/package-adjustment-v8/evaluation_protocol_v1.json',
            'evaluation_catalog':'research/package-adjustment-v8/development_catalog_v1.json',
            'voter_safe_catalog':'research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json',
            'evaluator':'research/package-adjustment-v8/evaluate_development_v1.py',
            'posthoc_threshold_changes_allowed':False,
            'posthoc_rescue_model_allowed':False,
            'automatic_production_change_authorized':False,
            'human_vote_outcomes_read_to_create_this_manifest':False,
          }
          Path('/tmp/package-adjustment-v8-b3/outcome_opening_manifest.json').write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          print('PASS: immutable B3 opening manifest written before outcome parsing.')
          PY

      - name: Open only the frozen 50-voter dataset and build evaluator input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import csv,hashlib,io,json,os,re
          from collections import Counter,defaultdict
          from datetime import datetime,timezone
          from pathlib import Path
          import requests

          D=Path('research/package-adjustment-v8')
          OUT=Path('/tmp/package-adjustment-v8-b3')
          SHEET_URL=(
            'https://docs.google.com/spreadsheets/d/e/'
            '2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/'
            'pub?gid=458294959&single=true&output=csv'
          )
          VOTE_PREFIX='__pkgv8dev__|'; SCHEMA_MARKER='__pkgv8dev_schema__|1'

          def load(n): return json.loads((D/n).read_text())
          def parse_utc(value):
            s=str(value or '').strip()
            if not s:return None
            if s.endswith('Z'):s=s[:-1]+'+00:00'
            try:dt=datetime.fromisoformat(s)
            except ValueError:return None
            if dt.tzinfo is None:dt=dt.replace(tzinfo=timezone.utc)
            return dt.astimezone(timezone.utc)

          act=load('development_voting_activation_manifest_v1.json')
          cat=load('package_vote_challenges_v8_development_v1.json')
          sched=load('voting_randomization_schedule_v1.json')
          challenges={str(c['id']):c for c in cat['challenges']}
          challenge_ids=set(challenges)
          activation_cutoff=parse_utc(act['valid_ballot_start_utc']); assert activation_cutoff
          freeze_cutoff=parse_utc(os.environ['FREEZE_CUTOFF_UTC']); assert freeze_cutoff
          reset_cutoffs={16:parse_utc(os.environ['RESET16_CUTOFF_UTC']),35:parse_utc(os.environ['RESET35_CUTOFF_UTC']),44:parse_utc(os.environ['RESET44_CUTOFF_UTC'])}
          expected_hashes=json.loads(os.environ['EXPECTED_VOTER_HASHES_JSON'])

          resp=requests.get(SHEET_URL,timeout=30); resp.raise_for_status()
          current_sheet_sha=hashlib.sha256(resp.content).hexdigest()
          source_rows=list(csv.DictReader(io.StringIO(resp.text)))
          meta_re=re.compile(r'^__pkgv8dev_meta__\|([AB])\|([1-9]|[1-4][0-9]|50)\|([0-9]|[1-2][0-9]|3[0-9])$')

          reset_rows=defaultdict(list); structural=[]; excluded=Counter(); post_freeze_v8_rows=0
          for source_index,row in enumerate(source_rows):
            keep=str(row.get('keep') or '')
            if not keep.startswith(VOTE_PREFIX):continue
            ts=parse_utc(row.get('timestamp'))
            if ts is None:excluded['invalid_timestamp']+=1;continue
            if ts<=activation_cutoff:excluded['pre_activation_or_at_cutoff']+=1;continue
            if ts>freeze_cutoff:
              post_freeze_v8_rows+=1
              continue
            voter=str(row.get('voter_roster_id') or '').strip()
            if not voter:excluded['missing_voter_id']+=1;continue

            payload=keep[len(VOTE_PREFIX):]
            challenge_id,sep,_ignored_choice_payload=payload.partition('|')
            if not sep:excluded['malformed_vote_transport']+=1;continue
            challenge_id=challenge_id.strip()
            if challenge_id not in challenges:excluded['unknown_challenge_id']+=1;continue

            mm=meta_re.fullmatch(str(row.get('trade') or ''))
            if not mm:excluded['invalid_meta_transport']+=1;continue
            display_left=mm.group(1); slot=int(mm.group(2)); display_order=int(mm.group(3))
            if str(row.get('cut') or '')!=SCHEMA_MARKER:excluded['invalid_schema_marker']+=1;continue
            spec=sched['slots'][str(slot)]
            if challenge_id not in spec['challenge_order']:excluded['challenge_not_in_slot_schedule']+=1;continue
            if display_order!=spec['challenge_order'].index(challenge_id):excluded['display_order_schedule_mismatch']+=1;continue
            if display_left!=spec['display_left_by_challenge'][challenge_id]:excluded['display_left_schedule_mismatch']+=1;continue

            item={'timestamp':ts,'source_index':source_index,'voter':voter,'challenge_id':challenge_id,
                  'display_left':display_left,'slot':slot,'display_order':display_order}
            cutoff=reset_cutoffs.get(slot)
            if cutoff is not None and ts<=cutoff:
              # Preserve reset rows structurally, but do not interpret their human choice payload.
              item.pop('choice',None)
              reset_rows[slot].append(item);excluded[f'slot{slot}_reset_pre_cutoff']+=1;continue

            # OUTCOME OPENING BOUNDARY: interpret the human A/B choice only for rows
            # that survived the already-frozen structural/reset contract.
            choice=_ignored_choice_payload.strip()
            if choice not in {'A','B'}:excluded['invalid_choice_payload']+=1;continue
            item['choice']=choice
            structural.append(item)

          # Preserve the three outcome-blind repair boundaries exactly.
          assert len(reset_rows[16])==80 and len({r['voter'] for r in reset_rows[16]})==2
          assert len(reset_rows[35])==42 and len({r['voter'] for r in reset_rows[35]})==1
          assert len(reset_rows[44])==41 and len({r['voter'] for r in reset_rows[44]})==1
          assert sorted(Counter(r['challenge_id'] for r in reset_rows[35]).values())==[1]*38+[2]*2
          assert sorted(Counter(r['challenge_id'] for r in reset_rows[44]).values())==[1]*39+[2]

          structural.sort(key=lambda r:(r['timestamp'],r['source_index']))
          assert len(structural)==2000,('frozen_structural_rows',len(structural))
          by_voter=defaultdict(list)
          for r in structural:by_voter[r['voter']].append(r)
          assert len(by_voter)==50,('voters',len(by_voter))

          ballots=[]; seen_slots=set(); observed_hashes={}
          for voter,rows in by_voter.items():
            assert len(rows)==40,(voter,len(rows))
            assert len({r['challenge_id'] for r in rows})==40
            slots={r['slot'] for r in rows}; assert len(slots)==1
            slot=next(iter(slots)); assert slot not in seen_slots; seen_slots.add(slot)
            ordered=sorted(rows,key=lambda r:r['display_order'])
            assert [r['display_order'] for r in ordered]==list(range(40))
            assert [r['challenge_id'] for r in ordered]==sched['slots'][str(slot)]['challenge_order']
            voter_hash=hashlib.sha256(('v8-maturity-voter|'+voter).encode()).hexdigest()[:16]
            assert voter_hash==expected_hashes[str(slot)],(slot,voter_hash,expected_hashes[str(slot)])
            observed_hashes[str(slot)]=voter_hash
            for r in ordered:
              ballots.append({
                'voter_cluster':voter_hash,
                'challenge_id':r['challenge_id'],
                'display_left':r['display_left'],
                'human_choice_left':r['choice']==r['display_left'],
              })

          assert seen_slots==set(range(1,51))
          assert observed_hashes==expected_hashes
          assert len(ballots)==2000
          by_ch=Counter(b['challenge_id'] for b in ballots); assert set(by_ch.values())=={50}
          # Balance must remain exactly the frozen schedule's 25/25 left exposure per challenge.
          for cid in challenge_ids:
            lefts=Counter(b['display_left'] for b in ballots if b['challenge_id']==cid)
            assert lefts=={'A':25,'B':25},(cid,lefts)

          dataset={'schema_version':1,'study_id':act['study_id'],'ballots':ballots}
          dataset_bytes=(json.dumps(dataset,sort_keys=True,separators=(',',':'))+'\n').encode()
          dataset_sha=hashlib.sha256(dataset_bytes).hexdigest()
          (OUT/'frozen_opened_dataset.json').write_bytes(dataset_bytes)

          commitment={
            'schema_version':1,'status':'PASS_FROZEN_50_DATASET_OPENED','study_id':act['study_id'],
            'freeze_cutoff_utc':freeze_cutoff.isoformat(),'source_maturity_run_id':int(os.environ['FREEZE_SOURCE_RUN_ID']),
            'source_maturity_artifact_digest':os.environ['FREEZE_SOURCE_ARTIFACT_DIGEST'],
            'current_sheet_sha256':current_sheet_sha,'sheet_sha256_at_maturity':os.environ['FREEZE_SOURCE_SHEET_SHA256'],
            'current_source_rows':len(source_rows),'post_freeze_v8_rows_ignored':post_freeze_v8_rows,
            'accepted_voters':50,'accepted_ballots':2000,'accepted_slots':50,
            'dataset_sha256':dataset_sha,'voter_ids_raw_stored_in_dataset':False,
            'outcomes_opened':True,'production_change_authorized':False,
            'exclusions':dict(sorted(excluded.items())),
          }
          (OUT/'dataset_commitment.json').write_text(json.dumps(commitment,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:commitment[k] for k in ('status','accepted_voters','accepted_ballots','dataset_sha256','post_freeze_v8_rows_ignored')},indent=2))
          PY

      - name: Run frozen development evaluator exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 research/package-adjustment-v8/evaluate_development_v1.py \
            --catalog research/package-adjustment-v8/development_catalog_v1.json \
            --data /tmp/package-adjustment-v8-b3/frozen_opened_dataset.json \
            --output /tmp/package-adjustment-v8-b3/development_evaluation.json

      - name: Validate scientific decision and write human-readable report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/package-adjustment-v8-b3')
          r=json.loads((out/'development_evaluation.json').read_text())
          c=json.loads((out/'dataset_commitment.json').read_text())
          allowed={'PASS_DEVELOPMENT_BUILD_FRESH_CONFIRMATION_POWER','STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'}
          assert r['decision'] in allowed
          assert r['production_change_authorized'] is False
          assert r['confirmation_catalog_generated'] is False
          assert len(r['gates'])==8
          # Mechanical consistency: decision is determined only by the already-frozen gates.
          should_pass=all(r['gates'].values())
          assert (r['decision']=='PASS_DEVELOPMENT_BUILD_FRESH_CONFIRMATION_POWER')==should_pass
          next_step=(
            'Freeze C1 and build the preregistered fresh nonoverlapping confirmation power analysis; do NOT promote to production.'
            if should_pass else
            'STOP V8 topology-split development. No post-hoc rescue model and no production promotion.'
          )
          lines=[
            '# Package Adjustment V8 — B3 Frozen Development Outcome Evaluation','',
            f"**Decision:** `{r['decision']}`",'',
            f"- Frozen voters: **{c['accepted_voters']} / 50**",
            f"- Frozen ballots: **{c['accepted_ballots']} / 2000**",
            f"- Dataset SHA256: `{c['dataset_sha256']}`",
            f"- C0 CV loss: **{r['c0_cv_loss']:.8f}**",
            f"- C1 CV loss: **{r['candidate_cv_loss']:.8f}**",
            f"- Improvement vs C0: **{r['improvement_vs_c0']:.8f}**",
            f"- Folds improved: **{r['folds_improved']} / 5**",
            f"- Bootstrap one-sided 95% UCB: **{r['bootstrap']['one_sided_95_ucb']:.8f}**",
            f"- Worst topology regression: **{r['worst_topology_regression']:.8f}**",
            f"- LOPO minimum improvement: **{r['leave_one_player_out']['minimum_improvement_vs_c0']:.8f}**",'',
            '## Frozen gates',''
          ]
          for k,v in r['gates'].items():lines.append(f"- {'PASS' if v else 'FAIL'} — `{k}`")
          lines += ['', '## Next step','', next_step,'',
                    '**Production change authorized:** NO',
                    '**Post-hoc rescue model authorized:** NO','']
          (out/'report.md').write_text('\n'.join(lines))
          summary='\n'.join(lines)
          Path('/tmp/b3_summary.md').write_text(summary)
          print(summary)
          PY
          cat /tmp/b3_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove per-ballot opened dataset before artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/package-adjustment-v8-b3/frozen_opened_dataset.json

      - name: Upload B3 evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v8-b3a-frozen-development-evaluation
          path: /tmp/package-adjustment-v8-b3/
          if-no-files-found: error
          retention-days: 30
