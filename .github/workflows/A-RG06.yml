name: A-RG06 - One-Time Free Agent Utility Refresh With Deferred Team Utility
run-name: A-RG06 ${{ inputs.mode }} - FA utility valid; Jersey Bagels K exception tracked

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW_ONLY tests without committing; APPLY commits the utility artifact only'
        type: choice
        required: true
        default: PREVIEW_ONLY
        options:
          - PREVIEW_ONLY
          - APPLY

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  temporary_fa_refresh:
    name: Validate FA utility; separately identify existing stale Team Utility artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check 'requests>=2.32,<3'

      - name: Pin unchanged production code and enforce one-time expiration
        shell: bash
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -u -d '2026-11-08T00:00:00Z' +%s)" || {
            echo '::error::Temporary exception expired. Use regular maintenance after roster 7 adds a K.'
            exit 1
          }
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object scripts/projections/build_free_agent_utility_v1.py)" = 'c1fb62c1c04b4b539fa74bff4ee038ec1a4cccc1'
          test "$(git hash-object scripts/validation/validate_free_agent_utility_v1.py)" = 'bc30ff0bec940e06e8a358f7dc797434463b4684'
          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase1.py)" = '1bb87f685c00e51a488a0c21510ccdca452e6b72'
          grep -Fq 'TRANSPORT_STRENGTH = 0.15' scripts/projections/build_free_agent_utility_v1.py
          grep -Fq 'SHIFT_CAP = 0.04' scripts/projections/build_free_agent_utility_v1.py
          grep -Fq 'MIN_PROVIDER_ROW_FRACTION = 0.50' scripts/projections/build_free_agent_utility_v1.py
          git rev-parse HEAD > "$RUNNER_TEMP/rg06_start_commit.txt"
          sha256sum index.html free-agent-board.html \
            data/free_agents.json data/league_rosters.json \
            scripts/artifacts/generated/player_positions.json \
            scripts/artifacts/generated/team_utility_lineup_projections.json \
            scripts/artifacts/reports/team_utility_lineup_projection_report.md \
            scripts/validation/repo_regression_checks.py \
            scripts/validation/snapshot_values.py \
            scripts/projections/build_team_utility_lineup_projections.py \
            scripts/projections/build_free_agent_utility_v1.py \
            scripts/validation/validate_free_agent_utility_v1.py \
            research/free-agent-utility-v1/free_agent_utility_v1_phase1.py \
            > "$RUNNER_TEMP/rg06_protected.sha"
          echo 'PASS: frozen pricing, canonical data, utility formulas and deferred projection evidence pinned.'

      - name: Require exactly the known Jersey Bagels missing kicker situation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/projections')
          import build_team_utility_lineup_projections as b
          rosters = json.loads(Path('data/league_rosters.json').read_text(encoding='utf-8'))
          config = json.loads(Path('config.json').read_text(encoding='utf-8'))
          positions = json.loads(Path('scripts/artifacts/generated/player_positions.json').read_text(encoding='utf-8'))
          assert str(rosters.get('league_id')) == str(config['league_id']), 'League ID changed'
          assert b.EXPECTED_STARTERS == 17, 'Expected 17-starter rule changed'
          teams = rosters['rosters']
          assert len(teams) == 12 and len({t['roster_id'] for t in teams}) == 12
          requirements = [(p, n) for p,n in b.DEDICATED] + [(p,n) for p,_,n in b.FLEXES]
          blockers = []
          for team in teams:
              active = []
              for group in ('starters', 'bench'):
                  for row in team.get(group, []) or []:
                      sid = str(row.get('player_id') or '')
                      pos = b.roster_position(row, positions)
                      if sid and pos:
                          active.append(b.RosterPlayer(sleeper_id=sid, name=str(row.get('name') or sid), pos=pos, projection=0.0))
              selected, _ = b.optimize_projection_lineup(active)
              labels = Counter(label for label,_ in selected)
              missing = {k: n-labels[k] for k,n in requirements if labels[k] < n}
              if missing:
                  blockers.append({'id':team['roster_id'], 'name':team.get('team_name'), 'count':len(selected),
                                   'missing':missing, 'k_count':sum(p.pos == 'K' for p in active)})
          expected = [{'id':7, 'name':'Jersey Bagels', 'count':16, 'missing':{'K':1}, 'k_count':0}]
          assert blockers == expected, f'Unexpected lineup failures; one-time exception denied: {blockers}'
          print('PASS: Exactly Jersey Bagels (roster 7) lacks 1 K; other 11 teams have 17 starters.')
          print('NOTE: Team Utility lineup artifact remains stale by design and is NOT being certified.')
          PY

      - name: Run existing Free Agent Utility selftests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/build_free_agent_utility_v1.py --selftest
          python3 scripts/validation/validate_free_agent_utility_v1.py --selftest
          python3 scripts/sync/sync_free_agent_valuation.py --check

      - name: Decode existing private 4for4 sources in temporary directory
        shell: bash
        env:
          FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}
          FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
          FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
          FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}
        run: |
          set -euo pipefail
          for key in FOURFORFOUR_OFFENSE_GZ_B64_PART1 FOURFORFOUR_OFFENSE_GZ_B64_PART2 FOURFORFOUR_OFFENSE_GZ_B64_PART3 FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            test -n "${!key:-}" || { echo "::error::Missing $key"; exit 1; }
          done
          install -d -m 700 /tmp/log-rg06-private
          printf '%s%s%s' "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" | base64 --decode | gzip -dc > /tmp/log-rg06-private/offense.csv
          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc > /tmp/log-rg06-private/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc > /tmp/log-rg06-private/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc > /tmp/log-rg06-private/db.csv
          chmod 600 /tmp/log-rg06-private/*.csv

      - name: Rebuild exact frozen Free Agent Utility V1 rankings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/build_free_agent_utility_v1.py \
            --offense /tmp/log-rg06-private/offense.csv \
            --dl /tmp/log-rg06-private/dl.csv \
            --lb /tmp/log-rg06-private/lb.csv \
            --db /tmp/log-rg06-private/db.csv \
            --write-artifact

      - name: Validate Free Agent Utility artifact and on-page behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/build_free_agent_utility_v1.py --check
          python3 scripts/validation/validate_free_agent_utility_v1.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/sync/sync_free_agent_valuation.py --check

      - name: Run repository regressions with only existing Team Utility artifact deferral
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import inspect
          import subprocess
          import sys
          sys.path.insert(0, 'scripts/validation')
          import repo_regression_checks as reg
          import snapshot_values

          original = reg.check_team_utility_projection_runtime_invariants
          builder = reg.REPO_ROOT / 'scripts/projections/build_team_utility_lineup_projections.py'
          runtime = reg.REPO_ROOT / 'scripts/team_utility_projection_runtime.js'
          expected_stale = 'team_utility_lineup_projections.json is stale relative to its committed projection/identity inputs; rebuild it'

          def known_temporary_deferral():
              try:
                  original()
              except subprocess.CalledProcessError as exc:
                  assert list(exc.cmd) == [sys.executable, str(builder), '--check'], (
                      'Unexpected Team Utility failure: ' + str(exc.cmd)
                  )
                  check = subprocess.run(exc.cmd, cwd=reg.REPO_ROOT, capture_output=True, text=True)
                  assert check.returncode == 1 and expected_stale in check.stderr, (
                      'Different Team Utility failure: ' + check.stderr[-1200:]
                  )
                  # The original validator already checked runtime syntax/selftest.
                  # Independently retain the runtime's remaining contract checks
                  # after its artifact check, which cannot currently pass.
                  index_text = reg.INDEX.read_text(encoding='utf-8')
                  runtime_text = runtime.read_text(encoding='utf-8')
                  assert '<script src="scripts/team_utility_projection_runtime.js"></script>' in index_text
                  assert 'const TU_BENCH_WEIGHT = 0.15;' in index_text
                  snapshot_values.extract_object_body(index_text, 'PLAYER_DB')
                  for token in ('TEAM_UTILITY_PROJECTION_RUNTIME_V1', 'projectionByKey',
                                "starterEligible: slot !== 'taxi' && slot !== 'reserve_ir'",
                                'buildPostSlotMap', 'calculateTeamUtilityV1',
                                'data/my_roster.json', 'data/league_rosters.json'):
                      assert token in runtime_text, f'Team Utility runtime contract drift: {token}'
                  print('TEMPORARY DEFERRED: Only the known stale Team Utility lineup artifact.')
                  print('PASS: Team Utility runtime syntax/selftest, unchanged slot rules and remaining runtime contract.')
              else:
                  print('PASS: Team Utility artifact already current; no exception needed.')

          # Audit the exact declared 14-group suite before invoking it. If
          # upstream adds, removes or reorders checks, fail rather than silently
          # skipping a new regression. The checked-in validator is untouched.
          declared = ast.parse(inspect.getsource(reg.main)).body[0].body
          assignment = next(
              node for node in declared
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == 'checks' for target in node.targets)
          )
          expected_names = [
              'check_snapshot_parity',
              'check_position_rules_and_free_agents',
              'check_dual_eligibility_audit',
              'check_team_identity',
              'check_aliases_and_ktc_positions',
              'check_idp_v1_projection_invariants',
              'check_canonical_history_and_v1_bridge',
              'check_preferred_bake_preview_invariants',
              'check_deployed_idp_v1_invariants',
              'check_free_agent_board_parity',
              'check_team_utility_projection_runtime_invariants',
              'check_package_adjustment_live.validate',
              'check_package_sampling_contract',
              'check_index_js_syntax',
          ]
          declared_names = [ast.unparse(item) for item in assignment.value.elts]
          assert declared_names == expected_names, f'Regression suite contract changed: {declared_names}'
          checks = [
              reg.check_snapshot_parity,
              reg.check_position_rules_and_free_agents,
              reg.check_dual_eligibility_audit,
              reg.check_team_identity,
              reg.check_aliases_and_ktc_positions,
              reg.check_idp_v1_projection_invariants,
              reg.check_canonical_history_and_v1_bridge,
              reg.check_preferred_bake_preview_invariants,
              reg.check_deployed_idp_v1_invariants,
              reg.check_free_agent_board_parity,
              known_temporary_deferral,
              reg.check_package_adjustment_live.validate,
              reg.check_package_sampling_contract,
              reg.check_index_js_syntax,
          ]
          for check in checks:
              check()
          print('PASS: 13 unchanged regression groups; one Team Utility artifact check temporarily deferred.')
          print('NOTE: This is not a claim that the normal, unmodified repository suite is green.')
          PY

      - name: Enforce exact one-file change and protected source parity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/rg06_protected.sha"
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'], text=True).splitlines()
          paths = [r[3:] for r in changed]
          assert paths in ([], ['data/free_agent_utility_v1.json']), f'Unexpected changes: {paths}'
          print('PASS: only data/free_agent_utility_v1.json may be changed:', paths)
          PY

      - name: APPLY audited artifact only
        if: inputs.mode == 'APPLY'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/rg06_start_commit.txt")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/free_agent_utility_v1.json
          if git diff --cached --quiet; then
            echo 'Artifact already current; no commit needed.'
          else
            test "$(git diff --cached --name-only)" = 'data/free_agent_utility_v1.json'
            git commit -m 'A-RG06: refresh Free Agent Utility while roster 7 K gap is pending'
            git push origin HEAD:main
          fi

      - name: Upload nonprivate validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-RG06-utility-evidence-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rg06_start_commit.txt
            ${{ runner.temp }}/rg06_protected.sha

      - name: Delete private 4for4 data
        if: always()
        shell: bash
        run: rm -rf /tmp/log-rg06-private

      - name: Summarize
        if: success()
        shell: bash
        run: |
          {
            echo '## A-RG06 one-time Free Agent Utility refresh'
            echo '- Frozen utility formula and source readers: UNCHANGED'
            echo '- Free Agent Utility V1 rankings and board behavior: PASS'
            echo '- QA21/CAL22/live FV parity: PASS (through full suite)'
            echo '- Team Utility runtime: PASS; known stale lineup artifact: DEFERRED ONLY'
            echo '- Exactly one roster missing K: Jersey Bagels / roster 7'
            echo '- Normal strict 17-slot validation: UNCHANGED in repository'
            echo '- One-time exception expires November 8, 2026 00:00 UTC'
            echo '- Mode: ${{ inputs.mode }}'
          } >> "$GITHUB_STEP_SUMMARY"
