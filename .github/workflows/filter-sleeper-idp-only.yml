name: Filter Sleeper IDP Only

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test before trusting real output
        run: python3 scripts/projections/filter_sleeper_idp_only.py --selftest

      - name: Run the filter
        run: python3 scripts/projections/filter_sleeper_idp_only.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/sleeper_2026_idp_only.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Filter Sleeper IDP-only subset"
          git push
