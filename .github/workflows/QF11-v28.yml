name: QF11 V28 - Synthetic Moderated Pilot Custody and Stop Lifecycle Gate (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V28_INPUT: /tmp/qf11-v28-input/v27
  QF11_V28_OUTPUT: /tmp/qf11-v28-output
jobs:
  synthetic_custody_lifecycle:
    name: Verify V27 and run synthetic-only consent, custody, dedup, stop, and deletion lifecycle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin unchanged production and live KTC sources and read-only repository state
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V28_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V28_PROTECTED_SOURCE_PINS_GREEN


        [[ "$(git hash-object .github/workflows/ktc-vote-aggregation.yml)" == "a6d08df00abc1760866c98757fd057b644a22264" ]] || { echo STOP_LIVE_KTC_AGGREGATOR_DRIFT;
        exit 1; }

        echo QF11_V28_LIVE_KTC_AGGREGATOR_PIN_GREEN

        '
    - name: Download exact V27 Green source archive
      uses: actions/download-artifact@v4
      with:
        name: QF11-v27-RESEARCH-ONLY-offline-prototype-architecture
        run-id: 38329283818
        github-token: ${{ github.token }}
        path: /tmp/qf11-v28-input/v27
    - name: SHA-verify V27 and exercise synthetic-only moderated custody and incident lifecycle
      shell: bash
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v28-output\ncat > /tmp/qf11-v28-custody.py <<'QF11_V28_PY'\n#!/usr/bin/env python3\n\"\"\"QF11 V28 -- synthetic-only\
        \ moderated pilot custody lifecycle and fail-closed audit.\nNo real respondents, contact channels, external service, or production writes.\n\"\"\"\nfrom __future__\
        \ import annotations\nimport os, json, hashlib, hmac, datetime, pathlib, collections\n\nSRC = pathlib.Path(os.environ.get('QF11_V28_INPUT', '/mnt/data/qf11-v27-green-inspect'))\n\
        OUT = pathlib.Path(os.environ.get('QF11_V28_OUTPUT', '/mnt/data/qf11-v28-fixture-output'))\nPINS = {\n 'RESEARCH_ONLY_v27_architecture_decisions.json':'69a29874ceb48be313bf77b8cb54365f3682588092bf7a0943b86e7bfc079518',\n\
        \ 'RESEARCH_ONLY_v27_offline_interactive_development_preview.html':'7071bf52db9220cb27dc67b4c5220e8cf35e65582ec0151d00d7d28c25cf75b6',\n 'RESEARCH_ONLY_v27_sandbox_core.js':'e8e00797dbc47395e73c6f2c77eee4fa9b54030839e429279d98312996ae86dc',\n\
        \ 'RESEARCH_ONLY_v27_owner_architecture_review.md':'53ce7c9f83eb954a1a8fafdb71cd15bd3b5fadbbe1822af0921c6cd95d8e2dbb'\n}\nfor name, digest in PINS.items():\n\
        \ f=SRC/name\n assert f.is_file(), f'STOP_MISSING_V27_SOURCE_{name}'\n assert hashlib.sha256(f.read_bytes()).hexdigest()==digest, f'STOP_V27_SOURCE_TAMPERING_{name}'\n\
        scope=json.loads((SRC/'RESEARCH_ONLY_v27_architecture_decisions.json').read_text())\nassert scope['schema']=='QF11_V27_ISOLATED_DEV_PREVIEW_AND_REAL_PILOT_ARCHITECTURE'\n\
        assert scope['owner_choice_required']['architecture_options'][0]['status']=='PROPOSED_NOT_APPROVED'\nassert scope['approved_pilot_questionnaire'] is False\n\
        assert scope['production_ktc_or_package_collector_used'] is False\nassert scope['catalog_review_candidates']==22 and scope['identity_holds']==7 and scope['optional_uncertified']==9\n\
        assert scope['actual_respondents']==scope['actual_votes']==scope['production_changes']==0\n\nNOW=datetime.datetime(2026,10,12,12,tzinfo=datetime.timezone.utc)\n\
        MAX=12\nORDER_COUNT=6\nTTL=datetime.timedelta(days=30)\n# Literal known dummy names and secret serve only as deterministic test fixtures.\nTEST_SECRET=b'QF11_V28_SYNTHETIC_FIXTURE_KEY_NOT_FOR_HUMAN_USE'\n\
        \ndef token(name): return hmac.new(TEST_SECRET,name.encode(),hashlib.sha256).hexdigest()\n\nclass MockModeratorLedger:\n def __init__(self):\n  self.rows={};\
        \ self.events=[]; self.halted=False\n def register(self,name,consent=True,adult=True,expert=True,prior=False):\n  if self.halted: return 'STOP_HALTED'\n \
        \ if not consent: return 'REJECT_NO_CONSENT'\n  if not adult: return 'REJECT_NOT_ADULT'\n  if not expert: return 'REJECT_NO_DYNASTY_EXPERIENCE'\n  if prior:\
        \ return 'REJECT_PRIOR_PILOT'\n  key=token(name)\n  if key in self.rows: return 'REJECT_DUPLICATE'\n  if len(self.rows)>=MAX:return 'REJECT_CAP'\n  order=len(self.rows)%ORDER_COUNT\n\
        \  if sum(x['order']==order for x in self.rows.values())>=2: return 'REJECT_ORDER_CAP'\n  self.rows[key]={'order':order,'added':NOW,'consent':True,'answers':None,'pending_human_q4':True,'quarantined':False}\n\
        \  return f'SYNTHETIC_ASSIGNED_{order}'\n def review(self,name,mc,human_q4=None):\n  if self.halted:return 'STOP_HALTED'\n  row=self.rows.get(token(name))\n\
        \  if row is None:return 'REJECT_UNKNOWN'\n  if mc is None or len(mc)!=3:return 'REJECT_INCOMPLETE'\n  if mc != [1,1,0]:\n   self.halted=True\n   for r in\
        \ self.rows.values():r['quarantined']=True\n   self.events.append('CRITICAL_MC_STOP_QUARANTINE')\n   return 'CRITICAL_STOP'\n  if human_q4 is None:return\
        \ 'HUMAN_Q4_PENDING'\n  if human_q4!='PASS':\n   self.halted=True\n   for r in self.rows.values():r['quarantined']=True\n   self.events.append('CRITICAL_HUMAN_Q4_STOP_QUARANTINE')\n\
        \   return 'CRITICAL_STOP'\n  row['pending_human_q4']=False\n  row['answers']='SYNTHETIC_QC_PASS'\n  return 'SYNTHETIC_ACCEPTED'\n def delete_expired(self,at):\n\
        \  keys=[key for key,row in self.rows.items() if at-row['added']>=TTL]\n  for key in keys: del self.rows[key]\n  self.events.append(f'DELETION_SIMULATED_{len(keys)}')\n\
        \  return len(keys)\n\nchecks={}\nf=MockModeratorLedger()\nchecks['missing_consent']=f.register('TEST_CONSENT',consent=False)=='REJECT_NO_CONSENT'\nchecks['minor_rejected']=f.register('TEST_MINOR',adult=False)=='REJECT_NOT_ADULT'\n\
        checks['no_expertise_rejected']=f.register('TEST_NO_EXPERT',expert=False)=='REJECT_NO_DYNASTY_EXPERIENCE'\nchecks['prior_participant_rejected']=f.register('TEST_PRIOR',prior=True)=='REJECT_PRIOR_PILOT'\n\
        checks['consented_first_assignment']=f.register('TEST_01')=='SYNTHETIC_ASSIGNED_0'\nchecks['dedup']=f.register('TEST_01')=='REJECT_DUPLICATE'\nchecks['incomplete_mc']=f.review('TEST_01',[1,1])=='REJECT_INCOMPLETE'\n\
        checks['q4_manual_required']=f.review('TEST_01',[1,1,0])=='HUMAN_Q4_PENDING'\nchecks['no_auto_q4_clear']=f.rows[token('TEST_01')]['pending_human_q4']\nfor\
        \ i in range(2,13):\n assert f.register(f'TEST_{i:02}')==f'SYNTHETIC_ASSIGNED_{(i-1)%6}'\nchecks['balanced_two_per_order']=dict(collections.Counter(row['order']\
        \ for row in f.rows.values()))=={i:2 for i in range(6)}\nchecks['total_cap']=len(f.rows)==12 and f.register('TEST_13')=='REJECT_CAP'\nchecks['critical_mc_stop']=f.review('TEST_02',[0,1,0])=='CRITICAL_STOP'\n\
        checks['stop_blocks_further_assignments']=f.register('TEST_14')=='STOP_HALTED'\nchecks['stop_blocks_ongoing_review']=f.review('TEST_01',[1,1,0])=='STOP_HALTED'\n\
        checks['stop_quarantines_all']=all(row['quarantined'] for row in f.rows.values())\ng=MockModeratorLedger()\nassert g.register('TEST_Q4')=='SYNTHETIC_ASSIGNED_0'\n\
        checks['human_q4_critical_stop']=g.review('TEST_Q4',[1,1,0],'FAIL')=='CRITICAL_STOP' and g.halted\nh=MockModeratorLedger()\nassert h.register('TEST_DELETION')=='SYNTHETIC_ASSIGNED_0'\n\
        checks['early_deletion_not_triggered']=h.delete_expired(NOW+datetime.timedelta(days=29,hours=23))==0 and len(h.rows)==1\nchecks['thirty_day_expiry_deleted']=h.delete_expired(NOW+TTL)==1\
        \ and len(h.rows)==0\nchecks['deletion_evidence_aggregate_only']=h.events[-1]=='DELETION_SIMULATED_1'\nassert all(checks.values()),f'STOP_SYNTHETIC_LIFECYCLE_FAILURES_{[k\
        \ for k,v in checks.items() if not v]}'\nOUT.mkdir(parents=True,exist_ok=True)\nresult={\n 'schema':'QF11_V28_SYNTHETIC_MODERATED_CUSTODY_LIFECYCLE',\n 'source_run_id':38329283818,\n\
        \ 'research_only':True,'synthetic_test_case_count':len(checks),\n 'checks':checks,'six_orders_balanced':True,'max_two_per_order':True,'synthetic_total_capacity':12,\n\
        \ 'architecture_offline_supervised_selected_by_owner':False,\n 'questionnaire_amendment_owner_approved':False,\n 'independent_human_wording_qc_complete':False,\n\
        \ 'real_pseudonymous_records_implemented':False,\n 'real_consent_and_secure_custody_implemented':False,\n 'real_deletion_attestation_implemented':False,\n\
        \ 'live_participant_recruitment_approved':False,\n 'live_human_pilot_ready':False,\n 'production_collector_reused':False,\n 'synthetic_response_data_exported':False,\n\
        \ 'actual_participants':0,'actual_votes':0,'production_changes':0,\n 'open_owner_decisions':['Approve or revise the V25 wording amendment for preregistration\
        \ only',\n                         'Approve offline-supervised architecture for development only'],\n 'open_launch_gates':['Independent human wording/comprehension\
        \ review',\n                       'Moderator consent/eligibility SOP and reviewer training',\n                       'Real restricted pseudonymous custody\
        \ and dedup',\n                       'Verified deletion and retention process',\n                       'Operational critical-stop/quarantine drill',\n \
        \                      'Separately explicit owner authorization before recruiting anyone'],\n 'status':'SYNTHETIC_PASS_NOT_HUMAN_PILOT_APPROVAL'\n}\n(OUT/'RESEARCH_ONLY_v28_synthetic_custody_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\\\
        n')\nmd='''# QF11 V28 — synthetic supervised offline custody architecture test\n\n**Research-only dry run. No human participant or collector operation.**\n\
        \nThe exact GitHub Green V27 archive is SHA256-verified. Synthetic-only tests exercise missing consent, minor/non-expert/prior participant rejection, duplicate\
        \ prevention, 12-person and two-per-order limits, manual Q4 review required, immediate critical MC/Q4 stop, quarantine of in-flight synthetic sessions, and\
        \ modeled 30-day deletion.\n\n**Important distinction:** In-memory simulated tests are not implementation of actual informed consent, secure custody, real\
        \ pseudonymous participant identity, participant recruitment, a verified 30-day deletion policy, or operational incident handling. No user identifiers or\
        \ synthetic session records are published in this artifact; only per-check pass/fail booleans. No Market Value data was modified or collected.\n\n## Owner\
        \ decisions (both remain unapproved)\n\n1. Approve the V25 wording amendment **for preregistration only**, subject to independent human review.\n2. Select\
        \ the **supervised offline** pilot architecture **for development only**, pending real restricted record custody, verified retention/deletion, consent and\
        \ incident SOPs.\n\nAn actual study requires independent QC and a **new, explicit owner authorization for participant contact**. Never route pilot results\
        \ into the existing KTC or package adjustment collectors. The seven held identities, nine uncertified optional ballots, six excluded slots, and 13/20 main\
        \ audit remain unchanged.\n'''\n(OUT/'RESEARCH_ONLY_v28_owner_custody_review.md').write_text(md)\nprint('QF11_V28_SYNTHETIC_CUSTODY_LIFECYCLE_GREEN '+json.dumps({'checks':len(checks),'orders':6,'max_people':12,'owner_approval':False,'participants':0,'production_changes':0},sort_keys=True))\n\
        \nQF11_V28_PY\npython3 /tmp/qf11-v28-custody.py\n"
    - name: Run fourteen frozen repo regression groups and FA PA release selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V28_FROZEN_14_REGRESSIONS_GREEN

        '
    - name: 'Fail closed: synthetic validation does not approve human recruitment or real custody'
      shell: bash
      run: "set -euo pipefail\npython3 - <<'QF11_V28_GATE'\nimport json,os\nfrom pathlib import Path\nx=json.loads((Path(os.environ['QF11_V28_OUTPUT'])/'RESEARCH_ONLY_v28_synthetic_custody_result.json').read_text())\n\
        assert x['schema']=='QF11_V28_SYNTHETIC_MODERATED_CUSTODY_LIFECYCLE'\nassert x['synthetic_test_case_count']>=19 and all(x['checks'].values())\nassert x['six_orders_balanced']\
        \ and x['max_two_per_order'] and x['synthetic_total_capacity']==12\nfor key in ('architecture_offline_supervised_selected_by_owner','questionnaire_amendment_owner_approved','independent_human_wording_qc_complete','real_pseudonymous_records_implemented','real_consent_and_secure_custody_implemented','real_deletion_attestation_implemented','live_participant_recruitment_approved','live_human_pilot_ready','production_collector_reused','synthetic_response_data_exported'):\n\
        \ assert x[key] is False,key\nassert x['actual_participants']==x['actual_votes']==x['production_changes']==0\nassert x['status']=='SYNTHETIC_PASS_NOT_HUMAN_PILOT_APPROVAL'\n\
        print('QF11_V28_NO_REAL_PEOPLE_NO_COLLECTOR_NO_PRODUCTION_GREEN')\nQF11_V28_GATE\n"
    - name: Reverify protected model sources and live KTC path unchanged
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V28_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V28_PROTECTED_SOURCE_PINS_GREEN

        echo QF11_V28_ZERO_WRITE_GREEN


        [[ "$(git hash-object .github/workflows/ktc-vote-aggregation.yml)" == "a6d08df00abc1760866c98757fd057b644a22264" ]] || { echo STOP_AGGREGATOR_DRIFT; exit
        1; }

        '
    - name: Archive exact V28 synthetic test results and owner-readiness report (7 days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v28-RESEARCH-ONLY-synthetic-custody-lifecycle
        path: /tmp/qf11-v28-output/RESEARCH_ONLY_v28_*
        retention-days: 7
        if-no-files-found: error
