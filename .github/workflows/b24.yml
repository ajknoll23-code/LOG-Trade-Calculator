# PREFLIGHTED: B24_DRAFT_CAPITAL_OUTLOOK_V2_PHASE0A_WALTER_SAME_SOURCE_FEASIBILITY
name: B24 Draft Capital Outlook V2 - Phase 0A WalterFootball Same-Source Continuity Feasibility

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b24_v2_phase0a_walter_same_source_feasibility:
    name: Source-only WalterFootball continuity audit - no outcomes and no scoring
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen network dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Guard V1 scientific stop and zero-scoring state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          V1=Path("research/draft-capital-outlook-v1")
          m=V1/"b23/b23_manifest.json"
          r=V1/"b23/b23_report.md"
          f=V1/"b23/b23_source_feasibility.json"
          for p in (m,r,f):
              assert p.is_file(), p

          j=json.loads(m.read_text())
          assert j["study_id"]=="draft-capital-outlook-v1"
          assert j["decision"]=="STOP_2027_DRAFT_CAPITAL_OUTLOOK_SOURCE_PATH_KEEP_NEUTRAL_1_00"
          assert j["b23_executed"] is True
          assert j["b23_execution_count_committed"]==1
          assert j["feasible_source_count"]==0
          assert j["selected_source_id"] is None
          assert j["2027_capital_scalar_computed"] is False
          assert j["2027_shadow_multiplier_computed"] is False
          assert j["2027_class_scored"] is False
          assert j["production_change_authorized"] is False
          assert j["b24_preregistration_authorized"] is False

          report=r.read_text()
          assert "Selected comparable source: **NONE**" in report
          assert "2027 class scored: **NO**" in report
          assert "Production change authorized: **NO**" in report

          print("PASS: V1 remains scientifically closed at neutral 1.00 with no 2027 score and no production authority.")
          PY

      - name: Guard historical predictor source family before any V2 network access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          V1=Path("research/draft-capital-outlook-v1")
          regime_path=V1/"b17d/b17d_source_regime_audit.json"
          assert regime_path.is_file(), regime_path
          regime=json.loads(regime_path.read_text())
          by_year={int(x["class_year"]):x for x in regime["classes"]}
          for y in range(2013,2024):
              x=by_year[y]
              assert x["author_class"]=="WALT_EXPLICIT", (y,x)
              assert x["order_method_class"]=="POWER_RANKINGS", (y,x)
              assert x["source_mode"]=="STRICT_SPLIT3", (y,x)
          assert regime["existing_2014_2023_modal_author_class"]=="WALT_EXPLICIT"
          assert regime["existing_2014_2023_modal_order_method_class"]=="POWER_RANKINGS"

          paths={2013:V1/"b17e/2013_projected_top60.json"}
          for y in range(2014,2024):
              paths[y]=V1/f"archive/historical-anchor-parsing-v2/parsed/{y}_projected_top60.json"

          audit=[]
          for y,p in paths.items():
              assert p.is_file(), p
              raw=p.read_text()
              obj=json.loads(raw)
              assert obj["class_year"]==y
              rows=obj.get("top60_rows") or []
              assert rows, (y,"missing frozen top60 rows")
              picks=[int(x["pick"]) for x in rows if "pick" in x]
              assert len(set(picks))>=58, (y,len(set(picks)))
              assert 60 in picks, (y,"missing slot 60")
              # The 2014-2023 parse artifacts retain the explicit WalterFootball URL.
              # 2013 lineage is established by the frozen B17D regime audit above.
              if y>=2014:
                  assert "walterfootball.com" in raw.lower(), f"{y}: expected WalterFootball URL lineage"
              audit.append({
                  "class_year":y,
                  "path":str(p.relative_to(V1)),
                  "author_class":by_year[y]["author_class"],
                  "order_method_class":by_year[y]["order_method_class"],
                  "source_mode":by_year[y]["source_mode"],
                  "unique_slots_through_60":len(set(k for k in picks if 1<=k<=60)),
              })

          assert len(audit)==11
          print(json.dumps(audit,indent=2))
          print("PASS: all 11 V1 historical predictor classes are frozen WALT_EXPLICIT / POWER_RANKINGS / STRICT_SPLIT3 with top-60 reach.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze V2 Phase 0A source-only decision hierarchy before network access
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/draft-capital-outlook-v2/b24
          mkdir -p research/draft-capital-outlook-v2/b24
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v2/b24")
          p=O/"b24_phase0a_preregistration.json"
          cfg={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v2",
            "stage":"b24_phase0a_walter_same_source_source_only_feasibility_preregistration",
            "created_before_network_access":True,
            "created_before_any_v2_predictor_target_association":True,
            "v1_status":"CLOSED_NEUTRAL_1_00_DISCOUNTED_PRIOR_ONLY",
            "objective":"Test exact WalterFootball/Walt source continuity for the 2027 anchor without computing any draft-capital scalar, multiplier, target, association, fit, correlation, or production value.",
            "anchor_window":{"start":"2026-09-15","end":"2026-10-15","ideal_date":"2026-09-30"},
            "historical_source_contract":{
              "publisher":"WalterFootball",
              "author_family":"Walt / Walter Cherepinsky main mock",
              "historical_classes":list(range(2013,2024)),
              "historical_construct_top_k":60,
              "historical_page_roles":["picks_1_16","picks_17_32","round2_33_64"],
              "same_source_requires_same_publisher_and_main_Walt_mock":True,
              "Charlie_Campbell_counts_as_exact_same_source":False
            },
            "candidate_urls":[
              {"role":"picks_1_16","url":"https://walterfootball.com/draft2027.php","expected_start_pick":1,"expected_min_entries":16},
              {"role":"picks_17_32","url":"https://walterfootball.com/draft2027_1.php","expected_start_pick":17,"expected_min_entries":16},
              {"role":"round2_33_64","url":"https://walterfootball.com/draft2027_2.php","expected_start_pick":33,"expected_min_entries":28}
            ],
            "feasibility_rules":{
              "same_source_k60":"all three page roles retrievable without authentication/paywall, coherent Walt 2027 mock, anchor-date evidence inside window, at least 60 sequential explicit draft entries available through pick 60",
              "same_source_k32_fallback_availability":"first two page roles retrievable without authentication/paywall, coherent Walt 2027 mock, anchor-date evidence inside window, exactly/at least 32 sequential explicit draft entries through pick 32",
              "paywall_or_auth_redirect":"structural source unavailability, not a technical failure",
              "transient_network_error_or_5xx":"technical failure; workflow must fail red rather than convert transport trouble into a scientific stop"
            },
            "frozen_path_priority":[
              "1_EXACT_WALTER_SAME_SOURCE_K60",
              "2_MULTI_MOCK_ENSEMBLE_K60_IF_EXACT_K60_INFEASIBLE",
              "3_WALTER_SAME_SOURCE_K32_AS_FRESH_CONSTRUCT_IF_ENSEMBLE_K60_INFEASIBLE",
              "4_STOP_IF_NONE_FEASIBLE"
            ],
            "anti_shopping_firewall":{
              "priority_may_change_after_any_v2_association":False,
              "source_choice_may_use_historical_actual_capital":False,
              "source_choice_may_use_v1_fit_strength":False,
              "source_choice_may_use_2027_capital_score":False,
              "source_weighting_allowed":False,
              "big_board_substitution_allowed":False,
              "partial_round2_imputation_allowed":False,
              "invented_pick_numbers_allowed":False
            },
            "forbidden_in_b24":[
              "Rich Hill value lookup",
              "P_c computation",
              "A_c loading",
              "ln(P_c)",
              "ln(A_c)",
              "correlation",
              "regression",
              "permutation test",
              "multiplier",
              "FV change",
              "production deployment"
            ],
            "decisions":{
              "k60_pass":"PASS_V2_PHASE0A_EXACT_WALTER_K60_AUTHORIZE_ARCHITECTURE_FREEZE_ONLY",
              "k60_fail_k32_available":"STOP_EXACT_WALTER_K60_RECORD_K32_FALLBACK_AUTHORIZE_V2_PHASE0B_ENSEMBLE_K60_SOURCE_AUDIT",
              "k60_fail_k32_unavailable":"STOP_EXACT_WALTER_PATH_AUTHORIZE_V2_PHASE0B_ENSEMBLE_K60_SOURCE_AUDIT"
            },
            "production_change_authorized":False,
            "v2_predictor_target_association_authorized":False,
            "2027_capital_scalar_authorized":False,
            "2027_class_scoring_authorized":False
          }
          p.write_text(json.dumps(cfg,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (O/"b24_preregistration.sha256").write_text(f"{h}  {p.name}\n")
          print(json.dumps({"preregistration_sha256":h,"path":str(p)},indent=2))
          PY

      - name: Execute source-only WalterFootball continuity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,html,json,re,time
          from datetime import date,datetime,timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          O=Path("research/draft-capital-outlook-v2/b24")
          P=json.loads((O/"b24_phase0a_preregistration.json").read_text())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected=(O/"b24_preregistration.sha256").read_text().split()[0]
          assert sha(O/"b24_phase0a_preregistration.json")==expected

          # Hard code-level firewall: this execution step has no path to V1 actual-capital
          # artifacts and never opens the Rich Hill table or B19/B21 result pairs.
          forbidden_tokens=("actual_top60","rich_hill_pick_values","b19/c1_result","b21_historical_calibration")
          source=Path(".github/workflows/b24.yml")
          if source.is_file():
              text=source.read_text().lower()
              # References in explanatory guard text are allowed only outside this execution
              # script, so do not use a whole-workflow lexical ban here.

          class TextParser(HTMLParser):
              BLOCK={"p","div","li","article","section","h1","h2","h3","h4","tr","td","th","br"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]; self.hidden=0
              def handle_starttag(self,tag,attrs):
                  if tag in {"script","style","noscript"}: self.hidden+=1
                  elif self.hidden==0 and tag in self.BLOCK: self.parts.append("\n")
              def handle_endtag(self,tag):
                  if tag in {"script","style","noscript"} and self.hidden: self.hidden-=1
                  elif self.hidden==0 and tag in self.BLOCK: self.parts.append("\n")
              def handle_data(self,data):
                  if self.hidden==0:self.parts.append(data)
              def text(self):
                  s="".join(self.parts).replace("\xa0"," ")
                  s=re.sub(r"[ \t\r\f\v]+"," ",s)
                  s=re.sub(r"\n{2,}","\n",s)
                  return s.strip()

          class AnchorParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack=[]; self.anchors=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      d=dict(attrs); self.stack.append({"href":d.get("href",""),"parts":[]})
              def handle_data(self,data):
                  if self.stack:self.stack[-1]["parts"].append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self.stack:
                      a=self.stack.pop(); t=re.sub(r"\s+"," ","".join(a["parts"])).strip()
                      if t:self.anchors.append({"href":a["href"],"text":t})

          POS_RE=re.compile(r"^[A-Z0-9-]{1,8}(?:/[A-Z0-9-]{1,8}){0,3}$")
          def parse_player_anchor(text):
              parts=[x.strip() for x in html.unescape(text).split(",")]
              if len(parts)<3:return None
              name=parts[0]
              pos=parts[1].upper().replace(" ","")
              school=",".join(parts[2:]).strip()
              if not name or len(name)>90 or not school or not POS_RE.fullmatch(pos):return None
              if name.lower() in {"round 1","round 2","round 3"}:return None
              return {"player":name,"position_raw":pos,"school":school}

          def extract_entries(raw):
              a=AnchorParser(); a.feed(raw)
              out=[]; seen=[]
              for x in a.anchors:
                  row=parse_player_anchor(x["text"])
                  if not row:continue
                  sig=(row["player"].casefold(),row["position_raw"],row["school"].casefold())
                  if sig in seen:continue
                  seen.append(sig); out.append(row)
              return out

          def visible(raw):
              p=TextParser(); p.feed(raw); return p.text()

          def update_date(raw):
              t=visible(raw)
              m=re.search(r"\bUpdated\s+(1[0-2]|0?[1-9])/(3[01]|[12]?\d)\b",t,re.I)
              if not m:return None
              return date(2026,int(m.group(1)),int(m.group(2))).isoformat()

          def is_paywall(final_url,raw):
              u=final_url.lower(); t=visible(raw).lower()
              return ("/plans" in u or "walterfootball premium" in t and "join premium now" in t)

          sess=requests.Session()
          sess.headers.update({
            "User-Agent":"LOG-Draft-Capital-Outlook-V2-B24/1.0 (+source-only research archive; GitHub Actions)",
            "Accept":"text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.5",
            "Accept-Language":"en-US,en;q=0.9",
          })

          captures=[]
          for c in P["candidate_urls"]:
              role=c["role"]; url=c["url"]
              response=None; last_error=None
              for attempt,delay in enumerate((0,3,9),start=1):
                  if delay: time.sleep(delay)
                  try:
                      r=sess.get(url,timeout=60,allow_redirects=True)
                      if r.status_code in {408,425,429} or 500<=r.status_code<=599:
                          last_error=f"HTTP {r.status_code}"
                          continue
                      response=r; break
                  except requests.RequestException as e:
                      last_error=f"{type(e).__name__}: {e}"
              if response is None:
                  raise RuntimeError(f"technical retrieval failure for {role} after 3 attempts: {last_error}")

              raw=response.text
              raw_path=O/f"raw_{role}.html"
              raw_path.write_text(raw,errors="replace")
              pay=is_paywall(response.url,raw)
              vis=visible(raw)
              entries=[] if pay else extract_entries(raw)
              upd=None if pay else update_date(raw)
              walt_marker=bool(re.search(r"\bby\s+Walt\b",vis,re.I))
              power_rankings_marker="based on his NFL Power Rankings".lower() in vis.lower()
              captures.append({
                "role":role,
                "requested_url":url,
                "final_url":response.url,
                "status_code":response.status_code,
                "redirected":response.url!=url,
                "paywall_or_auth_wall":pay,
                "page_update_date":upd,
                "walt_author_marker":walt_marker,
                "power_rankings_order_marker":power_rankings_marker,
                "raw_path":str(raw_path),
                "raw_sha256":sha(raw_path),
                "raw_bytes":raw_path.stat().st_size,
                "parsed_entry_count":len(entries),
                "parsed_entries":entries,
              })

          by={x["role"]:x for x in captures}
          window_start=date.fromisoformat(P["anchor_window"]["start"])
          window_end=date.fromisoformat(P["anchor_window"]["end"])

          def coherent(role,min_n):
              x=by[role]
              if x["paywall_or_auth_wall"]:return False
              if x["status_code"]!=200:return False
              if "walterfootball.com" not in urlparse(x["final_url"]).netloc.lower():return False
              if x["parsed_entry_count"]<min_n:return False
              if not x["walt_author_marker"]:return False
              if not x["power_rankings_order_marker"]:return False
              if not x["page_update_date"]:return False
              d=date.fromisoformat(x["page_update_date"])
              return window_start<=d<=window_end

          first=coherent("picks_1_16",16)
          second=coherent("picks_17_32",16)
          third=coherent("round2_33_64",28)
          k32=first and second
          k60=k32 and third

          sequential=[]
          if first:
              for i,row in enumerate(by["picks_1_16"]["parsed_entries"][:16],start=1): sequential.append({"pick":i,**row,"role":"picks_1_16"})
          if second:
              for i,row in enumerate(by["picks_17_32"]["parsed_entries"][:16],start=17): sequential.append({"pick":i,**row,"role":"picks_17_32"})
          if third:
              for i,row in enumerate(by["round2_33_64"]["parsed_entries"][:32],start=33): sequential.append({"pick":i,**row,"role":"round2_33_64"})

          picks=[r["pick"] for r in sequential]
          if k32:
              assert set(range(1,33)).issubset(set(picks))
          if k60:
              assert set(range(1,61)).issubset(set(picks))

          if k60:
              decision=P["decisions"]["k60_pass"]
          elif k32:
              decision=P["decisions"]["k60_fail_k32_available"]
          else:
              decision=P["decisions"]["k60_fail_k32_unavailable"]

          result={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v2",
            "stage":"b24_phase0a_walter_same_source_source_only_feasibility",
            "executed_at_utc":datetime.now(timezone.utc).isoformat(),
            "preregistration_sha256":expected,
            "historical_source_family":"WalterFootball / Walt main mock",
            "capture_results":captures,
            "same_source_k60_feasible":k60,
            "same_source_k32_fallback_available":k32,
            "sequential_structure_rows":sequential,
            "draft_capital_scalar_computed":False,
            "actual_capital_loaded":False,
            "predictor_target_association_computed":False,
            "correlation_computed":False,
            "multiplier_computed":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "decision":decision,
          }
          (O/"b24_source_feasibility.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          report=[]
          report.append("# Draft Capital Outlook V2 — B24 Phase 0A WalterFootball Same-Source Feasibility")
          report.append("")
          report.append(f"Decision: **{decision}**")
          report.append("")
          report.append("This is a source-only audit. No Rich Hill capital, historical actual-capital target, predictor-target association, correlation, multiplier, 2027 score, or production value was computed.")
          report.append("")
          for x in captures:
              report.append(f"- {x['role']}: HTTP {x['status_code']}; final={x['final_url']}; paywall/auth wall={'YES' if x['paywall_or_auth_wall'] else 'NO'}; update={x['page_update_date']}; Walt marker={'YES' if x['walt_author_marker'] else 'NO'}; Power Rankings order marker={'YES' if x['power_rankings_order_marker'] else 'NO'}; parsed entries={x['parsed_entry_count']}")
          report.append("")
          report.append(f"Exact same-source top-60 feasible: **{'YES' if k60 else 'NO'}**")
          report.append(f"Walter same-source top-32 fallback available: **{'YES' if k32 else 'NO'}**")
          report.append("")
          report.append("Frozen source-only priority: (1) exact Walter K60; (2) multi-mock ensemble K60; (3) Walter K32 as a fresh construct; (4) stop.")
          report.append("")
          report.append("A top-60 failure is a valid scientific source-feasibility result and does not make this workflow red. Only technical retrieval/integrity failures are red.")
          (O/"b24_report.md").write_text("\n".join(report)+"\n")

          print(json.dumps({
            "decision":decision,
            "same_source_k60_feasible":k60,
            "same_source_k32_fallback_available":k32,
            "pages":[{k:x[k] for k in ("role","status_code","final_url","paywall_or_auth_wall","page_update_date","walt_author_marker","power_rankings_order_marker","parsed_entry_count")} for x in captures]
          },indent=2))
          PY

      - name: Audit B24 output firewall and write manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v2/b24")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          prereg=O/"b24_phase0a_preregistration.json"
          result=O/"b24_source_feasibility.json"
          report=O/"b24_report.md"
          for p in (prereg,result,report,O/"b24_preregistration.sha256"):
              assert p.is_file(),p

          P=json.loads(prereg.read_text())
          R=json.loads(result.read_text())
          assert R["preregistration_sha256"]==sha(prereg)
          assert R["actual_capital_loaded"] is False
          assert R["draft_capital_scalar_computed"] is False
          assert R["predictor_target_association_computed"] is False
          assert R["correlation_computed"] is False
          assert R["multiplier_computed"] is False
          assert R["2027_class_scored"] is False
          assert R["production_change_authorized"] is False
          assert R["decision"] in set(P["decisions"].values())

          # Scientific stop is green; only contract/integrity violations fail.
          if R["same_source_k60_feasible"]:
              assert R["decision"]==P["decisions"]["k60_pass"]
          elif R["same_source_k32_fallback_available"]:
              assert R["decision"]==P["decisions"]["k60_fail_k32_available"]
          else:
              assert R["decision"]==P["decisions"]["k60_fail_k32_unavailable"]

          manifest={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v2",
            "stage":"b24_manifest",
            "b24_executed":True,
            "b24_execution_count_committed":1,
            "decision":R["decision"],
            "same_source_k60_feasible":R["same_source_k60_feasible"],
            "same_source_k32_fallback_available":R["same_source_k32_fallback_available"],
            "v2_phase0b_ensemble_k60_source_audit_authorized":not R["same_source_k60_feasible"],
            "architecture_freeze_authorized":R["same_source_k60_feasible"],
            "v2_predictor_target_association_authorized":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "output_hashes":{
              "b24_phase0a_preregistration.json":sha(prereg),
              "b24_source_feasibility.json":sha(result),
              "b24_report.md":sha(report),
            }
          }
          mp=O/"b24_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          files=[prereg,result,report,mp]
          (O/"b24_hashes.sha256").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files))
          print(json.dumps(manifest,indent=2))
          PY

      - name: Run repository regression after B24 artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit B24 source-only feasibility artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
