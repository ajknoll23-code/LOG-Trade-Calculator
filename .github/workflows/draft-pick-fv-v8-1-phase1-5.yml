name: Draft Pick FV V8.1 - Phase 1.5 Holdout Source Scope Correction

"on":
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: draft-pick-fv-v8-1-phase1-5-holdout-source-scope-correction
  cancel-in-progress: false

jobs:
  holdout_source_scope_correction:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install frozen transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard untouched H2 holdout and Phase 1 authorization
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")
          p=json.loads((d/"v8_1_carryforward_preregistration.json").read_text())
          s=json.loads((d/"v8_1_phase1_sparse_tail_sensitivity.json").read_text())

          assert p["decision"]=="FREEZE_V8_1_C1_CARRYFORWARD_SPARSE_SENSITIVITY_NEXT"
          assert p["frozen_primary_candidate"]["k"]==0.3557942893
          assert p["phase2_2024_h2_independent_confirmation"]["open_exactly_once"] is True
          assert p["evidence_status"]["2024_rookie_holdout_outcomes_read"] is False

          assert s["decision"]=="PASS_V8_1_SPARSE_TAIL_SENSITIVITY_AUTHORIZE_2024_H2_ONCE"
          assert s["sparse_sensitivity_gate_pass"] is True
          assert s["2024_H2_outcome_open_authorized_next_stage"] is True
          assert s["2024_holdout_rookie_outcomes_read"] is False
          assert s["2024_holdout_outcomes_remain_sealed"] is True
          assert s["primary_candidate_refit_or_changed"] is False

          # The failed Phase 2 attempt stopped during source-only validation.
          # These output files must still be absent, proving H2 was never opened/scored.
          for f in (
              "v8_1_phase2_2024_holdout_source_identity.json",
              "v8_1_phase2_2024_h2_scored_occurrences.jsonl",
              "v8_1_phase2_2024_h2_confirmation.json",
              "v8_1_phase2_2024_h2_confirmation_manifest.json",
          ):
              assert not (d/f).exists(), f

          print("PASS: V8.1 H2 remains untouched; Phase 1.5 is source-only and pre-outcome.")
          PY

      - name: Freeze Phase 1.5 correction rule before source replay
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v8-1"
          mkdir -p "$D"

          for f in \
            "$D/v8_1_phase1_5_holdout_source_scope_correction.json" \
            "$D/v8_1_phase1_5_holdout_source_scope_correction.md" \
            "$D/v8_1_phase1_5_holdout_source_scope_correction_manifest.json" \
            "$D/v8_1_phase1_5_holdout_source_identity.json"
          do
            test ! -e "$f" || { echo "ERROR: Phase 1.5 output already exists: $f"; exit 1; }
          done

          cat > "${RUNNER_TEMP}/phase1_5_contract.json" <<'JSON'
          {
            "schema_version": 1,
            "study_id": "draft-pick-fv-v8-1-global-scale-sparse-tail-holdout-confirmation",
            "stage": "phase1_5_preoutcome_holdout_source_scope_correction_contract",
            "status": "FROZEN_BEFORE_PHASE1_5_SOURCE_REPLAY",
            "reason": "The first V8.1 Phase 2 attempt stopped before any 2024 rookie outcomes were opened because the exact ten-league R1-R6 replay did not satisfy the aggregate frozen source/identity gate. This correction is limited to pre-outcome source scope.",
            "original_frozen_league_n": 10,
            "minimum_clean_full72_leagues": 8,
            "new_2024_search_allowed": false,
            "replacement_or_substitution_allowed": false,
            "outcome_access_allowed": false,
            "candidate_refit_allowed": false,
            "candidate_parameter_change_allowed": false,
            "scope_rule": "Re-audit the exact ten already-frozen full-72 leagues across slots 1-72 using the same pre-outcome V6 positive-contamination classifier already used to define rookie-only source scope. Exclude a whole league iff the frozen classifier finds at least one explicit devy custom player or uniquely resolved NFL draft class other than 2024 in slots 1-72. No other source-membership change is allowed.",
            "post_correction_gates": [
              "at least 8 of the exact 10 frozen full-72 leagues remain",
              "every one of 18 cells has >=95% occurrence retention",
              "every one of 18 cells has >=95% represented-league retention",
              "every one of 18 cells has >=95% resolved identity coverage",
              "every one of 18 cells has >=95% Sleeper-ready coverage",
              "overall identity coverage >=95%",
              "overall Sleeper-ready coverage >=95%",
              "exact first-48 raw draft replay remains unchanged for every retained league"
            ],
            "pass_decision": "PASS_V8_1_PHASE1_5_HOLDOUT_SOURCE_SCOPE_CORRECTION_H2_AUTHORIZED",
            "failure_decision": "STOP_V8_1_PHASE1_5_HOLDOUT_SOURCE_SCOPE_INSUFFICIENT",
            "2024_rookie_outcomes_read": false,
            "production_change_authorized": false
          }
          JSON

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"phase1_5_contract.json"
          c=json.loads(p.read_text())
          assert c["original_frozen_league_n"]==10
          assert c["minimum_clean_full72_leagues"]==8
          assert c["new_2024_search_allowed"] is False
          assert c["replacement_or_substitution_allowed"] is False
          assert c["outcome_access_allowed"] is False
          assert c["candidate_refit_allowed"] is False
          assert c["2024_rookie_outcomes_read"] is False
          print("PASS: Phase 1.5 source-only correction rule frozen before replay.")
          PY

      - name: Download exact pre-outcome V7 R1-R6 identity assets
        shell: bash
        run: |
          set -euo pipefail
          A="${RUNNER_TEMP}/v7assets"
          mkdir -p "$A"

          RUN_ID="36030009148"
          ARTIFACT_ID="10821375528"
          EXPECTED_DIGEST="sha256:adac4d23b2e945e2f95ce5d56ea31ec66eb1d4824d77c03f7b927ea85a9c371f"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest // ""')" = "$EXPECTED_DIGEST"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n "v7-phase2-engine-assets" \
            -D "$A"

          test "$(sha256sum "$A/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = \
            "0231b81424e7e04dfc77bb37888290cb55d506cedcc1b44b8737eb1ca903cc79"
          test "$(sha256sum "$A/db_playerids.csv" | awk '{print $1}')" = \
            "0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
          test "$(sha256sum "$A/nflverse_players.csv" | awk '{print $1}')" = \
            "4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"
          test "$(sha256sum "$A/r1_r6_identity_asset_manifest_v7.json" | awk '{print $1}')" = \
            "e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e"

      - name: Rehydrate exact pre-outcome identity workspace
        shell: bash
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/source-workspace"
          rm -rf "$W"
          mkdir -p "$W"
          git archive HEAD | tar -x -C "$W"

          # Rehydrate the exact pre-outcome crosswalk used by the frozen V7 engine.
          git cat-file -e ed34038ee0c711861616ed01219e458520c11867^{blob}
          git cat-file blob ed34038ee0c711861616ed01219e458520c11867 \
            > "$W/scripts/identity_crosswalk.json"

          test "$(sha256sum "$W/scripts/identity_crosswalk.json" | awk '{print $1}')" = \
            "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
          test "$(sha256sum "$W/research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py" | awk '{print $1}')" = \
            "1a0cb15c06d8b26ea33f8cebef0579746555a38a52bc17355a4cca0351e2cf8c"
          test "$(sha256sum "$W/research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json" | awk '{print $1}')" = \
            "904f64e1fc5d71fc62dbdc56f3d286cabddb59e10ea9cfd5541d07b08b77d064"

      - name: Build and execute exact-ten all-72 source correction
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/phase1_5_source.py" <<'PY'
          from __future__ import annotations

          import argparse
          import hashlib
          import importlib.util
          import json
          import math
          import os
          from collections import Counter, defaultdict
          from pathlib import Path

          import requests

          EXPECTED=("10302","21269","23907","48514","64635","65168","65200","68399","70523","74598")
          CELLS=tuple(f"r{r}_{t}" for r in range(1,7) for t in ("early","mid","late"))
          MIN_HOLD=8
          MIN_COV=.95

          class GateError(RuntimeError): pass

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          def write_json(p,obj):
              Path(p).write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")

          def import_file(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              if spec is None or spec.loader is None:
                  raise GateError(f"cannot import {path}")
              m=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(m)
              return m

          def read_jsonl(path):
              out=[]
              with Path(path).open() as f:
                  for line in f:
                      if line.strip():
                          out.append(json.loads(line))
              return out

          def run(args):
              work=Path(args.workspace)
              os.chdir(work)
              v7=import_file(Path(args.v7_engine),"v7frozen")
              _,src=v7.guard()
              frozen=v7.frozen_hold(src)
              ids=tuple(str(x["league_id"]) for x in frozen)
              if ids!=EXPECTED:
                  raise GateError(f"frozen ten drift: {ids}")

              idx,asset=v7.load_indexes(
                  Path(args.dp),Path(args.nflverse),Path(args.asset_manifest)
              )

              session=requests.Session()
              session.headers["User-Agent"]="LOG-Draft-Pick-FV-V8.1-P1.5-2024SourceScope/1.0"

              all_leagues=[]
              all_occ=[]
              retained_leagues=[]
              retained_occ=[]
              excluded=[]

              for i,fl in enumerate(frozen,1):
                  lid=str(fl["league_id"])
                  units=v7.V.extract_units(
                      v7.V.get_json(session,v7.V.api_url(2024,"draftResults",L=lid))
                  )
                  chosen,reason,us=v7.V.choose_unit(units)
                  if chosen is None:
                      raise GateError(f"frozen 2024 draft-unit ambiguity {lid}: {reason}")
                  can=v7.canonical72(chosen)
                  if not can["complete_unique_slot_grid"]:
                      raise GateError(f"frozen 2024 incomplete 1-72 grid {lid}")

                  pids=[
                      x["mfl_player_id"] for x in can["slots"].values()
                      if x.get("mfl_player_id")
                  ]
                  meta=v7.V.league_scoped_players(session,2024,lid,pids)

                  raw=[
                      {"overall_slot":s,"mfl_player_id":x["mfl_player_id"]}
                      for s,x in sorted(can["slots"].items())
                      if x.get("mfl_player_id")
                  ]
                  contam=v7.V.classify_contamination(2024,raw,meta,idx)

                  rec=dict(fl)
                  rec.update({
                      "source_origin":"v8_1_phase1_5_exact_frozen_ten_replay",
                      "new_2024_search_used":False,
                      "replacement_or_substitution_used":False,
                      "all_72_contamination_audit_performed":True,
                      "positive_contamination":bool(contam["positive_contamination"]),
                      "positive_evidence_n":int(contam["positive_evidence_n"]),
                      "positive_evidence":contam["positive_evidence"],
                      "diagnostic_unknown_n":int(contam["diagnostic_unknown_n"]),
                      "diagnostic_unknown":contam["diagnostic_unknown"],
                      "v8_1_unit_selection_reason":reason,
                      "v8_1_unit_summary":us,
                  })
                  rows=v7.rows_for(
                      2024,lid,fl.get("league_name"),bool(fl.get("idp",False)),
                      "v8_1_phase1_5_exact_frozen_ten_replay",
                      can,meta,idx,"temporal_holdout_2024"
                  )
                  all_leagues.append(rec)
                  all_occ.extend(rows)

                  if contam["positive_contamination"]:
                      excluded.append({
                          "league_id":lid,
                          "league_name":fl.get("league_name"),
                          "positive_evidence_n":int(contam["positive_evidence_n"]),
                          "positive_evidence":contam["positive_evidence"],
                      })
                  else:
                      retained_leagues.append(rec)
                      retained_occ.extend(rows)

                  print(
                      f"2024 source audit {i}/10 league={lid} "
                      f"positive_contamination={contam['positive_contamination']} "
                      f"evidence={contam['positive_evidence_n']} "
                      f"unknown={contam['diagnostic_unknown_n']}",
                      flush=True,
                  )

              # Verify the current exact-ten raw draft replay still matches the
              # pre-outcome frozen V6 first-48 bytes before any source correction.
              frozen_v6=read_jsonl(
                  work/"research/draft-pick-fv-v6/r1_r4_holdout_2024_pick_identity_v6_1.jsonl"
              )
              old={}
              for r in frozen_v6:
                  lid=str(r["league_id"]); slot=int(r["overall_slot"])
                  if lid in EXPECTED and slot<=48:
                      old[(lid,slot)]=r
              new={}
              for r in all_occ:
                  lid=str(r["league_id"]); slot=int(r["overall_slot"])
                  if slot<=48:
                      new[(lid,slot)]=r

              if set(old)!=set(new):
                  raise GateError(
                      "exact-ten first48 retained occurrence key drift: "
                      f"old_only={sorted(set(old)-set(new))[:10]} "
                      f"new_only={sorted(set(new)-set(old))[:10]}"
                  )
              fields=("mfl_player_id","franchise_id","round","within_round_pick")
              mismatch=[]
              for key in old:
                  for field in fields:
                      if str(old[key].get(field) or "")!=str(new[key].get(field) or ""):
                          mismatch.append((key,field,old[key].get(field),new[key].get(field)))
              if mismatch:
                  raise GateError(f"first48 raw replay mismatch: {mismatch[:10]}")

              # Diagnostic for the exact ten, explaining the original red.
              d10=v7.diagnostics(all_occ,all_leagues,(2024,),1.0)
              original_gate=(
                  len(all_leagues)>=MIN_HOLD
                  and d10["retention_gate_pass"]
                  and d10["identity_gate_pass"]
                  and d10["sleeper_gate_pass"]
              )

              # Apply only the preregistered Phase 1.5 contamination exclusion.
              retained_leagues.sort(key=lambda x:int(x["league_id"]))
              retained_occ.sort(key=lambda x:(int(x["league_id"]),int(x["overall_slot"])))
              if retained_leagues:
                  dc=v7.diagnostics(retained_occ,retained_leagues,(2024,),1.0)
              else:
                  dc={
                      "retention_gate_pass":False,
                      "identity_gate_pass":False,
                      "sleeper_gate_pass":False,
                      "overall_identity_coverage":0.0,
                      "overall_sleeper_ready_coverage":0.0,
                      "cell_year":{},
                      "year_weight_target":1.0,
                      "weight_normalization_proved":False,
                  }

              corrected_gate=(
                  len(retained_leagues)>=MIN_HOLD
                  and dc["retention_gate_pass"]
                  and dc["identity_gate_pass"]
                  and dc["sleeper_gate_pass"]
              )

              selected=tuple(str(x["league_id"]) for x in retained_leagues)
              excluded_ids=tuple(str(x["league_id"]) for x in excluded)

              decision=(
                  "PASS_V8_1_PHASE1_5_HOLDOUT_SOURCE_SCOPE_CORRECTION_H2_AUTHORIZED"
                  if corrected_gate else
                  "STOP_V8_1_PHASE1_5_HOLDOUT_SOURCE_SCOPE_INSUFFICIENT"
              )

              source={
                  "schema_version":1,
                  "study_id":"draft-pick-fv-v8-1-global-scale-sparse-tail-holdout-confirmation",
                  "stage":"v8_1_phase1_5_holdout_source_identity_freeze",
                  "status":"HOLDOUT_SOURCE_CORRECTION_PASS" if corrected_gate else "HOLDOUT_SOURCE_CORRECTION_STOP",
                  "decision":decision,
                  "research_only":True,
                  "draft_year":2024,
                  "original_frozen_full72_league_n":10,
                  "minimum_clean_full72_leagues":MIN_HOLD,
                  "selected_clean_full72_league_n":len(retained_leagues),
                  "original_frozen_league_ids":list(EXPECTED),
                  "selected_league_ids":list(selected),
                  "excluded_positive_contamination_league_ids":list(excluded_ids),
                  "excluded_positive_contamination_leagues":excluded,
                  "new_2024_search_used":False,
                  "replacement_or_substitution_used":False,
                  "candidate_fit_performed":False,
                  "candidate_parameter_changed":False,
                  "2024_rookie_outcomes_read":False,
                  "2025_rookie_outcomes_read":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "production_change_authorized":False,
                  "exact_ten_first48_raw_replay_match":True,
                  "original_exact_ten_gate_pass":bool(original_gate),
                  "original_exact_ten_diagnostics":d10,
                  "corrected_source_gate_pass":bool(corrected_gate),
                  "diagnostics":dc,
                  "clean_leagues":retained_leagues,
                  "occurrences":retained_occ,
                  "identity_sources":{
                      "dynastyprocess_sha256":asset["dynastyprocess"]["sha256"],
                      "nflverse_players_sha256":asset["nflverse_players"]["sha256"],
                      "fantasypros_sleeper_crosswalk_sha256":asset["fantasypros_sleeper_crosswalk"]["sha256"],
                      "identity_asset_manifest_sha256":sha(args.asset_manifest),
                  },
              }

              out=Path(args.out_dir)
              out.mkdir(parents=True,exist_ok=True)
              source_path=out/"v8_1_phase1_5_holdout_source_identity.json"
              write_json(source_path,source)

              result={
                  "schema_version":1,
                  "study_id":source["study_id"],
                  "stage":"phase1_5_preoutcome_holdout_source_scope_correction",
                  "status":source["status"],
                  "decision":decision,
                  "research_only":True,
                  "reason_for_phase1_5":"The first V8.1 Phase 2 run stopped before H2 outcome access because the exact-ten R1-R6 source replay failed its aggregate source/identity gate.",
                  "original_exact_ten":{
                      "league_n":10,
                      "league_ids":list(EXPECTED),
                      "source_gate_pass":bool(original_gate),
                      "retention_gate_pass":bool(d10["retention_gate_pass"]),
                      "identity_gate_pass":bool(d10["identity_gate_pass"]),
                      "sleeper_gate_pass":bool(d10["sleeper_gate_pass"]),
                      "overall_identity_coverage":float(d10["overall_identity_coverage"]),
                      "overall_sleeper_ready_coverage":float(d10["overall_sleeper_ready_coverage"]),
                      "failing_cells":{
                          k:v for k,v in d10["cell_year"].items()
                          if (
                              float(v["retention_fraction"])<MIN_COV
                              or float(v["represented_league_fraction"])<MIN_COV
                              or float(v["identity_coverage"])<MIN_COV
                              or float(v["sleeper_ready_coverage"])<MIN_COV
                          )
                      },
                  },
                  "preoutcome_scope_correction":{
                      "rule":"exclude whole frozen league only for positive contamination under the frozen V6 classifier applied to slots 1-72",
                      "excluded_league_n":len(excluded),
                      "excluded_league_ids":list(excluded_ids),
                      "selected_league_n":len(retained_leagues),
                      "selected_league_ids":list(selected),
                      "minimum_required":MIN_HOLD,
                      "corrected_source_gate_pass":bool(corrected_gate),
                      "retention_gate_pass":bool(dc["retention_gate_pass"]),
                      "identity_gate_pass":bool(dc["identity_gate_pass"]),
                      "sleeper_gate_pass":bool(dc["sleeper_gate_pass"]),
                      "overall_identity_coverage":float(dc["overall_identity_coverage"]),
                      "overall_sleeper_ready_coverage":float(dc["overall_sleeper_ready_coverage"]),
                      "failing_cells":{
                          k:v for k,v in dc["cell_year"].items()
                          if (
                              float(v["retention_fraction"])<MIN_COV
                              or float(v["represented_league_fraction"])<MIN_COV
                              or float(v["identity_coverage"])<MIN_COV
                              or float(v["sleeper_ready_coverage"])<MIN_COV
                          )
                      },
                  },
                  "firewalls":{
                      "new_2024_search_used":False,
                      "replacement_or_substitution_used":False,
                      "2024_rookie_outcomes_read":False,
                      "2025_rookie_outcomes_read":False,
                      "candidate_refit_performed":False,
                      "candidate_parameter_changed":False,
                      "market_or_ktc_values_read":False,
                      "package_vote_data_read":False,
                      "production_change_authorized":False,
                  },
                  "h2_open_authorized_next_stage":bool(corrected_gate),
                  "next_stage":"draft-pick-fv-v8-1-phase2-2024-h2-independent-confirmation-v2" if corrected_gate else None,
              }

              result_path=out/"v8_1_phase1_5_holdout_source_scope_correction.json"
              write_json(result_path,result)

              md=[
                  "# Draft Pick FV V8.1 — Phase 1.5 Holdout Source Scope Correction",
                  "",
                  f"**Decision:** `{decision}`",
                  "",
                  f"- Exact frozen full-72 leagues audited: **10**",
                  f"- Original exact-ten source gate: **{'PASS' if original_gate else 'FAIL'}**",
                  f"- Positive-contamination leagues excluded: **{len(excluded)}** ({', '.join(excluded_ids) if excluded_ids else 'none'})",
                  f"- Corrected frozen holdout leagues: **{len(retained_leagues)}** (minimum {MIN_HOLD})",
                  f"- Corrected identity coverage: **{dc['overall_identity_coverage']:.2%}**",
                  f"- Corrected Sleeper-ready coverage: **{dc['overall_sleeper_ready_coverage']:.2%}**",
                  f"- Corrected 18-cell source gate: **{'PASS' if corrected_gate else 'FAIL'}**",
                  "",
                  "No 2024 or 2025 rookie outcome file was opened. No new 2024 league search, replacement, substitution, candidate refit, market data, votes, or production value was used.",
              ]
              md_path=out/"v8_1_phase1_5_holdout_source_scope_correction.md"
              md_path.write_text("\n".join(md)+"\n")

              manifest={
                  "schema_version":1,
                  "study_id":source["study_id"],
                  "stage":"phase1_5_preoutcome_holdout_source_scope_correction_manifest",
                  "status":result["status"],
                  "decision":decision,
                  "original_frozen_full72_league_n":10,
                  "selected_clean_full72_league_n":len(retained_leagues),
                  "corrected_source_gate_pass":bool(corrected_gate),
                  "h2_open_authorized_next_stage":bool(corrected_gate),
                  "2024_rookie_outcomes_read":False,
                  "production_change_authorized":False,
                  "source_identity_sha256":sha(source_path),
                  "result_sha256":sha(result_path),
                  "markdown_sha256":sha(md_path),
                  "next_stage":result["next_stage"],
              }
              write_json(
                  out/"v8_1_phase1_5_holdout_source_scope_correction_manifest.json",
                  manifest,
              )

              print("DECISION="+decision)
              print("ORIGINAL_GATE_PASS="+str(original_gate).lower())
              print("EXCLUDED="+",".join(excluded_ids))
              print("SELECTED="+",".join(selected))
              print(f"SELECTED_N={len(selected)}")
              print(f"IDENTITY={dc['overall_identity_coverage']:.6f}")
              print(f"SLEEPER={dc['overall_sleeper_ready_coverage']:.6f}")
              print("H2_AUTHORIZED="+str(corrected_gate).lower())
              print("2024_ROOKIE_OUTCOMES_READ=false")

          def check(args):
              out=Path(args.out_dir)
              r=json.loads((out/"v8_1_phase1_5_holdout_source_scope_correction.json").read_text())
              s=json.loads((out/"v8_1_phase1_5_holdout_source_identity.json").read_text())
              m=json.loads((out/"v8_1_phase1_5_holdout_source_scope_correction_manifest.json").read_text())

              allowed={
                  "PASS_V8_1_PHASE1_5_HOLDOUT_SOURCE_SCOPE_CORRECTION_H2_AUTHORIZED",
                  "STOP_V8_1_PHASE1_5_HOLDOUT_SOURCE_SCOPE_INSUFFICIENT",
              }
              assert r["decision"] in allowed
              assert m["decision"]==r["decision"]==s["decision"]
              assert r["firewalls"]["2024_rookie_outcomes_read"] is False
              assert r["firewalls"]["2025_rookie_outcomes_read"] is False
              assert r["firewalls"]["new_2024_search_used"] is False
              assert r["firewalls"]["replacement_or_substitution_used"] is False
              assert r["firewalls"]["candidate_refit_performed"] is False
              assert r["firewalls"]["candidate_parameter_changed"] is False
              assert r["firewalls"]["production_change_authorized"] is False
              assert s["exact_ten_first48_raw_replay_match"] is True
              assert s["original_frozen_full72_league_n"]==10

              passed=bool(s["corrected_source_gate_pass"])
              assert passed==bool(r["h2_open_authorized_next_stage"])
              assert passed==bool(m["h2_open_authorized_next_stage"])
              if passed:
                  assert len(s["selected_league_ids"])>=8
                  d=s["diagnostics"]
                  assert d["retention_gate_pass"] is True
                  assert d["identity_gate_pass"] is True
                  assert d["sleeper_gate_pass"] is True
                  assert d["overall_identity_coverage"]>=.95
                  assert d["overall_sleeper_ready_coverage"]>=.95
                  assert len(d["cell_year"])==18
              print("PASS: Phase 1.5 source-only result is internally consistent.")

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--run",action="store_true")
              ap.add_argument("--check",action="store_true")
              ap.add_argument("--workspace")
              ap.add_argument("--v7-engine")
              ap.add_argument("--dp")
              ap.add_argument("--nflverse")
              ap.add_argument("--asset-manifest")
              ap.add_argument("--out-dir")
              a=ap.parse_args()
              if a.run: run(a)
              elif a.check: check(a)
              else: raise SystemExit("choose --run or --check")

          if __name__=="__main__":
              main()
          PY

          OUT="${RUNNER_TEMP}/out"
          mkdir -p "$OUT"

          python3 "${RUNNER_TEMP}/phase1_5_source.py" \
            --run \
            --workspace "${RUNNER_TEMP}/source-workspace" \
            --v7-engine "${RUNNER_TEMP}/v7assets/build_r1_r6_source_identity_v7.py" \
            --dp "${RUNNER_TEMP}/v7assets/db_playerids.csv" \
            --nflverse "${RUNNER_TEMP}/v7assets/nflverse_players.csv" \
            --asset-manifest "${RUNNER_TEMP}/v7assets/r1_r6_identity_asset_manifest_v7.json" \
            --out-dir "$OUT"

          python3 "${RUNNER_TEMP}/phase1_5_source.py" --check --out-dir "$OUT"

      - name: Stage Phase 1.5 frozen outputs
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v8-1"
          OUT="${RUNNER_TEMP}/out"

          cp "$OUT/v8_1_phase1_5_holdout_source_scope_correction.json" "$D/"
          cp "$OUT/v8_1_phase1_5_holdout_source_scope_correction.md" "$D/"
          cp "$OUT/v8_1_phase1_5_holdout_source_scope_correction_manifest.json" "$D/"
          cp "$OUT/v8_1_phase1_5_holdout_source_identity.json" "$D/"

      - name: Prove exact research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_identity.json"
            "research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction.json"
            "research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction.md"
            "research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction_manifest.json"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          echo "PASS: exactly four Phase 1.5 research files changed."

      - name: Run repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Upload Phase 1.5 source-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-p1-5-holdout-source-scope-correction
          path: |
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_identity.json
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction.json
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction.md
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit frozen Phase 1.5 source correction
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during Phase 1.5."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_identity.json \
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction.json \
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction.md \
            research/draft-pick-fv-v8-1/v8_1_phase1_5_holdout_source_scope_correction_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no Phase 1.5 artifacts staged."
            exit 1
          }

          git commit -m "Freeze Draft Pick FV V8.1 Phase 1.5 holdout source scope correction"
          git push origin HEAD:main

          echo "PASS: Phase 1.5 source-only correction frozen; H2 outcomes were not opened."
