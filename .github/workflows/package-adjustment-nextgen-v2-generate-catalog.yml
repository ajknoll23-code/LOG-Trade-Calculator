name: Package Adjustment NextGen V2 Generate Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-generate-catalog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression-check dependency
        run: python3 -m pip install requests

      - name: Verify exact reviewed NextGen inputs
        shell: bash
        run: |
          set -euo pipefail

          SPEC="research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"
          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"

          test -f "$SPEC"
          test -f "$GEN"

          SPEC_SHA="$(sha256sum "$SPEC" | awk '{print $1}')"
          GEN_SHA="$(sha256sum "$GEN" | awk '{print $1}')"

          test "$SPEC_SHA" = "e07734799c1b8da6a335fd8c568ccdbc7fb813562b8680073aa99613f36cb2fc"
          test "$GEN_SHA" = "d94ebd0d2f2779da788a1fe96853c10dcff625511e3e3ed1a2614e530c8304ab"

          echo "Spec SHA-256:      $SPEC_SHA"
          echo "Generator SHA-256: $GEN_SHA"
          echo "Generation HEAD:   $(git rev-parse HEAD)"

      - name: Verify production Package Adjustment before generation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Confirm catalog outputs do not already exist
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json
          test ! -e research/package-adjustment-nextgen-v2/challenge_catalog_design.md
          test -z "$(git status --porcelain=v1)"
          echo "PASS: generation starts from a clean repository with no prior NextGen catalog."

      - name: Run generator self-test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            --selftest

      - name: Generate unreleased research catalog
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py

      - name: Validate generated catalog contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("research/package-adjustment-nextgen-v2")
          catalog_path = root / "package_vote_challenges_nextgen_v2.json"
          design_path = root / "challenge_catalog_design.md"

          assert catalog_path.is_file()
          assert design_path.is_file()

          doc = json.loads(catalog_path.read_text(encoding="utf-8"))

          assert doc["schema_version"] == 1
          assert doc["status"] == "generated_research_catalog_unreleased"
          assert doc["research_only"] is True
          assert doc["frozen"] is False
          assert doc["production_formula_enabled"] is False
          assert doc["automatic_production_change_allowed"] is False
          assert doc["production_revision_at_generation"] == "v1.6-v5-size2-composition-overlay"
          assert doc["exact_live_formula_sha256_at_generation"] == "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7"
          assert doc["generator_sha256"] == "d94ebd0d2f2779da788a1fe96853c10dcff625511e3e3ed1a2614e530c8304ab"
          assert doc["pick_cells"]["active"] is False

          challenges = doc["challenges"]
          assert len(challenges) == 144

          family_counts = Counter(c["family"] for c in challenges)
          assert family_counts == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 30,
              "structural_topology_3v3": 24,
          }

          split_counts = Counter(c["split"] for c in challenges)
          assert split_counts == {
              "train": 90,
              "structural_scale_holdout": 30,
              "structural_topology_holdout": 24,
          }

          assert not doc["catalog_diagnostics"]["skipped_or_underfilled_cells"]
          assert all(c["fit_eligible"] is False for c in challenges if c["family"] == "structural_topology_3v3")
          assert all(c["fit_eligible"] is False for c in challenges if c["split"] != "train")
          assert all(c["values_hidden_from_voter"] is True for c in challenges)

          design = design_path.read_text(encoding="utf-8")
          assert "GENERATED / UNRELEASED" in design
          assert "RESEARCH ONLY" in design
          assert "Production V1.6 is unchanged" in design

          print("PASS: generated catalog contract validated.")
          print("Challenges:", len(challenges))
          print("V_REF:", doc["v_ref"]["value"])
          print("Core scale anchors:", doc["design"]["scale_anchors"])
          print("Fragmentation scale anchors:", doc["design"]["fragmentation_scale_anchors"])
          print("Structural holdout scale anchors:", doc["design"]["structural_holdout_scale_anchors"])
          print("Family counts:", dict(family_counts))
          print("Split counts:", dict(split_counts))
          PY

      - name: Prove only the two intended research outputs changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json",
              "research/package-adjustment-nextgen-v2/challenge_catalog_design.md",
          }

          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          )
          actual = set()
          for line in out.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              actual.add(path)

          if actual != expected:
              raise SystemExit(
                  f"Unexpected repository changes. expected={sorted(expected)} actual={sorted(actual)}"
              )

          print("PASS: only intended NextGen research outputs changed.")
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Re-verify production Package Adjustment after generation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Recheck exact changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json",
              "research/package-adjustment-nextgen-v2/challenge_catalog_design.md",
          }
          out = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          actual = {line[3:] for line in out.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  f"Unexpected repository changes after regression checks. "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )
          print("PASS: regression checks introduced no additional repository changes.")
          PY

      - name: Commit only the unreleased research catalog
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json \
            research/package-adjustment-nextgen-v2/challenge_catalog_design.md

          STAGED="$(git diff --cached --name-only)"
          EXPECTED="$(printf '%s\n' \
            'research/package-adjustment-nextgen-v2/challenge_catalog_design.md' \
            'research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json')"

          test "$STAGED" = "$EXPECTED"

          git commit -m "Generate Package Adjustment NextGen V2 research catalog"
          git push origin HEAD:main

          echo "PASS: committed only the two unreleased NextGen research outputs."
