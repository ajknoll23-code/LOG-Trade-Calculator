          ensure(before_main==after_main,'canonical price engine modified')
          ensure((after.replace(new,old,1).replace(css,'',1)==before) if old in before else (after==before),
                 'HTML changed beyond permitted UI links')
          if after!=before: board.write_text(after,encoding='utf-8')
          print(json.dumps({'changed':'public UI only','new_style':'assets/fa_start_sit_private_v1.css',
                            'js_sha256':files['assets/fa_start_sit_v1.js']['sha256'],
                            'subscriber_content_in_workflow':False,'mode':'${{ inputs.mode }}'}))
          PYCODE
      - name: Validate no source rankings published and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_start_sit_v1.js
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          s=Path('assets/fa_start_sit_v1.js').read_text()
          html=Path('free-agent-board.html').read_text()
          assert 'LOG_Private_StartSit_Weekly_2026_v1' in s
          assert 'DecompressionStream' in s and 'privatePut' in s and 'privateGet' in s
          assert 'fa-ss-install=' in s and 'fa-ws-startsit' in s
          assert '<!-- FA_START_SIT_PRIVATE_CACHE_V1_STYLE -->' in html
          assert 'fa_start_sit_v1.js?v=2' in html
          assert '/* CANONICAL VALUATION SYNC' in html
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'assets/fa_start_sit_v1.js','assets/fa_start_sit_private_v1.css','free-agent-board.html'}
          assert changed<=allowed, 'Unexpected changed files: '+str(changed-allowed)
          print('PASS static privacy contract, browser-local cache implementation, JS syntax, allowed paths')
          PYCODE
      - name: Preview diff
        if: inputs.mode == 'preview'
        shell: bash
        run: |
          git diff --stat
          git status --short
          echo 'PREVIEW PASS: no files will be committed'
      - name: Commit validated public UI on Apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/fa_start_sit_v1.js assets/fa_start_sit_private_v1.css free-agent-board.html
          if git diff --cached --quiet; then
            echo 'No changes: already installed'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "A-FA12R1 Start Sit local one-click activation and automatic private restore"
          git push origin HEAD:main
