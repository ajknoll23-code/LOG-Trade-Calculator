name: A-FA12R1 - Auto-Load Private Start Sit Consensus

# This workflow installs code only. Private owner-provided ranking rows and
# personal activation payload are never uploaded/committed to public GitHub.
# One-time activation uses a browser fragment, then caches the validated
# source snapshot locally in IndexedDB for repeat visits on that device.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates code without committing; Apply installs UI-only change"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  private-consensus-ui:
    name: Start Sit private auto-load (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing Start Sit and clean repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -s free-agent-board.html
          test -s assets/fa_start_sit_v1.js
          test -s assets/fa_workspace_v1.js
          test -s assets/fa_start_sit_v1.css
          test -s data/free_agents.json
          test -s data/league_rosters.json
          test -s data/my_roster.json
      - name: Install privately cached comparison code and versioned HTML references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
