name: 4for4 Offense V1 - Confidence C2 Confirm and Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  confidence-c2-confirm-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Pin exact green C2 and current successor base
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            expected="$1"; path="$2"; actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: git blob drift for $path" >&2
              echo "expected=$expected actual=$actual" >&2
              exit 1
            fi
          }
          check_blob 48bfde133222d6800b408a612b689baf2fbc44e0 .github/workflows/fourforfour-offense-v1-confidence-c2-shadow.yml
          check_blob 4cd06b20687b74a4b5cc8747f63605891db061bd .github/workflows/fourforfour-offense-v1-phase-o1-shadow.yml
          check_blob 614de86618ddec066ad8209547efb08d8963165c index.html
          check_blob 23807ceaa9abcb46b02d652891ddbc7840bc6358 free-agent-board.html
          check_blob d50b2fa3d934f5c4e2f8370c662858be33790d33 scripts/validation/validate_idp_v1_final_deployment.py
          check_blob b6d04a6c3a0b934db228e3c5461c7ecb2125d5df model/releases/fourforfour-offense-live-role-r1-v1/release.json
          python3 scripts/validation/validate_idp_v1_final_deployment.py
          rm -f scripts/validation/idp_v1_final_deployment_validation.json scripts/validation/idp_v1_final_deployment_validation.md
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          git diff --exit-code -- .

      - name: Decode private 4for4 offense export
        shell: bash
        run: |
          set -euo pipefail
          for var in FOURFORFOUR_OFFENSE_GZ_B64_PART1 FOURFORFOUR_OFFENSE_GZ_B64_PART2 FOURFORFOUR_OFFENSE_GZ_B64_PART3; do
            if [ -z "${!var:-}" ]; then echo "ERROR: required secret $var missing." >&2; exit 1; fi
          done
          install -d -m 700 /tmp/log-fourforfour-offense-v1/input
          printf '%s%s%s' "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" \
            | base64 --decode | gzip -dc > /tmp/log-fourforfour-offense-v1/input/offense.csv
          chmod 600 /tmp/log-fourforfour-offense-v1/input/offense.csv
          echo '488f8b7bf74b5e30ed515c7cde4b2049d1af6ad0d953ae7f78fd82561293af11  /tmp/log-fourforfour-offense-v1/input/offense.csv' | sha256sum --check --strict

