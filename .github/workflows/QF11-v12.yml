# QF11 V12: owner decision research only. No polls, no voter URLs, no valuation/model/identity changes.
name: QF11 V12 - Conditional Priority Preservation and TE Ballot Rescue (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF11_V12_INPUT: /tmp/qf11-v12-input
  QF11_V12_OUTPUT: /tmp/qf11-v12-output
  QF11_V12_ROOT: .
jobs:
  research:
    name: Verify original priority identity-conditional 25-slot slate and TE alternative feasibility
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin immutable production and crosswalk inputs
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; };
        }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo QF11_V12_SOURCE_PINS_GREEN'
    - name: Download exact QF11 V11 priority identity audit
      uses: actions/download-artifact@v4
      with:
        name: QF11-v11-RESEARCH-ONLY-identity-priority-decision
        run-id: 38281366896
        github-token: ${{ github.token }}
        path: /tmp/qf11-v12-input/v11
    - name: Download exact QF11 V10 original global choice slate
      uses: actions/download-artifact@v4
      with:
        name: QF11-v10-RESEARCH-ONLY-global-owner-review
        run-id: 38279761923
        github-token: ${{ github.token }}
        path: /tmp/qf11-v12-input/v10
    - name: Download exact QF11 V3 source-aligned player FV snapshot
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        github-token: ${{ github.token }}
        path: /tmp/qf11-v12-input/v3
    - name: Test conditional priority-preserving 25-slot option and strictly screened slot11 TE designs
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/qf11-v12-audit.py <<'QF11_V12_PY'\n#!/usr/bin/env python3\n\"\"\"QF11 V12:\
        \ identity-conditional high priority retention and held-TE rescue study.\nNEVER authorize voting, publishing,\
        \ identity changes, model changes, or market changes.\n\"\"\"\nimport collections\nimport hashlib\nimport\
        \ json\nimport math\nimport os\nimport re\nimport sys\nfrom pathlib import Path\n\nFIXTURE = '--fixture'\
        \ in sys.argv\nHERE = Path(os.getenv('QF11_V12_INPUT', '/mnt/data/qf11_v12_fixture' if FIXTURE else '/tmp/qf11-v12-input'))\n\
        OUT = Path(os.getenv('QF11_V12_OUTPUT', '/mnt/data/qf11_v12_fixture_output' if FIXTURE else '/tmp/qf11-v12-output'))\n\
        ROOT = Path(os.getenv('QF11_V12_ROOT', '.'))\nOUT.mkdir(parents=True,exist_ok=True)\nPINS = {\n 'v11': ('v11/RESEARCH_ONLY_v11_identity_and_priority_matrix.json','3850b117dfcd5b0f0087573ffc399513f92b233de4e9960ba2e957d4c40f402a'),\n\
        \ 'v10': ('v10/RESEARCH_ONLY_v10_shadow_slate.json','5d531e5ddaf97ff4aa6e2590b9b68680af56bde46f9c6b1528f9db7a2a08c62f'),\n\
        \ 'v3': ('v3/PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json','19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc'),\n\
        }\nsource = {}\nfor k,(p,digest) in PINS.items():\n    p = HERE / p\n    actual=hashlib.sha256(p.read_bytes()).hexdigest()\n\
        \    assert actual==digest, f'STOP immutable {k} archive changed {actual}'\n    source[k]=json.loads(p.read_text())\n\
        v11, slate, v3 = source['v11'], source['v10'], source['v3']\nassert v11['status']=='RESEARCH_ONLY_IDENTITY_AND_TARGET_PRESERVATION_ADJUDICATION'\n\
        assert slate['summary']['total_shadow_slots_including_existing_screened']==25\nassert v11['optional_coherent_shadow_slots']==25\
        \ and v11['priority_reservation_shadow_slots']==21\nassert v11['original_source_screened_slots']==12\nassert\
        \ len(slate['slots'])==28 and len(v11['identity_evidence'])==10\nassert v11['unresolved_slots'][0]['slot']==5\
        \ and [x['slot'] for x in v11['unresolved_slots']]==[5,11,21]\nassert v3['research_only'] and not v3['deployment_authorized']\n\
        assert len(v3['players'])==504\nassert v11['owner_approval'] is False and v11['voting_activated'] is False\
        \ and v11['publication_authorized'] is False\nassert slate['summary']['voting_activated'] is False and slate['summary']['owner_approval']\
        \ is False\n\n# Snapshot's model FV is used only to validate archived comparisons; no FV mutation.\nif not\
        \ FIXTURE:\n    sys.path.insert(0,str(ROOT))\n    from scripts.validation import snapshot_values\n    current=snapshot_values.compute_all_values(snapshot_values.load_from_html(ROOT/'index.html'))\n\
        \    for key,p in v3['players'].items():\n        assert key in current and current[key]['value']==p['fundamental_value']\
        \ and current[key]['pos']==p['pos'], f'STOP current FV source drift {key}'\n\npvals=v3['players']\ndef info(key):\n\
        \    p=pvals.get(key)\n    assert p and isinstance(p.get('fundamental_value'),(int,float)) and p['fundamental_value']>0,\
        \ f'STOP missing prospective FV {key}'\n    return p\n\nPRIORITY={'will anderson','byron young','micah parsons','malik\
        \ willis'}\nREVERT={1:'will anderson',8:'byron young',12:'micah parsons',15:'malik willis'}\nconditional=[];changed=[]\n\
        for row in slate['slots']:\n    n=row['slot']\n    candidate=row['candidate_player_keys']\n    if not candidate:continue\n\
        \    assert row['classification'] in ('SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED','OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY')\n\
        \    if n in REVERT:\n        assert REVERT[n] in row.get('targeted_players_removed_in_shadow',[])\n   \
        \     assert REVERT[n] in row['original_player_keys']\n        original=row['original_player_keys']\n  \
        \      assert len(set(original))==3\n        changed.append({'slot':n,'priority_preserved':REVERT[n], 'owner_only_original':original,\
        \ 'not_approved_optional_v10':candidate,\n                        'original_source_holds':row.get('original_hold_reasons',[]),\n\
        \                        'conditional_identity_decision_required':True})\n        candidate=original\n \
        \   else:\n        assert not row.get('targeted_players_removed_in_shadow'), 'STOP hidden priority removal\
        \ in other slot'\n    p=[info(k) for k in candidate]\n    assert len(set(candidate))==3\n    assert p[0]['pos']==p[1]['pos']\
        \ and p[0]['pos']!=p[2]['pos'], f'STOP pair shape {n}'\n    ratio=max(x['fundamental_value'] for x in p)/min(x['fundamental_value']\
        \ for x in p)\n    assert ratio<=1.30+1e-9, f'STOP spread {n} {ratio}'\n    conditional.append({'slot':n,'players':list(candidate),'same_position_pair':list(candidate[:2]),\
        \ 'cross_position_third':candidate[2],\n                        'fv_ratio':round(ratio,6),'source_status':'CONDITIONAL_OWNER_REVIEW_NOT_SOURCE_CLEARED'\
        \ if n in REVERT else row['classification'],\n                        'ballot_issuance_authorized':False})\n\
        assert len(changed)==4 and len(conditional)==25\ncounts=collections.Counter(k for row in conditional for\
        \ k in row['players'])\npairs=[tuple(sorted(row['same_position_pair'])) for row in conditional]\nassert\
        \ len(pairs)==len(set(pairs))==25\nassert max(counts.values())<=2\nassert all(counts[p]>=1 for p in PRIORITY)\n\
        assert set(r['slot'] for r in conditional).isdisjoint({5,11,21})\nassert all(r['source_status']!='VOTER_APPROVED'\
        \ for r in conditional)\nidentity={r['player']:r for r in v11['identity_evidence']}\nassert PRIORITY.issubset(identity)\n\
        assert all(identity[p]['final_decision']=='REQUIRES_EXPLICIT_OWNER_REVIEW' for p in PRIORITY)\nassert all(not\
        \ identity[p]['ballot_issuance_authorized'] for p in PRIORITY)\n\n# V12 source-specific TE redesign: test\
        \ strict crosswalk identities, exact teams\n# and existing globally coordinated 25-slot appearance/pair\
        \ limits.\ndef norm(s):\n    return re.sub(r'\\s+',' ',re.sub(r'[^a-z0-9 ]',' ',str(s or '').lower())).strip()\n\
        def team(s):\n    s=str(s or '').upper();return {'JAC':'JAX','WSH':'WAS','LA':'LAR'}.get(s,s)\n\nstrict_te=[]\n\
        crosswalk=[]\nif not FIXTURE:\n    crosswalk=json.loads((ROOT/'scripts/identity_crosswalk.json').read_text())\n\
        \    assert isinstance(crosswalk,list) and len(crosswalk)>150\n    html=(ROOT/'index.html').read_text()\n\
        \    # Strictly anchored in actual PLAYER_DB. This regex is only a review filter, not a source of player\
        \ value.\n    from scripts.validation.snapshot_values import extract_object_body\n    player_body=extract_object_body(html,'PLAYER_DB')\n\
        \    pattern=re.compile(r\"'([^']+)':\\{pos:'([A-Z]+)',age:\\d+,role:'[^']+',team:'([^']+)'\",re.M)\n  \
        \  model_teams={k:t for k,pos,t in pattern.findall(player_body) if pos=='TE'}\n    assert len(model_teams)>20\n\
        \    byname=collections.defaultdict(list)\n    for r in crosswalk:\n        if r.get('name'):byname[norm(r['name'])].append(r)\n\
        \    for k,p in pvals.items():\n        if p['pos']!='TE' or k not in model_teams:continue\n        matching=byname.get(norm(k),[])\n\
        \        if len(matching)!=1:continue\n        r=matching[0]\n        if not r.get('sleeper_id'):continue\n\
        \        if r.get('fp_position')!='TE' or r.get('sleeper_pos') not in ('TE',):continue\n        if team(r.get('fp_team'))!=team(model_teams[k])\
        \ or team(r.get('sleeper_team'))!=team(model_teams[k]):continue\n        strict_te.append(k)\nelse:\n  \
        \  # Fixture exercises only negative/shape safety; it cannot claim source clearance.\n    strict_te=[]\n\
        \norig_11=['brock bowers','trey mcbride','nakobe dean']\nassert len(v11['unresolved_slots'])==3 and v11['unresolved_slots'][1]['original']==orig_11\n\
        assert info('brock bowers')['pos']==info('trey mcbride')['pos']=='TE'\nassert info('nakobe dean')['pos']!='TE'\n\
        options=[]\nfor prior in ('brock bowers','trey mcbride'):\n    for other in strict_te:\n        if other\
        \ in orig_11:continue\n        names=[prior,other,'nakobe dean']\n        if any(counts[k]>=2 for k in names):continue\n\
        \        tup=tuple(sorted(names[:2]))\n        if tup in pairs:continue\n        p=[info(k) for k in names]\n\
        \        ratio=max(x['fundamental_value'] for x in p)/min(x['fundamental_value'] for x in p)\n        if\
        \ ratio>1.30+1e-9:continue\n        options.append({'candidate':names,'preserved_original_TE':prior,'substitute_TE':other,\n\
        \                        'pair':list(tup),'fv_ratio':round(ratio,6),'source_screened_only_not_approved':True})\n\
        options.sort(key=lambda x:(x['fv_ratio'],x['candidate']))\n\n# All proposed results are descriptive. Even\
        \ a zero option count is a valid scientific result.\nsummary={'status':'RESEARCH_ONLY_PRIORITY_CONDITIONAL_RETAIN_AND_TE_RESCUE',\n\
        \ 'original_catalog_slots':28,'v10_optional_coherent_slots':25,\n 'v11_restricted_priority_reservation_slots':21,'v12_conditional_priority_preserving_slots':25,\n\
        \ 'v12_conditional_slots_without_identity_clearance':[1,8,12,15],\n 'original_unresolved_slots':[5,11,21],\n\
        \ 'priority_players_preserved':sorted(PRIORITY),'global_unique_same_position_pairs':len(set(pairs)),\n 'global_max_appearances':max(counts.values()),'v12_strict_te_candidates':len(strict_te),\n\
        \ 'slot11_source_screened_alt_count':len(options),\n 'slot11_options_are_not_owner_approved':True,'same_cohort_as_v3':True,\n\
        \ 'voting_activated':False,'owner_approval':False,'identity_resolution_authorized':False,\n 'market_or_model_promotion_authorized':False,'publication_authorized':False,\n\
        \ 'missing_stable_ids_are_not_filled_by_name_guess':True,\n 'source_sha256':{k:v[1] for k,v in PINS.items()},\n\
        \ 'te_review_mode':'LOCAL_MECHANICS_FIXTURE_NOT_SOURCE_VERIFIED' if FIXTURE else 'CURRENT_PINNED_CROSSWALK_SOURCE_SCREENED_ONLY'}\n\
        (OUT/'RESEARCH_ONLY_v12_conditional_priority_slate.json').write_text(json.dumps({'summary':summary,'slots':conditional,'original_priority_holds':changed},sort_keys=True,indent=2)+'\\\
        n')\n(OUT/'RESEARCH_ONLY_v12_slot11_te_options.json').write_text(json.dumps({'research_only':True,'original_slot':11,'original':orig_11,'source_screened_candidate_count':len(strict_te),\n\
        \ 'options':options[:25],'overflow_options_count':max(0,len(options)-25),'not_authorized_for_voting':True},sort_keys=True,indent=2)+'\\\
        n')\nlines=['# QF11 V12 \u2014 Conditional priority preservation and slot 11 TE redesign','',\n'**RESEARCH\
        \ ONLY. This document is not an owner approval, voting catalog, or identity fix.**','',\n'## Main finding','',\n\
        '- V10 optional 25 slots removed Will Anderson, Byron Young, Micah Parsons, and Malik Willis from four held\
        \ ballots.',\n'- V11 restricted the no-displacement shadow to 21 slots because the four original players\
        \ lacked strict source clearance.',\n'- V12 mechanically reinstates those four original player names in\
        \ their respective slots, and verifies that the resulting 25-slot *conditional* slate retains 25 unique\
        \ same-position pairs, has no player appearing more than twice, and maintains <=1.30 three-player FV spread.',\n\
        '- **This does not increase the number of approved or source-screened ballots.** Four original source holds\
        \ remain, plus any others inherited from V10. None can be issued to voters.','',\n'## Four protected target\
        \ ballots','',\n'| Slot | Preserved priority target | Original ballot | Original flags still held |',\n\
        '|---:|---|---|---|']\nfor r in sorted(changed,key=lambda r:r['slot']):\n    lines.append('| '+str(r['slot'])+'\
        \ | '+r['priority_preserved']+' | '+' / '.join(r['owner_only_original'])+' | '+('; '.join(r['original_source_holds'])\
        \ or 'Owner identity review')+' |')\nlines+=['','## Held slot 11: repeated Bowers\u2013McBride pair','',\n\
        \ f'- Strict current-source TE pool: {len(strict_te)} candidate identities (not automatically approved).',\n\
        \ f'- Valid source-screened one-TE-retained redesign suggestions under the conditional 25-slot global appearance\
        \ and pair limits: **{len(options)}**.',\n '- The original Bowers/McBride pairing is not reissued and remains\
        \ held.',\n '- A proposed third-party alternative still requires positional eligibility, realism, scientific\
        \ objective, and owner review.','',\n '| Existing TE retained | Substitute TE candidate | Third player |\
        \ FV spread ratio |','|---|---|---|---:|']\nfor option in options[:15]:\n    lines.append('| '+option['preserved_original_TE']+'\
        \ | '+option['substitute_TE']+' | nakobe dean | '+str(option['fv_ratio'])+' |')\nif not options:lines.append('|\
        \ None verified by current strict criteria | None | \u2014 | \u2014 |')\nlines+=['','## Remaining source\
        \ and governance holds','',\n'- Slot 5: Will Anderson Jr. suffix naming / no direct Sleeper ID in audited\
        \ crosswalk, Byron Young DL vs LB provider taxonomy, James Cook III suffix naming. All identity adjudications\
        \ stay held.',\n'- Slot 21: Jaylon Carlies DB vs provider LB; Jaylon Jones name/identity not uniquely linked.\
        \ Held.',\n'- Malik Willis: model NYJ vs independently crosswalked MIA remains a team conflict. Held.',\n\
        '- Micah Parsons / Byron Young: model DL vs Sleeper LB must be adjudicated as an IDP position taxonomy decision,\
        \ not silently mapped.',\n'- Trevor Lawrence JAC vs JAX is a possible team-code alias, not standalone voter\
        \ permission.',\n'- Published Market Value refresh, pairwise evidence sufficiency and any poll issuance\
        \ are NOT authorized.',\n'- Next gate: independent ID crosswalk/adjudication and owner-reviewed candidate\
        \ choices before any real voting.']\n(OUT/'RESEARCH_ONLY_v12_owner_review.md').write_text('\\n'.join(lines)+'\\\
        n')\nassert {p.name for p in OUT.iterdir()}=={'RESEARCH_ONLY_v12_conditional_priority_slate.json','RESEARCH_ONLY_v12_slot11_te_options.json','RESEARCH_ONLY_v12_owner_review.md'},'STOP\
        \ output shape drift'\nfor p in OUT.iterdir():\n    b=p.read_text()\n    assert all(x not in b for x in\
        \ ('voter_roster_id','sheet_url','raw_ballots')),'STOP voter privacy leak'\nprint('QF11_V12_CONDITIONAL_PRIORITY_GREEN\
        \ '+json.dumps({'candidate_slots':25,'original_priority_retained':sorted(PRIORITY),'unique_pairs':len(set(pairs)),'global_max_player_appearances':max(counts.values()),'priority_source_holds_resolved':0,'voting_activated':False,'held_original_slots':[5,11,21]},sort_keys=True))\n\
        print('QF11_V12_SLOT11_TE_RESCUE '+json.dumps({'strict_source_TE_pool':len(strict_te),'possible_strict_source_screened_1TE_retained_redesigns':len(options),'owner_approved':False},sort_keys=True))\n\
        QF11_V12_PY\npython3 -m py_compile /tmp/qf11-v12-audit.py\npython3 /tmp/qf11-v12-audit.py"
    - name: Run all 14 frozen valuation regression groups and FA PA release selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V12_FROZEN_14_REGRESSIONS_GREEN'
    - name: Prove zero repo writes, exact protected blobs, and unresolved owner gate
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_REPO_WRITES; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; };
        }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        python3 - <<''QF11_V12_FINISH''

        from pathlib import Path

        import json

        p=Path("/tmp/qf11-v12-output")

        names={"RESEARCH_ONLY_v12_conditional_priority_slate.json","RESEARCH_ONLY_v12_slot11_te_options.json","RESEARCH_ONLY_v12_owner_review.md"}

        assert {x.name for x in p.iterdir()}==names

        d=json.loads((p/"RESEARCH_ONLY_v12_conditional_priority_slate.json").read_text())

        assert d["summary"]["v12_conditional_priority_preserving_slots"]==25

        assert d["summary"]["voting_activated"] is False

        assert d["summary"]["owner_approval"] is False

        assert d["summary"]["identity_resolution_authorized"] is False

        print("QF11_V12_ZERO_WRITE_NO_OWNER_APPROVAL_GREEN")

        QF11_V12_FINISH'
    - name: Archive research-only conditional decision artifacts, 7 days
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v12-RESEARCH-ONLY-conditional-priority-preservation
        path: /tmp/qf11-v12-output/
        retention-days: 7
        if-no-files-found: error
