      - name: Run inherited originality regression tests
        shell: bash
        run: python3 "$RUNNER_TEMP/nl54r2.py" --self-test
      - name: Audit approved PDFs; report missing historical editions
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/nl54r2.py" \
            --repo "$GITHUB_REPOSITORY" \
            --archive-root downloaded_history \
            --manifest metadata/NL54R2-SOURCES.json \
            --out-dir nl54r2_output
      - name: Upload audit and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL54R2-Historical-Originality-PREVIEW-${{ github.run_id }}
          path: nl54r2_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Display audit report
        if: always()
        shell: bash
        run: |
          if test -s nl54r2_output/NL54R2-PREVIEW.md; then
            cat nl54r2_output/NL54R2-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Archive audit failed; no publication authorized.' >> "$GITHUB_STEP_SUMMARY"
          fi
