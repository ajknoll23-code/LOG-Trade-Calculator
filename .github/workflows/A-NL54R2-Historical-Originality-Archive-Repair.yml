name: A-NL54R2 - Historical Newsletter Archive Retrieval Repair (Read-Only)
run-name: A-NL54R2 - Download approved editions and audit both LOG newsletters
'on':
  workflow_dispatch:
    inputs:
      history_run_pages:
        description: Search latest 1-12 pages of Actions runs for approved releases
        type: string
        required: true
        default: '4'
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl54r2-historical-retrieval-preview
  cancel-in-progress: false
jobs:
  discover:
    name: Discover approved historical PDF artifacts, not shadow previews
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      count: ${{ steps.sources.outputs.count }}
    steps:
      - name: Discover exact successful release runs and their artifacts
        id: sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_PAGES: ${{ inputs.history_run_pages }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,re
          pages=int(os.environ['HISTORY_PAGES'])
          if not 1<=pages<=12:raise SystemExit('history_run_pages must be 1..12')
          repo=os.environ['GITHUB_REPOSITORY']
          base='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28','User-Agent':'LOG-NL54R2-ReadOnly'}
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as f:return json.load(f)
          types={'.github/workflows/A-NL47R1-Weekly-Approved-V7-Newsletters.yml':'NL47',
                 '.github/workflows/A-NL44R1-V7-WarRoom-Release-Renamed-v2.yml':'NL44'}
          sources=[];seen=set()
          for page in range(1,pages+1):
              batch=get('/actions/runs?per_page=100&page='+str(page)).get('workflow_runs',[])
              for r in batch:
                  typ=types.get(r.get('path'))
                  if not typ or r.get('conclusion')!='success' or r.get('status')!='completed' or r.get('head_branch')!='main':continue
                  rid=int(r['id'])
                  if rid in seen:continue
                  artifacts=get(f'/actions/runs/{rid}/artifacts?per_page=100').get('artifacts',[])
                  permitted=[a for a in artifacts if not a.get('expired') and (
                      (typ=='NL47' and 'APPROVED-WEEKLY-PDFS' in a.get('name','')) or
                      (typ=='NL44' and 'WarRoom-RELEASE' in a.get('name','')))]
                  if len(permitted)>1:raise RuntimeError(f'Ambiguous approved release artifacts for run {rid}')
                  if not permitted:continue
                  a=permitted[0]
                  name=a['name']
                  if not re.fullmatch(r'[a-zA-Z0-9_.-]{1,200}',name):raise RuntimeError('Unexpected artifact name')
                  sources.append({'run_id':rid,'artifact_name':name,'workflow':typ,
                                  'created_at':r.get('created_at'),'url':r.get('html_url')})
                  seen.add(rid)
              if len(batch)<100:break
          sources.sort(key=lambda z:z['run_id'],reverse=True)
          if not sources:raise RuntimeError('No successful approved release artifacts discovered. Preview must not pass empty.')
          matrix={'include':[{'run_id':s['run_id'],'artifact_name':s['artifact_name']} for s in sources]}
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
              f.write('count='+str(len(sources))+'\n')
          with open('NL54R2-SOURCES.json','w') as f:json.dump({'repository':repo,'sources':sources},f,indent=2)
          print('PASS: identified',len(sources),'approved releases; artifact downloads occur through actions/download-artifact@v4')
          PY
      - name: Upload immutable archive source manifest
        uses: actions/upload-artifact@v4
        with:
          name: NL54R2-SOURCE-MANIFEST-${{ github.run_id }}
          path: NL54R2-SOURCES.json
          retention-days: 30
          if-no-files-found: error

  download:
    name: Read approved PDF release from run ${{ matrix.run_id }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Download GitHub-approved release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: payload/${{ matrix.run_id }}
      - name: Require at least one real PDF
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find 'payload/${{ matrix.run_id }}' -type f -iname '*.pdf' -print -quit)"
      - name: Carry read-only source into audit job
        uses: actions/upload-artifact@v4
        with:
          name: NL54R2-INTERNAL-${{ matrix.run_id }}
          path: payload/
          retention-days: 7
          if-no-files-found: error

  audit:
    name: Verify PDF identities and report exact history coverage and repetition
    needs: [discover, download]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to pass if any source download failed
        shell: bash
        env:
          DOWNLOAD_STATUS: ${{ needs.download.result }}
        run: |
          test "$DOWNLOAD_STATUS" = success || { echo 'Approved release download failed; cannot certify archive' >&2; exit 1; }
      - name: Restore GitHub approved source manifest
        uses: actions/download-artifact@v4
        with:
          name: NL54R2-SOURCE-MANIFEST-${{ github.run_id }}
          path: metadata/
      - name: Collect all approved source PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: NL54R2-INTERNAL-*
          merge-multiple: true
          path: downloaded_history/
      - name: Install pinned PDF inspector
        run: python3 -m pip install --disable-pip-version-check 'pymupdf==1.26.5'
      - name: Restore checksum-pinned historical audit engine
