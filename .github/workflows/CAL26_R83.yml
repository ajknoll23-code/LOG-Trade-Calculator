# CAL26 V1R83. Read-only source-pinned H2 evidence. No valuation writes, no private data export.
name: CAL26 V1R83 - Historical Two-Year Position Continuity and 2028 Proxy (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r83-h2-survival-and-economic-scale-hold
  cancel-in-progress: false
jobs:
  historical-h2-continuity-no-fv-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout exact live FV source read only
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
    - name: Use Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download proven 2021-2025 two-horizon historical archive
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R60_2021_25_SEVEN_POSITION_FUTURE_SURPLUS_RESEARCH_ONLY
        run-id: 40057944765
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r83-in/R60
    - name: Download green R82 current two-year surplus and economic scale hold
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R82_2026_2027_SURPLUS_UTILITY_SCALE_UNIDENTIFIED_FV_HOLD
        run-id: 40136427921
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r83-in/R82
    - name: Audit true 2-year historical position continuity and conditional 2028 proxy no FV
      shell: bash
      run: "set -euo pipefail\n# Fail closed on changes to the tested exact live FV reference.\ntest \"$(git hash-object index.html)\"\
        \ = \"5630bb681dd8710f8e45bc5363488f358ce9ebe2\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\ncat > \"$RUNNER_TEMP/CAL26_R83_engine.py\"\
        \ <<'PY_R83_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 R83, chronology-separated historical H2 skill and participation shadow.\n\
        No pricing, no 2026 Weeks 7+ outcomes, no 2028 observation, no age-model claims.\n\"\"\"\nimport argparse,csv,hashlib,json,math,statistics,collections,pathlib\n\
        P=pathlib.Path\nPOS=('QB','RB','WR','TE','DL','LB','DB')\nFOCUS=('drake maye','malik nabers','bryce young','cj stroud','puka\
        \ nacua')\nPIN={\n 'R60':{'CAL26_V1R60_2021_25_historical_id_playerseason_rows.csv':'b93de295d84df948d1d4c00af21e791584b61f887f37e500d42a87cabd07613c',\n\
        \        'CAL26_V1R60_21_position_horizon_holdouts.csv':'9d5f07824a7e899bd2c6eab4ba7075a5ecc560c19c70ec2d23f0f74fe83bf395'},\n\
        \ 'R82':{'CAL26_R82_518_TWO_YEAR_SURPLUS_UTILITY_SCENARIOS_NOT_FV.csv':'147a4fb61409540ba75b9238766f4d5e2fa920a8356b51434fc456f6ae8c4f47',\n\
        \        'CAL26_R82_manifest.json':'d69d612ab5323efd37d63d431c8cab9fdce6a645380c7584bf86e3804d82a2aa'}\n}\ndef check(cond,msg):\n\
        \ if not cond:raise AssertionError(msg)\ndef hashfile(p):return hashlib.sha256(p.read_bytes()).hexdigest()\ndef read(p):\n with\
        \ p.open(encoding='utf8',newline='') as f:return list(csv.DictReader(f))\ndef val(x,k):\n try: v=float(x)\n except (ValueError,TypeError):raise\
        \ AssertionError('NONNUMERIC_'+k)\n check(math.isfinite(v),'NONFINITE_'+k);return v\ndef rpt(x,n=4):return round(x,n)\ndef median_positive(records):\n\
        \ pos=[r[0] for r in records if r[0]>0];check(len(pos)>8,'TOO_FEW_POSITIVES');return statistics.median(pos)\ndef bucket(x,cut):return\
        \ 0 if x<=0 else (1 if x<=cut else 2)\ndef fit(train):\n x=[q[0] for q in train];y=[q[1] for q in train]\n mx=statistics.mean(x);my=statistics.mean(y);xx=sum((z-mx)**2\
        \ for z in x)\n check(xx>1e-8,'DEGENERATE_ORIGIN_FEATURE');slope=sum((a-mx)*(b-my) for a,b in zip(x,y))/xx\n intercept=my-slope*mx\n\
        \ mid=median_positive(train)\n bg=(sum(q[2] for q in train)+2)/(len(train)+4)\n bins={}\n for b in range(3):\n  cohort=[q for\
        \ q in train if bucket(q[0],mid)==b]\n  check(len(cohort)>=10,'SPARSE_H2_BIN_'+str(b))\n  bins[b]=(sum(q[2] for q in cohort)+2)/(len(cohort)+4)\n\
        \ return slope,intercept,mid,bg,bins\n\ndef model(r60,r82,out):\n out.mkdir(parents=True,exist_ok=True)\n for group,filenames\
        \ in PIN.items():\n  for name,want in filenames.items():\n   check(hashfile({'R60':r60,'R82':r82}[group]/name)==want,'FROZEN_SHA_DRIFT_'+group+'/'+name)\n\
        \ meta=json.loads((r82/'CAL26_R82_manifest.json').read_text())\n check(meta['status']=='FOOTBALL_UTILITY_MEASURABLE_CARDINAL_FV_SCALE_NOT_IDENTIFIED'\
        \ and meta['players']==518 and meta['two_year_scenario_eligible_gp4plus']==389,'R82_GOVERNANCE_DRIFT')\n check(meta['production_changes']==0\
        \ and not meta['FV_per_point_identified'] and not meta['2028_future_continuation_validated'],'R82_2028_GATE_DRIFT')\n h=read(r60/'CAL26_V1R60_2021_25_historical_id_playerseason_rows.csv')\n\
        \ check(len(h)==8572,'HISTORICAL_ARCHIVE_UNIVERSE_DRIFT')\n hist={}\n for z in h:\n  yr=int(z['season']);p=z['position'];sid=z['Sleeper_id']\n\
        \  check(yr in (2021,2022,2023,2024,2025) and p in POS and sid and z['not_2026_data']=='True','BAD_HISTORICAL_RECORD')\n  key=(yr,sid,p);check(key\
        \ not in hist,'DUPLICATE_HISTORICAL_ID')\n  check(val(z['actual_LOG_surplus_points'],'historical_surplus')>=0,'NEGATIVE_ORIGIN_OR_TARGET_SURPLUS')\n\
        \  hist[key]=z\n h2={r['position']:r for r in read(r60/'CAL26_V1R60_21_position_horizon_holdouts.csv') if r['horizon_years']=='2'}\n\
        \ check(len(h2)==7 and set(h2)==set(POS),'H2_HOLDOUT_POSITION_DRIFT')\n out_positions=[];fits={};total_test=0\n for p in POS:\n\
        \  train=[];test=[];cross=0;absent=0\n  for z in h:\n   yr=int(z['season'])\n   if z['position']!=p or yr not in (2021,2022,2023):continue\n\
        \   sid=z['Sleeper_id']; future=hist.get((yr+2,sid,p))\n   played=bool(future is not None and int(future['observed_games'])>=1)\n\
        \   if future is None and yr==2023:\n    if any((yr+2,sid,other) in hist for other in POS if other!=p):cross+=1\n    else:absent+=1\n\
        \   x=val(z['actual_LOG_surplus_points'],'origin');y=val(future['actual_LOG_surplus_points'],'future') if future else 0.\n \
        \  (train if yr<2023 else test).append((x,y,played))\n  check(len(train)==int(h2[p]['train_n']) and len(test)==int(h2[p]['outer_test_n']),'R60_H2_SPLIT_DRIFT_'+p)\n\
        \  slope,inter,mid,bg,bins=fit(train)\n  check(abs(slope-val(h2[p]['slope'],'ref_slope'))<1e-6 and abs(inter-val(h2[p]['intercept_surplus'],'ref_inter'))<1e-4,'R60_H2_LINEAR_REPLAY_DRIFT_'+p)\n\
        \  pred=[max(0.,slope*x+inter) for x,y,played in test]\n  model_mse=statistics.mean((f-y)**2 for f,(_,y,played) in zip(pred,test))\n\
        \  sticky_mse=statistics.mean((x-y)**2 for x,y,played in test)\n  prior_mean=statistics.mean(q[1] for q in train)\n  mean_mse=statistics.mean((prior_mean-y)**2\
        \ for x,y,played in test)\n  check(abs(model_mse-val(h2[p]['outer_model_mse'],'R60_H2_MSE'))<.02,'R60_H2_MODEL_MSE_DRIFT_'+p)\n\
        \  check(abs(sticky_mse-val(h2[p]['outer_sticky_mse'],'R60_STICKY_MSE'))<.02,'R60_H2_STICKY_MSE_DRIFT_'+p)\n  check(abs(mean_mse-val(h2[p]['outer_trainmean_mse'],'R60_MEAN_MSE'))<.02,'R60_H2_MEAN_MSE_DRIFT_'+p)\n\
        \  model_wins=model_mse<sticky_mse and model_mse<mean_mse\n  check(model_wins==(h2[p]['test_model_beats_both_baselines']=='True'),'R60_H2_WIN_GATE_DRIFT_'+p)\n\
        \  brier_prior=statistics.mean((float(played)-bg)**2 for _,_,played in test)\n  brier_bin=statistics.mean((float(played)-bins[bucket(x,mid)])**2\
        \ for x,y,played in test)\n  played_n=sum(played for x,y,played in test)\n  check(played_n+cross+absent==len(test),'PARTICIPATION_PARTITION_INVALID_'+p)\n\
        \  fits[p]={'slope':slope,'intercept':inter,'cut':mid,'overall':bg,'bins':bins,'h2_wins':model_wins,'brier_wins':brier_bin<brier_prior}\n\
        \  total_test+=len(test)\n  out_positions.append({'position':p,'H2_origin_2021_2022_train_n':len(train),'H2_origin_2023_to_2025_holdout_n':len(test),'2025_same_position_observed_n':played_n,\n\
        \    '2025_other_position_n':cross,'2025_no_position_record_n':absent,'H2_2025_same_position_observed_rate':rpt(played_n/len(test)),\n\
        \    'H2_surplus_linear_slope_2021_2022_train':rpt(slope,7),'H2_surplus_linear_intercept_points':rpt(inter,7),\n    'H2_holdout_model_MSE':rpt(model_mse),'H2_holdout_sticky_MSE':rpt(sticky_mse),'H2_holdout_trainmean_MSE':rpt(mean_mse),\n\
        \    'H2_model_beats_both_surplus_baselines':model_wins,'H2_source_transport_to_2026_week6_projections_validated':False,\n \
        \   'train_positive_surplus_median_bin_cut':rpt(mid,3), 'H2_survival_train_global_prior':rpt(bg),\n    'H2_survival_train_bucket0_prior':rpt(bins[0]),'H2_survival_train_bucket1_prior':rpt(bins[1]),'H2_survival_train_bucket2_prior':rpt(bins[2]),\n\
        \    '2023_H2_same_position_survival_Brier_global':rpt(brier_prior,6),'2023_H2_same_position_survival_Brier_binned':rpt(brier_bin,6),\n\
        \    'H2_survival_binning_beats_global_prior':brier_bin<brier_prior,\n    'H2_survival_is_not_2028_age_specific_model':True,'H2_production_pricing_approved':False})\n\
        \ check(total_test==82+155+242+140+331+278+431,'H2_OVERALL_HOLDOUT_COUNT_DRIFT')\n current=read(r82/'CAL26_R82_518_TWO_YEAR_SURPLUS_UTILITY_SCENARIOS_NOT_FV.csv')\n\
        \ check(len(current)==518,'R82_PLAYER_COUNT_DRIFT')\n cards=[];results=[];protected=0;eligible=0\n for z in current:\n  name=z['name'].strip().lower();p=z['position'];f=fits[p]\n\
        \  approved=z['reliability_gate']=='SCENARIO_ONLY_GP4PLUS_NOT_PRICE' and f['h2_wins']\n  h0=val(z['2026_H0_surplus_points_RESEARCH'],'R82_H0')\
        \ if z['2026_H0_surplus_points_RESEARCH'] else None\n  h1=val(z['2027_H1_surplus_points_RESEARCH'],'R82_H1') if z['2027_H1_surplus_points_RESEARCH']\
        \ else None\n  h2=max(0.,f['slope']*h0+f['intercept']) if approved else None\n  prob=f['bins'][bucket(h0,f['cut'])] if approved\
        \ else None\n  if approved:eligible+=1\n  if z['owner_price_anchor_protected']=='True':protected+=1\n  row={'name':name,'position':p,'age':z['age'],'role':z['role'],'live_JS_FV_REFERENCE_ONLY':z['live_FV_REFERENCE_ONLY'],\n\
        \       '2026_H0_surplus_research_points':z['2026_H0_surplus_points_RESEARCH'],\n       '2027_H1_surplus_research_points':z['2027_H1_surplus_points_RESEARCH'],\n\
        \       '2028_H2_2021_22_trained_origin_2023_tested_SURPLUS_PROXY_NOT_FORECAST':rpt(h2,3) if h2 is not None else '',\n     \
        \  'H2_same_position_observed_probability_RESEARCH_NOT_AGE_CALIBRATED':rpt(prob,4) if prob is not None else '',\n       'historical_origin_H2_surplus_win':f['h2_wins'],\n\
        \       'H2_proxy_qualified_for_scenario_only':approved,\n       'H2_projection_transport_calibrated_2026_week6_to_2028':False,\n\
        \       'age_and_role_future_hazard_calibrated':False,\n       '2028_actual_outcome_available':False,\n       'owner_anchor_protected':z['owner_price_anchor_protected'],\n\
        \       'original_two_year_utility_scenario_points_NOT_FV':z['H0_plus_0p75_H1_sensitivity_points_NOT_FV'],\n       'new_FV_proposal':'','FV_per_surplus_point_identified':False,'production_change_authorized':False}\n\
        \  results.append(row)\n  if name in FOCUS:cards.append(row)\n check(protected==15 and len(cards)==5 and len({x['name'] for\
        \ x in cards})==5,'PROTECTED_ANCHORS_OR_FOCUS_DRIFT')\n check(eligible==29+87+36+57+51,'H2_RESEARCH_ELIGIBLE_COUNT_DRIFT')\n\
        \ check(all(r['production_change_authorized'] is False and r['new_FV_proposal']=='' for r in results),'FV_WRITE_OR_PRICE_PROPOSAL')\n\
        \ def export(path,records):\n  with path.open('w',encoding='utf8',newline='') as ff:\n   writer=csv.DictWriter(ff,fieldnames=list(records[0]),lineterminator='\\\
        n');writer.writeheader();writer.writerows(records)\n f1='CAL26_R83_518_2028_H2_ORIGIN_PROXY_NOT_FV.csv';f2='CAL26_R83_7_POSITION_H2_SURVIVAL_AND_ACCURACY.csv';f3='CAL26_R83_5_FOCUS_H2_CAREER_CONTINUITY_NOT_FV.csv';f4='CAL26_R83_decision.md'\n\
        \ export(out/f1,results);export(out/f2,out_positions);export(out/f3,cards)\n lines=['# CAL26 V1R83 \u2014 two-season historical\
        \ continuity and 2028 scenario readiness','',\n  '**DECISION: Historical two-year H2 and same-position participation measured;\
        \ 2028 conversion to current 2026 Week6 projection and FV point price STILL NOT VALIDATED. No deployment.**','',\n  f'- Reused\
        \ 8,572 frozen 2021\u20132025 player-season observations; {total_test} held-out origin-2023 H2 cases (2025 outcomes); {len(results)}\
        \ current players; {eligible} current H2 conditional scenario proxies in positions whose historical surplus model beat both\
        \ baselines.',\n  '- Historical origins 2021 and 2022 are used for the fitted H2 relationship. Origin 2023 \u2192 observed 2025\
        \ is held out from model fitting. This is out-of-origin testing, **not** fully date-vintage prospective validation, because\
        \ 2024 training outcomes postdate the 2023 origin.',\n  '- Same-position participation means an official source row in the same\
        \ position two years later. It is neither confirmed athlete survival nor age-dependent injury risk. Missing and other-position\
        \ rows are separated.',\n  '- Three training-derived participation bins use zero historical surplus or a cut at the positive\
        \ training median, with Laplace smoothing. Their Brier tests compare to a training-wide rate. This is statistical research,\
        \ NOT a validated 2028 probability for any player.',\n  '- A 2028 H2 surplus proxy appears only for 2026 players with 4+ games\
        \ and R82 H0/H1 evidence, in positions beating both empirical historical surplus baselines. These proxy numbers are NOT observed\
        \ or verified 2028 forecasts. RB and LB withheld for model loss against a historical control.',\n  '- R82 H0 year0 is a 2026\
        \ Week6-vintage projected surplus under a lineup-reference assumption, not the same kind of fully observed season as 2021\u2013\
        2023 H2 regression inputs. The transport is UNVALIDATED. Do not add H2 proxies to FV.',\n  '- Historical archive lacks a controlled\
        \ age-by-role future hazard benchmark; no such coefficient has been invented. No 2026 Weeks7+, future actuals, private DLF values,\
        \ live price changes, or owner-target fit.',\n  '- Absolute FV economic scaling, cross-position tradable utility and empirically\
        \ learned future-year discount remain unknown. The Maye 5,500 numerical approval is recorded but NOT used as calibration or\
        \ deployment authorization.','',\n  '## Seven-position held-out H2 results','',\n  '| Pos | H2 holdout | 2025 same-pos recorded\
        \ | H2 surplus beats two baselines | Binned participation Brier vs prior |',\n  '|---|---:|---:|---|---|']\n for z in out_positions:\n\
        \  lines.append(f\"| {z['position']} | {z['H2_origin_2023_to_2025_holdout_n']} | {z['2025_same_position_observed_n']} | {'YES'\
        \ if z['H2_model_beats_both_surplus_baselines'] else 'NO'} | {z['2023_H2_same_position_survival_Brier_binned']} vs {z['2023_H2_same_position_survival_Brier_global']}\
        \ |\")\n lines.extend(['','## Five focus players \u2014 H2 research proxy, not FV','',\n  '| Player | 2026 H0 surplus | 2027\
        \ H1 surplus | 2028 historical H2 proxy | Same-pos participation proxy | Live FV unchanged |',\n  '|---|---:|---:|---:|---:|---:|'])\n\
        \ for name in FOCUS:\n  z=next(x for x in cards if x['name']==name)\n  lines.append(f\"| {name} | {z['2026_H0_surplus_research_points']}\
        \ | {z['2027_H1_surplus_research_points']} | {z['2028_H2_2021_22_trained_origin_2023_tested_SURPLUS_PROXY_NOT_FORECAST'] or\
        \ 'WITHHELD'} | {z['H2_same_position_observed_probability_RESEARCH_NOT_AGE_CALIBRATED'] or 'WITHHELD'} | {z['live_JS_FV_REFERENCE_ONLY']}\
        \ |\")\n lines.extend(['','**Next decision:** To obtain genuine career-value and FV evidence, source age-by-position-year availability\
        \ and a declared intrinsic economic unit with historical trade/pick opportunity-cost observations; do not use DLF market prices\
        \ or existing FV as self-confirming fundamental labels.'])\n (out/f4).write_text('\\n'.join(lines)+'\\n',encoding='utf8')\n\
        \ digestmap={k:hashfile(out/k) for k in (f1,f2,f3,f4)}\n manifest={'workflow':'CAL26_V1R83','status':'HISTORICAL_H2_ORIGIN_EVALUATED_2028_TRANSPORT_AND_FV_SCALE_HELD',\n\
        \  'historical_seasons':'2021_2025','train_origin_years':[2021,2022],'test_origin_year':2023,'test_target_year':2025,\n  'historical_rows':len(h),'h2_holdout_cases':total_test,'current_players':len(results),'2028_conditional_research_proxy_players':eligible,\n\
        \  'current_owner_anchors_preserved':protected,'owner_target_fit':False,'2028_transport_validated':False,'2028_actuals_known':False,\n\
        \  'age_role_hazard_validated':False,'cross_position_FV_economic_scale_identified':False,'production_FV_changes':0,\n  'input_sha256':{grp+'/'+filename:sha\
        \ for grp,files in PIN.items() for filename,sha in files.items()},'outputs_sha256':digestmap}\n (out/'CAL26_R83_manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\\\
        n')\n print('R83_COMPLETE_READ_ONLY',manifest['status'],'hist',len(h),'H2_test',total_test,'H2_proxy',eligible)\n return manifest\n\
        \ndef selftest():\n train=[(0,0,False)]*20+[(10,5,True)]*20+[(35,20,True)]*20\n s,i,mid,bg,bins=fit(train)\n check(mid==22.5\
        \ and bucket(0,mid)==0 and bucket(10,mid)==1 and bucket(35,mid)==2,'SELFTEST_BINNING')\n check(bins[0]<bins[1] and bins[1]==bins[2]\
        \ and 0<bg<1,'SELFTEST_SURVIVAL')\n try:check(False,'EXPECTED_REJECTION')\n except AssertionError as ex:check('EXPECTED_REJECTION'\
        \ in str(ex),'SELFTEST_FAIL_CLOSED')\n print('R83_SELFTEST_GREEN numerical H2 fit, same-pos binning, fail-closed')\nif __name__=='__main__':\n\
        \ a=argparse.ArgumentParser();a.add_argument('--r60');a.add_argument('--r82');a.add_argument('--out');a.add_argument('--selftest',action='store_true');args=a.parse_args()\n\
        \ if args.selftest:selftest()\n else:\n  check(args.r60 and args.r82 and args.out,'MISSING_FROZEN_INPUT_PATHS')\n  model(P(args.r60),P(args.r82),P(args.out))\n\
        PY_R83_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_R83_engine.py\"\npython \"$RUNNER_TEMP/CAL26_R83_engine.py\" --selftest\n\
        python \"$RUNNER_TEMP/CAL26_R83_engine.py\" \\\n  --r60 \"$RUNNER_TEMP/cal26-r83-in/R60\" \\\n  --r82 \"$RUNNER_TEMP/cal26-r83-in/R82\"\
        \ \\\n  --out \"$RUNNER_TEMP/cal26-r83-out\"\npython - \"$RUNNER_TEMP/cal26-r83-out\" <<'PY_R83_VERIFY'\nimport csv,hashlib,json,pathlib,sys\n\
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R83_manifest.json').read_text())\nassert m['workflow']=='CAL26_V1R83' and\
        \ m['status']=='HISTORICAL_H2_ORIGIN_EVALUATED_2028_TRANSPORT_AND_FV_SCALE_HELD'\nassert m['historical_rows']==8572 and m['h2_holdout_cases']==1659\n\
        assert m['current_players']==518 and m['2028_conditional_research_proxy_players']==260\nassert m['current_owner_anchors_preserved']==15\
        \ and m['production_FV_changes']==0\nassert not m['2028_transport_validated'] and not m['2028_actuals_known'] and not m['owner_target_fit']\n\
        assert not m['age_role_hazard_validated'] and not m['cross_position_FV_economic_scale_identified']\nfor name,h in m['outputs_sha256'].items():\
        \ assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h,name\nwith (p/'CAL26_R83_518_2028_H2_ORIGIN_PROXY_NOT_FV.csv').open()\
        \ as f:players=list(csv.DictReader(f))\nwith (p/'CAL26_R83_7_POSITION_H2_SURVIVAL_AND_ACCURACY.csv').open() as f:positions=list(csv.DictReader(f))\n\
        with (p/'CAL26_R83_5_FOCUS_H2_CAREER_CONTINUITY_NOT_FV.csv').open() as f:focus=list(csv.DictReader(f))\nassert len(players)==518\
        \ and len(positions)==7 and len(focus)==5\nassert sum(x['H2_proxy_qualified_for_scenario_only']=='True' for x in players)==260\n\
        assert all(x['2028_actual_outcome_available']=='False' and x['FV_per_surplus_point_identified']=='False' and x['new_FV_proposal']==''\
        \ and x['production_change_authorized']=='False' for x in players)\nassert {x['position'] for x in positions if x['H2_model_beats_both_surplus_baselines']=='True'}=={'QB','WR','TE','DL','DB'}\n\
        assert {x['name'] for x in focus}=={'drake maye','malik nabers','bryce young','cj stroud','puka nacua'}\nprint('R83_HISTORICAL_H2_SURVIVAL_AND_FV_PRICE_HOLD_VERIFIED')\n\
        PY_R83_VERIFY\ncat \"$RUNNER_TEMP/cal26-r83-out/CAL26_R83_decision.md\" >> \"$GITHUB_STEP_SUMMARY\"\ntest -z \"$(git status\
        \ --porcelain --untracked-files=all)\"\n"
    - name: Publish H2 historical evidence with no price release
      if: always()
