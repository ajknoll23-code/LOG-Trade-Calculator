            research/package-adjustment-v8/development_catalog_audit_v1.json \
            research/package-adjustment-v8/development_catalog_manifest_v1.json \
            research/package-adjustment-v8/development_catalog_review_v1.md

          git diff --cached --quiet && {
            echo "ERROR: no catalog outputs staged"
            exit 1
          }

          git commit -m "Freeze Package Adjustment V8 development catalog for review V2"

          git fetch origin main

          critical=(
            research/package-adjustment-v8/topology_split_preregistration_v1.json
            research/package-adjustment-v8/topology_split_power_analysis_v1.json
            research/package-adjustment-v8/catalog_design_contract_v1.json
            research/package-adjustment-v8/catalog_design_feasibility_v1.json
            research/package-adjustment-v8/fixed50_protocol_amendment_v1.json
            research/package-adjustment-v8/fixed50_protocol_amendment_manifest_v1.json
            research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json
            research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json
            scripts/validation/check_package_adjustment_live.py
          )

          for p in "${critical[@]}"; do
            test "$(git rev-parse "$BASE_SHA:$p")" = \
                 "$(git rev-parse "origin/main:$p")" || {
              echo "ERROR: frozen catalog input changed while Phase 1C ran: $p"
              exit 1
            }
          done

          git rebase origin/main

          python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          audit=json.loads((d/"development_catalog_audit_v1.json").read_text())
          manifest=json.loads((d/"development_catalog_manifest_v1.json").read_text())

          assert audit["status"]=="PASS_REVIEW_REQUIRED_BEFORE_VOTING"
          assert audit["voting_activated"] is False
          assert audit["production_change_authorized"] is False
          assert manifest["catalog_audit_passed"] is True
          assert manifest["human_catalog_review_required"] is True
          assert manifest["voting_activated"] is False

          print("PASS: post-rebase catalog review firewall still intact.")
          PY

          git push origin HEAD:main

          echo "PASS: Package Adjustment V8 catalog frozen for human review; voting remains inactive."
