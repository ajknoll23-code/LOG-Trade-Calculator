      - name: Independently validate catalog audit and voter blinding
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          V8=Path("research/package-adjustment-v8")
          V7=Path("research/package-adjustment-v7")

          catalog=json.loads((V8/"development_catalog_v1.json").read_text())
          safe=json.loads((V8/"package_vote_challenges_v8_development_v1.json").read_text())
          audit=json.loads((V8/"development_catalog_audit_v1.json").read_text())
          manifest=json.loads((V8/"development_catalog_manifest_v1.json").read_text())
          design=json.loads((V8/"catalog_design_contract_v1.json").read_text())
          amend=json.loads((V8/"fixed50_protocol_amendment_v1.json").read_text())
          old=json.loads((V7/"package_vote_challenges_v7_development_v1.json").read_text())

          assert catalog["status"]=="FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED"
          assert catalog["challenge_count"]==40
          assert catalog["released_to_voters"] is False
          assert catalog["voting_activated"] is False
          assert catalog["human_catalog_review_required"] is True
          assert catalog["candidate_predictions_used_for_catalog_selection"] is False
          assert catalog["candidate_scores_used_for_catalog_selection"] is False

          assert safe["status"]=="FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED"
          assert safe["challenge_count"]==40
          assert safe["fv_visible_to_voter"] is False
          assert safe["voting_activated"] is False
          assert safe["review_required_before_activation"] is True

          forbidden_fragments=(
              '"fv"',
              'raw_fv',
              'score',
              'prediction',
              'concentration',
              'contrast',
              'ratio',
              'apex',
              'hhi',
          )
          safe_text=(V8/"package_vote_challenges_v8_development_v1.json").read_text().lower()
          for fragment in forbidden_fragments:
              assert fragment not in safe_text, fragment

          def sig(c):
              a="|".join(sorted(x["key"] for x in c["side_A"]["assets"]))
              b="|".join(sorted(x["key"] for x in c["side_B"]["assets"]))
              return "||".join(sorted((a,b)))

          sigs=[sig(c) for c in catalog["challenges"]]
          assert len(sigs)==40
          assert len(set(sigs))==40

          old_sigs={sig(c) for c in old["challenges"]}
          assert not (set(sigs)&old_sigs)

          topology=Counter(c["topology"] for c in catalog["challenges"])
          assert topology==Counter(design["topology_counts"])

          directions=Counter(
              c["primary_concentration_direction"]
              for c in catalog["challenges"]
          )
          assert directions==Counter({"A":20,"B":20})

          appearances=Counter()
          pos_cov=Counter()
          for c in catalog["challenges"]:
              assets=c["side_A"]["assets"]+c["side_B"]["assets"]
              for p in assets:
                  appearances[p["key"]]+=1
                  assert int(p["fv"])>=2500
                  assert p["team"] not in (None,"")
                  assert p["key"]!="joe mixon"
                  if c["topology"]=="2v2":
                      assert int(p["fv"])>=3000
              for pos in {p["pos"] for p in assets}:
                  pos_cov[pos]+=1

              assert c["side_A"]["apex_fv"]>=4000
              assert c["side_B"]["apex_fv"]>=4000
              assert c["raw_sum_ratio_min_over_max"]>=0.92-1e-9

              diff=(
                  c["side_A"]["apex_excess_share"]
                  - c["side_B"]["apex_excess_share"]
              )
              direction="A" if diff>0 else "B"
              assert direction==c["primary_concentration_direction"]
              lo,hi=design["contrast_bands"][c["primary_contrast_band"]]
              assert abs(diff)>=float(lo)-2e-9
              assert abs(diff)<=float(hi)+2e-9

          assert max(appearances.values())<=2
          for pos in ("QB","RB","WR","TE","DL","LB","DB"):
              assert pos_cov[pos]>=4, (pos,pos_cov[pos])

          assert audit["status"]=="PASS_REVIEW_REQUIRED_BEFORE_VOTING"
          assert audit["all_hard_gates_pass"] is True
          assert audit["freshness"]["exact_v7_trade_overlap_count"]==0
          assert audit["trade_quality"]["team_null_count"]==0
          assert audit["trade_quality"]["joe_mixon_occurrences"]==0
          assert audit["reuse"]["maximum_player_appearances"]<=2
          assert audit["voter_blinding"]["forbidden_hidden_key_count"]==0
          assert audit["voting_activated"] is False
          assert audit["production_change_authorized"] is False
          assert audit["power_contract"]["amended_required_complete_voters"]==50
          assert audit["power_contract"]["amended_required_distinct_voters_per_challenge"]==50
          assert audit["power_contract"]["amended_required_accepted_ballots"]==2000
          assert audit["power_contract"]["early_stop_before_50_allowed"] is False
          assert amend["amended_development_maturity"]["required_accepted_complete_voters"]==50

          assert manifest["status"]=="PASS_REVIEW_REQUIRED_BEFORE_VOTING"
          assert manifest["catalog_audit_passed"] is True
          assert manifest["human_catalog_review_required"] is True
          assert manifest["voting_activated"] is False
          assert manifest["v8_votes_read"] is False
          assert manifest["production_change_authorized"] is False

          checks={
              "development_catalog_v1.json":
                  manifest["outputs"]["development_catalog_sha256"],
              "package_vote_challenges_v8_development_v1.json":
                  manifest["outputs"]["voter_safe_catalog_sha256"],
              "development_catalog_audit_v1.json":
                  manifest["outputs"]["catalog_audit_sha256"],
              "development_catalog_review_v1.md":
                  manifest["outputs"]["catalog_review_sha256"],
          }
          for name,expected in checks.items():
              actual=hashlib.sha256((V8/name).read_bytes()).hexdigest()
              assert actual==expected,(name,expected,actual)

          print("PASS: independent catalog audit, freshness, realism, and voter blinding verified.")
          print("PASS: voting remains inactive pending human review.")
          PY

          python3 scripts/validation/check_package_adjustment_live.py

