name: Draft Pick FV V10 - Phase 0 Expected Value Preregistration + Construct Audit

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: draft-pick-fv-v10-phase0
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  V8_P2_RUN_ID: '36469782185'
  V8_P2_ARTIFACT_NAME: 'v8-p2-historical-outcome-harvest-closeout'
  V8_DEV_SHA256: '45306800ce32f3aa20d6d4697e14c846311962b7f6fe3e54e596213370644850'
  V8_1_2024_H2_SHA256: '0a3166a501fcfaa2c19398daf6a26d8df26931a9745e279cf93a9166c6914a21'

jobs:
  freeze-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Guard rollback baseline and V10 scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          expected = [
              7500,5854,5244,
              3906,3624,3291,
              2692,2682,2319,
              1972,1831,1689,
              1414,1250,1118,
              1014,853,740,
          ]
          pat = re.compile(r"const PICK_BASE = \{.*?\n\};", re.S)
          for p in ("index.html", "free-agent-board.html"):
              t = Path(p).read_text(encoding="utf-8")
              m = pat.search(t)
              assert m, p
              nums = list(map(float, re.findall(r"(?:early|mid|late):([0-9.]+)", m.group(0))))
              assert nums == list(map(float, expected)), (p, nums)
              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in t

          rb = json.loads(Path("model/releases/draft-pick-fv-v9/rollback_closeout.json").read_text())
          assert rb["decision"] == "ROLLBACK_V9_PICK_BASE_TO_PREDEPLOYMENT_BASELINE"
          assert rb["production_pick_base_restored"] is True
          assert rb["full_repository_regression_pass"] is True
          assert rb["year_discount_changed"] is False
          assert "ex-ante draft-pick value/expected utility" in rb["next_research_requirement"]

          print("PASS: exact pre-V9 PICK_BASE is live and YEAR_DISCOUNT is untouched.")
          PY

      - name: Freeze V10 preregistration before V10 analysis
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v10"
          P="$D/v10_phase0_expected_value_preregistration.json"
          K="$D/v10_ktc_market_benchmark_freeze.json"
          M="$D/v10_phase0_expected_value_preregistration_manifest.json"
          R="$D/v10_phase0_expected_value_construct_audit.json"
          mkdir -p "$D"

          if [[ -e "$R" ]]; then
            echo "V10 Phase 0 result already exists; validating frozen preregistration only."
          fi

          if [[ ! -e "$P" && ! -e "$K" && ! -e "$M" ]]; then
            python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          d = Path("research/draft-pick-fv-v10")
          d.mkdir(parents=True, exist_ok=True)

          ktc = {
            "schema_version": 1,
            "benchmark_id": "ktc-user-screenshot-freeze-2026-09-28",
            "source": "user-provided KTC screenshots transcribed before V10 outcome analysis",
            "settings": {
              "superflex": True,
              "tight_end_premium": False,
            },
            "scope": {
              "rounds": [1,2,3,4],
              "tiers": ["early","mid","late"],
              "note": "KTC benchmark intentionally stops at Round 4. Rounds 5-6 are not KTC-validated and belong to the separate V10 tail model."
            },
            "2027": {
              "tradesourced": {
                "r1_early":5724,"r1_mid":4710,"r1_late":4114,
                "r2_early":3366,"r2_mid":3047,"r2_late":2835,
                "r3_early":2276,"r3_mid":2168,"r3_late":2014,
                "r4_early":1855,"r4_mid":1726,"r4_late":1619
              },
              "crowdsourced": {
                "r1_early":7037,"r1_mid":5791,"r1_late":5058,
                "r2_early":3880,"r2_mid":3512,"r2_late":3268,
                "r3_early":2648,"r3_mid":2521,"r3_late":2342,
                "r4_early":2000,"r4_mid":1861,"r4_late":1745
              },
              "combined": {
                "r1_early":6381,"r1_mid":5250,"r1_late":4586,
                "r2_early":3623,"r2_mid":3279,"r2_late":3051,
                "r3_early":2462,"r3_mid":2344,"r3_late":2178,
                "r4_early":1927,"r4_mid":1794,"r4_late":1682
              }
            },
            "2028": {
              "combined": {
                "r1_early":5154,"r1_mid":4418,"r1_late":3934,
                "r2_early":3022,"r2_mid":2906,"r2_late":2701,
                "r3_early":2201,"r3_mid":2165,"r3_late":2035,
                "r4_early":1839,"r4_mid":1629,"r4_late":1479
              },
              "role": "recorded for the separate YEAR_DISCOUNT study; forbidden from fitting V10 Round 1-4 base FV"
            },
            "fit_policy": "KTC is external construct/scale validation only. KTC values may not be used to fit, rescale, tune, or select the V10 fundamental-value estimator."
          }

          prereg = {
            "schema_version": 1,
            "study_id": "draft-pick-fv-v10-ex-ante-expected-value",
            "stage": "phase0_preregistration",
            "status": "FROZEN_BEFORE_V10_EXPECTED_VALUE_AUDIT",
            "objective": "Estimate ex-ante draft-pick Fundamental Value from the distribution of historical rookie outcomes using expected value, not median-like realized-player MAE.",
            "scientific_partition": {
              "core_rounds": [1,2,3,4],
              "tail_rounds": [5,6],
              "year_discount": "SEPARATE_STUDY_NOT_FIT_OR_CHANGED_IN_V10_CORE_TAIL_STUDY"
            },
            "source_contract": {
              "development": {
                "years": [2018,2019,2020,2021,2022,2023],
                "horizon": "H3",
                "target": "O2",
                "artifact_run_id": 36469782185,
                "artifact_name": "v8-p2-historical-outcome-harvest-closeout",
                "file": "v8_phase2_development_outcomes.jsonl",
                "sha256": "45306800ce32f3aa20d6d4697e14c846311962b7f6fe3e54e596213370644850",
                "expected_rows": 24970
              },
              "exposed_robustness": {
                "year": 2024,
                "horizon": "H2",
                "file": "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl",
                "sha256": "0a3166a501fcfaa2c19398daf6a26d8df26931a9745e279cf93a9166c6914a21",
                "expected_rows": 574,
                "classification": "EXPOSED_ROBUSTNESS_ONLY_NOT_FRESH_HOLDOUT_NOT_CORE_FIT"
              }
            },
            "core_estimator": {
              "candidate_id": "V10_C1_CLASS_BALANCED_DIRECT_EV",
              "definition": "For each draft year and R1-R4 cell, normalize development_fit_weight_v8 within year/cell and compute weighted arithmetic mean of H3.O2. Final raw cell EV is the equal-weight arithmetic mean of the six yearly cell EVs.",
              "why": "Arithmetic expectation preserves the value contribution of rare elite outcomes that median/MAE targeting suppresses. Equal draft-class weighting prevents classes with more source observations from dominating.",
              "uncertainty": "Joint draft-class bootstrap over the six yearly cell-EV vectors; fixed seed; report 90% and 95% intervals.",
              "validation": "Leave-one-draft-class-out predictions using only the other five classes. Report absolute and log-scale error; do not use KTC in fitting.",
              "shape_policy": "Phase 0 reports raw monotonic violations. Any later monotonic projection must be separately preregistered and cannot be chosen after inspecting KTC residuals."
            },
            "tail_candidates": {
              "common_rules": [
                "Tail begins only after the final Round-4 core FV is frozen.",
                "Carry the final Round-4 early/mid/late proportions forward; do not fit six independent R5/R6 cells.",
                "Estimate decay on log round-mean ratios from historical H3.O2 expected values.",
                "Use nested leave-one-draft-class-out selection for shrinkage; KTC is never used because KTC has no Round-5/6 benchmark."
              ],
              "T1_ONE_FACTOR": {
                "formula": "R5_tier = R4_tier*d; R6_tier = R5_tier*d",
                "parameters": 1,
                "shrinkage_anchor": "historical R3->R4 log-decay"
              },
              "T2_TWO_FACTOR": {
                "formula": "R5_tier = R4_tier*d45; R6_tier = R5_tier*d56",
                "parameters": 2,
                "shrinkage_anchors": ["historical R3->R4 log-decay", "d45≈d56"],
                "win_rule": "T2 may replace T1 only if outer-LOYO tail log-RMSE improves by at least 5% AND bootstrap P(T2 lower error than T1) >= 0.80; otherwise T1 wins."
              },
              "predeclared_shrinkage_grid": [0.0,0.25,0.5,1.0,2.0,4.0]
            },
            "construct_validity": {
              "reference": "2027 KTC combined is central market reference; tradesourced<->crowdsourced is the disagreement band.",
              "fitting_forbidden": True,
              "production_candidate_hard_gates": {
                "every_R1_R4_cell_ratio_to_KTC_combined_between": [0.60,1.50],
                "median_absolute_log_ratio_to_KTC_combined_le": 0.30010459245033816,
                "spearman_rank_correlation_with_KTC_combined_ge": 0.90,
                "at_least_fraction_cells_inside_tradesourced_crowdsourced_band": 0.50,
                "positive_monotone_R1_early_through_R4_late": True
              },
              "interpretation": "These are stop-before-production construct gates, not fitting targets. A scientifically estimated fundamental curve can disagree with KTC, but not by a catastrophic scale/ordering mismatch."
            },
            "phase0_outputs": [
              "raw class-balanced R1-R4 expected values",
              "joint bootstrap uncertainty",
              "LOYO stability metrics",
              "raw R3->R4, R4->R5, R5->R6 transition diagnostics",
              "KTC construct-validity diagnostics without market fitting",
              "2024 H2 exposed robustness expected-value snapshot"
            ],
            "forbidden": [
              "fit, rescale, tune, or select the FV estimator using KTC values",
              "reuse 2024 H2 as a fresh holdout",
              "read partial 2026 rookie outcomes",
              "fit or change YEAR_DISCOUNT",
              "fit six independent R5/R6 cell values",
              "use median or MAE minimization as the primary ex-ante FV target",
              "change production PICK_BASE in Phase 0",
              "change player valuation, Package Adjustment, or Team Utility"
            ],
            "production_change_authorized": False,
            "next_stage_if_phase0_integrity_passes": "V10 Phase 1 Core + Tail Candidate Evaluation under this frozen contract"
          }

          kp = d / "v10_ktc_market_benchmark_freeze.json"
          pp = d / "v10_phase0_expected_value_preregistration.json"
          kp.write_text(json.dumps(ktc, indent=2, sort_keys=True) + "\n")
          pp.write_text(json.dumps(prereg, indent=2, sort_keys=True) + "\n")

          manifest = {
            "schema_version": 1,
            "decision": "FREEZE_V10_EXPECTED_VALUE_AND_CONSTRUCT_VALIDITY_CONTRACT",
            "production_change_authorized": False,
            "files": {
              kp.name: hashlib.sha256(kp.read_bytes()).hexdigest(),
              pp.name: hashlib.sha256(pp.read_bytes()).hexdigest(),
            }
          }
          mp = d / "v10_phase0_expected_value_preregistration_manifest.json"
          mp.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")

          (d / "v10_phase0_expected_value_preregistration.md").write_text(
            "# Draft Pick FV V10 — Phase 0 Preregistration\n\n"
            "V10 replaces the V9 median/MAE-like production target with an ex-ante expected-value construct. "
            "Rounds 1–4 are estimated directly from class-balanced historical H3 O2 outcome distributions. "
            "Rounds 5–6 are a separate constrained tail extrapolation with one-factor and two-factor candidates. "
            "KTC is frozen before analysis and is used only as an external construct/scale check. YEAR_DISCOUNT is explicitly out of scope.\n"
          )
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$D/v10_phase0_expected_value_preregistration.json" \
                    "$D/v10_ktc_market_benchmark_freeze.json" \
                    "$D/v10_phase0_expected_value_preregistration_manifest.json" \
                    "$D/v10_phase0_expected_value_preregistration.md"
            git commit -m "Freeze Draft Pick FV V10 expected-value contract"

            git fetch origin main
            test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)" || {
              echo "ERROR: main moved before V10 preregistration freeze."
              exit 1
            }
            git push origin HEAD:main
          else
            test -f "$P" && test -f "$K" && test -f "$M"
            python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          d=Path("research/draft-pick-fv-v10")
          p=d/"v10_phase0_expected_value_preregistration.json"
          k=d/"v10_ktc_market_benchmark_freeze.json"
          m=d/"v10_phase0_expected_value_preregistration_manifest.json"
          x=json.loads(m.read_text())
          assert x["decision"]=="FREEZE_V10_EXPECTED_VALUE_AND_CONSTRUCT_VALIDITY_CONTRACT"
          assert x["production_change_authorized"] is False
          for q in (p,k):
              assert hashlib.sha256(q.read_bytes()).hexdigest()==x["files"][q.name]
          pre=json.loads(p.read_text())
          assert pre["core_estimator"]["candidate_id"]=="V10_C1_CLASS_BALANCED_DIRECT_EV"
          assert pre["scientific_partition"]["core_rounds"]==[1,2,3,4]
          assert pre["scientific_partition"]["tail_rounds"]==[5,6]
          assert pre["production_change_authorized"] is False
          print("PASS: existing V10 preregistration matches its frozen manifest.")
          PY
          fi

          echo "prereg_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  expected-value-audit:
    needs: freeze-preregistration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out frozen V10 preregistration head
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Verify V10 preregistration integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          d=Path("research/draft-pick-fv-v10")
          m=json.loads((d/"v10_phase0_expected_value_preregistration_manifest.json").read_text())
          assert m["decision"]=="FREEZE_V10_EXPECTED_VALUE_AND_CONSTRUCT_VALIDITY_CONTRACT"
          for n,want in m["files"].items():
              p=d/n
              assert p.exists(), n
              assert hashlib.sha256(p.read_bytes()).hexdigest()==want, n
          pre=json.loads((d/"v10_phase0_expected_value_preregistration.json").read_text())
          assert pre["production_change_authorized"] is False
          assert "fit or change YEAR_DISCOUNT" in pre["forbidden"]
          print("PASS: frozen V10 contract is intact before opening the development corpus.")
          PY

      - name: Download exact V8 development corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/v10-v8-p2"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          gh run download "$V8_P2_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$V8_P2_ARTIFACT_NAME" \
            --dir "$OUT"

          test -f "$OUT/v8_phase2_development_outcomes.jsonl"
          test "$(sha256sum "$OUT/v8_phase2_development_outcomes.jsonl" | awk '{print $1}')" = "$V8_DEV_SHA256"
          test "$(sha256sum research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl | awk '{print $1}')" = "$V8_1_2024_H2_SHA256"
          echo "PASS: exact frozen V8/V8.1 outcome sources recovered."

      - name: Build deterministic expected-value and construct audit
        shell: bash
        env:
          DEV_ROWS: ${{ runner.temp }}/v10-v8-p2/v8_phase2_development_outcomes.jsonl
          H2_ROWS: research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, math, os, random, re, statistics
          from collections import defaultdict
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          RESULT=D/"v10_phase0_expected_value_construct_audit.json"
          REPORT=D/"v10_phase0_expected_value_construct_audit.md"
          MANIFEST=D/"v10_phase0_expected_value_construct_audit_manifest.json"

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def read_jsonl(p):
              with Path(p).open() as f:
                  return [json.loads(x) for x in f if x.strip()]
          def q(xs,p):
              ys=sorted(xs)
              if not ys: raise AssertionError("empty quantile input")
              pos=(len(ys)-1)*p
              lo=int(math.floor(pos)); hi=int(math.ceil(pos))
              if lo==hi: return float(ys[lo])
              a=pos-lo
              return float(ys[lo]*(1-a)+ys[hi]*a)
          def wmean(vals,weights):
              s=sum(weights)
              assert s>0
              return sum(v*w for v,w in zip(vals,weights))/s
          def mean(xs):
              return sum(xs)/len(xs)
          def rmse(xs):
              return math.sqrt(mean([x*x for x in xs]))
          def ranks(vals):
              order=sorted(range(len(vals)), key=lambda i: vals[i])
              out=[0.0]*len(vals)
              i=0
              while i<len(order):
                  j=i+1
                  while j<len(order) and vals[order[j]]==vals[order[i]]:
                      j+=1
                  r=(i+1+j)/2.0
                  for k in range(i,j): out[order[k]]=r
                  i=j
              return out
          def pearson(a,b):
              ma,mb=mean(a),mean(b)
              da=[x-ma for x in a]; db=[x-mb for x in b]
              den=math.sqrt(sum(x*x for x in da)*sum(x*x for x in db))
              assert den>0
              return sum(x*y for x,y in zip(da,db))/den
          def spearman(a,b):
              return pearson(ranks(a),ranks(b))

          pre=json.loads((D/"v10_phase0_expected_value_preregistration.json").read_text())
          ktc=json.loads((D/"v10_ktc_market_benchmark_freeze.json").read_text())
          dev=read_jsonl(os.environ["DEV_ROWS"])
          h2=read_jsonl(os.environ["H2_ROWS"])

          assert len(dev)==24970, len(dev)
          assert len(h2)==574, len(h2)
          assert sha(os.environ["DEV_ROWS"])==pre["source_contract"]["development"]["sha256"]
          assert sha(os.environ["H2_ROWS"])==pre["source_contract"]["exposed_robustness"]["sha256"]

          years=[2018,2019,2020,2021,2022,2023]
          tiers=["early","mid","late"]
          cells=[f"r{r}_{t}" for r in range(1,7) for t in tiers]
          core=[f"r{r}_{t}" for r in range(1,5) for t in tiers]

          yc={}
          nobs={}
          eff_weight={}
          for y in years:
              for c in cells:
                  xs=[r for r in dev
                      if int(r["draft_year"])==y
                      and r["cell"]==c
                      and r.get("primary_o2_ready") is True
                      and r.get("H3",{}).get("O2") is not None]
                  assert xs, (y,c)
                  vals=[float(r["H3"]["O2"]) for r in xs]
                  ws=[float(r["development_fit_weight_v8"]) for r in xs]
                  assert min(ws)>=0 and sum(ws)>0
                  yc[(y,c)]=wmean(vals,ws)
                  nobs[(y,c)]=len(xs)
                  sw=sum(ws); sw2=sum(w*w for w in ws)
                  eff_weight[(y,c)]=(sw*sw/sw2) if sw2>0 else 0.0

          raw={c:mean([yc[(y,c)] for y in years]) for c in core}

          # Joint class bootstrap preserves across-cell draft-class dependence.
          rng=random.Random(20260928)
          B=5000
          boot={c:[] for c in core}
          for _ in range(B):
              sample=[years[rng.randrange(len(years))] for __ in years]
              for c in core:
                  boot[c].append(mean([yc[(y,c)] for y in sample]))

          uncertainty={}
          for c in core:
              xs=boot[c]
              uncertainty[c]={
                "mean":raw[c],
                "p05":q(xs,0.05),"p95":q(xs,0.95),
                "p025":q(xs,0.025),"p975":q(xs,0.975),
                "relative_95_halfwidth":(q(xs,0.975)-q(xs,0.025))/(2.0*raw[c]) if raw[c]>0 else None,
                "yearly_values":{str(y):yc[(y,c)] for y in years},
                "yearly_observation_counts":{str(y):nobs[(y,c)] for y in years},
                "yearly_effective_weight_n":{str(y):eff_weight[(y,c)] for y in years},
              }

          # Leave-one-draft-class-out direct EV stability.
          loyo=[]
          all_abs=[]; all_log=[]; all_sq=[]
          for hold in years:
              train=[y for y in years if y!=hold]
              errs=[]; logs=[]
              bycell={}
              for c in core:
                  pred=mean([yc[(y,c)] for y in train])
                  actual=yc[(hold,c)]
                  assert pred>0 and actual>0
                  e=pred-actual
                  le=math.log(pred/actual)
                  errs.append(abs(e)); logs.append(abs(le)); all_sq.append(e*e)
                  all_abs.append(abs(e)); all_log.append(abs(le))
                  bycell[c]={"prediction":pred,"actual":actual,"error":e,"abs_log_error":abs(le)}
              loyo.append({
                "holdout_year":hold,
                "mae":mean(errs),
                "mean_abs_log_error":mean(logs),
                "cells":bycell,
              })

          # Raw monotonicity diagnostic only. No projection is performed in Phase 0.
          raw_seq=[raw[c] for c in core]
          monotone_pairs=[]
          for i in range(len(core)-1):
              if raw_seq[i] < raw_seq[i+1]-1e-12:
                  monotone_pairs.append({
                    "left":core[i],"left_value":raw_seq[i],
                    "right":core[i+1],"right_value":raw_seq[i+1],
                  })

          # KTC external construct diagnostics. Never used to fit raw EV.
          trades=ktc["2027"]["tradesourced"]
          crowd=ktc["2027"]["crowdsourced"]
          combined=ktc["2027"]["combined"]
          ratios={c:raw[c]/float(combined[c]) for c in core}
          abs_logs={c:abs(math.log(ratios[c])) for c in core}
          inside={c:min(trades[c],crowd[c])<=raw[c]<=max(trades[c],crowd[c]) for c in core}
          gates=pre["construct_validity"]["production_candidate_hard_gates"]
          ratio_lo,ratio_hi=map(float,gates["every_R1_R4_cell_ratio_to_KTC_combined_between"])
          median_abs_log=statistics.median(abs_logs.values())
          rho=spearman([raw[c] for c in core],[float(combined[c]) for c in core])
          band_fraction=sum(inside.values())/len(core)
          construct_checks={
            "all_cell_ratios_within_catastrophic_bounds": all(ratio_lo<=ratios[c]<=ratio_hi for c in core),
            "median_abs_log_ratio_within_gate": median_abs_log<=float(gates["median_absolute_log_ratio_to_KTC_combined_le"])+1e-12,
            "spearman_rank_gate": rho>=float(gates["spearman_rank_correlation_with_KTC_combined_ge"])-1e-12,
            "market_band_coverage_gate": band_fraction>=float(gates["at_least_fraction_cells_inside_tradesourced_crowdsourced_band"])-1e-12,
            "raw_positive_monotone": len(monotone_pairs)==0 and min(raw_seq)>0,
          }

          # Historical transition diagnostics for the later tail model.
          yearly_round={}
          transitions={"r3_to_r4":{},"r4_to_r5":{},"r5_to_r6":{}}
          for y in years:
              for r in (3,4,5,6):
                  yearly_round[(y,r)]=mean([yc[(y,f"r{r}_{t}")] for t in tiers])
              transitions["r3_to_r4"][str(y)]=yearly_round[(y,4)]/yearly_round[(y,3)]
              transitions["r4_to_r5"][str(y)]=yearly_round[(y,5)]/yearly_round[(y,4)]
              transitions["r5_to_r6"][str(y)]=yearly_round[(y,6)]/yearly_round[(y,5)]

          transition_summary={}
          for k,v in transitions.items():
              vals=list(v.values())
              logs=[math.log(x) for x in vals]
              transition_summary[k]={
                "arithmetic_mean":mean(vals),
                "geometric_mean":math.exp(mean(logs)),
                "min":min(vals),"max":max(vals),
                "yearly":v,
              }

          # 2024 H2 is exposed robustness only; keep separate from H3 fitting.
          h2_ev={}
          for c in core:
              xs=[r for r in h2 if r["cell"]==c and r.get("h2_o2_ready") is True]
              assert xs, c
              vals=[float(r["H2"]["O2"]) for r in xs]
              ws=[float(r["cell_weight_v8_1_holdout"]) for r in xs]
              h2_ev[c]=wmean(vals,ws)

          decision="ADVANCE_V10_TO_PHASE1_UNDER_FROZEN_EXPECTED_VALUE_CONTRACT"
          result={
            "schema_version":1,
            "study_id":pre["study_id"],
            "stage":"phase0_expected_value_construct_audit",
            "decision":decision,
            "phase0_integrity_pass":True,
            "production_change_authorized":False,
            "core_estimator_id":pre["core_estimator"]["candidate_id"],
            "core_raw_expected_value":raw,
            "core_uncertainty":uncertainty,
            "core_loyo":{
              "folds":loyo,
              "overall_mae":mean(all_abs),
              "overall_rmse":math.sqrt(mean(all_sq)),
              "overall_mean_abs_log_error":mean(all_log),
            },
            "raw_monotonicity":{
              "pass":len(monotone_pairs)==0 and min(raw_seq)>0,
              "violations":monotone_pairs,
              "projection_applied":False,
            },
            "ktc_construct_audit":{
              "fit_or_rescale_using_ktc":False,
              "ratios_to_2027_combined":ratios,
              "absolute_log_ratios":abs_logs,
              "inside_tradesourced_crowdsourced_band":inside,
              "band_fraction":band_fraction,
              "median_absolute_log_ratio":median_abs_log,
              "spearman_rank_correlation":rho,
              "production_candidate_gate_results_on_raw_C1":construct_checks,
              "all_production_construct_gates_pass_on_raw_C1":all(construct_checks.values()),
              "note":"Failure here does not fail Phase 0 execution. It means raw C1 cannot be promoted unchanged; Phase 1 must remain within the preregistered scientific contract and may not fit to KTC."
            },
            "tail_transition_diagnostics":transition_summary,
            "exposed_2024_H2_robustness_expected_value":h2_ev,
            "source_integrity":{
              "development_rows":len(dev),
              "development_sha256":sha(os.environ["DEV_ROWS"]),
              "exposed_2024_h2_rows":len(h2),
              "exposed_2024_h2_sha256":sha(os.environ["H2_ROWS"]),
              "partial_2026_outcomes_read":False,
            },
            "year_discount_changed":False,
            "next_stage":"Draft Pick FV V10 - Phase 1 Core + Tail Candidate Evaluation",
          }
          RESULT.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
            "# Draft Pick FV V10 — Phase 0 Expected-Value Construct Audit",
            "",
            f"**Decision:** `{decision}`",
            "",
            "Phase 0 successfully rebuilt the R1–R4 target as class-balanced arithmetic expected H3 O2, with KTC held out of fitting and used only as a construct check.",
            "",
            "## Raw R1–R4 expected values",
            "",
            "| Cell | EV | 95% bootstrap interval | KTC combined | EV/KTC | In trade↔crowd band |",
            "|---|---:|---:|---:|---:|:---:|",
          ]
          for c in core:
              u=uncertainty[c]
              lines.append(f"| {c} | {raw[c]:.1f} | {u['p025']:.1f}–{u['p975']:.1f} | {combined[c]} | {ratios[c]:.3f} | {'yes' if inside[c] else 'no'} |")
          lines += [
            "",
            "## Construct diagnostics",
            "",
            f"- Spearman vs 2027 KTC combined: **{rho:.4f}**",
            f"- Median absolute log ratio: **{median_abs_log:.4f}**",
            f"- Cells inside tradesourced↔crowdsourced band: **{sum(inside.values())}/{len(core)}**",
            f"- Raw monotonic violations: **{len(monotone_pairs)}**",
            f"- Raw C1 passes all preregistered production construct gates: **{all(construct_checks.values())}**",
            "",
            "## Historical multiplicative decay diagnostics",
            "",
            f"- R3→R4 geometric mean: **{transition_summary['r3_to_r4']['geometric_mean']:.4f}**",
            f"- R4→R5 geometric mean: **{transition_summary['r4_to_r5']['geometric_mean']:.4f}**",
            f"- R5→R6 geometric mean: **{transition_summary['r5_to_r6']['geometric_mean']:.4f}**",
            "",
            "No production values changed. YEAR_DISCOUNT remains out of scope. Phase 1 must evaluate the frozen core/tail candidates without fitting to KTC.",
          ]
          REPORT.write_text("\n".join(lines)+"\n")

          manifest={
            "schema_version":1,
            "decision":decision,
            "production_change_authorized":False,
            "inputs":{
              "development_sha256":sha(os.environ["DEV_ROWS"]),
              "exposed_2024_h2_sha256":sha(os.environ["H2_ROWS"]),
              "preregistration_sha256":sha(D/"v10_phase0_expected_value_preregistration.json"),
              "ktc_benchmark_sha256":sha(D/"v10_ktc_market_benchmark_freeze.json"),
            },
            "outputs":{
              RESULT.name:sha(RESULT),
              REPORT.name:sha(REPORT),
            }
          }
          MANIFEST.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          print("PHASE0_DECISION="+decision)
          print("RAW_C1_CONSTRUCT_PASS="+str(all(construct_checks.values())))
          print("RAW_MONOTONIC_VIOLATIONS="+str(len(monotone_pairs)))
          print("KTC_SPEARMAN="+f"{rho:.6f}")
          print("KTC_MEDIAN_ABS_LOG_RATIO="+f"{median_abs_log:.6f}")
          print("TAIL_R34="+f"{transition_summary['r3_to_r4']['geometric_mean']:.6f}")
          print("TAIL_R45="+f"{transition_summary['r4_to_r5']['geometric_mean']:.6f}")
          print("TAIL_R56="+f"{transition_summary['r5_to_r6']['geometric_mean']:.6f}")
          PY

      - name: Validate Phase 0 artifact contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          d=Path("research/draft-pick-fv-v10")
          p=d/"v10_phase0_expected_value_construct_audit.json"
          m=d/"v10_phase0_expected_value_construct_audit_manifest.json"
          r=json.loads(p.read_text())
          x=json.loads(m.read_text())
          assert r["decision"]=="ADVANCE_V10_TO_PHASE1_UNDER_FROZEN_EXPECTED_VALUE_CONTRACT"
          assert r["phase0_integrity_pass"] is True
          assert r["production_change_authorized"] is False
          assert r["year_discount_changed"] is False
          assert r["source_integrity"]["development_rows"]==24970
          assert r["source_integrity"]["exposed_2024_h2_rows"]==574
          assert r["source_integrity"]["partial_2026_outcomes_read"] is False
          assert set(r["core_raw_expected_value"])=={
            f"r{rr}_{t}" for rr in range(1,5) for t in ("early","mid","late")
          }
          assert min(r["core_raw_expected_value"].values())>0
          assert x["decision"]==r["decision"]
          for n,want in x["outputs"].items():
              assert hashlib.sha256((d/n).read_bytes()).hexdigest()==want

          expected=[
            7500,5854,5244,3906,3624,3291,2692,2682,2319,
            1972,1831,1689,1414,1250,1118,1014,853,740
          ]
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          for name in ("index.html","free-agent-board.html"):
              t=Path(name).read_text(encoding="utf-8")
              nums=list(map(float,re.findall(r"(?:early|mid|late):([0-9.]+)",pat.search(t).group(0))))
              assert nums==list(map(float,expected)),name
              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in t
          print("PASS: Phase 0 audit is internally consistent and production remains unchanged.")
          PY

      - name: Commit V10 Phase 0 audit
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v10"

          if git ls-tree -r --name-only HEAD | grep -qx "$D/v10_phase0_expected_value_construct_audit.json"; then
            echo "Phase 0 audit already committed; no write needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D/v10_phase0_expected_value_construct_audit.json" \
                  "$D/v10_phase0_expected_value_construct_audit.md" \
                  "$D/v10_phase0_expected_value_construct_audit_manifest.json"
          git commit -m "Complete Draft Pick FV V10 Phase 0 expected-value audit"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)" || {
            echo "ERROR: main moved after V10 Phase 0 analysis; refusing non-fast-forward scientific commit."
            exit 1
          }
          git push origin HEAD:main

      - name: Upload V10 Phase 0 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-pick-fv-v10-phase0-expected-value-audit
          path: |
            research/draft-pick-fv-v10/v10_phase0_expected_value_preregistration.json
            research/draft-pick-fv-v10/v10_ktc_market_benchmark_freeze.json
            research/draft-pick-fv-v10/v10_phase0_expected_value_construct_audit.json
            research/draft-pick-fv-v10/v10_phase0_expected_value_construct_audit.md
            research/draft-pick-fv-v10/v10_phase0_expected_value_construct_audit_manifest.json
          if-no-files-found: error
          retention-days: 30
