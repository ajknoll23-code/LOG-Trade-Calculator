          def verify_protocol_freeze(repo: Path, protocol_commit: str) -> dict:
              protocol = load_json(repo / OUT_PROTOCOL)
              if protocol.get("status") != "FROZEN_BEFORE_FRESH_WEEK_ROLE_COVERAGE_OR_TEAM_METRIC":
                  raise RuntimeError("B46_PROTOCOL_STATUS_DRIFT")
              if protocol.get("target_week") != TARGET_WEEK:
                  raise RuntimeError("B46_PROTOCOL_TARGET_WEEK_DRIFT")
              if protocol.get("source_preflight_sha256") != sha256_file(repo / OUT_PREFLIGHT):
                  raise RuntimeError("B46_PROTOCOL_PREFLIGHT_SHA_DRIFT")
              if protocol.get("evaluator_sha256") != sha256_file(repo / OUT_EVALUATOR):
                  raise RuntimeError("B46_PROTOCOL_EVALUATOR_SHA_DRIFT")
              if protocol.get("production_change_authorized") is not False:
                  raise RuntimeError("B46_PROTOCOL_PRODUCTION_DRIFT")

              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if head != protocol_commit:
                  raise RuntimeError(f"B46_NOT_AT_PROTOCOL_FREEZE_COMMIT expected={protocol_commit} actual={head}")
              changed = sorted(subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", protocol_commit],
                  text=True,
              ).splitlines())
              expected = sorted([str(OUT_EVALUATOR), str(OUT_PREFLIGHT), str(OUT_PROTOCOL)])
              if changed != expected:
                  raise RuntimeError(f"B46_PROTOCOL_FREEZE_SCOPE_DRIFT expected={expected} actual={changed}")
              return protocol


          def verify_cache(repo: Path, cache: Path) -> dict[str, bytes]:
              pre = load_json(repo / OUT_PREFLIGHT)
              payloads = {
                  "state": (cache / "sleeper_state.json").read_bytes(),
                  "players": (cache / "sleeper_players.json").read_bytes(),
                  "stats": (cache / "stats_player_week_2026.csv").read_bytes(),
                  "snaps": (cache / "snap_counts_2026.csv").read_bytes(),
              }
              if sha256_bytes(payloads["state"]) != pre["sleeper_state_sha256"]:
                  raise RuntimeError("B46_CACHE_SLEEPER_STATE_SHA_DRIFT")
              if sha256_bytes(payloads["players"]) != pre["sleeper_player_map_sha256"]:
                  raise RuntimeError("B46_CACHE_SLEEPER_PLAYERS_SHA_DRIFT")
              if sha256_bytes(payloads["stats"]) != pre["nflverse_weekly_stats_raw_sha256"]:
                  raise RuntimeError("B46_CACHE_STATS_SHA_DRIFT")
              if sha256_bytes(payloads["snaps"]) != pre["nflverse_snap_counts_raw_sha256"]:
                  raise RuntimeError("B46_CACHE_SNAPS_SHA_DRIFT")

              frozen_urls = {SLEEPER_PLAYERS_URL: payloads["players"]}
              for week in range(1, TARGET_WEEK + 1):
                  p = (cache / f"sleeper_stats_week_{week}.json").read_bytes()
                  if sha256_bytes(p) != pre["sleeper_weekly_stats_sha256"][str(week)]:
                      raise RuntimeError(f"B46_CACHE_SLEEPER_WEEK_SHA_DRIFT week={week}")
                  frozen_urls[f"https://api.sleeper.app/v1/stats/nfl/regular/2026/{week}"] = p
              return frozen_urls


          def load_fresh_identity_inputs(repo: Path, cache: Path, b44, b42, v1, lineage, session):
              stats_path = cache / "stats_player_week_2026.csv"
