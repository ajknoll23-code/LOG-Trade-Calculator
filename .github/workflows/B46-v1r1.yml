              eligible_base = b44.eligible_base_from_rows(all_current_rows, TARGET_WEEK, b42)
              current = b44.make_current_identity_rows(eligible_base, all_current_rows, repo, v1)

              stable, stable_inverse, stable_sids, cross_sha, cross_audit = b42.load_stable_id_crosswalk(
                  lineage, session
              )
              if cross_sha != EXPECTED_STABLE_CROSSWALK_SHA256:
