          def validate_b45_fresh_roster_binding(rosters, rows, eligibility, lineage, b42) -> dict:
              details = []
              all_pass = True
              rostered_count = 0
              unrostered_count = 0

              for x in rows:
                  sid = str(x["sleeper_id"])
                  g = str(x["gsis_id"])
                  pos = str(x["model_position"])

                  found = []
                  for roster in rosters:
                      players_by_id = {}
                      for slot in ("starters", "bench", "taxi", "reserve_ir"):
                          for player in roster.get(slot) or []:
                              pid = str(player.get("player_id") or "").strip()
                              if pid:
                                  players_by_id.setdefault(pid, player)
                      if sid in players_by_id:
                          found.append(players_by_id[sid])

                  erow = eligibility.loc[eligibility["gsis_id"].astype(str) == g]
                  fresh_name_key = str(erow.iloc[0]["exact_name_key"]) if len(erow) == 1 else ""
                  fresh_sid = str(erow.iloc[0]["sleeper_id"]) if len(erow) == 1 else ""
                  fresh_source = str(erow.iloc[0]["identity_source"]) if len(erow) == 1 else ""

                  eligibility_ok = bool(
                      len(erow) == 1
                      and fresh_sid == sid
                      and fresh_source in {"B45_VERIFIED_OVERRIDE", "STABLE_CROSSWALK"}
                  )

                  if len(found) == 0:
                      unrostered_count += 1
                      status = "not_rostered_in_fresh_snapshot"
                      roster_pos = ""
                      roster_name_key = ""
                      roster_binding_ok = True
                  elif len(found) == 1:
                      rostered_count += 1
                      status = "rostered"
                      roster_pos = lineage["builder"].canon_pos(found[0].get("position"))
                      roster_name_key = b42.exact_name_key(found[0].get("name") or "")
                      roster_binding_ok = bool(
                          roster_pos == pos
                          and roster_name_key == fresh_name_key
                      )
                  else:
                      status = "duplicate_roster_occurrence"
                      roster_pos = ""
                      roster_name_key = ""
                      roster_binding_ok = False

                  ok = bool(eligibility_ok and roster_binding_ok)
                  details.append({
                      "gsis_id": g,
                      "sleeper_id": sid,
                      "model_position": pos,
                      "fresh_identity_source": fresh_source,
                      "status": status,
                      "roster_occurrences": len(found),
                      "roster_position": roster_pos,
                      "roster_name_key_matches_fresh_week_identity":
                          (roster_name_key == fresh_name_key) if len(found) == 1 else None,
                      "fresh_eligibility_pair_exact": eligibility_ok,
                      "pass": ok,
                  })
                  all_pass = all_pass and ok

              return {
                  "pass": all_pass,
                  "all_three_checked": len(details) == 3,
                  "rostered_B45_count": rostered_count,
                  "unrostered_B45_count": unrostered_count,
                  "unrostered_is_not_failure": True,
                  "details": details,
              }


          def verify_shadow_freeze(repo: Path, shadow_commit: str) -> None:
              head = subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
              if head != shadow_commit: raise RuntimeError(f"B46_NOT_AT_SHADOW_FREEZE_COMMIT expected={shadow_commit} actual={head}")
              expected = sorted([str(OUT_IDENTITY_VALIDATION),str(OUT_IDENTITY_OVERLAY),str(OUT_SLEEPER_SNAPSHOT),str(OUT_ELIGIBILITY),str(OUT_CONTEXT),str(OUT_SHADOW),str(OUT_WITNESS)])
              changed = sorted(subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",shadow_commit], text=True).splitlines())
              if changed != expected: raise RuntimeError(f"B46_SHADOW_FREEZE_SCOPE_DRIFT expected={expected} actual={changed}")


