          def resolve_identity_layers(inputs: dict, b45_rows: list[dict]) -> dict:
              stable = inputs["stable"]
              stable_inverse = inputs["stable_inverse"]
              accepted = list(inputs["overlay_eval"]["accepted"])
              b45_by_g = {str(x["gsis_id"]): str(x["sleeper_id"]) for x in b45_rows}
              b45_by_sid = {str(x["sleeper_id"]): str(x["gsis_id"]) for x in b45_rows}

              b45_status = []
              b45_effective = {}
              for x in b45_rows:
                  g, sid = str(x["gsis_id"]), str(x["sleeper_id"])
                  stable_sid = stable.get(g)
                  stable_g = stable_inverse.get(sid)
                  if stable_sid and stable_sid != sid:
                      raise RuntimeError(f"B46_B45_GSIS_CONTRADICTED_BY_STABLE_CROSSWALK gsis={g}")
                  if stable_g and stable_g != g:
                      raise RuntimeError(f"B46_B45_SLEEPER_CONTRADICTED_BY_STABLE_CROSSWALK sleeper={sid}")
                  if stable_sid == sid and stable_g == g:
                      source = "STABLE_CROSSWALK_SAME_PAIR"
                  else:
                      source = "B45_VERIFIED_OVERRIDE"
                      b45_effective[g] = sid
                  b45_status.append({"gsis_id": g, "sleeper_id": sid, "resolution_source": source, "pass": True})

              dob_overlay = {}
              filtered_accepted = []
              collisions = []
              for x in accepted:
                  g, sid = str(x["gsis_id"]), str(x["sleeper_id"])
                  if g in b45_by_g or sid in b45_by_sid:
                      if b45_by_g.get(g) == sid and b45_by_sid.get(sid) == g:
                          continue
                      collisions.append({"gsis_id": g, "sleeper_id": sid})
                      continue
                  dob_overlay[g] = sid
                  filtered_accepted.append(x)
              if collisions:
                  raise RuntimeError(f"B46_DOB_POSITION_COLLIDES_WITH_B45 {collisions}")

              combined = dict(b45_effective)
              for g, sid in dob_overlay.items():
                  if g in combined and combined[g] != sid:
                      raise RuntimeError("B46_COMBINED_OVERLAY_GSIS_COLLISION")
                  if sid in combined.values() and combined.get(g) != sid:
                      raise RuntimeError("B46_COMBINED_OVERLAY_SLEEPER_COLLISION")
                  combined[g] = sid
              if len(set(combined.values())) != len(combined):
                  raise RuntimeError("B46_COMBINED_OVERLAY_NOT_ONE_TO_ONE")

              return {
                  "b45_status": b45_status,
                  "b45_effective": b45_effective,
                  "dob_overlay": dob_overlay,
                  "dob_accepted_rows": filtered_accepted,
              }


          def augmented_attach_fresh_factory(b42, identity_layers: dict):
              b45_effective = identity_layers["b45_effective"]
              dob_overlay = identity_layers["dob_overlay"]

              def attach(df: pd.DataFrame, lineage: dict, session: requests.Session):
                  exact, sid_to_gsis, mapped_sids, cross_sha, audit = b42.load_stable_id_crosswalk(
                      lineage, session
                  )
                  if cross_sha != EXPECTED_STABLE_CROSSWALK_SHA256:
                      raise RuntimeError("B46_ATTACH_STABLE_CROSSWALK_SHA_DRIFT")

                  augmented = dict(exact)
                  inverse = dict(sid_to_gsis)
                  for g, sid in b45_effective.items():
                      if g in augmented and augmented[g] != sid:
                          raise RuntimeError("B46_ATTACH_B45_GSIS_COLLISION")
                      if sid in inverse and inverse[sid] != g:
                          raise RuntimeError("B46_ATTACH_B45_SLEEPER_COLLISION")
                      augmented[g] = sid
                      inverse[sid] = g
                  for g, sid in dob_overlay.items():
                      if g in augmented:
                          raise RuntimeError("B46_ATTACH_DOB_GSIS_ALREADY_MAPPED")
                      if sid in inverse:
                          raise RuntimeError("B46_ATTACH_DOB_SLEEPER_ALREADY_MAPPED")
                      augmented[g] = sid
                      inverse[sid] = g

                  out = df.copy()
                  out["sleeper_id"] = out["gsis_id"].map(augmented)
                  out["identity_mapped"] = out["sleeper_id"].notna()
                  out["identity_source"] = [
                      "STABLE_CROSSWALK" if str(g) in exact
                      else "B45_VERIFIED_OVERRIDE" if str(g) in b45_effective
                      else "DOB_POSITION_OVERLAY" if str(g) in dob_overlay
                      else "UNMAPPED"
                      for g in out["gsis_id"].astype(str)
                  ]
                  overall = float(out["identity_mapped"].mean()) if len(out) else 0.0
                  pos_cov = (
                      out.groupby("position", observed=True)["identity_mapped"].mean().to_dict()
                      if len(out) else {}
                  )
                  audit2 = dict(audit)
                  audit2["B45_effective_override_count"] = len(b45_effective)
                  audit2["fresh_DOB_POSITION_overlay_count"] = len(dob_overlay)
                  audit2["combined_mapped_sleeper_id_count"] = len(inverse)
                  return out, cross_sha, overall, {k: float(v) for k, v in pos_cov.items()}, inverse, set(inverse), audit2
              return attach


          def write_identity_overlay_csv(path: Path, identity_layers: dict, b45_rows: list[dict]) -> None:
              b45_meta = {str(x["gsis_id"]): x for x in b45_rows}
              fields = [
                  "gsis_id","sleeper_id","identity_source","rule","name_key","model_position",
                  "position_family","birth_date","nfl_team","sleeper_position",
                  "sleeper_position_family","sleeper_birth_date","sleeper_nfl_team",
              ]
              rows = []
              for x in identity_layers["dob_accepted_rows"]:
                  row = dict(x)
                  row["identity_source"] = "DOB_POSITION_OVERLAY"
                  rows.append(row)
              for s in identity_layers["b45_status"]:
                  if s["resolution_source"] != "B45_VERIFIED_OVERRIDE":
                      continue
                  x = b45_meta[s["gsis_id"]]
                  rows.append({
                      "gsis_id": s["gsis_id"], "sleeper_id": s["sleeper_id"],
                      "identity_source": "B45_VERIFIED_OVERRIDE",
                      "rule": "B45_R6_AUTHORITATIVE_SOURCE_ADJUDICATION",
                      "name_key": "", "model_position": x["model_position"],
                      "position_family": x["model_position"],
                      "birth_date": x["adjudicated_birth_date"],
                      "nfl_team": x["nflverse_team"],
                      "sleeper_position": x["model_position"],
                      "sleeper_position_family": x["model_position"],
                      "sleeper_birth_date": x["sleeper_birth_date"],
                      "sleeper_nfl_team": x["sleeper_team"],
                  })
              with path.open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  for row in sorted(rows, key=lambda z: (z["identity_source"], z["gsis_id"])):
                      w.writerow({k: row.get(k, "") for k in fields})


          def write_sleeper_snapshot(path: Path, records: list[dict]) -> None:
              fields = ["sleeper_id","full_name","name_key","birth_date","position","position_family","nfl_team","status"]
              with path.open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  for x in sorted(records, key=lambda z: (str(z["sleeper_id"]), z["name_key"])):
                      w.writerow({k: x.get(k, "") for k in fields})


          def pre_roster_source_firewall(evaluator_path: Path) -> dict:
              tree = ast.parse(evaluator_path.read_text(encoding="utf-8"))
              protected = {"load_fresh_identity_inputs", "resolve_identity_layers", "augmented_attach_fresh_factory", "build_fresh_shadow"}
              forbidden = {"owner_id","owner_username","roster_id","dynasty_team","fantasy_roster_slot","team_name","starters","bench","taxi","reserve_ir","league_rosters"}
              found = {}
              class Visitor(ast.NodeVisitor):
                  def __init__(self):
                      self.hits = set()
                  def hit(self, value):
                      low = str(value or "").lower()
                      for tok in forbidden:
                          if tok in low:
                              self.hits.add(tok)
                  def visit_Name(self, node):
                      self.hit(node.id); self.generic_visit(node)
                  def visit_Attribute(self, node):
                      self.hit(node.attr); self.generic_visit(node)
                  def visit_arg(self, node):
                      self.hit(node.arg); self.generic_visit(node)
                  def visit_keyword(self, node):
                      if node.arg: self.hit(node.arg)
                      self.generic_visit(node)
                  def visit_Constant(self, node):
                      if isinstance(node.value, str): self.hit(node.value)
                      self.generic_visit(node)
              for node in tree.body:
                  if isinstance(node, ast.FunctionDef) and node.name in protected:
                      v = Visitor(); v.visit(node); found[node.name] = sorted(v.hits)
              missing = sorted(protected - set(found))
              bad = {k: v for k, v in found.items() if v}
              return {"protected_functions": sorted(protected), "forbidden_tokens": sorted(forbidden), "hits": found, "missing_functions": missing, "pass": not bad and not missing}


          def write_pre_roster_stop(repo: Path, stage: str, reason: str, extra: dict | None = None) -> None:
              payload = {
                  "schema_version": 1, "study_id": STUDY_ID, "phase": PHASE,
                  "result": PRE_ROSTER_STOP_RESULT, "stop_stage": stage, "reason": reason,
                  "target_week": TARGET_WEEK, "team_partition_metric_computed": False,
                  "roster_semantic_parse_performed": False, "all_primary_gates_pass": False,
                  "eligible_for_separate_production_authorization": False,
                  "production_change_authorized": False, "production_model_deployed": False,
              }
              if extra: payload.update(extra)
              write_json(repo / OUT_DECISION, payload)


          def build_fresh_shadow(repo: Path, cache: Path, protocol_commit: str) -> None:
              parents = verify_closed_parents(repo)
              verify_protocol_freeze(repo, protocol_commit)
              frozen_urls = verify_cache(repo, cache)

              b44 = load_module(repo / B44_EVALUATOR, "b46_parent_b44")
              b42, v1, lineage, adoption, v1_evidence = b44.load_verified_parents(repo)

              delegate = requests.Session()
              delegate.headers.update({"User-Agent": "LOG-Trade-Calculator-player-role-v2-b46-v1"})
              session = FrozenSourceSession(delegate, frozen_urls)

              firewall = pre_roster_source_firewall(repo / OUT_EVALUATOR)
              if firewall["pass"] is not True:
                  raise RuntimeError(f"B46_PRE_ROSTER_SOURCE_FIREWALL_FAILED {firewall}")

              cbs_check = verify_b45_cbs_evidence(parents["b45_evidence"])
              if cbs_check["pass"] is not True:
                  raise RuntimeError("B46_B45_DURABLE_EVIDENCE_RECHECK_FAILED")
              b45_rows = load_b45_rows(repo)

              inputs = load_fresh_identity_inputs(repo, cache, b44, b42, v1, lineage, session)
              overlay_eval = inputs["overlay_eval"]
              identity_validation = {
                  "schema_version": 1, "study_id": STUDY_ID,
                  "phase": "B46-v1-fresh-week-pre-roster-identity-validation",
                  "target_week": TARGET_WEEK,
                  "DOB_POSITION_reference_validation": overlay_eval["reference_validation"],
                  "DOB_POSITION_proposal_count": len(overlay_eval["proposals"]),
                  "DOB_POSITION_accepted_before_B45_precedence": len(overlay_eval["accepted"]),
                  "DOB_POSITION_quarantined_count": len(overlay_eval["quarantined"]),
                  "DOB_POSITION_quarantined": overlay_eval["quarantined"],
                  "DOB_POSITION_hard_precision_gates": overlay_eval["hard_precision_gates"],
                  "DOB_POSITION_all_hard_precision_gates_pass": overlay_eval["all_hard_precision_gates_pass"],
                  "B45_durable_evidence_recheck": cbs_check,
                  "B45_exact_override_count": len(b45_rows),
                  "owner_or_roster_context_used": False,
                  "pre_roster_source_firewall": firewall,
                  "production_change_authorized": False,
              }
              write_json(repo / OUT_IDENTITY_VALIDATION, identity_validation)
              if overlay_eval["all_hard_precision_gates_pass"] is not True:
                  write_pre_roster_stop(repo, "fresh_DOB_POSITION_reference_precision", "fresh Week-5 DOB_POSITION precision/consistency/protection gate failed", {"identity_validation_sha256": sha256_file(repo / OUT_IDENTITY_VALIDATION)})
                  return

              identity_layers = resolve_identity_layers(inputs, b45_rows)
              identity_validation["B45_resolution_status"] = identity_layers["b45_status"]
              identity_validation["B45_all_three_resolve_without_contradiction"] = bool(len(identity_layers["b45_status"]) == 3 and all(x["pass"] for x in identity_layers["b45_status"]))
              identity_validation["B45_effective_override_count"] = len(identity_layers["b45_effective"])
              identity_validation["DOB_POSITION_effective_overlay_count"] = len(identity_layers["dob_overlay"])
              write_json(repo / OUT_IDENTITY_VALIDATION, identity_validation)

              write_identity_overlay_csv(repo / OUT_IDENTITY_OVERLAY, identity_layers, b45_rows)
              write_sleeper_snapshot(repo / OUT_SLEEPER_SNAPSHOT, inputs["sleeper_records"])

              attach = augmented_attach_fresh_factory(b42, identity_layers)
              original_attach = b42.attach_stable_ids_row_guarded
              b42.attach_stable_ids_row_guarded = attach
              try:
                  eligibility, eligibility_audit = b42.build_role_eligibility(inputs["all_current_rows"], lineage["builder"], lineage, session, TARGET_WEEK)
                  with_ids, cross_sha, overall_cov, pos_cov, sid_to_gsis, mapped_sids, crosswalk_audit = attach(inputs["features"], lineage, session)
              finally:
                  b42.attach_stable_ids_row_guarded = original_attach

