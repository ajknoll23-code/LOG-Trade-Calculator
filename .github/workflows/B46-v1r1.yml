name: B46 Fresh Week 5 Acceptance V1R1

on:
  workflow_dispatch:
    inputs:
      attestation:
        description: Exact B46 V1 fresh Week-5 acceptance attestation
        required: true
        type: string

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE: research/player-role-v2
      OUT: /tmp/b46-v1
    steps:
      - name: Check out durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frozen scientific runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            'requests==2.34.2' 'numpy==2.5.3' 'pandas==2.3.3' 'scipy==1.18.1'
          python3 - <<'PYRUNTIME'
          import importlib.metadata as md
          expected={'requests':'2.34.2','numpy':'2.5.3','pandas':'2.3.3','scipy':'1.18.1'}
          for pkg,ver in expected.items():
              assert md.version(pkg)==ver,(pkg,md.version(pkg),ver)
          print('PASS: B46 V1 runtime pinned.')
          PYRUNTIME

      - name: Week 5 source-only readiness preflight and protocol freeze
        shell: bash
        env:
          OWNER_ATTEST: ${{ inputs.attestation }}
        run: |
          set -euo pipefail
          test "$OWNER_ATTEST" = 'I_CONFIRM_B46_V1R1_USES_FIXED_WEEK5_DATA_SLICED_THROUGH_WEEK5_WITH_A_FRESH_MAIN_ROSTER_SNAPSHOT_UNCHANGED_B44_GATES_AND_FROZEN_B45_R6_OVERRIDES_AND_A_PASS_ONLY_MAKES_B47_PRODUCTION_AUTHORIZATION_ELIGIBLE'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          if find "$BASE" -maxdepth 1 -type f -name 'player_role_v2_b46_v1_*' -print -quit | grep -q .; then
            echo 'B46_V1_NAMESPACE_ALREADY_CONSUMED'
            find "$BASE" -maxdepth 1 -type f -name 'player_role_v2_b46_v1_*' -print
            exit 1
          fi

          mkdir -p "$OUT/source_cache"
          INDEX_SHA_BEFORE="$(sha256sum index.html | awk '{print $1}')"
          FA_SHA_BEFORE="$(sha256sum free-agent-board.html | awk '{print $1}')"
          echo "INDEX_SHA_BEFORE=$INDEX_SHA_BEFORE" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$FA_SHA_BEFORE" >> "$GITHUB_ENV"

          # Fresh dispatch roster: exact current durable main bytes.
          # Copy/hash only; do not semantically parse before shadow freeze.
          cp data/league_rosters.json "$OUT/fresh_roster_snapshot.json"
          test "$(sha256sum "$OUT/fresh_roster_snapshot.json" | awk '{print $1}')" = "$(sha256sum data/league_rosters.json | awk '{print $1}')"
          test "$(git hash-object "$OUT/fresh_roster_snapshot.json")" = "$(git hash-object data/league_rosters.json)"

          cat > "$BASE/player_role_v2_b46_v1_evaluator.py" <<'PYB46'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import ast
          import csv
          import hashlib
          import importlib.util
          import io
          import json
          import math
          import secrets
          import subprocess
          import time
          from collections import Counter, defaultdict
          from pathlib import Path

          import pandas as pd
          import requests

          STUDY_ID = "player-role-v2"
          PHASE = "B46-v1-fresh-week-5-acceptance"
          BASE = Path("research/player-role-v2")
          TARGET_WEEK = 5
          PRIOR_WEEK = 4
          EXPECTED_WEEK5_GAME_COUNT = 15

          REQUIRED_TEAM_COUNT = 12
          MIN_TEAM_ROLE_COVERAGE = 0.98
          MAX_TEAM_COVERAGE_RANGE = 0.02
          ALLOWED_STRUCTURAL_ROLE_CHANGES = 0
          MIN_ROSTER_NAME_AVAILABILITY = 0.95
          MIN_PARTICIPANT_CONFIRMATION = 0.95

          PASS_RESULT = "PASS_B46_V1_FRESH_WEEK_ACCEPTANCE"
          STOP_RESULT = "SCIENTIFIC_STOP_B46_V1_FRESH_WEEK_ACCEPTANCE_FAILED"
          PRE_ROSTER_STOP_RESULT = "SCIENTIFIC_STOP_B46_V1_PRE_ROSTER_IDENTITY_OR_DATA_INTEGRITY"

          B44_MAIN_AT_START = "373b1f948dbaedd2faadbb05851653a0b4a3913e"
          B44_ROSTER_SHA256 = "692be469f4c4bd5215ad4f426302bb73a7d48a7840519b4873eac4bc35cebc7d"
          B44_EXPECTED_STOP = "SCIENTIFIC_STOP_B44W4_V1_OWNER_BLIND_ROLE_PARITY_FAILED"
          B44_EVALUATOR_SHA256 = "3540959281424e103cf172d66cb63401066187b1dccb86c587a662254cf8be1c"
          B44_EVALUATOR = BASE / "player_role_v2_b44w4_v1_evaluator.py"
          B44_DECISION = BASE / "player_role_v2_b44w4_v1_scientific_decision.json"
          B44_PARITY = BASE / "player_role_v2_b44w4_v1_implementation_parity.json"
          B44_WITNESS = BASE / "player_role_v2_b44w4_v1_shadow_refresh_witness.json"

          B45_EVIDENCE = BASE / "b45_evidence.json"
          B45_OVERRIDES = BASE / "b45_identity_overrides.csv"
          B45_EVIDENCE_BLOB = "5a168821327afc7939ff05f5f50c3f3dff7137d9"
          B45_OVERRIDES_BLOB = "15d5be73433591860d058e0b0221812f43b7e473"
          B45_OVERRIDES_SHA256 = "35b207f2e0b0837207774be6a1f9091c33b3c9384befb01666c05faf739bd655"
          B45_EXPECTED_DECISION = "B45_R6_OVERRIDES_FROZEN"

          B46W4_DECISION = BASE / "player_role_v2_b46w4_v2_scientific_decision.json"
          B46W4_EVIDENCE = BASE / "player_role_v2_b46w4_v2_owner_blind_evidence.json"
          B46W4_PROTOCOL = BASE / "player_role_v2_b46w4_v2_protocol.json"
          B46W4_DECISION_BLOB = "70950d11efa9d749c644807b28ed56f425de1850"
          B46W4_EVIDENCE_BLOB = "55e10d132b81e84c794b713df309b3543996d3a2"
          B46W4_PROTOCOL_BLOB = "b873f122f8ef29fcae7b826a2b2ed1f76896e34d"
          B46W4_EXPECTED_PASS = "PASS_B46W4_V2_REVISED_WEEK4_INTEGRATION_AUDIT"

          EXPECTED_STABLE_CROSSWALK_SHA256 = "de241875e4ae91d43bbc7fbff682521da2abc9535028f952a35cb3305106c0a5"

          OUT_EVALUATOR = BASE / "player_role_v2_b46_v1_evaluator.py"
          OUT_PREFLIGHT = BASE / "player_role_v2_b46_v1_source_preflight.json"
          OUT_PROTOCOL = BASE / "player_role_v2_b46_v1_protocol.json"
          OUT_IDENTITY_VALIDATION = BASE / "player_role_v2_b46_v1_identity_validation.json"
          OUT_IDENTITY_OVERLAY = BASE / "player_role_v2_b46_v1_identity_overlay.csv"
          OUT_SLEEPER_SNAPSHOT = BASE / "player_role_v2_b46_v1_sleeper_identity_snapshot.csv"
          OUT_ELIGIBILITY = BASE / "player_role_v2_b46_v1_role_eligibility.csv"
          OUT_CONTEXT = BASE / "player_role_v2_b46_v1_eligibility_context.json"
          OUT_SHADOW = BASE / "player_role_v2_b46_v1_shadow.csv"
          OUT_WITNESS = BASE / "player_role_v2_b46_v1_shadow_witness.json"
          OUT_EVIDENCE = BASE / "player_role_v2_b46_v1_owner_blind_evidence.json"
          OUT_DECISION = BASE / "player_role_v2_b46_v1_scientific_decision.json"

          SLEEPER_STATE_URL = "https://api.sleeper.app/v1/state/nfl"
          SLEEPER_PLAYERS_URL = "https://api.sleeper.app/v1/players/nfl"


          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def sha256_file(path: Path) -> str:
              return sha256_bytes(path.read_bytes())


          def git_blob(path: Path) -> str:
              return subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()


          def load_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))


          def write_json(path: Path, obj) -> None:
              path.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")


          def load_module(path: Path, name: str):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"B46_MODULE_LOAD_FAILED {path}")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod


          def boolish(v) -> bool:
              return str(v).strip().lower() in {"true", "1", "yes"}


          def get_bytes(session: requests.Session, url: str, timeout: int = 180, attempts: int = 5) -> bytes:
              last = None
              for attempt in range(attempts):
                  try:
                      r = session.get(url, timeout=timeout)
                      r.raise_for_status()
                      return r.content
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"B46_SOURCE_FETCH_FAILED url={url} error={last}")


          class FrozenResponse:
              def __init__(self, content: bytes, url: str):
                  self.content = content
                  self.url = url
                  self.status_code = 200

              def raise_for_status(self):
                  return None

              def json(self):
                  return json.loads(self.content.decode("utf-8"))


          class FrozenSourceSession:
              def __init__(self, delegate: requests.Session, payloads: dict[str, bytes]):
                  self.delegate = delegate
                  self.payloads = dict(payloads)
                  self.headers = delegate.headers

              def get(self, url, *args, **kwargs):
                  if url in self.payloads:
                      return FrozenResponse(self.payloads[url], url)
                  return self.delegate.get(url, *args, **kwargs)


          def verify_closed_parents(repo: Path) -> dict:
              b44_eval = repo / B44_EVALUATOR
              if sha256_file(b44_eval) != B44_EVALUATOR_SHA256:
                  raise RuntimeError("B46_B44_EVALUATOR_SHA_DRIFT")
              b44d = load_json(repo / B44_DECISION)
              if b44d.get("result") != B44_EXPECTED_STOP:
                  raise RuntimeError("B46_B44_STOP_NOT_PRESERVED")
              if b44d.get("production_change_authorized") is not False:
                  raise RuntimeError("B46_B44_PRODUCTION_STATE_DRIFT")

              if git_blob(repo / B45_EVIDENCE) != B45_EVIDENCE_BLOB:
                  raise RuntimeError("B46_B45_EVIDENCE_BLOB_DRIFT")
              if git_blob(repo / B45_OVERRIDES) != B45_OVERRIDES_BLOB:
                  raise RuntimeError("B46_B45_OVERRIDE_BLOB_DRIFT")
              if sha256_file(repo / B45_OVERRIDES) != B45_OVERRIDES_SHA256:
                  raise RuntimeError("B46_B45_OVERRIDE_SHA_DRIFT")
              b45e = load_json(repo / B45_EVIDENCE)
              if b45e.get("decision") != B45_EXPECTED_DECISION:
                  raise RuntimeError("B46_B45_R6_NOT_FROZEN")
              if int(b45e.get("accepted_override_count", -1)) != 3:
                  raise RuntimeError("B46_B45_OVERRIDE_COUNT_DRIFT")
              if b45e.get("B46_must_be_fresh_week") is not True:
                  raise RuntimeError("B46_B45_FRESH_WEEK_REQUIREMENT_DRIFT")
              if b45e.get("production_change_authorized") is not False:
                  raise RuntimeError("B46_B45_PRODUCTION_STATE_DRIFT")

              for path, expected_blob, label in [
                  (B46W4_DECISION, B46W4_DECISION_BLOB, "B46W4_DECISION"),
                  (B46W4_EVIDENCE, B46W4_EVIDENCE_BLOB, "B46W4_EVIDENCE"),
                  (B46W4_PROTOCOL, B46W4_PROTOCOL_BLOB, "B46W4_PROTOCOL"),
              ]:
                  if git_blob(repo / path) != expected_blob:
                      raise RuntimeError(f"B46_{label}_BLOB_DRIFT")
              w4d = load_json(repo / B46W4_DECISION)
              if w4d.get("result") != B46W4_EXPECTED_PASS:
                  raise RuntimeError("B46_B46W4_GREEN_PARENT_NOT_PRESERVED")
              if w4d.get("production_change_authorized") is not False:
                  raise RuntimeError("B46_B46W4_PRODUCTION_STATE_DRIFT")
              if w4d.get("B46_fresh_week_acceptance_remains_mandatory") is not True:
                  raise RuntimeError("B46_B46W4_FRESH_WEEK_REQUIREMENT_DRIFT")

              return {"b45_evidence": b45e, "b46w4_decision": w4d}


          def load_b45_rows(repo: Path) -> list[dict]:
              with (repo / B45_OVERRIDES).open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if len(rows) != 3:
                  raise RuntimeError(f"B46_REQUIRES_EXACTLY_3_B45_OVERRIDES got={len(rows)}")
              gsis = [str(x["gsis_id"]) for x in rows]
              sid = [str(x["sleeper_id"]) for x in rows]
              if len(set(gsis)) != 3 or len(set(sid)) != 3:
                  raise RuntimeError("B46_B45_OVERRIDE_NOT_ONE_TO_ONE")
              for x in rows:
                  if str(x.get("model_position") or "") not in {"DL", "K"}:
                      raise RuntimeError("B46_B45_POSITION_SCOPE_DRIFT")
                  if str(x.get("adjudicated_dob_matches") or "") not in {"sleeper", "nflverse"}:
                      raise RuntimeError("B46_B45_DOB_MATCH_FIELD_DRIFT")
                  if str(x.get("dob_error_source") or "") not in {"sleeper", "nflverse"}:
                      raise RuntimeError("B46_B45_DOB_ERROR_FIELD_DRIFT")
              return rows


          def csv_max_week(payload: bytes, *, type_col: str, type_value: str) -> tuple[int, pd.DataFrame]:
              df = pd.read_csv(io.BytesIO(payload), low_memory=False)
              required = {"season", "week", type_col}
              if not required.issubset(df.columns):
                  raise RuntimeError(f"B46_SOURCE_SCHEMA_MISSING required={sorted(required)}")
              season = pd.to_numeric(df["season"], errors="coerce")
              typ = df[type_col].astype(str)
              sub = df[(season == 2026) & (typ == type_value)].copy()
              sub["week"] = pd.to_numeric(sub["week"], errors="coerce")
              if sub.empty or sub["week"].dropna().empty:
                  raise RuntimeError("B46_SOURCE_2026_REG_EMPTY")
              return int(sub["week"].max()), sub


          def preflight(repo: Path, cache: Path, roster_snapshot: Path, evaluator_sha: str) -> None:
              verify_closed_parents(repo)
              cache.mkdir(parents=True, exist_ok=True)

              roster_sha = sha256_file(roster_snapshot)
              roster_blob = subprocess.check_output(
                  ["git", "hash-object", str(roster_snapshot)], text=True
              ).strip()
              current_repo_roster = repo / "data/league_rosters.json"
              if not current_repo_roster.exists():
                  raise RuntimeError("B46_CURRENT_ROSTER_FILE_MISSING")
              current_sha = sha256_file(current_repo_roster)
              current_blob = git_blob(current_repo_roster)
              if roster_sha != current_sha or roster_blob != current_blob:
                  raise RuntimeError(
                      "B46_DISPATCH_ROSTER_SNAPSHOT_NOT_CURRENT_MAIN "
                      f"snapshot_sha={roster_sha} current_sha={current_sha} "
                      f"snapshot_blob={roster_blob} current_blob={current_blob}"
                  )

              raw_log = subprocess.check_output(
                  ["git", "log", "-1", "--format=%H%x00%cI", "--", "data/league_rosters.json"],
                  text=True,
              ).rstrip("\n")
              if "\x00" not in raw_log:
                  raise RuntimeError("B46_CURRENT_ROSTER_LAST_COMMIT_METADATA_MISSING")
              roster_last_commit, roster_last_commit_time = raw_log.split("\x00", 1)

              session = requests.Session()
              session.headers.update({"User-Agent": "LOG-Trade-Calculator-player-role-v2-b46-v1-preflight"})

              state_bytes = get_bytes(session, SLEEPER_STATE_URL, timeout=90)
              players_bytes = get_bytes(session, SLEEPER_PLAYERS_URL, timeout=180)
              stats_bytes = get_bytes(
                  session,
                  "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv",
                  timeout=240,
              )
              snaps_bytes = get_bytes(
                  session,
                  "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_2026.csv",
                  timeout=240,
              )

              state = json.loads(state_bytes.decode("utf-8"))
              if str(state.get("season")) != "2026" or str(state.get("season_type")) != "regular":
                  raise RuntimeError(f"B46_SLEEPER_STATE_SEASON_DRIFT {state}")
              state_week = int(state.get("week") or 0)
              state_leg = int(state.get("leg") or state_week or 0)
              sleeper_latest_completed = min(state_week, state_leg) - 1

              stats_max, stats_df = csv_max_week(stats_bytes, type_col="season_type", type_value="REG")
              snaps_max, snaps_df = csv_max_week(snaps_bytes, type_col="game_type", type_value="REG")

              target_snaps = snaps_df[pd.to_numeric(snaps_df["week"], errors="coerce") == TARGET_WEEK]
              if "game_id" in target_snaps.columns:
                  week5_game_count = int(target_snaps["game_id"].astype(str).nunique())
                  game_count_method = "snap_counts_unique_game_id"
              elif "team" in target_snaps.columns:
                  team_count = int(target_snaps["team"].astype(str).nunique())
                  week5_game_count = team_count // 2
                  game_count_method = "snap_counts_unique_team_count_div_2"
              else:
                  raise RuntimeError("B46_SNAP_COUNTS_CANNOT_PROVE_WEEK5_GAME_COMPLETENESS")

              readiness = {
                  "sleeper_contains_completed_week5": sleeper_latest_completed >= TARGET_WEEK,
                  "stats_contain_week5_or_later": stats_max >= TARGET_WEEK,
                  "snaps_contain_week5_or_later": snaps_max >= TARGET_WEEK,
                  "week5_snap_game_count_exactly_15": week5_game_count == EXPECTED_WEEK5_GAME_COUNT,
              }
              if not all(readiness.values()):
                  raise RuntimeError(
                      "B46_V1_NOT_READY_FOR_FRESH_WEEK_5 "
                      f"state_week={state_week} state_leg={state_leg} "
                      f"sleeper_completed={sleeper_latest_completed} "
                      f"stats_max={stats_max} snaps_max={snaps_max} "
                      f"week5_snap_games={week5_game_count} readiness={readiness}"
                  )

              sleeper_week_hashes = {}
              sleeper_week_counts = {}
              for week in range(1, TARGET_WEEK + 1):
                  url = f"https://api.sleeper.app/v1/stats/nfl/regular/2026/{week}"
                  payload = get_bytes(session, url, timeout=120)
                  parsed = json.loads(payload.decode("utf-8"))
                  if not isinstance(parsed, dict):
                      raise RuntimeError(f"B46_SLEEPER_WEEK_NOT_DICT week={week}")
                  if week == TARGET_WEEK and not parsed:
                      raise RuntimeError("B46_SLEEPER_WEEK5_STATS_EMPTY")
                  (cache / f"sleeper_stats_week_{week}.json").write_bytes(payload)
                  sleeper_week_hashes[str(week)] = sha256_bytes(payload)
                  sleeper_week_counts[str(week)] = len(parsed)

              (cache / "sleeper_state.json").write_bytes(state_bytes)
              (cache / "sleeper_players.json").write_bytes(players_bytes)
              (cache / "stats_player_week_2026.csv").write_bytes(stats_bytes)
              (cache / "snap_counts_2026.csv").write_bytes(snaps_bytes)

              player_obj = json.loads(players_bytes.decode("utf-8"))
              if not isinstance(player_obj, dict) or len(player_obj) < 1000:
                  raise RuntimeError("B46_SLEEPER_PLAYER_MAP_SCHEMA_OR_SIZE_FAILED")

              pre = {
                  "schema_version": 1,
                  "study_id": STUDY_ID,
                  "phase": "B46-v1-source-only-readiness-preflight",
                  "target_week": TARGET_WEEK,
                  "prior_validation_week": PRIOR_WEEK,
                  "target_week_strictly_later_than_prior": TARGET_WEEK > PRIOR_WEEK,
                  "week_selection_policy": "FIXED_TARGET_WEEK5_SOURCES_MAY_EXTEND_LATER_BUT_ANALYSIS_SLICE_IS_WEEK_LE_5",
                  "source_may_contain_later_weeks": True,
                  "analysis_target_week_fixed": TARGET_WEEK,
                  "analysis_never_uses_week_after_target": True,
                  "source_readiness_all_pass": all(readiness.values()),
                  "source_readiness": readiness,
                  "sleeper_state": state,
                  "sleeper_latest_completed_week_observed": sleeper_latest_completed,
                  "nflverse_weekly_stats_max_available_week": stats_max,
                  "nflverse_snap_counts_max_available_week": snaps_max,
                  "week5_snap_game_count": week5_game_count,
                  "week5_game_count_method": game_count_method,
                  "expected_week5_game_count": EXPECTED_WEEK5_GAME_COUNT,
                  "nflverse_weekly_stats_raw_sha256": sha256_bytes(stats_bytes),
                  "nflverse_snap_counts_raw_sha256": sha256_bytes(snaps_bytes),
                  "sleeper_state_sha256": sha256_bytes(state_bytes),
                  "sleeper_player_map_sha256": sha256_bytes(players_bytes),
                  "sleeper_player_map_raw_object_count": len(player_obj),
                  "sleeper_weekly_stats_sha256": sleeper_week_hashes,
                  "sleeper_weekly_stats_object_count": sleeper_week_counts,
                  "roster_snapshot_sha256": roster_sha,
                  "roster_snapshot_git_blob": roster_blob,
                  "roster_source": "CURRENT_DATA_LEAGUE_ROSTERS_JSON_FROM_MAIN_AT_DISPATCH",
                  "roster_last_commit": roster_last_commit,
                  "roster_last_commit_time": roster_last_commit_time,
                  "roster_identical_to_B44W4_snapshot": roster_sha == B44_ROSTER_SHA256,
                  "roster_freshness_disclosed_not_time_gated": True,
                  "roster_snapshot_semantically_parsed": False,
                  "rostered_coverage_tally_computed": False,
                  "team_partition_metric_computed": False,
                  "evaluator_sha256": evaluator_sha,
                  "production_change_authorized": False,
              }
              write_json(repo / OUT_PREFLIGHT, pre)

              protocol = {
                  "schema_version": 1,
                  "study_id": STUDY_ID,
                  "phase": PHASE,
                  "status": "FROZEN_BEFORE_FRESH_WEEK_ROLE_COVERAGE_OR_TEAM_METRIC",
                  "classification": "PROSPECTIVE_FRESH_WEEK_ACCEPTANCE_AFTER_WEEK4_REMEDIATION",
                  "target_week": TARGET_WEEK,
                  "prior_validation_week": PRIOR_WEEK,
                  "target_week_strictly_later_than_prior": True,
                  "week_selection_policy": "FIXED_TARGET_WEEK5_SOURCES_MAY_ADVANCE_BUT_ALL_MODEL_INPUTS_SLICE_TO_WEEK5",
                  "source_slice_contract": {
                      "nflverse_rows_used": "season_2026_REG_and_week_le_5_only",
                      "sleeper_weeks_used": [1, 2, 3, 4, 5],
                      "origin_week": 5,
                      "future_week_data_allowed_in_raw_source_but_forbidden_from_analysis": True,
                  },
                  "fresh_week_result_not_opened_before_protocol_freeze": True,
                  "B44W4_stop_preserved": True,
                  "B45_R6_overrides_fixed_before_week5_result": True,
                  "B46W4_revised_week4_pass_preserved_as_same_week_evidence_only": True,
                  "evaluator_sha256": evaluator_sha,
                  "source_preflight_sha256": sha256_file(repo / OUT_PREFLIGHT),
