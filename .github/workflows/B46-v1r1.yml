              good = [1.0]*12
              assert min(good) >= MIN_TEAM_ROLE_COVERAGE and max(good)-min(good) <= MAX_TEAM_COVERAGE_RANGE
              bad = [1.0]*11+[0.97]
              assert min(bad) < MIN_TEAM_ROLE_COVERAGE and max(bad)-min(bad) > MAX_TEAM_COVERAGE_RANGE
