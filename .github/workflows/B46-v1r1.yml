                  keep_default_na=False,
              )
              b41j_gsis = set(str(x) for x in b41j_ref["gsis_id"] if str(x))
              b41j_sid = set(str(x) for x in b41j_ref["sleeper_id"] if str(x))

              overlay_eval = b44.compute_overlay(
