                  "B45_rostered_pairs_bind_or_unrostered_explicitly": bool(b45_binding.get("pass") is True and b45_binding.get("all_three_checked") is True),
                  "B45_all_three_pairs_present_in_fresh_eligibility": witness.get("B45_all_three_pairs_present_in_fresh_eligibility") is True,
