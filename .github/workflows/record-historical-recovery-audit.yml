name: Record Historical Recovery Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write recovery audit artifacts
        shell: bash
        run: |
          mkdir -p research/package-adjustment-v1

          cat > research/package-adjustment-v1/historical-recovery-audit.json <<'JSON'
          {
            "schema_version": 1,
            "status": "research_only_historical_recovery_audit",
            "consumer_changed": false,
            "audit_scope": "Existing 2026 current-league completed trades versus any legitimately pre-trade model state available in repository history",
            "current_league_trade_count": 15,
            "trade_window": {
              "first_trade_utc": "2026-04-24T02:21:25.527000Z",
              "last_trade_utc": "2026-05-27T13:42:15.544000Z"
            },
            "recovery_sources_considered": {
              "model_history": {
                "first_available_snapshot_utc": "2026-08-31T20:49:26.975886Z",
                "recoverable_trade_count": 0
              },
              "git_history": {
                "first_repository_commit_utc": "2026-08-13T03:38:56Z",
                "recoverable_trade_count": 0
              }
            },
            "result": {
              "recoverable_pretrade_numeric_trade_count": 0,
              "unrecoverable_trade_count": 15,
              "reason": "Every existing 2026 trade predates both repository history and frozen model-history capture. No contemporaneous calculator state exists in the repository from before any transaction."
            },
            "policy": {
              "current_or_posttrade_values_may_not_be_substituted": true,
              "existing_trades_may_be_used_for_structural_shape_research": true,
              "existing_trades_may_be_used_for_lambda_calibration": false,
              "future_trades_require_pretrade_snapshot": true
            }
          }
          JSON

          cat > research/package-adjustment-v1/historical-recovery-audit.md <<'MD'
          # Historical Package-Trade Recovery Audit

          **Status: RESEARCH ONLY — no production consumer changed.**

          ## Result

          **0 of 15 existing 2026 current-league trades can be legitimately recovered as pre-trade numeric observations.**

          The existing trades occurred from **2026-04-24 through 2026-05-27**.

          The earliest repository commit available is **2026-08-13**, and the first frozen model-history snapshot is **2026-08-31**. Therefore every existing trade predates every available committed calculator/model state.

          ## Recovery sources checked

          | Source | Earliest available state | Recoverable trades |
          |---|---:|---:|
          | Git repository history | 2026-08-13 03:38:56 UTC | 0 |
          | Frozen model-history snapshots | 2026-08-31 20:49:26 UTC | 0 |

          ## Methodology decision

          Current, August, or September values must **not** be substituted for April-May pre-trade values. Doing that would introduce hindsight leakage.

          The 15 existing trades may still be used for:

          - package-shape counts;
          - asset-count distributions;
          - player-only versus pick-involving trade structure;
          - qualitative examples.

          They may **not** be used to fit or validate Package Adjustment lambda because there is no contemporaneous pre-trade model state.

          ## Forward-looking status

          Prospective evidence capture is already active. Every future completed trade can become numerically eligible when a stored snapshot exists strictly before the Sleeper transaction timestamp.

          Package Preference Voting remains a supplemental calibration source rather than the sole path to promotion.
          MD

      - name: Verify audit contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("research/package-adjustment-v1/historical-recovery-audit.json")
          d = json.loads(p.read_text())

          assert d["status"] == "research_only_historical_recovery_audit"
          assert d["consumer_changed"] is False
          assert d["current_league_trade_count"] == 15
          assert d["result"]["recoverable_pretrade_numeric_trade_count"] == 0
          assert d["result"]["unrecoverable_trade_count"] == 15
          assert d["policy"]["current_or_posttrade_values_may_not_be_substituted"] is True
          assert d["policy"]["existing_trades_may_be_used_for_lambda_calibration"] is False
          assert d["policy"]["future_trades_require_pretrade_snapshot"] is True

          print("Historical recovery audit contract verified.")
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/record-historical-recovery-audit.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/package-adjustment-v1/historical-recovery-audit.json
          git add research/package-adjustment-v1/historical-recovery-audit.md
          git add -u .github/workflows/record-historical-recovery-audit.yml

          git commit -m "Record historical package trade recovery audit"
          git push origin main
