              'b41h_stopped_before_holdout_cohort_parse': True,
              'b41h_stopped_before_model_scoring': True,
              'b41h_stopped_before_bootstrap_testing': True,
              'b41h_performance_outputs_ever_committed': False,
              'human_holdout_performance_read_by_b41i': False,
              'holdout_metric_computed_by_b41i': False,
              'model_or_tier_retuning_performed': False,
              'b41j_requirements': {
                  'hash_pin_frozen_B41F_model': True,
                  'hash_pin_frozen_B41E_thresholds': True,
                  'hash_pin_frozen_feature_list': True,
                  'hash_pin_frozen_imputation_logic': True,
