      - name: Validate B41I output contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY4'
          from pathlib import Path
          import hashlib, json, os, subprocess

          out = Path(os.environ['OUT'])
          base = Path(os.environ['BASE'])
          d = json.loads(
              (out / 'player_role_v2_b41i_recovery_eligibility_decision.json').read_text()
          )
          assert d['result'] == 'PASS_B41I_OUTCOME_BLIND_RECOVERY_ELIGIBLE_FOR_B41J'
          assert d['continuation_class'] in {
              'STRICT_FROZEN_SOURCE_CONTINUATION',
              'OUTCOME_BLIND_IDENTITY_SOURCE_AMENDMENT',
          }
          assert d['human_holdout_performance_read_by_b41i'] is False
          assert d['holdout_metric_computed_by_b41i'] is False
          assert d['model_or_tier_retuning_performed'] is False
          assert d['production_change_authorized'] is False
          assert d['production_model_deployed'] is False
          assert d['b41j_must_load_identity_from_frozen_source_not_upstream'] is True
          assert d['b41j_must_not_redownload_players_csv'] is True

          src = d['b41j_identity_source']
          if src['kind'] == 'committed_file':
              p = out / 'frozen_inputs' / 'players_b41i_snapshot.csv'
              assert p.exists()
              assert hashlib.sha256(p.read_bytes()).hexdigest() == src['sha256']
          elif src['kind'] == 'git_blob':
              payload = subprocess.check_output(['git', 'cat-file', 'blob', src['oid']])
              assert hashlib.sha256(payload).hexdigest() == src['sha256']
          else:
              raise RuntimeError(f'B41I_UNKNOWN_FROZEN_SOURCE_KIND {src}')

          for name in [
              'player_role_v2_b41h_holdout_evidence.json',
              'player_role_v2_b41h_scored_holdout_rows.csv',
              'player_role_v2_b41h_bootstrap_replicates.csv',
              'player_role_v2_b41h_report.md',
          ]:
              assert not (base / name).exists()

          print('PASS: B41I-R4 output contract is outcome-blind and reproducible.')
          PY4

      - name: Commit durable B41I decision and exact frozen identity snapshot
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

          test "$(git hash-object "$BASE/player_role_v2_b41h_one_shot_holdout_evaluator.py")" = "$B41H_EVALUATOR_BLOB"
          test "$(git hash-object "$BASE/player_role_v2_b41h_evaluator_freeze.json")" = "$B41H_FREEZE_BLOB"
          test "$(git hash-object "$BASE/player_role_v2_b41h_scientific_decision.json")" = "$B41H_DECISION_BLOB"
          test "$(git hash-object "$BASE/player_role_v2_b41h_holdout_open_witness.json")" = "$B41H_WITNESS_BLOB"
          test "$(git hash-object "$BASE/player_role_v2_b41b_cohort_builder.py")" = "$B41B_BUILDER_BLOB"

          test ! -e "$BASE/player_role_v2_b41i_recovery_eligibility_decision.json"
          test ! -e "$BASE/player_role_v2_b41i_report.md"
          test ! -e "$BASE/frozen_inputs/players_b41i_snapshot.csv"

          cp "$OUT/player_role_v2_b41i_recovery_eligibility_decision.json" \
             "$BASE/player_role_v2_b41i_recovery_eligibility_decision.json"
          cp "$OUT/player_role_v2_b41i_report.md" \
             "$BASE/player_role_v2_b41i_report.md"

          git add \
            "$BASE/player_role_v2_b41i_recovery_eligibility_decision.json" \
            "$BASE/player_role_v2_b41i_report.md"

          if [ -f "$OUT/frozen_inputs/players_b41i_snapshot.csv" ]; then
            mkdir -p "$BASE/frozen_inputs"
            cp "$OUT/frozen_inputs/players_b41i_snapshot.csv" \
               "$BASE/frozen_inputs/players_b41i_snapshot.csv"
            git add "$BASE/frozen_inputs/players_b41i_snapshot.csv"
          fi

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            "$BASE/player_role_v2_b41i_recovery_eligibility_decision.json"
            "$BASE/player_role_v2_b41i_report.md"
          )
          if [ -f "$BASE/frozen_inputs/players_b41i_snapshot.csv" ]; then
            expected+=("$BASE/frozen_inputs/players_b41i_snapshot.csv")
          fi
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Freeze Player Role V2 B41I outcome-blind recovery eligibility' \
            -m 'No B41H holdout performance read or computed; exact continuation identity source persisted for B41J.' \
            -m 'B41J must preserve frozen model/tier/test semantics and carry the B41I continuation-class label.'
          git push origin HEAD:main

