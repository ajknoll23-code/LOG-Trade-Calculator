name: B41I Player Role Engine V2 - B41H Outcome-Blind Recovery Eligibility Audit V4 Required-vs-Optional Identity Schema Repair

'on':
  workflow_dispatch:
    inputs:
      owner_no_performance_peek_attestation:
        description: 'Confirm no B41H holdout performance outputs, scored rows, bootstrap results, or model-vs-target metrics were viewed'
        required: true
        type: choice
        options:
          - I_CONFIRM_NO_B41H_HOLDOUT_PERFORMANCE_OUTPUTS_WERE_VIEWED
      authorize_identity_source_amendment_if_needed:
        description: 'Authorize freezing the current upstream players.csv identity snapshot if the original frozen bytes cannot be recovered exactly'
        required: true
        type: choice
        options:
          - I_AUTHORIZE_CURRENT_UPSTREAM_IDENTITY_SNAPSHOT_IF_ORIGINAL_BYTES_UNRECOVERABLE

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  BASE: research/player-role-v2
  OUT: /tmp/player-role-v2-b41i-v4

  B41H_FREEZE_COMMIT: 0e69059f909c9462c7e62c858be723be70151471
  B41H_STOP_COMMIT: 46d39b5939f9db7d7133a48f2938e3d2cd39d48a
  B41H_EVALUATOR_BLOB: 7ac94496cb80303f9976339642ab8c2070069bbd
  B41H_EVALUATOR_SHA256: 5adf8692cba41165ac84bb86c3b76c55c217c00562367f33c644b11854cbd634
  B41H_FREEZE_BLOB: 04d96dea3d8ce4b92f352d4f88d474298fcbaf0e
  B41H_DECISION_BLOB: a5a5b5df78889d1f9245c0dd81b7fbff1b70815b
  B41H_WITNESS_BLOB: 82a198374812579bb178a659743885b06fe24ce8
  B41B_BUILDER_BLOB: 5843a4b84a00b11489909e65439aa5f4cd959989
  B41B_BUILDER_SHA256: 84dcee287a9884976344acb13b844267105da0396fd4c1f02898b7d70c5d15dc

  ORIGINAL_PLAYERS_SHA256: 810c1a8b09de1dc2ef94af7cabce5b66d0a6d5ac0751f99c5eaf09dc21425a21
  B41H_OBSERVED_PLAYERS_SHA256: 7ea1f10f0c3b0bf5c026a4b5935c6d01e4a72864a3122594a6df493b5bf29d97
  PLAYERS_URL: https://github.com/nflverse/nflverse-data/releases/download/players/players.csv

jobs:
  recovery_eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify exact frozen B41H stop state and owner authorization
        shell: bash
        env:
          OWNER_ATTEST: ${{ inputs.owner_no_performance_peek_attestation }}
          AMENDMENT_AUTH: ${{ inputs.authorize_identity_source_amendment_if_needed }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          mkdir -p "$OUT"

          test "$OWNER_ATTEST" = 'I_CONFIRM_NO_B41H_HOLDOUT_PERFORMANCE_OUTPUTS_WERE_VIEWED'
          test "$AMENDMENT_AUTH" = 'I_AUTHORIZE_CURRENT_UPSTREAM_IDENTITY_SNAPSHOT_IF_ORIGINAL_BYTES_UNRECOVERABLE'

          python3 - <<'PY1'
          from pathlib import Path
          import hashlib, json, os, subprocess

          base = Path(os.environ['BASE'])
          out = Path(os.environ['OUT'])

          paths = {
              'evaluator': base / 'player_role_v2_b41h_one_shot_holdout_evaluator.py',
              'freeze': base / 'player_role_v2_b41h_evaluator_freeze.json',
              'decision': base / 'player_role_v2_b41h_scientific_decision.json',
              'witness': base / 'player_role_v2_b41h_holdout_open_witness.json',
              'builder': base / 'player_role_v2_b41b_cohort_builder.py',
              'b41c3': base / 'player_role_v2_b41c3_scientific_decision.json',
              'b41f': base / 'player_role_v2_b41f_final_model_snapshot.json',
              'b41e': base / 'player_role_v2_b41e_tier_thresholds.json',
              'b41g_prereg': base / 'player_role_v2_b41g_holdout_validation_preregistration.json',
              'b41g_baseline': base / 'player_role_v2_b41g_baseline_snapshot.json',
          }
          for label, path in paths.items():
              if not path.exists():
                  raise RuntimeError(f'B41I_REQUIRED_FILE_MISSING {label} {path}')

          expected_blobs = {
              paths['evaluator']: os.environ['B41H_EVALUATOR_BLOB'],
              paths['freeze']: os.environ['B41H_FREEZE_BLOB'],
              paths['decision']: os.environ['B41H_DECISION_BLOB'],
              paths['witness']: os.environ['B41H_WITNESS_BLOB'],
              paths['builder']: os.environ['B41B_BUILDER_BLOB'],
          }
          for path, expected in expected_blobs.items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', str(path)], text=True
              ).strip()
              if actual != expected:
                  raise RuntimeError(
                      f'B41I_FROZEN_BLOB_DRIFT {path} expected={expected} actual={actual}'
                  )

          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          if sha(paths['evaluator']) != os.environ['B41H_EVALUATOR_SHA256']:
              raise RuntimeError('B41I_EVALUATOR_SHA_DRIFT')
          if sha(paths['builder']) != os.environ['B41B_BUILDER_SHA256']:
              raise RuntimeError('B41I_BUILDER_SHA_DRIFT')

          decision = json.loads(paths['decision'].read_text())
          witness = json.loads(paths['witness'].read_text())
          c3 = json.loads(paths['b41c3'].read_text())
          freeze = json.loads(paths['freeze'].read_text())
          b41f = json.loads(paths['b41f'].read_text())

          expected_reason = (
              'SOURCE_SHA_MISMATCH players '
              f'expected={os.environ["ORIGINAL_PLAYERS_SHA256"]} '
              f'actual={os.environ["B41H_OBSERVED_PLAYERS_SHA256"]}'
          )
          if decision != {
              '2025_holdout_evaluated_once': True,
              '2025_holdout_opened': True,
              'phase': 'B41H-scientific-decision',
              'production_change_authorized': False,
              'production_model_deployed': False,
              'reason': expected_reason,
              'result': 'SCIENTIFIC_STOP_DATA_INTEGRITY',
              'schema_version': 1,
              'study_id': 'player-role-v2',
          }:
              raise RuntimeError('B41I_B41H_DECISION_NOT_EXACT_EXPECTED_STOP')

          assert witness['study_id'] == 'player-role-v2'
          assert witness['phase'] == 'B41H-2025-holdout-open-witness'
          assert witness['B41C3_result'] == 'PASS_UNTOUCHED_WEEK4_SCORER_CONFIRMATION'
          assert witness['eligible_for_2025_holdout_evaluation'] is True
          assert witness['production_change_authorized'] is False

          assert c3['result'] == 'PASS_UNTOUCHED_WEEK4_SCORER_CONFIRMATION'
          assert c3['eligible_for_2025_holdout_evaluation'] is True
          assert c3['mismatch_count'] == 0
          assert c3['production_change_authorized'] is False

          assert freeze['status'] == 'EVALUATOR_IMPLEMENTATION_FROZEN_BEFORE_B41C3_AND_2025_HOLDOUT'
          assert freeze['evaluator_sha256'] == os.environ['B41H_EVALUATOR_SHA256']
          assert freeze['sequencing']['one_scientific_2025_evaluation_only'] is True
          assert freeze['production_change_authorized'] is False
          assert freeze['production_model_deployed'] is False

          assert b41f['production_model_deployed'] is False
          assert b41f['production_change_authorized'] is False

          for forbidden in [
              base / 'player_role_v2_b41i_recovery_eligibility_decision.json',
              base / 'player_role_v2_b41i_report.md',
              base / 'frozen_inputs' / 'players_b41i_snapshot.csv',
          ]:
              if forbidden.exists():
                  raise RuntimeError(f'B41I_ALREADY_COMMITTED_REFUSING_RERUN {forbidden}')

          changed = subprocess.check_output(
              ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r',
               os.environ['B41H_STOP_COMMIT']],
              text=True,
          ).splitlines()
          expected_changed = sorted([
              str(paths['decision']),
              str(paths['witness']),
          ])
          if sorted(changed) != expected_changed:
              raise RuntimeError(
                  f'B41I_B41H_STOP_COMMIT_SCOPE_UNEXPECTED {sorted(changed)}'
              )

          current_forbidden = [
              base / 'player_role_v2_b41h_holdout_evidence.json',
              base / 'player_role_v2_b41h_scored_holdout_rows.csv',
              base / 'player_role_v2_b41h_bootstrap_replicates.csv',
              base / 'player_role_v2_b41h_report.md',
          ]
          present = [str(p) for p in current_forbidden if p.exists()]
          if present:
              raise RuntimeError(
                  'B41I_B41H_PERFORMANCE_OUTPUT_PRESENT ' + ','.join(present)
              )

          history = subprocess.check_output(
              ['git', 'log', '--diff-filter=A', '--name-only', '--pretty=format:',
               f'{os.environ["B41H_FREEZE_COMMIT"]}..HEAD', '--',
               'research/player-role-v2'],
              text=True,
          )
          bad = []
          for raw in history.splitlines():
              p = raw.strip()
              low = p.lower()
              if (
                  p
                  and 'b41h' in low
                  and any(k in low for k in ('evidence', 'scored', 'bootstrap', 'report'))
              ):
                  bad.append(p)
          if bad:
              raise RuntimeError(
                  'B41I_PERFORMANCE_OUTPUT_EVER_COMMITTED ' + ','.join(sorted(set(bad)))
              )

          preflight = {
              'schema_version': 2,
              'study_id': 'player-role-v2',
              'phase': 'B41I-R4-preflight',
              'b41h_stop_commit': os.environ['B41H_STOP_COMMIT'],
              'b41h_freeze_commit': os.environ['B41H_FREEZE_COMMIT'],
              'b41h_result': decision['result'],
              'b41h_stop_reason': decision['reason'],
              'b41h_performance_output_current_tree_present': False,
              'b41h_performance_output_ever_committed_after_freeze': False,
              'owner_no_performance_peek_attested': True,
              'identity_source_amendment_if_needed_authorized': True,
              'human_holdout_performance_read_by_b41i': False,
              'production_change_authorized': False,
          }
          (out / 'preflight.json').write_text(
              json.dumps(preflight, indent=2, sort_keys=True) + '\n'
          )
          print('PASS: exact B41H stop state, clean history, and owner authorization verified.')
          PY1

      - name: Prove B41H stopped before cohort parsing or performance evaluation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY2'
          from pathlib import Path
          import ast, json, os

          base = Path(os.environ['BASE'])
          out = Path(os.environ['OUT'])
          evaluator_path = base / 'player_role_v2_b41h_one_shot_holdout_evaluator.py'
          builder_path = base / 'player_role_v2_b41b_cohort_builder.py'
          evaluator_src = evaluator_path.read_text()
          builder_src = builder_path.read_text()
          et = ast.parse(evaluator_src)
          bt = ast.parse(builder_src)

          def fn_node(tree, name):
              matches = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name]
              if len(matches) != 1:
                  raise RuntimeError(f'B41I_FUNCTION_COUNT_{name}_{len(matches)}')
              return matches[0]

          def segment(src, node):
              lines = src.splitlines()
              return '\n'.join(lines[node.lineno - 1:node.end_lineno])

          cohort = fn_node(et, 'build_holdout_cohort')
          cohort_text = segment(evaluator_src, cohort)
          required_order = [
              'players_payload = get_bytes(session, players_url)',
              'players_sha = sha256_bytes(players_payload)',
              'if players_sha != prereg["frozen_inputs"]["players_identity_sha256"]:',
              'builder.load_players(players_path)',
              'builder.load_season(stats_path, snaps_path, gsis_meta, pfr_to_gsis)',
              'builder.build_origins(all_rows)',
          ]
          positions = []
          for needle in required_order:
              if needle not in cohort_text:
                  raise RuntimeError(f'B41I_EXPECTED_CONTROL_FLOW_TEXT_MISSING {needle}')
              positions.append(cohort_text.index(needle))
          if positions != sorted(positions):
              raise RuntimeError('B41I_BUILD_HOLDOUT_COHORT_ORDER_DRIFT')

          pre_player_parse = cohort_text[:cohort_text.index('builder.load_players(players_path)')]
          forbidden_preparse = [
              'pd.read_csv',
              'builder.load_season(',
              'builder.build_origins(',
              'score_and_normalize(',
              'apply_frozen_models(',
              'bootstrap_tests(',
          ]
          for needle in forbidden_preparse:
              if needle in pre_player_parse:
                  raise RuntimeError(f'B41I_PRESTOP_PARSE_OR_SCORE_PATH_FOUND {needle}')

          helper_audit = {}
          for name in ('get_bytes', 'source_integrity_or_stop'):
              node = fn_node(et, name)
              text = segment(evaluator_src, node)
              forbidden = ['print(', 'pd.read_csv', 'csv.reader', 'read_csv(']
              found = [x for x in forbidden if x in text]
              if found:
                  raise RuntimeError(f'B41I_HELPER_HYGIENE_FAIL {name} {found}')
              helper_audit[name] = {
                  'forbidden_print_or_row_parse_found': False,
                  'start_line': node.lineno,
                  'end_line': node.end_lineno,
              }

          def calls_by_name(fn):
              out = {}
              for n in ast.walk(fn):
                  if not isinstance(n, ast.Call):
                      continue
                  if isinstance(n.func, ast.Name):
                      name = n.func.id
                  elif isinstance(n.func, ast.Attribute):
                      name = n.func.attr
                  else:
                      continue
                  out.setdefault(name, []).append(n.lineno)
              return out

          # V3 implementation-only repair:
          # frozen main() does not call build_holdout_cohort directly. It calls
          # evaluate(), and evaluate() owns the scientific call sequence.
          main = fn_node(et, 'main')
          evaluate = fn_node(et, 'evaluate')
          main_calls = calls_by_name(main)
          evaluate_calls = calls_by_name(evaluate)

          if len(main_calls.get('evaluate', [])) != 1:
              raise RuntimeError(
                  f'B41I_MAIN_EVALUATE_CALL_COUNT_{len(main_calls.get("evaluate", []))}'
              )
          main_evaluate_line = main_calls['evaluate'][0]

          # No scientific performance primitive may bypass evaluate() from main.
          for name in (
              'build_holdout_cohort',
              'score_and_normalize',
              'apply_frozen_models',
              'bootstrap_tests',
              'tier_test',
          ):
              if name in main_calls:
                  raise RuntimeError(f'B41I_MAIN_UNEXPECTED_DIRECT_SCIENTIFIC_CALL {name}')

          required_evaluate_calls = (
              'build_holdout_cohort',
              'attach_stable_ids',
              'score_and_normalize',
              'apply_frozen_models',
              'data_quality',
              'bootstrap_tests',
              'tier_test',
          )
          for name in required_evaluate_calls:
              if name not in evaluate_calls:
                  raise RuntimeError(f'B41I_EVALUATE_MISSING_{name}_CALL')

          build_line = min(evaluate_calls['build_holdout_cohort'])
          later_calls = {
              name: min(evaluate_calls[name])
              for name in (
                  'attach_stable_ids',
                  'score_and_normalize',
                  'apply_frozen_models',
                  'data_quality',
                  'bootstrap_tests',
                  'tier_test',
              )
          }
          for name, line in later_calls.items():
              if line <= build_line:
                  raise RuntimeError(
                      f'B41I_EVALUATE_CALL_ORDER_FAIL {name}={line} build={build_line}'
                  )

          # Also prove the lexical prefix of evaluate() before the cohort call
          # contains no scoring, model application, or inferential test call.
          evaluate_text = segment(evaluator_src, evaluate)
          build_call_text = 'build_holdout_cohort(repo, out, prereg, session)'
          if build_call_text not in evaluate_text:
              raise RuntimeError('B41I_EVALUATE_BUILD_CALL_TEXT_MISSING')
          evaluate_prefix = evaluate_text[:evaluate_text.index(build_call_text)]
          for needle in (
              'score_and_normalize(',
              'apply_frozen_models(',
              'bootstrap_tests(',
              'tier_test(',
          ):
              if needle in evaluate_prefix:
                  raise RuntimeError(
                      f'B41I_EVALUATE_PRECOHORT_PERFORMANCE_CALL_FOUND {needle}'
                  )

          load_players = fn_node(bt, 'load_players')
          required_columns = set()
          optional_get_columns = set()
          for n in ast.walk(load_players):
              # Columns in the frozen builder's explicit `required = {...}` set
              # are the only schema-gating fields. This mirrors load_players().
              if isinstance(n, ast.Assign):
                  for target in n.targets:
                      if isinstance(target, ast.Name) and target.id == 'required':
                          if isinstance(n.value, (ast.Set, ast.Tuple, ast.List)):
                              for e in n.value.elts:
                                  if isinstance(e, ast.Constant) and isinstance(e.value, str):
                                      required_columns.add(e.value)
              # r.get(...) fields are consumed when present, but may be optional
              # fallbacks. Missing optional name fields must not be promoted into
              # new hard schema requirements that the frozen builder itself lacks.
              if (
                  isinstance(n, ast.Call)
                  and isinstance(n.func, ast.Attribute)
                  and n.func.attr == 'get'
                  and isinstance(n.func.value, ast.Name)
                  and n.func.value.id == 'r'
                  and n.args
                  and isinstance(n.args[0], ast.Constant)
                  and isinstance(n.args[0].value, str)
              ):
                  optional_get_columns.add(n.args[0].value)

          columns = required_columns | optional_get_columns
          expected_required_columns = {'gsis_id', 'pfr_id', 'position'}
          expected_consumed_columns = {
              'gsis_id', 'pfr_id', 'position',
              'display_name', 'full_name', 'football_name',
          }
          if required_columns != expected_required_columns:
              raise RuntimeError(
                  f'B41I_REQUIRED_IDENTITY_COLUMN_INVENTORY_DRIFT expected={sorted(expected_required_columns)} actual={sorted(required_columns)}'
              )
          if columns != expected_consumed_columns:
              raise RuntimeError(
                  f'B41I_CONSUMED_IDENTITY_COLUMN_INVENTORY_DRIFT expected={sorted(expected_consumed_columns)} actual={sorted(columns)}'
              )

          time_varying_known = {
              'position', 'status', 'team', 'current_team',
              'years_of_experience', 'years_exp', 'depth_chart_position',
          }
          time_varying_used = sorted(columns & time_varying_known)
          static_or_identity_used = sorted(columns - set(time_varying_used))

          audit = {
              'schema_version': 2,
              'study_id': 'player-role-v2',
              'phase': 'B41I-R4-static-control-flow-and-identity-column-audit',
              'b41h_stop_before_players_row_parse': True,
              'b41h_stop_before_load_season': True,
              'b41h_stop_before_build_origins': True,
              'b41h_stop_before_model_score': True,
              'b41h_stop_before_bootstrap_tests': True,
              'main_evaluate_call_line': main_evaluate_line,
              'evaluate_build_holdout_cohort_call_line': build_line,
              'evaluate_later_scientific_call_lines': later_calls,
              'pre_stop_helper_hygiene': helper_audit,
              'players_csv_required_columns_by_frozen_builder_load_players': sorted(required_columns),
              'players_csv_optional_get_columns_by_frozen_builder_load_players': sorted(optional_get_columns - required_columns),
              'players_csv_columns_used_by_frozen_builder_load_players': sorted(columns),
              'static_or_identity_columns_used': static_or_identity_used,
              'time_varying_columns_used': time_varying_used,
              'lookahead_disclosure_required': bool(time_varying_used),
              'lookahead_disclosure': (
                  'Frozen load_players consumes current players.csv position. Position can be revised over time. '
                  'This issue existed in the original post-2025 frozen identity source as well and is disclosed; '
                  'no status, team, or experience column is consumed by load_players.'
                  if time_varying_used
                  else 'Only static identity fields are consumed.'
              ),
              'human_holdout_performance_read': False,
              'performance_metric_computed': False,
              'production_change_authorized': False,
          }
          (out / 'control_flow_and_identity_inventory.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps({
              'b41h_stop_before_performance': True,
              'required_identity_columns': sorted(required_columns),
              'all_consumed_identity_columns': sorted(columns),
              'time_varying_identity_columns': time_varying_used,
              'performance_metric_computed': False,
          }, indent=2))
          PY2

      - name: Resolve and freeze the exact B41J identity source without reading holdout outcomes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY3'
          from pathlib import Path
          import csv
          import hashlib
          import io
          import json
          import os
          import subprocess
          import urllib.request

          out = Path(os.environ['OUT'])
          frozen_dir = out / 'frozen_inputs'
          frozen_dir.mkdir(parents=True, exist_ok=True)

          original_sha = os.environ['ORIGINAL_PLAYERS_SHA256']
          observed_sha = os.environ['B41H_OBSERVED_PLAYERS_SHA256']

          inventory = json.loads(
              (out / 'control_flow_and_identity_inventory.json').read_text()
          )
          required_columns = set(
              inventory['players_csv_required_columns_by_frozen_builder_load_players']
          )
          optional_columns = set(
              inventory['players_csv_optional_get_columns_by_frozen_builder_load_players']
          )

          exact_blob = None
          exact_blob_path = None
          objects = subprocess.check_output(
              ['git', 'rev-list', '--objects', '--all'], text=True
          ).splitlines()
          candidates = []
          for line in objects:
              parts = line.split(' ', 1)
              if len(parts) != 2:
                  continue
              oid, path = parts
              low = path.lower()
              if 'player' in low and (low.endswith('.csv') or low.endswith('.txt')):
                  candidates.append((oid, path))

          seen = set()
          for oid, path in candidates:
              if oid in seen:
                  continue
              seen.add(oid)
              try:
                  payload = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              except subprocess.CalledProcessError:
                  continue
              if hashlib.sha256(payload).hexdigest() == original_sha:
                  exact_blob = oid
                  exact_blob_path = path
                  break

          current_players = None
          current_sha = None
          current_header = None
          missing_optional = None

          if exact_blob is not None:
              recovery_mode = 'ORIGINAL_FROZEN_IDENTITY_GIT_BLOB_RECOVERED'
              continuation_class = 'STRICT_FROZEN_SOURCE_CONTINUATION'
              requires_amendment = False
              frozen_source = {
                  'kind': 'git_blob',
                  'oid': exact_blob,
                  'historical_path': exact_blob_path,
                  'sha256': original_sha,
              }
          else:
              req = urllib.request.Request(
                  os.environ['PLAYERS_URL'],
                  headers={'User-Agent': 'LOG-Trade-Calculator-B41I-R4/1.0'},
              )
              with urllib.request.urlopen(req, timeout=180) as resp:
                  if resp.status != 200:
                      raise RuntimeError(f'B41I_PLAYERS_HTTP_{resp.status}')
                  current_players = resp.read()

              current_sha = hashlib.sha256(current_players).hexdigest()

              stream = io.TextIOWrapper(
                  io.BytesIO(current_players),
                  encoding='utf-8-sig',
                  newline='',
              )
              reader = csv.reader(stream)
              try:
                  current_header = next(reader)
              except StopIteration:
                  raise RuntimeError('B41I_CURRENT_PLAYERS_EMPTY')
              finally:
                  stream.detach()

              header_set = set(current_header)
              missing_required = sorted(required_columns - header_set)
              missing_optional = sorted(optional_columns - header_set)
              if missing_required:
                  raise RuntimeError(
                      f'B41I_CURRENT_PLAYERS_REQUIRED_IDENTITY_SCHEMA_MISSING {missing_required}'
                  )

              # Optional name fallbacks are disclosure-only. The frozen builder
              # itself uses r.get(...) / OR fallbacks and does not require them.
              snapshot = frozen_dir / 'players_b41i_snapshot.csv'
              snapshot.write_bytes(current_players)

              if current_sha == original_sha:
                  recovery_mode = 'CURRENT_UPSTREAM_EXACTLY_MATCHES_ORIGINAL_FROZEN_SOURCE'
                  continuation_class = 'STRICT_FROZEN_SOURCE_CONTINUATION'
                  requires_amendment = False
              else:
                  recovery_mode = (
                      'B41H_OBSERVED_IDENTITY_SNAPSHOT_RECOVERABLE'
                      if current_sha == observed_sha
                      else 'CURRENT_UPSTREAM_IDENTITY_SNAPSHOT_FROZEN'
                  )
                  continuation_class = 'OUTCOME_BLIND_IDENTITY_SOURCE_AMENDMENT'
                  requires_amendment = True

              frozen_source = {
                  'kind': 'committed_file',
                  'path': 'research/player-role-v2/frozen_inputs/players_b41i_snapshot.csv',
                  'sha256': current_sha,
              }

          decision = {
              'schema_version': 2,
              'study_id': 'player-role-v2',
              'phase': 'B41I-R4-b41h-outcome-blind-recovery-eligibility-audit',
              'result': 'PASS_B41I_OUTCOME_BLIND_RECOVERY_ELIGIBLE_FOR_B41J',
              'recovery_mode': recovery_mode,
              'continuation_class': continuation_class,
              'requires_identity_source_amendment': requires_amendment,
              'owner_authorized_identity_source_amendment_if_needed': True,
              'owner_attested_no_b41h_performance_peek': True,
              'prior_failed_outcome_blind_attempts': [
                  {
                      'version': 'B41I_V2',
                      'failure': 'B41I_MAIN_MISSING_BUILD_HOLDOUT_COHORT_CALL',
                      'identity_snapshot_fetched': False,
                      'snapshot_persisted': False,
                      'performance_metric_computed': False,
                  },
                  {
                      'version': 'B41I_V3',
                      'failure': "B41I_CURRENT_PLAYERS_IDENTITY_SCHEMA_MISSING ['full_name']",
                      'identity_snapshot_fetched': True,
                      'snapshot_persisted': False,
                      'performance_metric_computed': False,
                  },
              ],
              'original_preregistered_players_sha256': original_sha,
              'b41h_observed_players_sha256_before_stop': observed_sha,
              'current_upstream_players_sha256_at_b41i': current_sha,
              'current_upstream_equals_b41h_observed': (
                  current_sha == observed_sha if current_sha is not None else None
              ),
              'current_upstream_equals_original_frozen': (
                  current_sha == original_sha if current_sha is not None else None
              ),
              'b41j_identity_source': frozen_source,
              'b41j_must_load_identity_from_frozen_source_not_upstream': True,
              'b41j_must_not_redownload_players_csv': True,
              'identity_columns_required_by_frozen_builder': inventory[
                  'players_csv_required_columns_by_frozen_builder_load_players'
              ],
              'identity_columns_used_by_frozen_builder': inventory[
                  'players_csv_columns_used_by_frozen_builder_load_players'
              ],
              'optional_identity_columns_missing_from_current_snapshot': missing_optional,
              'time_varying_identity_columns_used': inventory[
                  'time_varying_columns_used'
              ],
              'identity_lookahead_disclosure_required': inventory[
                  'lookahead_disclosure_required'
              ],
              'identity_lookahead_disclosure': inventory[
