      - name: Run full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove audit made no repository changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo 'ERROR: offense Phase O1 modified tracked repository files.' >&2
            git diff -- .
            exit 1
          fi
          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: offense Phase O1 staged tracked repository files.' >&2
            git diff --cached -- .
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'ERROR: offense Phase O1 created repository files.' >&2
            git status --porcelain --untracked-files=all
            exit 1
          fi
          echo 'PASS: offense Phase O1 left repository unchanged.'

      - name: Destroy private inputs and row-level outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-offense-v1
          rm -f /tmp/fourforfour-offense-phase-o1.py /tmp/fourforfour-offense-phase-o1.py.b64
          echo 'PASS: private 4for4 offense input and row-level working data removed.'
