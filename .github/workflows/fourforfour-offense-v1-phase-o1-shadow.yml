name: 4for4 Offense V1 - Phase O1 Private Source & Shadow Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offense-private-source-shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOURFORFOUR_OFFENSE_GZ_B64: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Verify current production/code base
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: git blob drift for $path" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
            echo "PASS git-blob $path $actual"
          }

          check_blob 3a13379cb6827bec7f412ec25a9163d8897ef975 index.html
          check_blob bd06f66facb602d36307e0f9e88db013a3576726 research/production-v2/production_v2_phase1_audit.py
          check_blob 1efca4c35e910a95974c1bec0b06a106196618b3 scripts/validation/snapshot_values.py
          check_blob b01b938abbfec224c30604b1e34dc5bb9a94ccf0 scripts/model/production_history_component.py
          check_blob b2affac777de89fca88301a07b16f39482c8dcdd scripts/projections/build_team_utility_lineup_projections.py

          python3 research/production-v2/production_v2_phase1_audit.py --selftest
          echo 'PASS: production lineage/code base is exact.'

      - name: Decode and verify private 4for4 offense export
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FOURFORFOUR_OFFENSE_GZ_B64:-}" ]; then
            echo 'ERROR: GitHub Actions secret FOURFORFOUR_OFFENSE_GZ_B64 is missing or empty.' >&2
            exit 1
          fi

          install -d -m 700 /tmp/log-fourforfour-offense-v1/input
          printf '%s' "$FOURFORFOUR_OFFENSE_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-offense-v1/input/offense.csv
          chmod 600 /tmp/log-fourforfour-offense-v1/input/offense.csv

          echo '488f8b7bf74b5e30ed515c7cde4b2049d1af6ad0d953ae7f78fd82561293af11  /tmp/log-fourforfour-offense-v1/input/offense.csv' \
            | sha256sum --check --strict

          echo 'PASS: private 4for4 offense export matches uploaded source.'

