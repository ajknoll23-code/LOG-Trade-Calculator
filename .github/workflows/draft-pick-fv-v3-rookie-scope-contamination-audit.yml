      - name: Prove only four intended audit files changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/draft-pick-fv-v3/draft_pick_fv_v3_rookie_scope_contamination_audit.py",
              "research/draft-pick-fv-v3/rookie_scope_contamination_audit_v3.json",
              "research/draft-pick-fv-v3/rookie_scope_contamination_audit_v3.md",
              "research/draft-pick-fv-v3/rookie_scope_contamination_audit_manifest_v3.json",
          }
          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          if changed != expected:
              raise SystemExit(
                  f"Unexpected changed files.\nExpected: {sorted(expected)}\nActual: {sorted(changed)}"
              )
          print("PASS: exactly four intended audit files changed.")
          PY

