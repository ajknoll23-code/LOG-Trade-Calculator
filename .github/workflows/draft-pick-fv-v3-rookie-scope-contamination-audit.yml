      - name: Validate diagnostic-only result
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("research/draft-pick-fv-v3")
          j = p / "rookie_scope_contamination_audit_v3.json"
          m = p / "rookie_scope_contamination_audit_manifest_v3.json"
          md = p / "rookie_scope_contamination_audit_v3.md"
          d = json.loads(j.read_text())
          man = json.loads(m.read_text())
          sha = lambda x: hashlib.sha256(x.read_bytes()).hexdigest()

          allowed = {
              "NO_POSITIVE_ROOKIE_SCOPE_CONTAMINATION_DETECTED",
              "ROOKIE_SCOPE_CONTAMINATION_CONFIRMED_CLEAN_SUBSET_PASSES_FROZEN_POOLED_GATES",
              "ROOKIE_SCOPE_CONTAMINATION_CONFIRMED_CLEAN_SUBSET_FAILS_FROZEN_POOLED_GATES",
          }
          assert d["decision"] in allowed
          assert man["decision"] == d["decision"]

          for obj in (d, man):
              assert obj["historical_player_outcomes_read"] is False
              assert obj["candidate_fit_performed"] is False
              assert obj["validation_scored"] is False
              assert obj["production_change_authorized"] is False
              assert obj["authorizes_outcome_ingestion"] is False
              assert obj["frozen_rules_changed"] is False

          assert d["authorizes_source_catalog_amendment"] is False
          assert man["output_hashes"][j.name] == sha(j)
          assert man["output_hashes"][md.name] == sha(md)

          print("Decision:", d["decision"])
          print("Contaminated leagues:", d["audit_counts"]["positive_contaminated_league_n"])
          print("Evidence kinds:", d["audit_counts"]["positive_evidence_kind_counts"])
          print("Clean-subset pooled gate:", d["clean_subset_frozen_pooled_gate_recheck"]["pass"])
          for name, g in d["clean_subset_frozen_pooled_gate_recheck"]["gates"].items():
              print(name, g["value"], "threshold", g["threshold"], "PASS" if g["pass"] else "FAIL")
          print("PASS: diagnostic-only contamination audit validated.")
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
