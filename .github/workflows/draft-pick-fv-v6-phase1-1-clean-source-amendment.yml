      - name: Commit V6.1 amendment
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during run; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v6/freeze_clean_source_amendment_v6_1.py \
            research/draft-pick-fv-v6/structural_continuity_preoutcome_amendment_v6_1.json \
            research/draft-pick-fv-v6/structural_continuity_preoutcome_amendment_v6_1.md \
            research/draft-pick-fv-v6/structural_continuity_preoutcome_amendment_manifest_v6_1.json

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m "Freeze Draft Pick FV V6.1 clean source amendment"
          git push origin HEAD:main
