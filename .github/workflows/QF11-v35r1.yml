name: QF11 V35r1 - KTC V2 Seven Gate Collector Syntax Fix (Source Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: qf11-v35r1-ktc-v2-direct-collector-seven-gate-source-only
  cancel-in-progress: false
jobs:
  harden_collector:
    name: Patch isolated direct POST gate, run synthetic tests and frozen regressions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout pinned main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install frozen regression dependency
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin V33 source and all production valuation inputs, fail closed on drift
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == refs/heads/main ]] || { echo STOP_BRANCH; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_SOURCE_PIN_$1"; exit 1; }; }

        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28

        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        check research/ktc-v2-isolated/collector.gs 878b66a7ebb94e5aa1e91b3b8d68722fbf3f1c02

        check research/ktc-v2-isolated/collector.test.js fe5457ad31414ae6ec0612668b68bc0ca6a0bd4f

        check research/ktc-v2-isolated/contract.json e285365b5630d6e2459f7e08fbe9d72d6d2aad81

        check research/ktc-v2-isolated/client-bridge.js a7dd731fd013c0ce7e547eb05ae8c825e85ccd9b

        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167

        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d

        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860

        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        echo QF11_V34_V33_SOURCE_AND_PRODUCTION_PINS_GREEN

        '
    - name: Patch exactly the collector direct POST authorization boundary and synthetic tests
      run: "set -euo pipefail\npython3 - <<'PYV35'\nfrom pathlib import Path\nimport sys\np=Path('.')\nsource=p/'research/ktc-v2-isolated/collector.gs'\n\
        tests=p/'research/ktc-v2-isolated/collector.test.js'\noriginal=source.read_text()\npre=\"function qf11v2Handle_(payload,props,now)\
        \ {\"\ngate=\"\"\"/**\n * V35: ALL direct intake paths require the same seven authorizations as the\n * iframe RPC\
        \ host. Never mistake a single ENABLED switch for full approval.\n * This helper is intentionally self-contained (collector\
        \ also has doPost).\n */\nfunction qf11v2IntakeAuthorized_(props) {\n  var required=[\n    'QF11_V2_ENABLED','QF11_V2_IFRAME_TRANSPORT_VERIFIED',\n\
        \    'QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC',\n    'QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED',\n\
        \    'QF11_V2_COLLECTOR_ISOLATION_VERIFIED'\n  ];\n  return required.every(function(k){return props.getProperty(k)==='true';});\n\
        }\n\"\"\"\nassert original.count(pre)==1,'STOP_HANDLER_DRIFT'\nchanged=original.replace(pre,gate+pre)\nold=\"if(props.getProperty('QF11_V2_ENABLED')!=='true')\
        \ return 'DISABLED';\"\nassert changed.count(old)==1,'STOP_HANDLE_ENTRY_DRIFT'\nchanged=changed.replace(old,\"if(!qf11v2IntakeAuthorized_(props))\
        \ return 'DISABLED';\")\nold2=\"if(props.getProperty('QF11_V2_ENABLED')!=='true') return qf11v2Reply_('DISABLED');\"\
        \nassert changed.count(old2)==1,'STOP_POST_ENTRY_DRIFT'\nchanged=changed.replace(old2,\"if(!qf11v2IntakeAuthorized_(props))\
        \ return qf11v2Reply_('DISABLED');\")\nassert changed.count('function qf11v2IntakeAuthorized_')==1\nassert changed.count('if(!qf11v2IntakeAuthorized_(props))')==2\n\
        source.write_text(changed)\norig=tests.read_text()\nold3=\"const ready=()=>{let e=fresh();e.conf.QF11_V2_ENABLED='true';return\
        \ e};\"\nnew3=\"\"\"const REQUIRED_GATE_KEYS=[\n 'QF11_V2_ENABLED','QF11_V2_IFRAME_TRANSPORT_VERIFIED',\n 'QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC',\n\
        \ 'QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED',\n 'QF11_V2_COLLECTOR_ISOLATION_VERIFIED'\n\
        ];\nconst ready=()=>{let e=fresh();REQUIRED_GATE_KEYS.forEach(k=>e.conf[k]='true');return e};\n\"\"\"\nassert orig.count(old3)==1,'STOP_TEST_FIXTURE_DRIFT'\n\
        changed=orig.replace(old3,new3)\nneedle=\"test('happy path stored only in separate sheet and Q4 waits human',\"\n\
        addition=\"\"\"test('V35 each of seven missing approvals blocks direct doPost and handler',()=>{\n  for(const key\
        \ of REQUIRED_GATE_KEYS){\n    let e=ready();e.conf[key]='false';\n    assert.equal(e.post(e.payload()),'DISABLED',key);\n\
        \    assert.equal(e.globals.qf11v2Handle_(e.payload(),e.props,Date.now()),'DISABLED',key);\n    assert.equal(e.rows.length,1,key);\n\
        \  }\n});\ntest('V35 missing and incorrectly typed approval properties fail closed',()=>{\n  for(const value of [undefined,'FALSE','True',true,0,'yes']){\n\
        \    let e=ready();e.conf.QF11_V2_PRIVACY_DELETION_VERIFIED=value;\n    assert.equal(e.post(e.payload()),'DISABLED');\n\
        \    assert.equal(e.rows.length,1);\n  }\n});\ntest('V35 ENABLED alone must not accept even well-formed invite',()=>{\n\
        \  let e=fresh();e.conf.QF11_V2_ENABLED='true';\n  assert.equal(e.post(e.payload()),'DISABLED');\n  assert.equal(e.rows.length,1);\n\
        });\n\"\"\"\nassert changed.count(needle)==1,'STOP_TEST_INSERTION_POINT_DRIFT'\nchanged=changed.replace(needle,addition+needle)\n\
        tests.write_text(changed)\nprint('QF11_V35_COLLECTOR_SEVEN_APPROVAL_GATES_PATCHED_SOURCE_ONLY')\n\nPYV35\nnode --check < research/ktc-v2-isolated/collector.gs\ngit diff --check\n"
    - name: Exercise V35 seven gate coverage plus V31 V32 V33 tests
      run: 'set -euo pipefail

        node research/ktc-v2-isolated/collector.test.js

        node research/ktc-v2-isolated/client-bridge.test.js

        node research/ktc-v2-isolated/frame-host.test.js

        python3 - <<''PY''

        from pathlib import Path

        s=Path(''research/ktc-v2-isolated/collector.gs'').read_text()

        assert s.count(''function qf11v2IntakeAuthorized_'')==1

        assert s.count(''if(!qf11v2IntakeAuthorized_(props))'')==2

        assert all(k in s for k in [''QF11_V2_ENABLED'',''QF11_V2_IFRAME_TRANSPORT_VERIFIED'',''QF11_V2_OWNER_PILOT_AUTHORIZED'',''QF11_V2_INDEPENDENT_WORDING_QC'',''QF11_V2_PRIVACY_DELETION_VERIFIED'',''QF11_V2_MODERATOR_SOP_VERIFIED'',''QF11_V2_COLLECTOR_ISOLATION_VERIFIED''])

        print(''QF11_V35_DIRECT_POST_AND_INTERNAL_HANDLE_SEVEN_GATE_GUARD_GREEN'')

        PY

        echo QF11_V35_75_SYNTHETIC_TESTS_GREEN_NO_GOOGLE_CONNECTION

        '
    - name: Run frozen model and website regression suites
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V35_FROZEN_PRODUCTION_REGRESSIONS_GREEN

        '
    - name: Verify exactly two research sources changed, commit after all tests pass
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo STOP_BRANCH; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_SHA; exit 1; }

        expected=$''research/ktc-v2-isolated/collector.gs\nresearch/ktc-v2-isolated/collector.test.js''

        actual="$(git diff --name-only)"

        [[ "$actual" == "$expected" ]] || { echo STOP_UNEXPECTED_CHANGED_PATHS; printf ''%s\n'' "$actual"; exit 1; }

        [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo STOP_UNTRACKED_FILES; exit 1; }

        git diff --check

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add research/ktc-v2-isolated/collector.gs research/ktc-v2-isolated/collector.test.js

        git diff --cached --check

        git commit -m ''QF11 V35: require all seven approvals on direct KTC V2 POST''

        git push origin HEAD:main

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_AFTER_COMMIT; exit 1; }

        echo QF11_V35_SOURCE_ONLY_SEVEN_GATE_PATCH_COMMITTED

        '
    - name: Emit explicit state and pending real browser blockers
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v35-artifact\npython3 - <<'PY'\nimport json,subprocess\nfrom pathlib import\
        \ Path\ndef sh(*a): return subprocess.check_output(list(a),text=True).strip()\nresult={\n  'schema':'QF11_V35_SOURCE_ONLY_SEVEN_GATE_HARDENING',\n\
        \  'github_commit':sh('git','rev-parse','HEAD'),\n  'source_only':True,'production_valuation_modified':False,\n  'collector_direct_post_requires_all_seven_gates':True,\n\
        \  'collector_internal_handler_requires_all_seven_gates':True,\n  'synthetic_collector_tests':27,\n  'synthetic_bridge_tests':29,\n\
        \  'synthetic_html_host_tests':19,\n  'synthetic_tests_total':75,\n  'real_participants':0,'real_votes_recorded_by_workflow':0,\n\
        \  'google_apps_script_project_modified_by_workflow':False,\n  'deployed_google_code_gs_updated':False,\n  'google_rpc_browser_acceptance_verified':False,\n\
        \  'human_pilot_authorized':False,\n  'next_steps':['When code review approves, synchronize source fix to EXISTING\
        \ disabled Apps Script Code.gs (no new project)',\n    'Review iframe origin/referrer/clickjacking in actual browser','Verify\
        \ deletion trigger and independent privacy/wording QC','Explicit owner approval before any real participation']\n\
        }\nPath('/tmp/qf11-v35-artifact/status.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\\n')\nprint('QF11_V35_SOURCE_ONLY_COMPLETE__LIVE_GOOGLE_STILL_DISABLED')\n\
        PY\n"
    - name: Upload security gate closeout
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v35r1-seven-gate-source-only-status
        path: /tmp/qf11-v35-artifact/status.json
        retention-days: 7
        if-no-files-found: error
