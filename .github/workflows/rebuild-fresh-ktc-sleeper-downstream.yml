name: Rebuild Fresh KTC and Sleeper Downstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild Team Utility lineup projections
        run: |
          python3 scripts/projections/build_team_utility_lineup_projections.py --selftest
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/projections/build_team_utility_lineup_projections.py --check

      - name: Rebuild Market Value
        run: |
          python3 scripts/market/build_market_value.py --selftest
          python3 scripts/market/build_market_value.py --write

      - name: Commit downstream rebuild and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/artifacts/generated/team_utility_lineup_projections.json \
            scripts/artifacts/reports/team_utility_lineup_projection_report.md \
            scripts/artifacts/generated/market_values.json \
            scripts/artifacts/reports/market_value_report.md

          git rm -f --ignore-unmatch .github/workflows/rebuild-fresh-ktc-sleeper-downstream.yml

          if git diff --cached --quiet; then
            echo "No downstream changes to commit."
            exit 0
          fi

          git commit -m "Rebuild downstream values from fresh KTC and Sleeper data"
          git push origin HEAD:main
