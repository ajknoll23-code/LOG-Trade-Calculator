name: Package Adjustment Audit Step 4 Exact Live OOS

# PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1
#
# Thin permanent dispatcher workflow.
# Formula/revision-specific monitoring logic lives under scripts/validation/
# so future Package Adjustment releases do not require workflow-file writes.

on:
  workflow_dispatch:
  schedule:
    # Runs after the existing 16:30 UTC prospective trade-evidence capture.
    - cron: '0 17 * * *'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve exact-live Package Adjustment revision
        run: python3 scripts/validation/package_adjustment_exact_live_oos.py --resolve-only

      - name: Run revision-aware exact-live OOS monitor
        run: python3 scripts/validation/package_adjustment_exact_live_oos.py

      - name: Guard monitor output scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json",
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.md",
          }

          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          )

          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise RuntimeError(
                  f"Exact-live OOS dispatcher changed unexpected files: {unexpected}"
              )

          print("Exact-live OOS output scope verified.")
          print("Changed monitored outputs:", sorted(changed))
          PY

      - name: Validate monitoring safety contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(
              Path("research/package-adjustment-production-candidate-v1/live_deployment.json")
              .read_text(encoding="utf-8")
          )
          result = json.loads(
              Path(
                  "research/package-adjustment-production-candidate-v1/prospective/"
                  "exact_live_oos_validation.json"
              ).read_text(encoding="utf-8")
          )

          assert live["status"] == "controlled_live"
          assert live["production_formula_enabled"] is True

          revision = live["production_revision"]
          assert revision in {
              "v1.5-audit-step6-scope-ui-idp",
              "v1.6-v5-size2-composition-overlay",
          }, f"Unexpected controlled-live revision: {revision}"

          assert result["status"] == "controlled_live_exact_formula_prospective_oos_monitoring"
          assert result["production_formula_enabled"] is True
          assert result["automatic_production_change_allowed"] is False
          assert result["consumer_changed"] is False
          assert result["fundamental_value_consumer_changed"] is False
          assert result["market_value_consumer_changed"] is False
          assert result["draft_pick_value_consumer_changed"] is False
          assert result["team_utility_consumer_changed"] is False
          assert result["trade_verdict_consumer_changed"] is False

          release = result["release"]
          assert release["production_revision_at_release"] == revision, (
              f"OOS release revision mismatch: "
              f"{release['production_revision_at_release']} != {revision}"
          )

          print(f"Exact-live OOS safety contract PASS for {revision}.")
          PY

      - name: Commit monitoring outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json             research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.md

          if git diff --cached --quiet; then
            echo "No exact-live OOS monitoring changes to commit."
            exit 0
          fi

          git commit -m "Update exact-live Package Adjustment OOS monitoring"
          git pull --rebase origin main
          git push origin HEAD:main
