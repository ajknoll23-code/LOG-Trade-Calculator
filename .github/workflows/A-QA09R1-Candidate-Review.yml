name: A-QA09 - Fallback Role Source Intervention Preview (Read Only)
run-name: A-QA09 source-backed role intervention preview READ ONLY

'on':
  workflow_dispatch:
    inputs:
      qa08_run_id:
        description: Successful A-QA08 DOB parity and role evidence run ID
        type: string
        required: true
        default: '41072676062'

permissions:
  contents: read
  actions: read

concurrency:
  group: a-qa09-intervention-preview-read-only
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA08_RUN_ID: ${{ inputs.qa08_run_id }}
      QA09_IN: /tmp/a-qa09-input
      QA09_OUT: /tmp/a-qa09-output
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without write access
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact green QA08 run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$QA08_RUN_ID" =~ ^[0-9]{7,15}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA08_RUN_ID" > "$RUNNER_TEMP/qa08_source_run.json"
          python3 - <<'PY_QA09_SOURCE'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'qa08_source_run.json').read_text())
          expected={'status':'completed','conclusion':'success','event':'workflow_dispatch',
            'path':'.github/workflows/A-QA08R1-Role-Audit.yml',
            'display_title':'A-QA08 RB DOB parity and source-role audit','head_branch':'main'}
          for k,v in expected.items():
              assert r.get(k)==v, f'Unexpected A-QA08 source run {k}: {r.get(k)}'
          assert r.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY']
          print('Verified read-only source QA08 run',r['id'])
          PY_QA09_SOURCE
      - name: Download exact QA08 evidence
        uses: actions/download-artifact@v4
        with:
          name: A-QA08-DOB-Parity-Role-Evidence
          run-id: ${{ inputs.qa08_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/a-qa09-input
      - name: Pin source commit to QA08 original historical snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_QA09_PIN'
          import json,os,pathlib,re
          m=json.loads((pathlib.Path(os.environ['QA09_IN'])/'QA08_Manifest.json').read_text())
          assert m.get('status')=='QA08_DOB_PARITY_AND_DEPTH_SOURCE_COMPLETE_READ_ONLY'
          assert m.get('qa07_run_id')=='41058518538'
          sha=m.get('source_git_sha','')
          assert re.fullmatch('[a-f0-9]{40}',sha)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'qa09_sha').write_text(sha)
          print('Pinned source SHA',sha)
          PY_QA09_PIN
          git fetch --depth=1 origin "$(cat "$RUNNER_TEMP/qa09_sha")"
          git checkout --detach "$(cat "$RUNNER_TEMP/qa09_sha")"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/qa09_sha")"
      - name: Produce source-provenance review queue and guarded intervention design
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa09_engine.py" <<'PY_QA09_ENGINE'
          #!/usr/bin/env python3
          """QA09 — source-anchored review prioritization, not independent dynasty pricing."""
          import csv, collections, datetime, hashlib, json, os, pathlib, re

          SOURCE=pathlib.Path(os.environ.get('QA09_IN','/mnt/data/qa09work/qa08'))
          OUT=pathlib.Path(os.environ.get('QA09_OUT','/mnt/data/qa09work/output'))
          OUT.mkdir(parents=True,exist_ok=True)
          def stop(msg): raise RuntimeError('A-QA09 INTEGRITY STOP: '+msg)
          def load_json(p):
           if not p.is_file(): stop('Missing '+str(p))
           return json.loads(p.read_text(encoding='utf8'))
          manifest=load_json(SOURCE/'QA08_Manifest.json')
          expected={
           'status':'QA08_DOB_PARITY_AND_DEPTH_SOURCE_COMPLETE_READ_ONLY',
           'qa07_run_id':'41058518538','cohort':72,
           'original_qa07r2_parity_holds':5,'rb_holds_reconciled':5,
           'remaining_parity_holds':0,'verified_role_sensitive_on_passing_baseline':37,
           'recommended_new_fv_count':0,'fv_changes':0,'fv_plus_changes':0,
           'mv_changes':0,'repository_mutations':0,
           'depth_flags':{'NO_DIRECT_DEPTH_SIGNAL_CONFLICT':49,'FANTASY_BENCH_NFL_DEPTH_1':17,'FANTASY_STARTER_NOT_NFL_DEPTH_1':6}
          }
          for k,val in expected.items():
           if manifest.get(k)!=val: stop(f'Unexpected QA08 source {k}: {manifest.get(k)}')
          sha=manifest.get('source_git_sha')
          if not isinstance(sha,str) or not re.fullmatch('[a-f0-9]{40}',sha): stop('Source commit missing')
          with (SOURCE/'QA08_All72_DOB_And_Depth.csv').open(encoding='utf8',newline='') as f: rows=list(csv.DictReader(f))
          if len(rows)!=72 or len({r['sleeper_id'] for r in rows})!=72: stop('Wrong stable Sleeper ID cohort')
          required={'sleeper_id','player','position','age','assigned_role','fantasy_slot',
           'sleeper_birth_date','sleeper_depth_chart_order','sleeper_team','sleeper_years_exp',
           'published_fv','original_qa07_replay_fv','dob_augmented_replay_fv','corrected_parity',
           'role_sensitive_after_dob','value_if_Starter_HYPOTHETICAL','value_if_Rotational_HYPOTHETICAL',
           'value_if_Depth_HYPOTHETICAL','value_if_Speculative_HYPOTHETICAL',
           'source_depth_disagreement','current_fv_changed','replacement_fv'}
          if not required.issubset(rows[0]): stop('Source schema missing required fields')
          roster_path=pathlib.Path('data/league_rosters.json')
          index_path=pathlib.Path('index.html')
          if not roster_path.is_file() or not index_path.is_file(): stop('Required pinned repo inputs missing')
          source=index_path.read_text(encoding='utf8')
          for literal in ["role: existing ? existing.role : slotDefaults[slot]", "const rm = productionMultiplier(name || '', role);", "return roleEstimate;", "function mergeLeagueRosters(data){"]:
           if literal not in source: stop('Live role-price source anchor changed: '+literal)
          # Verify original Sleeper ID lineage at pinned revision, not current main.
          rosters=load_json(roster_path)
          sid_map={}
          for team in rosters.get('rosters',[]):
           for slot in ('starters','bench','taxi','reserve_ir'):
            for person in team.get(slot,[]):
             sid=str(person.get('player_id') or '')
             if not sid or sid=='0': continue
             if sid in sid_map: stop('Duplicate sleeper ID '+sid)
             sid_map[sid]=(slot,person)

          cases=[]
          counts=collections.Counter()
          for r in rows:
           sid=r['sleeper_id']
           if sid not in sid_map: stop('Unmatched Sleeper ID '+sid)
           slot,p=sid_map[sid]
           if r['fantasy_slot']!=slot: stop('Fantasy slot drift '+sid)
           if r['sleeper_team']!=(p.get('team') or ''): stop('Team mismatch '+sid)
           if r['corrected_parity']!='PARITY_PASS': stop('Missing baseline parity '+sid)
           if r['current_fv_changed']!='NO' or r['replacement_fv']!='': stop('Unexpected production modification '+sid)
           if int(r['dob_augmented_replay_fv'])!=int(r['published_fv']): stop('Exact baseline mismatch '+sid)
           if r['role_sensitive_after_dob'] not in ('True','False'):stop('Invalid sensitivity '+sid)
           sensitive=r['role_sensitive_after_dob']=='True'
           vals={role:int(r[f'value_if_{role}_HYPOTHETICAL']) for role in ('Starter','Rotational','Depth','Speculative')}
           if any(v<0 or v>20000 for v in vals.values()):stop('Out-of-bounds scenario '+sid)
           if (max(vals.values())>min(vals.values()))!=sensitive:stop('Role sensitivity disagreement '+sid)
           depth=r['source_depth_disagreement']
           if depth not in expected['depth_flags']:stop('Unexpected depth classification '+sid)
           if depth=='FANTASY_STARTER_NOT_NFL_DEPTH_1' and r['fantasy_slot']!='starters': stop('Bad starter conflict '+sid)
           if depth=='FANTASY_BENCH_NFL_DEPTH_1' and r['fantasy_slot']!='bench': stop('Bad bench conflict '+sid)
           if r['assigned_role'] not in vals: stop('Unsupported role '+sid)
           if vals[r['assigned_role']]!=int(r['published_fv']):stop('Counterfactual baseline mismatch '+sid)
           severity='NONE'
           if sensitive and depth=='FANTASY_STARTER_NOT_NFL_DEPTH_1':
            severity='HIGHEST'; action='ROLE_PROVENANCE_REVIEW_STARTER_CONFLICT'
           elif sensitive and depth=='FANTASY_BENCH_NFL_DEPTH_1':
            severity='HIGH'; action='ROLE_PROVENANCE_REVIEW_BENCH_CONFLICT'
           elif sensitive:
            severity='MEDIUM'; action='ROLE_SOURCE_REQUIRED_BEFORE_FV_INTERVENTION'
           else:
            severity='LOW'; action='NO_SLOT_ROLE_PRICE_SENSITIVITY_MONITOR'
           # No explicit price is inferred from chart order or slot. Depth signal is only a prioritizer.
           if r['position']=='K': action='KICKER_SCORING_AND_ROLE_EVIDENCE_HOLD' if sensitive else action
           age=float(r['age'])
           if age<=24 and sensitive: protection='YOUNG_UPSIDE_CONTEXT_REQUIRED'
           elif sensitive:protection='MULTI_YEAR_NFL_ROLE_CONTEXT_REQUIRED'
           else:protection='CURRENT_FV_UNAFFECTED_BY_ROLE_SCENARIOS'
           case={
            'priority':severity,'sleeper_id':sid,'player':r['player'],'position':r['position'],
            'age':r['age'],'fantasy_slot':slot,'fallback_role_from_slot':r['assigned_role'],
            'nfl_depth_order_from_sleeper':r['sleeper_depth_chart_order'],
            'depth_vs_fantasy_slot':depth,'sleeper_years_experience':r['sleeper_years_exp'],
            'published_fv_UNCHANGED':r['published_fv'],
            'role_price_sensitive':str(sensitive).upper(),
            'role_only_minimum_HYPOTHETICAL_NOT_RECOMMENDED':min(vals.values()),
            'role_only_maximum_HYPOTHETICAL_NOT_RECOMMENDED':max(vals.values()),
            'role_only_price_spread_NOT_RECOMMENDED':max(vals.values())-min(vals.values()),
            'action':action,'evidence_needed':protection,
            'new_nfl_role':'','proposed_new_fv':'','fv_changes':'NONE',
           }
           counts[(severity,depth,sensitive)]+=1
           cases.append(case)

          n_sens=sum(x['role_price_sensitive']=='TRUE' for x in cases)
          if n_sens!=37:stop('Role sensitivity count changed')
          if collections.Counter(x['depth_vs_fantasy_slot'] for x in cases)!=expected['depth_flags']:stop('Depth flag drift')
          priority_rank={'HIGHEST':0,'HIGH':1,'MEDIUM':2,'LOW':3,'NONE':4}
          cases.sort(key=lambda x:(priority_rank[x['priority']],-x['role_only_price_spread_NOT_RECOMMENDED'],x['player']))
          with (OUT/'QA09_Evidence_Priority_Queue.csv').open('w',encoding='utf8',newline='') as f:
           w=csv.DictWriter(f,fieldnames=list(cases[0]));w.writeheader();w.writerows(cases)
          sc=collections.Counter(x['priority'] for x in cases)
          report=['# A-QA09 — Fallback Role Source Intervention Preview (READ ONLY)','',
          '**Status: evidence triage complete. Zero production changes. No new role or price approved.**','',
          '## Why this study matters','',
          '- QA08 proved 72/72 current values reconcile to the exact live JavaScript FV formula after DOB parity.',
          '- Exactly 37 of 72 are sensitive to changing only the current role input.',
          '- The live source confirms uncurated role assignment uses fantasy roster slot, which is a team-manager preference, not an NFL talent assessment.',
          '- Sleeper NFL `depth_chart_order` is **not** a calibrated dynasty ranking and can be inaccurate for rotational roles.',
          '', '## Actionable review order', '',
          '| Priority | Player count | Interpretation |','|---|---:|---|',
           f"| Highest | {sc['HIGHEST']} | Fantasy starter + NFL depth not first + FV role-sensitive |",
           f"| High | {sc['HIGH']} | Fantasy bench + NFL depth first + FV role-sensitive |",
           f"| Medium | {sc['MEDIUM']} | FV role-sensitive; independent role evidence still needed |",
           f"| Low | {sc['LOW']} | No direct FV role sensitivity in tested scenarios |",
          '', '## Highest priority cases — review, NOT reprice', '',
          '| Player | Position | Current FV | Sleeper depth order | Role spread* |',
          '|---|---|---:|---:|---:|']
          for x in cases:
           if x['priority']!='HIGHEST': continue
           report.append(f"| {x['player'].replace('|','/')} | {x['position']} | {int(x['published_fv_UNCHANGED']):,} | {x['nfl_depth_order_from_sleeper']} | {x['role_only_price_spread_NOT_RECOMMENDED']:,} |")
          report +=['', '*Role spread: extreme difference between hypothetical Starter, Rotational, Depth and Speculative inputs, **not a justified change**.',
          '', '## Proposed engineering correction (design only; no patch applied)', '',
          '1. **Decouple inputs:** keep `fantasy_roster_slot` for lineup optimization, not as a source for intrinsic `PLAYER_DB.role`.',
          '2. **Keep curated source role as-is** until separate evidence validates an alternative; no mass 565-player role reset.',
          '3. **Uncurated with verified production:** retain the independently computed production multiplier; mark role provenance as provisional until independent evidence is available.',
          '4. **Uncurated without independent role or production evidence:** mark FV explicitly unverified and queue for role resolution. Do not silently substitute Starter, Depth, zero, or a fixed percentage discount.',
          '5. **Protect prospects:** forward-looking draft capital, college profile, injury recovery, NFL opportunity and independent dynasty market signals must be considered before role-based changes.',
          '6. **Gate production:** prove unaffected curated FVs and full 72-player identity-parity; require a separately approved PREVIEW and later APPLY before changing any live values.',
          '', '## What QA09 does NOT establish', '',
          '- Sleeper depth chart does not by itself justify assigning a new valuation role.',
          '- These tests do not provide independent DLF, FantasyPros dynasty, or validated multi-year price anchors.',
          '- A large counterfactual FV spread is not evidence that its high or low endpoint is correct.',
          '', '## Artifacts', '',
          '- `QA09_Evidence_Priority_Queue.csv`: 72 stable IDs, grouped by source contradiction and demonstrated role-price sensitivity.',
          '- `QA09_Manifest.json`: QA08 and pinned source lineage; zero-release gate.',
          '',f'Generated: {datetime.datetime.now(datetime.timezone.utc).isoformat()}','']
          (OUT/'QA09_Report.md').write_text('\n'.join(report),encoding='utf8')
          result={
           'status':'QA09_INTERVENTION_EVIDENCE_PREVIEW_COMPLETE_READ_ONLY',
           'source_qa08_run_id':os.environ.get('QA08_RUN_ID','41072676062'),
           'source_qa08_sha':sha,
           'source_qa08_manifest_sha256':hashlib.sha256((SOURCE/'QA08_Manifest.json').read_bytes()).hexdigest(),
           'source_qa08_csv_sha256':hashlib.sha256((SOURCE/'QA08_All72_DOB_And_Depth.csv').read_bytes()).hexdigest(),
           'repo_index_sha256':hashlib.sha256(index_path.read_bytes()).hexdigest(),
           'cohort':72,'parity_pass':72,'role_price_sensitive':n_sens,
           'review_tiers':dict(sorted(sc.items())),
           'depth_conflicts':expected['depth_flags'],
           'new_nfl_roles_assigned':0,'proposed_new_fv_count':0,
           'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repository_mutations':0,
           'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          (OUT/'QA09_Manifest.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf8')
          print(json.dumps({'result':result['status'],'review_tiers':result['review_tiers'],'role_sensitive':n_sens}))
          PY_QA09_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/qa09_engine.py"
          python3 "$RUNNER_TEMP/qa09_engine.py"
      - name: Verify production repository remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo 'QA09 rejected repository mutation'; exit 1;
          }
      - name: Upload QA09 engineering preview evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-QA09-Fallback-Role-Intervention-Preview
          path: /tmp/a-qa09-output/
          retention-days: 30
          if-no-files-found: error
      - name: Report source-provenance review
        if: always()
        shell: bash
        run: |
          if test -f "$QA09_OUT/QA09_Report.md"; then
            cat "$QA09_OUT/QA09_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA09 stopped before evidence completion; no production values changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
