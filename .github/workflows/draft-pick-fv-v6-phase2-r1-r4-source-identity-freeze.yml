                  "development_source_gate_pass": dev_gate,
                  "holdout_2024_source_gate_pass": hold_gate,
                  "outcome_ingestion_authorized_next_stage": outcome_authorized,
                  "holdout_2024_outcome_ingestion_authorized": False,
                  "next_stage": summary["next_stage"],
                  "input_hashes": summary["input_hashes"],
                  "output_hashes": {
                      OUT_DEV_PICKS.name: sha256(OUT_DEV_PICKS),
                      OUT_HOLDOUT_PICKS.name: sha256(OUT_HOLDOUT_PICKS),
                      OUT_CATALOG.name: sha256(OUT_CATALOG),
                      OUT_SUMMARY.name: sha256(OUT_SUMMARY),
                      OUT_MD.name: sha256(OUT_MD),
                  },
                  "canonical_summary_sha256": canonical_sha(summary),
              }
              write_json(OUT_MAN, manifest)

              print(f"DECISION={decision}")
              print(
                  f"development={len(dev_leagues)} leagues / "
                  f"{len(dev_rows)} retained occurrences"
              )
              print(
                  f"holdout_2024={len(hold_leagues)} clean leagues / "
                  f"{len(hold_rows)} retained occurrences"
              )
              print(f"OUTCOME_AUTHORIZED={outcome_authorized}")
              print("2024_OUTCOMES_REMAIN_SEALED=true")


          # ---------- Tests ----------

          def selftest() -> None:
              assert clean_name("Odell Beckham Jr.") == "odell beckham"
              assert norm_position("CB") == "DB"
              assert stable_id("0000") is None
              assert explicit_devy_marker("Devy Pick 1")
              assert cell_for(1, 1) == "r1_early"
              assert cell_for(4, 12) == "r4_late"

              # Single canonical unit, duplicate player exclusion.
              unit = {
                  "type": "LEAGUE",
                  "draftPick": [
                      {
                          "round": str(r),
                          "pick": str(p),
                          "player": (
                              "DUP"
                              if (r, p) in {(1, 1), (1, 2)}
                              else f"{r}-{p}"
                          ),
                      }
                      for r in range(1, 5)
                      for p in range(1, 13)
                  ],
              }
              can = canonical_r1_r4(unit)
              assert len(can["missing_slots"]) == 1
              assert can["duplicate_players"][0]["removed_slot"] == 2

              chosen, why, _ = choose_unit([unit])
              assert chosen is unit and why == "single_draft_unit"

              # Qualifier.
              lg = {
                  "keeperType": "dynasty",
                  "draftPlayerPool": "Rookie",
                  "franchises": {"count": "12"},
                  "starters": {
                      "position": [{"name": "QB", "limit": "1-2"}],
                  },
              }
              assert qualifier(lg) == (True, "explicit_dynasty")

              # Contamination logic with synthetic identity index.
              idx = {
                  "nv_years_by_name_pos": {
                      ("future player", "WR"): {2025},
                      ("same player", "RB"): {2024},
                  }
              }
              picks = [
                  {"overall_slot": 1, "mfl_player_id": "a"},
                  {"overall_slot": 2, "mfl_player_id": "b"},
              ]
              meta = {
                  "a": {"name": "Future Player", "position": "WR", "draft_year": 2025},
                  "b": {"name": "Same Player", "position": "RB", "draft_year": 2024},
              }
              c = classify_contamination(2024, picks, meta, idx)
              assert c["positive_contamination"] is True
              assert c["positive_evidence"][0]["kind"] == "resolved_future_nfl_class"

              # Weight and gate logic with a complete synthetic 2-league cohort.
              leagues = [
                  {"draft_year": 2024, "league_id": "1"},
                  {"draft_year": 2024, "league_id": "2"},
              ]
              rows = []
              for lid in ("1", "2"):
                  for r in range(1, 5):
                      for p in range(1, 13):
                          rows.append({
                              "draft_year": 2024,
                              "league_id": lid,
                              "cell": cell_for(r, p),
                              "identity_resolved": True,
                              "outcome_ready_sleeper_id": True,
                          })
              d = occurrence_diagnostics(
                  rows, leagues, (2024,), year_weight_target=1.0
              )
              assert d["retention_gate_pass"]
              assert d["identity_gate_pass"]
              assert d["sleeper_gate_pass"]
              assert d["weight_normalization_proved"]
              print("PASS: V6.1 Phase 2 source/identity self-test")


          def guard_only() -> None:
              state = guard_contract()
              rows = build_clean_development_sources(
                  state["contam"], state["v4"]
              )
              assert len(rows) == 378
              print("PASS: V6.1 Phase 2 live predecessor contract guard")
              print("DEVELOPMENT_COUNTS=", dict(Counter(
                  int(x["draft_year"]) for x in rows
              )))


          def check_outputs() -> None:
              s = load(OUT_SUMMARY)
              m = load(OUT_MAN)
              c = load(OUT_CATALOG)
              allowed = {
                  "PASS_V6_1_PHASE2_R1_R4_SOURCE_IDENTITY_FREEZE_"
                  "HISTORICAL_OUTCOME_HARVEST_AUTHORIZED_NEXT_STAGE",
                  "STOP_V6_1_PHASE2_SOURCE_OR_IDENTITY_GATE_NO_OUTCOME_INGESTION",
              }
              if s["decision"] not in allowed:
                  raise GateError("unexpected Phase 2 decision")
              if m["decision"] != s["decision"]:
                  raise GateError("manifest decision mismatch")
              if c["status"] != s["status"]:
                  raise GateError("catalog status mismatch")

              for obj in (s, m, c):
                  for key in (
                      "historical_player_outcomes_read",
                      "holdout_2024_outcomes_read",
                      "candidate_fit_performed",
                      "candidate_selection_performed",
                      "production_change_authorized",
                  ):
                      if obj[key] is not False:
                          raise GateError(f"output firewall violation: {key}")

              if m["holdout_2024_outcome_ingestion_authorized"] is not False:
                  raise GateError("2024 outcome ingestion accidentally authorized")
              if s["temporal_holdout_2024_source_gate"]["outcomes_sealed"] is not True:
                  raise GateError("2024 holdout not sealed")
              if s["development_source_gate"]["clean_league_n"] != 378:
                  raise GateError("development source count mismatch")
              if s["development_source_gate"]["counts_by_year"] != {
                  str(k): v for k, v in EXPECTED_BY_YEAR.items()
              }:
                  raise GateError("development source year counts mismatch")

              for name, expected in m["output_hashes"].items():
                  path = V6 / name
                  if sha256(path) != expected:
                      raise GateError(f"output hash mismatch: {name}")
              print("PASS: V6.1 Phase 2 frozen outputs validated")


          def main() -> None:
              ap = argparse.ArgumentParser()
              ap.add_argument("--selftest", action="store_true")
              ap.add_argument("--guard", action="store_true")
              ap.add_argument("--historical-year", type=int)
              ap.add_argument("--holdout-2024", action="store_true")
              ap.add_argument("--aggregate", action="store_true")
              ap.add_argument("--out")
              ap.add_argument("--partial-dir")
              ap.add_argument("--holdout-path")
              ap.add_argument("--dp")
              ap.add_argument("--nflverse")
              ap.add_argument("--check", action="store_true")
              args = ap.parse_args()

              if args.selftest:
                  selftest()
                  return
              if args.guard:
                  guard_only()
                  return
              if args.historical_year is not None:
                  if not (args.out and args.dp and args.nflverse):
                      raise SystemExit("--out --dp --nflverse required")
                  historical_year(
                      args.historical_year,
                      Path(args.out),
                      Path(args.dp),
                      Path(args.nflverse),
                  )
                  return
              if args.holdout_2024:
                  if not (args.out and args.dp and args.nflverse):
                      raise SystemExit("--out --dp --nflverse required")
                  holdout_2024(
                      Path(args.out), Path(args.dp), Path(args.nflverse)
                  )
                  return
              if args.aggregate:
                  if not (args.partial_dir and args.holdout_path):
                      raise SystemExit("--partial-dir and --holdout-path required")
                  aggregate(Path(args.partial_dir), Path(args.holdout_path))
                  return
              if args.check:
                  check_outputs()
                  return
              raise SystemExit(
                  "choose --selftest, --guard, --historical-year, "
                  "--holdout-2024, --aggregate, or --check"
              )


          if __name__ == "__main__":
              main()
          PY
          chmod +x "${RUNNER_TEMP}/build_r1_r4_source_identity_v6_1.py"

      - name: Preflight engine against live repo contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "build_r1_r4_source_identity_v6_1.py"
          compile(p.read_text(encoding="utf-8"), str(p), "exec")
          print("PASS: generated engine compiles without writing pyc.")
          PY

          python3 "${RUNNER_TEMP}/build_r1_r4_source_identity_v6_1.py" --selftest
          python3 "${RUNNER_TEMP}/build_r1_r4_source_identity_v6_1.py" --guard

          python3 - <<'PY'
          import os
          from pathlib import Path
          t = (
              Path(os.environ["RUNNER_TEMP"])
              / "build_r1_r4_source_identity_v6_1.py"
          ).read_text()
          forbidden = [
              "api.sleeper.app/v1/stats",
              "/stats/nfl/",
              "r1_r2_development_outcomes_v5_1.jsonl",
              "r1_r2_locked_validation_outcomes_v5_1.jsonl",
              "three_year_player_equivalent_fv",
          ]
          for token in forbidden:
              assert token not in t, f"forbidden outcome path/token: {token}"
          print("PASS: Phase 2 engine contains no historical NFL outcome-read path.")
          PY

      - name: Upload frozen Phase 2 engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: v6-phase2-engine
          path: ${{ runner.temp }}/build_r1_r4_source_identity_v6_1.py
          if-no-files-found: error
          retention-days: 7

  historical:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023]

    steps:
      - name: Check out exact study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "requests==2.34.2"

      - name: Download Phase 2 engine
        uses: actions/download-artifact@v4
        with:
          name: v6-phase2-engine
          path: ${{ runner.temp }}/v6-phase2-engine

      - name: Pin pre-outcome identity metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v6-identity"

          DP_URL="https://raw.githubusercontent.com/dynastyprocess/data/692c23d639542d6e9e94ba3898ed978a0b772724/files/db_playerids.csv"
          DP_SHA="0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
          NV_URL="https://github.com/nflverse/nflverse-data/releases/download/players/players.csv"
          NV_SHA="4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"

          curl -fL --retry 5 --retry-delay 4 "$DP_URL"             -o "${RUNNER_TEMP}/v6-identity/db_playerids.csv"
          curl -fL --retry 5 --retry-delay 4 "$NV_URL"             -o "${RUNNER_TEMP}/v6-identity/nflverse_players.csv"

          test "$(sha256sum "${RUNNER_TEMP}/v6-identity/db_playerids.csv" | awk '{print $1}')" = "$DP_SHA"
          test "$(sha256sum "${RUNNER_TEMP}/v6-identity/nflverse_players.csv" | awk '{print $1}')" = "$NV_SHA"

          echo "PASS: exact pre-outcome identity assets pinned."

      - name: Rebuild clean R1-R4 historical occurrences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/historical-${{ matrix.year }}"

          python3             "${RUNNER_TEMP}/v6-phase2-engine/build_r1_r4_source_identity_v6_1.py"             --historical-year "${{ matrix.year }}"             --dp "${RUNNER_TEMP}/v6-identity/db_playerids.csv"             --nflverse "${RUNNER_TEMP}/v6-identity/nflverse_players.csv"             --out "${RUNNER_TEMP}/historical-${{ matrix.year }}/year_${{ matrix.year }}.json"

      - name: Validate historical year artifact firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          y = int(os.environ["YEAR"])
          p = Path(os.environ["RUNNER_TEMP"]) / f"historical-{y}" / f"year_{y}.json"
          d = json.loads(p.read_text())
          assert d["draft_year"] == y
          assert d["frozen_source_league_n"] == d["expected_source_league_n"]
          for key in (
              "historical_player_outcomes_read",
              "holdout_2024_outcomes_read",
              "candidate_fit_performed",
              "candidate_selection_performed",
              "production_change_authorized",
          ):
              assert d[key] is False
          print(
              f"PASS: {y} source/identity artifact frozen; "
              f"retention={d['diagnostics']['retention_gate_pass']} "
              f"identity={d['diagnostics']['identity_gate_pass']}"
          )
          PY
        env:
          YEAR: ${{ matrix.year }}

      - name: Upload historical year checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v6-phase2-historical-${{ matrix.year }}
          path: ${{ runner.temp }}/historical-${{ matrix.year }}/year_${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 7

  holdout_2024:
    needs: [prepare, historical]
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out exact study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "requests==2.34.2"

      - name: Download Phase 2 engine
        uses: actions/download-artifact@v4
        with:
          name: v6-phase2-engine
          path: ${{ runner.temp }}/v6-phase2-engine

      - name: Pin pre-outcome identity metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v6-identity"

          DP_URL="https://raw.githubusercontent.com/dynastyprocess/data/692c23d639542d6e9e94ba3898ed978a0b772724/files/db_playerids.csv"
          DP_SHA="0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
          NV_URL="https://github.com/nflverse/nflverse-data/releases/download/players/players.csv"
          NV_SHA="4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"

          curl -fL --retry 5 --retry-delay 4 "$DP_URL"             -o "${RUNNER_TEMP}/v6-identity/db_playerids.csv"
          curl -fL --retry 5 --retry-delay 4 "$NV_URL"             -o "${RUNNER_TEMP}/v6-identity/nflverse_players.csv"

          test "$(sha256sum "${RUNNER_TEMP}/v6-identity/db_playerids.csv" | awk '{print $1}')" = "$DP_SHA"
          test "$(sha256sum "${RUNNER_TEMP}/v6-identity/nflverse_players.csv" | awk '{print $1}')" = "$NV_SHA"

      - name: Discover, contamination-screen, and freeze 2024 holdout source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/holdout"

          python3             "${RUNNER_TEMP}/v6-phase2-engine/build_r1_r4_source_identity_v6_1.py"             --holdout-2024             --dp "${RUNNER_TEMP}/v6-identity/db_playerids.csv"             --nflverse "${RUNNER_TEMP}/v6-identity/nflverse_players.csv"             --out "${RUNNER_TEMP}/holdout/holdout_2024.json"

      - name: Validate 2024 holdout firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "holdout" / "holdout_2024.json"
          d = json.loads(p.read_text())
          assert d["draft_year"] == 2024
          assert d["discovery"]["all_bounded_union_candidates_probed"] is True
          assert d["discovery"]["search_errors"] == {}
          for key in (
              "historical_player_outcomes_read",
              "holdout_2024_outcomes_read",
              "candidate_fit_performed",
              "candidate_selection_performed",
              "production_change_authorized",
          ):
              assert d[key] is False
          print(
              "PASS: 2024 source cohort frozen pre-outcome; "
              f"clean={d['clean_full4_league_n']} "
              f"gate={d['source_identity_gate_pass']}"
          )
          PY

      - name: Upload 2024 holdout checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v6-phase2-holdout-2024
          path: ${{ runner.temp }}/holdout/holdout_2024.json
          if-no-files-found: error
          retention-days: 7

  aggregate_and_freeze:
    needs: [prepare, historical, holdout_2024]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "requests==2.34.2"

      - name: Download Phase 2 engine
        uses: actions/download-artifact@v4
        with:
          name: v6-phase2-engine
          path: ${{ runner.temp }}/v6-phase2-engine

      - name: Download historical checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: v6-phase2-historical-*
          path: ${{ runner.temp }}/v6-phase2-historical
          merge-multiple: true

      - name: Download 2024 holdout checkpoint
        uses: actions/download-artifact@v4
        with:
          name: v6-phase2-holdout-2024
          path: ${{ runner.temp }}/v6-phase2-holdout

      - name: Aggregate and freeze Phase 2
        shell: bash
        run: |
          set -euo pipefail

          cp             "${RUNNER_TEMP}/v6-phase2-engine/build_r1_r4_source_identity_v6_1.py"             research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py
          chmod +x research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py

          python3             research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py             --aggregate             --partial-dir "${RUNNER_TEMP}/v6-phase2-historical"             --holdout-path "${RUNNER_TEMP}/v6-phase2-holdout/holdout_2024.json"

          python3             research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py             --check

      - name: Prove exact research-only change scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' |
            sort
          )
          expected=(
            "research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py"
            "research/draft-pick-fv-v6/r1_r4_development_pick_identity_v6_1.jsonl"
            "research/draft-pick-fv-v6/r1_r4_holdout_2024_pick_identity_v6_1.jsonl"
            "research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_source_identity_manifest_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_source_identity_summary_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_source_identity_summary_v6_1.md"
          )

          diff -u             <(printf '%s\n' "${expected[@]}" | sort)             <(printf '%s\n' "${changed[@]}" | sort)

          echo "PASS: exactly seven intended V6.1 Phase 2 research files changed."

      - name: Run production and repository regression
        shell: bash
        run: |
          set -euo pipefail

          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

          restore_tu() {
            git checkout -- "$TU_JSON" "$TU_MD"
          }
          trap restore_tu EXIT

          python3             scripts/projections/build_team_utility_lineup_projections.py             --write

          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Re-prove deployed Draft Pick contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          expected = [
              "  1: {early:7500, mid:5854, late:5244},",
              "  2: {early:3906, mid:3624, late:3291},",
              "  3: {early:2692, mid:2682, late:2319},",
              "  4: {early:1972, mid:1831, late:1689},",
              "  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data",
              "  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data",
              "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for line in expected:
              assert line in text, f"deployed pick contract drift: {line}"
          print("PASS: deployed PICK_BASE/YEAR_DISCOUNT unchanged.")
          PY

      - name: Commit frozen V6.1 Phase 2 artifacts
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during Phase 2; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py             research/draft-pick-fv-v6/r1_r4_development_pick_identity_v6_1.jsonl             research/draft-pick-fv-v6/r1_r4_holdout_2024_pick_identity_v6_1.jsonl             research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json             research/draft-pick-fv-v6/r1_r4_source_identity_manifest_v6_1.json             research/draft-pick-fv-v6/r1_r4_source_identity_summary_v6_1.json             research/draft-pick-fv-v6/r1_r4_source_identity_summary_v6_1.md

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m "Freeze Draft Pick FV V6.1 Phase 2 source identity"
          git push origin HEAD:main

          echo "PASS: V6.1 Phase 2 source/identity freeze committed."
