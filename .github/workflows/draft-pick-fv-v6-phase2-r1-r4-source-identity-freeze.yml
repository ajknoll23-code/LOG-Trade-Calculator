          # ---------- 2024 holdout ----------

          def discover_2024(session: requests.Session) -> tuple[list[str], dict[str, Any]]:
              term_counts = {}
              all_ids = set()
              for term in SEARCH_TERMS:
                  data = get_json(
                      session,
                      api_url(HOLDOUT_YEAR, "leagueSearch", SEARCH=term),
                  )
                  rows = search_ids(data)
                  rows = sorted(
                      set(rows),
                      key=lambda x: stable_hash(f"{HOLDOUT_YEAR}|{term}|{x}"),
                  )[:MAX_PER_TERM]
                  term_counts[term] = len(rows)
                  all_ids.update(rows)
              ordered = sorted(
                  all_ids,
                  key=lambda x: stable_hash(f"{HOLDOUT_YEAR}|candidate|{x}"),
              )
              return ordered, {
                  "search_terms": SEARCH_TERMS,
                  "max_per_term": MAX_PER_TERM,
                  "term_counts_after_cap": term_counts,
                  "bounded_unique_union_n": len(ordered),
                  "all_bounded_union_candidates_probed": True,
                  "search_errors": {},
              }


          def classify_contamination(
              year: int,
              pick_rows: list[dict[str, Any]],
              metadata: dict[str, dict[str, Any]],
              idx: dict[str, Any],
          ) -> dict[str, Any]:
              evidence = []
              unknown = []
              same_year = 0
              status = Counter()

              years_by_name_pos = idx["nv_years_by_name_pos"]
              for p in pick_rows:
                  pid = p["mfl_player_id"]
                  meta = metadata.get(pid)
                  if meta is None:
                      unknown.append({
                          "overall_slot": p["overall_slot"],
                          "mfl_player_id": pid,
                          "kind": "league_scoped_player_metadata_missing",
                      })
                      status["league_scoped_player_metadata_missing"] += 1
                      continue
                  name = meta.get("name")
                  pos = norm_position(meta.get("position"))
                  nm = clean_name(name)

                  if explicit_devy_marker(name):
                      evidence.append({
                          "overall_slot": p["overall_slot"],
                          "mfl_player_id": pid,
                          "kind": "explicit_devy_custom_player",
                          "name": name,
                          "position": meta.get("position"),
                      })
                      status["explicit_devy_custom_player"] += 1
                      continue

                  years = sorted(years_by_name_pos.get((nm, pos), set()))
                  if len(years) == 1:
                      dy = years[0]
                      if dy < year:
                          evidence.append({
                              "overall_slot": p["overall_slot"],
                              "mfl_player_id": pid,
                              "kind": "resolved_past_nfl_class",
                              "name": name,
                              "position": meta.get("position"),
                              "identity_draft_class": dy,
                          })
                          status["resolved_past_nfl_class"] += 1
                      elif dy > year:
                          evidence.append({
                              "overall_slot": p["overall_slot"],
                              "mfl_player_id": pid,
                              "kind": "resolved_future_nfl_class",
                              "name": name,
                              "position": meta.get("position"),
                              "identity_draft_class": dy,
                          })
                          status["resolved_future_nfl_class"] += 1
                      else:
                          same_year += 1
                          status["resolved_same_year"] += 1
                  elif len(years) > 1:
                      unknown.append({
                          "overall_slot": p["overall_slot"],
                          "mfl_player_id": pid,
                          "kind": "ambiguous_name_position_multiple_draft_classes",
                          "name": name,
                          "position": meta.get("position"),
                          "candidate_draft_years": years,
                      })
                      status["ambiguous_name_position_multiple_draft_classes"] += 1
                  else:
                      unknown.append({
                          "overall_slot": p["overall_slot"],
                          "mfl_player_id": pid,
                          "kind": "no_external_same_identity_draft_class",
                          "name": name,
                          "position": meta.get("position"),
                          "mfl_metadata_draft_year": meta.get("draft_year"),
                      })
                      status["no_external_same_identity_draft_class"] += 1

              return {
                  "positive_contamination": bool(evidence),
                  "positive_evidence_n": len(evidence),
                  "positive_evidence": evidence,
                  "diagnostic_unknown_n": len(unknown),
                  "diagnostic_unknown": unknown,
                  "resolved_same_year_n": same_year,
                  "identity_status_counts": dict(status),
              }


          def holdout_2024(
              out_path: Path,
              dp_path: Path,
              nv_path: Path,
          ) -> None:
              guard_contract()
              idx = load_identity_indexes(dp_path, nv_path, FP_XWALK)
              session = requests.Session()
              session.headers.update({
                  "User-Agent":
                      "LOG-Trade-Calculator-Draft-Pick-FV-V6-Phase2-2024Holdout/1.0"
              })

              ids, discovery = discover_2024(session)
              clean_leagues = []
              rejected = []
              occurrences = []
              counts = Counter()

              for i, lid in enumerate(ids, 1):
                  data = get_json(session, api_url(HOLDOUT_YEAR, "league", L=lid))
                  lg = league_obj(data)
                  if lg is None:
                      counts["league_missing"] += 1
                      continue
                  ok, qkind = qualifier(lg)
                  if not ok:
                      counts[f"qualifier_reject:{qkind}"] += 1
                      continue
                  if obvious_mock_name(lg.get("name")):
                      counts["obvious_mock_reject"] += 1
                      continue

                  draft = get_json(
                      session, api_url(HOLDOUT_YEAR, "draftResults", L=lid)
                  )
                  units = extract_units(draft)
                  all_rows = all_unit_pick_rows(units)
                  if not all_rows["full4"]:
                      counts["incomplete_r1_r4_reject"] += 1
                      continue

                  ids_for_meta = [
                      r["mfl_player_id"] for r in all_rows["rows"]
                  ]
                  meta = league_scoped_players(
                      session, HOLDOUT_YEAR, lid, ids_for_meta
                  )
                  contam = classify_contamination(
                      HOLDOUT_YEAR, all_rows["rows"], meta, idx
                  )
                  if contam["positive_contamination"]:
                      counts["positive_contamination_reject"] += 1
                      rejected.append({
                          "league_id": lid,
                          "league_name": lg.get("name"),
                          "qualifier_kind": qkind,
                          "positive_evidence_n": contam["positive_evidence_n"],
                          "positive_evidence": contam["positive_evidence"],
                      })
                      continue

                  chosen, reason, unit_summary = choose_unit(units)
                  can = canonical_r1_r4(chosen)
                  clean = {
                      "draft_year": HOLDOUT_YEAR,
                      "league_id": lid,
                      "league_name": lg.get("name"),
                      "idp": is_idp(lg),
                      "source_origin": "v6_2024_bounded_discovery_clean",
                      "qualifier_kind": qkind,
                      "keeper_state": keeper_state(lg),
                      "qb_limit": qb_limit(lg),
                      "draft_player_pool": lg.get("draftPlayerPool"),
                      "positive_contamination": False,
                      "diagnostic_unknown_n": contam["diagnostic_unknown_n"],
                      "diagnostic_unknown": contam["diagnostic_unknown"],
                      "draft_unit_n": len(units),
                      "unit_selection_reason": reason,
                      "unit_summary": unit_summary,
                      "missing_slots_1_48": can["missing_slots"],
                      "duplicate_slots_1_48": can["duplicate_slots"],
                      "duplicate_players_1_48": can["duplicate_players"],
                      "invalid_grid_1_48": can["invalid_grid"],
                  }
                  clean_leagues.append(clean)

                  for slot in range(1, 49):
                      rec = can["slots"].get(slot)
                      if not rec or not rec.get("mfl_player_id"):
                          continue
                      ident = resolve_identity(
                          HOLDOUT_YEAR,
                          rec["mfl_player_id"],
                          meta.get(rec["mfl_player_id"]),
                          idx,
                      )
                      row = {
                          "draft_year": HOLDOUT_YEAR,
                          "league_id": lid,
                          "league_name": lg.get("name"),
                          "league_idp": is_idp(lg),
                          "source_origin": "v6_2024_bounded_discovery_clean",
                          "overall_slot": slot,
                          "round": int(rec["round"]),
                          "within_round_pick": int(rec["within_round_pick"]),
                          "tier": tier_for_within(int(rec["within_round_pick"])),
                          "cell": cell_for(
                              int(rec["round"]), int(rec["within_round_pick"])
                          ),
                          "mfl_player_id": rec["mfl_player_id"],
                          "franchise_id": rec["franchise_id"],
                          "split": "temporal_holdout_2024",
                          "source_occurrence_valid_v6_1": True,
                      }
                      row.update(ident)
                      row["stable_player_key"] = stable_player_key(ident)
                      occurrences.append(row)

                  counts["clean_full4"] += 1
                  if i % 50 == 0 or i == len(ids):
                      print(
                          f"2024: {i}/{len(ids)} candidates; "
                          f"clean_full4={counts['clean_full4']}",
                          flush=True,
                      )

              clean_leagues.sort(key=lambda x: int(x["league_id"]))
              occurrences.sort(
                  key=lambda x: (int(x["league_id"]), int(x["overall_slot"]))
              )
              diag = occurrence_diagnostics(
                  occurrences,
                  clean_leagues,
                  (HOLDOUT_YEAR,),
                  year_weight_target=1.0,
              )
              source_n_gate = len(clean_leagues) >= MIN_2024_LEAGUES
              source_gate = (
                  source_n_gate
                  and diag["retention_gate_pass"]
                  and diag["identity_gate_pass"]
                  and diag["sleeper_gate_pass"]
              )

              payload = {
                  "schema_version": 1,
                  "stage": "phase2_holdout_2024_source_identity",
                  "study_id": STUDY_ID,
                  "draft_year": HOLDOUT_YEAR,
                  "generated_at_utc": now(),
                  "research_only": True,
                  "historical_player_outcomes_read": False,
                  "holdout_2024_outcomes_read": False,
                  "market_or_ktc_values_read": False,
                  "package_vote_data_read": False,
                  "candidate_fit_performed": False,
                  "candidate_selection_performed": False,
                  "production_change_authorized": False,
                  "discovery": discovery,
                  "probe_counts": dict(counts),
                  "minimum_clean_full4_leagues": MIN_2024_LEAGUES,
                  "clean_full4_league_n": len(clean_leagues),
                  "source_count_gate_pass": source_n_gate,
                  "source_identity_gate_pass": source_gate,
                  "clean_leagues": clean_leagues,
                  "positive_contamination_rejections": rejected,
                  "occurrences": occurrences,
                  "diagnostics": diag,
                  "identity_sources": {
                      "dynastyprocess_sha256": sha256(dp_path),
                      "nflverse_players_sha256": sha256(nv_path),
                      "fantasypros_sleeper_crosswalk_sha256": sha256(FP_XWALK),
                  },
              }
              write_json(out_path, payload)


          # ---------- Aggregate and freeze ----------

          def aggregate(
              partial_dir: Path,
              holdout_path: Path,
          ) -> None:
              state = guard_contract()
              parts = []
              for year in YEARS:
                  p = partial_dir / f"year_{year}.json"
                  if not p.exists():
                      raise GateError(f"missing historical year artifact: {p}")
                  d = load(p)
                  if int(d["draft_year"]) != year:
                      raise GateError(f"wrong year artifact: {p}")
                  for key in (
                      "historical_player_outcomes_read",
                      "holdout_2024_outcomes_read",
                      "candidate_fit_performed",
                      "candidate_selection_performed",
                      "production_change_authorized",
                  ):
                      if d[key] is not False:
                          raise GateError(f"historical artifact firewall: {key}")
                  parts.append(d)

              hold = load(holdout_path)
              if int(hold["draft_year"]) != HOLDOUT_YEAR:
                  raise GateError("wrong 2024 holdout artifact")
              for key in (
                  "historical_player_outcomes_read",
                  "holdout_2024_outcomes_read",
                  "candidate_fit_performed",
                  "candidate_selection_performed",
                  "production_change_authorized",
              ):
                  if hold[key] is not False:
                      raise GateError(f"holdout artifact firewall: {key}")

              expected_fp_sha = sha256(FP_XWALK)
              for d in [*parts, hold]:
                  src = d["identity_sources"]
                  if src["dynastyprocess_sha256"] != DP_SHA256:
                      raise GateError("worker DynastyProcess hash drift")
                  if src["nflverse_players_sha256"] != NV_SHA256:
                      raise GateError("worker nflverse hash drift")
                  if src["fantasypros_sleeper_crosswalk_sha256"] != expected_fp_sha:
                      raise GateError("worker FantasyPros/Sleeper crosswalk hash drift")

              dev_leagues = [x for d in parts for x in d["leagues"]]
              dev_rows = [x for d in parts for x in d["occurrences"]]
              if len(dev_leagues) != EXPECTED_DEV_LEAGUES:
                  raise GateError("aggregated development league count drift")
              by_year = Counter(int(x["draft_year"]) for x in dev_leagues)
              if dict(sorted(by_year.items())) != EXPECTED_BY_YEAR:
                  raise GateError("aggregated development by-year drift")

              # Workers froze weights independently. Recompute global diagnostics and
              # weights from the aggregate to prove exact same contract.
              dev_diag = occurrence_diagnostics(
                  dev_rows, dev_leagues, YEARS, year_weight_target=1.0 / 6.0
              )
              hold_rows = list(hold["occurrences"])
              hold_leagues = list(hold["clean_leagues"])
              hold_diag = occurrence_diagnostics(
                  hold_rows, hold_leagues, (HOLDOUT_YEAR,), year_weight_target=1.0
              )

              dev_gate = (
                  len(dev_leagues) == EXPECTED_DEV_LEAGUES
                  and dev_diag["retention_gate_pass"]
                  and dev_diag["identity_gate_pass"]
                  and dev_diag["sleeper_gate_pass"]
              )
              hold_gate = (
                  len(hold_leagues) >= MIN_2024_LEAGUES
                  and hold_diag["retention_gate_pass"]
                  and hold_diag["identity_gate_pass"]
                  and hold_diag["sleeper_gate_pass"]
              )
              outcome_authorized = dev_gate and hold_gate
              decision = (
                  "PASS_V6_1_PHASE2_R1_R4_SOURCE_IDENTITY_FREEZE_"
                  "HISTORICAL_OUTCOME_HARVEST_AUTHORIZED_NEXT_STAGE"
                  if outcome_authorized
                  else
                  "STOP_V6_1_PHASE2_SOURCE_OR_IDENTITY_GATE_NO_OUTCOME_INGESTION"
              )

              dev_rows.sort(
                  key=lambda x: (
                      int(x["draft_year"]),
                      int(x["league_id"]),
                      int(x["overall_slot"]),
                  )
              )
              hold_rows.sort(
                  key=lambda x: (
                      int(x["league_id"]),
                      int(x["overall_slot"]),
                  )
              )
              write_jsonl(OUT_DEV_PICKS, dev_rows)
              write_jsonl(OUT_HOLDOUT_PICKS, hold_rows)

              catalog = {
                  "schema_version": 1,
                  "study_id": STUDY_ID,
                  "stage": "phase2_r1_r4_source_identity_freeze_v6_1",
                  "status": (
                      "FROZEN_SOURCE_IDENTITY_PASS"
                      if outcome_authorized
                      else "FROZEN_SOURCE_IDENTITY_STOP"
                  ),
