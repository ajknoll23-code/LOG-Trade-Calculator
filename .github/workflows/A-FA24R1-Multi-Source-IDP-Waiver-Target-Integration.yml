name: A-FA24R1 - Multi-Source IDP Waiver Target Integration (Preview / Apply)
# Adds source-labeled IDP research to the private Free Agent Board UI.
# Never publishes 4for4, Macri weekly, or Woellert subscription data.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first. Apply only after a green preview."
        required: true
        type: choice
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  fa24-multi-source:
    name: Source-aware waiver integration (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage immutable FA24 files in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, hashlib, zlib
          payload = {
            'assets/fa_multisource_targets_v1.js': {'sha256':'3e5e051fdbf1b349a1f294ee2bdd57fe03c1aa6a8d0531550b3f997ac44333a5','zlib_b64':''},
            'assets/fa_multisource_targets_v1.css': {'sha256':'a44236a77fdd59e5b8b7f9bc0b576d479d1ffe088cb9871873b0c5e9d22ad019','zlib_b64':''},
            '/tmp/fa24q/fixture.html': {'sha256':'b2b51620d7c6dac61a0b9cb08b09ca48f38fba89d6272c8a08f126cec7fefa0a','zlib_b64':''},
            '/tmp/fa24q/qa_fa24.py': {'sha256':'f8cc4f8d74237e8ac2b9198d3ca2090624a8f79ccbaae6456c5eff1b8b36e390','zlib_b64':''},
            '/tmp/fa24q/qa_fa24_local.py': {'sha256':'a737f384e5857be3d5bbccba46f4036519cc09aa48f3cdb4c4dbfe3f0a3e9ca1','zlib_b64':''},
            '/tmp/fa24q/qa_fa24_board.py': {'sha256':'859f663e3dcc7611a349d39835bb12698fb4d4f8c2e6f0d5f1fd1439f91de79c','zlib_b64':''},
            '/tmp/fa24q/fa_multisource_targets_v1.js': {'sha256':'3e5e051fdbf1b349a1f294ee2bdd57fe03c1aa6a8d0531550b3f997ac44333a5','zlib_b64':''},
            '/tmp/fa24q/fa_multisource_targets_v1.css': {'sha256':'a44236a77fdd59e5b8b7f9bc0b576d479d1ffe088cb9871873b0c5e9d22ad019','zlib_b64':''},
          }
          for name, item in payload.items():
              output = Path(name)
              body = zlib.decompress(base64.b64decode(item['zlib_b64']))
              assert hashlib.sha256(body).hexdigest() == item['sha256'], 'Corrupt embedded source: '+name
              if output.exists():
                  assert output.read_bytes() == body, 'Existing FA24 asset differs; do not overwrite silently: '+name
              else:
                  output.parent.mkdir(parents=True,exist_ok=True)
                  output.write_bytes(body)
          page=Path("free-agent-board.html")
          assert page.is_file(), "Missing Free Agent Board entry point"
          html=page.read_text("utf-8")
          for token in ['FA_WORKSPACE_V1_SCRIPT','FA22_4FOR4_PRIVATE_SCRIPT','FA_EXPERIENCE_V3_SCRIPT']:
              assert html.count(token)==1, "Required earlier integration missing/duplicated: "+token
          style='<!-- FA24_MULTI_SOURCE_STYLE --><link rel="stylesheet" href="assets/fa_multisource_targets_v1.css?v=1">'
          script='<!-- FA24_MULTI_SOURCE_SCRIPT --><script src="assets/fa_multisource_targets_v1.js?v=1" defer></script>'
          assert html.count("FA24_MULTI_SOURCE_STYLE")<=1 and html.count("FA24_MULTI_SOURCE_SCRIPT")<=1, "Duplicate FA24 loader"
          if "FA24_MULTI_SOURCE_STYLE" not in html:
              assert html.count("</head>")==1
              html=html.replace("</head>",style+"\n</head>",1)
          if "FA24_MULTI_SOURCE_SCRIPT" not in html:
              assert html.count("</body>")==1
              html=html.replace("</body>",script+"\n</body>",1)
          assert html.count("FA24_MULTI_SOURCE_STYLE")==1 and html.count("FA24_MULTI_SOURCE_SCRIPT")==1
          page.write_text(html,"utf-8")
          print('PASS: FA24 staged. No subscriber CSV/JSON was added to the repository.')
          PYCODE
      - name: Verify JS syntax, restricted changes and source privacy
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_multisource_targets_v1.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess, re
          js=Path("assets/fa_multisource_targets_v1.js").read_text("utf-8")
          html=Path("free-agent-board.html").read_text("utf-8")
          assert "FA24_MULTI_SOURCE_SCRIPT" in html and "FA24_MULTI_SOURCE_STYLE" in html
          for prohibited in ['XMLHttpRequest','sendBeacon','navigator.sendBeacon','eval(','new Function(']:
              assert prohibited not in js, "Disallowed operation: "+prohibited
          assert "file.text()" not in js or "fetch(file" not in js, "Unexpected private file transport"
          assert "readExistingDb" in js and "readonly" in js and "req.transaction.abort()" in js
          assert "data/free_agents.json" in js and "data/idp_weekly_2026_public.json" in js
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines())
          allowed={"free-agent-board.html","assets/fa_multisource_targets_v1.js","assets/fa_multisource_targets_v1.css"}
          assert (changed|untracked).issubset(allowed), "Forbidden file changes: "+str((changed|untracked)-allowed)
          assert not any(p.startswith(("data/","research/")) for p in changed|untracked), "Research/data modified"
          assert subprocess.run(["git","diff","--quiet","--","index.html","data/","assets/fa_start_sit_v1.js","assets/fa_4for4_waiver_v1.js","assets/idp_intel_v1.js"]).returncode==0
          print("PASS: read-only source integration, strict publication boundary")
          PYCODE
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Playwright Chromium on Ubuntu 24.04
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Test synthetic multi-source joins, week-isolation and mobile UI
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/fa24q/qa_fa24_local.py
      - name: Smoke test the actual Free Agent Board with synthetic fixtures
        shell: bash
        env:
          FA24_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python /tmp/fa24q/qa_fa24_board.py
      - name: Upload synthetic-only browser evidence (even if red)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FA24R1-Synthetic-MultiSource-UX
          path: /tmp/fa24q/qa-results/
          if-no-files-found: ignore
          retention-days: 10
      - name: Preview confirmation (no production write)
        if: ${{ inputs.mode == 'preview' }}
        run: |
          echo "PASS: FA24 preview. No source changes committed."
          git status --short
      - name: Apply validated presentation-only files
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- free-agent-board.html assets/fa_multisource_targets_v1.js assets/fa_multisource_targets_v1.css
          if git diff --cached --quiet; then
            echo "Already applied; no production changes."
          else
            git commit -m 'FA24: integrate multiple IDP waiver sources without changing FV or private data'
            git push origin HEAD:main
          fi
          echo "PASS: FA24 deployed. Private data remained browser-local."
