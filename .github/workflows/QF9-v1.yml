# QF9 / triple P2 triage (A1-F01, A6-F02, A7-F03): diagnosis-only, zero writes.
# Exact QF8 deployment pins. Report evidence, NOT owner-approved changes.
name: QF9 Phase 0 - Three Finding Source and Provenance Triage (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false

jobs:
  qf9-source-triage:
    name: Reconcile role fallback, market vote evidence and returning IDP metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact dispatched main without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source lineage and protected release boundaries
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$(git status --porcelain)" ]] || exit 1
          pin() { [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP source drift: $1"; exit 1; }; }
          pin index.html 93684a734efb0bbc47b6c29cb5b4e859adcd3d1d
          pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
          pin data/league_rosters.json 703ef1f651fc3debad9154001554264cd28086dd
          pin data/my_roster.json 4b67e08f6c304d9d1e8cda494785875768753532
          pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
          pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
          pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
          echo 'PASS: QF8 exact production + frozen sources pinned'
      - name: Run three issue-specific read-only evidence checks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qf9-triage.js <<'QF9_JS'
          "use strict";
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const market=JSON.parse(fs.readFileSync('scripts/artifacts/generated/market_values.json','utf8'));
          const league=JSON.parse(fs.readFileSync('data/league_rosters.json','utf8'));
          const personal=JSON.parse(fs.readFileSync('data/my_roster.json','utf8'));
          function once(s,needle){const a=s.indexOf(needle);assert(a>=0,'MISSING '+needle);assert.equal(s.indexOf(needle,a+needle.length),-1,'DUPLICATE '+needle);return a;}
          function between(s,begin,end){const a=once(s,begin);const b=s.indexOf(end,a+begin.length);assert(b>a,'MISSING END '+end);return s.slice(a,b);}
          assert(Array.isArray(league.rosters) && league.rosters.length===12,'unreconciled league roster count');
          // P2 / A1-F01: diagnose only. The existing age branch takes a numeric
          // productionMultiplier return, even for no-raw-evidence entries. This is
          // a source semantics check, not permission to retune rookie valuations.
          const prod=between(html,'function productionMultiplier(name, role){','function injuryMultiplier(');
          const age=between(html,'function ageMultiplier(pos, age, role, realProduction, rawProduction){','function playerValue(pos, age, role, name){');
          const pv=between(html,'function playerValue(pos, age, role, name){','/* QF2_AGE_DISPLAY_ONLY');
          assert(prod.includes('const roleEstimate = ROLE_MULT[role] ?? 1.0;'),'role fallback not present');
          assert(prod.includes('PROD_MULT.hasOwnProperty(key)'),'true production test absent');
          assert(pv.includes("const rawRm = PROD_MULT.hasOwnProperty(normKey) ? PROD_MULT[normKey] : null;"),'raw evidence lineage changed');
          assert(pv.includes('effectiveAgeMultiplier(pos, age, role, name, rm, rawRm)'),'age input changed');
          assert(age.includes("if(typeof realProduction === 'number')"),'numeric pre-floor branch changed');
          assert(age.includes('preFloor = (role === \'Elite\') ? 0.725 : 0.55;'),'unknown-data role fallback changed');
          console.log('CONFIRMED_SOURCE A1-F01: role estimate supplied as numeric realProduction path even when rawRm can be null; age preFloor no-history fallback is distinct; no FV edits');
          // P2 / A6-F02: quantify actual artifact coverage and avoid converting unknown
          // evidence to zero. The deployed tooltip was patched in QF1, but source
          // lacks enough direct-pairwise metadata to close this ticket.
          assert(market.schema_version===1 && market.players && !Array.isArray(market.players),'unexpected Market schema');
          const rows=Object.values(market.players);assert(rows.length>=450,'market coverage unexpectedly low');
          const expected=['same_position_pairwise_observations','same_position_enough_data','dominant_voter_share_pct'];
          const present=Object.fromEntries(expected.map(k=>[k,rows.filter(row=>row.evidence&&Object.prototype.hasOwnProperty.call(row.evidence,k)).length]));
          const reported=market.market_quality && market.market_quality.largest_effective_voter_share_pct;
          assert(typeof reported==='number' && reported>=0,'actual global voter share absent');
          const ui=between(html,'function marketValueHTML(name, fundamentalValue){','function packageMarketValueSummary(');
          for(const k of expected)assert(ui.includes('evidence.'+k),'deployed UI evidence semantics changed for '+k);
          assert(html.includes("'not published'"),'published/unknown distinction missing');
          console.log('PROVENANCE A6-F02: Market players='+rows.length+' direct-field coverage='+JSON.stringify(present)+'; separately published global top-voter share='+reported+'%; do not infer actual pair counts or zero');
          // P2 / A7-F03: exact stable Sleeper identity and stale canonical metadata.
          const matches=[];
          for(const team of league.rosters){for(const slot of ['starters','bench','taxi','reserve_ir']){assert(Array.isArray(team[slot]));for(const p of team[slot])if(String(p.player_id)==='2227')matches.push({team:team.team_name,rosterId:team.roster_id,slot,player:p});}}
          assert.equal(matches.length,1,'Aaron Donald SID2227 is not unique in current roster');
          const donald=matches[0];assert.equal(donald.player.name,'Aaron Donald');
          assert.equal(donald.player.team,'LAR');assert.equal(donald.player.status,'Active');
          const db=html.match(/'aaron donald':\{pos:'DL',age:(\d+),role:'([^']+)',team:'([^']+)'\}/);
          assert(db,'canonical Aaron Donald source changed; redo triage');
          const multiplier=html.match(/'aaron donald':([0-9.]+),/);
          assert(multiplier,'canonical Aaron Donald multiplier missing');
          console.log('PROVENANCE A7-F03: SID2227 source LAR/Active/'+donald.slot+'; canonical role='+db[2]+' team='+db[3]+' model_multiplier='+multiplier[1]+'; no asserted new fair price');
          assert.equal(personal.roster_id,4,'personal source roster ID drift');
          console.log('QF9_PHASE0_TRIAGE_GREEN: 3 remaining P2 findings assessed read-only; source/semantics only; scientific/model changes NOT authorized');
          QF9_JS
          node --check /tmp/qf9-triage.js
          node /tmp/qf9-triage.js
      - name: Confirm zero source changes, commits, branches or deployments
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP source mutation'; exit 1; }
          echo 'QF9 READ_ONLY GREEN — triage only, no publication or model changes'
