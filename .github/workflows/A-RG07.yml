name: A-RG07 - Audited Pearce Outcome Identity Successor
run-name: A-RG07 ${{ inputs.mode }} - frozen W06 identity preserved, James Pearce LB-to-DL successor

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW_ONLY tests without committing; APPLY writes outcome capture script only'
        required: true
        type: choice
        default: PREVIEW_ONLY
        options:
          - PREVIEW_ONLY
          - APPLY

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  repair:
    name: Exact one-player historical identity successor, no frozen data changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install outcome-capture dependencies
        run: python3 -m pip install --disable-pip-version-check 'requests>=2.32,<3'

      - name: Fingerprint immutable production and frozen history inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object scripts/validation/capture_realized_outcomes.py)" = '50d272093aa34135eeec4bd2f3ae4715bad744b6' || {
            echo '::error::Outcome capture source changed since audit. Re-audit before applying.'
            exit 1
          }
          git rev-parse HEAD > "$RUNNER_TEMP/rg07_base.txt"
          sha256sum index.html free-agent-board.html \
            research/model-history/identity/2026-w06-sleeper-registry.json \
            research/model-history/outcomes/2026.json \
            scripts/validation/repo_regression_checks.py \
            scripts/validation/snapshot_values.py \
            scripts/projections/build_team_utility_lineup_projections.py \
            > "$RUNNER_TEMP/rg07_protected.sha"
          echo 'PASS: frozen W06 registry, outcomes, valuations, and lineup validator protected.'

      - name: Stage exact James Pearce LB-to-DL capture successor in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path('scripts/validation/capture_realized_outcomes.py')
          src = target.read_text(encoding='utf-8')
          old_signature = (
              '    current_signature = json.dumps(\n'
              '        {k: player_db[k]["pos"] for k in sorted(player_db)},\n'
              '        sort_keys=True, separators=(",", ":"),\n'
              '    )\n'
              '    current_hash = hashlib.sha256(current_signature.encode()).hexdigest()\n'
              '    if current_hash != registry.get("model_key_pos_sha256"):\n'
              '        raise RuntimeError("Model position/identity signature differs from validated historical registry")\n'
          )
          new_signature = (
              '    # One audited historical position successor; frozen Week-6 records remain immutable.\n'
              '    current_positions = {k: player_db[k]["pos"] for k in sorted(player_db)}\n'
              '    current_signature = json.dumps(\n'
              '        current_positions, sort_keys=True, separators=(",", ":"),\n'
              '    )\n'
              '    current_hash = hashlib.sha256(current_signature.encode()).hexdigest()\n'
              '    approved_position_successors = {}\n'
              '    if current_hash != registry.get("model_key_pos_sha256"):\n'
              '        differences = {\n'
              '            key: (entries[key].get("model_pos"), current_positions[key])\n'
              '            for key in sorted(player_db)\n'
              '            if entries[key].get("model_pos") != current_positions[key]\n'
              '        }\n'
              '        expected = {"james pearce": ("LB", "DL")}\n'
              '        pearce = entries.get("james pearce") or {}\n'
              '        if differences != expected or not (\n'
              '            str(pearce.get("sleeper_id")) == "12585"\n'
              '            and pearce.get("pos") == "DL"\n'
              '            and "DL" in (pearce.get("fantasy_positions") or [])\n'
              '        ):\n'
              '            raise RuntimeError(\n'
              '                "Unapproved model position/identity change against frozen Week-6 registry: "\n'
              '                + json.dumps(differences, sort_keys=True)\n'
              '            )\n'
              '        historical_positions = dict(current_positions)\n'
              '        historical_positions["james pearce"] = "LB"\n'
              '        historical_signature = json.dumps(\n'
              '            historical_positions, sort_keys=True, separators=(",", ":"),\n'
              '        )\n'
              '        if hashlib.sha256(historical_signature.encode()).hexdigest() != registry.get("model_key_pos_sha256"):\n'
              '            raise RuntimeError("Frozen 565-player position signature cannot be reproduced")\n'
              '        approved_position_successors["james pearce"] = "12585"\n'
          )
          old_guard = (
              '        if not sid or frozen.get("model_pos") != player_db[key]["pos"]:\n'
              '            raise RuntimeError(f"Invalid frozen stable-ID record: {key}")\n'
          )
          new_guard = (
              '        successor = approved_position_successors.get(key)\n'
              '        if not sid or (\n'
              '            frozen.get("model_pos") != player_db[key]["pos"]\n'
              '            and sid != successor\n'
              '        ):\n'
              '            raise RuntimeError(f"Invalid frozen stable-ID record: {key}")\n'
          )
          old_method = (
              '            "match_method": (\n'
              '                "historical_stable_id_reconfirmed_by_current_projection"\n'
              '                if fresh else "historical_stable_id_player_dropped_from_projection"\n'
              '            ),\n'
          )
          new_method = (
              '            "match_method": (\n'
              '                "audited_james_pearce_lb_to_dl_stable_id_successor"\n'
              '                if successor else (\n'
              '                    "historical_stable_id_reconfirmed_by_current_projection"\n'
              '                    if fresh else "historical_stable_id_player_dropped_from_projection"\n'
              '                )\n'
              '            ),\n'
          )
          for old, new, label in (
              (old_signature, new_signature, 'signature check'),
              (old_guard, new_guard, 'stable-ID guard'),
              (old_method, new_method, 'audit match method'),
          ):
              if src.count(old) != 1:
                  raise RuntimeError(f'Expected one exact {label} anchor; found {src.count(old)}. Refusing an unsafe patch.')
              src = src.replace(old, new, 1)
          target.write_text(src, encoding='utf-8')
          print('PASS: staged exact LB-to-DL historical identity successor; registry not rewritten.')
          PY
          python3 -m py_compile scripts/validation/capture_realized_outcomes.py
          git diff --check
          test "$(git diff --name-only)" = 'scripts/validation/capture_realized_outcomes.py'

      - name: Run exact frozen registry, 565-player, and negative-case tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/capture_realized_outcomes.py --selftest
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/validation')
          import capture_realized_outcomes as c
          import snapshot_values
          cfg = snapshot_values.load_from_html(Path('index.html'))
          db = cfg['player_db']
          registry = c.load_json(c.FROZEN_OUTCOME_REGISTRY_PATH)
          assert len(db) == len(registry['entries']) == 565
          positions = {key: (registry['entries'][key]['model_pos'], db[key]['pos']) for key in db}
          actual = {key: pair for key, pair in positions.items() if pair[0] != pair[1]}
          assert actual == {'james pearce': ('LB', 'DL')}, actual
          assert registry['entries']['james pearce']['sleeper_id'] == '12585'
          assert registry['entries']['james pearce']['fantasy_positions'] == ['DL']
          identity_rows = c.load_json(c.SLEEPER_IDENTITY_PATH)
          resolved, unresolved, fresh, fallback = c.resolve_with_frozen_outcome_registry(db, identity_rows)
          assert len(resolved) == 565 and not unresolved
          assert resolved['james pearce']['sleeper_id'] == '12585'
          assert resolved['james pearce']['model_pos'] == 'DL'
          assert resolved['james pearce']['match_method'] == 'audited_james_pearce_lb_to_dl_stable_id_successor'
          assert fresh + fallback == 565
          # Negative case 1: an unrelated model position must still be rejected.
          altered_db = copy.deepcopy(db)
          altered_db['aaron donald']['pos'] = 'LB'
          try:
              c.resolve_with_frozen_outcome_registry(altered_db, identity_rows)
          except RuntimeError as exc:
              assert 'Unapproved' in str(exc)
          else:
              raise AssertionError('Unauthorized second player-position change was accepted')
          # Negative case 2: mutated historical Pearce ID must be rejected.
          original_loader = c.load_json
          def wrong_registry(path):
              result = original_loader(path)
              if Path(path) == c.FROZEN_OUTCOME_REGISTRY_PATH:
                  result = copy.deepcopy(result)
                  result['entries']['james pearce']['sleeper_id'] = 'wrong-id'
              return result
          c.load_json = wrong_registry
          try:
              c.resolve_with_frozen_outcome_registry(db, identity_rows)
          except RuntimeError as exc:
              assert 'Unapproved' in str(exc)
          else:
              raise AssertionError('Wrong frozen Sleeper ID was accepted')
          finally:
              c.load_json = original_loader
          # Offline outcome capture: no network and no on-disk outcome mutation.
          evidence = c.build_outcomes(
              state_fetcher=lambda: {'season': '2026', 'week': 1},
              week_fetcher=lambda _: {},
          )
          assert evidence['resolved_model_key_count'] == 565
          assert evidence['identity_coverage_pct'] == 100.0
          assert evidence['weeks_with_realized_data'] == []
          print(f'PASS: 565 stable IDs, only Pearce LB->DL, bad position/ID rejected; projected={fresh}, historical={fallback}')
          PY

      - name: Verify unaffected valuation and Free Agent Utility gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/validation')
          import repo_regression_checks as reg
          reg.check_snapshot_parity()
          assert reg._check_cal22_current_successor()['status'] == 'PASS'
          PY
          python3 scripts/validation/validate_free_agent_utility_v1.py
          sha256sum --check "$RUNNER_TEMP/rg07_protected.sha"
          git diff --exit-code -- index.html free-agent-board.html research/model-history/ \
            scripts/validation/repo_regression_checks.py \
            scripts/validation/snapshot_values.py \
            scripts/projections/build_team_utility_lineup_projections.py
          echo 'PASS: protected production and historical files byte-identical.'

      - name: APPLY single outcome-capture script if selected
        if: inputs.mode == 'APPLY'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/rg07_base.txt")"
          test "$(git diff --name-only)" = 'scripts/validation/capture_realized_outcomes.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validation/capture_realized_outcomes.py
          git diff --cached --name-only | grep -Fxq scripts/validation/capture_realized_outcomes.py
          git commit -m 'A-RG07: audit one LB-to-DL outcome identity successor without rewriting W06 registry'
          git push origin HEAD:main

      - name: Summarize exact scope
        if: success()
        shell: bash
        run: |
          {
            echo '## A-RG07 exact historical outcome successor'
            echo '- Player: James Pearce; historical LB, current DL; stable Sleeper ID 12585'
            echo '- Historical Week-6 registry and outcomes: BYTE-IDENTICAL'
            echo '- All 564 other historical positions: UNCHANGED'
            echo '- Unauthorized second position/ID change: REJECTED IN TEST'
            echo '- 565 model player IDs and offline capture: PASS'
            echo '- Valuations and Free Agent Utility checks: PASS'
            echo '- Team Utility 17-slot requirement: UNCHANGED; scheduled refresh may still block on missing K'
            echo '- Git operation: ${{ inputs.mode }}'
          } >> "$GITHUB_STEP_SUMMARY"
