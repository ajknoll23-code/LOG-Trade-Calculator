# Read-only. These numerical targets are NOT approved. The patch and rollback files are inspection artifacts, not applied changes.
name: CAL26 V1R80 - Two Player Reversible Source Patch Owner Approval Rehearsal (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r80-two-player-patch-shadow
  cancel-in-progress: false
jobs:
  owner-source-patch-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout exact live FV source without write token
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
        fetch-depth: 1
    - name: Use Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Use Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Fetch actual successful R79 two-target rehearsal
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R79_MAYE_NABERS_COMBINED_FV_5500_SHADOW_NO_RELEASE
        run-id: 40132692817
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r80-in/R79
    - name: Fetch frozen R78R1 518 native quote reference
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R78_NATIVE_FIVE_PLAYER_PRICING_ENGINEERING_REHEARSAL_FV_HOLD
        run-id: 40129064238
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r80-in/R78
    - name: Generate exact reversible source patch, test all 518 JS quotes and no owner approval
      shell: bash
      run: "set -euo pipefail\n[[ \"$GITHUB_REF\" == 'refs/heads/main' ]]\ntest -s index.html\ntest ! -e sf.csv\ntest -z \"$(git status --porcelain --untracked-files=all)\"\ncat > \"$RUNNER_TEMP/CAL26_R80_engine.py\"\
        \ <<'PY_R80_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 R80 \u2014 read-only source patch and rollback rehearsal. Neither target is approved.\"\"\"\nfrom __future__ import annotations\nimport argparse,csv,hashlib,json,pathlib,re,subprocess,difflib,collections\n\
        \nINDEX_SHA='5630bb681dd8710f8e45bc5363488f358ce9ebe2'\nR79_MANIFEST_SHA='d8553e69a8425b80fe17173090495a159a82b72050079ab2fad2696d9ce7ca93'\nR79_ROWS_SHA='d1d8ad614b1ebdbcbbf8c309f40816958521d0f311c32912dde59ae6b437a865'\n\
        R78_MANIFEST_SHA='847cad664645ec8d18cc04f1052d5f4a1f1c00cf7d625eeb1b16704f8a43af1c'\nR78_ROWS_SHA='1e471d4ae1c932ec588e0937b108b8b898effe6cef50cadba573996725f84355'\nR79_RUN=40132692817\nR78_RUN=40129064238\n\
        OLD={'drake maye':'0.8100576839','malik nabers':'0.8091278097'}\nNEW={'drake maye':'0.8881459703','malik nabers':'1.0601449306'}\nEXPECTED={'drake maye':(4933,5500),'malik nabers':(4083,5500)}\n\
        CONSTS=['POSITION_WEIGHT','AGE_CURVE','ROLE_MULT','PROD_MULT_DATA','NO_REAL_PRODUCTION_HISTORY','CAL22_LEGACY_MONOTONE_KEYS','RB_BIRTH_DATE_DATA','PLAYER_DB','CAL26_FV_OWNER_ANCHORS']\nFUNCS=['normalizeName','productionMultiplier','ageMultiplier','fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier','effectiveAgeMultiplier','playerValue']\n\
        SCALARS=['QB_POST_PEAK_FLOOR','LB_POST_PEAK_DECAY_POWER']\n\ndef check(c,msg):\n if not c:raise AssertionError(msg)\ndef sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()\n\
        def blob(p):\n x=pathlib.Path(p).read_bytes();return hashlib.sha1(b'blob '+str(len(x)).encode()+b'\\0'+x).hexdigest()\ndef readcsv(p):\n with open(p,newline='',encoding='utf-8') as f:return list(csv.DictReader(f))\n\
        def braces(s,op):\n d=0;i=op;state='code'\n while i<len(s):\n  c=s[i];n=s[i+1] if i+1<len(s) else ''\n  if state=='code':\n   if c in \"\\\"'`\":state=c\n   elif c=='/' and n=='/':state='line';i+=1\n\
        \   elif c=='/' and n=='*':state='block';i+=1\n   elif c=='{':d+=1\n   elif c=='}':\n    d-=1\n    if not d:return i\n  elif state=='line':\n   if c=='\\n':state='code'\n  elif state=='block':\n\
        \   if c=='*' and n=='/':state='code';i+=1\n  elif c=='\\\\':i+=1\n  elif c==state:state='code'\n  i+=1\n raise AssertionError('UNBALANCED_SOURCE')\ndef extract(s,k,n):\n if k=='object':\n  m=re.search(r'(?m)^const\
        \ '+re.escape(n)+r'\\s*=\\s*\\{',s)\n  check(m is not None,'MISSING_OBJECT_'+n)\n  e=braces(s,m.end()-1);check(s[e+1:e+2]==';','UNTERMINATED_OBJECT_'+n)\n  return s[m.start():e+2]+'\\n'\n if k=='scalar':\n\
        \  m=re.search(r'(?m)^const '+re.escape(n)+r'\\s*=\\s*[^;\\n]+;',s)\n  check(m is not None,'MISSING_SCALAR_'+n)\n  return m.group()+'\\n'\n m=re.search(r'(?m)^function '+re.escape(n)+r'\\(',s)\n\
        \ check(m is not None,'MISSING_FUNCTION_'+n)\n end=s.find('\\n}',m.end());check(end>=m.end(),'UNTERMINATED_FUNCTION_'+n)\n return s[m.start():end+2]+'\\n'\ndef bundle(s):\n parts=[extract(s,'object',n)\
        \ for n in CONSTS]+[extract(s,'scalar',n) for n in SCALARS]\n parts+=['const PROD_MULT = PROD_MULT_DATA;\\n']+[extract(s,'function',n) for n in FUNCS]\n check('return Math.round(100 * pw * am *\
        \ rm * 55);' in parts[-1],'NATIVE_FV_FORMULA_CHANGED')\n return '\\n'.join(parts)\ndef source_change(original):\n m=re.search(r'(?m)^const PROD_MULT_DATA\\s*=\\s*\\{',original)\n check(m is not\
        \ None,'NO_PROD_MULT_DATA')\n e=braces(original,m.end()-1)\n area=original[m.start():e+2]\n new=area\n for name in EXPECTED:\n  oldline=f\"'{name}':{OLD[name]},\"\n  newline=f\"'{name}':{NEW[name]},\"\
        \n  check(new.count(oldline)==1,'EXPECTED_UNIQUE_OLD_VALUE_MISSING_'+name)\n  new=new.replace(oldline,newline)\n check(new!=area,'PATCH_DID_NOT_CHANGE_SOURCE')\n revised=original[:m.start()]+new+original[e+2:]\n\
        \ check(revised!=original,'PATCH_IDENTICAL')\n rollback=revised\n for name in EXPECTED:\n  newline=f\"'{name}':{NEW[name]},\"\n  check(rollback.count(newline)==1,'ROLLBACK_NEW_MISSING_'+name)\n\
        \  rollback=rollback.replace(newline,f\"'{name}':{OLD[name]},\")\n check(rollback==original,'FULL_SOURCE_ROLLBACK_MISMATCH')\n # Enforce precisely two source lines changed, and no values in unrelated\
        \ declarations.\n ab=original.splitlines();bb=revised.splitlines()\n check(len(ab)==len(bb),'LINE_COUNT_CHANGED')\n changed=[(i+1,a,b) for i,(a,b) in enumerate(zip(ab,bb)) if a!=b]\n check(len(changed)==2\
        \ and all(any(\"'\"+n+\"':\" in c[1] and \"'\"+n+\"':\" in c[2] for n in EXPECTED) for c in changed),'UNEXPECTED_SOURCE_CHANGE')\n return revised,changed\n\nNODE=r'''const fs=require('fs'),vm=require('vm');\n\
        const q=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));\nconst x=q.bundle+'\\nconst INPUT='+JSON.stringify(q.players)+';\\n'+`\nconst ans=INPUT.map(r=>{\n const d=PLAYER_DB[r.canonical_key];\n\
        \ if(!d||d.pos!==r.position)throw Error('PLAYER_DRIFT_'+r.canonical_key);\n const v=playerValue(d.pos,d.age,d.role,r.canonical_key);\n const a=Object.prototype.hasOwnProperty.call(CAL26_FV_OWNER_ANCHORS,r.canonical_key);\n\
        \ if(a!==r.anchor)throw Error('ANCHOR_DRIFT_'+r.canonical_key);\n return {name:r.name,key:r.canonical_key,position:r.position,quote:v,anchor:a};\n});\nif(ans.length!==518||ans.filter(z=>z.anchor).length!==15)throw\
        \ Error('PLAYER_OR_ANCHOR_COUNT');\nans;\n`;\nconst result=vm.runInNewContext(x,{}, {timeout:60000});\nprocess.stdout.write(JSON.stringify(result));\n'''\n\ndef native_quotes(src,players,out,label):\n\
        \ payload=out/f'_R80_{label}_INPUT.json';js=out/f'_R80_{label}_NODE.cjs'\n payload.write_text(json.dumps({'bundle':bundle(src),'players':players}),encoding='utf-8')\n js.write_text(NODE,encoding='utf-8')\n\
        \ try:\n  run=subprocess.run(['node',str(js),str(payload)],capture_output=True,text=True,timeout=100)\n  check(run.returncode==0,'NODE_'+label+'_ERROR_'+run.stderr[-500:])\n  result=json.loads(run.stdout)\n\
        \ finally:\n  payload.unlink(missing_ok=True);js.unlink(missing_ok=True)\n check(len(result)==518,'NODE_COUNT_'+label)\n return result\n\ndef main(a):\n repo=pathlib.Path(a.repo);r79=pathlib.Path(a.r79);r78=pathlib.Path(a.r78);out=pathlib.Path(a.out)\n\
        \ out.mkdir(parents=True,exist_ok=True)\n for p,h in ((r79/'CAL26_R79_manifest.json',R79_MANIFEST_SHA),(r79/'CAL26_R79_TWO_OWNER_HYPOTHESES_NATIVE_REHEARSAL_NO_RELEASE.csv',R79_ROWS_SHA),(r78/'CAL26_R78_manifest.json',R78_MANIFEST_SHA),(r78/'CAL26_R78_518_exact_live_quote_regression_NO_FV_WRITES.csv',R78_ROWS_SHA)):\n\
        \  check(p.is_file() and sha(p)==h,'PINNED_ARTIFACT_SHA_DRIFT_'+p.name)\n mm=json.loads((r79/'CAL26_R79_manifest.json').read_text())\n check(mm['run']=='CAL26_V1R79' and mm['native_index_blob_sha']==INDEX_SHA\
        \ and mm['hypothetical_changed_players']==2 and mm['owner_price_anchors_protected']==15 and mm['rollback_all_518_exact'] and mm['production_price_changes']==0 and not mm['owner_numeric_targets_approved'],'R79_NOT_READONLY_NO_OWNER_APPROVAL')\n\
        \ mr=json.loads((r78/'CAL26_R78_manifest.json').read_text())\n check(mr['run']=='CAL26_V1R78' and mr['production_changes']==0 and mr['players_replayed']==518,'R78_SOURCE_NOT_CERTIFIED')\n record=readcsv(r79/'CAL26_R79_TWO_OWNER_HYPOTHESES_NATIVE_REHEARSAL_NO_RELEASE.csv')\n\
        \ check(len(record)==2 and {r['name'] for r in record}==set(EXPECTED),'R79_TWO_CANDIDATES_MISMATCH')\n for r in record:\n  name=r['name'];old,target=EXPECTED[name]\n  check(int(r['live_FV'])==old\
        \ and int(r['native_JS_actual_hypothetical_FV'])==target,'R79_NUMERIC_DRIFT_'+name)\n  check(float(r['existing_raw_PROD_MULT'])==float(OLD[name]) and float(r['required_hypothetical_PROD_MULT_NOT_EVIDENCE_COEFFICIENT'])==float(NEW[name]),'R79_COEFFICIENT_DRIFT_'+name)\n\
        \  check(r['owner_approved']=='False' and r['production_write_authorized']=='False','R79_PRICE_APPROVAL_NOT_PRESENT')\n full=readcsv(r78/'CAL26_R78_518_exact_live_quote_regression_NO_FV_WRITES.csv')\n\
        \ check(len(full)==518 and len({r['canonical_key'] for r in full})==518,'R78_UNIVERSE_BAD')\n check(sum(r['owner_anchor_active']=='True' for r in full)==15,'R78_OWNER_COUNT_BAD')\n players=[{'canonical_key':r['canonical_key'],'name':r['name'],'position':r['position'],'live':int(r['R78_replayed_unmodified_FV']),'anchor':r['owner_anchor_active']=='True'}\
        \ for r in full]\n source=repo/'index.html'\n check(source.is_file() and (a.fixture or blob(source)==INDEX_SHA),'PINNED_LIVE_SOURCE_CHANGED')\n before=source.read_text(encoding='utf-8')\n after,changed=source_change(before)\n\
        \ original=native_quotes(before,players,out,'BASELINE')\n candidate=native_quotes(after,players,out,'PATCHED')\n undo,reverse_changes=source_change(before) # exact reconstruction check done inside\
        \ source_change\n check(undo==after,'NONDETERMINISTIC_PATCH')\n baseline={z['key']:z for z in original}\n trial={z['key']:z for z in candidate}\n check(len(baseline)==len(trial)==518 and set(baseline)==set(trial),'QUOTE_IDENTITY_DRIFT')\n\
        \ targeted=set(EXPECTED)\n comparisons=[]\n for r in full:\n  n=r['canonical_key'];b=baseline[n];t=trial[n]\n  check(b['anchor']==t['anchor'],'ANCHOR_DRIFT_'+n)\n  if n not in targeted:check(b['quote']==t['quote'],'UNRELATED_PLAYER_CHANGED_'+n)\n\
        \  else:\n   if a.fixture:\n    check(t['quote']>b['quote'],'FIXTURE_CANDIDATE_DID_NOT_INCREASE_'+n)\n   else:\n    check((b['quote'],t['quote'])==EXPECTED[n],'CANDIDATE_QUOTE_MISMATCH_'+n)\n  if\
        \ r['position']!='RB':check(b['quote']==int(r['pinned_R72_live_FV']),'FROZEN_JS_QUOTE_DRIFT_'+n)\n  else:check(abs(b['quote']-int(r['pinned_R72_live_FV']))<=5,'RB_HISTORICAL_QUOTE_DRIFT_'+n)\n \
        \ comparisons.append({'name':r['name'],'position':r['position'],'before_FV':b['quote'],'hypothetical_after_FV':t['quote'],'change_FV':t['quote']-b['quote'],'owner_anchor_unchanged':b['anchor'] and\
        \ b['quote']==t['quote'],'owner_exact_price_approved':False,'production_patch_applied':False})\n check(sum(z['change_FV']!=0 for z in comparisons)==2,'TOO_MANY_PLAYERS_CHANGED')\n check(sum(z['owner_anchor_unchanged']\
        \ for z in comparisons)==15,'PROTECTED_OWNER_QUOTES_CHANGED')\n # Do NOT place a patched index.html into the repository or Artifact. Only a reversible textual diff.\n fw=''.join(difflib.unified_diff(before.splitlines(keepends=True),after.splitlines(keepends=True),fromfile='a/index.html',tofile='b/index.html'))\n\
        \ rv=''.join(difflib.unified_diff(after.splitlines(keepends=True),before.splitlines(keepends=True),fromfile='a/index.html',tofile='b/index.html'))\n check(fw.count('@@ -')==2 and rv.count('@@ -')==2,'PATCH_NOT_EXACTLY_TWO_HUNKS')\n\
        \ names={'CAL26_R80_FORWARD_PATCH_NOT_APPROVED.diff':fw,'CAL26_R80_ROLLBACK_PATCH_NOT_APPROVED.diff':rv}\n for n,s in names.items():check(len(s)>0,'EMPTY_PATCH');(out/n).write_text(s,encoding='utf-8')\n\
        \ with (out/'CAL26_R80_518_JS_SOURCE_DIFF_SHADOW_NO_DEPLOY.csv').open('w',newline='',encoding='utf-8') as f:\n  w=csv.DictWriter(f,list(comparisons[0]),lineterminator='\\n');w.writeheader();w.writerows(comparisons)\n\
        \ desc=['# CAL26 R80 \u2014 Reversible source patch pre-approval rehearsal','',\n       '**DECISION: EXACT TWO-PLAYER PATCH TECHNICALLY REPLAYED; OWNER HAS NOT APPROVED THE NUMERICAL TARGETS; NO\
        \ PRODUCTION WRITE.**','',\n       '| Player | Live FV | Hypothetical source patch FV | Percent change |', '|---|---:|---:|---:|']\n for n,(old,target) in EXPECTED.items():desc.append(f'| {n.title()}\
        \ | {old:,} | {target:,} | {(target/old-1)*100:+.1f}% |')\n desc +=['',f'Exactly two lines in `PROD_MULT_DATA` change; 516 other JS values unchanged; all 15 anchors protected; complete rollback\
        \ restores the exact source bytes (`{INDEX_SHA}`).','',\n         'Forward and reverse diffs are **inspection-only artifacts**. They were NOT applied to the GitHub repository, and no approval was\
        \ inferred.',\n         'The new PRODMULT coefficients are inverted to reproduce hypothetical prices; they are **not** a measured performance uplift, and they do not establish valid Fundamental\
        \ Value.',\n         'No private DLF CSV, DLF secret, protected post-Week6 outcomes, or future-season actuals were read.',\n         'NEXT HUMAN DECISION: explicitly approve or reject **Maye 5500\
        \ FV** and **Nabers 5500 FV** independently. Approval of player-selection direction is not approval of prices.',\n         'Even with price approval, the production patch requires a separate explicit\
        \ release authorization and SHA-safe rollback.','']\n (out/'CAL26_R80_decision.md').write_text('\\n'.join(desc),encoding='utf-8')\n outputs=[*names,'CAL26_R80_518_JS_SOURCE_DIFF_SHADOW_NO_DEPLOY.csv','CAL26_R80_decision.md']\n\
        \ manifest={'run':'CAL26_V1R80','status':'SOURCE_PATCH_DRY_RUN_PRICE_APPROVAL_REQUIRED','R79_source_run':R79_RUN,'R78_reference_run':R78_RUN,'pinned_index_git_blob_sha':INDEX_SHA,'players':518,'hypothetical_changes':2,'unchanged_players':516,'owner_anchors_preserved':15,'source_lines_changed':2,'rollback_exact_original_index':True,'owner_numeric_prices_approved':False,'production_changes':0,'github_repo_writes':0,'private_DLF_material_used':False,'file_sha256':{n:sha(out/n)\
        \ for n in outputs}}\n (out/'CAL26_R80_manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\\n',encoding='utf-8')\n check(source.read_text(encoding='utf-8')==before,'SOURCE_FILE_WAS_MUTATED')\n\
        \ print('R80_TWO_PLAYER_REVERSIBLE_SOURCE_PATCH_SHADOW_GREEN_NO_RELEASE',json.dumps({k:v for k,v in manifest.items() if k!='file_sha256'}))\n\nif __name__=='__main__':\n p=argparse.ArgumentParser()\n\
        \ for t in ('repo','r79','r78','out'):p.add_argument('--'+t,required=True)\n p.add_argument('--fixture',action='store_true')\n args=p.parse_args();main(args)\nPY_R80_ENGINE\npython -m py_compile\
        \ \"$RUNNER_TEMP/CAL26_R80_engine.py\"\npython \"$RUNNER_TEMP/CAL26_R80_engine.py\" \\\n  --repo \"$GITHUB_WORKSPACE\" \\\n  --r79 \"$RUNNER_TEMP/cal26-r80-in/R79\" \\\n  --r78 \"$RUNNER_TEMP/cal26-r80-in/R78\"\
        \ \\\n  --out \"$RUNNER_TEMP/cal26-r80-out\"\npython - \"$RUNNER_TEMP/cal26-r80-out\" <<'PY_R80_FINAL_VERIFY'\nimport json,hashlib,csv,sys,pathlib\np=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R80_manifest.json').read_text())\n\
        assert m['run']=='CAL26_V1R80' and m['status']=='SOURCE_PATCH_DRY_RUN_PRICE_APPROVAL_REQUIRED'\nassert m['pinned_index_git_blob_sha']=='5630bb681dd8710f8e45bc5363488f358ce9ebe2'\nassert m['players']==518\
        \ and m['hypothetical_changes']==2 and m['unchanged_players']==516\nassert m['source_lines_changed']==2 and m['owner_anchors_preserved']==15\nassert m['rollback_exact_original_index'] and not m['owner_numeric_prices_approved']\n\
        assert m['github_repo_writes']==0 and m['production_changes']==0 and not m['private_DLF_material_used']\nfor n,h in m['file_sha256'].items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n\n\
        with (p/'CAL26_R80_518_JS_SOURCE_DIFF_SHADOW_NO_DEPLOY.csv').open() as f:rows=list(csv.DictReader(f))\nassert len(rows)==518\nassert sum(int(z['change_FV'])!=0 for z in rows)==2\nassert {z['name']\
        \ for z in rows if int(z['change_FV'])!=0}=={'drake maye','malik nabers'}\nassert not any(z['owner_exact_price_approved']=='True' or z['production_patch_applied']=='True' for z in rows)\nassert\
        \ not list(p.glob('_R80*'))\nprint('R80_TWO_PLAYER_SOURCE_PATCH_INSPECTION_ONLY_VERIFIED')\nPY_R80_FINAL_VERIFY\ncat \"$RUNNER_TEMP/cal26-r80-out/CAL26_R80_decision.md\" >> \"$GITHUB_STEP_SUMMARY\"\
        \ntest -z \"$(git status --porcelain --untracked-files=all)\""
    - name: "Upload inspection-only patch, rollback and 518 quotes \u2014 never alter production"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_R80_TWO_TARGET_REVERSIBLE_SOURCE_PATCH_NOT_APPROVED
        path: ${{ runner.temp }}/cal26-r80-out/
        retention-days: 60
        if-no-files-found: warn
