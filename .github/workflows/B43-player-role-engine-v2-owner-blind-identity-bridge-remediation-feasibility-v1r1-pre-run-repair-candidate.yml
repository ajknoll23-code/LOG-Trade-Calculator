          python3 "$BASE/player_role_v2_b43_v1_identity_bridge_evaluator.py" --mode evaluate --repo . --out "$OUT/eval" --source-cache "$OUT/source-preflight"

          for f in             player_role_v2_b43_v1_sleeper_identity_snapshot.csv             player_role_v2_b43_v1_identity_bridge.csv             player_role_v2_b43_v1_evidence.json             player_role_v2_b43_v1_report.md             player_role_v2_b43_v1_scientific_decision.json; do
