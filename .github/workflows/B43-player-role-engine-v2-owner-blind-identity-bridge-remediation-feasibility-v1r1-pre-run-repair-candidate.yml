name: B43 Player Role Engine V2 - Owner-Blind Identity Bridge Remediation Feasibility V1R1 Pre-Run Repair Candidate

'on':
  workflow_dispatch:
    inputs:
      independent_review_and_freeze_attestation:
        description: 'Confirm exact B43 V1R1 workflow was independently reviewed and no B43 identity-bridge result was viewed before its criteria freeze'
        required: true
        type: choice
        options:
          - I_CONFIRM_EXACT_B43_V1R1_WAS_INDEPENDENTLY_REVIEWED_AND_NO_B43_IDENTITY_RESULT_WAS_VIEWED_BEFORE_FREEZE

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  BASE: research/player-role-v2
  OUT: /tmp/player-role-v2-b43

jobs:
  owner-blind-identity-bridge-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install identity-study runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'requests==2.34.2'
          python3 - <<'PYRUNTIME'
          import importlib.metadata as md
          assert md.version('requests') == '2.34.2'
          print('PASS: B43 requests runtime pinned at 2.34.2')
          PYRUNTIME

      - name: Preflight B42 V4 scientific STOP lineage and protect production
        shell: bash
        env:
          ATTEST: ${{ inputs.independent_review_and_freeze_attestation }}
        run: |
          set -euo pipefail
          test "$ATTEST" = 'I_CONFIRM_EXACT_B43_V1R1_WAS_INDEPENDENTLY_REVIEWED_AND_NO_B43_IDENTITY_RESULT_WAS_VIEWED_BEFORE_FREEZE'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$OUT"
          echo "MAIN_AT_START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

          python3 - <<'PYPREFLIGHT'
          import hashlib, json, subprocess
          from pathlib import Path

          base=Path('research/player-role-v2')
          expected_blobs={
              'player_role_v2_b42_v4_protocol_freeze.json':'ed4c4ac9d24de8131fbfb1ce407c926dca5dec3e',
              'player_role_v2_b42_v4_owner_blind_parity_evaluator.py':'dc8b0f8eb4e11cd67df4eb56d0308162bf3b893a',
              'player_role_v2_b42_v4_implementation_parity.json':'d411a4f96e1b37461989e279b6d5ff3b15502658',
              'player_role_v2_b42_v4_role_eligibility.csv':'4e34b42fcbf6009211bdb26e6ba81d47a738c133',
              'player_role_v2_b42_v4_owner_blind_eligibility_context.json':'b33ba0eef02ca462c30e02a705d01fb79e3dd8cc',
              'player_role_v2_b42_v4_shadow_refresh.csv':'4d38e4ae95570b0bd60c115e32be141a722bd626',
              'player_role_v2_b42_v4_shadow_refresh_witness.json':'b152f91d4aca312a8bcd2d00fd79d17e5e56deca',
              'player_role_v2_b42_v4_owner_blind_evidence.json':'bee0df96c06f9104424b9f2eaf7fb6cc5189dbc6',
              'player_role_v2_b42_v4_report.md':'d4537c6ac83f1a3e571e6cfde6093f7d9798f22d',
              'player_role_v2_b42_v4_scientific_decision.json':'9c5657dc571a7fa49cb46e9eb6086b2f740e6674',
              'frozen_inputs/players_b41i_snapshot.csv':'fb4ebad425db5bead98644365a4165cd06eee8e3',
              'player_role_v2_b41g_holdout_validation_preregistration.json':'5a4f6a8bfac3eeb0640c1e2ab7aced316fe9afa5',
          }
          for rel,expected in expected_blobs.items():
              p=base/rel
              if not p.exists(): raise RuntimeError(f'B43_PARENT_MISSING {rel}')
              actual=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              if actual!=expected:
                  raise RuntimeError(f'B43_PARENT_BLOB_DRIFT {rel} expected={expected} actual={actual}')

          decision=json.loads((base/'player_role_v2_b42_v4_scientific_decision.json').read_text())
          assert decision['result']=='SCIENTIFIC_STOP_B42_V4_OWNER_BLIND_ROLE_PARITY_FAILED'
          assert decision['data_integrity_pass'] is True
          assert decision['eligible_for_separate_production_authorization'] is False
          assert decision['production_change_authorized'] is False
          assert decision['production_model_deployed'] is False

          evidence=json.loads((base/'player_role_v2_b42_v4_owner_blind_evidence.json').read_text())
          assert evidence['implementation_parity_exact_pass'] is True
          assert evidence['data_integrity_pass'] is True
          assert evidence['model_or_tier_retuning_performed'] is False
          assert evidence['posthoc_fallback_rescue_performed'] is False
          assert evidence['production_change_authorized'] is False
          assert evidence['production_model_deployed'] is False
          assert evidence['role_eligibility_sha256']==hashlib.sha256((base/'player_role_v2_b42_v4_role_eligibility.csv').read_bytes()).hexdigest()

          forbidden=[
              'player_role_v2_b43_v1_preregistration.json',
              'player_role_v2_b43_v1_identity_bridge_evaluator.py',
              'player_role_v2_b43_v1_sleeper_identity_snapshot.csv',
              'player_role_v2_b43_v1_identity_bridge.csv',
              'player_role_v2_b43_v1_evidence.json',
              'player_role_v2_b43_v1_report.md',
              'player_role_v2_b43_v1_scientific_decision.json',
          ]
          for rel in forbidden:
              if (base/rel).exists():
                  raise RuntimeError(f'B43_ONE_SHOT_ARTIFACT_ALREADY_EXISTS_REFUSE_RERUN {rel}')
          print('PASS: B42 V4 valid scientific STOP lineage verified; B43 namespace unused.')
          PYPREFLIGHT

      - name: Materialize and hash B43 criteria before any B43 identity result
        shell: bash
        run: |
          set -euo pipefail
          EVALUATOR="$BASE/player_role_v2_b43_v1_identity_bridge_evaluator.py"
          PREREG="$BASE/player_role_v2_b43_v1_preregistration.json"

          cat > "$EVALUATOR" <<'PY_B43_EVALUATOR'
          #!/usr/bin/env python3
          from __future__ import annotations
          
          import argparse
          import csv
          import hashlib
          import io
          import json
          import math
          import re
          import sys
          import time
          import unicodedata
          from collections import Counter, defaultdict
          from pathlib import Path
          
          import requests
          
          SUPPORTED_MODEL_POSITIONS = {"QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"}
          MISSING = {"", "na", "nan", "none", "null", "n/a"}
          SUFFIX_TOKENS = {"jr", "sr", "ii", "iii", "iv", "v"}
          NON_CLUB_TEAM_CODES = {"FA", "UFA", "RFA"}
          REFERENCE_MIN_COMPARISONS_TOTAL = 500
          RULE_MIN_REFERENCE_COMPARISONS = 50
          MIN_COMBINED_CURRENT_ELIGIBLE_COVERAGE = 0.995
          
          
          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()
          
          
          def sha256_file(path: Path) -> str:
              return sha256_bytes(path.read_bytes())
          
          
          def clean(value) -> str:
              x = str(value if value is not None else "").strip()
              return "" if x.casefold() in MISSING else x
          
          
          def parse_sid(value) -> str | None:
              x = clean(value)
              if not x:
                  return None
              if re.fullmatch(r"\d+\.0+", x):
                  x = x.split(".", 1)[0]
              return x if re.fullmatch(r"\d+", x) else None
          
          
          def canonical_name(value) -> str:
              x = clean(value)
              if not x:
                  return ""
              x = unicodedata.normalize("NFKD", x)
              x = "".join(ch for ch in x if not unicodedata.combining(ch))
              x = x.casefold()
              x = re.sub(r"[^a-z0-9]+", " ", x)
              tokens = [t for t in x.split() if t]
              while tokens and tokens[-1] in SUFFIX_TOKENS:
                  tokens.pop()
              merged = []
              i = 0
              while i < len(tokens):
                  if len(tokens[i]) == 1:
                      run = []
                      while i < len(tokens) and len(tokens[i]) == 1:
                          run.append(tokens[i])
                          i += 1
                      merged.append("".join(run))
                  else:
                      merged.append(tokens[i])
                      i += 1
              return " ".join(merged)
          
          
          def team_key(value) -> str:
              x = re.sub(r"[^A-Z]", "", clean(value).upper())
              aliases = {
                  "ARI": "ARI", "ATL": "ATL", "BAL": "BAL", "BUF": "BUF",
                  "CAR": "CAR", "CHI": "CHI", "CIN": "CIN", "CLE": "CLE",
                  "DAL": "DAL", "DEN": "DEN", "DET": "DET", "GB": "GB",
                  "GBP": "GB", "HOU": "HOU", "IND": "IND", "JAC": "JAX",
                  "JAX": "JAX", "KC": "KC", "KCC": "KC", "LV": "LV",
                  "LVR": "LV", "LAC": "LAC", "LAR": "LAR", "MIA": "MIA",
                  "MIN": "MIN", "NE": "NE", "NEP": "NE", "NO": "NO",
                  "NOS": "NO", "NYG": "NYG", "NYJ": "NYJ", "PHI": "PHI",
                  "PIT": "PIT", "SEA": "SEA", "SF": "SF", "SFO": "SF",
                  "TB": "TB", "TBB": "TB", "TEN": "TEN", "WAS": "WAS",
                  "WSH": "WAS",
              }
              normalized = aliases.get(x, x)
              return "" if normalized in NON_CLUB_TEAM_CODES else normalized
          
          
          def position_family(value) -> str:
              x = clean(value).upper()
              if x in {"QB"}:
                  return "QB"
              if x in {"RB", "FB", "HB"}:
                  return "RB"
              if x in {"WR"}:
                  return "WR"
              if x in {"TE"}:
                  return "TE"
              if x in {"K", "PK"}:
                  return "K"
              if x in {"DL", "DE", "DT", "NT", "EDGE", "ED", "LB", "ILB", "OLB"}:
                  return "FRONT7"
              if x in {"DB", "CB", "S", "FS", "SS"}:
                  return "DB"
              return ""
          
          
          def source_get(session: requests.Session, url: str, attempts: int = 4) -> bytes:
              err = None
              for i in range(attempts):
                  try:
                      r = session.get(url, timeout=45)
                      r.raise_for_status()
                      return r.content
                  except Exception as exc:
                      err = exc
                      if i + 1 < attempts:
                          time.sleep(2 ** i)
              raise RuntimeError(f"B43_SOURCE_FETCH_FAILED url={url} error={err}")
          
          
          def load_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))
          
          
          def write_json(path: Path, payload) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          
          
          def load_crosswalk_bytes(payload: bytes):
              text = payload.decode("utf-8-sig")
              rows = list(csv.DictReader(io.StringIO(text)))
              required = {"gsis_id", "sleeper_id"}
              if not rows or not required.issubset(rows[0]):
                  raise RuntimeError("B43_CROSSWALK_SCHEMA_MISSING")
              gsis_to_sids = defaultdict(set)
              sid_to_gsis = defaultdict(set)
              missing_gsis_with_sid = 0
              for row in rows:
                  g = clean(row.get("gsis_id"))
                  sid = parse_sid(row.get("sleeper_id"))
                  if sid and not g:
                      missing_gsis_with_sid += 1
                  if g and sid:
                      gsis_to_sids[g].add(sid)
                      sid_to_gsis[sid].add(g)
              ambiguous_gsis = {g: sorted(v) for g, v in gsis_to_sids.items() if len(v) > 1}
              ambiguous_sid = {s: sorted(v) for s, v in sid_to_gsis.items() if len(v) > 1}
              if ambiguous_gsis:
                  raise RuntimeError(f"B43_REAL_AMBIGUOUS_GSIS_CROSSWALK count={len(ambiguous_gsis)}")
              if ambiguous_sid:
                  raise RuntimeError(f"B43_REAL_AMBIGUOUS_SLEEPER_CROSSWALK count={len(ambiguous_sid)}")
              exact = {g: next(iter(v)) for g, v in gsis_to_sids.items()}
              inverse = {s: next(iter(v)) for s, v in sid_to_gsis.items()}
              return exact, inverse, {
                  "rows_with_sleeper_id_but_missing_gsis": int(missing_gsis_with_sid),
                  "exact_pair_count": int(len(exact)),
              }
          
          
          def sleeper_records_from_payload(payload: bytes):
              raw = json.loads(payload)
              if not isinstance(raw, dict):
                  raise RuntimeError("B43_SLEEPER_PLAYER_MAP_NOT_OBJECT")
              records = []
              for key, rec in raw.items():
                  if not isinstance(rec, dict):
                      continue
                  sid = parse_sid(rec.get("player_id") or key)
                  if not sid:
                      continue
                  first = clean(rec.get("first_name"))
                  last = clean(rec.get("last_name"))
                  full = clean(rec.get("full_name")) or " ".join(x for x in (first, last) if x)
                  name_key = canonical_name(full)
                  pos = clean(rec.get("position"))
                  fam = position_family(pos)
                  if not name_key or not fam:
                      continue
                  records.append({
                      "sleeper_id": sid,
                      "full_name": full,
                      "name_key": name_key,
                      "birth_date": clean(rec.get("birth_date")),
                      "position": pos,
                      "position_family": fam,
                      "nfl_team": team_key(rec.get("team")),
                      "status": clean(rec.get("status")),
                  })
              return raw, records
          
          
          def load_current_eligible_and_nfl_identity(repo: Path):
              base = repo / "research/player-role-v2"
              evidence = load_json(base / "player_role_v2_b42_v4_owner_blind_evidence.json")
              elig_path = base / "player_role_v2_b42_v4_role_eligibility.csv"
              if sha256_file(elig_path) != evidence["role_eligibility_sha256"]:
                  raise RuntimeError("B43_B42_ROLE_ELIGIBILITY_HASH_MISMATCH")
              with elig_path.open(newline="", encoding="utf-8") as f:
                  eligible = list(csv.DictReader(f))
              eligible = [r for r in eligible if clean(r.get("gsis_id")) and clean(r.get("position")) in SUPPORTED_MODEL_POSITIONS]
          
              players_path = base / "frozen_inputs/players_b41i_snapshot.csv"
              expected_players_sha = "d531dcff2d3ff681f02210d314f6e9f16c671c0beefa85fd311a55363675d4cc"
              if sha256_file(players_path) != expected_players_sha:
                  raise RuntimeError("B43_NFLVERSE_IDENTITY_SNAPSHOT_HASH_MISMATCH")
              identity = {}
              with players_path.open(newline="", encoding="utf-8") as f:
                  for row in csv.DictReader(f):
                      g = clean(row.get("gsis_id"))
                      if g:
                          identity[g] = {
                              "display_name": clean(row.get("display_name")),
                              "birth_date": clean(row.get("birth_date")),
                              "position": clean(row.get("position")),
                              "position_group": clean(row.get("position_group")),
                              "latest_team": team_key(row.get("latest_team")),
                          }
              current = []
              for row in eligible:
                  g = clean(row.get("gsis_id"))
                  meta = identity.get(g, {})
                  name = clean(row.get("player_name")) or meta.get("display_name", "")
                  model_pos = clean(row.get("position"))
                  current.append({
                      "gsis_id": g,
                      "player_name": name,
                      "name_key": canonical_name(name),
                      "birth_date": clean(meta.get("birth_date")),
                      "model_position": model_pos,
                      "position_family": position_family(model_pos) or position_family(meta.get("position_group")) or position_family(meta.get("position")),
                      "nfl_team": team_key(meta.get("latest_team")),
                  })
              return current
          
          
          def candidate_for(nfl_row: dict, sleeper_by_name: dict[str, list[dict]]):
              candidates = [x for x in sleeper_by_name.get(nfl_row["name_key"], []) if x["position_family"] == nfl_row["position_family"]]
              if not candidates:
                  return None
          
              bd = nfl_row["birth_date"]
              if bd:
                  # Positive DOB disagreement is a hard identity veto. Candidates with
                  # missing DOB may remain eligible for weaker rules, but a candidate
                  # with a different known DOB may never be rescued by team/name.
                  candidates = [x for x in candidates if not x["birth_date"] or x["birth_date"] == bd]
                  if not candidates:
                      return None
                  exact_bd = [x for x in candidates if x["birth_date"] and x["birth_date"] == bd]
                  if len(exact_bd) == 1:
                      return exact_bd[0], "DOB_POSITION"
                  if len(exact_bd) > 1:
                      return None
          
              team = nfl_row["nfl_team"]
              if team:
                  exact_team = [x for x in candidates if x["nfl_team"] and x["nfl_team"] == team]
                  if len(exact_team) == 1:
                      return exact_team[0], "NFL_TEAM_POSITION"
                  if len(exact_team) > 1:
                      return None
          
              if len(candidates) == 1:
                  return candidates[0], "UNIQUE_NAME_POSITION"
              return None
          
          
          def protocol_payload() -> dict:
              return {
                  "schema_version": 1,
                  "study_id": "player-role-v2",
                  "phase": "B43-v1-owner-blind-identity-bridge-remediation-feasibility",
                  "status": "FROZEN_BEFORE_B43_IDENTITY_BRIDGE_RESULTS",
                  "motivation": "B42 V4 reached a valid scientific STOP because identity coverage, not role scoring, missed preregistered owner-blind parity gates.",
                  "scientific_boundary": {
                      "B42_team_level_results_are_prior_observed_evidence": True,
                      "B43_may_not_parse_or_use_league_rosters": True,
                      "B43_may_not_use_owner_identity_or_fantasy_roster_partition": True,
                      "player_specific_exceptions_allowed": False,
                      "role_model_or_tier_changes_allowed": False,
                      "posthoc_B42_player_list_may_be_encoded": False,
                  },
                  "sources": {
                      "current_football_population": "B42 V4 owner-blind role-eligibility artifact frozen before roster parse",
                      "nfl_identity_metadata": "frozen B41I nflverse player snapshot",
                      "reference_identity_pairs": "B41G-pinned dynastyprocess stable-ID crosswalk",
                      "candidate_sleeper_identity_source": "https://api.sleeper.app/v1/players/nfl",
                  },
                  "matching_rules_in_fixed_priority": [
                      "DOB_POSITION: canonical name + compatible model/Sleeper position family + exact nonmissing birth date, unique candidate",
                      "NFL_TEAM_POSITION: canonical name + compatible position family + exact normalized NFL club, unique candidate; free-agent/status codes are not clubs",
                      "UNIQUE_NAME_POSITION: canonical name + compatible position family, exactly one Sleeper candidate",
                  ],
                  "dob_contradiction_veto": True,
                  "dob_contradiction_veto_semantics": "When nflverse DOB is nonmissing, discard any candidate with a different nonmissing DOB before weaker team/name rules; if none remain, return no match.",
                  "non_club_team_codes_excluded_from_team_rule": sorted(NON_CLUB_TEAM_CODES),
                  "canonical_name_rule": "Unicode NFKD; remove combining marks; casefold; replace non-alphanumeric runs with spaces; collapse whitespace; remove terminal Jr/Sr/II/III/IV/V suffix tokens",
                  "position_compatibility": "QB/RB/WR/TE/K/DB exact families; DL and LB share FRONT7 to tolerate platform-vs-model edge classification",
                  "validation_design": {
                      "reference_pairs_are_not_used_to_generate_candidate_features": True,
                      "known stable-ID pairs are treated as masked identity truth for known-pair reference precision validation": True,
                      "rule_application_is_allowed_only_if_that_rule_has_at_least_50_reference_comparisons_and_zero_reference_conflicts": True,
                      "minimum_total_reference_comparisons": REFERENCE_MIN_COMPARISONS_TOTAL,
                      "one_to_one_mapping_required": True,
                  },
                  "primary_gates": {
                      "no_roster_or_owner_context": True,
                      "minimum_total_reference_comparisons_across_eligible_rules": REFERENCE_MIN_COMPARISONS_TOTAL,
                      "reference_conflicts_allowed_per_eligible_rule": 0,
                      "minimum_reference_comparisons_per_applied_rule": RULE_MIN_REFERENCE_COMPARISONS,
                      "accepted_mapping_one_to_one_conflicts_allowed": 0,
                      "minimum_base_plus_supplemental_current_eligible_coverage": MIN_COMBINED_CURRENT_ELIGIBLE_COVERAGE,
                      "minimum_supplemental_mapping_count": 1,
                  },
                  "production_firewall": {
                      "B43_authorizes_production_change": False,
                      "B43_deploys_model": False,
                      "B44_owner_blind_reaudit_required_after_B43_pass": True,
                  },
              }
          
          
          def run_selftest() -> None:
              assert canonical_name("A.J. Example") == canonical_name("AJ Example") == "aj example"
              assert canonical_name("John Smith Jr.") == "john smith"
              assert clean("NA") == ""
              assert parse_sid("1234.0") == "1234"
              assert parse_sid("NA") is None
              assert position_family("DL") == position_family("LB") == "FRONT7"
              assert team_key("KCC") == team_key("KC") == "KC"
              assert team_key("FA") == team_key("FA*") == team_key("UFA") == team_key("RFA") == ""
              sleepers = {
                  "aj example": [{"sleeper_id":"1","name_key":"aj example","birth_date":"2003-01-01","position_family":"DB","nfl_team":"ARI"}],
                  "casey sample": [
                      {"sleeper_id":"2","name_key":"casey sample","birth_date":"2004-01-01","position_family":"FRONT7","nfl_team":"CLE"}
                  ],
                  "conflict person": [
                      {"sleeper_id":"3","name_key":"conflict person","birth_date":"1999-01-01","position_family":"WR","nfl_team":"ARI"}
                  ],
              }
              got = candidate_for({"name_key":"aj example","birth_date":"2003-01-01","position_family":"DB","nfl_team":"ARI"}, sleepers)
              assert got and got[0]["sleeper_id"] == "1" and got[1] == "DOB_POSITION"
              got = candidate_for({"name_key":"casey sample","birth_date":"","position_family":"FRONT7","nfl_team":"CLE"}, sleepers)
              assert got and got[0]["sleeper_id"] == "2"
              got = candidate_for({"name_key":"conflict person","birth_date":"2001-01-01","position_family":"WR","nfl_team":"ARI"}, sleepers)
              assert got is None, "Conflicting known DOB must veto weaker team/name rescue"
              # Literal NA must never become a fake GSIS identity bucket.
              sample = b"gsis_id,sleeper_id\nNA,100\n,101\n00-1,102\n"
              exact, inv, audit = load_crosswalk_bytes(sample)
              assert exact == {"00-1":"102"}
              assert inv == {"102":"00-1"}
              assert audit["rows_with_sleeper_id_but_missing_gsis"] == 2
              print("PASS B43 evaluator self-test")
          
          
          def source_preflight(repo: Path, out: Path, session: requests.Session) -> None:
              base = repo / "research/player-role-v2"
              prereg = load_json(base / "player_role_v2_b41g_holdout_validation_preregistration.json")
              commit = prereg["frozen_inputs"]["stable_id_crosswalk_commit"]
              cross_url = f"https://raw.githubusercontent.com/dynastyprocess/data/{commit}/files/db_playerids.csv"
              cross_bytes = source_get(session, cross_url)
              cross_rows = list(csv.DictReader(io.StringIO(cross_bytes.decode("utf-8-sig"))))
              if not cross_rows or not {"gsis_id", "sleeper_id"}.issubset(cross_rows[0]):
                  raise RuntimeError("B43_PREFLIGHT_CROSSWALK_SCHEMA")
              sleeper_bytes = source_get(session, "https://api.sleeper.app/v1/players/nfl")
              raw, records = sleeper_records_from_payload(sleeper_bytes)
              if len(raw) < 5000:
                  raise RuntimeError(f"B43_SLEEPER_MAP_TOO_SMALL count={len(raw)}")
              if len(records) < 1000:
                  raise RuntimeError(f"B43_SLEEPER_SUPPORTED_IDENTITY_ROWS_TOO_SMALL count={len(records)}")
              current = load_current_eligible_and_nfl_identity(repo)
              if len(current) < 500:
                  raise RuntimeError(f"B43_CURRENT_ELIGIBLE_POPULATION_TOO_SMALL count={len(current)}")
              out.mkdir(parents=True, exist_ok=True)
              (out / "stable_crosswalk.csv").write_bytes(cross_bytes)
              (out / "sleeper_players.json").write_bytes(sleeper_bytes)
              write_json(out / "source_preflight.json", {
                  "status":"PASS_SOURCE_SCHEMA_ONLY_NO_IDENTITY_RESULT_COMPUTED",
                  "stable_crosswalk_sha256":sha256_bytes(cross_bytes),
                  "sleeper_player_map_sha256":sha256_bytes(sleeper_bytes),
                  "sleeper_raw_object_count":len(raw),
                  "sleeper_supported_identity_row_count":len(records),
                  "current_owner_blind_eligible_row_count":len(current),
                  "B43_identity_mapping_metric_computed":False,
                  "league_roster_source_used":False,
              })
          
          
          def run_evaluation(repo: Path, out: Path, session: requests.Session, source_cache: Path | None = None) -> dict:
              base = repo / "research/player-role-v2"
              b42_decision = load_json(base / "player_role_v2_b42_v4_scientific_decision.json")
              if b42_decision["result"] != "SCIENTIFIC_STOP_B42_V4_OWNER_BLIND_ROLE_PARITY_FAILED":
                  raise RuntimeError("B43_PARENT_B42_DECISION_NOT_EXPECTED_STOP")
              if b42_decision["production_change_authorized"] is not False or b42_decision["production_model_deployed"] is not False:
                  raise RuntimeError("B43_PARENT_PRODUCTION_FIREWALL_BROKEN")
          
              prereg = load_json(base / "player_role_v2_b41g_holdout_validation_preregistration.json")
              commit = prereg["frozen_inputs"]["stable_id_crosswalk_commit"]
              cross_url = f"https://raw.githubusercontent.com/dynastyprocess/data/{commit}/files/db_playerids.csv"
              if source_cache is not None:
                  cross_bytes = (source_cache / "stable_crosswalk.csv").read_bytes()
                  sleeper_bytes = (source_cache / "sleeper_players.json").read_bytes()
              else:
                  cross_bytes = source_get(session, cross_url)
                  sleeper_bytes = source_get(session, "https://api.sleeper.app/v1/players/nfl")
              stable, stable_inverse, cross_audit = load_crosswalk_bytes(cross_bytes)
          
              raw_sleeper, sleeper_records = sleeper_records_from_payload(sleeper_bytes)
              sleeper_by_id = {x["sleeper_id"]: x for x in sleeper_records}
              sleeper_by_name = defaultdict(list)
              for x in sleeper_records:
                  sleeper_by_name[x["name_key"]].append(x)
          
              current = load_current_eligible_and_nfl_identity(repo)
              if len({x["gsis_id"] for x in current}) != len(current):
                  # Duplicate GSIS rows would invalidate coverage math. Duplicate names are allowed.
                  raise RuntimeError("B43_DUPLICATE_CURRENT_GSIS_ROWS")
          
              predictions = {}
              rule_reference = {r:{"comparisons":0,"conflicts":0,"correct":0} for r in ("DOB_POSITION","NFL_TEAM_POSITION","UNIQUE_NAME_POSITION")}
              total_reference_predictions = 0
              total_reference_conflicts = 0
          
              for row in current:
                  pred = candidate_for(row, sleeper_by_name)
                  if pred:
                      rec, rule = pred
                      predictions[row["gsis_id"]] = {"sleeper_id":rec["sleeper_id"],"rule":rule}
                      ref_sid = stable.get(row["gsis_id"])
                      if ref_sid and ref_sid in sleeper_by_id:
                          total_reference_predictions += 1
                          rule_reference[rule]["comparisons"] += 1
                          if rec["sleeper_id"] == ref_sid:
                              rule_reference[rule]["correct"] += 1
                          else:
                              rule_reference[rule]["conflicts"] += 1
                              total_reference_conflicts += 1
          
              rule_eligible = {}
              for rule, stats in rule_reference.items():
                  rule_eligible[rule] = bool(
                      stats["comparisons"] >= RULE_MIN_REFERENCE_COMPARISONS and stats["conflicts"] == 0
                  )
                  stats["precision"] = (stats["correct"] / stats["comparisons"]) if stats["comparisons"] else None
                  stats["eligible_for_supplemental_application"] = rule_eligible[rule]
              eligible_reference_comparisons = sum(
                  stats["comparisons"] for rule, stats in rule_reference.items() if rule_eligible[rule]
              )
              eligible_reference_conflicts = sum(
                  stats["conflicts"] for rule, stats in rule_reference.items() if rule_eligible[rule]
              )
          
              proposals = []
              for row in current:
                  g = row["gsis_id"]
                  if g in stable:
                      continue
                  pred = predictions.get(g)
                  if not pred or not rule_eligible.get(pred["rule"], False):
                      continue
                  proposals.append({
                      "gsis_id":g,
                      "sleeper_id":pred["sleeper_id"],
                      "rule":pred["rule"],
                      "name_key":row["name_key"],
                      "model_position":row["model_position"],
                      "position_family":row["position_family"],
                      "birth_date":row["birth_date"],
                      "nfl_team":row["nfl_team"],
                  })
          
              # Enforce prospective one-to-one mapping. Any collision is excluded and fails the gate.
              sid_counts = Counter(x["sleeper_id"] for x in proposals)
              gsis_counts = Counter(x["gsis_id"] for x in proposals)
              base_sid_to_gsis = stable_inverse
              collisions = []
              accepted = []
              for x in proposals:
                  reasons = []
                  if sid_counts[x["sleeper_id"]] != 1:
                      reasons.append("supplemental_sleeper_id_collision")
                  if gsis_counts[x["gsis_id"]] != 1:
                      reasons.append("supplemental_gsis_id_collision")
                  if x["sleeper_id"] in base_sid_to_gsis and base_sid_to_gsis[x["sleeper_id"]] != x["gsis_id"]:
                      reasons.append("conflicts_with_existing_stable_pair")
                  if reasons:
                      collisions.append({"gsis_id":x["gsis_id"],"sleeper_id":x["sleeper_id"],"reasons":reasons})
                  else:
                      accepted.append(x)
          
              current_count = len(current)
              base_mapped = sum(1 for x in current if x["gsis_id"] in stable)
              accepted_gsis = {x["gsis_id"] for x in accepted}
              combined_mapped = sum(1 for x in current if x["gsis_id"] in stable or x["gsis_id"] in accepted_gsis)
              combined_coverage = combined_mapped / current_count if current_count else 0.0
          
              used_rules = sorted({x["rule"] for x in accepted})
              gates = {
                  "no_roster_or_owner_context": True,
                  "minimum_total_reference_comparisons_across_eligible_rules": eligible_reference_comparisons >= REFERENCE_MIN_COMPARISONS_TOTAL,
                  "zero_reference_conflicts_among_eligible_rules": eligible_reference_conflicts == 0,
                  "every_applied_rule_independently_validated": all(rule_eligible[r] for r in used_rules),
                  "zero_accepted_mapping_one_to_one_conflicts": len(collisions) == 0,
                  "minimum_base_plus_supplemental_current_eligible_coverage": combined_coverage >= MIN_COMBINED_CURRENT_ELIGIBLE_COVERAGE,
                  "minimum_supplemental_mapping_count": len(accepted) >= 1,
              }
              all_pass = all(gates.values())
          
              out.mkdir(parents=True, exist_ok=True)
              snapshot_path = out / "player_role_v2_b43_v1_sleeper_identity_snapshot.csv"
              with snapshot_path.open("w", newline="", encoding="utf-8") as f:
                  fields = ["sleeper_id","full_name","name_key","birth_date","position","position_family","nfl_team","status"]
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  for x in sorted(sleeper_records, key=lambda z:(int(z["sleeper_id"]), z["name_key"])):
                      w.writerow({k:x.get(k,"") for k in fields})
          
              bridge_path = out / "player_role_v2_b43_v1_identity_bridge.csv"
              with bridge_path.open("w", newline="", encoding="utf-8") as f:
                  fields = ["gsis_id","sleeper_id","rule","name_key","model_position","position_family","birth_date","nfl_team"]
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  for x in sorted(accepted, key=lambda z:z["gsis_id"]):
                      w.writerow({k:x.get(k,"") for k in fields})
          
              evidence = {
                  "schema_version":1,
                  "study_id":"player-role-v2",
                  "phase":"B43-v1-owner-blind-identity-bridge-remediation-feasibility",
                  "result":"PASS_B43_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FROZEN_FOR_B44_REAUDIT" if all_pass else "SCIENTIFIC_STOP_B43_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FAILED",
                  "all_primary_gates_pass":all_pass,
                  "primary_gates":gates,
                  "thresholds":{
                      "minimum_total_reference_comparisons_across_eligible_rules":REFERENCE_MIN_COMPARISONS_TOTAL,
                      "minimum_reference_comparisons_per_applied_rule":RULE_MIN_REFERENCE_COMPARISONS,
                      "reference_conflicts_allowed_per_eligible_rule":0,
                      "minimum_base_plus_supplemental_current_eligible_coverage":MIN_COMBINED_CURRENT_ELIGIBLE_COVERAGE,
                      "accepted_mapping_one_to_one_conflicts_allowed":0,
                  },
                  "source_integrity":{
                      "stable_crosswalk_commit":commit,
                      "stable_crosswalk_sha256":sha256_bytes(cross_bytes),
                      "stable_crosswalk_audit":cross_audit,
                      "sleeper_player_map_sha256":sha256_bytes(sleeper_bytes),
                      "sleeper_raw_object_count":len(raw_sleeper),
                      "sleeper_supported_identity_row_count":len(sleeper_records),
                      "b42_role_eligibility_sha256":sha256_file(base / "player_role_v2_b42_v4_role_eligibility.csv"),
                      "b41i_nfl_identity_snapshot_sha256":sha256_file(base / "frozen_inputs/players_b41i_snapshot.csv"),
                  },
                  "reference_validation":{
                      "total_reference_predictions_all_candidate_rules":total_reference_predictions,
                      "total_reference_conflicts_all_candidate_rules":total_reference_conflicts,
                      "eligible_rule_reference_comparisons":eligible_reference_comparisons,
                      "eligible_rule_reference_conflicts":eligible_reference_conflicts,
                      "rule_stats":rule_reference,
                  },
                  "current_owner_blind_population":{
                      "eligible_gsis_rows":current_count,
                      "base_stable_mapping_count":base_mapped,
                      "base_stable_mapping_coverage":base_mapped/current_count if current_count else 0.0,
                      "supplemental_proposal_count":len(proposals),
                      "supplemental_accepted_count":len(accepted),
                      "supplemental_collision_count":len(collisions),
                      "combined_mapped_count":combined_mapped,
                      "combined_mapping_coverage":combined_coverage,
                      "unresolved_count":current_count-combined_mapped,
                      "accepted_rule_counts":dict(Counter(x["rule"] for x in accepted)),
                  },
                  "supplemental_collision_details":collisions,
                  "league_roster_source_used":False,
                  "owner_identity_used":False,
                  "fantasy_roster_partition_used":False,
                  "player_specific_exception_count":0,
                  "model_or_tier_retuning_performed":False,
                  "production_change_authorized":False,
                  "production_model_deployed":False,
                  "B44_owner_blind_reaudit_required_after_pass":True,
                  "sleeper_identity_snapshot_sha256":sha256_file(snapshot_path),
                  "identity_bridge_sha256":sha256_file(bridge_path),
              }
              write_json(out / "player_role_v2_b43_v1_evidence.json", evidence)
          
              decision = {
                  "schema_version":1,
                  "study_id":"player-role-v2",
                  "phase":"B43-v1-scientific-decision",
                  "result":evidence["result"],
                  "all_primary_gates_pass":all_pass,
                  "combined_mapping_coverage":combined_coverage,
                  "supplemental_accepted_count":len(accepted),
                  "reference_conflicts_among_eligible_rules":eligible_reference_conflicts,
                  "eligible_for_B44_owner_blind_reaudit":all_pass,
                  "production_change_authorized":False,
                  "production_model_deployed":False,
                  "next_stage":"If PASS, B44 must use this exact frozen bridge and Sleeper identity snapshot without changing matching rules, model weights, tiers, or the original 98%/2pp parity gates. If STOP, preserve evidence and preregister a new identity-source study before any further team audit.",
              }
              write_json(out / "player_role_v2_b43_v1_scientific_decision.json", decision)
          
              report = [
                  "# Player Role V2 — B43 V1 Owner-Blind Identity Bridge Remediation Feasibility",
                  "",
                  f"- Decision: **{evidence['result']}**",
                  f"- Current owner-blind active eligible GSIS rows: **{current_count}**",
                  f"- Base stable mappings: **{base_mapped} ({base_mapped/current_count:.4f})**" if current_count else "- Base stable mappings: **0**",
                  f"- Supplemental accepted mappings: **{len(accepted)}**",
                  f"- Combined mapping coverage: **{combined_coverage:.4f}**",
                  f"- Minimum required combined coverage: **{MIN_COMBINED_CURRENT_ELIGIBLE_COVERAGE:.4f}**",
                  f"- Reference comparisons across eligible rules: **{eligible_reference_comparisons}**",
                  f"- Reference conflicts across eligible rules: **{eligible_reference_conflicts}**",
                  f"- Candidate-rule reference conflicts reported descriptively: **{total_reference_conflicts}**",
                  f"- One-to-one collision rows: **{len(collisions)}**",
                  "- League roster source used: **No**",
                  "- Owner/fantasy-team context used: **No**",
                  "- Player-specific exceptions: **0**",
                  "- Model/tier retuning: **No**",
                  "- Production authorized: **No**",
                  "",
                  "## Rule validation",
                  "",
                  "| Rule | Known-pair reference comparisons | Conflicts | Known-pair reference precision | Eligible for supplemental use | Accepted supplements |",
                  "|---|---:|---:|---:|:---:|---:|",
              ]
              acc_counts=Counter(x["rule"] for x in accepted)
              for rule in ("DOB_POSITION","NFL_TEAM_POSITION","UNIQUE_NAME_POSITION"):
                  s=rule_reference[rule]
                  prec="NA" if s["precision"] is None else f"{s['precision']:.6f}"
                  report.append(f"| {rule} | {s['comparisons']} | {s['conflicts']} | {prec} | {'YES' if rule_eligible[rule] else 'NO'} | {acc_counts.get(rule,0)} |")
              report += [
                  "",
                  "## Gate results",
                  "",
              ]
              for k,v in gates.items():
                  report.append(f"- {k}: **{'PASS' if v else 'FAIL'}**")
              report += [
                  "",
                  "## Interpretation",
                  "",
                  "B43 is a source-only identity-remediation study prompted by B42 V4's valid scientific STOP. It does not re-open league rosters, does not know fantasy-team assignment, and does not change the role model or tier thresholds. The candidate bridge is validated against already-known stable GSIS↔Sleeper pairs; reported precision is known-pair reference precision, not an observed precision estimate on the unresolved supplemental population.",
                  "",
                  "No individual B42-missed player or Sleeper ID is hard-coded. If B43 passes, the exact frozen supplemental bridge is eligible only for a separately preregistered B44 owner-blind parity re-audit under the original B42 98% minimum-team-coverage and 2-percentage-point range gates.",
              ]
              (out / "player_role_v2_b43_v1_report.md").write_text("\n".join(report)+"\n", encoding="utf-8")
              return evidence
          
          
          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--mode", choices=["selftest","protocol","source-preflight","evaluate"], required=True)
              ap.add_argument("--repo", default=".")
              ap.add_argument("--out")
              ap.add_argument("--source-cache")
              args=ap.parse_args()
              if args.mode=="selftest":
                  run_selftest(); return
              repo=Path(args.repo).resolve()
              if args.mode=="protocol":
                  if not args.out: raise RuntimeError("--out required")
                  write_json(Path(args.out), protocol_payload()); return
              session=requests.Session(); session.headers.update({"User-Agent":"LOG-Trade-Calculator-player-role-v2-b43-v1"})
              if not args.out: raise RuntimeError("--out required")
              out=Path(args.out)
              if args.mode=="source-preflight":
                  source_preflight(repo,out,session); return
              if args.mode=="evaluate":
                  cache=Path(args.source_cache) if args.source_cache else None
                  run_evaluation(repo,out,session,cache)
                  return
          
          if __name__=="__main__":
              main()
          PY_B43_EVALUATOR
          chmod +x "$EVALUATOR"
          python3 -m py_compile "$EVALUATOR"
          python3 "$EVALUATOR" --mode selftest
          python3 "$EVALUATOR" --mode protocol --repo . --out "$PREREG"

          python3 - <<'PYFREEZE'
          import json
          from pathlib import Path
          p=json.loads(Path('research/player-role-v2/player_role_v2_b43_v1_preregistration.json').read_text())
          assert p['status']=='FROZEN_BEFORE_B43_IDENTITY_BRIDGE_RESULTS'
          assert p['scientific_boundary']['B43_may_not_parse_or_use_league_rosters'] is True
          assert p['scientific_boundary']['player_specific_exceptions_allowed'] is False
          assert p['scientific_boundary']['role_model_or_tier_changes_allowed'] is False
          assert p['primary_gates']['reference_conflicts_allowed_per_eligible_rule']==0
          assert p['primary_gates']['minimum_base_plus_supplemental_current_eligible_coverage']==0.995
          assert p['dob_contradiction_veto'] is True
          assert set(p['non_club_team_codes_excluded_from_team_rule'])=={'FA','UFA','RFA'}
          assert p['production_firewall']['B43_authorizes_production_change'] is False
          assert p['production_firewall']['B44_owner_blind_reaudit_required_after_B43_pass'] is True
          print('PASS: B43 criteria materialized before B43 identity-bridge results.')
          PYFREEZE

          echo "B43_PRECHECK_EVALUATOR_SHA256=$(sha256sum "$EVALUATOR" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "B43_PRECHECK_PREREG_SHA256=$(sha256sum "$PREREG" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Source-schema preflight before consuming B43 namespace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT/source-preflight"
          python3 "$BASE/player_role_v2_b43_v1_identity_bridge_evaluator.py"             --mode source-preflight --repo . --out "$OUT/source-preflight"
          python3 - <<'PYSOURCE'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/player-role-v2-b43/source-preflight/source_preflight.json').read_text())
          assert p['status']=='PASS_SOURCE_SCHEMA_ONLY_NO_IDENTITY_RESULT_COMPUTED'
          assert p['B43_identity_mapping_metric_computed'] is False
          assert p['league_roster_source_used'] is False
          print('PASS: source schemas reachable before namespace commit; no B43 mapping metric computed.')
          PYSOURCE
          test "$(sha256sum "$BASE/player_role_v2_b43_v1_identity_bridge_evaluator.py" | awk '{print $1}')" = "$B43_PRECHECK_EVALUATOR_SHA256"
          test "$(sha256sum "$BASE/player_role_v2_b43_v1_preregistration.json" | awk '{print $1}')" = "$B43_PRECHECK_PREREG_SHA256"

      - name: Durably freeze B43 evaluator and preregistration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             "$BASE/player_role_v2_b43_v1_identity_bridge_evaluator.py"             "$BASE/player_role_v2_b43_v1_preregistration.json"
          python3 - <<'PYSTAGE'
          import subprocess
          expected={
            'research/player-role-v2/player_role_v2_b43_v1_identity_bridge_evaluator.py',
            'research/player-role-v2/player_role_v2_b43_v1_preregistration.json',
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PYSTAGE
          test "$(sha256sum "$BASE/player_role_v2_b43_v1_identity_bridge_evaluator.py" | awk '{print $1}')" = "$B43_PRECHECK_EVALUATOR_SHA256"
          test "$(sha256sum "$BASE/player_role_v2_b43_v1_preregistration.json" | awk '{print $1}')" = "$B43_PRECHECK_PREREG_SHA256"
          git commit -m 'Freeze Player Role V2 B43 V1 owner-blind identity bridge study'
          git fetch origin main
          git rebase origin/main
          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA_BEFORE"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA_BEFORE"
          git push origin HEAD:main
          echo "B43_FREEZE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run owner-blind identity bridge feasibility study without league roster input
