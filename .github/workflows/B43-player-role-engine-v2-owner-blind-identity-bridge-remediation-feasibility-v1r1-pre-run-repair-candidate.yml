          python3 - <<'PYSTAGE2'
          import subprocess
          expected={
            'research/player-role-v2/player_role_v2_b43_v1_sleeper_identity_snapshot.csv',
            'research/player-role-v2/player_role_v2_b43_v1_identity_bridge.csv',
            'research/player-role-v2/player_role_v2_b43_v1_evidence.json',
            'research/player-role-v2/player_role_v2_b43_v1_report.md',
