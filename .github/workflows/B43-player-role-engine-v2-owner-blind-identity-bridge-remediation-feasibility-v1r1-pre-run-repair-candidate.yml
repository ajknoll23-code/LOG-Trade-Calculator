          echo "B43_EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify durable main and publish B43 decision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA_BEFORE"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA_BEFORE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PYFINAL'
          import json
          from pathlib import Path
          d=json.loads(Path('research/player-role-v2/player_role_v2_b43_v1_scientific_decision.json').read_text())
          e=json.loads(Path('research/player-role-v2/player_role_v2_b43_v1_evidence.json').read_text())
          print('B43 scientific decision:',d['result'])
          print('Eligible-rule reference comparisons:',e['reference_validation']['eligible_rule_reference_comparisons'])
          print('Eligible-rule reference conflicts:',e['reference_validation']['eligible_rule_reference_conflicts'])
          print('Base coverage:',e['current_owner_blind_population']['base_stable_mapping_coverage'])
          print('Supplemental accepted:',e['current_owner_blind_population']['supplemental_accepted_count'])
          print('Combined coverage:',e['current_owner_blind_population']['combined_mapping_coverage'])
          print('Eligible for B44:',d['eligible_for_B44_owner_blind_reaudit'])
          if d['all_primary_gates_pass'] is not True:
              raise SystemExit('SCIENTIFIC_STOP_B43_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FAILED')
          if d['result']!='PASS_B43_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FROZEN_FOR_B44_REAUDIT':
              raise SystemExit('B43_UNEXPECTED_PASS_LABEL')
          print('PASS: B43 owner-blind identity bridge frozen for separately preregistered B44 re-audit.')
          PYFINAL
