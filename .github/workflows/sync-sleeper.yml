name: Sleeper Maintenance

on:
  # Staging mode during repository cleanup: manual only.
  # We will restore the daily schedule only after this consolidated workflow is validated.
  workflow_dispatch:
    inputs:
      task:
        description: 'What do you want to run?'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - dual-eligibility
          - team-refresh
          - all

permissions:
  contents: write

jobs:
  sync:
    name: Sync Sleeper League Data
    if: github.event.inputs.task == 'sync' || github.event.inputs.task == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run roster sync script
        run: python scripts/sync_sleeper.py
      - name: Refresh generated player-position compatibility map
        run: python scripts/generate_player_positions.py
      - name: Run trade history sync script
        run: python scripts/sync_trade_history.py
      - name: Commit and push if data changed
        run: |
          git config user.name "sleeper-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ scripts/player_positions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Sleeper data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

  dual-eligibility:
    name: Dual Eligibility Check
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'dual-eligibility' || github.event.inputs.task == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run dual eligibility pipeline
        run: python3 scripts/validation/dual_eligibility_pipeline.py
      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/dual_eligibility_results.json scripts/validation/dual_eligibility_results.json
          git diff --staged --quiet || git commit -m "Update dual eligibility results"
          git push

  team-refresh:
    name: Team Field Refresh
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'team-refresh' || github.event.inputs.task == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-test before trusting real output
        run: python3 scripts/team_field_refresh_pipeline.py --selftest
      - name: Run the refresh
        run: python3 scripts/team_field_refresh_pipeline.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/player_team_refresh.json data/players_cache.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Refresh player team data from live Sleeper pool"
          git push
