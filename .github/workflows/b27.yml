# PREFLIGHTED: B27_DRAFT_CAPITAL_OUTLOOK_V3_PHASE0A_PROSPECTIVE_SAMPLING_FRAME_NK_PREREGISTRATION
name: B27 Draft Capital Outlook V3 - Phase 0A Prospective Sampling Frame and N-K Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b27_v3_phase0a_preregistration:
    name: Freeze V3 discovery, qualification, independence, and N-K rules before new-source discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Guard permanent V2 closure and V3 preregistration-only authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("research/draft-capital-outlook-v2/b26/b26_manifest.json")
          assert p.is_file(), p
          j=json.loads(p.read_text())

          assert j["study_id"]=="draft-capital-outlook-v2"
          assert j["stage"]=="b26_manifest"
          assert j["b26_executed"] is True
          assert j["b26_execution_count_committed"]==1
          assert j["decision"]=="CLOSE_V2_PERMANENTLY_KEEP_NEUTRAL_1_00_AUTHORIZE_V3_PREREGISTRATION_ONLY"
          assert float(j["draft_capital_outlook_multiplier"])==1.0
          assert j["b25_k60_depth_mismatch_recorded"] is True
          assert j["v2_closed_permanently"] is True
          assert j["post_closure_archive_can_change_b25"] is False
          assert j["post_closure_archive_can_reopen_v2"] is False
          assert j["v2_architecture_freeze_authorized"] is False
          assert j["v2_player_identity_open_authorized"] is False
          assert j["v2_predictor_construction_authorized"] is False
          assert j["v2_predictor_target_association_authorized"] is False
          assert j["v2_2027_class_scoring_authorized"] is False
          assert j["v2_production_change_authorized"] is False
          assert j["v3_new_source_discovery_authorized_before_preregistration"] is False
          assert j["v3_preregistration_authorized"] is True

          print("PASS: V2 is permanently closed at neutral 1.00 and only prospective V3 preregistration is authorized.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Write V3 Phase 0A prospective preregistration
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/draft-capital-outlook-v3/b27
          mkdir -p research/draft-capital-outlook-v3/b27

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v3/b27")
          p=O/"b27_phase0a_preregistration.json"

          cfg={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v3",
            "stage":"b27_phase0a_prospective_sampling_frame_and_nk_preregistration",
            "created_before_any_v3_new_source_discovery":True,
            "created_before_any_v3_candidate_url_enumeration":True,
            "created_before_any_v3_player_identity_or_position_parsing":True,
            "created_before_any_v3_historical_actual_capital_open":True,
            "created_before_any_v3_predictor_target_association":True,
            "v2_status":"PERMANENTLY_CLOSED_NEUTRAL_1_00",
            "objective":"Prospectively freeze how V3 will discover and qualify independent early-season NFL mock drafts, and how predictor depth K and ensemble size N will be selected using source availability only, before discovering any new V3 candidate sources.",

            "anchor_contract":{
              "anchor_month":9,
              "anchor_day":30,
              "window_days_each_side":8,
              "class_year_to_anchor_year_rule":"anchor_year = nfl_draft_class_year - 1",
              "historical_class_years":list(range(2013,2027)),
              "prospective_2027_anchor":"2026-09-30"
            },

            "publisher_domain_frame_v1":{
              "purpose":"Frozen discovery universe. Domain inclusion does not imply source qualification.",
              "selection_basis":"Established national/general NFL publishers and specialist NFL/draft publishers known before V3 source enumeration. Frozen before any V3 candidate search, outcome opening, or player-composition inspection.",
              "domains":[
                "walterfootball.com",
                "si.com",
                "cbssports.com",
                "athlonsports.com",
                "clutchpoints.com",
                "nfl.com",
                "espn.com",
                "foxsports.com",
                "nbcsports.com",
                "sportingnews.com",
                "profootballnetwork.com",
                "usatoday.com",
                "yahoo.com",
                "bleacherreport.com",
                "pff.com",
                "theathletic.com",
                "thedraftnetwork.com",
                "sbnation.com",
                "247sports.com",
                "on3.com"
              ],
              "domain_addition_after_b27_allowed":False,
              "domain_removal_after_b27_allowed":False,
              "domain_substitution_after_b27_allowed":False
            },

            "deterministic_enumeration_protocol":{
              "candidate_union_channels_in_order":[
                {
                  "channel_id":"PUBLISHER_SITEMAP",
                  "description":"Publisher robots.txt-declared XML sitemaps plus conventional /sitemap.xml and /sitemap_index.xml endpoints for each frozen domain."
                },
                {
                  "channel_id":"INTERNET_ARCHIVE_CDX",
                  "description":"Internet Archive CDX URL index queries scoped to each frozen domain and the applicable anchor-year date window."
                },
                {
                  "channel_id":"COMMON_CRAWL_INDEX",
                  "description":"Common Crawl URL index queries scoped to each frozen domain and applicable anchor-year records."
                }
              ],
              "gating_search_engine_results_allowed":False,
              "manual_google_or_bing_discovery_allowed":False,
              "social_media_discovery_allowed":False,
              "candidate_url_text_filter":{
                "must_contain_case_insensitive_all":["draft"],
                "must_contain_case_insensitive_any":["mock","projection"],
                "class_year_token_required":True
              },
              "canonicalization":[
                "lowercase scheme and hostname",
                "remove URL fragment",
                "remove known tracking query parameters",
                "preserve content-selecting query parameters",
                "deduplicate exact canonical URLs"
              ],
              "enumeration_order":"domain frame order, then channel order, then canonical URL lexicographic order",
              "late_found_url_policy":"A URL not produced by the frozen enumeration protocol is non-gating and cannot enter the V3 predictor."
            },

            "ground_truth_source_qualification_contract":{
              "public_access":"Full relevant mock content must be viewable in a normal unauthenticated browser session without login, paid subscription, or circumvention of access controls.",
              "reproducible_capture":"At least one approved non-circumventing capture mode validated in B28 must reproduce the structural evidence needed for qualification.",
              "publisher_and_author":"Publisher domain must be in the frozen domain frame and a named individual author must be attributable from first-party page evidence.",
              "date_evidence":"Publication date must be supported by visible first-party page text or first-party page metadata such as JSON-LD/article metadata; search snippets do not count.",
              "anchor_window":"Publication date must fall within plus/minus 8 calendar days of September 30 in the anchor year.",
              "mock_type":"Must be an authored NFL mock draft with explicit selection slots; exclude big boards, prospect rankings, consensus boards, simulators, user-generated mocks, fantasy rookie mocks, and articles merely discussing another mock.",
              "explicit_slot_coverage":"Must contain unique explicit selection slots 1 through K in the rendered or first-party structured content. No inferred, imputed, or invented slots.",
              "independence":"Each included mock must have both a distinct publisher domain and a distinct named author relative to every other included mock in that class.",
              "derivative_exclusion":"Exclude syndicated/reposted copies and mocks explicitly described as derived from another included mock or consensus product.",
              "access_control_rule":"Do not spoof identity, rotate IPs, bypass authentication, defeat bot protection, or evade publisher controls."
            },

            "measurement_instrument_contract":{
              "ground_truth_is_independent_of_parser":True,
              "instrument_validation_required_before_gating_source_audit":True,
              "b28_minimum_labeled_calibration_pages":30,
              "b28_minimum_sensitivity":0.95,
              "b28_minimum_specificity":0.95,
              "b28_maximum_correction_cycles":1,
              "calibration_must_exclude_2027_anchor_window_candidates":True,
              "all_qualification_criteria_must_be_measured_symmetrically":True,
              "instrument_may_not_be_tuned_on_v3_gating_pages":True,
              "instrument_failure_cannot_be_reclassified_as_source_failure":True
            },

            "availability_only_nk_selection":{
              "candidate_K":[60,32],
              "candidate_N":[5,4,3],
              "minimum_historical_classes_required":10,
              "historical_class_years":list(range(2013,2027)),
              "selection_rule":[
                "For each K in priority order 60 then 32, count historical classes having at least 3 qualifying independent mocks at that K.",
                "Select the first K with at least 10 such historical classes.",
                "If neither K qualifies, STOP V3 permanently at neutral 1.00.",
                "At the selected K, evaluate N in priority order 5 then 4 then 3.",
                "Select the largest N for which at least 10 historical classes have at least N qualifying independent mocks.",
                "If no N qualifies, STOP V3 permanently at neutral 1.00."
              ],
              "selection_uses_only_source_availability_and_metadata":True,
              "selection_may_use_2027_source_count":False,
              "selection_may_use_player_composition":False,
              "selection_may_use_historical_actual_capital":False,
              "selection_may_use_predictor_target_association":False,
              "selection_may_use_v1_or_v2_effect_size":False
            },

            "deterministic_subset_rule_after_n_selected":{
              "applies_when_qualifying_source_count_exceeds_N_use":True,
              "sort_key":[
                "absolute calendar-day distance from September 30 ascending",
                "publication datetime ascending",
                "normalized publisher domain ascending",
                "normalized author name ascending",
                "canonical URL ascending"
              ],
              "take_first_N_use":True,
              "source_weights":"EQUAL",
              "performance_weighting_allowed":False
            },

            "future_predictor_architecture_constraints":{
              "same_construction_required_historical_and_prospective":True,
              "single_source_historical_to_ensemble_2027_transfer_allowed":False,
              "player_identity_join_across_mocks_allowed":False,
              "slot_level_position_based_construction_required":True,
              "per_mock_capital_before_ensemble_aggregation_required":True,
              "ensemble_aggregation":"arithmetic mean of per-mock capital, then natural log",
              "actual_target_depth_must_equal_selected_K":True,
              "actual_target_formula_must_match_predictor_slot_formula":True,
              "classes_below_N_use":"excluded from historical association; prospective class remains neutral 1.00",
              "imputation_allowed":False
            },

            "v3_stage_sequence":{
              "B28":"Instrument validation on a separate labeled calibration set; no 2027 anchor-window gating pages and no actual-capital outcomes.",
              "B29":"Historical 2013-2026 source-only enumeration and qualification audit; select K and N using the frozen availability-only rule.",
              "B30":"2027 prospective source-only feasibility using the already-selected K and N. If fewer than N qualify, 2027 remains neutral.",
              "B31":"Freeze exact predictor and statistical architecture before player/position construction or outcomes.",
              "B32":"Construct historical slot-position predictors and sealed 2027 predictor under the frozen architecture.",
              "B33":"Single-shot historical association test; actual capital opens for the first time.",
              "B34_plus":"Only if B33 passes its preregistered gates: calibration/shadow/display work. Production remains separately gated."
            },

            "hard_stop_rules":[
              "B28 instrument validation fails after one permitted correction cycle",
              "B29 finds fewer than 10 historical classes at K=32 with at least 3 qualifying independent mocks",
              "Any integrity violation revealing historical actual-capital outcomes before the association stage",
              "Any post-B27 addition/removal/substitution of discovery domains for gating analysis",
              "Any use of 2027 player composition or source count to choose K or N"
            ],

            "forbidden_before_B31":[
              "player-name extraction",
              "player-position extraction from V3 gating mocks",
              "2027 predictor calculation",
              "historical actual-capital outcome loading",
              "Rich Hill outcome pairing",
              "correlation",
              "regression",
              "permutation test",
              "effect-size calculation",
              "multiplier",
              "FV change",
              "production deployment"
            ],

            "b28_instrument_validation_authorized":True,
            "b29_historical_source_audit_authorized_before_b28_pass":False,
            "new_v3_candidate_source_enumeration_authorized_before_b28_pass":False,
            "player_identity_open_authorized":False,
            "predictor_construction_authorized":False,
            "historical_actual_capital_open_authorized":False,
            "predictor_target_association_authorized":False,
            "2027_class_scoring_authorized":False,
            "production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0
          }

          domains=cfg["publisher_domain_frame_v1"]["domains"]
          assert len(domains)==20
          assert len(set(domains))==20
          assert cfg["availability_only_nk_selection"]["candidate_K"]==[60,32]
          assert cfg["availability_only_nk_selection"]["candidate_N"]==[5,4,3]
          assert cfg["availability_only_nk_selection"]["minimum_historical_classes_required"]==10
          assert cfg["measurement_instrument_contract"]["ground_truth_is_independent_of_parser"] is True
          assert cfg["measurement_instrument_contract"]["instrument_may_not_be_tuned_on_v3_gating_pages"] is True
          assert cfg["new_v3_candidate_source_enumeration_authorized_before_b28_pass"] is False
          assert cfg["draft_capital_outlook_multiplier"]==1.0

          p.write_text(json.dumps(cfg,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (O/"b27_preregistration.sha256").write_text(f"{h}  {p.name}\n")

          report=[
            "# Draft Capital Outlook V3 — B27 Phase 0A Prospective Preregistration",
            "",
            "Decision: **FREEZE_V3_METHODS_AUTHORIZE_B28_INSTRUMENT_VALIDATION_ONLY**",
            "",
            "V2 remains permanently closed at neutral **1.00**. B27 does not reopen V2 and does not discover any new V3 candidate mocks.",
            "",
            "## What B27 freezes",
            "",
            "- A 20-domain publisher discovery frame.",
            "- A deterministic three-channel enumeration protocol.",
            "- Public-access, author/date, independence, non-derivative, and explicit-slot qualification rules.",
            "- Parser/instrument validation before any gating source audit.",
            "- Candidate K = {60, 32}, chosen by historical availability only.",
            "- Candidate N = {5, 4, 3}, chosen as the largest N supported by at least 10 historical classes at the selected K.",
            "- Historical and prospective predictors must use the same construction.",
            "- 2027 source count, player composition, historical outcomes, and prior effect sizes cannot influence K or N.",
            "",
            "## Immediate next authority",
            "",
            "Only **B28 instrument validation** is authorized. New V3 candidate-source enumeration remains forbidden until B28 passes.",
            "",
            "No player identities, positions, actual-capital outcomes, predictor-target associations, multipliers, or production values were opened in B27.",
          ]
          (O/"b27_report.md").write_text("\n".join(report)+"\n")

          manifest={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v3",
            "stage":"b27_manifest",
            "b27_executed":True,
            "b27_execution_count_committed":1,
            "decision":"FREEZE_V3_METHODS_AUTHORIZE_B28_INSTRUMENT_VALIDATION_ONLY",
            "publisher_domain_count":len(domains),
            "candidate_K":[60,32],
            "candidate_N":[5,4,3],
            "minimum_historical_classes_required":10,
            "b28_instrument_validation_authorized":True,
            "b29_historical_source_audit_authorized":False,
            "new_v3_candidate_source_enumeration_authorized":False,
            "player_identity_open_authorized":False,
            "predictor_construction_authorized":False,
            "historical_actual_capital_open_authorized":False,
            "predictor_target_association_authorized":False,
            "2027_class_scoring_authorized":False,
            "production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0,
            "output_hashes":{
              "b27_phase0a_preregistration.json":h,
              "b27_report.md":hashlib.sha256((O/"b27_report.md").read_bytes()).hexdigest()
            }
          }
          mp=O/"b27_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          files=[p,O/"b27_report.md",mp]
          (O/"b27_hashes.sha256").write_text(
              "".join(f"{hashlib.sha256(x.read_bytes()).hexdigest()}  {x.name}\n" for x in files)
          )

          print(json.dumps(manifest,indent=2))
          PY

      - name: Audit B27 no-discovery and no-outcome firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v3/b27")
          P=json.loads((O/"b27_phase0a_preregistration.json").read_text())
          M=json.loads((O/"b27_manifest.json").read_text())

          assert P["created_before_any_v3_new_source_discovery"] is True
          assert P["created_before_any_v3_candidate_url_enumeration"] is True
          assert P["created_before_any_v3_historical_actual_capital_open"] is True
          assert P["b28_instrument_validation_authorized"] is True
          assert P["b29_historical_source_audit_authorized_before_b28_pass"] is False
          assert P["new_v3_candidate_source_enumeration_authorized_before_b28_pass"] is False
          assert P["player_identity_open_authorized"] is False
          assert P["predictor_construction_authorized"] is False
          assert P["historical_actual_capital_open_authorized"] is False
          assert P["predictor_target_association_authorized"] is False
          assert P["2027_class_scoring_authorized"] is False
          assert P["production_change_authorized"] is False
          assert float(P["draft_capital_outlook_multiplier"])==1.0

          assert M["decision"]=="FREEZE_V3_METHODS_AUTHORIZE_B28_INSTRUMENT_VALIDATION_ONLY"
          assert M["publisher_domain_count"]==20
          assert M["candidate_K"]==[60,32]
          assert M["candidate_N"]==[5,4,3]
          assert M["minimum_historical_classes_required"]==10
          assert M["new_v3_candidate_source_enumeration_authorized"] is False
          assert M["draft_capital_outlook_multiplier"]==1.0

          # B27 is intentionally documents-only: no network retrieval tools or URLs
          # are executed in this workflow after the repository checkout.
          workflow=Path(".github/workflows/b27.yml").read_text().lower()
          forbidden_exec=[
              "requests.get(",
              "session.get(",
              "curl http",
              "wget http",
              "playwright",
              "selenium",
              "rich_hill_pick_values",
              "actual_top60",
          ]
          for token in forbidden_exec:
              assert token not in workflow, token

          print("PASS: B27 froze V3 methods without source enumeration, player parsing, outcome opening, scoring, or production authority.")
          PY

      - name: Run repository regression after B27 artifacts
        shell: bash
        run: |
          set -euo pipefail

          ROOT="research/draft-capital-outlook-v3/b27"
          PRESERVE_DIR="$(mktemp -d)"
          PRESERVE_ARCHIVE="$PRESERVE_DIR/b27.tar"

          tar -C "$ROOT" -cf "$PRESERVE_ARCHIVE" .

          restore_b27() {
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            tar -C "$ROOT" -xf "$PRESERVE_ARCHIVE"
            rm -rf "$PRESERVE_DIR"
          }
          trap restore_b27 EXIT

          python3 scripts/validation/repo_regression_checks.py

          restore_b27
          trap - EXIT

      - name: Commit B27 V3 preregistration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v3/b27
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No B27 changes to commit."
            exit 1
          fi
          git commit -m "B27 preregister Draft Capital Outlook V3 methods"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final clean-state confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B27 complete. Only B28 instrument validation is authorized next."
