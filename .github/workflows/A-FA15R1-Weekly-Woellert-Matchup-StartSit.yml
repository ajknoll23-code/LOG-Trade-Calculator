          mark_js='<!-- FA_WOELLERT_MATCHUP_V1_SCRIPT -->'
          css = mark_css + '<link rel="stylesheet" href="assets/fa_matchup_private_v1.css?v=1">\n'
          js = mark_js + '<script src="assets/fa_matchup_private_v1.js?v=1" defer></script>\n'
          if mark_css in current or mark_js in current:
              assert current.count(mark_css)==1 and current.count(mark_js)==1, 'Partial installation detected'
              assert current.count(css)==1 and current.count(js)==1, 'Existing markup differs; manual review required'
              proposed = current
          else:
              assert 'assets/fa_matchup_private_v1.js' not in current and 'assets/fa_matchup_private_v1.css' not in current, 'Unrecognized previous installation'
              proposed = current.replace('</head>', css+'</head>',1).replace('</body>',js+'</body>',1)
              assert proposed.replace(css,'',1).replace(js,'',1) == current, 'Non-additive HTML modification'
              page.write_text(proposed,encoding='utf-8')
          assert proposed.count(mark_css)==1 and proposed.count(mark_js)==1
          assert proposed.count('assets/fa_start_sit_v1.js')==1
          # Guard against prohibited subscriber data in the workflow-generated public assets.
          public_js=Path('assets/fa_matchup_private_v1.js').read_text()
          assert 'PRIVATE_USER_PROVIDED_MATCHUP_REFERENCE_NOT_FOR_PUBLIC_GITHUB' in public_js
          assert 'BUF' not in public_js or "'BUF'" in public_js  # NFL code identifiers are allowed, but no stat rows.
          assert len(public_js)<32000, 'Unexpectedly large module'
          PYCODE
          node --check assets/fa_matchup_private_v1.js
          git diff --check
          python3 - <<'PYCODE'
          import subprocess
          allowed={'free-agent-board.html','assets/fa_matchup_private_v1.js','assets/fa_matchup_private_v1.css'}
          changes=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          paths={line[3:] for line in changes if line.strip()}
          assert paths.issubset(allowed), 'Unexpected files modified: '+str(paths-allowed)
          print('PASS: public-only matchup UI installed; no valuation or research files changed')
          print('Changed files:',sorted(paths))
          PYCODE
      - name: Preview changes
        if: ${{ inputs.mode == 'preview' }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          echo 'PREVIEW GREEN — no files committed'
      - name: Apply approved UI files
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- free-agent-board.html assets/fa_matchup_private_v1.js assets/fa_matchup_private_v1.css
          if git diff --cached --quiet; then
            echo 'Already installed: no new commit needed.'
          else
            git commit -m 'A-FA15R1: add browser-private weekly IDP matchup evidence to start sit'
            git push origin HEAD:main
          fi
