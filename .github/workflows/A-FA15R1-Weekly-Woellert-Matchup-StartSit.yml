name: A-FA15R1 - Woellert Private Weekly Matchup Evidence

# Public code only. No paid/subscriber matchup numbers or rankings are stored here.
# The owner's matchup tables are imported and retained privately by the browser.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview checks the UI additions; Apply commits only the approved files"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  matchup-evidence:
    name: Install private matchup evidence (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
