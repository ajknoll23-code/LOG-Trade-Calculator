name: A-NL63R1 - Owner-Controlled Private Newsletter Release
run-name: A-NL63R1 - Verify or publish approved W09/W10 PRIVATE PDFs
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = QA only; publish = create private GitHub Release'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - publish
      approval_phrase:
        description: 'PUBLISH ONLY: enter PUBLISH APPROVED W9 AND W10'
        required: false
        type: string
        default: ''
      history_exception_phrase:
        description: 'PUBLISH ONLY: enter I ACCEPT MISSING HISTORY FOR W9 AND W10 ONLY'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: log-nl63r1-private-owner-release
  cancel-in-progress: false
jobs:
  validate:
    name: Confirm owner, exact approved PDFs, 12 articles and frozen appendices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PRIVATE newsletter repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF validation library
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5'
      - name: Restore exact owner-approved release validator
        shell: bash
        run: |
          set -euo pipefail
          cat > nl63_publisher.py <<'NL63_VALIDATOR'
          #!/usr/bin/env python3
          """One-time LOG private owner-controlled publishing bootstrap, 2026 W9/W10 only.

          No network, no data mutation, and no release via this script. Works in private repo.
          GitHub workflow enforces actor + exact manual confirmation before gh release.
          """
          import argparse
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          import fitz

          BASE = Path('releases/2026/W10-W09')
          APPROVED_PDF = {
              'Aftermath': (9, 'Week9-Aftermath-OWNER-APPROVED.pdf', 'd245e75afdfbfaf53b16c731ad0b2ee6b1fae1aa4413ec1ec7847edac301127c'),
              'War Room': (10, 'Week10-WarRoom-OWNER-APPROVED.pdf', '48e3bd62e8f77e4b7e55e3e43fea17f42bb682b5f91607afb082f764bdbfc1e5'),
          }
          PAYLOAD_SHA = '6b2bc08a7fe5e9f950ea29e22787d9a9fa58321c9da42cb6b6998122c5f4b85b'
          METADATA_SHA = '237dc331919fbb86e806da9297cde4377c9c3bba7977fadf9274729bb46bfc9b'
          EXPECTED_GAPS = {'Aftermath':[5,6,7], 'War Room':[6,7,8]}
          OWNER = 'ajknoll23-code'
          REPO = OWNER+'/LOG-Newsletter-Private'
          APPROVAL = 'PUBLISH APPROVED W9 AND W10'
          EXCEPTION = 'I ACCEPT MISSING HISTORY FOR W9 AND W10 ONLY'

          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def canonical(obj):return json.dumps(obj,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          def load(name):return json.loads((BASE/name).read_text('utf-8'))
          def require(ok,why):
              if not ok:raise ValueError(why)

          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--mode',choices=['verify','publish'],required=True)
              p.add_argument('--approval',default='')
              p.add_argument('--history-exception',default='')
              p.add_argument('--out',default='nl63_qa')
              args=p.parse_args()
              repo=os.environ.get('GITHUB_REPOSITORY',REPO)
              require(repo==REPO,'Private repository identity mismatch')
              if os.getenv('GITHUB_ACTIONS')=='true':
                  require(os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch','Manual GitHub workflow dispatch required')
                  require(os.environ.get('GITHUB_REF')=='refs/heads/main','Only main branch can run this workflow')
              require(os.environ.get('GITHUB_ACTOR',OWNER)==OWNER,'Only repository owner can run newsletter release')
              require(BASE.is_dir(),'Missing approved private newsletter directory')
              approval=load('approval.json'); payload=load('approved-articles.json');meta=load('article-metadata.json')
              require(approval.get('schema')=='LOG.NL62.OWNER_APPROVAL.v1','Invalid owner approval manifest schema')
              require(approval.get('approval_state')=='OWNER_APPROVED_FOR_EDITORIAL_REFERENCE_ONLY','Wrong approval manifest state')
              require(approval.get('release_authorized') is False and approval.get('owner_approval_signed') is False,'Owner approval manifest has unexpected release flags')
              require(approval.get('cold_start_exception') is None,'Unexpected pre-existing exception in private manifest')
              require(approval.get('editorial_mix')==[75,15,10],'Approved editorial mix changed')
              require(approval.get('payload_sha256')==PAYLOAD_SHA and sha(canonical(payload))==PAYLOAD_SHA,'Approved JSON fingerprint mismatch')
              require(approval.get('metadata_sha256')==METADATA_SHA and sha(canonical(meta))==METADATA_SHA,'Editorial metadata fingerprint mismatch')
              require(payload.get('schema')=='LOG.NL61.PRIVATE_OWNER_APPROVED_EDITORIAL.v1' and payload.get('editorial_mix')==[75,15,10],'Wrong editorial schema')
              require(payload.get('owner_review')=='APPROVED_SHARED_PDFS' and payload.get('release_authorized') is False,'Editorial source not owner-approved reference')
              require(meta.get('schema')=='LOG.NL62.ARTICLE_METADATA.v1','Wrong article metadata schema')
              require(len(payload.get('issues',[]))==len(meta.get('issues',[]))==len(approval.get('issues',[]))==2,'Expected exactly two complete issues')
              actual={(x['edition'],x['week']):x for x in payload['issues']}
              manifest={(x['edition'],x['week']):x for x in approval['issues']}
              extra={(x['edition'],x['week']):x for x in meta['issues']}
              expected={(edition,entry[0]) for edition,entry in APPROVED_PDF.items()}
              require(set(actual)==set(manifest)==set(extra)==expected,'Issue metadata/wk mismatch')
              results=[]
              for edition,(week,filename,pdf_hash) in APPROVED_PDF.items():
                  issue=actual[edition,week]
                  require(issue.get('pdf_sha256')==pdf_hash and manifest[edition,week].get('pdf_sha256')==pdf_hash,'Approved PDF reference SHA changed')
                  require(len(issue.get('articles',[]))==6 and [a.get('number') for a in issue['articles']]==list(range(1,7)),'Missing or misnumbered original editorial')
                  require(len(extra[edition,week].get('articles',[]))==6,'Missing original editorial metadata')
                  path=BASE/filename
                  require(path.is_file() and sha(path.read_bytes())==pdf_hash,f'Approved {edition} PDF checksum mismatch')
                  with fitz.open(path) as pdf:
                      require(len(pdf)==11,f'{edition}: not 11 pages')
                      require('WEEK '+str(week) in pdf[0].get_text(),f'{edition}: incorrect issue cover')
                      body=' '.join(pg.get_text() for pg in pdf)
                      require('POSITIONAL SCORING LEADERS' not in body,f'{edition}: removed section returned')
                      require(not re.search(r'(?i)free.agent.*(ranking|scouting|target)',body),f'{edition}: possible private FA section')
                      for i in range(1,7):
                          text=pdf[i].get_text()
                          require(f'MATCHUP {i:02d} / 06' in text,f'{edition}: article {i} missing')
                          require('SOURCE ' in text,f'{edition}: missing article provenance')
                      for page_i,marker in [(7,'POWER RANKINGS / V7'),(8,'POWER RANKINGS / V7'),(9,'OFFENSIVE POWERHOUSES'),(10,'DEFENSIVE POWERHOUSES')]:
                          require(marker in pdf[page_i].get_text(),f'{edition}: stats appendix identity changed')
                  results.append({'edition':edition,'week':week,'filename':filename,'pdf_sha256':pdf_hash,
                                  'page_count':11,'article_count':6,'appendix_count':4,'approved_pdf_identity':'PASS'})
              if args.mode=='publish':
                  require(args.approval==APPROVAL,'Explicit owner publication confirmation missing')
                  require(args.history_exception==EXCEPTION,'Explicit W9/W10-only history exception missing')
                  require(os.getenv('GITHUB_ACTIONS')=='true','Publish requires authenticated GitHub workflow dispatch')
              else:
                  require(not args.approval and not args.history_exception,'Verify-only run must leave approval fields blank')
              out=Path(args.out);out.mkdir(parents=True,exist_ok=True)
              audit={'schema':'LOG.NL63.PRIVATE_RELEASE_AUDIT.v1','repository':REPO,'actor':os.environ.get('GITHUB_ACTOR',OWNER),
                     'source_commit':os.environ.get('GITHUB_SHA','local_test'), 'mode':args.mode,
                     'publication_authorized':args.mode=='publish', 'historical_cold_start_acknowledged':args.mode=='publish',
                     'cold_start_exception':{'scope':'OWNER_APPROVED_2026_W9_AFTERMATH_AND_W10_WAR_ROOM_ONLY','missing_prior_weeks':EXPECTED_GAPS,
                         'source':'AUTHENTICATED_OWNER_WORKFLOW_DISPATCH','not_a_cryptographic_signature':True} if args.mode=='publish' else None,
                     'approval_provenance':'OWNER_APPROVED_PDFS+PINNED_SHA256+MANUAL_DISPATCH',
                     'private_repo':True, 'public_artifact_uploaded':False,'issue_results':results,
                     'future_weeks_not_authorized':True, 'legacy_NL47_changed':False}
              (out/'NL63R1-RELEASE-AUDIT.json').write_text(json.dumps(audit,indent=2)+'\n','utf-8')
              notes = ("# LOG — Owner-approved 2026 newsletters\n\n"
                       "**Week 9 Aftermath** and **Week 10 War Room**. Both 11-page PDFs are "
                       "byte-identical to their approved references.\n\n"
                       "No newly generated editorial copy is authorized by this release. "
                       "V7 and offense/IDP pages remain unchanged.\n\n"
                       "The private owner explicitly acknowledged a limited historical cold start: "
                       "Aftermath W5-W7 and War Room W6-W8 remain unarchived. "
                       "This exception applies **only to these two already-approved editions**.\n\n"
                       "Future weekly issues must satisfy the complete originality and owner-approval gates.\n")
              (out/'NL63R1-RELEASE-NOTES.md').write_text(notes,'utf-8')
              print('PASS NL63:',args.mode,'2 approved 11-page PDFs, 12 articles, 8 V7/score pages, exact SHA256 identities')
              print('Missing historical weeks acknowledged:', args.mode=='publish', '; scope is W9/W10 only')
              return audit
          if __name__=='__main__':main()
          NL63_VALIDATOR
          actual=$(sha256sum nl63_publisher.py | awk '{print $1}')
          test "$actual" = "7beeba84ccec685314464941b8497013dee8ebcb69f2131199d19cfd4bac13e9" || { echo 'NL63 engine checksum mismatch'; exit 1; }
          python -m py_compile nl63_publisher.py
      - name: Enforce original PDF hashes, one-time exception and owner confirmation
        shell: bash
        env:
          NL63_MODE: ${{ inputs.mode }}
          NL63_APPROVAL: ${{ inputs.approval_phrase }}
          NL63_EXCEPTION: ${{ inputs.history_exception_phrase }}
        run: |
          set -euo pipefail
          python nl63_publisher.py --mode "$NL63_MODE" --approval "$NL63_APPROVAL" --history-exception "$NL63_EXCEPTION" --out nl63_qa
          test -s nl63_qa/NL63R1-RELEASE-AUDIT.json
      - name: Archive PRIVATE QA evidence and validated engine for same-run publishing
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL63R1-PRIVATE-VERIFICATION-${{ github.run_id }}
          path: |
            nl63_publisher.py
            nl63_qa/NL63R1-RELEASE-AUDIT.json
            nl63_qa/NL63R1-RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 90
      - name: Summarize verification and approval boundary
        shell: bash
        env:
          NL63_MODE: ${{ inputs.mode }}
        run: |
          echo '## LOG NL63 - Verified private source PDFs' >> "$GITHUB_STEP_SUMMARY"
          echo '- Week 9 Aftermath: approved 11-page PDF, immutable SHA256 checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Week 10 War Room: approved 11-page PDF, immutable SHA256 checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- 12 editorial articles, frozen V7 and offense/IDP pages' >> "$GITHUB_STEP_SUMMARY"
          if [ "$NL63_MODE" = verify ]; then
            echo '- **QA ONLY: no PDFs published and missing history remains blocked.**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- **Owner explicitly approved W9/W10 only with scoped historical cold-start exception.**' >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    name: Create PRIVATE release only after explicit owner approval and cold-start acknowledgement
    if: ${{ needs.validate.result == 'success' && inputs.mode == 'publish' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout PRIVATE approved source PDFs
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified same-run engine and audit
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL63R1-PRIVATE-VERIFICATION-${{ github.run_id }}
          path: .
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF validation library
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5'
      - name: Revalidate everything on the publishing job before private release
        shell: bash
        env:
          NL63_APPROVAL: ${{ inputs.approval_phrase }}
          NL63_EXCEPTION: ${{ inputs.history_exception_phrase }}
        run: |
          set -euo pipefail
          actual=$(sha256sum nl63_publisher.py | awk '{print $1}')
          test "$actual" = "7beeba84ccec685314464941b8497013dee8ebcb69f2131199d19cfd4bac13e9" || { echo 'Validator checksum changed'; exit 1; }
          python nl63_publisher.py --mode publish --approval "$NL63_APPROVAL" --history-exception "$NL63_EXCEPTION" --out nl63_final
      - name: Publish two byte-identical PDFs as assets of a PRIVATE GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='log-newsletters-2026-w09-w10-owner-approved'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing duplicate publication.' >&2
            exit 1
          fi
          gh release create "$tag" \
            'releases/2026/W10-W09/Week9-Aftermath-OWNER-APPROVED.pdf#LOG-W09-Aftermath-Approved.pdf' \
            'releases/2026/W10-W09/Week10-WarRoom-OWNER-APPROVED.pdf#LOG-W10-WarRoom-Approved.pdf' \
            'nl63_final/NL63R1-RELEASE-AUDIT.json#NL63R1-Release-Audit.json' \
            --title 'LOG - Approved Week 9 Aftermath and Week 10 War Room' \
            --notes-file nl63_final/NL63R1-RELEASE-NOTES.md \
            --target "$GITHUB_SHA"
          echo "Private release created: $tag" >> "$GITHUB_STEP_SUMMARY"
          echo 'No PDF was published to the public calculator repository.' >> "$GITHUB_STEP_SUMMARY"
