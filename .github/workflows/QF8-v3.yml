# QF8 A5-F02 — independently recheck EXACT V2R1-reviewed index.html, then owner-only promotion.
# Default preflight has read-only permissions; only separately confirmed promote can write main.
# QF8 Phase 0 Green 38151611764; QF8 V2R1 review Green 38154408279.
name: QF8 V3 - Dual Eligibility Production Preflight and Explicit Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight runs all guards without writing; promote requires separate manual dispatch'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - promote
      confirmation:
        description: 'For promote only: type PROMOTE_QF8_A5F02_ONE_FILE_TO_MAIN'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF8_TMP: '/tmp/log-qf8-v3'
  QF8_REVIEW_BRANCH: 'qf8-a5f02-v2-secondary-eligibility-review-2026-10-11'
  QF8_REVIEW_SHA: 'e9f4865b9a42cf315c9a2e83cf286825bcbb15fd'
  QF8_REVIEW_PARENT: '39431641a6ed4cb6a44c02572829530a0b9506e0'
  QF8_ORIGINAL_INDEX: 'f406c5dac446909384d1619f185d7bdf7de99368'
  QF8_REVIEWED_INDEX: '93684a734efb0bbc47b6c29cb5b4e859adcd3d1d'
  QF8_MODE: ${{ inputs.mode }}
  QF8_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  preflight:
    name: Independently validate reviewed one-file change and regressions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout triggering main exactly, without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression and browser test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Independently pin main, immutable candidate, and one-file scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QF8_MODE" == 'preflight' || "$QF8_MODE" == 'promote' ]] || { echo 'STOP unsupported mode'; exit 1; }
          if [[ "$QF8_MODE" == 'promote' ]]; then
            [[ "$QF8_CONFIRMATION" == 'PROMOTE_QF8_A5F02_ONE_FILE_TO_MAIN' ]] || { echo 'STOP missing explicit promotion confirmation'; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP changed checkout'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/${QF8_REVIEW_BRANCH}:refs/remotes/origin/${QF8_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved'; exit 1; }
          [[ "$(git rev-parse origin/${QF8_REVIEW_BRANCH})" == "$QF8_REVIEW_SHA" ]] || { echo 'STOP review branch moved'; exit 1; }
          [[ "$(git show -s --format=%P "$QF8_REVIEW_SHA")" == "$QF8_REVIEW_PARENT" ]] || { echo 'STOP candidate has wrong parent'; exit 1; }
          git merge-base --is-ancestor "$QF8_REVIEW_PARENT" "$GITHUB_SHA" || { echo 'STOP main lacks reviewed parent ancestry'; exit 1; }
          [[ "$(git rev-parse "$QF8_REVIEW_SHA:index.html")" == "$QF8_REVIEWED_INDEX" ]] || { echo 'STOP candidate blob mismatch'; exit 1; }
          [[ "$(git hash-object index.html)" == "$QF8_ORIGINAL_INDEX" ]] || { echo 'STOP deployed index changed since QF6'; exit 1; }
          [[ "$(git diff --name-only "$QF8_REVIEW_PARENT" "$QF8_REVIEW_SHA")" == 'index.html' ]] || { echo 'STOP reviewed diff not one index.html file'; exit 1; }
          [[ "$(git diff --numstat "$QF8_REVIEW_PARENT" "$QF8_REVIEW_SHA")" == $'119\t1\tindex.html' ]] || { echo 'STOP reviewed change size drift'; exit 1; }
          guard_blob(){ local actual; actual="$(git hash-object "$1")"; [[ "$actual" == "$2" ]] || { echo "STOP protected $1 drift actual=$actual"; exit 1; }; }
          guard_blob scripts/team_utility_projection_runtime.js '1620edf05e56a56b4a874c71b32777a443422de5'
          guard_blob scripts/validation/repo_regression_checks.py '5191e1160c966ed14401b70c86c6f63808e1265d'
          guard_blob free-agent-board.html '975efe51091a2315475678a9db0842b05c4fc3aa'
          guard_blob scripts/validation/validate_free_agent_valuation_parity.py 'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'
          guard_blob data/free_agent_utility_v1.json '557b8010082a87113ecf9d5574af108f3044a1e7'
          guard_blob model/releases/free-agent-production-v2/release.json '75c9665c0493d8ac4900479b6802c807aaa45633'
          guard_blob .github/workflows/QF8-v2r1.yml '76f66e5910a14964f605f8fc1004eb5e4b4a1255'
          guard_blob data/my_roster.json '4b67e08f6c304d9d1e8cda494785875768753532'
          guard_blob data/league_rosters.json '703ef1f651fc3debad9154001554264cd28086dd'
          guard_blob scripts/sync/sync_sleeper.py '702ef3ecb4daa18bfc8d37ebdef11b927f90e206'
          echo 'PASS QF8 V3 exact approved review ancestry, source/allowlist and protected blob pins'
      - name: Stage exact QF8-reviewed index.html in disposable checkout, never main
        shell: bash
        run: |
          set -euo pipefail
          git show "${QF8_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "$QF8_REVIEWED_INDEX" ]] || exit 1
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP staged unexpected file'; exit 1; }
          git diff --check
          echo 'PASS exact reviewed index.html staged locally only'
      - name: Prepare independent source+browser regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$QF8_TMP"
          cat > "$QF8_TMP/qa.js" <<'QF8_V3_QA_JS'
          'use strict';
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const league=JSON.parse(fs.readFileSync('data/league_rosters.json','utf8'));
          const mine=JSON.parse(fs.readFileSync('data/my_roster.json','utf8'));
          function section(a,b){
           const i=html.indexOf(a);assert(i>=0,'missing '+a);assert.equal(html.indexOf(a,i+1),-1,'duplicate anchor '+a);
           const j=html.indexOf(b,i+a.length);assert(j>i,'missing end '+b);return html.slice(i,j);
          }
          const source=[
           section('function normalizePos(sleeperPos){','/* Dual-eligible players'),
           section('/* QF8_A5F02_VERIFIED_SECONDARY_ELIGIBILITY_V1\n','function mergeLiveRoster(data){'),
           section('const TU_DEDICATED_SLOTS = [','/* Trade-level wrapper:'),
           section('function qf6LineupCompleteness(keys){','function qf6ShowLineupWarning('),
          ].join('\n');
          const sandbox=vm.createContext({console,Set,Map});
          vm.runInContext(`let PLAYER_DB={};function playerValueByKey(k){return PLAYER_DB[k]?.value ?? null;}`+source,sandbox,{timeout:10000});
          function run(js){return vm.runInContext(js,sandbox,{timeout:10000});}
          function json(x){return JSON.stringify(x);}
          const active=[];
          for(const r of league.rosters)for(const slot of ['starters','bench'])for(const p of r[slot])
           if(p.fantasy_positions?.includes('DL')&&p.fantasy_positions?.includes('LB'))active.push(p);
          assert(active.length>20,'no enough independent current dual player IDs');
          const dual=active.find(p=>p.fantasy_positions[0]==='DL');assert(dual);
          console.log('PASS real Sleeper ID-verified DL/LB metadata count='+active.length+' sample='+dual.name);
          assert.equal(run('TU_ACTIVE_ROSTER_LIMIT'),41);assert.equal(run('TU_BENCH_WEIGHT'),0.15);
          const primary=['QB','QB','RB','RB','RB','WR','WR','TE','DL','DL','DL','DL','DL','LB','DB','DB','K'];
          assert.equal(primary.length,17);
          const keys=primary.map((_,i)=>`qf8_fixture_${i}`);
          const fixture=primary.map((pos,i)=>({key:keys[i],pos,value:4000-50*i}));
          run(`PLAYER_DB=Object.fromEntries(${json(fixture)}.map(p=>[p.key,{pos:p.pos,value:p.value}]))`);
          let original=run(`tuOptimizeLineup(tuPlayersFromKeys(${json(keys)}))`);
          assert.equal(original.starters.length,16,'baseline expected incomplete');
          assert.equal(run(`qf6LineupCompleteness(${json(keys)}).filled`),16);
          assert.equal(run(`tuPlayersFromKeys(${json(keys)}).every(p=>!('eligible' in p))`),true);
          console.log('PASS no verified multi-eligibility uses unchanged single-primary optimizer and QF6 warning');
          run(`qf8RecordEligibility(${json(dual)},${json(keys[12])},true)`);
          let players=run(`tuPlayersFromKeys(${json(keys)})`);
          assert.equal(players.length,17);
          assert.equal(players[12].pos,'DL');assert.deepEqual(Array.from(players[12].eligible),['DL','LB']);
          const actual=run(`tuOptimizeLineup(tuPlayersFromKeys(${json(keys)}))`);
          assert.equal(actual.starters.length,17,'missing legally usable secondary LB');
          assert.equal(new Set(Array.from(actual.starters,p=>p.key)).size,17,'duplicate usage');
          assert.equal(run(`qf6LineupCompleteness(${json(keys)}).filled`),17);
          assert.equal(run(`qf6LineupCompleteness(${json(keys)}).missing.length`),0);
          assert.equal(run(`playerValueByKey(${json(keys[12])})`),fixture[12].value,'valuation changed from secondary position');
          assert.equal(actual.starters.find(p=>p.key===keys[12]).qf8Slot,'LB');
          console.log('PASS controlled 17/17 legally filled by verified DL/LB while primary FV position remains DL; QF6 warning clear');
          // Independent maximum bipartite matcher, separate from Hungarian implementation.
          const starterSlots=Array.from(run('qf8ExpandedStarterSlots()'),p=>({name:p.name,eligible:Array.from(p.eligible)}));
          function maxFill(pool){
           const who=Array(pool.length).fill(-1);
           function match(si,seen){for(let j=0;j<pool.length;j++){
            if(seen.has(j)||!pool[j].eligible.some(x=>starterSlots[si].eligible.includes(x)))continue;
            seen.add(j);if(who[j]<0||match(who[j],seen)){who[j]=si;return true;}
           }return false;}
           let n=0;for(let i=0;i<starterSlots.length;i++)if(match(i,new Set()))n++;return n;
          }
          assert.equal(maxFill(fixture.map((p,i)=>({...p,eligible:i===12?['DL','LB']:[p.pos]}))),17);
          assert.equal(maxFill(fixture.map(p=>({...p,eligible:[p.pos]}))),16);
          console.log('PASS independent legal matching oracle 17/17 vs 16/17 single-only fixture');
          const currentVal=run(`calculateTeamUtility(${json(keys)},${json(keys)})`);
          assert.equal(currentVal.teamUtility,0);
          const active41=keys.concat(Array.from({length:24},(_,i)=>`qf8_bench_${i}`));
          const additional=Array.from({length:24},(_,i)=>({key:`qf8_bench_${i}`,pos:'RB',value:120-i}));
          run(`Object.assign(PLAYER_DB,Object.fromEntries(${json(additional)}.map(p=>[p.key,{pos:p.pos,value:p.value}])))`);
          const expanded=active41.concat(['incoming_a','incoming_b']);
          run(`PLAYER_DB.incoming_a={pos:'WR',value:65};PLAYER_DB.incoming_b={pos:'WR',value:75}`);
          const pre=run(`tuOptimizeLegalRoster(tuPlayersFromKeys(${json(active41)}))`);
          const post=run(`tuOptimizeLegalRoster(tuPlayersFromKeys(${json(expanded)}))`);
          assert.equal(pre.rosterSize,41);assert.equal(post.rosterSize,41);assert.equal(post.cuts.length,2);
          assert.equal(post.starters.length,17);assert.equal(new Set(Array.from(post.starters,p=>p.key)).size,17);
          const utility=run(`calculateTeamUtility(${json(active41)},${json(expanded)})`);
          assert.equal(utility.postCuts.length,2);
          assert.equal(utility.rosterLimit,41);
          console.log('PASS 17 starters, 41 active cap, two projected cuts, 85/15 weighting unchanged');
          // Source ID conflict cannot turn into secondary eligibility for an ambiguous name.
          const victim='collision_fixture';
          run(`PLAYER_DB[${json(victim)}]={pos:'DL',value:500}`);
          run(`qf8RecordEligibility({name:'Collision',player_id:'101',fantasy_positions:['DL','LB']},${json(victim)},true)`);
          assert.equal(run(`tuPlayersFromKeys([${json(victim)}])[0].eligible.length`),2);
          run(`qf8RecordEligibility({name:'Collision',player_id:'202',fantasy_positions:['DL','LB']},${json(victim)},true)`);
          assert.equal(run(`tuPlayersFromKeys([${json(victim)}])[0].eligible`),undefined);
          run(`qf8RecordEligibility({name:'Collision',player_id:'101',fantasy_positions:['DL','LB']},${json(victim)},true)`);
          assert.equal(run(`tuPlayersFromKeys([${json(victim)}])[0].eligible`),undefined);
          run(`PLAYER_DB.unverified={pos:'DL',value:550};qf8RecordEligibility({name:'Unknown',player_id:'999',fantasy_positions:['DL','LB']},'unverified',false)`);
          assert.equal(run('tuPlayersFromKeys(["unverified"])[0].eligible'),undefined);
          console.log('PASS invalid/unverified metadata and same-name different-ID collision fail closed');
          // No drift in external valuation or marketplace code.
          assert(html.includes('const TU_BENCH_WEIGHT = 0.15;'));
          assert.equal((html.match(/QF8_A5F02_VERIFIED_SECONDARY_ELIGIBILITY_V1/g)||[]).length,2);
          assert.equal((html.match(/QF8_A5F02_FLEXIBLE_LINEUP_MATCHER_V1/g)||[]).length,2);
          console.log('QF8_V2_QA_PASS: real-source legal eligibility, no valuation rewrite, single-pos continuity, 17/41 limits, QF6 alignment');
          QF8_V3_QA_JS
          cat > "$QF8_TMP/browser.py" <<'QF8_V3_BROWSER_PY'
          """Headless browser verifies the real, patched index.html for QF8 review only."""
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from pathlib import Path
          import threading
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          class Quiet(SimpleHTTPRequestHandler):
           def log_message(self,*args): pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(Path.cwd())))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          opts=Options()
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1365,960'):opts.add_argument(arg)
          try:
           with webdriver.Chrome(options=opts) as driver:
            driver.set_page_load_timeout(45)
            driver.get(f'http://127.0.0.1:{server.server_port}/index.html')
            WebDriverWait(driver,25).until(lambda d:d.execute_script('return typeof qf8FlexibleLineup=== "function" && typeof tuOptimizeLineup === "function" && typeof qf6LineupCompleteness === "function"'))
            data=driver.execute_script('''
              const pos=['QB','QB','RB','RB','RB','WR','WR','TE','DL','DL','DL','DL','DL','LB','DB','DB','K'];
              const keys=pos.map((_,i)=>'qf8_browser_'+i);
              for(let i=0;i<keys.length;i++)PLAYER_DB[keys[i]]={pos:pos[i],age:25,role:'Starter',value:1000-i*25};
              // Test the actual loaded matcher with isolated fixture FV; never rewrite real player values.
              const hypothetical=pos.map((p,i)=>({key:keys[i],pos:p,value:2000-i*10}));
              const before=tuOptimizeLineup(hypothetical);
              const withEligibility=hypothetical.map((p,i)=>i===12?{...p,eligible:['DL','LB']}:p);
              const after=tuOptimizeLineup(withEligibility);
              const slots=qf8ExpandedStarterSlots();
              const assigned=new Set(after.starters.map(p=>p.key));
              const slotNames=after.starters.map(p=>p.qf8Slot);
              return {before:before.starters.length,after:after.starters.length,
                secondary:after.starters.find(p=>p.key===keys[12])?.qf8Slot,
                unique:assigned.size,positions:slots.length,
                hidden:!!document.querySelector('.td-retired-team-impact')?.hidden,
                weight:TU_BENCH_WEIGHT,limit:TU_ACTIVE_ROSTER_LIMIT};
            ''')
            assert data['before']==16 and data['after']==17 and data['secondary']=='LB',data
            assert data['unique']==17 and data['positions']==17 and data['hidden'],data
            assert data['weight']==0.15 and data['limit']==41,data
            print('PASS QF8 browser real index: verified-DL/LB-style fixture fills 17/17 vs 16/17; no duplicate starters; hidden B56 unchanged')
          finally:
           server.shutdown();server.server_close()
          QF8_V3_BROWSER_PY
          node --check "$QF8_TMP/qa.js"
          python3 - <<'PY_CHECK'
          import ast,os
          from pathlib import Path
          ast.parse((Path(os.environ['QF8_TMP'])/'browser.py').read_text())
          print('PASS independent QF8 V3 QA program syntax')
          PY_CHECK
      - name: Validate staged dual eligibility and independent legal matching, 17 starters and 41 cap
        shell: bash
        run: |
          set -euo pipefail
          node "$QF8_TMP/qa.js"
          node scripts/team_utility_projection_runtime.js --selftest
          python3 scripts/projections/build_team_utility_lineup_projections.py --check
      - name: Verify rendered Chrome dual eligibility, unique starters and hidden legacy panel
        shell: bash
        run: |
          set -euo pipefail
          python3 "$QF8_TMP/browser.py"
      - name: Run all 14 repo regression groups plus frozen parity and package guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 - <<'PY_IDP'
          import sys
          sys.path.insert(0,'scripts/validation')
          import validate_idp_v1_final_deployment as guard
          result=guard.validate_deployment()
          assert result['actual_changed_entry_count']==320,'STOP frozen IDP 320 changes drift'
          print('PASS frozen IDP 320 changed / 84 held')
          PY_IDP
      - name: End with exact reviewed one-file tree and fresh main lease
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object index.html)" == "$QF8_REVIEWED_INDEX" ]] || { echo 'STOP local candidate mutated'; exit 1; }
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP tests mutated another source'; exit 1; }
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo 'STOP tests generated untracked source'; exit 1; }
          git diff --check
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved during tests'; exit 1; }
          echo 'QF8_V3_PREFLIGHT_GREEN: exact reviewed index.html; no repository changes or pushes'

  promote:
    name: Explicit owner-only promotion of reviewed index.html to main
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote' && inputs.confirmation == 'PROMOTE_QF8_A5F02_ONE_FILE_TO_MAIN'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout the SAME dispatch HEAD with write permission
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Recheck reviewed SHA, deployed index, main lease, and exact file scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QF8_MODE" == 'promote' && "$QF8_CONFIRMATION" == 'PROMOTE_QF8_A5F02_ONE_FILE_TO_MAIN' ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP checkout changed'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP checkout dirty'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/${QF8_REVIEW_BRANCH}:refs/remotes/origin/${QF8_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved since preflight'; exit 1; }
          [[ "$(git rev-parse origin/${QF8_REVIEW_BRANCH})" == "$QF8_REVIEW_SHA" ]] || { echo 'STOP review branch moved'; exit 1; }
          [[ "$(git rev-parse "$QF8_REVIEW_SHA:index.html")" == "$QF8_REVIEWED_INDEX" ]] || exit 1
          [[ "$(git hash-object index.html)" == "$QF8_ORIGINAL_INDEX" ]] || { echo 'STOP main index changed'; exit 1; }
          [[ "$(git show -s --format=%P "$QF8_REVIEW_SHA")" == "$QF8_REVIEW_PARENT" ]] || exit 1
          [[ "$(git diff --name-only "$QF8_REVIEW_PARENT" "$QF8_REVIEW_SHA")" == 'index.html' ]] || exit 1
          [[ "$(git diff --numstat "$QF8_REVIEW_PARENT" "$QF8_REVIEW_SHA")" == $'119\t1\tindex.html' ]] || exit 1
          git merge-base --is-ancestor "$QF8_REVIEW_PARENT" HEAD || { echo 'STOP parent ancestor drift'; exit 1; }
          [[ "$(git hash-object .github/workflows/QF8-v2r1.yml)" == '76f66e5910a14964f605f8fc1004eb5e4b4a1255' ]] || { echo 'STOP reviewed harness drift'; exit 1; }
          for guard in \
            'scripts/team_utility_projection_runtime.js:1620edf05e56a56b4a874c71b32777a443422de5' \
            'free-agent-board.html:975efe51091a2315475678a9db0842b05c4fc3aa' \
            'model/releases/free-agent-production-v2/release.json:75c9665c0493d8ac4900479b6802c807aaa45633'; do
            path="${guard%%:*}"; sha="${guard#*:}"
            [[ "$(git hash-object "$path")" == "$sha" ]] || { echo "STOP protected drift $path"; exit 1; }
          done
          git show "${QF8_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "$QF8_REVIEWED_INDEX" ]] || exit 1
          [[ "$(git diff --name-only)" == 'index.html' ]] || exit 1
          git diff --check
      - name: Commit only reviewed index.html and non-force push to main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || { echo 'STOP staged files'; exit 1; }
          [[ "$(git hash-object index.html)" == "$QF8_REVIEWED_INDEX" ]] || exit 1
          git diff --cached --check
          git commit -m 'QF8 A5-F02: honor Sleeper dual DL LB eligibility in legal lineup'
          [[ "$(git rev-parse HEAD:index.html)" == "$QF8_REVIEWED_INDEX" ]] || exit 1
          # This NON-FORCE push rejects a competing main update; no force or model mutation.
          git push origin HEAD:refs/heads/main
          echo "QF8_V3_PROMOTION_GREEN main=$(git rev-parse HEAD) index=${QF8_REVIEWED_INDEX}"
          echo 'Verify Pages separately; workflow success does not certify scientific accuracy.'
