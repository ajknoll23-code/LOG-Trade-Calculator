name: CAL26 V1R66 - Official League Scored IDP Adjudication (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r66-official-score-reconciliation
  cancel-in-progress: false
jobs:
  official-player-score-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - name: Checkout immutable scoring reference (read only)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download verified successful R65 scoring evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R65_518_FROZEN_WEEK6_SCORING_EXCEPTION_AUDIT_FV_HOLD
        run-id: 40066140272
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r66-inputs/R65
    - name: Compare exact 2026 Week1-6 stat scoring to official Sleeper league points
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R66_engine.py\" <<'PY_CAL26_V1R66_ENGINE'\n#!/usr/bin/env\
        \ python3\n\"\"\"R66: Frozen Week6 scorer vs Sleeper league-scored player points.\nNo FV, no price fit,\
        \ no Week7+, no writes to repository.\nBoth sources are Sleeper-derived, but league matchup points are independent\
        \ of\nour Python scoring implementation. Missing bench points are not imputed.\n\"\"\"\nimport argparse,\
        \ ast, collections, csv, hashlib, json, math, pathlib, sys, urllib.request\n\nR65_ART='CAL26_V1R65_518_FROZEN_WEEK6_SCORING_EXCEPTION_AUDIT_FV_HOLD'\n\
        R65_RUN=40066140272\nR65_ROW='CAL26_V1R65_518_scoring_exception_and_verified_replay_NOT_FV.csv'\nR65_ALIAS='CAL26_V1R65_source_alias_events_REVIEW.csv'\n\
        R65_LOW='CAL26_V1R65_low_IDP_score_source_review.csv'\nREPO_SHA={\n 'research/roster-economics/historical_weekly_points_pipeline.py':'d6d6c6b4c2725eca3aae46f6c32dcc6ae8633ace',\n\
        \ 'data/trade_history.json':'aa0ff2f2e839d3fc6aec67cfc6615c4130844ef3'\n}\nPOS=('QB','RB','WR','TE','DL','LB','DB')\n\
        \ndef req(c,msg):\n if not c: raise AssertionError(msg)\ndef sha(b):return hashlib.sha256(b).hexdigest()\n\
        def gitsha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()\ndef read_csv(p):\n\
        \ with p.open(newline='') as f:return list(csv.DictReader(f))\ndef emit_csv(path,rows,cols):\n with path.open('w',newline='')\
        \ as f:\n  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');w.writeheader();w.writerows(rows)\n\
        def get_json(url, fixture=None, filename=None):\n if fixture is not None:\n  b=(fixture/filename).read_bytes()\n\
        \ else:\n  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CAL26-R66-Frozen-2026-Week6-FV-HOLD'}),timeout=50)\
        \ as r:\n   req(r.status==200,'HTTP_NOT_200');b=r.read(35_000_000)\n return json.loads(b), sha(b), len(b)\n\
        def original_score(path):\n tree=ast.parse(path.read_bytes())\n f=[x for x in tree.body if isinstance(x,ast.FunctionDef)\
        \ and x.name=='score_week']\n req(len(f)==1,'SCORER_FUNCTION_NOT_FOUND')\n ns={};exec(compile(ast.Module(body=f,type_ignores=[]),'<pinned\
        \ 2026 scorer>','exec'),ns)\n return ns['score_week']\ndef official_points(rows):\n \"\"\"Map canonical\
        \ Sleeper player IDs to week points. Prevent competing rosters from silently overwriting.\"\"\"\n req(isinstance(rows,list),'MATCHUPS_NOT_LIST')\n\
        \ d={};src=collections.Counter()\n for ix,r in enumerate(rows):\n  req(isinstance(r,dict),'MATCHUP_ROW_NOT_DICT')\n\
        \  pts=r.get('players_points')\n  if isinstance(pts,dict):\n   entries=pts.items();src['rosters_with_all_players_points']+=1\n\
        \  elif isinstance(r.get('starters'),list) and isinstance(r.get('starters_points'),list):\n   starters=r['starters'];v=r['starters_points']\n\
        \   req(len(starters)==len(v),'STARTER_POINT_ARRAY_MISMATCH')\n   entries=zip(starters,v);src['rosters_with_starter_points_only']+=1\n\
        \  else:\n   src['rosters_without_player_points']+=1;continue\n  for pid,score in entries:\n   if pid in\
        \ (None,'','0') or score is None:continue\n   try:val=float(score)\n   except (ValueError,TypeError):raise\
        \ AssertionError('OFFICIAL_POINT_NON_NUMERIC')\n   req(math.isfinite(val) and -80<=val<=180,'OFFICIAL_POINT_IMPLAUSIBLE')\n\
        \   pid=str(pid)\n   if pid in d:req(abs(d[pid]-val)<.051,'OFFICIAL_PLAYER_MULTIPLE_CONFLICT')\n   d[pid]=val\n\
        \ return d,src\n\ndef main(args):\n fixture=pathlib.Path(args.fixtures) if args.fixtures else None\n p=pathlib.Path(args.r65);repo=pathlib.Path(args.repo);out=pathlib.Path(args.out);out.mkdir(parents=True,exist_ok=True)\n\
        \ for rel,v in REPO_SHA.items():\n  b=(repo/rel).read_bytes()\n  if fixture is None:req(gitsha(b)==v,'PINNED_REPO_SOURCE_DRIFT_'+pathlib.Path(rel).name)\n\
        \ r65=json.loads((p/'CAL26_V1R65_manifest.json').read_text())\n req(r65['semantic_status']=='SOURCE_REPLAY_IDENTICAL_ALIASES_UNVERIFIED__FV_HOLD','R65_SEMANTIC_CONTRACT_DRIFT')\n\
        \ req(r65['player_count']==518 and r65['observed_unique_ids']==495 and r65['source_alias_events']==5 and\
        \ r65['low_IDP_score_review_count']==13,'R65_EXPECTED_COHORT_DRIFT')\n req(r65['source_weeks']==list(range(1,7))\
        \ and not r65['weeks7_plus_fetched'] and not r65['production_change_authorized'],'R65_HOLD_DRIFT')\n for\
        \ name,digest in r65['outputs_sha256'].items():req(sha((p/name).read_bytes())==digest,'R65_OUTPUT_SHA_DRIFT_'+name)\n\
        \ players=read_csv(p/R65_ROW);alias=read_csv(p/R65_ALIAS);low=read_csv(p/R65_LOW)\n req(len(players)==518\
        \ and len(alias)==5 and len(low)==13,'R65_EXACT_ROW_COUNTS_FAIL')\n req(len({(r['name'],r['position']) for\
        \ r in players})==518,'R65_DUPLICATE_PLAYER')\n req({r['position'] for r in players}==set(POS),'R65_POS_DRIFT')\n\
        \ for r in players:req(r['production_FV_reprice_authorized']=='False','R65_PRODUCTION_WRITE_FOUND')\n settings=json.loads((repo/'data/trade_history.json').read_text())\n\
        \ years=[x for x in settings['seasons'] if str(x['season'])=='2026']\n req(len(years)==1,'2026_LEAGUE_MISSING');league_id=str(years[0]['league_id'])\n\
        \ req(league_id=='1326679131051532288','2026_LEAGUE_ID_SOURCE_DRIFT')\n scorer=original_score(repo/'research/roster-economics/historical_weekly_points_pipeline.py')\n\
        \ req(abs(scorer({'idp_tkl_solo':2,'idp_tkl_ast':2})-4.5)<1e-8,'SCORER_PARITY')\n ids={r['sleeper_id']:r\
        \ for r in players if r['sleeper_id']}\n req(len(ids)>=495 and sum(r['identity_status']=='OBSERVED_UNIQUE_ID'\
        \ for r in players)==495,'DUPLICATE_SID_OR_MISSING')\n weekstats={};matchups={};official={};ledger=[];counts=collections.Counter()\n\
        \ for w in range(1,7):\n  stats_url=f'https://api.sleeper.app/v1/stats/nfl/regular/2026/{w}'\n  match_url=f'https://api.sleeper.app/v1/league/{league_id}/matchups/{w}'\n\
        \  sj,sh,nb=get_json(stats_url,fixture,f'stats_week{w}.json')\n  req(isinstance(sj,dict),'BAD_STATS_SHAPE')\n\
        \  if fixture is None:req(sh==r65['source_SHA256'][str(w)],'R65_PINNED_STATS_SOURCE_CHANGED_WEEK_'+str(w))\n\
        \  mj,mh,mb=get_json(match_url,fixture,f'matchups_week{w}.json')\n  req(isinstance(mj,list) and len(mj)>=1,'BAD_MATCHUPS_SHAPE')\n\
        \  mp,sc=official_points(mj);official[w]=mp;weekstats[w]=sj;matchups[w]=mj\n  counts.update(sc)\n  ledger.append({'week':w,'stats_source_bytes_sha256':sh,'stats_match_r65_byte_pin':sh==r65['source_SHA256'][str(w)],\n\
        \    'official_matchup_source_sha256':mh,'matchup_rows':len(mj),'official_player_points_count':len(mp),\n\
        \    'rosters_with_all_points':sc['rosters_with_all_players_points'],'rosters_with_starters_only':sc['rosters_with_starter_points_only'],\n\
        \    'rosters_without_points':sc['rosters_without_player_points']})\n # Strict version: only original immutable\
        \ R65 scorer replay, no alias mutation.\n detail=[];agg=collections.defaultdict(list);score_qa={};covered=collections.defaultdict(set)\n\
        \ for row in players:\n  pid=row['sleeper_id'];pos=row['position'];name=row['name'];week_scores=[];had_official=[];mismatch=[];observed_stat_weeks=0\n\
        \  for w in range(1,7):\n   raw=weekstats[w].get(pid,{}) if pid else {}\n   req(isinstance(raw,dict),'STAT_ROW_MALFORMED')\n\
        \   observed=bool(raw) and float(raw.get('gp') or 0)>=1\n   points=float(scorer(raw)) if observed else 0.\n\
        \   if observed:observed_stat_weeks+=1\n   week_scores.append(points)\n   off=official[w].get(pid) if pid\
        \ else None\n   if off is not None:\n    covered[pos].add(pid)\n    had_official.append(off)\n    d=round(off-points,5)\n\
        \    mismatch.append(d)\n    detail.append({'week':w,'name':name,'position':pos,'sleeper_id':pid,'scorer_points_R65_original':round(points,5),\n\
        \     'league_scored_points':round(off,5),'official_minus_scorer_points':d,'abs_difference_gt_0_05':abs(d)>.05,\n\
        \     'observed_gp_in_stats_source':observed,'all_player_points_present':bool(any(isinstance(k.get('players_points'),dict)\
        \ and pid in k['players_points'] for k in matchups[w])),\n     'source':'2026_frozen_week6_league_matchups','production_change_authorized':False})\n\
        \    agg[pos].append(abs(d))\n  prev=row['R65_replay_same_source_scorer_points'];require_score=(prev!='')\n\
        \  if require_score:req(abs(sum(week_scores)-float(prev))<1e-4,'R65_REPLAY_SCORE_MISMATCH_'+name)\n  else:req(not\
        \ pid,'UNMAPPED_BUT_HAS_PID')\n  score_qa[(name,pos)]={'name':name,'position':pos,'sleeper_id':pid,'frozen_FV_REFERENCE_ONLY':row['frozen_FV_REFERENCE_ONLY'],\n\
        \   'R65_week1_6_points_original':prev,'league_scored_weeks_available':len(had_official),\n   'league_scored_sum_on_overlapping_weeks':round(sum(had_official),5)\
        \ if had_official else '',\n   'scorer_sum_same_official_weeks':round(sum(had_official[i]-mismatch[i] for\
        \ i in range(len(mismatch))),5) if mismatch else '',\n   'official_minus_scorer_on_overlap':round(sum(mismatch),5)\
        \ if mismatch else '',\n   'official_match_within_0_05':sum(abs(x)<=.05 for x in mismatch),'official_disagreement_above_0_05':sum(abs(x)>.05\
        \ for x in mismatch),\n   'all_six_weeks_official':len(had_official)==6,'scoring_change_proposed':False,'production_FV_reprice_authorized':False}\n\
        \ # Alias adjudication is a genuine independent platform-score comparison where rostered.\n adjudicated=[]\n\
        \ for a in alias:\n  key=(a['name'],a['position']);pid=a['sleeper_id'];w=int(a['week']);record=next((x for\
        \ x in detail if x['week']==w and x['sleeper_id']==pid),None)\n  if record is None:classification='NO_LEAGUE_SCORING_POINTS_AVAILABLE';official_diff=''\n\
        \  else:\n   official_diff=float(record['official_minus_scorer_points']);possible=float(a['possible_missed_points_IF_ALIAS_CONFIRMED'])\n\
        \   if abs(official_diff-possible)<=.05:classification='OFFICIAL_SUPPORTS_ALIAS_DELTA_NOT_ALL_CATEGORIES_CERTIFIED'\n\
        \   elif abs(official_diff)<=.05:classification='OFFICIAL_MATCHES_UNCHANGED_SCORER'\n   else:classification='DISCREPANCY_NOT_UNIQUELY_ATTRIBUTABLE_TO_ALIAS'\n\
        \  adjudicated.append({**a,'official_minus_original_scorer':official_diff,'league_scored_points_available':record\
        \ is not None,\n   'official_alias_adjudication':classification,'automatic_scoring_change_authorized':False})\n\
        \ lowrows=[]\n for z in low:\n  qa=score_qa[(z['name'],z['position'])]\n  if qa['league_scored_weeks_available']==0:cls='NO_LEAGUE_POINTS_TO_ADJUDICATE'\n\
        \  elif qa['official_disagreement_above_0_05']>0:cls='SCORED_SOURCE_DIFFERS_ON_ROSTERED_WEEKS'\n  elif qa['league_scored_weeks_available']==6:cls='OFFICIAL_MATCHES_SCORER_ALL_SIX_WEEKS'\n\
        \  else:cls='OFFICIAL_MATCHES_ONLY_ROSTERED_SUBSET'\n  lowrows.append({**z,'official_week_count':qa['league_scored_weeks_available'],'official_minus_scorer_on_overlap':qa['official_minus_scorer_on_overlap'],\n\
        \   'official_disagreement_weeks':qa['official_disagreement_above_0_05'],'adjudication':cls,'production_change_authorized':False})\n\
        \ positions=[]\n for pos in POS:\n  ds=agg[pos];positions.append({'position':pos,'player_count':sum(x['position']==pos\
        \ for x in players),'distinct_players_with_league_points':len(covered[pos]),\n   'overlap_player_weeks':len(ds),'within_0_05_weeks':sum(d<=.05\
        \ for d in ds),'mismatch_gt_0_05_weeks':sum(d>.05 for d in ds),\n   'mean_abs_error':round(sum(ds)/len(ds),5)\
        \ if ds else '',\n   'source':'Sleeper league-scored matchup points, not Python scorer','production_change_authorized':False})\n\
        \ qa_rows=list(score_qa.values());matched=sum(len(v) for v in agg.values()); mism=sum(x['mismatch_gt_0_05_weeks']\
        \ for x in positions)\n min_research_coverage=(matched>=75 and sum(x['overlap_player_weeks']>=5 for x in\
        \ positions)>=3)\n status='OFFICIAL_SCORE_COMPARISON_AVAILABLE__FIX_SCORING_BEFORE_FV' if min_research_coverage\
        \ and mism>0 else ('OFFICIAL_SCORE_COMPARISON_AVAILABLE__PARITY_ON_OVERLAP__FV_HOLD' if min_research_coverage\
        \ else 'OFFICIAL_SCORE_COVERAGE_INSUFFICIENT__FV_HOLD')\n outfile={\n  'CAL26_V1R66_518_official_week6_reconciliation_NOT_FV.csv':(qa_rows,list(qa_rows[0])),\n\
        \  'CAL26_V1R66_7position_official_scorer_accuracy.csv':(positions,list(positions[0])),\n  'CAL26_V1R66_player_week_official_differences.csv':(detail,['week','name','position','sleeper_id','scorer_points_R65_original','league_scored_points','official_minus_scorer_points','abs_difference_gt_0_05','observed_gp_in_stats_source','all_player_points_present','source','production_change_authorized']),\n\
        \  'CAL26_V1R66_5_IDP_alias_official_adjudications.csv':(adjudicated,list(adjudicated[0])),\n  'CAL26_V1R66_13_low_IDP_official_adjudications.csv':(lowrows,list(lowrows[0])),\n\
        \  'CAL26_V1R66_Week1_6_stats_and_matchup_digest_ledger.csv':(ledger,list(ledger[0]))}\n for name,(rows,cols)\
        \ in outfile.items():emit_csv(out/name,rows,cols)\n message=['# CAL26 V1R66 \u2014 Official league-scored\
        \ Week1\u20136 reconciliation','',f'**Decision: {status}**','',\n '2026 league matchup player points are\
        \ an independent scoring implementation/check against our pinned local scorer, but both still originate\
        \ from Sleeper. This is **not** independent NFL stat-provider confirmation.','',\n f'518 frozen players;\
        \ {matched} player-week league-score comparisons; {mism} player-week differences > 0.05 points; {sum(len(s)\
        \ for s in covered.values())} distinct players with any official league point.',\n f'All six 2026 weekly\
        \ raw stats endpoint SHA256 checks matched R65: {all(x[\"stats_match_r65_byte_pin\"] for x in ledger)} (synthetic\
        \ fixtures are excluded from this production claim).',\n f'Five R65 defensive-TD alias events: {dict(collections.Counter(x[\"\
        official_alias_adjudication\"] for x in adjudicated))}. Thirteen low-IDP flags: {dict(collections.Counter(x[\"\
        adjudication\"] for x in lowrows))}.','',\n '| Position | Official player-weeks | Differences >0.05 | MAE\
        \ (points) |','|---|---:|---:|---:|']\n for x in positions:message.append(f'| {x[\"position\"]} | {x[\"\
        overlap_player_weeks\"]} | {x[\"mismatch_gt_0_05_weeks\"]} | {x[\"mean_abs_error\"]} |')\n message.extend(['','##\
        \ Guardrails','- No Week7+ fetch or future outcome access; all raw Week1\u20136 files verified against R65\
        \ SHA256 in real run.',\n '- Historical LOG scorer does not automatically receive alias changes. League\
        \ matchup points may be unavailable for unrostered players; absence is not a zero.',\n '- Commissioner custom\
        \ points and source stat corrections remain potential confounders; official scoring comparisons are evidence,\
        \ not proof that any single stat field is the cause.',\n '- No retrospective market pricing label, no arbitrary\
        \ points multiplier, no forecast transfer claim, no production FV write.',''])\n (out/'CAL26_V1R66_decision.md').write_text('\\\
        n'.join(message))\n manifest={'workflow':'CAL26 V1R66','status':status,'fixture':bool(fixture),'R65_source_artifact':R65_ART,'R65_source_run':R65_RUN,\n\
        \ 'player_count':518,'r65_observed_unique':495,'official_scored_player_weeks':matched,'official_score_mismatched_weeks_gt_0_05':mism,\n\
        \ 'positions_with_official_coverage':sum(x['overlap_player_weeks']>0 for x in positions),\n 'alias_events_adjudicated':len(adjudicated),'low_idp_cases_adjudicated':len(lowrows),\n\
        \ 'stats_week1_6_digest_matches_R65':all(x['stats_match_r65_byte_pin'] for x in ledger),'source_week_range':[1,2,3,4,5,6],\n\
        \ 'week7_plus_fetched':False,'2026_to_2027_forecast_validated':False,'scale_FV_identified':False,'production_change_authorized':False,\n\
        \ 'output_sha256':{name:sha((out/name).read_bytes()) for name in list(outfile)+['CAL26_V1R66_decision.md']}}\n\
        \ (out/'CAL26_V1R66_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')\n print('R66_SCORE_COMPARISON',json.dumps({k:manifest[k]\
        \ for k in ('status','official_scored_player_weeks','official_score_mismatched_weeks_gt_0_05','alias_events_adjudicated','low_idp_cases_adjudicated')},sort_keys=True))\n\
        \ndef selftest():\n r=[{'players_points':{'1':5.5,'2':-1}},{'starters':['3','0'],'starters_points':[11.0,0]}]\n\
        \ p,c=official_points(r);req(p=={'1':5.5,'2':-1.,'3':11.},'COMBINED_STARTER_AND_ROSTER_POINTS');req(c['rosters_with_all_players_points']==1,'FULL_ROSTER_EXPOSURE')\n\
        \ try:official_points([{'players_points':{'1':1}},{'players_points':{'1':2}}])\n except AssertionError as\
        \ e:req(str(e)=='OFFICIAL_PLAYER_MULTIPLE_CONFLICT','DUPLICATE_CONFLICT_FAILED')\n else:raise AssertionError('DUPLICATE_GUARD_BROKEN')\n\
        \ try:get_json('never',pathlib.Path('/tmp/non-existing-week7'),filename='stats_week7.json')\n except Exception:pass\n\
        \ print('R66_SELFTEST_GREEN parser; multi-roster conflict; league points schema')\nif __name__=='__main__':\n\
        \ p=argparse.ArgumentParser();p.add_argument('--r65');p.add_argument('--repo');p.add_argument('--out');p.add_argument('--fixtures');p.add_argument('--selftest',action='store_true');args=p.parse_args()\n\
        \ if args.selftest:selftest()\n else:main(args)\n\nPY_CAL26_V1R66_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_V1R66_engine.py\"\
        \npython \"$RUNNER_TEMP/CAL26_V1R66_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_V1R66_engine.py\"\
        \ \\\n --r65 \"$RUNNER_TEMP/cal26-r66-inputs/R65\" \\\n --repo \"$GITHUB_WORKSPACE\" \\\n --out \"$RUNNER_TEMP/cal26-r66-results\"\
        \npython - \"$RUNNER_TEMP/cal26-r66-results\" <<'PY_CAL26_V1R66_VERIFY'\nimport json,csv,hashlib,pathlib,sys\n\
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R66_manifest.json').read_text())\nassert m['fixture']\
        \ is False and m['player_count']==518 and m['r65_observed_unique']==495\nassert m['alias_events_adjudicated']==5\
        \ and m['low_idp_cases_adjudicated']==13\nassert m['R65_source_run']==40066140272 and m['stats_week1_6_digest_matches_R65']\n\
        assert m['source_week_range']==[1,2,3,4,5,6] and not m['week7_plus_fetched']\nassert not m['2026_to_2027_forecast_validated']\
        \ and not m['scale_FV_identified'] and not m['production_change_authorized']\nfor fn,h in m['output_sha256'].items():\n\
        \ assert hashlib.sha256((p/fn).read_bytes()).hexdigest()==h,fn\nwith (p/'CAL26_V1R66_518_official_week6_reconciliation_NOT_FV.csv').open()\
        \ as f:players=list(csv.DictReader(f))\nassert len(players)==518 and all(x['production_FV_reprice_authorized']=='False'\
        \ for x in players)\nwith (p/'CAL26_V1R66_7position_official_scorer_accuracy.csv').open() as f:pos=list(csv.DictReader(f))\n\
        assert len(pos)==7\nprint('R66_FROZEN_WEEK6_OFFICIAL_SCORING_COMPARISON_RESEARCH_ONLY_GREEN')\nPY_CAL26_V1R66_VERIFY\n\
        test -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r66-results/CAL26_V1R66_decision.md\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload seven-position official point evidence (no FV writes)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_V1R66_2026_W6_LEAGUE_SCORED_PLAYER_POINT_ADJUDICATION_FV_HOLD
        path: ${{ runner.temp }}/cal26-r66-results/
        retention-days: 60
        if-no-files-found: warn
