# R78: native FV math validation only, does not authorize pricing or change deployed source.
name: CAL26 V1R78 - Five Player Exact Live FV Quote Engineering Rehearsal (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r78-native-quote-engineering-no-price-write
  cancel-in-progress: false
jobs:
  native-fv-shadow-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout immutable live valuation reference read only
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
        fetch-depth: 1
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Download immutable successful R77 native FV owner previews
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R77_16_OWNER_QB_WR_2026_SHADOW_PROTECTED_FV_HOLD
        run-id: 40125064503
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r78-in/R77
    - name: Download immutable successful R72 exact live FV replay
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R72_518_NATIVE_FV_FORMULA_REPLAY_AND_SENSITIVITY_FV_HOLD
        run-id: 40102341863
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r78-in/R72
    - name: Reproduce five target scenarios via native JS and prove 517 unaffected each time
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'CAL26 R78: read-only native quote inversion; no authorization or price writes'
        test "$GITHUB_REF" = refs/heads/main
        test -s index.html
        test ! -e sf.csv
        test -z "$(git status --porcelain --untracked-files=all)"
        cat > "$RUNNER_TEMP/CAL26_R78_engine.py" <<'PY_R78_ENGINE'
        #!/usr/bin/env python3
        """CAL26 R78: dry-run exact native FV inversion for R77 review numbers, no release authorization."""
        from __future__ import annotations
        import argparse,csv,hashlib,json,pathlib,re,subprocess,math,collections

        INDEX_SHA='5630bb681dd8710f8e45bc5363488f358ce9ebe2'
        R77_RUN=40125064503
        R72_RUN=40102341863
        R77_MANIFEST_SHA='4eb8ea3728ee25a1d7298da2884c7f641ee52a86c120b9a4e5f5a12edc5e6450'
        R77_CARDS_SHA='1505f2855137f972a8fbd7887f5ca733d0c2a4187a7d034c5c9ce54a53bab2be'
        R77_UNIVERSE_SHA='aecc50428ae376cda564fcd477d6f1e0d07e2df5521d1038ab1a3c4a446b3b9a'
        R72_LIVE_SHA='2ebce111316cdb578d0bd240e1858a4ac87e1b61543dff01fffc3b60e943d2b2'
        FOCUS=('bryce young','drake maye','cj stroud','puka nacua','malik nabers')
        CONSTS=['POSITION_WEIGHT','AGE_CURVE','ROLE_MULT','PROD_MULT_DATA','NO_REAL_PRODUCTION_HISTORY','CAL22_LEGACY_MONOTONE_KEYS','RB_BIRTH_DATE_DATA','PLAYER_DB','CAL26_FV_OWNER_ANCHORS']
        FUNCS=['normalizeName','productionMultiplier','ageMultiplier','fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier','effectiveAgeMultiplier','playerValue']
        SCALARS=['QB_POST_PEAK_FLOOR','LB_POST_PEAK_DECAY_POWER']
        POS={'QB','RB','WR','TE','DL','LB','DB'}

        def chk(x,why):
         if not x:raise AssertionError(why)
        def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
        def git_blob_sha(p):
         b=pathlib.Path(p).read_bytes()
         return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
        def rows(path):
         with open(path,newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
        def writecsv(p,rr):
         chk(bool(rr),'NO_REPORT_ROWS')
         with open(p,'w',newline='',encoding='utf-8') as f:
          w=csv.DictWriter(f,list(rr[0]),lineterminator='\n');w.writeheader();w.writerows(rr)

        def closing_brace(s,op):
         depth=0;i=op;state='code'
         while i<len(s):
          c=s[i];n=s[i+1] if i+1<len(s) else ''
          if state=='code':
           if c in "\"'`":state=c
           elif c=='/' and n=='/':state='line';i+=1
           elif c=='/' and n=='*':state='block';i+=1
           elif c=='{':depth+=1
           elif c=='}':
            depth-=1
            if depth==0:return i
          elif state=='line':
           if c=='\n':state='code'
          elif state=='block':
           if c=='*' and n=='/':state='code';i+=1
          elif c=='\\':i+=1
          elif c==state:state='code'
          i+=1
         raise AssertionError('UNBALANCED_JS_SOURCE')
        def extract_js(s,typ,name):
         if typ=='const':
          m=re.search(r'(?m)^const '+re.escape(name)+r'\s*=\s*\{',s)
          chk(m is not None,'MISSING_CONST_'+name)
          k=closing_brace(s,m.end()-1)
          chk(s[k+1:k+2]==';','CONST_NO_SEMICOLON_'+name)
          return s[m.start():k+2]+'\n'
         if typ=='scalar':
          m=re.search(r'(?m)^const '+re.escape(name)+r'\s*=\s*[^;\n]+;',s)
          chk(m is not None,'MISSING_SCALAR_'+name)
          return m.group()+'\n'
         m=re.search(r'(?m)^function '+re.escape(name)+r'\(',s)
         chk(m is not None,'MISSING_FUNC_'+name)
         k=s.find('\n}',m.end())
         chk(k>m.end(),'FUNC_CLOSE_MISSING_'+name)
         return s[m.start():k+2]+'\n'
        def js_bundle(s):
         p=[extract_js(s,'const',x) for x in CONSTS]
         p += [extract_js(s,'scalar',x) for x in SCALARS]
         p += ['const PROD_MULT = PROD_MULT_DATA;\n']
         p += [extract_js(s,'func',x) for x in FUNCS]
         chk('return Math.round(100 * pw * am * rm * 55);' in p[-1],'PLAYER_VALUE_FORMULA_MODIFIED')
         return '\n'.join(p)

        NODE_RUNNER=r'''const fs=require('fs'),vm=require('vm');
        const q=JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
        const make=JSON.stringify({full:q.full,cards:q.cards,focus:q.focus});
        const body=q.bundle+`\nconst Q=${make};\n`+`
        function own(x,k){return Object.prototype.hasOwnProperty.call(x,k);}
        const full=Q.full.map(row=>{
         const key=row.key;
         const db=PLAYER_DB[key];
         if(!db)throw Error('CANONICAL_PLAYER_MISSING_'+key);
         if(db.pos!==row.position)throw Error('CANONICAL_POSITION_DRIFT_'+key);
         const before=playerValue(db.pos,db.age,db.role,key);
         return {name:row.name,position:db.pos,key,base_native_FV:before,anchor:own(CAL26_FV_OWNER_ANCHORS,key)};
        });
        if(full.length!==518)throw Error('PLAYER_COUNT_BAD');
        const byKey=new Map(full.map(x=>[x.key,x]));
        const diagnostics=[];
        for(const row of Q.cards){
         const x=byKey.get(row.key), db=PLAYER_DB[row.key];
         if(!x||!db)throw Error('OWNER_CARD_NOT_FOUND_'+row.key);
         if(x.anchor)throw Error('OWNER_ANCHOR_PROPOSED_CHANGE_'+row.key);
         if(!own(PROD_MULT,row.key))throw Error('ABSENT_RAW_PROD_MULT_'+row.key);
         const current=PROD_MULT[row.key],baseline=x.base_native_FV,target=row.target;
         if(!Number.isFinite(current)||current<=0)throw Error('RAW_MULT_INVALID_'+row.key);
         if(baseline!==row.live)throw Error('OWNER_CARD_LIVE_DRIFT_'+row.key);
         if(!Number.isInteger(target)||target<=0)throw Error('TARGET_BAD_'+row.key);
         const untouched=full.map(y=>y.base_native_FV);
         function price(raw){PROD_MULT[row.key]=raw;const n=playerValue(db.pos,db.age,db.role,row.key);PROD_MULT[row.key]=current;return n;}
         const low=.15,hi=1.55;
         let pmin=price(low),pmax=price(hi), feasible=target>=pmin&&target<=pmax;
         // A binary search finds a RAW-production-multiplier that recreates the bounded
         // *operational* target, not an evidence-backed change to production.
         let raw=null,got=null,sideEffects=null;
         if(feasible){
           let a=low,b=hi;
           for(let k=0;k<65;k++){
             const mid=(a+b)/2, pm=price(mid);
             if(pm<target)a=mid;else b=mid;
           }
           let attempts=[b,(a+b)/2,a];
           const step=1e-8;
           for(let j=-3;j<=3;j++)attempts.push(b+j*step);
           attempts=attempts.map(z=>Math.max(low,Math.min(hi,z)));
           const pairs=attempts.map(z=>({raw:z,quote:price(z)}));
           const best=pairs.sort((a,b)=>Math.abs(a.quote-target)-Math.abs(b.quote-target) || Math.abs(a.raw-current)-Math.abs(b.raw-current))[0];
           raw=best.raw;got=best.quote;
           PROD_MULT[row.key]=raw;
           const after=full.map(y=>{
             const t=PLAYER_DB[y.key];return playerValue(t.pos,t.age,t.role,y.key);
           });
           sideEffects=after.filter((v,i)=>v!==untouched[i]&&full[i].key!==row.key).length;
           PROD_MULT[row.key]=current;
           if(sideEffects!==0)throw Error('SIDE_EFFECT_ON_OTHER_PLAYERS_'+row.key);
           if(price(current)!==baseline)throw Error('RESTORE_FAILED_'+row.key);
         }
         diagnostics.push({name:row.name,key:row.key,position:row.position,live_FV:baseline,target_r77_operational_only:target,
             old_prod_mult:current,target_native_quote_reachable_within_015_155:feasible,
             min_quote_in_clamp:pmin,max_quote_in_clamp:pmax,raw_prod_mult_required_for_operational_target:raw,
             calculated_native_quote_after_isolated_change:got,quote_diff_from_review_target:got===null?null:got-target,
             all_other_517_player_quotes_unchanged_in_isolated_test:sideEffects===0,
             unvalidated_intrinsic_fv:true,owner_approved:false,
             focus_pilot:Q.focus.includes(row.name)});
        }
        ({full,diagnostics});`;
        const res=vm.runInNewContext(body,{}, {timeout:60000,filename:'r78_native_fv_engine.js'});
        process.stdout.write(JSON.stringify(res));
        '''

        def main(a):
         r77=pathlib.Path(a.r77);r72=pathlib.Path(a.r72);repo=pathlib.Path(a.repo);out=pathlib.Path(a.out)
         out.mkdir(parents=True,exist_ok=True)
         # Pins must hold in the public workflow; fixture may only bypass source snapshot
         # bytes, not row contract, safety checks, or native function logic.
         for p,h in [(r77/'CAL26_R77_manifest.json',R77_MANIFEST_SHA),
           (r77/'CAL26_R77_16_CONSERVATIVE_OWNER_PRICING_CARDS_NOT_APPROVED.csv',R77_CARDS_SHA),
           (r77/'CAL26_R77_518_2026_ONLY_OWNER_FV_SHADOW_NO_RELEASE.csv',R77_UNIVERSE_SHA),
           (r72/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv',R72_LIVE_SHA)]:
          chk(a.fixture or sha(p)==h,'PINNED_EVIDENCE_CHANGED_'+p.name)
         chk(a.fixture or git_blob_sha(repo/'index.html')==INDEX_SHA,'LIVE_DEPLOYED_INDEX_DRIFT')
         m=json.loads((r77/'CAL26_R77_manifest.json').read_text())
         chk(m['run']=='CAL26_V1R77' and m['player_count']==518 and m['owner_card_count']==16,'INVALID_R77_SOURCE_CONTRACT')
         chk(m['owner_price_anchors_protected']==15 and not m['production_FV_changes'] if 'production_FV_changes' in m else m['owner_price_anchors_protected']==15 and m['production_price_changes']==0,'R77_OWNER_OR_RELEASE_DRIFT')
         cards=rows(r77/'CAL26_R77_16_CONSERVATIVE_OWNER_PRICING_CARDS_NOT_APPROVED.csv')
         full=rows(r77/'CAL26_R77_518_2026_ONLY_OWNER_FV_SHADOW_NO_RELEASE.csv')
         live=rows(r72/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv')
         chk(len(cards)==16 and len(full)==len(live)==518,'WRONG_PLAYER_UNIVERSE')
         chk(len({x['name'] for x in full})==len(full) and len({x['name'] for x in live})==len(live),'DUPLICATE_PLAYER')
         chk(len({x['name'] for x in cards})==16,'DUPLICATE_OWNER_CARD')
         base={x['name']:x for x in live};universe={x['name']:x for x in full}
         chk({x['name'] for x in full}==set(base),'R77_R72_PLAYER_IDENTITY_MISMATCH')
         chk(sum(x['owner_anchor_protects_quote']=='True' for x in live)==15,'15_OWNER_ANCHORS_NOT_PRESERVED')
         for r in full:
          q=base[r['name']]
          chk(r['position']==q['position'],'POSITION_DRIFT_'+r['name'])
          chk(int(r['live_native_JS_FV_UNCHANGED'])==int(q['exact_production_JS_replayed_FV']),'R77_R72_QUOTE_DRIFT_'+r['name'])
          chk(r['production_price_change_authorized']=='False' and r['can_auto_apply']=='False','ILLEGAL_R77_AUTO_APPLY')
         for c in cards:
          chk(c['name'] in universe,'CARD_UNIVERSE_MISS')
          chk(c['position'] in ('QB','WR') and c['owner_anchor_protected']=='False','NON_QB_WR_OR_OWNER_ANCHOR')
          chk(c['can_auto_apply']=='False' and c['production_price_change_authorized']=='False','CARD_APPROVAL_FALSE_REQUIRED')
          chk(int(c['live_native_JS_FV_UNCHANGED'])==int(universe[c['name']]['live_native_JS_FV_UNCHANGED']),'CARD_BASELINE_DRIFT')
          chk(abs(int(c['8pct_risk_cap_shadow_FV_FOR_OWNER_REVIEW_ONLY'])/int(c['live_native_JS_FV_UNCHANGED'])-1)<=.08001,'UNBOUNDED_PREVIEW')
         chk(set(FOCUS)<= {x['name'] for x in cards},'FOCUS_OWNER_SET_NOT_IN_16')
         rb=[{'name':x['name'],'key':base[x['name']]['production_canonical_key'],'position':x['position']} for x in full]
         cb=[{'name':x['name'],'key':base[x['name']]['production_canonical_key'],'position':x['position'],
              'live':int(x['live_native_JS_FV_UNCHANGED']),'target':int(x['8pct_risk_cap_shadow_FV_FOR_OWNER_REVIEW_ONLY'])} for x in cards]
         data={'bundle':js_bundle((repo/'index.html').read_text(encoding='utf-8')),'full':rb,'cards':cb,'focus':list(FOCUS)}
         path=out/'_R78_NODE_INPUT_TEMP.json';script=out/'_R78_NATIVE_TEMP.cjs'
         path.write_text(json.dumps(data),encoding='utf-8');script.write_text(NODE_RUNNER,encoding='utf-8')
         try:
          proc=subprocess.run(['node',str(script),str(path)],capture_output=True,text=True,timeout=100)
          chk(proc.returncode==0,'NODE_QUOTE_REPLAY_FAILURE_'+proc.stderr[:1000]);res=json.loads(proc.stdout)
         finally:
          script.unlink(missing_ok=True);path.unlink(missing_ok=True)
         checked=res['full'];diag=res['diagnostics']
         chk(len(checked)==518 and len(diag)==16,'NATIVE_REPLAY_COUNT_MISMATCH')
         chk(sum(x['anchor'] for x in checked)==15,'ANCHORS_MISSING_IN_NATIVE_REPLAY')
         chk({x['name'] for x in checked}==set(base),'NATIVE_REPLAY_IDENTITIES_DRIFT')
         for x in checked:
          ref=int(base[x['name']]['exact_production_JS_replayed_FV'])
          if x['position']!='RB':chk(x['base_native_FV']==ref,'NON_RB_NATIVE_PARITY_DRIFT_'+x['name'])
          else:chk(abs(x['base_native_FV']-ref)<=5,'RB_FRACTIONAL_AGE_DATE_DRIFT_'+x['name'])
         for d in diag:
          if d['target_native_quote_reachable_within_015_155']:
           chk(d['all_other_517_player_quotes_unchanged_in_isolated_test'],'CROSS_PLAYER_SIDE_EFFECT_'+d['name'])
           chk(abs(d['quote_diff_from_review_target'])<=1,'NATIVE_TARGET_INVERSION_NOT_PRECISE_'+d['name'])
          chk(d['owner_approved'] is False and d['unvalidated_intrinsic_fv'] is True,'FALSE_APPROVAL')
         # Source identity and nonmutating state are the only certified gates.
         for p in [r77,r72]:chk(p.is_dir(),'MISSING_SOURCE')
         checked_csv=[]
         for x in checked:
          checked_csv.append({'name':x['name'],'position':x['position'],'canonical_key':x['key'],
           'pinned_R72_live_FV':base[x['name']]['exact_production_JS_replayed_FV'],
           'R78_replayed_unmodified_FV':x['base_native_FV'],'owner_anchor_active':x['anchor'],
           '2026_week7plus_actuals_used':False,'production_quote_modified':False})
         audit=[]
         for d in diag:
          audit.append({'name':d['name'],'position':d['position'],'focus_pilot':d['focus_pilot'],
            'live_FV':d['live_FV'],'R77_bounded_operational_target_NOT_APPROVED':d['target_r77_operational_only'],
            'current_RAW_PROD_MULT':round(d['old_prod_mult'],10),
            'min_possible_FV_015_clamp':d['min_quote_in_clamp'],
            'max_possible_FV_155_clamp':d['max_quote_in_clamp'],
            'native_target_reachable_within_existing_multiplier_clamp':d['target_native_quote_reachable_within_015_155'],
            'required_RAW_PROD_MULT_if_reachable_NOT_EVIDENCE_BASED':round(d['raw_prod_mult_required_for_operational_target'],10) if d['raw_prod_mult_required_for_operational_target'] is not None else '',
            'isolated_native_JS_FV_math_result':d['calculated_native_quote_after_isolated_change'] if d['calculated_native_quote_after_isolated_change'] is not None else '',
            'math_quote_error_points':d['quote_diff_from_review_target'] if d['quote_diff_from_review_target'] is not None else '',
            'other_517_player_quotes_unchanged':d['all_other_517_player_quotes_unchanged_in_isolated_test'],
            'operational_cap_is_not_evidence_based':True,'intrinsic_FV_validated':False,
            'owner_approval_status':'NOT_REQUESTED','production_write_authorized':False})
         focus=[x for name in FOCUS for x in audit if x['name']==name]
         chk(len(focus)==5,'FOCUS_CARD_COUNT')
         outputs={'CAL26_R78_518_exact_live_quote_regression_NO_FV_WRITES.csv':checked_csv,
         'CAL26_R78_16_native_production_multiplier_inversion_REVIEW_ONLY.csv':audit,
         'CAL26_R78_5_owner_focus_quotes_NOT_APPROVED.csv':focus}
         for k,rr in outputs.items():writecsv(out/k,rr)
         feasible=sum(x['native_target_reachable_within_existing_multiplier_clamp'] for x in audit)
         lines=['# CAL26 V1R78 — Five-player native FV quote dry run','',
         '**Engineering rehearsal only. No automatic or authorized FV pricing change.**','',
         'R77 provided 16 bounded review values. Those values reflect an operational ±8% cap, not a fitted Fundamental Value scale. R78 tests only whether they can be reproduced by the deployed JS `playerValue()` under isolated production-multiplier scenarios.', '',
         f'Pinned native source: `{git_blob_sha(repo/"index.html")}`; {len(checked)} replayed quotes, {sum(x["anchor"] for x in checked)} owner anchors, {len(diag)} candidate cards.','',
         f'16 diagnostic quote targets feasible within existing raw multiplier 0.15–1.55: **{feasible}**. Unreachable: **{16-feasible}**.','',
         '| Owner focus player | Live FV | R77 operational shadow | Native JS reachable |',
         '|---|---:|---:|---|']
         for x in focus:
          lines.append(f"| {x['name'].title()} | {x['live_FV']} | {x['R77_bounded_operational_target_NOT_APPROVED']} | {'Yes' if x['native_target_reachable_within_existing_multiplier_clamp'] else 'No'} |")
         lines +=['','- Each scenario temporarily changes a single research sandbox production-multiplier key and checks all other 517 quotes for unintended movement. No changes are saved.',
         '- For running backs, original day-dependent fractional-age calculations are permitted up to a 5 FV-point replay variance; all QB, WR, TE, and IDP baseline quotes must match R72 exactly.',
         '- All 15 pinned owner anchors remain untouched.',
         '- A mechanically reproducible number is **not** a calibrated, approved new FV. This run has no sports-outcome re-fit, temporal DLF holdout, or independent proof of direction or price magnitude.',
         '- Do not use the derived multipliers as proposed PRODUCTION_MULT without separate owner approval and a tested football-production-to-multiplier transfer equation.',
         '', '**Next owner decision:** review these five players; any eventual release must independently justify price direction and size.','']
         (out/'CAL26_R78_decision.md').write_text('\n'.join(lines),encoding='utf-8')
         allout=[*outputs,'CAL26_R78_decision.md']
         manifest={'run':'CAL26_V1R78','decision':'EXACT_NATIVE_JS_REHEARSAL_FV_HOLD',
          'source_artifacts':{'R77_run':R77_RUN,'R72_run':R72_RUN},'index_git_blob_sha1':git_blob_sha(repo/'index.html'),
          'players_replayed':518,'owner_review_count':16,'focus_count':5,'owner_anchors_protected':15,
          'numerically_reachable_count':feasible,'unreachable_count':16-feasible,
          'no_2026_week7plus_actuals':True,'private_DLF_rows_exported':False,
          'raw_multiplier_inversion_not_evidence_based':True,'independent_FV_price_calibration':False,
          'production_changes':0,'can_auto_apply':False,'owner_approval':False,
          'output_sha256':{k:sha(out/k) for k in allout}}
         (out/'CAL26_R78_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
         print('R78_COMPLETE_NO_RELEASE',json.dumps({k:v for k,v in manifest.items() if k!='output_sha256'}))
         return manifest

        def selftest():
         s='''const PROD_MULT_DATA = {'bryce young':0.75};\nconst PLAYER_DB = {'bryce young':{pos:'QB',age:25,role:'Every-Down'}};\nfunction playerValue(pos,age,role,name){return Math.round(100 * pw * am * rm * 55);}\n'''
         chk(closing_brace(s,s.index('{'))>0,'JS_BRACE_PARSER')
         chk(len(FOCUS)==5 and len(set(FOCUS))==5,'FOCUS_UNIQUE')
         chk(abs(.08-(1080/1000-1))<1e-8,'BOUNDING_MATH_TEST')
         print('R78_SELFTEST_GREEN source parser, five unique focus subjects, numerical bound math')
        if __name__=='__main__':
         p=argparse.ArgumentParser();p.add_argument('--r77');p.add_argument('--r72');p.add_argument('--repo');p.add_argument('--out');p.add_argument('--fixture',action='store_true');p.add_argument('--selftest',action='store_true')
         args=p.parse_args()
         if args.selftest:selftest()
         else:main(args)
        PY_R78_ENGINE
        python -m py_compile "$RUNNER_TEMP/CAL26_R78_engine.py"
        python "$RUNNER_TEMP/CAL26_R78_engine.py" --selftest
        python "$RUNNER_TEMP/CAL26_R78_engine.py" \
          --r77 "$RUNNER_TEMP/cal26-r78-in/R77" \
          --r72 "$RUNNER_TEMP/cal26-r78-in/R72" \
          --repo "$GITHUB_WORKSPACE" \
          --out "$RUNNER_TEMP/cal26-r78-results"
        python - "$RUNNER_TEMP/cal26-r78-results" <<'PY_R78_VERIFY'
        import csv,hashlib,json,pathlib,sys
