name: Apply Free Agent UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify expected source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB="1c87c3e2483aee73852039167a94f72242107a47"
          ACTUAL_BLOB="$(git hash-object free-agent-board.html)"
          echo "Expected free-agent-board.html blob: $EXPECTED_BLOB"
          echo "Actual free-agent-board.html blob:   $ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_COMMIT: b05a528db7a0d83fd26a789bee3efa6531dd858f
          BACKUP_TAG: free-agent-board-pre-app-shell-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" "${BACKUP_COMMIT}"
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created rollback tag ${BACKUP_TAG} -> ${BACKUP_COMMIT}"
          fi

      - name: Apply Trade Desk app shell to Free Agent Board
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import hashlib

          board_path = Path("free-agent-board.html")
          index_path = Path("index.html")

          text = board_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")

          MARKER = "FREE_AGENT_APP_SHELL_V1"
          CANONICAL_MARKER = "/* CANONICAL VALUATION SYNC"

          if MARKER in text:
              raise SystemExit(f"{MARKER} already present; refusing to double-apply UI patch.")

          start = text.index(CANONICAL_MARKER)
          end = text.index("</script>", start) + len("</script>")
          canonical_before = text[start:end]
          canonical_sha_before = hashlib.sha256(canonical_before.encode("utf-8")).hexdigest()

          # Reuse the exact league logo already embedded in production index.html.
          logo_src = None
          for tag in re.findall(r"<img\b[^>]*>", index, flags=re.I):
              if 'class="league-logo"' in tag or "class='league-logo'" in tag:
                  m = re.search(r'\bsrc=["\']([^"\']+)["\']', tag, flags=re.I)
                  if m:
                      logo_src = m.group(1)
                      break
          if not logo_src:
              raise RuntimeError("Could not find production .league-logo image in index.html")

          old_font = (
              "https://fonts.googleapis.com/css2?"
              "family=Inter:wght@400;500;600;700&"
              "family=IBM+Plex+Mono:wght@400;500;600&display=swap"
          )
          new_font = (
              "https://fonts.googleapis.com/css2?"
              "family=Anton&"
              "family=Inter:wght@400;500;600;700&"
              "family=IBM+Plex+Mono:wght@400;500;600&display=swap"
          )
          if old_font not in text:
              raise RuntimeError("Expected Free Agent Board font link not found")
          text = text.replace(old_font, new_font, 1)

          text = text.replace(
              "<title>Free Agent Board — Private</title>",
              "<title>Free Agent Board — League of Ordinary Gentlemen</title>",
              1,
          )

          new_css = r"""
            :root{
              --bg:#0E2841;
              --panel:#16324F;
              --panel-alt:#1E3E60;
              --line:rgba(201,206,210,.12);
              --line-strong:rgba(201,206,210,.24);
              --text:#F8FAFC;
              --text-muted:#B5C4D6;
              --text-dim:#516885;
              --gold:#EB6261;
              --gold-dim:#8A2E2C;
              --green:#3FCB7C;
              --green-dim:#1F7A48;
              --red:#FF8A4C;
              --violet:#B68259;
              --amber:#E8B84B;

              /* Backward-compatible aliases used by the original board. */
              --accent:var(--gold);
              --good:var(--green);
            }

            *{box-sizing:border-box;}
            html,body{margin:0;padding:0;}
            html{scroll-behavior:smooth;}

            body{
              min-height:100vh;
              background:
                repeating-linear-gradient(
                  180deg,
                  rgba(201,206,210,.02) 0,
                  rgba(201,206,210,.02) 1px,
                  transparent 1px,
                  transparent 64px
                ),
                radial-gradient(
                  ellipse 900px 500px at 50% -10%,
                  rgba(235,98,97,.07),
                  transparent 60%
                ),
                var(--bg);
              color:var(--text);
              font-family:'Inter',sans-serif;
              font-weight:500;
              -webkit-font-smoothing:antialiased;
            }

            .log-app-shell{
              position:sticky;
              top:0;
              z-index:1000;
              width:100%;
              background:rgba(9,27,44,.965);
              border-bottom:1px solid var(--line);
              box-shadow:0 8px 30px rgba(0,0,0,.18);
              -webkit-backdrop-filter:blur(18px);
              backdrop-filter:blur(18px);
            }

            .log-app-topbar,
            .log-app-nav-inner{
              width:min(1180px, calc(100% - 32px));
              margin:0 auto;
            }

            .log-app-topbar{
              min-height:66px;
              display:flex;
              align-items:center;
              gap:13px;
              padding:9px 0 8px;
            }

            .log-app-logo{
              width:44px;
              height:44px;
              object-fit:contain;
              flex:0 0 auto;
              filter:drop-shadow(0 4px 12px rgba(235,98,97,.20));
            }

            .log-app-brand{
              min-width:0;
              display:flex;
              flex-direction:column;
              gap:2px;
            }

            .log-app-brand-title{
              font-family:'Anton',sans-serif;
              font-size:17px;
              line-height:1.05;
              text-transform:uppercase;
              letter-spacing:.035em;
              color:var(--text);
              white-space:nowrap;
            }

            .log-app-brand-sub{
              font-family:'IBM Plex Mono',monospace;
              font-size:9.5px;
              line-height:1.25;
              letter-spacing:.075em;
              text-transform:uppercase;
              color:var(--text-muted);
              white-space:nowrap;
              overflow:hidden;
              text-overflow:ellipsis;
              max-width:420px;
            }

            .log-app-context{
              margin-left:auto;
              display:flex;
              align-items:center;
              justify-content:flex-end;
              gap:14px;
              min-width:0;
            }

            .log-app-league{
              text-align:right;
              min-width:0;
            }

            .log-app-league-label{
              font-family:'IBM Plex Mono',monospace;
              font-size:8px;
              letter-spacing:.12em;
              text-transform:uppercase;
              color:var(--text-dim);
              margin-bottom:2px;
            }

            .log-app-league-name{
              font-size:11px;
              font-weight:700;
              color:var(--text-muted);
              white-space:nowrap;
            }

            .log-app-status{
              display:flex;
              align-items:center;
              gap:7px;
              min-height:27px;
              padding:0 9px;
              border:1px solid var(--line-strong);
              border-radius:999px;
              background:rgba(255,255,255,.025);
              font-family:'IBM Plex Mono',monospace;
              font-size:8.5px;
              font-weight:600;
              letter-spacing:.08em;
              color:var(--text-muted);
              white-space:nowrap;
            }

            .log-app-status-dot{
              width:7px;
              height:7px;
              border-radius:50%;
              flex:0 0 auto;
              background:var(--amber);
              box-shadow:0 0 8px rgba(232,184,75,.42);
            }

            .log-app-status.is-live{
              color:var(--green);
              border-color:rgba(63,203,124,.25);
              background:rgba(63,203,124,.06);
            }

            .log-app-status.is-live .log-app-status-dot{
              background:var(--green);
              box-shadow:0 0 8px rgba(63,203,124,.62);
            }

            .log-app-status.is-fail{
              color:var(--red);
              border-color:rgba(255,138,76,.30);
              background:rgba(255,138,76,.06);
            }

            .log-app-status.is-fail .log-app-status-dot{
              background:var(--red);
              box-shadow:0 0 8px rgba(255,138,76,.55);
            }

            .log-app-sync{
              font-family:'IBM Plex Mono',monospace;
              font-size:8.5px;
              line-height:1.2;
              color:var(--text-dim);
              white-space:nowrap;
            }

            .log-app-nav{
              border-top:1px solid rgba(201,206,210,.07);
              background:rgba(4,14,24,.12);
            }

            .log-app-nav-inner{
              min-height:42px;
              display:flex;
              align-items:stretch;
              gap:3px;
            }

            .log-app-nav-item{
              position:relative;
              display:flex;
              align-items:center;
              justify-content:center;
              gap:7px;
              min-width:0;
              padding:0 14px;
              border:0;
              border-radius:0;
              background:transparent;
              color:var(--text-muted);
              text-decoration:none;
              font-family:'Inter',sans-serif;
              font-size:11.5px;
              font-weight:700;
              cursor:pointer;
              white-space:nowrap;
              transition:background .15s ease,color .15s ease;
            }

            .log-app-nav-item:hover{
              background:rgba(255,255,255,.055);
              color:var(--text);
            }

            .log-app-nav-item.is-active{
              color:var(--text);
              background:rgba(235,98,97,.065);
            }

            .log-app-nav-item.is-active::after{
              content:'';
              position:absolute;
              left:11px;
              right:11px;
              bottom:0;
              height:2px;
              border-radius:2px 2px 0 0;
              background:var(--gold);
              box-shadow:0 0 10px rgba(235,98,97,.32);
            }

            .log-app-nav-icon{
              font-family:'IBM Plex Mono',monospace;
              font-size:9px;
              color:var(--text-dim);
            }

            .log-app-nav-item.is-active .log-app-nav-icon{
              color:var(--gold);
            }

            .wrap{
              width:min(820px, calc(100% - 32px));
              margin:0 auto;
              padding:20px 0 56px;
            }

            .page-header{
              position:relative;
              padding:18px 2px 20px;
              border-bottom:1px solid var(--line);
              margin-bottom:18px;
            }

            .eyebrow{
              font-family:'IBM Plex Mono',monospace;
              font-size:10px;
              letter-spacing:.12em;
              text-transform:uppercase;
              color:var(--gold);
              margin-bottom:7px;
            }

            h1{
              font-family:'Anton',sans-serif;
              font-size:31px;
              line-height:1;
              text-transform:uppercase;
              letter-spacing:.01em;
              margin:0 0 8px;
              font-weight:700;
            }

            .page-header p{
              color:var(--text-muted);
              font-size:13px;
              line-height:1.5;
              margin:0;
              max-width:64ch;
            }

            .status{
              display:inline-flex;
              align-items:center;
              margin-top:11px;
              padding:6px 9px;
              border:1px solid var(--line);
              border-radius:999px;
              background:rgba(255,255,255,.025);
              font-family:'IBM Plex Mono',monospace;
              font-size:9.5px;
              line-height:1.25;
              color:var(--text-dim);
            }

            .status.ok{
              color:var(--green);
              border-color:rgba(63,203,124,.22);
              background:rgba(63,203,124,.05);
            }

            .status.fail{
              color:var(--red);
              border-color:rgba(255,138,76,.24);
              background:rgba(255,138,76,.05);
            }

            .privacy-note{
              display:flex;
              align-items:flex-start;
              gap:10px;
              margin-bottom:16px;
              padding:11px 13px;
              border:1px solid var(--line);
              border-left:3px solid var(--violet);
              border-radius:9px;
              background:rgba(182,130,89,.055);
              color:var(--text-muted);
              font-family:'IBM Plex Mono',monospace;
              font-size:10.5px;
              line-height:1.45;
            }

            .privacy-icon{
              flex:0 0 auto;
              color:var(--violet);
              font-size:13px;
            }

            .filter-panel{
              margin:0 0 16px;
              padding:12px;
              border:1px solid var(--line);
              border-radius:10px;
              background:linear-gradient(180deg, rgba(30,62,96,.76), rgba(22,50,79,.76));
              box-shadow:0 8px 24px rgba(0,0,0,.10);
            }

            .filter-label{
              margin-bottom:9px;
              font-family:'IBM Plex Mono',monospace;
              font-size:9px;
              letter-spacing:.11em;
              text-transform:uppercase;
              color:var(--text-dim);
            }

            .controls{
              display:flex;
              gap:8px;
              margin:0;
              flex-wrap:wrap;
            }

            .toggle-btn{
              appearance:none;
              min-height:34px;
              padding:7px 12px;
              border:1px solid var(--line-strong);
              border-radius:7px;
              background:rgba(255,255,255,.025);
              color:var(--text-muted);
              font-family:'IBM Plex Mono',monospace;
              font-size:10px;
              font-weight:600;
              letter-spacing:.045em;
              text-transform:uppercase;
              cursor:pointer;
              transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease;
            }

            .toggle-btn:hover{
              color:var(--text);
              border-color:rgba(235,98,97,.36);
              background:rgba(235,98,97,.055);
            }

            .toggle-btn:active{
              transform:translateY(1px);
            }

            .toggle-btn.active{
              background:var(--gold);
              color:#fff;
              border-color:var(--gold);
              box-shadow:0 5px 16px rgba(235,98,97,.18);
            }

            #boardWrap{
              display:grid;
              gap:10px;
            }

            details{
              margin:0;
              border:1px solid var(--line);
              border-radius:10px;
              background:linear-gradient(180deg, rgba(22,50,79,.94), rgba(18,43,69,.96));
              box-shadow:0 8px 24px rgba(0,0,0,.09);
              overflow:hidden;
              transition:border-color .15s ease,box-shadow .15s ease;
            }

            details[open]{
              border-color:var(--line-strong);
              box-shadow:0 10px 28px rgba(0,0,0,.13);
            }

            summary{
              position:relative;
              display:flex;
              align-items:center;
              gap:6px;
              min-height:47px;
              padding:0 44px 0 15px;
              cursor:pointer;
              list-style:none;
              color:var(--text-muted);
              font-family:'IBM Plex Mono',monospace;
              font-size:11px;
              font-weight:600;
              letter-spacing:.07em;
              text-transform:uppercase;
              user-select:none;
            }

            summary::-webkit-details-marker{display:none;}

            summary::after{
              content:'+';
              position:absolute;
              right:15px;
              top:50%;
              transform:translateY(-50%);
              color:var(--text-dim);
              font-size:18px;
              font-weight:400;
              line-height:1;
            }

            details[open] summary{
              color:var(--text);
              border-bottom:1px solid var(--line);
            }

            details[open] summary::after{
              content:'−';
              color:var(--gold);
            }

            .body-wrap{
              padding:10px;
            }

            .row{
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:12px;
              min-height:55px;
              margin-bottom:7px;
              padding:9px 11px 9px 12px;
              border:1px solid var(--line);
              border-radius:8px;
              background:rgba(30,62,96,.68);
              transition:background .14s ease,border-color .14s ease,transform .14s ease;
            }

            .row:last-child{margin-bottom:0;}

            .row:hover{
              background:rgba(30,62,96,.92);
              border-color:var(--line-strong);
              transform:translateY(-1px);
            }

            .row.has-data{
              border-left:3px solid var(--green);
              padding-left:10px;
            }

            .row-info{
              min-width:0;
            }

            .row-title{
              color:var(--text);
              font-size:13.5px;
              font-weight:700;
              line-height:1.25;
            }

            .row-meta{
              margin-top:4px;
              color:var(--text-muted);
              font-family:'IBM Plex Mono',monospace;
              font-size:9.5px;
              line-height:1.35;
            }

            .row-meta .tag-data{
              color:var(--green);
              font-weight:600;
            }

            .row-meta .tag-est{
              color:var(--text-dim);
            }

            .row-val{
              flex:0 0 auto;
              min-width:74px;
              padding:6px 8px;
              border:1px solid var(--line);
              border-radius:7px;
              background:rgba(9,27,44,.38);
              color:var(--text);
              text-align:right;
              font-family:'IBM Plex Mono',monospace;
              font-size:13px;
              font-weight:600;
              font-variant-numeric:tabular-nums;
            }

            .row.has-data .row-val{
              border-color:rgba(63,203,124,.16);
            }

            .empty{
              padding:14px 5px;
              color:var(--text-dim);
              font-size:12px;
              font-style:italic;
            }

            @media (max-width:760px){
              .log-app-topbar,
              .log-app-nav-inner{
                width:min(100% - 22px, 1180px);
              }

              .log-app-topbar{
                min-height:58px;
                gap:10px;
                padding:7px 0;
              }

              .log-app-logo{
                width:38px;
                height:38px;
              }

              .log-app-brand-title{
                font-size:14px;
              }

              .log-app-brand-sub{
                max-width:48vw;
                font-size:8px;
              }

              .log-app-league,
              .log-app-sync{
                display:none;
              }

              .log-app-context{
                gap:8px;
              }

              .log-app-status{
                min-height:25px;
                padding:0 8px;
                font-size:7.5px;
              }

              .log-app-nav-inner{
                min-height:40px;
                overflow-x:auto;
                scrollbar-width:none;
              }

              .log-app-nav-inner::-webkit-scrollbar{display:none;}

              .log-app-nav-item{
                flex:1 0 auto;
                padding:0 11px;
                font-size:10.5px;
              }

              .wrap{
                width:min(100% - 22px, 820px);
                padding-top:14px;
              }

              .page-header{
                padding-top:14px;
              }

              h1{
                font-size:28px;
              }

              .row{
                align-items:flex-start;
              }

              .row-val{
                min-width:66px;
              }
            }

            @media (max-width:430px){
              .log-app-brand-sub{
                max-width:42vw;
              }

              .log-app-status{
                padding:0 7px;
              }

              .log-app-status-text{
                max-width:58px;
                overflow:hidden;
                text-overflow:ellipsis;
              }

              .controls{
                display:grid;
                grid-template-columns:1fr 1fr;
              }

              .toggle-btn{
                width:100%;
              }

              .row{
                gap:8px;
                padding-right:8px;
              }

              .row-title{
                font-size:13px;
              }

              .row-meta{
                font-size:8.8px;
              }

              .row-val{
                min-width:62px;
                padding:5px 6px;
                font-size:12px;
              }
            }
          """

          text, count = re.subn(
              r"<style>.*?</style>",
              "<style>\n" + new_css.strip() + "\n</style>",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f"Expected to replace one top-level style block, replaced {count}")

          new_body = f"""<body>
          <!-- {MARKER} -->
          <div class="log-app-shell">
            <div class="log-app-topbar">
              <img class="log-app-logo" src="{logo_src}" alt="">
              <div class="log-app-brand">
                <div class="log-app-brand-title">Claude Dynasty Trade Calculator</div>
                <div class="log-app-brand-sub">League of Ordinary Gentlemen · IDP Dynasty</div>
              </div>
              <div class="log-app-context">
                <div class="log-app-league">
                  <div class="log-app-league-label">Current League</div>
                  <div class="log-app-league-name">League of Ordinary Gentlemen</div>
                </div>
                <div class="log-app-status" id="freeAgentModelStatus" role="status" aria-live="polite">
                  <span class="log-app-status-dot"></span>
                  <span class="log-app-status-text">SYNCING</span>
                </div>
                <div class="log-app-sync" id="freeAgentLastSync">Last sync: —</div>
              </div>
            </div>

            <div class="log-app-nav">
              <nav class="log-app-nav-inner" aria-label="Primary">
                <a class="log-app-nav-item" href="index.html">
                  <span class="log-app-nav-icon">◆</span>
                  <span>Trade Desk</span>
                </a>
                <a class="log-app-nav-item" href="index.html#needsWrap">
                  <span class="log-app-nav-icon">▦</span>
                  <span>My Team</span>
                </a>
                <a class="log-app-nav-item is-active" href="free-agent-board.html" aria-current="page">
                  <span class="log-app-nav-icon">＋</span>
                  <span>Free Agents</span>
                </a>
              </nav>
            </div>
          </div>

          <div class="wrap">
            <header class="page-header">
              <div class="eyebrow">League of Ordinary Gentlemen · IDP Dynasty</div>
              <h1>Free Agent Board</h1>
              <p>Value engine identical to the Trade Desk — every available player is checked against the same production data and valuation formulas.</p>
              <div class="status" id="syncStatus">Loading free agent data…</div>
            </header>

            <div class="privacy-note">
              <span class="privacy-icon">🔒</span>
              <span>Private tool — kept local, never hosted or shared. Nothing here is visible to anyone else in the league.</span>
            </div>

            <section class="filter-panel" aria-label="Free agent data filters">
              <div class="filter-label">Player Coverage</div>
              <div class="controls">
                <button class="toggle-btn active" id="dataOnlyBtn" onclick="setDataOnly(true)">Real data only</button>
                <button class="toggle-btn" id="allBtn" onclick="setDataOnly(false)">Show everyone</button>
              </div>
            </section>

            <div id="boardWrap"></div>
          </div>"""

          body_pattern = re.compile(
              r"<body>\s*<div class=\"wrap\">.*?<script>\s*/\* CANONICAL VALUATION SYNC",
              flags=re.S,
          )
          replacement = new_body + "\n\n<script>\n/* CANONICAL VALUATION SYNC"
          text, count = body_pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"Expected to replace one legacy body shell, replaced {count}")

          ui_runtime = r"""
          <script id="free-agent-app-shell-runtime">
          /* Free Agent app-shell presentation runtime. */
          (function () {
            'use strict';

            const source = document.getElementById('syncStatus');
            const badge = document.getElementById('freeAgentModelStatus');
            const badgeText = badge && badge.querySelector('.log-app-status-text');
            const lastSync = document.getElementById('freeAgentLastSync');

            function mirrorStatus() {
              if (!source || !badge || !badgeText) return;

              const isOk = source.classList.contains('ok');
              const isFail = source.classList.contains('fail');

              badge.classList.toggle('is-live', isOk && !isFail);
              badge.classList.toggle('is-fail', isFail);
              badgeText.textContent = isFail
                ? 'SYNC ISSUE'
                : (isOk ? 'LIVE MODEL' : 'SYNCING');
            }

            mirrorStatus();

            if (source && typeof MutationObserver !== 'undefined') {
              new MutationObserver(mirrorStatus).observe(source, {
                attributes: true,
                childList: true,
                subtree: true,
                characterData: true
              });
            }

            if (lastSync && typeof fetch === 'function') {
              fetch('data/last_synced.json', { cache: 'no-store' })
                .then(resp => resp.ok ? resp.json() : null)
                .then(doc => {
                  if (!doc) return;

                  if (doc.synced_at_readable) {
                    lastSync.textContent =
                      'Last sync: ' + String(doc.synced_at_readable).replace(' UTC', 'Z');
                    return;
                  }

                  const epoch = Number(doc.synced_at);
                  if (Number.isFinite(epoch)) {
                    lastSync.textContent =
                      'Last sync: ' + new Date(epoch * 1000).toLocaleString();
                  }
                })
                .catch(() => {});
            }
          })();
          </script>
          """

          if "</body>" not in text:
              raise RuntimeError("Closing </body> not found")
          text = text.replace("</body>", ui_runtime.strip() + "\n</body>", 1)

          # Hard guard: the canonical valuation engine must remain byte-for-byte
          # identical from its marker through the end of its script tag.
          start_after = text.index(CANONICAL_MARKER)
          end_after = text.index("</script>", start_after) + len("</script>")
          canonical_after = text[start_after:end_after]
          canonical_sha_after = hashlib.sha256(canonical_after.encode("utf-8")).hexdigest()

          if canonical_before != canonical_after:
              raise RuntimeError(
                  "Canonical Free Agent valuation block changed during a UI-only patch"
              )

          if canonical_sha_before != canonical_sha_after:
              raise RuntimeError("Canonical valuation SHA mismatch")

          if text.count(MARKER) != 1:
              raise RuntimeError("Unexpected app-shell marker count")

          board_path.write_text(text, encoding="utf-8")

          print(f"PASS {MARKER}")
          print(f"PASS canonical valuation unchanged: {canonical_sha_after}")
          print(f"Updated {board_path}: {len(text):,} characters")
          PY

      - name: Validate canonical free-agent valuation parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync/sync_free_agent_valuation.py --check

      - name: Validate Free Agent Board JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("free-agent-board.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          if len(scripts) < 2:
              raise SystemExit(f"Expected at least 2 inline scripts, found {len(scripts)}")

          out = Path("/tmp/free-agent-board-inline.js")
          out.write_text("\n;\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline scripts -> {out}")
          PY
          node --check /tmp/free-agent-board-inline.js

      - name: Validate patch cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git status --short

      - name: Commit styled Free Agent Board
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add free-agent-board.html

          if git diff --cached --quiet; then
            echo "No Free Agent Board UI changes to commit."
            exit 0
          fi

          git commit -m "Style Free Agent Board to match Trade Desk"
          git push origin HEAD:main
