name: Workflow Folder Cleanup — One Time

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install requests pyyaml

      - name: Guard restart state and exact pre-cleanup inventory
        env:
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -z "$(git status --porcelain=v1)"

          D="research/package-adjustment-nextgen-v2"
          test "$(git hash-object "$D/prospective_voting_restart_30_daily_v1.json")" =             "2b8fbc79d0c0c7da31aa0a2ce2d2c4b44c554e2b"

          grep -Fq "const PACKAGE_VOTE_DAILY_LIMIT = 30;" index.html
          grep -Fq "package_votes_nextgen_v2_prospective_v1_restart30_" index.html

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          amendment = json.loads(
              (d / "prospective_voting_restart_30_daily_v1.json").read_text()
          )
          assert amendment["status"] == "frozen_prospective_restart_amendment_30_daily"
          assert amendment["invalidated_pre_restart_evidence"]["raw_rows_observed_before_restart"] == 20
          assert amendment["invalidated_pre_restart_evidence"]["distinct_voter_identities_observed_before_restart"] == 1
          assert amendment["invalidated_pre_restart_evidence"]["choice_fields_inspected"] is False

          rules = amendment["superseding_evidence_rules"]
          assert rules["daily_valid_vote_cap_per_voter"] == 30
          assert rules["effective_lifetime_cap_per_voter"] == 30.0
          assert rules["minimum_distinct_voters"] == 30
          assert rules["first_checkpoint_effective_votes"] == 900
          assert rules["hard_cap_effective_votes"] == 1000

          expected = set([
              "age-curve-v2-phase5.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "fix-fantasypros-sleeper-stable-suffix-continuity.yml",
              "ktc-cap-sensitivity.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "package-adjustment-nextgen-v2-activate-prospective-voting.yml",
              "package-adjustment-nextgen-v2-activate-voting.yml",
              "package-adjustment-nextgen-v2-commit-maturity-plan.yml",
              "package-adjustment-nextgen-v2-correct-sampling-contract.yml",
              "package-adjustment-nextgen-v2-defer-unsupported-filler.yml",
              "package-adjustment-nextgen-v2-diversity-regenerate.yml",
              "package-adjustment-nextgen-v2-dry-run.yml",
              "package-adjustment-nextgen-v2-filler-diversity-capacity-audit.yml",
              "package-adjustment-nextgen-v2-freeze-beta-bound-amendment.yml",
              "package-adjustment-nextgen-v2-freeze-catalog.yml",
              "package-adjustment-nextgen-v2-freeze-m2b-research-candidate.yml",
              "package-adjustment-nextgen-v2-freeze-model-fit-preregistration.yml",
              "package-adjustment-nextgen-v2-freeze-prospective-catalog.yml",
              "package-adjustment-nextgen-v2-freeze-prospective-time-holdout-preregistration.yml",
              "package-adjustment-nextgen-v2-freeze-readiness-audit.yml",
              "package-adjustment-nextgen-v2-generate-catalog.yml",
              "package-adjustment-nextgen-v2-joint-feasibility-audit.yml",
              "package-adjustment-nextgen-v2-m2b-fold-boundary-diagnostic.yml",
              "package-adjustment-nextgen-v2-maturity-monitor.yml",
              "package-adjustment-nextgen-v2-maturity-planning-audit.yml",
              "package-adjustment-nextgen-v2-model-fit-beta-amended-v1.yml",
              "package-adjustment-nextgen-v2-model-fit.yml",
              "package-adjustment-nextgen-v2-permanent-guardrails.yml",
              "package-adjustment-nextgen-v2-repair-prospective-activation-ui.yml",
              "package-adjustment-nextgen-v2-restart-prospective-voting-30-daily.yml",
              "package-adjustment-nextgen-v2-scale-integrity-audit.yml",
              "package-adjustment-nextgen-v2-training-boundary-diagnostic-optimized.yml",
              "package-adjustment-nextgen-v2-training-boundary-diagnostic.yml",
              "package-adjustment-v1-6-ui-redesign.yml",
              "package-vote-aggregation-v3.yml",
              "player-suggestion-auto-add.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "retire-team-impact-ui.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
              "trade-desk-navigation-reorg.yml",
              "workflow-folder-cleanup.yml",
          ])
          actual = {
              p.name for p in Path(".github/workflows").iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          if actual != expected:
              raise RuntimeError(
                  f"workflow inventory drift; missing={sorted(expected-actual)} "
                  f"unexpected={sorted(actual-expected)}"
              )
          assert len(actual) == 50
          print("PASS: exact 50-workflow pre-cleanup inventory confirmed.")
          PY

      - name: Parse all workflow YAML before cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path(".github/workflows").glob("*.y*ml"))
          assert len(paths) == 50
          for path in paths:
              doc = yaml.load(path.read_text(), Loader=yaml.BaseLoader)
              assert isinstance(doc, dict), path
              assert "jobs" in doc, path
          print("PASS: all 50 workflows parse as YAML.")
          PY

      - name: Verify repository health before cleanup
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Delete obsolete workflows and this cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          delete = set([
              "fix-fantasypros-sleeper-stable-suffix-continuity.yml",
              "package-adjustment-nextgen-v2-activate-prospective-voting.yml",
              "package-adjustment-nextgen-v2-activate-voting.yml",
              "package-adjustment-nextgen-v2-commit-maturity-plan.yml",
              "package-adjustment-nextgen-v2-correct-sampling-contract.yml",
              "package-adjustment-nextgen-v2-defer-unsupported-filler.yml",
              "package-adjustment-nextgen-v2-diversity-regenerate.yml",
              "package-adjustment-nextgen-v2-dry-run.yml",
              "package-adjustment-nextgen-v2-filler-diversity-capacity-audit.yml",
              "package-adjustment-nextgen-v2-freeze-beta-bound-amendment.yml",
              "package-adjustment-nextgen-v2-freeze-catalog.yml",
              "package-adjustment-nextgen-v2-freeze-m2b-research-candidate.yml",
              "package-adjustment-nextgen-v2-freeze-model-fit-preregistration.yml",
              "package-adjustment-nextgen-v2-freeze-prospective-catalog.yml",
              "package-adjustment-nextgen-v2-freeze-prospective-time-holdout-preregistration.yml",
              "package-adjustment-nextgen-v2-freeze-readiness-audit.yml",
              "package-adjustment-nextgen-v2-generate-catalog.yml",
              "package-adjustment-nextgen-v2-joint-feasibility-audit.yml",
              "package-adjustment-nextgen-v2-m2b-fold-boundary-diagnostic.yml",
              "package-adjustment-nextgen-v2-maturity-monitor.yml",
              "package-adjustment-nextgen-v2-maturity-planning-audit.yml",
              "package-adjustment-nextgen-v2-model-fit-beta-amended-v1.yml",
              "package-adjustment-nextgen-v2-model-fit.yml",
              "package-adjustment-nextgen-v2-permanent-guardrails.yml",
              "package-adjustment-nextgen-v2-repair-prospective-activation-ui.yml",
              "package-adjustment-nextgen-v2-restart-prospective-voting-30-daily.yml",
              "package-adjustment-nextgen-v2-scale-integrity-audit.yml",
              "package-adjustment-nextgen-v2-training-boundary-diagnostic-optimized.yml",
              "package-adjustment-nextgen-v2-training-boundary-diagnostic.yml",
              "package-adjustment-v1-6-ui-redesign.yml",
              "package-vote-aggregation-v3.yml",
              "player-suggestion-auto-add.yml",
              "retire-team-impact-ui.yml",
              "trade-desk-navigation-reorg.yml",
              "workflow-folder-cleanup.yml",
          ])
          keep = set([
              "age-curve-v2-phase5.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "ktc-cap-sensitivity.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
          ])
          assert len(delete) == 35
          assert len(keep) == 15
          assert delete.isdisjoint(keep)

          root = Path(".github/workflows")
          current = {p.name for p in root.glob("*.y*ml")}
          assert current == delete | keep

          for name in sorted(delete):
              subprocess.run(["git", "rm", "--", str(root / name)], check=True)

          remaining = {p.name for p in root.glob("*.y*ml")}
          assert remaining == keep
          print("PASS: deleted exactly 35 workflows.")
          print("PASS: exactly 15 ongoing workflows remain.")
          PY

      - name: Audit retained workflow dependencies and triggers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          expected = set([
              "age-curve-v2-phase5.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "ktc-cap-sensitivity.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
          ])
          root = Path(".github/workflows")
          actual = {p.name for p in root.glob("*.y*ml")}
          assert actual == expected

          docs = {}
          for name in sorted(actual):
              doc = yaml.load((root / name).read_text(), Loader=yaml.BaseLoader)
              assert isinstance(doc, dict) and "jobs" in doc
              docs[name] = doc

          assert docs["scheduled-data-refresh.yml"]["name"] == "Scheduled Data Refresh"
          assert docs["repo-regression-checks.yml"]["name"] == "Repo Regression Checks"
          assert docs["sync-sleeper.yml"]["name"] == "Sleeper Maintenance"

          rr = docs["repo-regression-checks.yml"]["on"]
          assert "pull_request" in rr
          assert "workflow_run" in rr
          assert rr["workflow_run"]["workflows"] == ["Scheduled Data Refresh"]

          scheduled = [
              "age-curve-v2-phase5.yml",
              "durability-v2-phase5.yml",
              "ktc_voter_balance_prospective.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
          ]
          for name in scheduled:
              assert "schedule" in docs[name]["on"], name

          for name in [
              "fantasypros-api-pipeline.yml",
              "ktc-cap-sensitivity.yml",
              "ktc-vote-aggregation.yml",
          ]:
              assert "workflow_dispatch" in docs[name]["on"], name

          print("PASS: retained workflow trigger/dependency audit passed.")
          PY

      - name: Verify exact deletion-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = set([
              "fix-fantasypros-sleeper-stable-suffix-continuity.yml",
              "package-adjustment-nextgen-v2-activate-prospective-voting.yml",
              "package-adjustment-nextgen-v2-activate-voting.yml",
              "package-adjustment-nextgen-v2-commit-maturity-plan.yml",
              "package-adjustment-nextgen-v2-correct-sampling-contract.yml",
              "package-adjustment-nextgen-v2-defer-unsupported-filler.yml",
              "package-adjustment-nextgen-v2-diversity-regenerate.yml",
              "package-adjustment-nextgen-v2-dry-run.yml",
              "package-adjustment-nextgen-v2-filler-diversity-capacity-audit.yml",
              "package-adjustment-nextgen-v2-freeze-beta-bound-amendment.yml",
              "package-adjustment-nextgen-v2-freeze-catalog.yml",
              "package-adjustment-nextgen-v2-freeze-m2b-research-candidate.yml",
              "package-adjustment-nextgen-v2-freeze-model-fit-preregistration.yml",
              "package-adjustment-nextgen-v2-freeze-prospective-catalog.yml",
              "package-adjustment-nextgen-v2-freeze-prospective-time-holdout-preregistration.yml",
              "package-adjustment-nextgen-v2-freeze-readiness-audit.yml",
              "package-adjustment-nextgen-v2-generate-catalog.yml",
              "package-adjustment-nextgen-v2-joint-feasibility-audit.yml",
              "package-adjustment-nextgen-v2-m2b-fold-boundary-diagnostic.yml",
              "package-adjustment-nextgen-v2-maturity-monitor.yml",
              "package-adjustment-nextgen-v2-maturity-planning-audit.yml",
              "package-adjustment-nextgen-v2-model-fit-beta-amended-v1.yml",
              "package-adjustment-nextgen-v2-model-fit.yml",
              "package-adjustment-nextgen-v2-permanent-guardrails.yml",
              "package-adjustment-nextgen-v2-repair-prospective-activation-ui.yml",
              "package-adjustment-nextgen-v2-restart-prospective-voting-30-daily.yml",
              "package-adjustment-nextgen-v2-scale-integrity-audit.yml",
              "package-adjustment-nextgen-v2-training-boundary-diagnostic-optimized.yml",
              "package-adjustment-nextgen-v2-training-boundary-diagnostic.yml",
              "package-adjustment-v1-6-ui-redesign.yml",
              "package-vote-aggregation-v3.yml",
              "player-suggestion-auto-add.yml",
              "retire-team-impact-ui.yml",
              "trade-desk-navigation-reorg.yml",
              "workflow-folder-cleanup.yml",
          ])
          rows = subprocess.check_output(
              ["git", "diff", "--name-status"], text=True
          ).splitlines()

          seen = set()
          for row in rows:
              status, path = row.split("\t", 1)
              assert status == "D", (status, path)
              assert path.startswith(".github/workflows/"), path
              seen.add(path.removeprefix(".github/workflows/"))

          assert seen == expected
          assert len(seen) == 35
          print("PASS: diff is exactly 35 workflow deletions and nothing else.")
          PY
          git diff --check

      - name: Verify repository health after cleanup
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-desk-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"

          test "$(git diff --cached --name-only | wc -l)" -eq 35
          test -z "$(git diff --cached --name-status | awk '$1 != "D" {print}')"

          git commit -m "Clean up completed GitHub workflows"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

          python3 - <<'PY'
          from pathlib import Path

          keep = set([
              "age-curve-v2-phase5.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "ktc-cap-sensitivity.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
          ])
          actual = {p.name for p in Path(".github/workflows").glob("*.y*ml")}
          assert actual == keep
          assert len(actual) == 15
          print("PASS: final workflow folder contains exactly 15 workflows.")
          print("PASS: cleanup workflow deleted itself.")
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

          echo "WORKFLOW CLEANUP COMPLETE: 50 -> 15."
