name: Workflow Folder Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  archive-completed-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cleanup audit dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "PyYAML==6.0.2"

      - name: Guard cleanup inventory
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import yaml

          workflow_dir = Path(".github/workflows")
          archive_dir = Path(".github/workflow-archive/completed-research")

          archive = [
            "age-curve-v2-phase5.yml"
            "draft-pick-fv-mathematical-audit.yml"
            "draft-pick-fv-v1-historical-draft-catalog.yml"
            "draft-pick-fv-v1-preregistration.yml"
            "draft-pick-fv-v2-broad-cohort-catalog.yml"
            "draft-pick-fv-v2-preregistration.yml"
            "draft-pick-fv-v3-catalog-preregistration-freeze.yml"
            "draft-pick-fv-v3-close-v4-source-recovery-freeze.yml"
            "draft-pick-fv-v3-custom-player-identity-audit.yml"
            "draft-pick-fv-v3-harvest-identity-contract-repair.yml"
            "draft-pick-fv-v3-harvest-identity-repair.yml"
            "draft-pick-fv-v3-harvest-identity.yml"
            "draft-pick-fv-v3-mfl-2018-boundary-recovery.yml"
            "draft-pick-fv-v3-mfl-2018-final-boundary-resolution.yml"
            "draft-pick-fv-v3-mfl-pooled-design-freeze.yml"
            "draft-pick-fv-v3-mfl-reference-expansion.yml"
            "draft-pick-fv-v3-mfl-schema-qualification.yml"
            "draft-pick-fv-v3-mfl-source-feasibility.yml"
            "draft-pick-fv-v3-mfl-validated-proxy-feasibility.yml"
            "draft-pick-fv-v3-rookie-scope-contamination-audit.yml"
            "draft-pick-valuation-structural-audit.yml"
            "draft-slot-projection-activation.yml"
            "durability-v2-phase5.yml"
            "elite-surplus-positional-scarcity-audit.yml"
            "elite-surplus-v1-development-preregistration.yml"
            "elite-surplus-v1-historical-development-evaluator.yml"
            "fundamental-value-structural-outlier-audit.yml"
            "ktc-cap-sensitivity.yml"
            "ktc_voter_balance_prospective.yml"
            "no-history-rookie-v2-phase3.yml"
            "opportunity-v2-phase5.yml"
            "package-adjustment-audit-step4-exact-live-oos.yml"
            "package-adjustment-nextgen-v2-m2b-failure-diagnostic.yml"
            "package-adjustment-nextgen-v2-m3-development-fit.yml"
            "package-adjustment-nextgen-v2-m3-development-preregistration.yml"
            "package-adjustment-nextgen-v2-prospective-evaluate-once.yml"
            "package-adjustment-nextgen-v2-prospective-freeze-exact-900.yml"
            "package-adjustment-nextgen-v2-prospective-maturity-monitor.yml"
            "package-adjustment-nextgen-v2-research-closeout.yml"
            "package-adjustment-v6-development-catalog.yml"
            "package-adjustment-v6-development-maturity-monitor.yml"
            "package-adjustment-v6-development-preregistration.yml"
            "package-adjustment-v6-development-voting-activation.yml"
            "position-weight-v2-phase5.yml"
            "prospective-trade-evidence-capture.yml"
            "qb-elite-fv-compression-diagnostic.yml"
            "qb-production-multiplier-lineage-diagnostic.yml"
            "replacement-level-v2-phase5.yml"
          ]

          protected = [
            "draft-pick-fv-v4-clean-source-recovery.yml"
            "fantasypros-api-pipeline.yml"
            "ktc-vote-aggregation.yml"
            "repo-regression-checks.yml"
            "scheduled-data-refresh.yml"
            "sync-sleeper.yml"
            "workflow-folder-cleanup.yml"
          ]

          archive_set = set(archive)
          protected_set = set(protected)

          assert len(archive) == len(archive_set)
          assert len(protected) == len(protected_set)
          assert not archive_set & protected_set

          current = {p.name for p in workflow_dir.glob("*.yml")}
          current |= {p.name for p in workflow_dir.glob("*.yaml")}

          missing_archive = sorted(archive_set - current)
          missing_protected = sorted(protected_set - current)
          unexpected = sorted(current - archive_set - protected_set)

          if missing_archive:
              raise SystemExit(
                  "Cleanup contract drift: expected completed workflows are missing: "
                  + ", ".join(missing_archive)
              )

          if missing_protected:
              raise SystemExit(
                  "Cleanup safety failure: protected workflows are missing: "
                  + ", ".join(missing_protected)
              )

          if unexpected:
              raise SystemExit(
                  "Cleanup contract drift: unclassified workflows exist. "
                  "Refusing to guess whether they are active: "
                  + ", ".join(unexpected)
              )

          def trigger_names(path: Path) -> set[str]:
              # BaseLoader prevents YAML 1.1 from interpreting the key `on`
              # as a boolean, while still validating the YAML structure.
              doc = yaml.load(path.read_text(), Loader=yaml.BaseLoader)
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")
              triggers = doc.get("on")
              if isinstance(triggers, str):
                  return {triggers}
              if isinstance(triggers, list):
                  return {str(x) for x in triggers}
              if isinstance(triggers, dict):
                  return {str(x) for x in triggers}
              raise SystemExit(f"Unrecognized workflow trigger syntax: {path}")

          trigger_report = {}
          for name in archive:
              path = workflow_dir / name
              triggers = trigger_names(path)
              trigger_report[name] = sorted(triggers)
              if triggers != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"REFUSING TO ARCHIVE {name}: triggers={sorted(triggers)}; "
                      "archive candidates must be workflow_dispatch-only."
                  )

          # Extra explicit deny-list even though the parsed exact-trigger check
          # above already catches these.
          dangerous = {
              "schedule",
              "push",
              "pull_request",
              "pull_request_target",
              "repository_dispatch",
              "workflow_call",
              "workflow_run",
              "release",
              "issues",
              "issue_comment",
          }
          for name, triggers in trigger_report.items():
              overlap = dangerous & set(triggers)
              if overlap:
                  raise SystemExit(
                      f"REFUSING TO ARCHIVE {name}: automatic/reusable triggers={sorted(overlap)}"
                  )

          # Prepare a cryptographic restoration manifest before any move occurs.
          manifest_rows = []
          for name in sorted(archive):
              src = workflow_dir / name
              manifest_rows.append({
                  "original_path": str(src),
                  "archive_path": str(archive_dir / name),
                  "sha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                  "triggers": trigger_report[name],
              })

          plan_path = Path(".github/workflow-archive/workflow-cleanup-plan.json")
          plan_path.parent.mkdir(parents=True, exist_ok=True)
          plan_path.write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "archive_workflow_n": len(manifest_rows),
                      "protected_active_workflow_n": len(protected),
                      "archive_entries": manifest_rows,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n"
          )

          print(f"PASS: exact workflow inventory classified: {len(current)} files")
          print(f"  archive completed research: {len(archive)}")
          print(f"  keep active/manual operational: {len(protected)}")
          print("PASS: every archive candidate is workflow_dispatch-only.")
          print("PASS: SHA-256 restoration plan written before any move.")
          PY

      - name: Archive completed one-off research workflows
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_DIR=".github/workflow-archive/completed-research"
          mkdir -p "${ARCHIVE_DIR}"

          python3 - <<'PY' > "${RUNNER_TEMP}/archive-workflows.txt"
          archive = [
            "age-curve-v2-phase5.yml"
            "draft-pick-fv-mathematical-audit.yml"
            "draft-pick-fv-v1-historical-draft-catalog.yml"
            "draft-pick-fv-v1-preregistration.yml"
            "draft-pick-fv-v2-broad-cohort-catalog.yml"
            "draft-pick-fv-v2-preregistration.yml"
            "draft-pick-fv-v3-catalog-preregistration-freeze.yml"
            "draft-pick-fv-v3-close-v4-source-recovery-freeze.yml"
            "draft-pick-fv-v3-custom-player-identity-audit.yml"
            "draft-pick-fv-v3-harvest-identity-contract-repair.yml"
            "draft-pick-fv-v3-harvest-identity-repair.yml"
            "draft-pick-fv-v3-harvest-identity.yml"
            "draft-pick-fv-v3-mfl-2018-boundary-recovery.yml"
            "draft-pick-fv-v3-mfl-2018-final-boundary-resolution.yml"
            "draft-pick-fv-v3-mfl-pooled-design-freeze.yml"
            "draft-pick-fv-v3-mfl-reference-expansion.yml"
            "draft-pick-fv-v3-mfl-schema-qualification.yml"
            "draft-pick-fv-v3-mfl-source-feasibility.yml"
            "draft-pick-fv-v3-mfl-validated-proxy-feasibility.yml"
            "draft-pick-fv-v3-rookie-scope-contamination-audit.yml"
            "draft-pick-valuation-structural-audit.yml"
            "draft-slot-projection-activation.yml"
            "durability-v2-phase5.yml"
            "elite-surplus-positional-scarcity-audit.yml"
            "elite-surplus-v1-development-preregistration.yml"
            "elite-surplus-v1-historical-development-evaluator.yml"
            "fundamental-value-structural-outlier-audit.yml"
            "ktc-cap-sensitivity.yml"
            "ktc_voter_balance_prospective.yml"
            "no-history-rookie-v2-phase3.yml"
            "opportunity-v2-phase5.yml"
            "package-adjustment-audit-step4-exact-live-oos.yml"
            "package-adjustment-nextgen-v2-m2b-failure-diagnostic.yml"
            "package-adjustment-nextgen-v2-m3-development-fit.yml"
            "package-adjustment-nextgen-v2-m3-development-preregistration.yml"
            "package-adjustment-nextgen-v2-prospective-evaluate-once.yml"
            "package-adjustment-nextgen-v2-prospective-freeze-exact-900.yml"
            "package-adjustment-nextgen-v2-prospective-maturity-monitor.yml"
            "package-adjustment-nextgen-v2-research-closeout.yml"
            "package-adjustment-v6-development-catalog.yml"
            "package-adjustment-v6-development-maturity-monitor.yml"
            "package-adjustment-v6-development-preregistration.yml"
            "package-adjustment-v6-development-voting-activation.yml"
            "position-weight-v2-phase5.yml"
            "prospective-trade-evidence-capture.yml"
            "qb-elite-fv-compression-diagnostic.yml"
            "qb-production-multiplier-lineage-diagnostic.yml"
            "replacement-level-v2-phase5.yml"
          ]
          print("\n".join(archive))
          PY

          while IFS= read -r name; do
            test -n "${name}"
            test -f ".github/workflows/${name}"
            test ! -e "${ARCHIVE_DIR}/${name}"
            git mv ".github/workflows/${name}" "${ARCHIVE_DIR}/${name}"
          done < "${RUNNER_TEMP}/archive-workflows.txt"

          echo "Archived $(wc -l < "${RUNNER_TEMP}/archive-workflows.txt") completed workflows."

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = Path(".github/workflow-archive/workflow-cleanup-plan.json")
          data = json.loads(plan.read_text())

          for row in data["archive_entries"]:
              src = Path(row["original_path"])
              dst = Path(row["archive_path"])

              assert not src.exists(), f"source still exists after move: {src}"
              assert dst.exists(), f"archive destination missing: {dst}"

              actual = hashlib.sha256(dst.read_bytes()).hexdigest()
              assert actual == row["sha256"], (
                  f"hash mismatch after archive move: {dst} "
                  f"expected={row['sha256']} actual={actual}"
              )

          final = Path(".github/workflow-archive/completed-research/archive_manifest.json")
          final.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          plan.unlink()

          print("PASS: all archived workflow bytes match their pre-move SHA-256.")
          print("WROTE permanent archive_manifest.json for exact restoration.")
          PY

      - name: Write archive index
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          archive_dir = Path(".github/workflow-archive/completed-research")
          names = sorted(
              p.name for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          )

          lines = [
              "# Completed GitHub Actions Research Workflows",
              "",
              "These workflows were moved out of `.github/workflows` after their "
              "research stages completed. Moving them preserves the exact historical "
              "workflow definitions in Git while preventing them from cluttering or "
              "being manually re-run from the active Actions workflow folder.",
              "",
              "The underlying committed research artifacts and manifests remain in "
              "their original repository locations.",
              "",
              "Each archived workflow's original path and SHA-256 are recorded in "
              "`archive_manifest.json`. To restore a workflow, move the exact file "
              "back to `.github/workflows/`; its contents were not modified.",
              "",
              f"Archive refreshed: {datetime.now(timezone.utc).isoformat()}",
              "",
              f"Archived workflow count: **{len(names)}**",
              "",
          ]
          lines.extend(f"- `{name}`" for name in names)
          lines.append("")

          (archive_dir / "README.md").write_text("\n".join(lines))
          print(f"WROTE archive index for {len(names)} workflows")
          PY

      - name: Prove active workflow folder is minimal
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "draft-pick-fv-v4-clean-source-recovery.yml",
              "fantasypros-api-pipeline.yml",
              "ktc-vote-aggregation.yml",
              "repo-regression-checks.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
              "workflow-folder-cleanup.yml",
          }

          workflow_dir = Path(".github/workflows")
          current = {p.name for p in workflow_dir.glob("*.yml")}
          current |= {p.name for p in workflow_dir.glob("*.yaml")}

          assert current == expected, (
              f"Active workflow inventory mismatch. "
              f"Expected={sorted(expected)} Actual={sorted(current)}"
          )

          print("PASS: active workflow folder contains only:")
          for name in sorted(current):
              print(" ", name)
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove cleanup touched workflow organization only
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          expected_archived = {
              ".github/workflow-archive/completed-research/age-curve-v2-phase5.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-mathematical-audit.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v1-historical-draft-catalog.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v1-preregistration.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v2-broad-cohort-catalog.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v2-preregistration.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-catalog-preregistration-freeze.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-close-v4-source-recovery-freeze.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-custom-player-identity-audit.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-harvest-identity-contract-repair.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-harvest-identity-repair.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-harvest-identity.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-mfl-2018-boundary-recovery.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-mfl-2018-final-boundary-resolution.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-mfl-pooled-design-freeze.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-mfl-reference-expansion.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-mfl-schema-qualification.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-mfl-source-feasibility.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-mfl-validated-proxy-feasibility.yml",
              ".github/workflow-archive/completed-research/draft-pick-fv-v3-rookie-scope-contamination-audit.yml",
              ".github/workflow-archive/completed-research/draft-pick-valuation-structural-audit.yml",
              ".github/workflow-archive/completed-research/draft-slot-projection-activation.yml",
              ".github/workflow-archive/completed-research/durability-v2-phase5.yml",
              ".github/workflow-archive/completed-research/elite-surplus-positional-scarcity-audit.yml",
              ".github/workflow-archive/completed-research/elite-surplus-v1-development-preregistration.yml",
              ".github/workflow-archive/completed-research/elite-surplus-v1-historical-development-evaluator.yml",
              ".github/workflow-archive/completed-research/fundamental-value-structural-outlier-audit.yml",
              ".github/workflow-archive/completed-research/ktc-cap-sensitivity.yml",
              ".github/workflow-archive/completed-research/ktc_voter_balance_prospective.yml",
              ".github/workflow-archive/completed-research/no-history-rookie-v2-phase3.yml",
              ".github/workflow-archive/completed-research/opportunity-v2-phase5.yml",
              ".github/workflow-archive/completed-research/package-adjustment-audit-step4-exact-live-oos.yml",
              ".github/workflow-archive/completed-research/package-adjustment-nextgen-v2-m2b-failure-diagnostic.yml",
              ".github/workflow-archive/completed-research/package-adjustment-nextgen-v2-m3-development-fit.yml",
              ".github/workflow-archive/completed-research/package-adjustment-nextgen-v2-m3-development-preregistration.yml",
              ".github/workflow-archive/completed-research/package-adjustment-nextgen-v2-prospective-evaluate-once.yml",
              ".github/workflow-archive/completed-research/package-adjustment-nextgen-v2-prospective-freeze-exact-900.yml",
              ".github/workflow-archive/completed-research/package-adjustment-nextgen-v2-prospective-maturity-monitor.yml",
              ".github/workflow-archive/completed-research/package-adjustment-nextgen-v2-research-closeout.yml",
              ".github/workflow-archive/completed-research/package-adjustment-v6-development-catalog.yml",
              ".github/workflow-archive/completed-research/package-adjustment-v6-development-maturity-monitor.yml",
              ".github/workflow-archive/completed-research/package-adjustment-v6-development-preregistration.yml",
              ".github/workflow-archive/completed-research/package-adjustment-v6-development-voting-activation.yml",
              ".github/workflow-archive/completed-research/position-weight-v2-phase5.yml",
              ".github/workflow-archive/completed-research/prospective-trade-evidence-capture.yml",
              ".github/workflow-archive/completed-research/qb-elite-fv-compression-diagnostic.yml",
              ".github/workflow-archive/completed-research/qb-production-multiplier-lineage-diagnostic.yml",
              ".github/workflow-archive/completed-research/replacement-level-v2-phase5.yml",
          }

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )

          touched = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  before, after = path.split(" -> ", 1)
                  touched.add(before)
                  touched.add(after)
              else:
                  touched.add(path)

          allowed = set(expected_archived)
          allowed.add(".github/workflow-archive/completed-research/README.md")
          allowed.add(".github/workflow-archive/completed-research/archive_manifest.json")

          # Renames may also surface their original workflow-side paths depending
          # on Git status representation.
          allowed |= {
              ".github/workflows/" + Path(x).name
              for x in expected_archived
          }

          unexpected = sorted(touched - allowed)
          if unexpected:
              raise SystemExit(
                  "Unexpected non-workflow cleanup changes: " + ", ".join(unexpected)
              )

          print("PASS: cleanup changed only workflow organization/archive files.")
          PY

      - name: Commit workflow cleanup
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .github/workflow-archive/workflow-cleanup-plan.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows .github/workflow-archive

          git diff --cached --quiet && {
            echo "ERROR: nothing staged"
            exit 1
          }

          git pull --rebase --autostash origin main
          python3 scripts/validation/repo_regression_checks.py

          git commit -m "Archive completed GitHub Actions research workflows"
          git push origin HEAD:main
