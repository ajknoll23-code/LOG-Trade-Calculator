name: Workflow Folder Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  archive-completed-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "PyYAML==6.0.2" requests

      - name: Guard exact cleanup inventory and write restoration plan
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          import yaml

          workflow_dir = Path(".github/workflows")
          archive_dir = Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True, exist_ok=True)

          # Conservative, explicit, SHA-pinned cleanup contract.
          expected_archive_blob_shas = {
          "fourforfour-idp-v1-phase1-harness.yml": "98c6658d9d89268e642b728e0c18cc3aed8c93aa",
          "fourforfour-idp-v1-phase1b-real-data-audit.yml": "6ccca68a44ba5b0627eeb07cd2eb7fed235a5ef0",
          "fourforfour-idp-v1-phase1c-identity-impact-triage.yml": "0c507fc36b2b4981b7f70facefb9e63bc2ef4e97",
          "fourforfour-idp-v1-phase1d-full-sleeper-universe-recovery.yml": "9d7d238f97c55274e3052bbfbc2aa094dcbbe0eb",
          "fourforfour-idp-v1-phase1e-recovery-freeze-validation.yml": "305098c6fc22f2578ac4fdfcdf39e324f7433e94",
          "fourforfour-idp-v1-phase1f-conservative-alias-recovery-audit.yml": "c7281992f69eb80e7967c3f510003e43af361230",
          "fourforfour-idp-v1-phase1g-independent-alias-validation.yml": "05c46161da821323a4fe53f4826a91c88900a40b",
          "fourforfour-idp-v1-phase1h-direct-nflverse-alias-corroboration.yml": "471e2ebeb0df8d21d5b525424fd93a3e13f4603e",
          "fourforfour-idp-v1-phase1i-crosswalk-corroboration.yml": "34ade92002a0d00936394424c02e41207a0c3915",
          "fourforfour-idp-v1-phase1j-identity-closure-freeze.yml": "7987707415ddcb82adc155c34671e4ec6e5d4336",
          "fourforfour-idp-v1-phase2a.yml": "ab72ea257ec0006a9664d70d2bce5d0e757013b2",
          "fourforfour-idp-v1-phase2b.yml": "3536ffb98c5798833129a323ec6cc16729bbb73e",
          "fourforfour-idp-v1-phase2c.yml": "1aa5c166ac7ca5de96cf2ee2591722775009dc29",
          "fourforfour-idp-v1-phase2d.yml": "975b62dc96dab38bc8f2a12a20488ba1d46f5e15",
          "fourforfour-idp-v1-phase2e.yml": "461ab8ac673c4506827bb92b3f8db828a922b2b7",
          "fourforfour-idp-v1-provisional-10pct-confirm-and-deploy.yml": "6f7d9ce4c2ce31c481f7dfcbede6b800767ad8bb",
          "fourforfour-idp-v1-provisional-10pct-shadow-freeze.yml": "628df6364d20875f04c021f45300739b21d99ab9",
          "fourforfour-offense-v1-confidence-c1-shadow.yml": "cc2f709133d60aeb7ca3b7c796ce84ba83089c2d",
          "fourforfour-offense-v1-confidence-c2-confirm-and-deploy-PATCHED.yml": "50c792f52c94e8cd4c443c11ff23d7f2f8329a89",
          "fourforfour-offense-v1-confidence-c2-shadow.yml": "48bfde133222d6800b408a612b689baf2fbc44e0",
          "fourforfour-offense-v1-live-role-r1-confirm-and-deploy.yml": "b5c935a73d808a6922e6b36914e07dc86d978baa",
          "fourforfour-offense-v1-live-role-r1-shadow.yml": "7e609b8b08cccd9a0f5a72dd399cf364c1e42dd6",
          "fourforfour-offense-v1-phase-o1-shadow.yml": "4cd06b20687b74a4b5cc8747f63605891db061bd",
          "fourforfour-offense-v1-provisional-10pct-confirm-and-deploy.yml": "0f6dcd84390194c0970da2c84a9a81bf2958a6c0",
          "free-agent-production-v2-lineage-audit-freeze.yml": "dc8a853fed7c7a19ce7dcfe869747c14de481cef",
          "free-agent-production-v2-phase2-shadow-validation.yml": "abbc834f47b3947779c2e5c4d61f72b1d28b8f8d",
          "free-agent-production-v2-phase3-production-confirm-and-deploy.yml": "3d76e83bcfede4f7770027a00826fb205e1d1d7c",
          "identity-v2-phase2-manual-adjudication-freeze.yml": "fc758dfe3b06136550a762f0f9f798d15bdd1cc6",
          "identity-v2-phase3-independent-corroboration-freeze.yml": "a2b1330c9b3c1856c48b2d0113abeda42fd9f999",
          "identity-v2-phase4-position-conflict-policy-audit.yml": "c53af215a3d3ca0228a6a9d4da1c879635d58dd6",
          "identity-v2-phase5-production-candidate-shadow.yml": "8277de810668f33415cca82911d8b3238ff60654",
          "identity-v2-phase6-exact-scope-deployment.yml": "3f359ec173db1fc8e537a93eef8ced340781b1ee",
          "idp-position-lineage-v1-phase1-audit-freeze.yml": "6051cd0a32799be66cada1768196a4b72753d89e",
          "idp-position-lineage-v1-phase1b-current-core-rebase-freeze.yml": "79ffde5164fbaec589423c9857672d86dcc6acaf",
          "idp-position-lineage-v1-phase2-shadow-sanity.yml": "605f5c1d8b921c6d389a6961c91c6bf26cd9ea6e",
          "idp-position-lineage-v1-phase2b-age-feedback-shadow.yml": "715db33509abac47ac45070eb6972800f704f8f2",
          "idp-position-lineage-v1-phase3-confirm-and-deploy.yml": "ed31d930738815c46e20108ee0ae34e9c122c55e",
          "market-value-v2-phase2-voter-policy-robustness.yml": "d37e85634fb6872eb7113026dc49a2c91ad68f24",
          "market-value-v2-phase3-production-candidate-shadow.yml": "51b7e63f77f1cbde86fb56521061aaaad13cc4c9",
          "market-value-v2-phase4-production-deployment.yml": "66a1d5a3e59e8fda611814f25416380c26ebcefc",
          "trade-robustness-v1-phase1-shadow.yml": "bdae475a647fe08ae583f7411822aa2d777223f0",
          "trade-robustness-v1-phase1b-live-verdict-alignment.yml": "bc65c235ce6c549da2a853d0a46b6a8e066fb76a",
          "trade-robustness-v1-phase2-ui-shadow.yml": "9eb5e9ed2d8d8361cfb51c0063a3fb69a392189c",
          "trade-robustness-v1-phase3-pick-sensitivity-shadow.yml": "c3d6f6c3d986164bdc59354416ef775fac3ffa00",
          "trade-robustness-v1-phase4-pick-ui.yml": "129431fa1900bf739e1e117e6b4a30cdc64d2698",
          "trade-robustness-v1-ui-polish.yml": "7b617454f01322959886ad7aa24cca067e91e7ce"
          }

          # Only this exact stale pre-patch workflow is deleted rather than archived.
          expected_delete_blob_shas = {
          "fourforfour-offense-v1-confidence-c2-confirm-and-deploy.yml": "4800387e50d97a534166fb04ac1c09599b92849a"
          }

          # Everything else currently in .github/workflows is intentionally retained.
          protected = set([
          "age-curve-v2-phase5.yml",
          "cross-position-apex-calibration-v1-phase1-diagnostic-freeze.yml",
          "cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml",
          "draft-pick-fv-v4-clean-source-recovery.yml",
          "durability-v2-phase5.yml",
          "fantasypros-api-pipeline.yml",
          "ktc-vote-aggregation.yml",
          "ktc_voter_balance_prospective.yml",
          "market-edge-v1-prospective-study.yml",
          "no-history-rookie-v2-phase3.yml",
          "offense-position-lineage-v1-phase1-audit-freeze.yml",
          "opportunity-v2-phase5.yml",
          "package-adjustment-audit-step4-exact-live-oos.yml",
          "position-weight-v2-phase5.yml",
          "prospective-trade-evidence-capture.yml",
          "replacement-level-v2-phase5.yml",
          "repo-regression-checks.yml",
          "research-program-status-v1-current-state-audit.yml",
          "scheduled-data-refresh.yml",
          "sync-sleeper.yml",
          "workflow-folder-cleanup.yml"
          ])

          assert set(expected_archive_blob_shas).isdisjoint(protected)
          assert set(expected_delete_blob_shas).isdisjoint(protected)
          assert set(expected_archive_blob_shas).isdisjoint(expected_delete_blob_shas)

          def git_blob_sha(path: Path) -> str:
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def trigger_names(path: Path) -> set[str]:
              doc = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")
              triggers = doc.get("on")
              if isinstance(triggers, str):
                  return {triggers}
              if isinstance(triggers, list):
                  return {str(x) for x in triggers}
              if isinstance(triggers, dict):
                  return {str(x) for x in triggers}
              raise SystemExit(f"Unrecognized workflow trigger syntax: {path}")

          current = {p.name for p in workflow_dir.glob("*.yml")}
          current |= {p.name for p in workflow_dir.glob("*.yaml")}

          missing_protected = sorted(protected - current)
          if missing_protected:
              raise SystemExit(
                  "Cleanup safety failure: protected workflows are missing: "
                  + ", ".join(missing_protected)
              )

          allowed_current = protected | set(expected_archive_blob_shas) | set(expected_delete_blob_shas)
          unexpected = sorted(current - allowed_current)
          if unexpected:
              raise SystemExit(
                  "Cleanup contract drift: unclassified workflows exist. "
                  "Refusing to guess whether they are active: "
                  + ", ".join(unexpected)
              )

          archive_rows = []
          already_archived = []
          for name, expected_sha in expected_archive_blob_shas.items():
              src = workflow_dir / name
              dst = archive_dir / name

              if src.exists() and dst.exists():
                  raise SystemExit(
                      f"Cleanup safety failure: workflow exists both active and archived: {name}"
                  )
              if not src.exists() and not dst.exists():
                  raise SystemExit(
                      f"Cleanup contract drift: archive target missing from both locations: {name}"
                  )

              path = src if src.exists() else dst
              actual_sha = git_blob_sha(path)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"Cleanup SHA drift for {name}: expected={expected_sha} actual={actual_sha}"
                  )

              triggers = trigger_names(path)
              if triggers != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Cleanup safety failure: archive target is no longer manual-only: "
                      f"{name} triggers={sorted(triggers)}"
                  )

              row = {
                  "original_path": str(src),
                  "archive_path": str(dst),
                  "git_blob_sha": actual_sha,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "triggers": sorted(triggers),
              }
              if src.exists():
                  archive_rows.append(row)
              else:
                  already_archived.append(name)

          delete_rows = []
          for name, expected_sha in expected_delete_blob_shas.items():
              src = workflow_dir / name
              dst = archive_dir / name

              if dst.exists():
                  raise SystemExit(
                      f"Cleanup safety failure: delete-only workflow unexpectedly archived: {name}"
                  )
              if not src.exists():
                  continue

              actual_sha = git_blob_sha(src)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"Cleanup delete SHA drift for {name}: "
                      f"expected={expected_sha} actual={actual_sha}"
                  )

              triggers = trigger_names(src)
              if triggers != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Cleanup safety failure: delete target is no longer manual-only: "
                      f"{name} triggers={sorted(triggers)}"
                  )

              delete_rows.append({
                  "path": str(src),
                  "git_blob_sha": actual_sha,
                  "sha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                  "triggers": sorted(triggers),
                  "reason": "Superseded stale pre-patch 4for4 Offense Confidence C2 deploy workflow",
                  "superseded_by": ".github/workflow-archive/completed-research/fourforfour-offense-v1-confidence-c2-confirm-and-deploy-PATCHED.yml",
              })

          plan = {
              "schema_version": 4,
              "archive_now_n": len(archive_rows),
              "already_archived_target_n": len(already_archived),
              "delete_now_n": len(delete_rows),
              "protected_active_workflow_n": len(protected),
              "protected_active_workflows": sorted(protected),
              "archive_entries": archive_rows,
              "already_archived_targets": sorted(already_archived),
              "delete_entries": delete_rows,
          }

          plan_path = Path(".github/workflow-archive/workflow-cleanup-plan.json")
          plan_path.write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(f"PASS: current workflow inventory classified: {len(current)} files")
          print(f"  archive now: {len(archive_rows)}")
          print(f"  already archived targets: {len(already_archived)}")
          print(f"  delete exact obsolete files now: {len(delete_rows)}")
          print(f"  keep active/protected: {len(protected)}")
          print("PASS: every archive/delete target is manual-only and SHA-pinned.")
          print("PASS: restoration/deletion evidence plan written before changes.")
          PY

      - name: Archive completed manual-only workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan_path = Path(".github/workflow-archive/workflow-cleanup-plan.json")
          data = json.loads(plan_path.read_text(encoding="utf-8"))

          for row in data["archive_entries"]:
              src = Path(row["original_path"])
              dst = Path(row["archive_path"])
              if not src.exists():
                  raise SystemExit(f"Archive source vanished: {src}")
              if dst.exists():
                  raise SystemExit(f"Archive destination unexpectedly exists: {dst}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              src.rename(dst)

              actual = hashlib.sha256(dst.read_bytes()).hexdigest()
              if actual != row["sha256"]:
                  raise SystemExit(
                      f"Hash mismatch after archive move: {dst} "
                      f"expected={row['sha256']} actual={actual}"
                  )

          print(f"PASS: archived {len(data['archive_entries'])} completed workflows.")
          PY

      - name: Delete only exact superseded workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          data = json.loads(
              Path(".github/workflow-archive/workflow-cleanup-plan.json")
              .read_text(encoding="utf-8")
          )

          for row in data["delete_entries"]:
              path = Path(row["path"])
              if not path.exists():
                  raise SystemExit(f"Delete target vanished: {path}")
              subprocess.run(["git", "rm", str(path)], check=True)

          print(f"PASS: deleted {len(data['delete_entries'])} exact superseded workflow(s).")
          PY

      - name: Merge archive manifest and write index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          archive_dir = Path(".github/workflow-archive/completed-research")
          plan_path = Path(".github/workflow-archive/workflow-cleanup-plan.json")
          manifest_path = archive_dir / "archive_manifest.json"
          readme_path = archive_dir / "README.md"

          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          if manifest_path.exists():
              old = json.loads(manifest_path.read_text(encoding="utf-8"))
              entries = list(old.get("archive_entries", []))
              deleted = list(old.get("deleted_obsolete_workflows", []))
          else:
              entries = []
              deleted = []

          by_original = {row["original_path"]: row for row in entries}
          for row in plan["archive_entries"]:
              existing = by_original.get(row["original_path"])
              if existing and existing.get("sha256") != row["sha256"]:
                  raise SystemExit(f"Manifest conflict for {row['original_path']}")
              by_original[row["original_path"]] = row

          deleted_by_path = {row["path"]: row for row in deleted}
          for row in plan["delete_entries"]:
              existing = deleted_by_path.get(row["path"])
              if existing and existing.get("sha256") != row["sha256"]:
                  raise SystemExit(f"Deletion manifest conflict for {row['path']}")
              deleted_by_path[row["path"]] = row

          entries = [by_original[k] for k in sorted(by_original)]
          deleted = [deleted_by_path[k] for k in sorted(deleted_by_path)]

          actual_yaml = sorted(
              p.name for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          )
          manifest_yaml = sorted(Path(row["archive_path"]).name for row in entries)
          if actual_yaml != manifest_yaml:
              raise SystemExit(
                  "Archive YAML inventory mismatch: "
                  f"manifest={manifest_yaml} actual={actual_yaml}"
              )

          manifest = {
              "schema_version": 4,
              "archive_workflow_n": len(entries),
              "protected_active_workflow_n": len(plan["protected_active_workflows"]),
              "protected_active_workflows": plan["protected_active_workflows"],
              "archive_entries": entries,
              "deleted_obsolete_workflows": deleted,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Completed GitHub Actions Research Workflows",
              "",
              "Completed manual-only research and deployment workflows are moved out of "
              "'.github/workflows' so they no longer clutter the Actions workflow list. "
              "Scheduled, reusable, and still-open research workflows remain active.",
              "",
              "Archived files are preserved byte-for-byte. Their original paths, Git blob "
              "SHAs, and SHA-256 hashes are recorded in 'archive_manifest.json'.",
              "",
              "A very small number of files may be deleted instead of archived only when "
              "they are exact SHA-pinned obsolete duplicates with an identified successor. "
              "Those deletions are also recorded in the manifest.",
              "",
              f"Archive refreshed: {datetime.now(timezone.utc).isoformat()}",
              "",
              f"Archived workflow count: **{len(actual_yaml)}**",
              "",
          ]
          lines.extend(f"- {name}" for name in actual_yaml)
          if deleted:
              lines.extend(["", "## Deleted obsolete duplicates", ""])
              for row in deleted:
                  lines.append(f"- {Path(row['path']).name} — {row['reason']}")
          lines.append("")
          readme_path.write_text("\n".join(lines), encoding="utf-8")

          plan_path.unlink()
          print(f"PASS: archive manifest now tracks {len(entries)} workflows.")
          print(f"PASS: deletion log tracks {len(deleted)} obsolete duplicate(s).")
          PY

      - name: Prove active workflow folder is conservative and exact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path(".github/workflow-archive/completed-research/archive_manifest.json")
              .read_text(encoding="utf-8")
          )
          expected = set(manifest["protected_active_workflows"])

          workflow_dir = Path(".github/workflows")
          current = {p.name for p in workflow_dir.glob("*.yml")}
          current |= {p.name for p in workflow_dir.glob("*.yaml")}

          if current != expected:
              raise SystemExit(
                  "Active workflow inventory mismatch. "
                  f"Expected={sorted(expected)} Actual={sorted(current)}"
              )

          print(f"PASS: active workflow folder contains exactly {len(current)} protected workflows.")
          for name in sorted(current):
              print(" ", name)
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove cleanup touched workflow organization only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path(".github/workflow-archive/completed-research/archive_manifest.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))

          allowed = {
              ".github/workflow-archive/completed-research/README.md",
              ".github/workflow-archive/completed-research/archive_manifest.json",
          }
          for row in data["archive_entries"]:
              allowed.add(row["original_path"])
              allowed.add(row["archive_path"])
          for row in data.get("deleted_obsolete_workflows", []):
              allowed.add(row["path"])

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )

          touched = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  before, after = path.split(" -> ", 1)
                  touched.add(before)
                  touched.add(after)
              else:
                  touched.add(path)

          unexpected = sorted(touched - allowed)
          if unexpected:
              raise SystemExit(
                  "Unexpected non-workflow cleanup changes: " + ", ".join(unexpected)
              )

          print("PASS: cleanup changed only workflow/archive organization.")
          PY

      - name: Commit workflow cleanup
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .github/workflow-archive/workflow-cleanup-plan.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows .github/workflow-archive

          git diff --cached --quiet && {
            echo "ERROR: nothing staged"
            exit 1
          }

          git pull --rebase --autostash origin main
          python3 scripts/validation/repo_regression_checks.py

          git commit -m "Archive completed GitHub Actions workflows"
          git push origin HEAD:main
