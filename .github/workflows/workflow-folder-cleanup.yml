# PREFLIGHTED: POST_DLF_PROSPECT_FV_V2_WORKFLOW_CLEANUP_V1
name: Workflow Folder Cleanup
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  DLF_V2_CLOSEOUT_RUN_ID: '36091861967'
  DLF_V2_CLOSEOUT_ARTIFACT_ID: '10846316467'
  DLF_V2_CLOSEOUT_ARTIFACT_NAME: dlf-prospect-fv-v2-phase1c-closeout
  DLF_V2_CLOSEOUT_JSON_SHA256: a2646124b1cb7c81ea110a4cd7857a7f57112d2cbf6ee2c7915bff93dbfc807f
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture starting main
      id: base
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install cleanup dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir \
          "PyYAML==6.0.2" \
          "requests==2.34.2"
    - name: Download exact DLF V2 closeout artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.DLF_V2_CLOSEOUT_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/dlf-v2-closeout
        repository: ${{ github.repository }}
        run-id: ${{ env.DLF_V2_CLOSEOUT_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Guard DLF closeout evidence and exact workflow inventory
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib
        import json
        import os
        import subprocess
        from pathlib import Path
        import yaml

        workflow_dir = Path(".github/workflows")
        archive_dir = Path(".github/workflow-archive/completed-research")
        archive_dir.mkdir(parents=True, exist_ok=True)

        batch = "2026-09-25-post-dlf-prospect-fv-v2"

        archive_targets = {
            'DLF-Phase-1B-V2.yml': 'f893af7ca86c5855428eb5649370ce991cab51e8',
            'DLF-Phase-1C-Historical-Incremental-Signal-V2.yml': '8456e0efdc1a19b5f42fcc0850f482defb6cdd92',
            'DLF-Prospect-FV-Phase-1B3-Prereg-Correction.yml': '3f7efbec882f8e1089ce6e318fd062c8ae361a1b',
            'DLF-Prospect-FV-Phase-1B4-Temporal-Implementation-Freeze.yml': 'db96c7097ea7799359674b6afd96c7729a4b3a1d',
            'DLF-Prospect-FV-Phase-1C-Historical-Incremental-Signal.yml': '464e03aeed3bafb79b93f2cb822aee2b0bbf5211',
            'DLF-Prospect-FV-V1-Phase-1D-Closeout.yml': '0edc10f854b9ee5bba0ed74cece7414293acc742',
            'DLF-Prospect-FV-V2-Phase-1A-Advanced-Preregistration.yml': 'e4bb025b48c7b2d91a7a32af443d16e561520cab',
            'DLF-Prospect-FV-V2-Phase-1B-Advanced-Development-Signal.yml': '2fc12ed9476cfa29f921047480457d0d7af33947',
            'DLF-Prospect-FV-V2-Phase-1C-Closeout.yml': 'fcab3701b34ac53f9591bb2c8fe56cca4ea993b8',
            'dlf-prospect-fv-v1-phase1a-source-feasibility.yml': '25cfd357fb29f006bf1ddaeaa4d0dec09fa27edf',
            'dlf-prospect-fv-v1-phase1a2-deterministic-source-freeze-v2.yml': 'c42ea9753ed770201450be5636872292087c3917',
            'dlf-prospect-fv-v1-phase1b-identity-preregistration.yml': 'e17806e097e96e80b4e9edec64334a54ae135629',
        }

        protected = {
            'age-curve-v2-phase5.yml',
            'cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml',
            'draft-pick-fv-v7-phase1-r1-r6-full-scale-preregistration.yml',
            'draft-pick-fv-v7-phase2-accelerated-finalize.yml',
            'draft-pick-fv-v7-phase2-accelerated-probe-resume-v2.yml',
            'draft-pick-fv-v7-phase2-accelerated-probe-shard.yml',
            'draft-pick-fv-v7-phase2-checkpointed-source-identity-freeze.yml',
            'draft-pick-fv-v7-phase2-r1-r6-source-identity-freeze.yml',
            'draft-pick-fv-v7-phase2-r25-probe-recovery.yml',
            'durability-v2-phase5.yml',
            'fantasypros-api-pipeline.yml',
            'free-agent-utility-v1-refresh.yml',
            'ktc-vote-aggregation.yml',
            'ktc_voter_balance_prospective.yml',
            'market-edge-v1-prospective-study.yml',
            'no-history-rookie-v2-phase3.yml',
            'opportunity-v2-phase5.yml',
            'package-adjustment-audit-step4-exact-live-oos.yml',
            'position-weight-v2-phase5.yml',
            'prospective-trade-evidence-capture.yml',
            'replacement-level-v2-phase5.yml',
            'repo-regression-checks.yml',
            'research-program-status-v1-current-state-audit.yml',
            'scheduled-data-refresh.yml',
            'sync-sleeper.yml',
            'workflow-folder-cleanup.yml',
        }

        def read_json(path):
            return json.loads(Path(path).read_text(encoding="utf-8"))

        def git_blob_sha(path):
            return subprocess.check_output(
                ["git", "hash-object", str(path)], text=True
            ).strip()

        def trigger_names(path):
            doc = yaml.load(
                Path(path).read_text(encoding="utf-8"),
                Loader=yaml.BaseLoader,
            )
            if not isinstance(doc, dict):
                raise SystemExit(f"Invalid workflow YAML object: {path}")
            triggers = doc.get("on")
            if isinstance(triggers, str):
                return {triggers}
            if isinstance(triggers, list):
                return set(map(str, triggers))
            if isinstance(triggers, dict):
                return set(map(str, triggers.keys()))
            raise SystemExit(
                f"Unrecognized workflow trigger syntax: {path}: {triggers!r}"
            )

        # Exact V2 scientific closeout artifact authorizes this cleanup.
        closeout_path = (
            Path(os.environ["RUNNER_TEMP"])
            / "dlf-v2-closeout"
            / "dlf_prospect_fv_v2_phase1c_closeout.json"
        )
        if not closeout_path.exists():
            raise SystemExit(f"Missing exact DLF V2 closeout artifact: {closeout_path}")
        closeout_bytes = closeout_path.read_bytes()
        closeout_sha = hashlib.sha256(closeout_bytes).hexdigest()
        expected_closeout_sha = os.environ["DLF_V2_CLOSEOUT_JSON_SHA256"]
        if closeout_sha != expected_closeout_sha:
            raise SystemExit(
                "DLF V2 closeout artifact drift: "
                f"expected={expected_closeout_sha} actual={closeout_sha}"
            )
        closeout = json.loads(closeout_bytes)
        assert closeout["decision"] == "CLOSE_DLF_PROSPECT_FV_V2_NO_INCREMENTAL_SIGNAL"
        assert closeout["study_id"] == "dlf-prospect-fv-v2-advanced-fundamentals"
        assert closeout["frozen_finding"]["all_preregistered_gates_passed"] is False
        assert closeout["frozen_finding"]["paired_prediction_n"] == 318
        assert closeout["frozen_finding"]["heldout_year_wins"] == 1
        assert closeout["frozen_finding"]["positions_improved"] == 0
        assert all(v is False for v in closeout["frozen_finding"]["gates"].values())
        assert closeout["preserved_assets"]["2024_temporal_confirmation_opened"] is False
        assert closeout["preserved_assets"]["nfl_2025_outcomes_read"] is False
        assert closeout["firewalls"]["production_change_authorized"] is False
        assert closeout["firewalls"]["posthoc_v1_or_v2_rescue_authorized"] is False
        assert len(closeout["scientific_conclusion"]["direct_fv_hypotheses_rejected"]) == 2

        current = {
            p.name for p in workflow_dir.iterdir()
            if p.is_file() and p.suffix in {".yml", ".yaml"}
        }
        expected_current = set(archive_targets) | protected
        if current != expected_current:
            raise SystemExit(
                "Cleanup inventory drift. Refusing to guess.\n"
                f"Missing expected: {sorted(expected_current-current)}\n"
                f"Unexpected current: {sorted(current-expected_current)}"
            )
        if set(archive_targets) & protected:
            raise SystemExit("archive/protected overlap")

        # Explicitly prove every currently-live Draft Pick V7 workflow remains protected.
        v7 = {name for name in current if name.startswith("draft-pick-fv-v7-")}
        if len(v7) != 7 or not v7.issubset(protected):
            raise SystemExit(
                f"Draft Pick V7 protection contract changed: {sorted(v7)}"
            )

        rows = []
        for name, expected_sha in sorted(archive_targets.items()):
            src = workflow_dir / name
            dst = archive_dir / name
            if not src.exists():
                raise SystemExit(f"Archive target missing: {src}")
            if dst.exists():
                raise SystemExit(f"Archive destination already exists: {dst}")
            actual_sha = git_blob_sha(src)
            if actual_sha != expected_sha:
                raise SystemExit(
                    f"SHA drift for {name}: expected={expected_sha} actual={actual_sha}"
                )
            triggers = trigger_names(src)
            if triggers != {"workflow_dispatch"}:
                raise SystemExit(
                    f"Refusing to archive non-manual-only workflow "
                    f"{name}: triggers={sorted(triggers)}"
                )
            rows.append({
                "original_path": str(src),
                "archive_path": str(dst),
                "git_blob_sha": actual_sha,
                "sha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                "triggers": sorted(triggers),
                "cleanup_batch": batch,
                "research_family": "DLF Prospect FV V1/V2",
            })

        plan = {
            "schema_version": 7,
            "cleanup_batch": batch,
            "authorization_evidence": {
                "run_id": int(os.environ["DLF_V2_CLOSEOUT_RUN_ID"]),
                "artifact_id": int(os.environ["DLF_V2_CLOSEOUT_ARTIFACT_ID"]),
                "artifact_name": os.environ["DLF_V2_CLOSEOUT_ARTIFACT_NAME"],
                "closeout_json_sha256": closeout_sha,
                "decision": closeout["decision"],
            },
            "active_before_n": len(current),
            "archive_now_n": len(rows),
            "active_after_n": len(protected),
            "protected_active_workflows": sorted(protected),
            "archive_entries": rows,
            "delete_entries": [],
        }
        Path(".github/workflow-archive/workflow-cleanup-plan.json").write_text(
            json.dumps(plan, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        assert len(current) == 38
        assert len(rows) == 12
        assert len(protected) == 26

        print("PASS: DLF V2 scientific closeout authorizes workflow archival.")
        print("PASS: active workflows before cleanup: 38")
        print("PASS: exact completed DLF workflows to archive: 12")
        print("PASS: all 7 active Draft Pick V7 workflows protected.")
        print("PASS: active protected workflows after cleanup: 26")
        PY
    - name: Archive completed DLF manual-only workflows
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib
        import json
        from pathlib import Path

        plan_path = Path(".github/workflow-archive/workflow-cleanup-plan.json")
        plan = json.loads(plan_path.read_text(encoding="utf-8"))

        for row in plan["archive_entries"]:
            src = Path(row["original_path"])
            dst = Path(row["archive_path"])
            dst.parent.mkdir(parents=True, exist_ok=True)
            if not src.exists() or dst.exists():
                raise SystemExit(
                    f"Unsafe move state: src={src.exists()} dst={dst.exists()} "
                    f"for {src.name}"
                )
            src.rename(dst)
            actual = hashlib.sha256(dst.read_bytes()).hexdigest()
            if actual != row["sha256"]:
                raise SystemExit(f"Post-move hash mismatch: {dst}")

        print(f"PASS: archived {len(plan['archive_entries'])} completed DLF workflows.")
        PY
    - name: Update archive manifest and README
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nfrom datetime import datetime, timezone\nfrom pathlib import\
        \ Path\n\narchive_dir = Path(\".github/workflow-archive/completed-research\")\nplan_path = Path(\".github/workflow-archive/workflow-cleanup-plan.json\"\
        )\nmanifest_path = archive_dir / \"archive_manifest.json\"\nreadme_path = archive_dir / \"README.md\"\n\nplan = json.loads(plan_path.read_text(encoding=\"\
        utf-8\"))\nold = json.loads(manifest_path.read_text(encoding=\"utf-8\"))\n\narchive_by_original = {\n    row[\"original_path\"\
        ]: row\n    for row in old.get(\"archive_entries\", [])\n}\nfor row in plan[\"archive_entries\"]:\n    prior = archive_by_original.get(row[\"\
        original_path\"])\n    if prior and prior.get(\"sha256\") != row[\"sha256\"]:\n        raise SystemExit(\n       \
        \     f\"Archive manifest conflict: {row['original_path']}\"\n        )\n    archive_by_original[row[\"original_path\"\
        ]] = row\n\narchive_entries = [\n    archive_by_original[k] for k in sorted(archive_by_original)\n]\ndeleted_entries\
        \ = list(old.get(\"deleted_obsolete_workflows\", []))\n\nactual_yaml = sorted(\n    p.name for p in archive_dir.iterdir()\n\
        \    if p.is_file() and p.suffix in {\".yml\", \".yaml\"}\n)\nmanifest_yaml = sorted(\n    Path(row[\"archive_path\"\
        ]).name for row in archive_entries\n)\nif actual_yaml != manifest_yaml:\n    raise SystemExit(\"Archive inventory\
        \ mismatch after DLF move.\")\n\nnow = datetime.now(timezone.utc).isoformat()\nmanifest = {\n    \"schema_version\"\
        : 7,\n    \"last_cleanup_batch\": plan[\"cleanup_batch\"],\n    \"last_cleanup_at_utc\": now,\n    \"last_cleanup_authorization_evidence\"\
        : plan[\"authorization_evidence\"],\n    \"archive_workflow_n\": len(archive_entries),\n    \"protected_active_workflow_n\"\
        : len(plan[\"protected_active_workflows\"]),\n    \"protected_active_workflows\": plan[\"protected_active_workflows\"\
        ],\n    \"archive_entries\": archive_entries,\n    \"deleted_obsolete_workflows\": deleted_entries,\n}\nmanifest_path.write_text(\n\
        \    json.dumps(manifest, indent=2, sort_keys=True) + \"\\n\",\n    encoding=\"utf-8\",\n)\n\nlines = [\n    \"# Completed\
        \ GitHub Actions Research Workflows\",\n    \"\",\n    \"Completed manual-only research/deployment workflows are moved\
        \ \"\n    \"out of `.github/workflows` so they do not clutter the GitHub \"\n    \"Actions workflow list.\",\n   \
        \ \"\",\n    \"Archived YAML files are preserved byte-for-byte. Original \"\n    \"paths, Git blob SHAs, SHA-256 hashes,\
        \ and triggers are recorded \"\n    \"in `archive_manifest.json`.\",\n    \"\",\n    \"Recurring production/data workflows\
        \ and studies that are still \"\n    \"collecting or intentionally rerunnable remain active.\",\n    \"\",\n    f\"\
        Archive refreshed: {now}\",\n    \"\",\n    f\"Archived workflow count: **{len(actual_yaml)}**\",\n    f\"Active protected\
        \ workflow count: \"\n    f\"**{len(plan['protected_active_workflows'])}**\",\n    \"\",\n    \"## Active protected\
        \ workflows\",\n    \"\",\n]\nlines.extend(\n    f\"- {name}\" for name in plan[\"protected_active_workflows\"]\n\
        )\nlines += [\"\", \"## Archived workflows\", \"\"]\nlines.extend(f\"- {name}\" for name in actual_yaml)\n\nif deleted_entries:\n\
        \    lines += [\"\", \"## Deleted exact obsolete duplicates\", \"\"]\n    for row in deleted_entries:\n        lines.append(f\"\
        - `{row['path']}` \u2014 {row['reason']}\")\n\nlines.append(\"\")\nreadme_path.write_text(\"\\n\".join(lines), encoding=\"\
        utf-8\")\nplan_path.unlink()\n\nassert len(actual_yaml) == 132\nassert len(plan[\"protected_active_workflows\"]) ==\
        \ 26\nprint(f\"PASS: archive manifest now tracks {len(archive_entries)} workflows.\")\nPY\n"
    - name: Validate remaining active workflow folder
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        import yaml

        manifest = json.loads(
            Path(
                ".github/workflow-archive/completed-research/archive_manifest.json"
            ).read_text(encoding="utf-8")
        )
        expected = set(manifest["protected_active_workflows"])
        workflow_dir = Path(".github/workflows")
        actual = {
            p.name for p in workflow_dir.iterdir()
            if p.is_file() and p.suffix in {".yml", ".yaml"}
        }
        if actual != expected:
            raise SystemExit(
                f"Active workflow mismatch.\n"
                f"Expected={sorted(expected)}\n"
                f"Actual={sorted(actual)}"
            )

        names = {}
        for p in sorted(workflow_dir.iterdir()):
            if p.suffix not in {".yml", ".yaml"}:
                continue
            doc = yaml.safe_load(p.read_text(encoding="utf-8"))
            if not isinstance(doc, dict):
                raise SystemExit(f"Invalid YAML object: {p}")
            display = str(doc.get("name") or "")
            if not display:
                raise SystemExit(f"Workflow has no name: {p}")
            if display in names:
                raise SystemExit(
                    f"Duplicate workflow display name: {display}: "
                    f"{names[display]} and {p.name}"
                )
            names[display] = p.name
            if "on" not in doc and True not in doc:
                raise SystemExit(f"Workflow has no trigger: {p}")

        v7 = {name for name in actual if name.startswith("draft-pick-fv-v7-")}
        assert len(v7) == 7

        dispatcher = workflow_dir / "package-adjustment-audit-step4-exact-live-oos.yml"
        text = dispatcher.read_text(encoding="utf-8")
        assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in text
        assert "schedule:" in text

        assert len(actual) == 26
        print("PASS: active Actions folder now contains exactly 26 protected workflows.")
        print("PASS: all 7 Draft Pick V7 workflows remain active.")
        PY
    - name: Run full repository regression
      shell: bash
      run: |-
        set -euo pipefail

        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
        TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

        restore_tu() {
          git checkout -- "$TU_JSON" "$TU_MD"
        }
        trap restore_tu EXIT

        python3 scripts/projections/build_team_utility_lineup_projections.py --write
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/validation/repo_regression_checks.py

        restore_tu
        trap - EXIT
        git diff --exit-code -- "$TU_JSON" "$TU_MD"

        echo "PASS: full repository regression suite green."
    - name: Prove cleanup scope
      shell: bash
      run: |
        set -euo pipefail
        test ! -e .github/workflow-archive/workflow-cleanup-plan.json
        python3 - <<'PY'
        import json
        import subprocess
        from pathlib import Path

        manifest = json.loads(
            Path(
                ".github/workflow-archive/completed-research/archive_manifest.json"
            ).read_text(encoding="utf-8")
        )

        batch = "2026-09-25-post-dlf-prospect-fv-v2"
        batch_rows = [
            row for row in manifest["archive_entries"]
            if row.get("cleanup_batch") == batch
        ]
        if len(batch_rows) != 12:
            raise SystemExit(
                f"Expected 12 workflows in current cleanup batch, found {len(batch_rows)}"
            )

        allowed = {
            ".github/workflow-archive/completed-research/README.md",
            ".github/workflow-archive/completed-research/archive_manifest.json",
        }
        for row in batch_rows:
            allowed.add(row["original_path"])
            allowed.add(row["archive_path"])

        status = subprocess.check_output(
            ["git", "status", "--porcelain=v1", "--untracked-files=all"],
            text=True,
        )
        touched = set()
        for line in status.splitlines():
            if not line.strip():
                continue
            raw = line[3:]
            if " -> " in raw:
                left, right = raw.split(" -> ", 1)
                touched.add(left)
                touched.add(right)
            else:
                touched.add(raw)

        unexpected = sorted(touched - allowed)
        if unexpected:
            raise SystemExit(
                "Cleanup touched unexpected files: " + ", ".join(unexpected)
            )

        print(f"PASS: cleanup scope exact; touched {len(touched)} paths.")
        PY
    - name: Commit workflow cleanup
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |-
        set -euo pipefail

        git fetch origin main
        test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
          echo "ERROR: origin/main moved during cleanup; refusing stale commit."
          exit 1
        }

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A -- .github
        git diff --cached --quiet && {
          echo "ERROR: nothing staged."
          exit 1
        }

        git commit -m "Archive completed DLF Prospect FV workflows"
        git push origin HEAD:main

        echo "PASS: post-DLF workflow-folder cleanup committed."
