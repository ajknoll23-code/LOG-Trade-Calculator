# PREFLIGHTED: POST_DRAFT_PICK_FV_V6_WORKFLOW_CLEANUP_V1
name: Workflow Folder Cleanup

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests==2.34.2"

      - name: Guard V6 closeout evidence and exact workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          import yaml

          workflow_dir = Path(".github/workflows")
          archive_dir = Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True, exist_ok=True)

          batch = "2026-09-23-post-draft-pick-fv-v6"

          archive_targets = {
              "draft-pick-fv-v6-phase1-1-clean-source-amendment.yml":
                  "37a7353b46897a071a2010f62e0d1380b3163896",
              "draft-pick-fv-v6-phase1-structural-continuity-preregistration.yml":
                  "b7f284e487d2da487da898e5a246305f93223535",
              "draft-pick-fv-v6-phase2-r1-r4-source-identity-freeze.yml":
                  "51ae0c091392ef57d464beea21c49cfe583b0c33",
              "draft-pick-fv-v6-phase3-1-dob-lineage-repair.yml":
                  "88c70cc7517a4b1b4afc689b012d0b6543d9d506",
              "draft-pick-fv-v6-phase3-r1-r4-historical-outcome-harvest.yml":
                  "3ab516f75e557aeb6c5a5fbe493c9b95c0a31d19",
              "draft-pick-fv-v6-phase4-loyo-development-selection.yml":
                  "1c4a567da2ff3d7ef76fd94e03d74cbff6090e51",
              "draft-pick-fv-v6-phase4-research-closeout.yml":
                  "0879dec00c7908d7fb28908c4473387d281ebd4d",
          }

          protected = {
              "age-curve-v2-phase5.yml",
              "cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "free-agent-utility-v1-refresh.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "market-edge-v1-prospective-study.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "research-program-status-v1-current-state-audit.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
              "workflow-folder-cleanup.yml",
          }

          evidence_pins = {
              "research/draft-pick-fv-v6/r1_r4_v6_research_closeout.json":
                  "21dbe195c5111f465ee1d23a40d6b2d5719a2193",
              "research/draft-pick-fv-v6/r1_r4_v6_research_closeout_manifest.json":
                  "f6a68c30cc5fac49041b8c8830039cfd2d98636d",
              "research/draft-pick-fv-v6/r1_r4_loyo_development_selection_manifest_v6_1.json":
                  "67a4d246d290e372ae8563763f13c56a2f0cd9c0",
          }

          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def git_blob_sha(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def trigger_names(path):
              doc = yaml.load(
                  Path(path).read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")
              triggers = doc.get("on")
              if isinstance(triggers, str):
                  return {triggers}
              if isinstance(triggers, list):
                  return set(map(str, triggers))
              if isinstance(triggers, dict):
                  return set(map(str, triggers.keys()))
              raise SystemExit(
                  f"Unrecognized workflow trigger syntax: "
                  f"{path}: {triggers!r}"
              )

          for path, expected_sha in sorted(evidence_pins.items()):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"Frozen V6 evidence missing: {p}")
              actual = git_blob_sha(p)
              if actual != expected_sha:
                  raise SystemExit(
                      f"Frozen V6 evidence drift: {p} "
                      f"expected={expected_sha} actual={actual}"
                  )

          closeout = read_json(
              "research/draft-pick-fv-v6/"
              "r1_r4_v6_research_closeout.json"
          )
          closeout_manifest = read_json(
              "research/draft-pick-fv-v6/"
              "r1_r4_v6_research_closeout_manifest.json"
          )
          phase4 = read_json(
              "research/draft-pick-fv-v6/"
              "r1_r4_loyo_development_selection_manifest_v6_1.json"
          )

          assert closeout["status"] == \
              "V6_RESEARCH_CLOSED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE"
          assert closeout["final_decision"] == \
              "STOP_NO_V6_R1_R4_DEVELOPMENT_CANDIDATE"
          assert closeout["research_complete"] is True
          assert closeout["eligible_candidate_n"] == 0
          assert closeout["selected_candidate"] is None
          assert closeout["production_change_authorized"] is False
          assert closeout["v6_refit_allowed"] is False
          assert closeout["v6_scope_expansion_allowed"] is False
          assert closeout["v6_2024_H2_open_allowed"] is False
          assert closeout["v6_2024_H3_open_allowed"] is False
          assert closeout["holdout_2024"]["H2_outcomes_opened_by_V6"] is False
          assert closeout["holdout_2024"]["H3_outcomes_opened_by_V6"] is False
          assert closeout["successor_research_constraints"][
              "new_study_required"
          ] is True

          assert closeout_manifest["research_complete"] is True
          assert closeout_manifest["eligible_candidate_n"] == 0
          assert closeout_manifest["selected_candidate"] is None
          assert closeout_manifest["2024_H2_outcomes_opened"] is False
          assert closeout_manifest["2024_H3_outcomes_opened"] is False
          assert closeout_manifest["production_change_authorized"] is False
          assert closeout_manifest["successor_requires_new_preregistration"] \
              is True

          assert phase4["decision"] == \
              "STOP_NO_V6_R1_R4_DEVELOPMENT_CANDIDATE"
          assert phase4["final_candidate_frozen"] is False
          assert phase4[
              "2024_H2_outcome_open_authorized_next_stage"
          ] is False
          assert phase4["2024_H3_outcomes_remain_sealed"] is True

          dispatcher = workflow_dir / \
              "package-adjustment-audit-step4-exact-live-oos.yml"
          dispatcher_triggers = trigger_names(dispatcher)
          assert "schedule" in dispatcher_triggers
          assert "workflow_dispatch" in dispatcher_triggers
          dispatcher_text = dispatcher.read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in dispatcher_text

          current = {
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          expected_current = set(archive_targets) | protected
          if current != expected_current:
              raise SystemExit(
                  "Cleanup inventory drift. Refusing to guess.\n"
                  f"Missing expected: "
                  f"{sorted(expected_current-current)}\n"
                  f"Unexpected current: "
                  f"{sorted(current-expected_current)}"
              )
          if set(archive_targets) & protected:
              raise SystemExit("archive/protected overlap")

          rows = []
          for name, expected_sha in sorted(archive_targets.items()):
              src = workflow_dir / name
              dst = archive_dir / name
              if not src.exists():
                  raise SystemExit(f"Archive target missing: {src}")
              if dst.exists():
                  raise SystemExit(
                      f"Archive destination already exists: {dst}"
                  )
              actual_sha = git_blob_sha(src)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"SHA drift for {name}: "
                      f"expected={expected_sha} actual={actual_sha}"
                  )
              triggers = trigger_names(src)
              if triggers != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Refusing to archive non-manual-only workflow "
                      f"{name}: triggers={sorted(triggers)}"
                  )
              rows.append({
                  "original_path": str(src),
                  "archive_path": str(dst),
                  "git_blob_sha": actual_sha,
                  "sha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                  "triggers": sorted(triggers),
                  "cleanup_batch": batch,
              })

          plan = {
              "schema_version": 6,
              "cleanup_batch": batch,
              "active_before_n": len(current),
              "archive_now_n": len(rows),
              "active_after_n": len(protected),
              "protected_active_workflows": sorted(protected),
              "archive_entries": rows,
              "delete_entries": [],
          }
          Path(
              ".github/workflow-archive/workflow-cleanup-plan.json"
          ).write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          assert len(current) == 26
          assert len(rows) == 7
          assert len(protected) == 19

          print("PASS: V6 closeout evidence authorizes workflow archival.")
          print("PASS: active workflows before cleanup: 26")
          print("PASS: exact completed V6 workflows to archive: 7")
          print("PASS: active protected workflows after cleanup: 19")
          print(
              "PASS: scheduled exact-live Package Adjustment monitor preserved."
          )
          PY

      - name: Archive completed V6 manual-only workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan_path = Path(
              ".github/workflow-archive/workflow-cleanup-plan.json"
          )
          plan = json.loads(plan_path.read_text(encoding="utf-8"))

          for row in plan["archive_entries"]:
              src = Path(row["original_path"])
              dst = Path(row["archive_path"])
              dst.parent.mkdir(parents=True, exist_ok=True)
              if not src.exists() or dst.exists():
                  raise SystemExit(
                      f"Unsafe move state: "
                      f"src={src.exists()} dst={dst.exists()} "
                      f"for {src.name}"
                  )
              src.rename(dst)
              actual = hashlib.sha256(dst.read_bytes()).hexdigest()
              if actual != row["sha256"]:
                  raise SystemExit(f"Post-move hash mismatch: {dst}")

          print(
              f"PASS: archived "
              f"{len(plan['archive_entries'])} completed V6 workflows."
          )
          PY

      - name: Update archive manifest and README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          archive_dir = Path(".github/workflow-archive/completed-research")
          plan_path = Path(
              ".github/workflow-archive/workflow-cleanup-plan.json"
          )
          manifest_path = archive_dir / "archive_manifest.json"
          readme_path = archive_dir / "README.md"

          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          old = json.loads(manifest_path.read_text(encoding="utf-8"))

          archive_by_original = {
              row["original_path"]: row
              for row in old.get("archive_entries", [])
          }
          for row in plan["archive_entries"]:
              prior = archive_by_original.get(row["original_path"])
              if prior and prior.get("sha256") != row["sha256"]:
                  raise SystemExit(
                      f"Archive manifest conflict: {row['original_path']}"
                  )
              archive_by_original[row["original_path"]] = row

          archive_entries = [
              archive_by_original[k] for k in sorted(archive_by_original)
          ]
          deleted_entries = list(old.get("deleted_obsolete_workflows", []))

          actual_yaml = sorted(
              p.name for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          )
          manifest_yaml = sorted(
              Path(row["archive_path"]).name for row in archive_entries
          )
          if actual_yaml != manifest_yaml:
              raise SystemExit("Archive inventory mismatch after V6 move.")

          now = datetime.now(timezone.utc).isoformat()
          manifest = {
              "schema_version": 6,
              "last_cleanup_batch": plan["cleanup_batch"],
              "last_cleanup_at_utc": now,
              "archive_workflow_n": len(archive_entries),
              "protected_active_workflow_n": len(
                  plan["protected_active_workflows"]
              ),
              "protected_active_workflows":
                  plan["protected_active_workflows"],
              "archive_entries": archive_entries,
              "deleted_obsolete_workflows": deleted_entries,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Completed GitHub Actions Research Workflows",
              "",
              "Completed manual-only research/deployment workflows are moved "
              "out of `.github/workflows` so they do not clutter the GitHub "
              "Actions workflow list.",
              "",
              "Archived YAML files are preserved byte-for-byte. Original "
              "paths, Git blob SHAs, SHA-256 hashes, and triggers are recorded "
              "in `archive_manifest.json`.",
              "",
              "Recurring production/data workflows and studies that are still "
              "collecting or intentionally rerunnable remain active.",
              "",
              f"Archive refreshed: {now}",
              "",
              f"Archived workflow count: **{len(actual_yaml)}**",
              f"Active protected workflow count: "
              f"**{len(plan['protected_active_workflows'])}**",
              "",
              "## Active protected workflows",
              "",
          ]
          lines.extend(
              f"- {name}" for name in plan["protected_active_workflows"]
          )
          lines += ["", "## Archived workflows", ""]
          lines.extend(f"- {name}" for name in actual_yaml)

          if deleted_entries:
              lines += ["", "## Deleted exact obsolete duplicates", ""]
              for row in deleted_entries:
                  lines.append(f"- `{row['path']}` — {row['reason']}")

          lines.append("")
          readme_path.write_text("\n".join(lines), encoding="utf-8")

          plan_path.unlink()

          assert len(actual_yaml) == 120
          assert len(plan["protected_active_workflows"]) == 19
          print(
              "PASS: archive manifest now tracks "
              f"{len(archive_entries)} workflows."
          )
          PY

      - name: Validate remaining active workflow folder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )
          expected = set(manifest["protected_active_workflows"])
          workflow_dir = Path(".github/workflows")
          actual = {
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          if actual != expected:
              raise SystemExit(
                  f"Active workflow mismatch.\n"
                  f"Expected={sorted(expected)}\n"
                  f"Actual={sorted(actual)}"
              )

          names = {}
          for p in sorted(workflow_dir.iterdir()):
              if p.suffix not in {".yml", ".yaml"}:
                  continue
              doc = yaml.safe_load(p.read_text(encoding="utf-8"))
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid YAML object: {p}")
              display = str(doc.get("name") or "")
              if not display:
                  raise SystemExit(f"Workflow has no name: {p}")
              if display in names:
                  raise SystemExit(
                      f"Duplicate workflow display name: {display}: "
                      f"{names[display]} and {p.name}"
                  )
              names[display] = p.name
              if "on" not in doc and True not in doc:
                  raise SystemExit(f"Workflow has no trigger: {p}")

          dispatcher = (
              workflow_dir /
              "package-adjustment-audit-step4-exact-live-oos.yml"
          )
          text = dispatcher.read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in text
          assert "schedule:" in text

          assert len(actual) == 19
          print(
              "PASS: active Actions folder now contains exactly "
              "19 protected workflows."
          )
          PY

      - name: Run full repository regression
        shell: bash
        run: |
          set -euo pipefail

          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

          restore_tu() {
            git checkout -- "$TU_JSON" "$TU_MD"
          }
          trap restore_tu EXIT

          python3 \
            scripts/projections/build_team_utility_lineup_projections.py \
            --write

          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

          echo "PASS: full repository regression suite green."

      - name: Prove cleanup scope
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .github/workflow-archive/workflow-cleanup-plan.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )

          batch = "2026-09-23-post-draft-pick-fv-v6"
          batch_rows = [
              row for row in manifest["archive_entries"]
              if row.get("cleanup_batch") == batch
          ]
          if len(batch_rows) != 7:
              raise SystemExit(
                  f"Expected 7 workflows in current cleanup batch, "
                  f"found {len(batch_rows)}"
              )

          allowed = {
              ".github/workflow-archive/completed-research/README.md",
              ".github/workflow-archive/completed-research/archive_manifest.json",
          }
          for row in batch_rows:
              allowed.add(row["original_path"])
              allowed.add(row["archive_path"])

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              raw = line[3:]
              if " -> " in raw:
                  left, right = raw.split(" -> ", 1)
                  touched.add(left)
                  touched.add(right)
              else:
                  touched.add(raw)

          unexpected = sorted(touched - allowed)
          if unexpected:
              raise SystemExit(
                  "Cleanup touched unexpected files: "
                  + ", ".join(unexpected)
              )

          print(
              f"PASS: cleanup scope exact; touched {len(touched)} paths."
          )
          PY

      - name: Commit workflow cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during cleanup; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- .github

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m \
            "Archive completed Draft Pick FV V6 workflows"
          git push origin HEAD:main

          echo "PASS: post-V6 workflow-folder cleanup committed."
