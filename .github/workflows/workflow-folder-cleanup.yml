name: Workflow Folder Cleanup

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests==2.34.2"

      - name: Guard completed-study evidence and exact workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          import yaml

          workflow_dir = Path(".github/workflows")
          archive_dir = Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True, exist_ok=True)

          # Exact Git blob SHAs of workflows that are now completed/manual-only
          # and safe to move out of the active GitHub Actions folder.
          archive_targets = {
              "cross-position-apex-calibration-v1-phase1-diagnostic-freeze.yml":
                  "4f30067f64f26acd165190a40ac20ad38f2d1149",
              "draft-pick-fv-v4-clean-source-recovery.yml":
                  "4147c5ff54ac0028ff9c3fff2991729385a9f283",
              "draft-pick-fv-v5-phase2-1-preoutcome-source-retention-amendment.yml":
                  "23f124bc29dd0ae8bac722d8b55268e2d64ae2f7",
              "draft-pick-fv-v5-phase3-historical-outcome-harvest.yml":
                  "3f64c95b6577ada1a40656eb8fa73147c50d0f4f",
              "draft-pick-fv-v5-phase4-development-candidate-fit.yml":
                  "5eac9dc15c254dc877f062224e1afce9c1873776",
              "draft-pick-fv-v5-phase5-locked-validation-scoring.yml":
                  "d43701a372a806656b9b4590c05be0aadf122c7d",
              "draft-pick-fv-v5-phase6-research-closeout.yml":
                  "3d4e354ebe5974444cff2313fa13868aa0ef1421",
              "draft-pick-fv-v5-r1-r2-bridge-preregistration.yml":
                  "64aba3ec27bbfda4c6faf691ba3684127c68806b",
              "draft-pick-fv-v5-r1-r2-source-catalog-identity-freeze.yml":
                  "621ab72d1a3d675e3b929500e3f397479fc96668",
              "offense-position-lineage-v1-phase1-audit-freeze.yml":
                  "6699595607aa724584ad0c641cd94640374296dd",
              "package-adjustment-v6-development-evaluation.yml":
                  "b579d74360c57a9d73e97a7a829daf9dad26dd77",
              "package-adjustment-v6-development-freeze-exact-700.yml":
                  "76c953c84f014debc0abfe41104442b1b440114d",
              "package-adjustment-v6-development-maturity-monitor.yml":
                  "c615dfb41fe29fb3e2be2995df800a0467c4cda3",
              "package-adjustment-v6-production-deployment.yml":
                  "1b0e8f992ba4cbb787eeee2197a839b9c944bade",
              "package-adjustment-v6-production-review.yml":
                  "2a59e9c887b2c00aefd17d5e11b2f8b21254f791",
              "package-adjustment-v6-prospective-catalog-freeze.yml":
                  "9954774d4c028e5a78a4da61735859d3584ee3eb",
              "package-adjustment-v6-prospective-evaluation.yml":
                  "7ff968b0d45dac47b7974a9790d3adda1dcfd4f4",
              "package-adjustment-v6-prospective-feasibility-amendment.yml":
                  "67e996f5884438740950ec5e02ab55e186a51277",
              "package-adjustment-v6-prospective-freeze-exact-1800.yml":
                  "2cd511f0408214ea8c2040dc3ccb6691e0c2f5bb",
              "package-adjustment-v6-prospective-maturity-monitor.yml":
                  "b65d3d675f0c6d09ca5b8e23d47b2edfd7c25986",
              "package-adjustment-v6-prospective-power-analysis.yml":
                  "d0570ca1a5c3dcb8edeefad48b9ee570becdf9e0",
              "package-adjustment-v6-prospective-preregistration.yml":
                  "8a58b0812a26a1bcc576f1aacc86ee447d5ba957",
              "package-adjustment-v6-prospective-voting-activation.yml":
                  "7a39ed1dc71e9126404c2ff83dd73abf051980a0",
              "package-adjustment-v7-phase0-pick-player-scale-bridge-audit.yml":
                  "f6981955be9ebdd002b318eadcb57d472470f811",
          }

          # These remain active. Some are recurring production/data workflows;
          # others are still collecting evidence or are intentionally rerunnable.
          protected = {
              "age-curve-v2-phase5.yml",
              "cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "free-agent-utility-v1-refresh.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "market-edge-v1-prospective-study.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "research-program-status-v1-current-state-audit.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
              "workflow-folder-cleanup.yml",
          }

          stray_delete = {
              "workflows/.githubdraft-pick-fv-v5-phase6-research-closeout.yml":
                  "c15093bd523e488006ca7eafb10a755c81c311f7",
          }

          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def git_blob_sha(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def trigger_names(path):
              doc = yaml.load(
                  Path(path).read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")
              triggers = doc.get("on")
              if isinstance(triggers, str):
                  return {triggers}
              if isinstance(triggers, list):
                  return set(map(str, triggers))
              if isinstance(triggers, dict):
                  return set(map(str, triggers.keys()))
              raise SystemExit(
                  f"Unrecognized workflow trigger syntax: {path}: {triggers!r}"
              )

          # ---- Completion evidence. Refuse cleanup if study state drifted. ----
          v5 = read_json(
              "research/draft-pick-fv-v5/"
              "r1_r2_v5_research_closeout_manifest.json"
          )
          assert v5["status"] == "V5_RESEARCH_CLOSED_NO_ELIGIBLE_CANDIDATE"
          assert v5["research_complete"] is True
          assert v5["v5_refit_allowed"] is False
          assert v5["production_change_authorized"] is False

          v4 = read_json(
              "research/draft-pick-fv-v4/clean_source_recovery_manifest_v4.json"
          )
          assert v4["decision"] == \
              "STOP_V4_CLEAN_SOURCE_RECOVERY_INSUFFICIENT"
          assert v4["authorizes_outcome_ingestion"] is False

          offense = read_json(
              "research/offense-position-lineage-v1/"
              "offense_position_lineage_v1_phase1.json"
          )
          assert offense["decision"] == \
              "STOP_OFFENSE_POSITION_LINEAGE_V1_NO_MATERIAL_CANDIDATE"
          assert offense["production_change_authorized"] is False

          cross2 = read_json(
              "research/cross-position-apex-calibration-v1/"
              "phase2_reconciliation_manifest.json"
          )
          assert cross2["decision"] == \
              "HOLD_DEPLOYMENT_CONTINUE_FROZEN_COLLECTION"
          assert cross2["deployment_authorized"] is False
          # Phase 1 can be archived because Phase 2 is the live rerun surface.

          v6 = read_json(
              "research/package-adjustment-v6/production_deployment_v1.json"
          )
          assert v6["status"] == "v6_controlled_live_deployed"
          assert v6["production_revision"] == \
              "v1.7-v6-size3-c2-overlay"
          assert v6["postlaunch_monitoring_required"] is True

          v7 = read_json(
              "research/package-adjustment-v7/"
              "phase0_pick_player_scale_bridge_v1.json"
          )
          assert v7["decision"] == \
              "INVESTIGATE_DRAFT_PICK_TO_PLAYER_FV_BRIDGE_BEFORE_V7_PHASE1"
          assert v7["production_change_authorized"] is False

          # The permanent V6 exact-live OOS dispatcher MUST stay active.
          dispatcher = workflow_dir / \
              "package-adjustment-audit-step4-exact-live-oos.yml"
          dispatcher_triggers = trigger_names(dispatcher)
          assert "schedule" in dispatcher_triggers
          assert "workflow_dispatch" in dispatcher_triggers
          dispatcher_text = dispatcher.read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in dispatcher_text

          # ---- Exact active-folder classification. ----
          current = {
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          expected_current = set(archive_targets) | protected
          if current != expected_current:
              raise SystemExit(
                  "Cleanup inventory drift. Refusing to guess.\n"
                  f"Missing expected: {sorted(expected_current-current)}\n"
                  f"Unexpected current: {sorted(current-expected_current)}"
              )

          if set(archive_targets) & protected:
              raise SystemExit("archive/protected overlap")

          rows = []
          for name, expected_sha in sorted(archive_targets.items()):
              src = workflow_dir / name
              dst = archive_dir / name
              if not src.exists():
                  raise SystemExit(f"Archive target missing: {src}")
              if dst.exists():
                  raise SystemExit(
                      f"Archive destination already exists: {dst}"
                  )
              actual_sha = git_blob_sha(src)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"SHA drift for {name}: "
                      f"expected={expected_sha} actual={actual_sha}"
                  )
              triggers = trigger_names(src)
              if triggers != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Refusing to archive non-manual-only workflow "
                      f"{name}: triggers={sorted(triggers)}"
                  )
              rows.append({
                  "original_path": str(src),
                  "archive_path": str(dst),
                  "git_blob_sha": actual_sha,
                  "sha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                  "triggers": sorted(triggers),
                  "cleanup_batch": "2026-09-23-post-draft-pick-fv-v5",
              })

          delete_rows = []
          for raw_path, expected_sha in sorted(stray_delete.items()):
              p = Path(raw_path)
              if not p.exists():
                  raise SystemExit(
                      f"Expected malformed stray file is missing: {p}"
                  )
              actual_sha = git_blob_sha(p)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"Stray-file SHA drift: {p} "
                      f"expected={expected_sha} actual={actual_sha}"
                  )
              delete_rows.append({
                  "path": str(p),
                  "git_blob_sha": actual_sha,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "reason": (
                      "Malformed duplicate path created during V5 Phase 6 "
                      "workflow replacement; canonical workflow is archived "
                      "from .github/workflows in this cleanup."
                  ),
              })

          plan = {
              "schema_version": 5,
              "cleanup_batch": "2026-09-23-post-draft-pick-fv-v5",
              "active_before_n": len(current),
              "archive_now_n": len(rows),
              "active_after_n": len(protected),
              "protected_active_workflows": sorted(protected),
              "archive_entries": rows,
              "delete_entries": delete_rows,
          }
          Path(".github/workflow-archive/workflow-cleanup-plan.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(f"PASS: active workflows before cleanup: {len(current)}")
          print(f"PASS: exact manual-only workflows to archive: {len(rows)}")
          print(f"PASS: active workflows after cleanup: {len(protected)}")
          print(f"PASS: malformed stray files to delete: {len(delete_rows)}")
          print("PASS: scheduled exact-live Package Adjustment monitor preserved.")
          PY

      - name: Archive completed manual-only workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan_path = Path(
              ".github/workflow-archive/workflow-cleanup-plan.json"
          )
          plan = json.loads(plan_path.read_text(encoding="utf-8"))

          for row in plan["archive_entries"]:
              src = Path(row["original_path"])
              dst = Path(row["archive_path"])
              dst.parent.mkdir(parents=True, exist_ok=True)
              if not src.exists() or dst.exists():
                  raise SystemExit(
                      f"Unsafe move state: src={src.exists()} dst={dst.exists()} "
                      f"for {src.name}"
                  )
              src.rename(dst)
              actual = hashlib.sha256(dst.read_bytes()).hexdigest()
              if actual != row["sha256"]:
                  raise SystemExit(
                      f"Post-move hash mismatch: {dst}"
                  )

          print(
              f"PASS: archived {len(plan['archive_entries'])} completed workflows."
          )
          PY

      - name: Delete exact malformed duplicate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          plan = json.loads(
              Path(".github/workflow-archive/workflow-cleanup-plan.json")
              .read_text(encoding="utf-8")
          )
          for row in plan["delete_entries"]:
              p = Path(row["path"])
              if not p.exists():
                  raise SystemExit(f"Delete target vanished: {p}")
              subprocess.run(["git", "rm", "--", str(p)], check=True)

          print(
              f"PASS: removed {len(plan['delete_entries'])} exact malformed duplicate(s)."
          )
          PY

      - name: Update archive manifest and README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          archive_dir = Path(".github/workflow-archive/completed-research")
          plan_path = Path(
              ".github/workflow-archive/workflow-cleanup-plan.json"
          )
          manifest_path = archive_dir / "archive_manifest.json"
          readme_path = archive_dir / "README.md"

          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          old = (
              json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest_path.exists()
              else {}
          )

          archive_by_original = {
              row["original_path"]: row
              for row in old.get("archive_entries", [])
          }
          for row in plan["archive_entries"]:
              prior = archive_by_original.get(row["original_path"])
              if prior and prior.get("sha256") != row["sha256"]:
                  raise SystemExit(
                      f"Archive manifest conflict: {row['original_path']}"
                  )
              archive_by_original[row["original_path"]] = row

          deleted_by_path = {
              row["path"]: row
              for row in old.get("deleted_obsolete_workflows", [])
          }
          for row in plan["delete_entries"]:
              prior = deleted_by_path.get(row["path"])
              if prior and prior.get("sha256") != row["sha256"]:
                  raise SystemExit(
                      f"Deletion manifest conflict: {row['path']}"
                  )
              deleted_by_path[row["path"]] = row

          archive_entries = [
              archive_by_original[k] for k in sorted(archive_by_original)
          ]
          deleted_entries = [
              deleted_by_path[k] for k in sorted(deleted_by_path)
          ]

          actual_yaml = sorted(
              p.name for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          )
          manifest_yaml = sorted(
              Path(row["archive_path"]).name for row in archive_entries
          )
          if actual_yaml != manifest_yaml:
              raise SystemExit(
                  "Archive inventory mismatch after move."
              )

          manifest = {
              "schema_version": 5,
              "last_cleanup_batch": plan["cleanup_batch"],
              "last_cleanup_at_utc": datetime.now(timezone.utc).isoformat(),
              "archive_workflow_n": len(archive_entries),
              "protected_active_workflow_n": len(
                  plan["protected_active_workflows"]
              ),
              "protected_active_workflows":
                  plan["protected_active_workflows"],
              "archive_entries": archive_entries,
              "deleted_obsolete_workflows": deleted_entries,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Completed GitHub Actions Research Workflows",
              "",
              "Completed manual-only research/deployment workflows are moved "
              "out of `.github/workflows` so they do not clutter the GitHub "
              "Actions workflow list.",
              "",
              "Archived YAML files are preserved byte-for-byte. Original "
              "paths, Git blob SHAs, SHA-256 hashes, and triggers are recorded "
              "in `archive_manifest.json`.",
              "",
              "Recurring production/data workflows and studies that are still "
              "collecting or intentionally rerunnable remain active.",
              "",
              f"Archive refreshed: "
              f"{datetime.now(timezone.utc).isoformat()}",
              "",
              f"Archived workflow count: **{len(actual_yaml)}**",
              f"Active protected workflow count: "
              f"**{len(plan['protected_active_workflows'])}**",
              "",
              "## Active protected workflows",
              "",
          ]
          lines.extend(
              f"- {name}"
              for name in plan["protected_active_workflows"]
          )
          lines += ["", "## Archived workflows", ""]
          lines.extend(f"- {name}" for name in actual_yaml)

          if deleted_entries:
              lines += ["", "## Deleted exact obsolete duplicates", ""]
              for row in deleted_entries:
                  lines.append(
                      f"- `{row['path']}` — {row['reason']}"
                  )

          lines.append("")
          readme_path.write_text(
              "\n".join(lines), encoding="utf-8"
          )

          plan_path.unlink()
          print(
              f"PASS: archive manifest tracks {len(archive_entries)} workflows."
          )
          PY

      - name: Validate remaining active workflow folder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          import yaml

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )
          expected = set(manifest["protected_active_workflows"])
          workflow_dir = Path(".github/workflows")
          actual = {
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          if actual != expected:
              raise SystemExit(
                  f"Active workflow mismatch.\n"
                  f"Expected={sorted(expected)}\nActual={sorted(actual)}"
              )

          names = {}
          for p in sorted(workflow_dir.iterdir()):
              if p.suffix not in {".yml", ".yaml"}:
                  continue
              doc = yaml.safe_load(p.read_text(encoding="utf-8"))
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid YAML object: {p}")
              display = str(doc.get("name") or "")
              if not display:
                  raise SystemExit(f"Workflow has no name: {p}")
              if display in names:
                  raise SystemExit(
                      f"Duplicate workflow display name: {display}: "
                      f"{names[display]} and {p.name}"
                  )
              names[display] = p.name
              if "on" not in doc:
                  # PyYAML 1.1 may parse unquoted `on` as boolean True.
                  if True not in doc:
                      raise SystemExit(f"Workflow has no trigger: {p}")

          dispatcher = (
              workflow_dir /
              "package-adjustment-audit-step4-exact-live-oos.yml"
          )
          text = dispatcher.read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in text
          assert "schedule:" in text

          print(
              f"PASS: active Actions folder now contains exactly "
              f"{len(actual)} protected workflows."
          )
          PY

      - name: Run full repository regression with transient Team Utility refresh
        shell: bash
        run: |
          set -euo pipefail

          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

          restore_tu() {
            git checkout -- "$TU_JSON" "$TU_MD"
          }
          trap restore_tu EXIT

          # Current projection/identity inputs can move via scheduled refreshes
          # ahead of this derived Team Utility artifact. Rebuild it only as a
          # transient regression fixture; never include it in the cleanup commit.
          python3 \
            scripts/projections/build_team_utility_lineup_projections.py \
            --write

          python3 scripts/validation/repo_regression_checks.py

          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

          echo "PASS: full repository regression suite green."

      - name: Prove cleanup scope
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .github/workflow-archive/workflow-cleanup-plan.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )

          batch = "2026-09-23-post-draft-pick-fv-v5"
          batch_rows = [
              row for row in manifest["archive_entries"]
              if row.get("cleanup_batch") == batch
          ]
          if len(batch_rows) != 24:
              raise SystemExit(
                  f"Expected 24 workflows in current cleanup batch, "
                  f"found {len(batch_rows)}"
              )

          allowed = {
              ".github/workflow-archive/completed-research/README.md",
              ".github/workflow-archive/completed-research/archive_manifest.json",
              "workflows/.githubdraft-pick-fv-v5-phase6-research-closeout.yml",
          }
          for row in batch_rows:
              allowed.add(row["original_path"])
              allowed.add(row["archive_path"])

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              raw = line[3:]
              if " -> " in raw:
                  left, right = raw.split(" -> ", 1)
                  touched.add(left)
                  touched.add(right)
              else:
                  touched.add(raw)

          unexpected = sorted(touched - allowed)
          if unexpected:
              raise SystemExit(
                  "Cleanup touched unexpected files: "
                  + ", ".join(unexpected)
              )

          print(f"PASS: cleanup scope exact; touched {len(touched)} paths.")
          PY

      - name: Commit workflow cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during cleanup; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- .github workflows

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m "Archive completed GitHub Actions workflows"
          git push origin HEAD:main

          echo "PASS: workflow-folder cleanup committed."
