name: CAL26 V1R6 - Exact Live FV Impact of Stable Week6 Role Upgrades READ ONLY

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r6-readonly-role-fv-impact
  cancel-in-progress: false

jobs:
  role_to_fv_shadow:
    name: Week6 stable role candidates against exact live FV; no writes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout canonical live price inputs read only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact successful V1R5 Week6 role artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/cal26-v1r6-source"
          gh run download 39643851866 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R5-Frozen-Role-V2-Through-Week6-READ-ONLY \
            --dir "${{ runner.temp }}/cal26-v1r6-source"
          test -f "${{ runner.temp }}/cal26-v1r6-source/cal26-v1r5-output/CAL26_V1R5_565_Week6_Role_Comparison.csv"
          test -f "${{ runner.temp }}/cal26-v1r6-source/cal26-v1r5-output/CAL26_V1R5_Manifest.json"
      - name: Materialize isolated research-only canonical FV shadow evaluator
        shell: bash
        run: |
          set -euo pipefail
          cat > "${{ runner.temp }}/cal26_v1r6_role_fv_impact.py" <<'PY_CAL26_V1R6'
          #!/usr/bin/env python3
          """CAL26 V1R6: frozen Week6 Role V2 -> exact canonical FV shadow, research only.
          
          Uses current production snapshot_values.py, never modifies model sources or price files.
          Existing production-value index.html is canonical FV formula; changing roles often
          has ZERO FV effect for players whose real production multiplier is used.
          """
          import argparse, csv, hashlib, json, sys, collections, datetime, copy
          from pathlib import Path
          
          EXPECTED_V1R5_CSV_SHA='7eafb0410c02625d3b0daff89182b391df6483e9d766901ec0a3f916f99810fe'
          EXPECTED_V1R5_MANIFEST_SHA='a2c811c0c6fb130715b7ae85005fa1d5a7acfa1a4f922953118bd07efc7c46ea'
          EXPECTED_V1R5_RUN=39643851866
          ROLES=['Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite']
          FOCUS={'justin jefferson','cj stroud','marvin harrison','matthew golden',
                 'brian branch','drake maye','justin herbert','bo nix','saquon barkley',
                 'george kittle','sonny styles','fernando mendoza','kenyon sadiq',
                 'jack campbell','nick bolton','kyle hamilton','roquan smith',
                 'micah parsons'}
          # Explicit known retired/status-risk examples, not a claim this is a complete injury/status feed.
          STATUS_HOLD={'joe mixon','aaron donald'}
          
          def check(ok,msg):
              if not ok: raise AssertionError('CAL26_V1R6_'+msg)
          
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def csvread(p):
              with Path(p).open(encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          
          def csvwrite(p,rows,cols):
              with Path(p).open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');w.writeheader();w.writerows(rows)
          
          def boolf(v):return str(v).lower() in ('true','1')
          
          def analyze(rows,cfg,values0,values1,config):
              bybase={k.lower():k for k in cfg['player_db']}
              check(len(bybase)==len(cfg['player_db'])==565,'PRODUCTION_PLAYER_COUNT_NOT_565')
              check(len(rows)==565 and len({x['player'] for x in rows})==565,'SOURCE_565_UNIQUE_FAIL')
              positions=collections.Counter();statuses=collections.Counter()
              out=[]
              for r in rows:
                  p=r['player']; key=bybase.get(p)
                  check(key is not None,'PRODUCTION_MISSING_'+p)
                  old=r['cal26_role_original']; new=r['week6_model_tier']; wk4=r['week4_model_tier']
                  check(cfg['player_db'][key]['pos']==r['position'], 'POSITION_MISMATCH_'+p)
                  check(cfg['player_db'][key]['role']==old,'ROLE_DRIFT_'+p)
                  check(old in ROLES and (not new or new in ROLES),'BAD_ROLE_'+p)
                  accepted=boolf(r['protect_accepted_fv'])
                  stage=r['week6_role_decision']
                  stable_standard=(stage=='WEEK6_STANDARD_UPGRADE' and new and new==wk4 and
                                   int(r['week6_prior_active_games'])>=3)
                  status_hold=p in STATUS_HOLD
                  if stable_standard and not status_hold:
                      action='STABLE_STANDARD_SHADOW_PRICED'
                  elif status_hold and stage in ('WEEK6_STANDARD_UPGRADE','WEEK6_LARGE_UPGRADE_REVIEW'):
                      action='STATUS_HOLD_NO_APPLY'
                  elif stage=='WEEK6_STANDARD_UPGRADE':action='RECENTLY_CHANGED_OR_NEW_MATCH_REVIEW'
                  elif stage=='WEEK6_LARGE_UPGRADE_REVIEW':action='LARGE_UPGRADE_REVIEW'
                  elif stage=='WEEK6_DOWNGRADE_HELD':action='DOWNGRADE_HELD'
                  elif stage=='NO_WEEK6_MATCH_RETAIN_OLD_ROLE':action='UNMATCHED_RETAIN'
                  elif stage=='WEEK6_MATCHED_UNCHANGED':action='MATCHED_UNCHANGED'
                  else:raise AssertionError('UNEXPECTED_ACTION_'+p+'_'+stage)
                  orig=int(values0[key]['value'])
                  now=int(values1[key]['value'])
                  delta=now-orig
                  if action!='STABLE_STANDARD_SHADOW_PRICED':check(delta==0,'NONCANDIDATE_PRICE_MOVED_'+p)
                  if action=='STABLE_STANDARD_SHADOW_PRICED':check(delta>=0,'ROLE_UPGRADE_REDUCED_FV_'+p)
                  # These CAL26 owner accepted 18 are validation controls, never candidate price changes.
                  proposed_release_price=orig if accepted else now
                  owner_fv=r['cal26_proposed_fv_unchanged']
                  x=dict(r)
                  x.update({
                      'cal26_v1r6_action':action,
                      'live_role':old,
                      'candidate_role':new if action=='STABLE_STANDARD_SHADOW_PRICED' else old,
                      'live_fv_exact':orig,
                      'raw_role_only_shadow_fv':now,
                      'raw_role_only_fv_delta':delta,
                      'protected_release_preview_fv':proposed_release_price,
                      'protected_release_preview_fv_delta':proposed_release_price-orig,
                      'owner_cal26_accepted_proposal_stays': owner_fv if accepted else '',
                      'role_upgrade_no_fv_change':action=='STABLE_STANDARD_SHADOW_PRICED' and delta==0,
                      'live_real_production_data': values0[key]['has_real_prod_data'],
                      'live_no_real_production_history':values0[key]['no_real_production_history'],
                      'live_effective_production_multiplier': values0[key]['prod_mult'],
                      'shadow_effective_production_multiplier': values1[key]['prod_mult'],
                      'live_age_multiplier': values0[key]['age_mult'],
                      'shadow_age_multiplier':values1[key]['age_mult'],
                      'production_files_changed':False,
                      'production_change_authorized':False,
                  })
                  out.append(x);positions[r['position']]+=1;statuses[action]+=1
              check(sum(boolf(x['protect_accepted_fv']) for x in out)==18,'ACCEPTED_18_COUNT_DRIFT')
              check(sum(boolf(x['cal26_proposal_available']) for x in out)==80,'REVIEWED_80_COUNT_DRIFT')
              check(sum(x['protected_release_preview_fv_delta'] for x in out if boolf(x['protect_accepted_fv']))==0,
                    'OWNER_ACCEPTED_PRICES_MOVED')
              check(len(out)==565,'OUTPUT_UNIVERSE_CHANGED')
              return out, statuses,positions
          
          def main(source,repo,out,synthetic=False):
              source,repo,out=Path(source),Path(repo),Path(out)
              out.mkdir(parents=True,exist_ok=True)
              csv_path=source/'CAL26_V1R5_565_Week6_Role_Comparison.csv'
              manifest_path=source/'CAL26_V1R5_Manifest.json'
              if not synthetic:
                  check(sha(csv_path)==EXPECTED_V1R5_CSV_SHA,'GREEN_WEEK6_CSV_SHA_MISMATCH')
                  check(sha(manifest_path)==EXPECTED_V1R5_MANIFEST_SHA,'GREEN_WEEK6_MANIFEST_SHA_MISMATCH')
              manifest=json.loads(manifest_path.read_text())
              check(manifest['status']=='PASS_WEEK6_READ_ONLY_ROLE_REFRESH','WEEK6_STATUS_NOT_GREEN')
              check(manifest['as_of_completed_week']==6 and manifest['player_count']==565,'WRONG_WEEK_OR_UNIVERSE')
              check(manifest['owner_accepted_fv_proposals_protected']==18,'ACCEPTED_CONTROLS_NOT_PRESENT')
              check(manifest['model_frozen'] and not manifest['model_retuned'],'FROZEN_ROLE_MODEL_DRIFT')
              sys.path.insert(0,str(repo/'scripts'/'validation'))
              import snapshot_values as sv
              cfg=sv.load_from_html(repo/'index.html')
              check(len(cfg['player_db'])==565,'LIVE_PRODUCTION_UNIVERSE_MISMATCH')
              base=sv.compute_all_values(cfg)
              candidate=copy.deepcopy(cfg)
              rows=csvread(csv_path)
              applied=[]
              live_by_lower={k.lower():k for k in cfg['player_db']}
              for r in rows:
                  p=r['player']; old=r['cal26_role_original']; wk6=r['week6_model_tier']
                  # Stage only stable <=2-tier upgrades; no downgrades or large jumps.
                  if (r['week6_role_decision']=='WEEK6_STANDARD_UPGRADE' and wk6==r['week4_model_tier']
                      and int(r['week6_prior_active_games'])>=3 and p not in STATUS_HOLD):
                      k=live_by_lower.get(p)
                      check(k is not None,'SOURCE_PLAYER_NOT_IN_LIVE_'+p)
                      check(candidate['player_db'][k]['role']==old,'LIVE_ROLE_MISMATCH_'+p)
                      candidate['player_db'][k]['role']=wk6; applied.append(p)
              shadow=sv.compute_all_values(candidate)
              results,statuses,positions=analyze(rows,cfg,base,shadow,candidate)
              check(statuses['STABLE_STANDARD_SHADOW_PRICED']==len(applied),'CANDIDATE_COUNT_MISMATCH')
              check(statuses['STABLE_STANDARD_SHADOW_PRICED']>0,'NO_CANDIDATES')
              cols=list(results[0].keys())
              csvwrite(out/'CAL26_V1R6_All_565_Role_to_Live_FV_Impact.csv',results,cols)
              csvwrite(out/'CAL26_V1R6_Stable_Standard_Role_Impact.csv', [x for x in results if x['cal26_v1r6_action']=='STABLE_STANDARD_SHADOW_PRICED'],cols)
              csvwrite(out/'CAL26_V1R6_Deferred_Role_Reviews.csv', [x for x in results if x['cal26_v1r6_action'] not in ('STABLE_STANDARD_SHADOW_PRICED','MATCHED_UNCHANGED')],cols)
              raw_nonzero=[x for x in results if int(x['raw_role_only_fv_delta'])!=0]
              protected=[x for x in results if boolf(x['protect_accepted_fv'])]
              summary={
                  'status':'PASS_CAL26_V1R6_ROLE_TO_EXACT_FV_SHADOW_ONLY',
                  'source_green_run':EXPECTED_V1R5_RUN,'source_csv_sha256':sha(csv_path),
                  'source_manifest_sha256':sha(manifest_path),
                  'production_index_sha256':sha(repo/'index.html'),
                  'canonical_fv_evaluator_sha256':sha(repo/'scripts/validation/snapshot_values.py'),
                  'source_week':6,'model_frozen':True,'role_change_study_only':True,
                  'output_player_count':len(results),'candidate_role_changes':len(applied),
                  'role_changed_nonzero_fv':len(raw_nonzero),
                  'role_changed_zero_fv':len(applied)-len(raw_nonzero),
                  'role_only_sum_fv_delta':sum(int(x['raw_role_only_fv_delta']) for x in results),
                  'accepted_fv_controls_count':len(protected),
                  'accepted_controls_raw_role_delta_nonzero':sum(int(x['raw_role_only_fv_delta'])!=0 for x in protected),
                  'accepted_controls_protected_price_delta':sum(int(x['protected_release_preview_fv_delta']) for x in protected),
                  'existing_cal26_80_feedback_unchanged':True,
                  'production_changed':False,'price_release_authorized':False,
                  'role_release_authorized':False,
                  'role_group_counts':dict(statuses),'position_counts':dict(positions),
              }
              (out/'CAL26_V1R6_Manifest.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
              lines=['# CAL26 V1R6 — Frozen Week6 roles tested against exact live FV math','',
                   '**NO PRODUCTION CHANGE.** Uses canonical snapshot_values.py loaded from current repo and applies candidate role overrides in memory only.','',
                   f"- Stable +1/+2 tier promotions shadow priced: **{len(applied)}**.",
                   f"- Of those, role changes with nonzero exact FV delta: **{len(raw_nonzero)}**.",
                   f"- Role changes with zero FV impact: **{len(applied)-len(raw_nonzero)}**.",
                   f"- Sum of raw role-only FV changes: **{summary['role_only_sum_fv_delta']}** points (NOT validated fair value).",
                   '- Existing 18 accepted FV proposals preserved in controlled release-preview prices.',
                   '- All 92 large role upgrades and 59 downgrades remain held; changes in Week4/Week6 also held.',
                   '- Note: a change from Rotational to Elite may leave FV unaffected when real production drives the multiplier.',
                   '', '## Representative role and FV sensitivity','',
                   '| Player | Legacy role | Week6 model | Candidate | Live FV | In-memory shadow FV | Raw change |',
                   '|---|---|---|---|---:|---:|---:|']
              for p in sorted(FOCUS):
                  hit=next((x for x in results if x['player']==p),None)
                  if hit:
                      lines.append(f"| {p.title()} | {hit['cal26_role_original']} | {hit['week6_model_tier'] or '—'} | {hit['cal26_v1r6_action']} | {hit['live_fv_exact']} | {hit['raw_role_only_shadow_fv']} | {hit['raw_role_only_fv_delta']:+} |")
              lines+=['','## Release interpretation','',
                   'The shadow role-only price change is a mechanical sensitivity, **not a new optimal price**, and does not model external Market Value, FV+Votes, owner labels or the separate CAL26 peer calibration. Passing this workflow supports further pricing design but does not deploy a new price.','']
              (out/'CAL26_V1R6_Report.md').write_text('\n'.join(lines),encoding='utf-8')
              print(json.dumps(summary,indent=2))
          
          if __name__=='__main__':
              p=argparse.ArgumentParser();p.add_argument('--source',required=True);p.add_argument('--repo',default='.');p.add_argument('--out',required=True)
              a=p.parse_args(); main(a.source,a.repo,a.out)
          PY_CAL26_V1R6
          python - <<'PY_PARSE'
          import ast,os
          from pathlib import Path
          ast.parse((Path(os.environ['RUNNER_TEMP'])/'cal26_v1r6_role_fv_impact.py').read_text())
          print('PASS V1R6 embedded Python parse')
          PY_PARSE
      - name: Run exact live FV shadow and accepted FV price locks
        shell: bash
        run: |
          set -euo pipefail
          python "${{ runner.temp }}/cal26_v1r6_role_fv_impact.py" \
            --source "${{ runner.temp }}/cal26-v1r6-source/cal26-v1r5-output" \
            --repo . \
            --out "${{ runner.temp }}/cal26-v1r6-output"
      - name: Independently verify price controls no production writes and candidate accounting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_AUDIT'
          import csv,json,os
          from pathlib import Path
          o=Path(os.environ['RUNNER_TEMP'])/'cal26-v1r6-output'
          m=json.loads((o/'CAL26_V1R6_Manifest.json').read_text())
          rows=list(csv.DictReader((o/'CAL26_V1R6_All_565_Role_to_Live_FV_Impact.csv').open()))
          assert m['status']=='PASS_CAL26_V1R6_ROLE_TO_EXACT_FV_SHADOW_ONLY'
          assert len(rows)==565 and len({r['player'] for r in rows})==565
          assert m['candidate_role_changes']==110
          assert sum(x['cal26_v1r6_action']=='STABLE_STANDARD_SHADOW_PRICED' for x in rows)==110
          assert m['accepted_fv_controls_count']==18
          assert not any(int(x['protected_release_preview_fv_delta'])!=0 for x in rows if x['protect_accepted_fv']=='True')
          assert not any(int(x['raw_role_only_fv_delta'])!=0 for x in rows if x['cal26_v1r6_action']!='STABLE_STANDARD_SHADOW_PRICED')
          assert m['production_changed'] is False
          print('PASS 565 accounts, 110 stable role candidates, 18 protected prices')
          PY_AUDIT
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cat "${{ runner.temp }}/cal26-v1r6-output/CAL26_V1R6_Report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload read-only exact FV impact artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R6-Week6-Stable-Roles-Exact-FV-Shadow-READ-ONLY
          path: ${{ runner.temp }}/cal26-v1r6-output/
          if-no-files-found: warn
          retention-days: 30
