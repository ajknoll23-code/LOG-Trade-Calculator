name: A-FA10R1 - Free Agent Board Mobile Readability Polish

# Read-only UI refinement of deployed FA09 workspaces. Never modifies the
# canonical model, rankings, private subscriber data or evidence snapshots.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates presentation; Apply commits only two UI assets and additive HTML references"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  mobile-readability:
    name: Free Agent Board mobile polish (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify clean baseline and existing read-only sections
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          for p in assets/fa_workspace_v1.js assets/fa_workspace_v1.css assets/idp_weekly_radar_v1.js assets/idp_early_v1.js assets/idp_intel_v1.js assets/idp_opportunity_v1.js free-agent-board.html data/idp_weekly_2026_public.json; do
            test -s "$p"
          done
          # The previous workspace layout is checksum-pinned to fail safely if rewritten.
          test "$(git hash-object assets/fa_workspace_v1.js)" = '7b1d7a68c91c399c287bd3fd3188017f1ac87769'
          test "$(git hash-object assets/fa_workspace_v1.css)" = 'e9a55daa5dc74abffc3aac0f85b7b50564cb9408'
