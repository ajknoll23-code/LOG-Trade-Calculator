        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_mobile_polish_v1.js
          python3 - <<'PYCODE'
          import hashlib,subprocess,os
          from pathlib import Path
          html=Path('free-agent-board.html').read_text(encoding='utf-8')
          assert html.count('<!-- FA_MOBILE_POLISH_V1_STYLE -->')==1
          assert html.count('<!-- FA_MOBILE_POLISH_V1_SCRIPT -->')==1
          assert html.index('<!-- FA_WORKSPACE_V1_SCRIPT -->') < html.index('<!-- FA_MOBILE_POLISH_V1_SCRIPT -->')
          allowed={'free-agent-board.html','assets/fa_mobile_polish_v1.js','assets/fa_mobile_polish_v1.css'}
          rows=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed={r[3:].strip() for r in rows}
          assert changed<=allowed,'Unexpected repo changes: '+str(changed-allowed)
          for name in ('assets/fa_mobile_polish_v1.js','assets/fa_mobile_polish_v1.css'):
              assert Path(name).stat().st_size>700
          # Never modify the canonical valuation or previous science panels.
          assert not (changed & {'index.html','data/free_agents.json','data/idp_weekly_2026_public.json',
                                'assets/fa_workspace_v1.js','assets/fa_workspace_v1.css'})
          print('PASS: Node syntax, exact changed paths and immutable model/weekly evidence')
          print('Changed files:',', '.join(sorted(changed)) or '(none: idempotent rerun)')
          (Path(os.environ.get('RUNNER_TEMP','/tmp'))/'A_FA10R1_preview_report.md').write_text("# A-FA10R1 Mobile Polish\n\n- Mode: ${{ inputs.mode }}\n- Changed: " + ", ".join(sorted(changed)) + "\n- No valuation, projection, private import, historical source, or data-write modifications.\n" + "- Corrects position shortcuts after re-render, improves IDP text sizing, compacts mobile header, adds quick lenses and private-file refresh guidance.\n",encoding="utf-8")
          PYCODE
      - name: Upload Preview or Apply report
        uses: actions/upload-artifact@v4
        with:
          name: A-FA10R1-MOBILE-POLISH-REPORT
          path: ${{ runner.temp }}/A_FA10R1_preview_report.md
          if-no-files-found: error
          retention-days: 30
      - name: Apply only allowed presentation changes
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- free-agent-board.html assets/fa_mobile_polish_v1.js assets/fa_mobile_polish_v1.css
          python3 - <<'PYCODE'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'free-agent-board.html','assets/fa_mobile_polish_v1.js','assets/fa_mobile_polish_v1.css'}
          assert paths<=allowed, 'Staged unrelated code: '+str(paths-allowed)
          print('Safe staged paths:', sorted(paths))
          PYCODE
          if git diff --cached --quiet; then
            echo 'Already applied, nothing to commit.'
          else
            git commit -m 'A-FA10R1: improve Free Agent Board mobile readability and navigation'
            git push origin HEAD:main
          fi
