name: A-FA17R1 - Four Signal Ranked Start Sit Compact UI

# Supersedes the unrun A-FA16 Quick Picks (do NOT run A-FA16 afterward).
# Install PUBLIC UI ONLY; no subscriber rank/matchup data in this repository.
# Reads private same-week ranking and matchup files from existing browser IndexedDB,
# plus public Sleeper defensive-snap observations. Does not alter valuation logic.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview validates safely; Apply commits only the public interface.
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  decision-ui:
    name: Four-signal ranked Start Sit (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify required read-only data sources
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -s free-agent-board.html
          test -s assets/fa_start_sit_v1.js
          test -s assets/fa_matchup_private_v1.js
          test -s data/idp_weekly_2026_public.json
      - name: Install checksum-pinned, public UI only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,hashlib,json,zlib
          from pathlib import Path
          modules=json.loads('{"assets/fa_start_sit_decision_v2.css":{"payload":"","sha256":"0d690880fc4938c55756418a6acdf32e585d7f6b058a73cffca18b6314e9b98a"},"assets/fa_start_sit_decision_v2.js":{"payload":"","sha256":"89b0dc257e1377e22329692f465608de09cabf2a7f725dd4d13ad9c129ff9e20"}}')
          for rel, info in modules.items():
              target=Path(rel)
              content=zlib.decompress(base64.b64decode(info['payload']))
              assert hashlib.sha256(content).hexdigest()==info['sha256'], 'Source module checksum mismatch: '+rel
              target.parent.mkdir(parents=True,exist_ok=True)
              if target.exists():
                  assert target.read_bytes()==content, 'Existing implementation differs; fail closed: '+rel
              else: target.write_bytes(content)
              print('Verified',rel,len(content),'bytes')
          
          path=Path('free-agent-board.html')
          html=path.read_text('utf-8')
          assert html.count('</head>')==1 and html.count('</body>')==1,'Unsupported board HTML shape'
          assert 'FA_START_SIT_V1_SCRIPT' in html and 'FA_WOELLERT_MATCHUP_V1_SCRIPT' in html,'Missing existing Start/Sit/matchup integration'
          assert 'FA_QUICK_PICKS_V1_SCRIPT' not in html,'A-FA16 quick-picks already present. Avoid conflicting overlays.'
          assert 'faSsResults' in Path('assets/fa_start_sit_v1.js').read_text('utf-8'),'Native Start/Sit entrypoint changed'
          assert 'LOG_Private_Woellert_Matchups_v1' in Path('assets/fa_matchup_private_v1.js').read_text('utf-8'),'Private matchup storage contract changed'
          style='<!-- FA_DECISION_V2_STYLE --><link rel="stylesheet" href="assets/fa_start_sit_decision_v2.css?v=1">'
          script='<!-- FA_DECISION_V2_SCRIPT --><script src="assets/fa_start_sit_decision_v2.js?v=1" defer></script>'
          if style not in html:
              assert 'FA_DECISION_V2_STYLE' not in html,'Conflicting decision CSS marker'
              html=html.replace('</head>',style+'\n</head>')
          if script not in html:
              assert 'FA_DECISION_V2_SCRIPT' not in html,'Conflicting decision JS marker'
              html=html.replace('</body>',script+'\n</body>')
          assert html.count(style)==1 and html.count(script)==1,'Duplicate implementation loaders'
          assert html.index('FA_DECISION_V2_SCRIPT')>html.index('FA_WOELLERT_MATCHUP_V1_SCRIPT'),'Decision module must load after private matchup module'
          path.write_text(html,'utf-8')
          print('PASS: four-signal decision overlay installed; canonical models unchanged')
          PYCODE
      - name: Validate syntax, changes and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_start_sit_decision_v2.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          html=Path('free-agent-board.html').read_text('utf-8')
          js=Path('assets/fa_start_sit_decision_v2.js').read_text('utf-8')
          css=Path('assets/fa_start_sit_decision_v2.css').read_text('utf-8')
          assert html.count('FA_DECISION_V2_STYLE')==1
          assert html.count('FA_DECISION_V2_SCRIPT')==1
          assert 'fa_start_sit_decision_v2.js' in html
          assert 'LOG_Private_Woellert_Matchups_v1' in js
          assert 'LOG_Private_StartSit_Weekly_2026_v1' in js
          assert 'idp_weekly_2026_public.json' in js
          assert 'PAIRWISE_FOUR_SIGNAL_HEURISTIC_NOT_PROJECTED_POINTS' in js
          assert 'faDcEvidence' in css and 'fa-dc-player' in css
          assert 'FA_QUICK_PICKS_V1_SCRIPT' not in html
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in changed}
          allowed={'free-agent-board.html','assets/fa_start_sit_decision_v2.js','assets/fa_start_sit_decision_v2.css'}
          assert paths.issubset(allowed),f'Unexpected modified files: {paths-allowed}'
          print('PASS: matched IDs, same-week private data, selection ranking, and allowlisted edits')
          PYCODE
      - name: Preview (no writes)
        if: inputs.mode == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          echo 'PREVIEW passed. No file committed or pushed.'
          git status --short
          git diff --stat
      - name: Apply (UI files only)
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git add -- free-agent-board.html assets/fa_start_sit_decision_v2.js assets/fa_start_sit_decision_v2.css
          if git diff --cached --quiet; then
            echo 'Already installed. No new commit required.'
            exit 0
          fi
          python3 - <<'PYCODE'
          import subprocess
          allowed={'free-agent-board.html','assets/fa_start_sit_decision_v2.js','assets/fa_start_sit_decision_v2.css'}
          files=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert files and files.issubset(allowed),f'Unexpected staged files: {files-allowed}'
          print('Approved staged files:',sorted(files))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-FA17R1: compact four-signal ranked Start Sit decisions'
          git push origin HEAD:main
          echo 'Apply completed; verify GitHub Pages separately.'
