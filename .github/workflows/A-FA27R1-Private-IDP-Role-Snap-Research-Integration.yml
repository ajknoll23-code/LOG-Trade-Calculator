name: A-FA27R1 - Owner-Local IDP Role & Snap Evidence (Preview / Apply)
# Stage only generic browser-side import code. NO paid player CSV, JSON, or private rows are committed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first, then Apply after Preview is green'
        type: choice
        required: true
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  owner-local-role-evidence:
    name: Private W10 role evidence integration (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage pinned public-only module and FA25 role bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,zlib
          items = [
          ('assets/fa_role_intel_v1.js', 'b69ab4aef4957f9b4b4f91f1fde34b36ebed0036572664e465eb68262e97c6fe',
           ''),
          ('assets/fa_role_intel_v1.css', '37d7c444f5c7fd775e49654a4a7e6a919b6e064e8e0245f1bdaff722fe4610d0',
           ''),
          ('/tmp/fa27_patch.py', '1bda2adb97653638f283c19df5bbfd8e48d306104a48527f45dd5ec34f1f2a44',
           ''),
          ('/tmp/fa27_browser_qa.py', '3e851d4754d4e4d8d371b6a1e893d417fbfc599a61e58e99d8b6c17512c463ee',
           ''),
          ]
          for path,sha,b64 in items:
              raw=zlib.decompress(base64.b64decode(b64))
              assert hashlib.sha256(raw).hexdigest()==sha, 'FA27 staged source checksum mismatch: '+path
              dest=Path(path);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          print('FA27 staged generic source and synthetic tests; no subscriber records included.')
          PYCODE
          python3 /tmp/fa27_patch.py
      - name: Check JavaScript syntax, privacy policy, source completeness and write set
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_role_intel_v1.js
          node --check assets/fa_multisource_targets_v1.js
          python3 -m py_compile /tmp/fa27_patch.py /tmp/fa27_browser_qa.py
          python3 - <<'PYCODE'
          from pathlib import Path
          js=Path('assets/fa_role_intel_v1.js').read_text()
          fa=Path('assets/fa_multisource_targets_v1.js').read_text()
          html=Path('free-agent-board.html').read_text()
          assert 'LOG_IDP_ROLE27_READ' in js and 'LOG_IDP_ROLE27_READ' in fa
          assert "analysisWeek<11" in js or "analysisWeek<11" in js.replace(' ','')
          assert 'timelyRoleRise=activeWeek===11' in fa
          assert 'data-player-id="${safe(p.id)}"' in fa
          assert html.count('FA27_ROLE_INTEL_SCRIPT')==1 and html.count('FA27_ROLE_INTEL_STYLE')==1
          assert 'fetch(ROOT+path' in js and 'method:'POST'' not in js and 'XMLHttpRequest' not in js
          # Public assets must contain parsing logic only, never the private research pack.
          assert 'private_pack_blob' not in js and 'owner_private_source_payload' not in html
          print('FA27 privacy + week-scoping + HTML integrity PASS')
          PYCODE
          git add -N -- assets/fa_role_intel_v1.js assets/fa_role_intel_v1.css assets/fa_multisource_targets_v1.js free-agent-board.html
          git diff --name-only > /tmp/fa27_changes.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          allowed={'assets/fa_role_intel_v1.js','assets/fa_role_intel_v1.css','assets/fa_multisource_targets_v1.js','free-agent-board.html'}
          paths=set(Path('/tmp/fa27_changes.txt').read_text().splitlines())
          assert paths.issubset(allowed),'Unexpected write paths: '+repr(paths-allowed)
          assert all(not p.endswith(('.csv','.json')) for p in paths)
          print('FA27 allowed source-only diff:', ', '.join(sorted(paths)) or '(already deployed)')
          PYCODE
      - name: Install synthetic Chromium QA dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare synthetic browser runner
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test owner-local role integration without subscriber content
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/fa27_browser_qa.py
      - name: Preview only (zero production writes)
        if: ${{ inputs.mode == 'preview' }}
        run: |
          echo 'PASS: FA27 preview complete; no GitHub commit or private data upload.'
      - name: Apply verified browser-only research files
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/fa_role_intel_v1.js assets/fa_role_intel_v1.css assets/fa_multisource_targets_v1.js free-agent-board.html
          if git diff --cached --quiet; then
            echo 'Already deployed; no changes to apply.'
          else
            git commit -m 'FA27: integrate owner-local IDP snap, green-dot and alignment evidence'
            git push origin HEAD:main
          fi
          echo 'PASS: FA27 source only. No user-provided paid CSV or derived data in GitHub.'
