# QF3 V2: independent production gate for verified GREEN QF3 V1 duplicate-player review.
# DEFAULT preflight is read-only and NEVER modifies main.
# "promote" requires the exact typed owner confirmation in a SEPARATE run.
# Approved QF3 review: 9104d02f; reviewed index blob d831dd65; exact 30-line guard.
# No production write in preflight. Promotion requires separate explicit mode+confirmation.
# Upload ONLY this file to .github/workflows/QF3-v2.yml on main.
name: QF3 V2 - Duplicate Player Integrity Preflight and Explicit Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight is READ-ONLY; promote changes the live main index.html'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - promote
      confirmation:
        description: 'For promote ONLY: type PROMOTE_QF3_V1_TO_MAIN (blank for preflight)'
        required: false
        type: string
        default: ''

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF3_BASE: '1cf595c2efd86fa7bffa1c9df116148e8c000aaf'
  QF3_REVIEW_BRANCH: 'qf3-a3f01-v1-review-2026-10-10'
  QF3_REVIEW_SHA: '9104d02fb3ac5a0da052e944a992cd996dd5befe'
  QF3_ORIGINAL_INDEX_BLOB: 'a076f6c7192f685d464a1e3242f7d598d49c3a28'
  QF3_PATCHED_INDEX_BLOB: 'd831dd65efa1e68d2e69899a9736fce3a37c1db6'
  EXPECTED_MAIN_CHANGES: '.github/workflows/QF3-v2.yml'

jobs:
  qf3-production-preflight:
    name: Read-only check of exact reviewed QF3 candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout triggering main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing test dependency
        run: python3 -m pip install requests
      - name: Fail closed on missing approval, dirty checkout, or moving refs
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP: run on main'; exit 1; }
          [[ "${RELEASE_MODE}" == preflight || "${RELEASE_MODE}" == promote ]] || exit 1
          if [[ "${RELEASE_MODE}" == promote ]]; then
            [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF3_V1_TO_MAIN' ]] || {
              echo 'STOP: wrong owner approval phrase'; exit 1;
            }
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF3_REVIEW_BRANCH}:refs/remotes/origin/${QF3_REVIEW_BRANCH}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP: wrong checkout'; exit 1; }
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP: main moved'; exit 1; }
          [[ "$(git rev-parse origin/${QF3_REVIEW_BRANCH})" == "${QF3_REVIEW_SHA}" ]] || {
            echo 'STOP: approved candidate branch moved'; exit 1;
          }
          [[ "$(git rev-parse "${QF3_REVIEW_SHA}^")" == "${QF3_BASE}" ]] || {
            echo 'STOP: review commit is not direct child of pinned baseline'; exit 1;
          }
          [[ "$(git hash-object index.html)" == "${QF3_ORIGINAL_INDEX_BLOB}" ]] || {
            echo 'STOP: production index changed; do not overwrite'; exit 1;
          }
          [[ "$(git rev-parse "${QF3_REVIEW_SHA}:index.html")" == "${QF3_PATCHED_INDEX_BLOB}" ]] || {
            echo 'STOP: candidate index blob not audited one'; exit 1;
          }
          [[ "$(git diff --name-only "${QF3_BASE}" "${QF3_REVIEW_SHA}")" == 'index.html' ]] || {
            echo 'STOP: review contains files other than index.html'; exit 1;
          }
          [[ "$(git diff --name-only "${QF3_BASE}" HEAD)" == "${EXPECTED_MAIN_CHANGES}" ]] || {
            echo 'STOP: main changed since review (other than this workflow)'; exit 1;
          }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP: dirty checkout'; exit 1; }
          echo "PASS reviewed source, immutable model baseline, refs and approval check; mode=${RELEASE_MODE}"
      - name: Stage candidate only inside temporary Actions runner
        shell: bash
        run: |
          set -euo pipefail
          git show "${QF3_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "${QF3_PATCHED_INDEX_BLOB}" ]] || exit 1
          [[ "$(git diff --name-only)" == index.html ]] || {
            echo 'STOP: unexpected file changed'; git status --short; exit 1;
          }
          git diff --check
          echo 'PASS exact QF3 candidate staged locally; main is untouched'
      - name: Actual source identity behavior and JavaScript syntax tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          candidate = Path('index.html').read_text(encoding='utf-8')
          original = subprocess.check_output(['git','show','HEAD:index.html'], text=True)
          assert original != candidate
          assert candidate.count('QF3_A3_F01_DUPLICATE_PLAYER_GUARD_V1') == 1
          anchor = '/* QF3_A3_F01_DUPLICATE_PLAYER_GUARD_V1'
          end_anchor = '\n\nfunction addPickAsset(side, year, round, slot){'
          i = candidate.index(anchor)
          j = candidate.index(end_anchor,i)
          patched = candidate[i:j]
          assert original[:original.index('function addPlayerAsset(side, name, pos, age, role){')] == candidate[:i]
          # Original add-player segment was the only permitted change.
          o1 = original.index('function addPlayerAsset(side, name, pos, age, role){')
          o2 = original.index(end_anchor, o1)
          assert original[:o1] == candidate[:i]
          assert original[o2:] == candidate[j:]
          assert 'function tradePlayerIdentity' in patched and 'function tradeAlreadyHasPlayer' in patched
          assert 'function addPickAsset' not in patched
          # Entire inline-script syntax, not just the extracted function.
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', candidate, re.I | re.S)
          assert scripts
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf8') as f:
              f.write('\n'.join(scripts)); tempjs=f.name
          try: subprocess.run(['node','--check',tempjs],check=True)
          finally: Path(tempjs).unlink(missing_ok=True)
          def func(name):
              match = re.search(r'function '+re.escape(name)+r'\([^\n]*\)\{.*?\n\}',candidate,re.S)
              assert match, name
              return match.group()
          helpers = '\n'.join(func(n) for n in ['normalizeName','resolveExistingKey'])
          harness = r'''
          const assert = require('node:assert/strict');
          const ALIASES = {'j greenard':'jonathan greenard'};
          const ALIASES_REVERSE = {};
          const PLAYER_DB = {'myles garrett': {pos:'DL'}, 'bijan robinson': {pos:'RB'}, 'jonathan greenard': {pos:'DL'}};
          const PROD_MULT = {'myles garrett':0.8, 'bijan robinson':1.0};
          const state = {A:[], B:[]};
          const tags = {A:{textContent:'',setAttribute(k,v){this[k]=v}}, B:{textContent:'',setAttribute(k,v){this[k]=v}}};
          const verdict = {textContent:''};
          const document = {getElementById(id){return id==='matchTag-A' ? tags.A : id==='matchTag-B' ? tags.B : id==='verdictSub' ? verdict : null}};
          let uidSeq=0, renderCount=0, valuationCalls=0;
          function uid(){ return String(++uidSeq); }
          function render(){ renderCount++; }
          function playerValue(pos,age,role,name){valuationCalls++; const k=normalizeName(name);return k==='bijan robinson'?8295:k==='myles garrett'?5770:1234;}
          const total = s => state[s].reduce((v,a)=>v+a.value,0);
          assert.equal(addPlayerAsset('A','Bijan Robinson','RB',24,'Elite'),true);
          assert.equal(addPlayerAsset('B','Myles Garrett','DL',30,'Elite'),true);
          assert.equal(total('A'),8295);
          assert.equal(total('B'),5770);
          const before=JSON.stringify(state), calls=valuationCalls, renders=renderCount;
          for(const [side,name] of [['B','Myles Garrett'],['B','MYLES GARRETT'],['A','Myles. Garrett'],['A','Myles Garrett']]){
            assert.equal(addPlayerAsset(side,name,'DL',30,'Elite'),false);
            assert.equal(JSON.stringify(state),before,'no duplicate state mutation');
          }
          assert.equal(valuationCalls,calls,'no revaluation for rejected duplicates');
          assert.equal(renderCount,renders,'no rerender for rejected duplicates');
          assert.equal(total('B'),5770,'no inflated 11,540 duplicate verdict');
          assert.ok(total('A')>total('B'),'Bijan still wins once Myles duplicate is blocked');
          assert.match(tags.A.textContent,/Already in trade/);
          assert.equal(tags.A.role,'status');
          assert.match(verdict.textContent,/Already in trade/);
          assert.equal(addPlayerAsset('A','J Greenard','DL',29,'Starter'),true);
          assert.equal(addPlayerAsset('B','Jonathan Greenard','DL',29,'Starter'),false,'alias and canonical cannot coexist');
          assert.equal(state.A.length,2);
          assert.equal(addPlayerAsset('B','Myles Garrett','LB',30,'Starter'),true,'different position bucket is a different unresolved identity');
          assert.equal(addPlayerAsset('B','Other Player','DL',24,'Starter'),true,'independent player accepted');
          assert.equal(addPlayerAsset('B','Other Player','DL',28,'Depth'),false,'edited age/role cannot evade duplicate');
          assert.equal(addPlayerAsset('B','','QB',24,'Starter'),true,'anonymous synthetic player 1');
          assert.equal(addPlayerAsset('A','','QB',24,'Starter'),true,'anonymous synthetic player 2');
          state.A.push({type:'pick',name:'2027 Rd 1 (early)',value:6132});
          state.B.push({type:'pick',name:'2027 Rd 1 (early)',value:6132});
          assert.equal(state.A.filter(x=>x.type==='pick').length,1);
          assert.equal(state.B.filter(x=>x.type==='pick').length,1);
          assert.equal(addPlayerAsset('B','Bijan Robinson','RB',24,'Elite'),false,'cross-side duplicate blocked');
          state.B=state.B.filter(a=>a.type!=='player'||normalizeName(a.name)!=='myles garrett');
          assert.equal(addPlayerAsset('B','Myles Garrett','DL',30,'Elite'),true,'can readd after deleting original');
          '''
          harness += "\nconsole.log('PASS QF3: duplicates, aliases, both sides, repeat taps, roster/manual core, placeholders, and picks');\n"
          js = helpers + '\n' + patched + '\n' + harness
          with tempfile.NamedTemporaryFile('w',suffix='.cjs',delete=False,encoding='utf8') as f:
              f.write(js); testpath=f.name
          try: subprocess.run(['node',testpath],check=True)
          finally: Path(testpath).unlink(missing_ok=True)
          print('PASS complete JavaScript syntax and QF3 behavioral fixture')
          PY
      - name: Full repository and protected science regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/validation')
          import validate_idp_v1_final_deployment as v
          result = v.validate_deployment()
          assert result['actual_changed_entry_count'] == 320, result
          print('PASS frozen IDP approved 320-entry change count')
          PY
      - name: Verify no test mutated approved artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object index.html)" == "${QF3_PATCHED_INDEX_BLOB}" ]] || {
            echo 'STOP: index changed during validation'; exit 1;
          }
          [[ "$(git diff --name-only)" == 'index.html' ]] || {
            echo 'STOP: tests changed tracked files'; git status --short; exit 1;
          }
          git diff --check
          echo 'QF3 PRODUCTION PREFLIGHT GREEN; no push, no Pages deployment, no main change.'

  qf3-explicit-production-promotion:
    name: Deploy only on owner-confirmed promote run
    needs: qf3-production-preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout main revision approved by preflight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Recheck immutable refs, confirmation, and exact candidate before push
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == refs/heads/main ]] || exit 1
          [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF3_V1_TO_MAIN' ]] || exit 1
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF3_REVIEW_BRANCH}:refs/remotes/origin/${QF3_REVIEW_BRANCH}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || exit 1
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || {
            echo 'STOP: main advanced while preflight ran'; exit 1;
          }
          [[ "$(git rev-parse origin/${QF3_REVIEW_BRANCH})" == "${QF3_REVIEW_SHA}" ]] || exit 1
          [[ "$(git rev-parse "${QF3_REVIEW_SHA}^")" == "${QF3_BASE}" ]] || exit 1
          [[ "$(git hash-object index.html)" == "${QF3_ORIGINAL_INDEX_BLOB}" ]] || exit 1
          [[ "$(git rev-parse "${QF3_REVIEW_SHA}:index.html")" == "${QF3_PATCHED_INDEX_BLOB}" ]] || exit 1
          [[ "$(git diff --name-only "${QF3_BASE}" "${QF3_REVIEW_SHA}")" == 'index.html' ]] || exit 1
          [[ "$(git diff --name-only "${QF3_BASE}" HEAD)" == "${EXPECTED_MAIN_CHANGES}" ]] || exit 1
          [[ -z "$(git status --porcelain)" ]] || exit 1
          git show "${QF3_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "${QF3_PATCHED_INDEX_BLOB}" ]] || exit 1
          [[ "$(git diff --name-only)" == index.html ]] || exit 1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == index.html ]] || exit 1
          git diff --cached --check
          git commit -m 'QF3 v1: promote reviewed duplicate-player trade integrity guard'
          git push origin HEAD:refs/heads/main
          echo "QF3 PRODUCTION PROMOTION GREEN: $(git rev-parse HEAD)"
          echo 'Rollback source: original QF3 index blob a076f6c7192f685d464a1e3242f7d598d49c3a28'
