name: No-History Rookie V2 Phase 2 Prospect Prior

# Research-only historical calibration for a rookie / no-history prospect prior.
# This workflow does NOT change index.html, Production V2, Market Value,
# PROD_MULT_DATA, or any deployed player value.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  historical-prospect-prior:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Phase 2 self-test
        run: python3 research/no-history-v2/no_history_v2_phase2_prospect_prior.py --selftest

      - name: Build historical prospect-prior analysis
        run: python3 research/no-history-v2/no_history_v2_phase2_prospect_prior.py --write

      - name: Verify Phase 2 guardrails and outputs
        run: python3 research/no-history-v2/no_history_v2_phase2_prospect_prior.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/no-history-v2/no_history_v2_phase2_prospect_prior.json
          git add research/no-history-v2/no_history_v2_phase2_prospect_prior.md
          git diff --staged --quiet || git commit -m "Add No-History Rookie V2 Phase 2 prospect prior"
          git push
