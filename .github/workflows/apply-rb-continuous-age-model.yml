name: Apply RB Continuous Age Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test production patch
        run: python3 scripts/maintenance/apply_rb_continuous_age_model.py --selftest

      - name: Apply continuous RB age model
        run: python3 scripts/maintenance/apply_rb_continuous_age_model.py --apply

      - name: Test Sleeper data layer
        run: python3 scripts/sync/sync_sleeper.py --selftest

      - name: Test valuation snapshot port
        run: python3 scripts/validation/snapshot_values.py --selftest

      - name: Run full repository regression checks
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Show production diff summary
        run: |
          git status --short
          git diff --stat

      - name: Commit production deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            scripts/sync/sync_sleeper.py \
            scripts/validation/snapshot_values.py \
            scripts/validation/repo_regression_checks.py \
            data/league_rosters.json \
            data/my_roster.json \
            data/free_agents.json

          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi

          git commit -m "Deploy continuous RB age valuation"
          git push
