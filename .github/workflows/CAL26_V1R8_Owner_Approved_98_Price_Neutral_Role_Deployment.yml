name: CAL26 V1R8 - Owner Approved 98 Price Neutral Week6 Roles Production Release

'on':
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Default is preview; choose the explicit approval to deploy exactly 98 role labels on main.'
        type: choice
        required: true
        default: PREVIEW_ONLY_NO_PRODUCTION_WRITES
        options:
          - PREVIEW_ONLY_NO_PRODUCTION_WRITES
          - I_APPROVE_CAL26_V1R8_PRODUCTION_98_ROLE_ONLY

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASE_MODE: ${{ inputs.release_mode }}
  RUN_SOURCE: '39649972891'
  ARTIFACT_NAME: CAL26-V1R7R1-98-Role-Only-No-FV-Change-Release-Candidate-READ-ONLY
  RELEASE_PATH: model/releases/cal26-v1r8-role-v2-98-week6-fv-neutral-2026-10-21-v1/release.json

jobs:
  release-98-week6-roles:
    name: Verify 98 / 565 zero-FV role release; deploy only with explicit owner approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require canonical main branch and explicit preview or approval mode
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo '::error::Run from main only'; exit 1; }
          case "$RELEASE_MODE" in
            PREVIEW_ONLY_NO_PRODUCTION_WRITES|I_APPROVE_CAL26_V1R8_PRODUCTION_98_ROLE_ONLY) ;;
            *) echo '::error::Invalid release mode'; exit 1;;
          esac

      - name: Checkout current main - production contents will not change during preview
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up production FV check runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the pinned, verified, green V1R7R1 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r8-green-candidate" "$RUNNER_TEMP/cal26-v1r8-stage"
          gh run download "$RUN_SOURCE" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/cal26-v1r8-green-candidate"
          test -f "$RUNNER_TEMP/cal26-v1r8-green-candidate/CAL26_V1R7_Manifest.json"
          test -f "$RUNNER_TEMP/cal26-v1r8-green-candidate/CAL26_V1R7_98_Zero_FV_Role_Upgrade_Candidates.csv"
          test -f "$RUNNER_TEMP/cal26-v1r8-green-candidate/index.html"
          test -f "$RUNNER_TEMP/cal26-v1r8-green-candidate/free-agent-board.html"

      - name: Materialize exact 98-player release verifier
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r8_verify_and_stage.py" <<'PY_CAL26_V1R8'
          #!/usr/bin/env python3
          """CAL26 V1R8: exact 98-label-only candidate verification before explicit owner-authorized deployment."""
          from __future__ import annotations
          import argparse,csv,hashlib,json,re,sys
          from pathlib import Path

          SOURCE_RUN=39649972891
          ARTIFACT='CAL26-V1R7R1-98-Role-Only-No-FV-Change-Release-Candidate-READ-ONLY'
          RELEASE='cal26-v1r8-role-v2-98-week6-fv-neutral-2026-10-21-v1'


          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def check(c,label):
              if not c: raise AssertionError('CAL26_V1R8_'+str(label))
          def csvread(path):
              with Path(path).open(encoding='utf8',newline='') as f:return list(csv.DictReader(f))

          def patch_roles(source,updates,sync):
              start,end,region=sync._extract_const_object(source,'PLAYER_DB')
              for u in updates:
                  name,pos,old,new=[u[k] for k in ('player','position','live_role','candidate_role')]
                  check(old!=new and old in ROLES and new in ROLES,'BAD_ROLE_'+name)
                  pat=(r"(?P<prefix>'"+re.escape(name)+r"'\s*:\s*\{\s*pos:'"+
                       re.escape(pos)+r"'\s*,\s*age:\d+\s*,\s*role:')"+re.escape(old)+r"(?P<suffix>')")
                  region,n=re.subn(pat,lambda m:m.group('prefix')+new+m.group('suffix'),region)
                  check(n==1,'EXACTLY_ONE_ROLE_EDIT_REQUIRED_'+name)
              return source[:start]+region+source[end:]

          ROLES=('Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite')

          def verify(repo,artifact,out):
              repo,artifact,out=Path(repo),Path(artifact),Path(out)
              out.mkdir(parents=True,exist_ok=True)
              index=repo/'index.html';board=repo/'free-agent-board.html'
              cand_index=artifact/'index.html';cand_board=artifact/'free-agent-board.html'
              manifest_path=artifact/'CAL26_V1R7_Manifest.json'
              candidates_path=artifact/'CAL26_V1R7_98_Zero_FV_Role_Upgrade_Candidates.csv'
              for p in (index,board,cand_index,cand_board,manifest_path,candidates_path):
                  check(p.is_file(),'SOURCE_MISSING_'+p.name)
              man=json.loads(manifest_path.read_text())
              check(man['status']=='PASS_CAL26_V1R7_98_ZERO_FV_ROLE_CANDIDATE_READ_ONLY','V1R7R1_NOT_GREEN')
              check(man['green_source_v1r6_run']==39645378760 and man['source_week']==6,'WRONG_V1R6_SOURCE')
              check(man['roles_changed']==98 and man['prices_changed']==0 and man['source_565']==565,'NOT_98_FV_NEUTRAL')
              check(man['accepted_controls_count']==18 and man['accepted_controls_prices_changed']==0,'ACCEPTED_PRICE_CONTROL_DRIFT')
              check(man['reviewed_cal26_proposals_count']==80 and man['reviewed_cal26_proposals_changed']==0,'REVIEWED_PRICE_CONTROL_DRIFT')
              check(man['price_changing_stable_candidates_held']==12,'12_PRICE_MOVERS_NOT_HELD')
              check(man['candidate_free_agent_sync_parity'] is True and man['candidate_fa_specific_prod_factors_unchanged'] is True,'BOARD_SYNC_NOT_VALIDATED')
              check(man['production_files_changed'] is False and man['production_release_authorized'] is False,'SOURCE_ALREADY_DEPLOYED')
              check(sha(index)==man['input_index_sha256'],'CANONICAL_INDEX_CHANGED_SINCE_GREEN')
              check(sha(board)==man['input_board_sha256'],'CANONICAL_BOARD_CHANGED_SINCE_GREEN')
              check(sha(cand_index)==man['candidate_index_sha256'],'CANDIDATE_INDEX_SHA_DRIFT')
              check(sha(cand_board)==man['candidate_board_sha256'],'CANDIDATE_BOARD_SHA_DRIFT')
              updates=csvread(candidates_path)
              check(len(updates)==98 and len({r['player'] for r in updates})==98,'MISSING_OR_DUPLICATE_ROLE_EDIT')
              check(sum(r['protect_accepted_fv']=='True' for r in updates)==6,'6_OWNER_CONTROLS_NOT_PRESERVED')
              for r in updates:
                  check(r['position'] in ('QB','RB','WR','TE','DL','LB','DB'),'UNEXPECTED_POSITION')
                  check(int(r['raw_role_only_fv_delta'])==0,'NONZERO_FV_IMPACT_'+r['player'])
                  check(r['week4_model_tier']==r['week6_model_tier']==r['candidate_role'],'UNSTABLE_WEEK4_6_ROLE_'+r['player'])
                  check(int(r['week6_prior_active_games'])>=3,'INSUFFICIENT_WEEK6_GAMES_'+r['player'])
                  check(1 <= ROLES.index(r['candidate_role'])-ROLES.index(r['live_role']) <= 2,'UNEXPECTED_ROLE_JUMP_'+r['player'])
              sys.path[:0]=[str(repo/'scripts'/'validation'),str(repo/'scripts'/'sync')]
              import snapshot_values as sv
              import sync_free_agent_valuation as sync
              live=index.read_text(encoding='utf8');liveboard=board.read_text(encoding='utf8')
              proposed=cand_index.read_text(encoding='utf8');proposedboard=cand_board.read_text(encoding='utf8')
              rebuilt=patch_roles(live,updates,sync)
              check(rebuilt==proposed,'CANDIDATE_INDEX_IS_NOT_EXACT_98_ROLE_PATCH')
              check(sync.render_synced(proposed,liveboard)==proposedboard,'BOARD_IS_NOT_EXACT_CANONICAL_SYNC')
              check(all(sync.parity_regions(proposed,proposedboard).values()),'BOARD_PARITY_FAILED')
              check(sync.render_synced(live,liveboard)==liveboard,'EXISTING_BOARD_NOT_IN_SYNC')
              check(sync._extract_const_object(liveboard,'FA_PROD_MULT_DATA')[2]==
                    sync._extract_const_object(proposedboard,'FA_PROD_MULT_DATA')[2], 'FA_SPECIFIC_FACTORS_WERE_MODIFIED')
              before=sv.compute_all_values(sv.load_from_html(index))
              after=sv.compute_all_values(sv.load_from_html(cand_index))
              check(len(before)==len(after)==565 and set(before)==set(after),'565_FV_UNIVERSE_DRIFT')
              expected={r['player']:r['candidate_role'] for r in updates}
              role_diffs=[]
              for key,old in before.items():
                  new=after[key]
                  check(old['value']==new['value'],'FV_CHANGED_'+key)
                  check(old['pos']==new['pos'] and old['age']==new['age'],'PLAYER_FIELDS_CHANGED_'+key)
                  check(new['role']==expected.get(key,old['role']),'UNAUTHORIZED_ROLE_CHANGE_'+key)
                  if old['role']!=new['role']:role_diffs.append(key)
              check(len(role_diffs)==98 and set(role_diffs)==set(expected),'98_ROLE_ONLY_COUNT_DRIFT')
              # Staging only -- caller chooses if/when to perform Git commit.
              (out/'index.html').write_bytes(cand_index.read_bytes())
              (out/'free-agent-board.html').write_bytes(cand_board.read_bytes())
              release={
                'release_id':RELEASE,'status':'PASS_CAL26_V1R8_OWNER_APPROVAL_READY',
                'source_workflow_run_id':SOURCE_RUN,
                'source_artifact_name':ARTIFACT,
                'source_manifest_sha256':sha(manifest_path),
                'source_98_roles_csv_sha256':sha(candidates_path),
                'source_week':6,'affected_role_count':98,
                'live_player_count':565,'live_fv_change_count':0,
                'accepted_price_control_count':18,'accepted_price_control_fv_changes':0,
                'legacy_cal26_reviewed_proposals_retained':80,
                'other_role_changes':0,'new_roles_for_unmatched_players':0,
                'deferred_price_moving_stable_candidates':12,
                'model_retrained':False,'future_price_sensitivity_note':'FV-neutral in the 2026-10-21 live pricing snapshot; future multipliers or updates may change this.',
                'before_index_sha256':sha(index),'after_index_sha256':sha(cand_index),
                'before_board_sha256':sha(board),'after_board_sha256':sha(cand_board),
                'production_authorization':'REQUIRES_EXPLICIT_DISPATCH_APPROVAL',
              }
              (out/'release.json').write_text(json.dumps(release,indent=2,sort_keys=True)+'\n')
              (out/'CAL26_V1R8_98_Role_Changes.csv').write_bytes(candidates_path.read_bytes())
              print(json.dumps(release,indent=2,sort_keys=True))


          def selftest():
              class MockSync:
                  @staticmethod
                  def _extract_const_object(txt,name):
                      k=txt.find('const '+name+' = {');check(k>=0,'MOCK_EXTRACT')
                      end=txt.index('};',k)+2
                      return k,end,txt[k:end]
              base="let x=1;\nconst PLAYER_DB = {'cj stroud':{pos:'QB',age:24,role:'Rotational'},'a':{pos:'RB',age:21,role:'Depth'}};\nlet y=1;"
              rec={'player':'cj stroud','position':'QB','live_role':'Rotational','candidate_role':'Every-Down'}
              check("role:'Every-Down'" in patch_roles(base,[rec],MockSync),'BASIC_PATCH')
              try:
                  patch_roles(base,[dict(rec,live_role='Elite')],MockSync)
                  raise AssertionError('Negative test unexpectedly accepted bad source')
              except AssertionError as err:
                  check('EXACTLY_ONE_ROLE_EDIT_REQUIRED' in str(err),'MISSING_KEY_NEGATIVE_TEST')
              try:
                  patch_roles(base,[dict(rec,candidate_role='Untrusted')],MockSync)
                  raise AssertionError('Negative test unexpectedly accepted unknown tier')
              except AssertionError as err:
                  check('BAD_ROLE' in str(err),'INVALID_ROLE_NEGATIVE_TEST')
              print('PASS: CAL26 V1R8 98 role patch + missing key and tier negative tests')

          if __name__=='__main__':
              parser=argparse.ArgumentParser()
              parser.add_argument('--repo',default='.')
              parser.add_argument('--artifact')
              parser.add_argument('--out')
              parser.add_argument('--selftest',action='store_true')
              args=parser.parse_args()
              if args.selftest:selftest()
              else:
                  check(bool(args.artifact and args.out),'--artifact and --out required')
                  verify(args.repo,args.artifact,args.out)
          PY_CAL26_V1R8
          python3 - <<'PY_SOURCE_COMPILE'
          import ast,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'cal26_v1r8_verify_and_stage.py'
          ast.parse(p.read_text())
          print('PASS: Python source compilation')
          PY_SOURCE_COMPILE
          python3 "$RUNNER_TEMP/cal26_v1r8_verify_and_stage.py" --selftest

      - name: Validate exact source candidates, 565 live prices, 18 price controls and output receipt
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo '::error::Working tree not clean before verify'; exit 1; }
          python3 "$RUNNER_TEMP/cal26_v1r8_verify_and_stage.py" \
            --repo . \
            --artifact "$RUNNER_TEMP/cal26-v1r8-green-candidate" \
            --out "$RUNNER_TEMP/cal26-v1r8-stage"
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo '::error::Verifier wrote to production'; exit 1; }
          echo 'PASS: production is untouched; candidate is ready for explicit approved deployment.'

      - name: Summarize release intent and actual preview status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## CAL26 V1R8 — 98 fv-neutral role corrections'
            echo ''
            echo "Mode: $RELEASE_MODE"
            echo 'Recomputed source and candidate FV for all 565 players: no changes.'
            echo 'Changes only 98 Week6 role labels; 18 accepted-price controls remain unchanged.'
            echo ''
            if [[ "$RELEASE_MODE" == 'PREVIEW_ONLY_NO_PRODUCTION_WRITES' ]]; then
              echo '**Preview only. No production writes authorized or performed.**'
            else
              echo '**Explicit owner-approved production release requested. Commit follows verification.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit exact production release - ONLY when owner selected approval
        if: ${{ inputs.release_mode == 'I_APPROVE_CAL26_V1R8_PRODUCTION_98_ROLE_ONLY' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_MODE" = 'I_APPROVE_CAL26_V1R8_PRODUCTION_98_ROLE_ONLY'
          test "$GITHUB_REF" = 'refs/heads/main'
          test ! -e "$RELEASE_PATH" || { echo '::error::Release receipt exists; refusing repeat deployment'; exit 1; }
          cp "$RUNNER_TEMP/cal26-v1r8-stage/index.html" index.html
          cp "$RUNNER_TEMP/cal26-v1r8-stage/free-agent-board.html" free-agent-board.html
          mkdir -p "$(dirname "$RELEASE_PATH")"
          cp "$RUNNER_TEMP/cal26-v1r8-stage/release.json" "$RELEASE_PATH"
          git diff --check
          git add -- index.html free-agent-board.html "$RELEASE_PATH"
          git diff --cached --check
          python3 - <<'PY_CHANGED_PATHS'
          import os,subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'index.html','free-agent-board.html',os.environ['RELEASE_PATH']}
          assert actual==expected,(actual,expected)
          print('PASS: exactly 2 canonical production HTML files plus release receipt')
          PY_CHANGED_PATHS
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'CAL26 V1R8: release 98 FV-neutral Week6 player-role corrections'
          # Standard push rejects concurrent main changes. No rebase or force push.
          git push origin HEAD:main
          echo 'PRODUCTION DEPLOYED: 98 role corrections, 0 FV changes at release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact verified stage, receipt, and 98-player audit (both modes)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CAL26-V1R8-98-FV-Neutral-Roles-Owner-Review-or-Release
          path: ${{ runner.temp }}/cal26-v1r8-stage/
          if-no-files-found: warn
          retention-days: 30
