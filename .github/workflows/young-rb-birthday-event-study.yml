name: Young RB Birthday Event Study

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run self-test
        run: python3 research/age-calibration/young_rb_birthday_event_study.py --selftest

      - name: Run birthday event study
        run: python3 research/age-calibration/young_rb_birthday_event_study.py

      - name: Show report
        run: cat research/age-calibration/young_rb_birthday_event_study.md

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/age-calibration/young_rb_birthday_event_study.json \
            research/age-calibration/young_rb_birthday_event_study.md

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Study young RB market movement around birthdays"
          git push
