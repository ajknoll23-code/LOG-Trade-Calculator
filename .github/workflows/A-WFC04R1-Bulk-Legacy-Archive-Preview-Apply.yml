              'A-FA13R1-LOG-DB-DL-Start-Sit-Fix.yml': (4, 'ddc58cde16cfcb82aaebf91b0c711c5825fceceec231d46749a6aa6076bbd095'),
              'A-FA17R1-StartSit-FourSignal-Compact.yml': (4, 'e46518b9290829dd27c2b8641fc9f69985f8cc45d47b36ffc12557903c391375'),
              'A-NL11R1.yml': (5, 'ffbb87460d7e70c798a8b4e8460f14ff29760a4d7ba95f36ec6d2b7ac5a3cffb'),
