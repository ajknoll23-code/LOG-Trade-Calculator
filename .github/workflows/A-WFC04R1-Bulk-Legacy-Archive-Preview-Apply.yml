# WFC04R1: Bulk archive review of exactly 63 hand-curated, single-use workflow files.
# Based on WFC01 and WFC02 audit data. Frozen studies, active weekly pipelines and publication workflows excluded.
# Default preview leaves GitHub unchanged. Apply requires SHA/digest pins and existing LOG_WORKFLOW_WRITE_TOKEN.
name: '01 | DATA & REFRESH | WFC04R1 Bulk Legacy Workflow Archive (Preview / Apply)'
run-name: 'WFC04R1 ${{ inputs.mode }} - 63 legacy workflow candidates'
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run preview first; apply only after reviewing the exact report and pins.'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
      approved_commit_sha:
        description: 'Apply only: exact git HEAD from green preview'
        type: string
        required: false
      approved_manifest_sha256:
        description: 'Apply only: SHA256 digest from green preview'
        type: string
        required: false
      approval_phrase:
        description: 'Apply only: ARCHIVE REVIEWED LEGACY BATCH'
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  bulk_archive:
    name: 'Preview 63 or archive only verified reviewed files'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require workflow-scoped PAT if applying
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.LOG_WORKFLOW_WRITE_TOKEN }}
        run: |
          test -n "$WRITE_TOKEN" || { echo '::error::Missing secret LOG_WORKFLOW_WRITE_TOKEN'; exit 1; }
      - name: Check out main with approved credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ inputs.mode == 'apply' && secrets.LOG_WORKFLOW_WRITE_TOKEN || github.token }}
      - name: Install pinned YAML reader
        run: python3 -m pip install --quiet PyYAML==6.0.2
      - name: Materialize fixed-roster archive engine
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/wfc04_engine.py" <<'PY_WFC04_R1'
          #!/usr/bin/env python3
          """WFC04R1 bulk archive preview/apply. Candidate roster is exact and fixed.
          Only byte-identical, manually triggered workflows with zero tracked live references can move.
          No data or history deletion. Requires pinned SHA, manifest SHA and scoped workflow PAT on apply.
          """
          from __future__ import annotations
          import csv, datetime as dt, hashlib, json, os, re, subprocess
          from pathlib import Path
          import yaml
          
          REPO = 'ajknoll23-code/LOG-Trade-Calculator'
          ROOT = Path('.github/workflows')
          ARCHIVE = Path('.github/workflow-archive/cleanup-workflows/WFC04-bulk-wave1-2026-11-14')
          RECEIPT = Path('.github/workflow-archive/cleanup-manifests/WFC04-bulk-wave1-2026-11-14-receipt.json')
          SELF = '.github/workflows/A-WFC04R1-Bulk-Legacy-Archive-Preview-Apply.yml'
          APPROVAL = 'ARCHIVE REVIEWED LEGACY BATCH'
          MODE = os.getenv('WFC04_MODE','preview').strip().lower()
          OUT = Path(os.getenv('WFC04_OUTPUT','/tmp/wfc04-bulk-results'))
          # source filename: (group, exact byte SHA256 from WFC01's green 280-file audit)
          TARGETS = {
              'A-FA01R1(1).yml': (4, 'aaafbc55ff934ce754135e62f27753730412158aee6b9e66557dd904c05ba11e'),
              'A-FA02R1-Sleeper-Repair.yml': (4, '6df6b33218fd5c72d4ba7d741482196f0bf854404422b799e03c75e39aec6476'),
              'A-FA03R1-IDP-Waiver-Intelligence.yml': (4, 'b3646f721fddf8fa47b7ab95bc071cffdd624cd0ad24d14e55e50a6cfcb3be8b'),
              'A-FA04R1.yml': (4, '631bafd2e7eb0282dc5e1966653add8da7f1222eb9ddfdf03958c6f000babfc5'),
              'A-FA04R2-CSV-Line-Ending-Fix-v2.yml': (4, 'e1e335f0fb71ab4f13fa227ea4b5e0a95cbde3acba6ce9880e8c01f182462f42'),
              'A-FA05R1-IDP-Dashboard-Preview-v2.yml': (4, '138ed1339f93aa472d5ab505d4c56b7a48d89e7db0e5dda431918611e9cedcf9'),
              'A-FA05R1.yml': (4, '138ed1339f93aa472d5ab505d4c56b7a48d89e7db0e5dda431918611e9cedcf9'),
