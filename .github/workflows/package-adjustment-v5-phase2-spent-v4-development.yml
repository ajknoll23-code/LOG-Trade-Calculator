name: Package Adjustment V5 - Phase 2 Spent V4 Development

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  develop-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen development dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "scipy==1.16.2" "requests==2.34.2"

      - name: Guard immutable V5 development state
        shell: bash
        run: |
          set -euo pipefail
          V5="research/package-adjustment-v5-liquid-picks"
          V4="research/package-adjustment-v4-elite-fragmentation"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V5/package_adjustment_v5_phase2_develop.py")" = "8d731f3e408192316aaf4c3ae35dfa4bd8f724a0"
          test "$(git hash-object "$V5/phase1_structural_preregistration.json")" = "97f4da97d35594c658ce7252fb5a0bf0e7a2a188"
          test "$(git hash-object "$V5/phase1a_predevelopment_clarification.json")" = "e7ba03b32256137a7c3f9bd3a0131ebe0b99a687"
          test "$(git hash-object "$V5/phase1b_predevelopment_architecture_correction.json")" = "0bd740f1ca877d3dd477d4880f893f96922d2500"

          test "$(git hash-object "$V4/phase3b_confirmation_catalog.json")" = "0c974cd5d6a66c410f91775ba34fa068cc79f408"
          test "$(git hash-object "$V4/phase3_exact_600_frozen.json")" = "91d5d563aaf22382c7b740ca2d1caa4be9037f36"
          test "$(git hash-object "$V4/phase3_exact_600_freeze_manifest.json")" = "204bb2e8523ef1f388b740f8c942bc5d54bc76c4"
          test "$(git hash-object "$V4/phase3_confirmation_evaluation.json")" = "dc293d2e21b1f15e32ded441d64e29e544774251"
          test "$(git hash-object "$V4/package_adjustment_v4_research_closeout.json")" = "34ee736d4f0a47db2afaa14cc2b0b95cc428a874"

          test ! -e "$V5/phase2_development_results.json"
          test ! -e "$V5/phase2_manifest.json"
          test ! -e "$V5/phase2_development.md"
          test ! -e "$V5/frozen_candidate.json"
          test ! -e "$V5/phase2_closeout.json"

      - name: Synthetic evaluator self-test
        run: python3 research/package-adjustment-v5-liquid-picks/package_adjustment_v5_phase2_develop.py --selftest

      - name: Outcome-unread invariant preflight
        run: python3 research/package-adjustment-v5-liquid-picks/package_adjustment_v5_phase2_develop.py --preflight

      - name: Repository regressions before spent-evidence development
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 before development
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Run one-time V5 Phase 2 development
        run: python3 research/package-adjustment-v5-liquid-picks/package_adjustment_v5_phase2_develop.py --develop

      - name: Snapshot first Phase 2 result
        shell: bash
        run: |
          set -euo pipefail
          V5="research/package-adjustment-v5-liquid-picks"
          SNAP="/tmp/package-adjustment-v5-phase2-first-result"
          mkdir -p "$SNAP"

          cp "$V5/phase2_development_results.json" "$SNAP/"
          cp "$V5/phase2_manifest.json" "$SNAP/"
          cp "$V5/phase2_development.md" "$SNAP/"

          if test -e "$V5/frozen_candidate.json"; then
            cp "$V5/frozen_candidate.json" "$SNAP/"
          else
            cp "$V5/phase2_closeout.json" "$SNAP/"
          fi

          sha256sum "$SNAP"/* > "$SNAP/SHA256SUMS.txt"
          echo "PASS: first V5 Phase 2 result snapshotted."

      - name: Preserve first Phase 2 result artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v5-phase2-first-result-${{ github.run_id }}
          path: /tmp/package-adjustment-v5-phase2-first-result/
          if-no-files-found: error
          retention-days: 90

      - name: Verify Phase 2 scientific semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v5-liquid-picks")
          result = json.loads((d / "phase2_development_results.json").read_text())
          manifest = json.loads((d / "phase2_manifest.json").read_text())

          allowed = {
              "PASS_V5_PHASE2_FAMILY_FROZEN_FOR_FRESH_CONFIRMATION",
              "CLOSE_V5_PHASE2_NO_CANDIDATE",
          }
          assert result["status"] in allowed
          assert manifest["development_status"] == result["status"]

          assert result["one_time_spent_v4_development_consumed"] is True
          assert result["production_change_authorized"] is False
          assert result["evidence_role"]["may_count_as_v5_fresh_confirmation"] is False
          assert result["control_reproduction"]["raw_control"]["reproduced"] is True
          assert result["control_reproduction"]["v4_s75_reference"]["reproduced"] is True
          assert result["implementation"]["candidate_parameter_tuning_performed"] is False
          assert result["implementation"]["candidate_grid_expanded_after_outcomes"] is False
          assert len(result["candidate_results"]) == 7

          for cid, row in result["candidate_results"].items():
              g = row["development_nomination_gates"]
              assert g["minimum_improvement_vs_raw_control"] == 0.005
              assert g["maximum_overall_log_loss_increase_vs_v4_s75"] == 0.005
              assert g["minimum_positive_folds_vs_raw"] == 3
              assert g["maximum_topology_x_asset_mix_regression_vs_raw"] == 0.02
              assert g["three_v_three_includes_picks_regression_limit"] == 0.02
              assert g["players_only_structural_equivalence_tolerance"] == 1e-12

          frozen = result["frozen_confirmation_family_ids"]
          assert len(frozen) <= 2

          if result["status"] == "PASS_V5_PHASE2_FAMILY_FROZEN_FOR_FRESH_CONFIRMATION":
              assert len(frozen) in (1, 2)
              f = json.loads((d / "frozen_candidate.json").read_text())
              assert f["status"] == "FROZEN_V5_CONFIRMATION_FAMILY"
              assert f["candidate_family_ids"] == frozen
              assert f["development_evidence_may_not_confirm_v5"] is True
              assert not (d / "phase2_closeout.json").exists()
          else:
              assert frozen == []
              c = json.loads((d / "phase2_closeout.json").read_text())
              assert c["fresh_v5_voting_authorized"] is False
              assert not (d / "frozen_candidate.json").exists()

          print("PASS: V5 Phase 2 obeys frozen development and evidence-boundary rules.")
          print("V5_PHASE2_STATUS=" + result["status"])
          print("V5_PHASE2_FROZEN_IDS=" + ",".join(frozen))
          PY

      - name: Repository regressions after development
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after development
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed V5 Phase 2 workflow
        run: git rm .github/workflows/package-adjustment-v5-phase2-spent-v4-development.yml

      - name: Stage exact Phase 2 scope
        shell: bash
        run: |
          set -euo pipefail
          V5="research/package-adjustment-v5-liquid-picks"

          git add \
            "$V5/phase2_development_results.json" \
            "$V5/phase2_manifest.json" \
            "$V5/phase2_development.md"

          if test -e "$V5/frozen_candidate.json"; then
            git add "$V5/frozen_candidate.json"
          else
            git add "$V5/phase2_closeout.json"
          fi

          git diff --cached --check

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          d = Path("research/package-adjustment-v5-liquid-picks")
          result = json.loads((d / "phase2_development_results.json").read_text())

          expected = {
              "research/package-adjustment-v5-liquid-picks/phase2_development_results.json",
              "research/package-adjustment-v5-liquid-picks/phase2_manifest.json",
              "research/package-adjustment-v5-liquid-picks/phase2_development.md",
              ".github/workflows/package-adjustment-v5-phase2-spent-v4-development.yml",
          }

          if result["status"] == "PASS_V5_PHASE2_FAMILY_FROZEN_FOR_FRESH_CONFIRMATION":
              expected.add(
                  "research/package-adjustment-v5-liquid-picks/frozen_candidate.json"
              )
          else:
              expected.add(
                  "research/package-adjustment-v5-liquid-picks/phase2_closeout.json"
              )

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise RuntimeError(
                  f"Unexpected V5 Phase 2 scope: {sorted(changed)}"
              )

          print("PASS: exact V5 Phase 2 result/cleanup scope staged.")
          PY

      - name: Commit immutable V5 Phase 2 result
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Develop Package Adjustment V5 against spent V4 evidence"
          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-v5-liquid-picks/phase1b_predevelopment_architecture_correction.json)" = "0bd740f1ca877d3dd477d4880f893f96922d2500"
          test "$(git hash-object research/package-adjustment-v4-elite-fragmentation/phase3_exact_600_frozen.json)" = "91d5d563aaf22382c7b740ca2d1caa4be9037f36"
          test ! -e .github/workflows/package-adjustment-v5-phase2-spent-v4-development.yml

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin main

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v5-liquid-picks")
          result = json.loads((d / "phase2_development_results.json").read_text())

          print("V5_PHASE2_STATUS=" + result["status"])
          print(
              "V5_PHASE2_PASSING_COUNT="
              + str(len(result["candidates_passing_all_development_nomination_gates"]))
          )
          print(
              "V5_PHASE2_FROZEN_IDS="
              + ",".join(result["frozen_confirmation_family_ids"])
          )
          PY

          git log --oneline -1
