<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Agent Board — Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0F17;
    --panel: #141A26;
    --panel-alt: #1C2434;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --text: #EDEFF3;
    --text-muted: #8A93A8;
    --text-dim: #565F75;
    --accent: #4F8DFF;
    --good: #3FCB7C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:20px 16px 56px; }
  header{ padding:4px 2px 18px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .privacy-note{
    background:rgba(79,141,255,0.08);
    border:1px solid rgba(79,141,255,0.3);
    border-radius:8px;
    padding:10px 12px;
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:16px;
    font-family:'IBM Plex Mono',monospace;
  }
  h1{ font-size:24px; margin:0 0 4px; font-weight:700; }
  header p{ color:var(--text-muted); font-size:13px; margin:0; }
  .status{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin-top:10px; }
  .status.ok{ color:var(--good); }
  .status.fail{ color:#E0645A; }

  .controls{ display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
  .toggle-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:0.05em; padding:7px 12px; border-radius:7px; cursor:pointer;
    background:var(--panel-alt); border:1px solid var(--line-strong); color:var(--text-muted);
  }
  .toggle-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  details{ margin-top:10px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
  summary{ cursor:pointer; padding:14px 16px; font-family:'IBM Plex Mono',monospace; font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); }
  .body-wrap{ padding:0 12px 12px; }

  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel-alt); border:1px solid var(--line); border-radius:7px;
    padding:9px 11px; margin-bottom:6px;
  }
  .row.has-data{ border-left:3px solid var(--good); }
  .row-info{ min-width:0; }
  .row-title{ font-size:13.5px; font-weight:600; }
  .row-meta{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:2px; }
  .row-meta .tag-data{ color:var(--good); }
  .row-meta .tag-est{ color:var(--text-dim); }
  .row-val{ font-family:'IBM Plex Mono',monospace; font-size:14px; flex-shrink:0; }
  .empty{ padding:14px 4px; color:var(--text-dim); font-size:13px; font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Free Agent Board</h1>
    <p>Value engine identical to the trade calculator — checks every free agent against the same production data and formulas.</p>
    <div class="status" id="syncStatus">Loading free agent data…</div>
  </header>

  <div class="privacy-note">🔒 Private tool — kept local, never hosted or shared. Nothing here is visible to anyone else in the league.</div>

  <div class="controls">
    <button class="toggle-btn active" id="dataOnlyBtn" onclick="setDataOnly(true)">Real data only</button>
    <button class="toggle-btn" id="allBtn" onclick="setDataOnly(false)">Show everyone</button>
  </div>

  <div id="boardWrap"></div>
</div>

<script>
/* CANONICAL VALUATION SYNC — 2026-08-28
   The valuation engine below is generated from index.html by
   scripts/sync/sync_free_agent_valuation.py. Do not hand-edit POSITION_WEIGHT,
   AGE_CURVE, PROD_MULT_DATA, productionMultiplier(), ageMultiplier(),
   playerValue(), PLAYER_DB, ALIASES, or normalizeName in this file.

   FA_PROD_MULT_DATA remains intentionally free-agent-specific because those
   players are outside the main calculator's curated live PROD_MULT table. Its
   source/methodology is audited separately; it is not permission for the core
   valuation engine to drift. CI checks exact source parity plus runtime value
   parity on canonical and synthetic test populations. */
const POSITION_WEIGHT = { QB:1.30, RB:0.89, WR:1.00, TE:0.82, DL:0.93, LB:1.12, DB:0.87, K:0.35 };
/* RB weight benchmarked 2026-08-13, real KTC Superflex data, same
   methodology as QB/TE. Flagged as a "bonus finding, not acted on" during
   the original QB pass and left unresolved for a while — this closes it
   out. Same pattern QB showed: RB1 vs WR1 (Bijan Robinson vs Ja'Marr
   Chase) is near parity (1.00x) at the very top, which would wrongly
   suggest leaving RB alone if that's the only point checked. Two lower
   anchors tell a consistent, different story: RB16/WR16 (Kyren Williams/
   Nico Collins) = 0.885x, RB32/WR36 (Jaylen Warren/Michael Wilson,
   replacement level — matches this tool's own baseline depth) = 0.893x.
   Both land within a point of each other despite being pulled from very
   different points in each position's depth chart — real convergence, not
   noise. Old weight (1.25) was pricing RB meaningfully ABOVE WR; real
   market says the opposite, by close to the same margin QB was off by,
   just in the other direction. This is very likely why RBs dominated the
   very top of the whole player pool before this fix (Bijan, Gibbs, Taylor,
   Achane, Cook were the first 5 spots overall) — not because they're
   wrong to be great, but because the position itself was overweighted. */

/* TE weight benchmarked 2026-08-13 against real KTC Superflex market data,
   same methodology as QB. Two independent checks agreed closely: TE15/WR36
   at replacement level = 0.817, TE1/WR1 at the very top of the position =
   0.832 (Brock Bowers/Ja'Marr Chase). Old weight (0.95) was ~16% too high —
   this was flagged first by the baseline-ratio proxy (~0.85 implied) and
   confirmed, with a bigger gap, once checked against the real market. */

/* LB peakEnd/floor benchmarked 2026-08-13 against multiple independent
   sources (Mile High Huddle/SI "Performance Value" age study, fantasysixpack
   IDP aging research, general defensive aging literature). Consensus: LBs
   peak at 26, decline SLOWLY through 29 (still near-peak production), then
   decline RAPIDLY after 29 — not the steady decline starting at 28 this
   curve previously assumed. Extending peakEnd from 27->29 while keeping the
   same floor (32) compresses the decline into a shorter, steeper 3-year
   span instead of the old 5-year span — i.e. still hits the same terminal
   value by the same age, just doesn't start declining two years too early.
   All other position curves were checked against the same round of research
   and were already well-aligned; left unchanged. */
const AGE_CURVE = {
  QB:{peakStart:26, peakEnd:33, floor:35},
  RB:{peakStart:23, peakEnd:25, floor:30},
  WR:{peakStart:24, peakEnd:28, floor:33},
  TE:{peakStart:25, peakEnd:29, floor:34},
  DL:{peakStart:24, peakEnd:29, floor:34},
  LB:{peakStart:24, peakEnd:29, floor:32},
  DB:{peakStart:23, peakEnd:27, floor:32},
  K:{peakStart:22, peakEnd:40, floor:45}
};
/* QB post-peak decline benchmarked 2026-08-13 against three independent
   real KTC values (Geno Smith 35/2089, Matthew Stafford 38/3789, Aaron
   Rodgers 42/1940) — the shared 0.62 floor (calibrated from RB/WR) was
   never separately checked for QB, and turned out wrong in shape, not just
   number. Geno Smith, only 2 years past peak, already needed almost the
   SAME low multiplier as Rodgers, 9 years past peak — meaning QB doesn't
   decline gradually like RB/WR, it drops close to its floor almost
   immediately after peak (hence floor age moved from 41->35 above) and
   stays roughly flat from there. Floor value 0.546, averaged from the
   three anchors (0.60/0.55/0.49) — fit within ~10% for all three once the
   shape was corrected (was off by up to 55% with the old RB/WR-borrowed
   shape). Kirk Cousins was tried as a 4th anchor and discarded — his
   production multiplier is already floored near-zero from minimal real
   snaps this year, which conflates the age question with a separate
   "inactive veteran floor" issue this doesn't attempt to solve. */
const QB_POST_PEAK_FLOOR = 0.546;

/* LB post-peak decline SHAPE fixed 2026-08-26 -- item #7 from the four-AI-
   review priority list, previously unresolved. Distinct from (and later
   than) the 2026-08-13 peakEnd fix above, which addressed WHEN LB decline
   starts (real research: "slow decline through 29, then rapid after 29"),
   but never touched WHAT SHAPE that decline takes -- every non-QB
   position, LB included, still ran the post-peak formula below as a flat
   straight line (1.0 - t*0.38) all the way from peakEnd to floor. That
   directly contradicts the same research already cited for the peakEnd
   change: "rapid decline" right after peak, easing off approaching the
   floor, is a front-loaded (convex) curve, not a constant-rate one -- a
   straight line was never capable of representing what the cited research
   actually described, no matter how correctly peakEnd itself was set.

   Fix: t is raised to a power < 1 before being applied (t^0.5 here), which
   makes the EARLY portion of the decline steeper than a straight line and
   the LATE portion flatter as it eases into the floor -- e.g. at t=0.25
   (25% of the way from peakEnd to floor), t^0.5=0.5, so half the total
   decline has already happened; the remaining 75% of the age range only
   covers the remaining half of the drop. That's the qualitative shape
   "rapid then leveling off" requires.

   CONFIDENCE CAVEAT, stated plainly rather than overclaimed: unlike
   QB_POST_PEAK_FLOOR (fit against 3 real KTC anchors: Geno Smith,
   Stafford, Rodgers) or the RB youth bonus (fit against 2 real anchors:
   Love, Irving), this specific exponent (0.5, a plain square root) is NOT
   independently verified against a real aging LB's actual KTC/market
   value -- it's chosen because it's the simplest function with the right
   qualitative shape (front-loaded, easing toward the floor), not because
   it was empirically fit. This project's own internal KTC vote data was
   checked first and is too sparse for this specific purpose (LB same-
   position pairwise observations: 23, still below the 30-observation
   trust threshold as of this writing). If a real KTC value for a specific
   LB a couple of years past peak (e.g. age 30-31) ever becomes available,
   this exponent should be re-fit against it the same way every other
   post-peak parameter in this file was -- treat 0.5 as a structural
   placeholder that fixes the shape being qualitatively wrong, not as a
   number with the same evidence backing as its neighbors above.

   VERIFIED 2026-08-26, per external review, before treating this as
   closed: (1) age is stored as a plain integer everywhere in this file,
   confirmed against real Sleeper sync data (e.g. Dak Prescott age:33,
   no decimals) -- the "steep slope near t=0" concern a fractional power
   can create for continuously-aged players doesn't apply here, since a
   player's age only ever jumps in whole-year steps (29->30->31->32).
   (2) t can't go negative feeding into this power (see the explicit
   clamp above). (3) Sensitivity check across candidate exponents (0.5/
   0.67/0.75/1.0) at real integer ages 29-32 stays within a bounded,
   reasonable range (age 30: 0.78-0.87 depending on exponent) -- no
   candidate produces an unreasonable cliff. (4) Checked against a real
   still-elite 31-year-old LB (Foyesade Oluokun, real prod_mult 0.777):
   trade value moves from 3,572 to 3,300 (-7.6%) -- a real, meaningful
   shift, not an absurd one; he still lands with substantial value, not
   crushed to a token amount.

   BACKLOG (not a blocker): calibrate LB_POST_PEAK_DECAY_POWER against a
   real market/outcome anchor (a specific aging LB with known real KTC
   value) once one becomes available -- same method used for every other
   post-peak parameter in this file. Also worth revisiting for DL/DB if
   position-specific evidence (not just "also a defensive position")
   ever supports the same non-linear shape -- not assumed here.

   FULL REAL-PLAYER IMPACT AUDIT, 2026-08-26, before deployment (per
   external review -- one spot-check isn't enough when this changes live
   trade values, but under integer ages only 30/31-year-old LBs actually
   move, so the full audit is small and exhaustive, not a sample):
   73 of 79 real LBs in PLAYER_DB have real production data (6 excluded,
   all legitimately -- e.g. Bobby Wagner at 36 is beyond this range
   entirely; Bobby Okereke is a real free agent with no 2026 team and
   therefore no projection, same documented no_projection_available
   category validated elsewhere in this file, not a bug).
     - Age 29 & 32 controls (9 players): EXACTLY ZERO change, confirming
       the endpoints are genuinely untouched.
     - Only 10 real players change at all (4 at age 30, 6 at age 31) --
       fully enumerated, not sampled. Largest: Blake Cashman (30, Elite)
       rank 15->25, -10.6%, $4,303->$3,846 -- real and meaningful, but
       he remains solidly top-third among ~73 ranked LBs, not crushed to
       replacement level. No elite older LB falls behind clearly-worse
       young depth players; every rank movement stayed proportionate
       (4-11 ranks) with no wild outlier.
     - Zero NaN, zero below-floor-multiplier, zero unexpected-position
       results across all 73 real players checked.
   Full per-player table available on request -- not reproduced here to
   keep this comment from becoming another data table to maintain. */
const LB_POST_PEAK_DECAY_POWER = 0.5;

/* "Understudy" tier added 2026-08-13, calibrated against real KTC market
   data for backup rookie QBs with real draft capital but zero current
   snaps (Ty Simpson, Carson Beck, Drew Allar, Cade Klubnik — see chat
   history). Distinct from Speculative: Speculative means "unproven, unclear
   if the talent is even real"; Understudy means "real, recognized talent,
   just blocked by someone ahead of them on the depth chart" — a different
   kind of uncertainty that deserves a different number.
   First calibration attempt used Fernando Mendoza (a rookie QB) as the
   reference anchor and landed at 0.28 — but that anchor was never itself
   verified against anything, so any bias in Mendoza's own valuation would
   silently carry through. Re-anchored against Jacoby Brissett and Mac Jones
   (established veteran backups, real multi-year production data) instead.
   Brissett turned out to be a BAD anchor — our tool overvalues him by 51%
   relative to his real KTC value (QB's age curve runs to 33, so he gets a
   full age credit despite being a clear journeyman). Mac Jones is a clean
   anchor — our tool's value for him is within 4% of his real KTC value,
   meaning the tool already has him roughly right. Re-anchoring off Mac
   Jones alone gives an average implied multiplier of 0.572 across the same
   4 players (range 0.452-0.669) — landing next to Rotational (0.65), not
   down near Speculative. Makes sense on reflection: dynasty managers value
   "a real starting-caliber talent one injury from the job" almost as much
   as an actual current role, especially at QB where that flip can happen
   overnight. */
const ROLE_MULT = { Elite:1.4, 'Every-Down':1.15, Starter:1.0, Rotational:0.65, Understudy:0.57, Depth:0.35, Speculative:0.22 };

/* Production multipliers — IDP V1 deployed 2026-08-28.

   OFFENSE (QB/RB/WR/TE/K): unchanged by this deployment. Their existing
   production multipliers remain exactly as they were before the IDP V1 work.

   IDP V1 (LB/DL/DB) replaces the old final-points projection blend with a
   category-level ensemble while deliberately preserving unrelated historical
   production-lineage differences. The approved V1 projection architecture is:

     Stage 1 total tackles: 50% FantasyPros / 50% Sleeper
     Stage 2 solo share:    40% FantasyPros / 60% Sleeper
     TFL + QB hits:         Sleeper-only (not populated by FantasyPros)
     sacks/INT/PD/FF/FR/TD: 50/50 category consensus when both sources are
                            genuinely active
     single-source player:  use the active source directly; never average
                            against a missing or zero-signal placeholder

   FantasyPros input comes from the official normalized API pipeline. Sleeper
   input comes from raw projected IDP categories. Cross-provider identity uses
   the hardened FantasyPros↔Sleeper identity crosswalk, not normalized names.

   RELEASE MIGRATION METHOD — MODEL-DELTA TRANSPORT:
   The historical live PROD_MULT table did not exactly match a clean rerun of
   the legacy production pipeline. A full canonical recompute would therefore
   have mixed the approved V1 projection-source change with unrelated historical
   lineage cleanup. To isolate the release, OLD and V1 models are computed on
   the same reproducible history cohort, each with its own rank-32 replacement
   baseline, and only the resulting model delta is transported onto the actual
   pre-V1 live multiplier. The immutable pre-V1 table is stored in
   scripts/prod_mult_pre_v1_baseline.json.

   This retains the legitimate replacement-baseline movement caused by V1 while
   avoiding a hidden wholesale renormalization of the older live table. For the
   frozen source snapshot used for deployment, the internally consistent V1
   baseline shifts were approximately +3.4% LB, +4.4% DL, and +3.4% DB.

   FLOOR-RESCUE MIGRATION GUARD:
   Four current no-2025-history speculative LBs were sitting at the exact 0.15
   raw floor before V1. A tiny positive transported delta would have moved them
   just above 0.15, which would disable the existing role-floor rescue and cause
   a large FINAL value drop despite a positive raw model delta. That threshold
   artifact was outside the validated V1 cohort. Those four raw values are held
   at 0.15 unless the transported V1 multiplier actually clears the role
   estimate. The guarded players are Jaishawn Barham, Jake Golday, Kaleb
   Elarms-Orr, and Kyle Louis. This is a release guard, not a recalibration of
   productionMultiplier().

   POSITION-LINEAGE GUARD:
   46 current IDP players (mostly EDGE players historically grouped at LB and
   now valued at DL) have different legacy production-model and current
   valuation positions. That classification migration is intentionally NOT
   bundled into this projection release. The OLD-vs-NEW model-delta calculation
   preserves the legacy production grouping; final Trade Desk values continue
   to use the current PLAYER_DB valuation position. Migrating those 46 baseline
   positions is a separate future workstream.

   Production-bake artifacts and validation live under scripts/, including
   idp_v1_model_delta_transport_candidate.json, idp_v1_prod_mult_patch.json,
   idp_v1_prod_mult_patch_report.md, and idp_v1_final_deployment_validation.md. */

    const real = PROD_MULT[key];
    if(role === 'Elite' && real < 0.65) return 0.65;
    /* Never let having SOME real data (even a bottomed-out 0.15 floor
       value) leave a player worse off than having NO data at all would.
       Found 2026-08-13 checking a batch of rookies against fresh KTC
       values (Malachi Fields, Eli Raridon, etc.) — many were floored at
       0.15 despite being tagged Depth/Speculative, whose role-tier
       ESTIMATE (0.35/0.22) was actually higher than their real-but-
       floored number. Take whichever is higher — but ONLY when real
       production is AT the literal floor (0.15), not just "lower than
       whatever this role's estimate happens to be."
       CAUGHT A SEVERE BUG HERE THE SAME DAY: the first version of this
       fix applied Math.max(real, roleEstimate) unconditionally, for every
       real value, not just floored ones. Role estimates for the TOP tiers
       are high (Elite=1.4, Every-Down=1.15) — numbers almost no real
       player's actual production will ever organically clear — so that
       version silently overrode real data with the flat tier ceiling for
       nearly every Elite/Every-Down player in the file. Roquan Smith
       jumped from a real, benchmarked 4,955 to 9,009 — nearly Josh Allen's
       value — entirely from this bug, not from anything about Roquan.
       Caught only because the person noticed the number looked wrong, not
       by the test suite (the tests checked that rookies with floored data
       improved, which they correctly did — they never checked that
       ALREADY-GOOD real data stayed untouched, which is exactly what broke).
       Restricting this to real <= 0.15 exactly fixes it: the floor-rescue
       behavior for genuinely floored players is unchanged, and anyone with
       real production above the floor (the vast majority of rostered
       players) goes back to being valued on their real data, not a role
       guess.

       SECOND BUG FIX HERE (2026-08-26, external review, confirmed real):
       "real <= 0.15" alone still created a discontinuity -- it checks the
       already-CLAMPED value, not why a player is down there. Two players
       with nearly identical real evidence (say, clamped prod_mult 0.151
       vs 0.150) could get wildly different treatment: 0.151 keeps his
       real (weak) number, 0.150 gets fully replaced by a role estimate up
       to 2x higher. Checked this against real data before fixing it: of
       56 real players sitting at/near this floor, 22 have zero real 2025
       games (genuinely no data -- the rescue this was built for) and 34
       have real, if weak, playing history (Justin Fields, Jameis Winston,
       Carson Wentz, and other real backup-tier QBs) -- rescuing THOSE with
       a role guess would override real evidence of being mediocre with a
       generic tier number, the exact mistake this whole mechanism exists
       to avoid. Now requires BOTH conditions: hitting the floor AND zero
       real 2025 games (NO_REAL_PRODUCTION_HISTORY, baked from
       prod_mult_pipeline.py's own real lineage). This can only NARROW the
       existing rescue population, never widen it -- safe against any
       mismatch between this baked flag's source snapshot and whatever
       snapshot produced the live PROD_MULT_DATA table, since it can never
       rescue someone who wasn't already sitting at the floor. */
    if(real <= 0.15 && roleEstimate > real && NO_REAL_PRODUCTION_HISTORY.hasOwnProperty(key)) return roleEstimate;
    return real;
  }
  return roleEstimate;
}

/* Situational override: injury status — ON THE BACK BURNER, not applied.
   Unlike the pick curve (benchmarked against real KTC market data) and the
   age curves (benchmarked against independent published research), there is
   no equivalent public numeric standard for "how much should a Questionable
   tag discount trade value." Every commercial trade tool folds this into an
   opaque "expert consensus" black box rather than publishing a number.
   These multipliers were an informed judgment call, not benchmarked fact —
   built 2026-08-13, then DELIBERATELY DISCONNECTED from playerValue() the
   same day at the person's request: showing a discount with no real
   benchmark behind it is worse than not showing one. The table and function
   are left intact and correct below so this is a one-line change to
   re-enable (see playerValue()) once there's something real to anchor these
   numbers to — a benchmark, published research, or enough of this league's
   own trade history to calibrate against, the way the pick curve was.
   Also still only a snapshot even if re-enabled — no time-decay modeling,
   since Sleeper gives us today's status only and the sync script overwrites
   rather than logs day over day. That needs its own history file first. */
const INJURY_MULT = {
  Questionable: 0.93,  // most Q-tagged players still suit up; mild discount
  Doubtful:     0.85,  // usually means "won't play this week" but short-term
  Out:          0.90,  // confirmed miss this week, minimal standalone long-term signal
  IR:           0.75,  // real injury, genuine return-timeline uncertainty
  PUP:          0.75,  // same tier as IR — long-term, uncertain
  Sus:          0.85,  // finite and fully reversible, but real missed time
  NA:           0.90,  // roster-inactive/other — mild generic caution
};

function injuryMultiplier(name){
  const key = normalizeName(name);
  const info = PLAYER_DB[key];
  if(!info || !info.injury) return 1.0;
  return INJURY_MULT[info.injury] ?? 0.90; // unrecognized tag -> mild default caution
}

function ageMultiplier(pos, age, role, realProduction, rawProduction){
  const c = AGE_CURVE[pos] || AGE_CURVE.WR;
  if(pos === 'K') return 0.5;
  if(age <= c.peakEnd){
    /* Pre-peak ramp floor benchmarked 2026-08-13 — much weaker evidence
       base than the post-peak floor below, worth reading the full chat
       history before trusting this blindly. Originally the same 0.55 for
       every player regardless of role, treating a proven top-5-pick
       talent (e.g. Abdul Carter, 22, already tagged Elite off real
       flashed production) identically to a total unknown late-round
       rookie.

       REPLACED 2026-08-20 — this went through two real versions in one
       day. First: gate a flat 'Elite' floor (0.725 + a scaling bonus)
       behind role==='Elite'. That missed real strong young producers with
       no Elite tag (Carson Schwesinger, 23, real prod_mult 0.843). Second
       attempt: same flat floor, but triggered by real production >= 0.65
       instead of the role tag. That fixed Schwesinger but created a new,
       real problem — a binary cliff. Someone barely above the 0.65 line
       (Quentin Johnston 0.708, Ladd McConkey 0.769, Emeka Egbuka 0.782)
       got nearly the SAME 0.725+ floor as someone genuinely exceptional
       (Jaxon Smith-Njigba, 1.376) — real players who clearly aren't the
       same caliber were getting labeled equivalently. Caught by a real
       gut-check: "most of those WR players don't fit that label at all."

       FINAL version: no threshold, no cliff, no 'Elite' check at all for
       this calculation. preFloor scales continuously across real
       production's own existing range (0.15 floor to 1.55 cap) onto the
       0.55-to-0.98 preFloor range — the same two endpoints the old
       formula already used, just connected smoothly instead of jumping.
       Verified against real players before shipping: Smith-Njigba (1.376)
       lands at 0.927 (clearly differentiated, near the top), McConkey
       (0.769) at 0.74 (a small real bump, not treated as equivalent to
       Smith-Njigba), Abdul Carter (the original motivating Elite case,
       0.667) moves from 0.735 to 0.709 — a modest, sensible change, not a
       regression. Players with no real production data (realProduction is
       not a number) fall back to the plain role-tag check, same as
       before — this can only work off real production when real
       production actually exists; role tags remain the only signal for
       anyone still in the ROLE_MULT-only fallback. */
    let preFloor;
    if(typeof realProduction === 'number'){
      const lo = 0.15, hi = 1.55;
      const ratio = Math.max(0, Math.min(1, (realProduction - lo) / (hi - lo)));
      preFloor = 0.55 + ratio * (0.98 - 0.55);
    } else {
      preFloor = (role === 'Elite') ? 0.725 : 0.55;
    }
    const t = Math.max(0, (age - 21) / (c.peakStart - 21));
    const preFloorBase = preFloor + t * (1.0 - preFloor);
    const atPeakBase = 1.0;
    const base = age <= c.peakStart ? preFloorBase : atPeakBase;

    /* RB-only youth-premium bonus, added 2026-08-14, REPLACES the floor-
       scaling above (not stacked on top of it) whenever it applies — a
       real bug in the first version of this: both mechanisms scale off
       "how far real production exceeds 0.65," and adding them together
       silently double-counted the same signal, pushing both real anchors
       (Love AND Irving) into hitting the outer cap rather than the
       formula genuinely fitting their real values. That's also what let
       Drake Maye (QB) slip through at 10317 — the SAME capped multiplier
       is worth far more in dollars for QB (1.30 position weight) than RB
       (0.89), so a fix that looked fine for RB silently broke QB.
       Restricted to RB specifically, not extended to every position, for
       a real reason beyond "that's my only data": RB careers are short
       and every year of remaining prime is scarce, which is WHY a young
       proven back commands a genuine premium in real markets. QB doesn't
       share that dynamic — quarterbacks commonly play at a high level
       into their late 30s (see the QB decline curve elsewhere in this
       file, benchmarked separately, which found QB ages in an entirely
       different SHAPE than RB/WR to begin with) — so "years of remaining
       prime" isn't the same scarce, valuable thing for a QB that it is
       for a RB. Extending this bonus to QB, WR, TE, DL, LB, or DB would
       be extrapolating a RB-specific real-world pattern onto positions
       with zero supporting evidence AND a weaker conceptual case for it
       even applying. Recalibrated cleanly (base=flat 0.725 or 1.0, no
       floor-scaling stacked underneath) against the same two real
       anchors: Jeremiyah Love (21, pre-peak) and Bucky Irving (24,
       at-peak) needed bonuses of 0.792 and 0.372 respectively — implying
       coefficients of 0.396 and 0.371, close enough to average (0.384)
       without relying on hitting the cap. Fits both within ~2%: Love
       predicted 7252 vs real 7375, Irving predicted 4747 vs real 4704. */
    if(pos === 'RB' && role === 'Elite' && age <= 25 && typeof rawProduction === 'number' && rawProduction >= 0.65){
      const yearsOfUpside = Math.min(4, Math.max(0, c.peakEnd - age));
      const youthBonus = 0.384 * Math.sqrt(yearsOfUpside);
      const flatBase = age <= c.peakStart ? 0.725 : 1.0;
      return Math.min(1.5, flatBase + youthBonus);
    }
    return base;
  }
  const declineSpan = c.floor - c.peakEnd;
  // Explicit lower clamp added 2026-08-26, per external review: the
  // preceding `if(age <= c.peakEnd){...return...}` branch above already
  // guarantees age > peakEnd (so t > 0) whenever this line runs, making
  // this technically redundant today -- but explicit is safer than
  // relying on that invariant surviving every future refactor, especially
  // now that a fractional power (LB's Math.pow below) is in play, where a
  // negative t would produce NaN instead of merely a wrong number.
  const t = Math.max(0, Math.min(1, (age - c.peakEnd) / declineSpan));
  /* Post-peak floor benchmarked 2026-08-13 against real KTC market data
     for two players well past their position's peak window but still
     producing at an elite level: Derrick Henry (RB, 32, our own production
     data already rates him Elite at 1.266) and Davante Adams (WR, 33, 0.812
     production). The OLD floor (0.15, an 85% cut) put both at 19-31% of
     their real KTC value — the age penalty was completely overriding a
     player's real current production once they crossed the floor age.
     Henry and Adams individually imply floors of ~0.48 and ~0.77
     respectively — a wide, disagreeing spread, since both are genuine
     outliers (still playing at a near-peak level well past the age most
     players decline). Rather than trust either single anchor, split the
     difference: 0.62. This deliberately overshoots Henry (5396 vs real
     4170) and undershoots Adams (2769 vs real 3437) rather than fit either
     exactly — the goal was "stop being 3-5x off for everyone," not "nail
     these two specific outliers." A weak producer at the same age (e.g.
     Alvin Kamara, 0.26 production) still lands well below a strong one
     (Henry) even at this softer floor — the differentiation from real
     production isn't lost, just no longer swamped by the age penalty. */
  return pos === 'QB'
    ? Math.max(QB_POST_PEAK_FLOOR, 1.0 - t * (1 - QB_POST_PEAK_FLOOR))
    : pos === 'LB'
    ? Math.max(0.62, 1.0 - 0.38 * Math.pow(t, LB_POST_PEAK_DECAY_POWER))
    : Math.max(0.62, 1.0 - t * 0.38);
}

function playerValue(pos, age, role, name){
  const pw = POSITION_WEIGHT[pos] ?? 1.0;
  const rm = productionMultiplier(name || '', role);
  const normKey = normalizeName(name || '');
  const rawRm = PROD_MULT.hasOwnProperty(normKey) ? PROD_MULT[normKey] : null;
  const am = ageMultiplier(pos, age, role, rm, rawRm);
  // injuryMultiplier() is intentionally NOT applied here — see the
  // INJURY_MULT comment above. Re-enable with: const im = injuryMultiplier(name || ''); ... * im
  return Math.round(100 * pw * am * rm * 55);
}

/* Pick values benchmarked against KeepTradeCut's real Superflex crowdsourced
   market (keeptradecut.com/dynasty-rankings, pulled 2026-08-13), anchored so
   "2027 early 1st" stays 7500 to match this tool's existing scale. The
   previous curve (round-over-round decay of ~40%/round) was badly out of
   step with the real market, which decays much more gently — a mid-4th
   trades for ~31% of a mid-1st in reality, not the ~7% the old curve implied.
   Rounds 5-6 aren't tracked individually on KTC and are extrapolated by
   continuing the observed R3→R4 decay rate; treat those two rows as a
   reasonable guess, not benchmarked fact. */
const PICK_BASE = {
  1: {early:7500, mid:5854, late:5244},
  2: {early:3906, mid:3624, late:3291},
  3: {early:2692, mid:2682, late:2319},
  4: {early:1972, mid:1831, late:1689},
  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data
  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data
};
/* 2027→2028 discount benchmarked from real KTC data (avg ~0.85 across 12
   round/slot pairs, see chat history 2026-08-13). 2029 has no KTC market yet
   (picks that far out aren't tracked there) — extrapolated by compounding
   the same ~0.85 falloff once more (0.85² ≈ 0.72), not independently
   verified. Revisit once KTC starts listing 2029 picks. */
const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };

function pickValue(round, slot, year){
  const base = (PICK_BASE[round] || PICK_BASE[6])[slot] ?? PICK_BASE[6].late;
  const disc = YEAR_DISCOUNT[year] ?? 0.6;
  return Math.round(base * disc);
}

};
const ALIASES_REVERSE = Object.fromEntries(Object.entries(ALIASES).map(([a,c]) => [c,a]));

/* Given a freshly-normalized key (from live sync or anywhere else), return
   whichever key form ALREADY has a PLAYER_DB entry, so merges update the
   existing record instead of forking a new one. If neither form exists
   yet, returns the key unchanged (genuinely new player, no conflict). */
function resolveExistingKey(key){
  if(PLAYER_DB.hasOwnProperty(key)) return key;
  const alt = ALIASES[key] || ALIASES_REVERSE[key];
  if(alt && PLAYER_DB.hasOwnProperty(alt)) return alt;
  return key;
}

function normalizeName(s){
  return s.trim().toLowerCase().replace(/[.'’-]/g,'').replace(/\s+/g,' ');
}

function titleCase(k){
  return k.replace(/\b\w/g, c => c.toUpperCase());
}

function escapeHtml(str){
  if(str == null) return str;
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
/* ---------- Free agent board logic ---------- */
let FREE_AGENTS = [];
let state = { dataOnly: true };

const FREE_AGENTS_URL = 'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/main/data/free_agents.json?t=' + Date.now();

async function loadFreeAgents(){
  const statusEl = document.getElementById('syncStatus');
  try{
    const resp = await fetch(FREE_AGENTS_URL);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const raw = data.free_agents || [];

    /* Manually excluded free agents, per real request 2026-08-20 -- kept
       as an explicit filter (not a one-time delete) since this list is
       re-fetched live from GitHub on every page load, so anything removed
       from the raw data alone would just reappear on the next sync.
       Matched by name+pos together, not name alone, so this can't
       accidentally exclude a different real person who happens to share
       one of these names (the same collision risk documented a few lines
       up for Devonta Smith specifically -- there's a real WR Devonta
       Smith and a real DB Devonta Smith; only the DB is meant to be
       excluded here). */
    const EXCLUDED_FREE_AGENTS = [
      {name: 'byron young', pos: 'DL'},
      {name: 'devonta smith', pos: 'DB'},
    ];
    const filteredRaw = raw.filter(fa => {
      const faKey = normalizeName(fa.name);
      return !EXCLUDED_FREE_AGENTS.some(ex => ex.name === faKey && ex.pos === fa.pos);
    });

    FREE_AGENTS = filteredRaw.map(fa => {
      const rawKey = normalizeName(fa.name);
      const key = ALIASES[rawKey] || ALIASES_REVERSE[rawKey] || rawKey;
      const candidateCurated = PLAYER_DB[key];
      /* Position-verified match, added after a real bug: a rookie LB
         named "Justin Jefferson" (Browns) and a rookie DB named "Devonta
         Smith" (Panthers) both matched purely on name text against our
         hand-curated database's Vikings/Eagles WR superstars of the same
         name, silently inheriting their real production data and Elite
         tags. This never came up in the trade calculator (it only ever
         dealt with the 12 rosters' actual real players, no collision risk)
         but a free-agent search across thousands of real NFL players hits
         name collisions constantly. Requiring the position to also match
         before trusting curated data catches this — two real people
         sharing a name essentially never share a position bucket too. */
      const curated = (candidateCurated && candidateCurated.pos === fa.pos) ? candidateCurated : null;

      /* FA_PROD_MULT_DATA (added 2026-08-15) covers real free agents
         directly — players who were never on any of the 12 rosters, so
         they never had a PLAYER_DB entry the way rostered players do.
         Same position-verification applied for the same collision-safety
         reason as above. */
      // Almost always a single entry -- but a small number of real people
      // share an exact name (e.g. 'devin neal', a real RB and a real DB,
      // added 2026-08-20), stored as an array in that case. Position
      // verification below picks the right one the same way it already
      // resolves collisions against the curated PLAYER_DB.
      const faProdRaw = FA_PROD_MULT_DATA[key];
      const faProdEntry = Array.isArray(faProdRaw)
        ? faProdRaw.find(e => e.pos === fa.pos) || null
        : faProdRaw;
      const faProdMatch = (faProdEntry && faProdEntry.pos === fa.pos) ? faProdEntry : null;

      const hasRealData = !!(curated && PROD_MULT.hasOwnProperty(key)) || !!faProdMatch;

      // Prefer hand-curated pos/age/role if we already have this SAME real
      // player (verified by position match above); otherwise fall back to
      // Sleeper's own pos/age. Role defaults to Starter for players with
      // real free-agent-specific production data (a verified real number,
      // not a guess), or Speculative with no data at all (being unrostered
      // in a competitive 12-team dynasty league is itself informative).
      const pos = curated ? curated.pos : fa.pos;
      const age = curated ? curated.age : (fa.age || 24);
      /* Blanket "Starter" default for anyone with real free-agent production
         data was a real mistake, caught 2026-08-15: Spencer Rattler has
         real 2025/2026 numbers, but he's genuinely a backup (Tyler Shough
         is the real Saints starter), not a real starter — the blanket
         default overstated his role security regardless of what the real
         situation actually is. FA_PROD_MULT_DATA entries can now carry an
         explicit role override; falls back to 'Starter' only when no
         override is given, which is still an assumption worth treating
         with real skepticism on a name-by-name basis, not a verified fact
         for every player who happens to have real production numbers. */
      /* Default changed from 'Starter' to 'Speculative', found 2026-08-15
         via Tyler Huntley showing up at 7100 -- nearly Josh Allen's value.
         The blanket 'Starter' default combined with the "never worse than
         role estimate" floor-rescue (built for a DIFFERENT purpose --
         protecting genuinely good players like Malachi Fields from thin-
         SAMPLE artifacts) created a serious bug: any free agent whose real
         blended production is accurately low (not a data artifact, just a
         real backup having a real backup's season) got silently rescued
         UP to full Starter-level value, since the rescue mechanism can't
         tell "artificially low" apart from "correctly low." Affected 22 of
         162 real-data free agents, and the ones it hit were the most
         visible, obviously-wrong ones. Same reasoning already used for
         the no-data case now applies here too: being unrostered in a
         competitive 12-team league is itself informative, and shouldn't
         default to "clearly a real starter" without actual verification.
         A real free agent whose production is genuinely strong (Cameron
         Heyward, Keisean Nixon, etc.) is completely unaffected by this —
         their real numbers already clear the floor easily and speak for
         themselves regardless of what role default they'd otherwise get. */
      const role = curated ? curated.role : (faProdMatch ? (faProdMatch.role || 'Speculative') : 'Speculative');

      /* playerValue() independently re-looks-up production data by name
         internally (productionMultiplier -> PROD_MULT[normalizeName(name)]),
         so passing the same colliding `key` here would silently pull the
         superstar's real production numbers right back in even after the
         position check above correctly blocked their pos/age/role — half
         a fix is not a fix. For a disambiguated non-match, pass a name
         guaranteed not to collide with anything in PROD_MULT/ALIASES (the
         real Sleeper player_id makes it unique) so the lookup safely falls
         through to the role-tier estimate instead. */
      let valueKey;
      if(curated && PROD_MULT.hasOwnProperty(key)){
        // Canonical rostered-player production is the strongest source when
        // this exact same player/position exists in PLAYER_DB.
        valueKey = key;
      } else if(faProdMatch){
        // A curated PLAYER_DB row may exist before that player has a canonical
        // PROD_MULT entry (common with newly added rookies). In that case do
        // NOT let the metadata match suppress verified FA-specific production.
        // Inject the FA number under a unique key so the shared production
        // lookup uses the correct source while keeping curated age/role/pos.
        valueKey = key + '_faprod_' + fa.player_id;
        if(!PROD_MULT.hasOwnProperty(valueKey)) PROD_MULT[valueKey] = faProdMatch.prod;
      } else if(curated){
        // Curated metadata with no real production source: use the canonical
        // role estimate rather than pretending real data exists.
        valueKey = key;
      } else {
        valueKey = key + '_fa_' + fa.player_id;
      }
      const val = playerValue(pos, age, role, valueKey);
      return {
        key, name: fa.name, pos, age, role, val, hasRealData,
        team: fa.team, injuryStatus: fa.injury_status,
      };
    }).filter(fa => fa.pos && fa.val > 0);

    const dataCount = FREE_AGENTS.filter(fa => fa.hasRealData).length;
    statusEl.className = 'status ok';
    statusEl.textContent = `Loaded ${FREE_AGENTS.length} free agents (${dataCount} with real production data) · synced ${new Date(data.synced_at * 1000).toLocaleDateString()}`;
    renderBoard();
  } catch(err){
    statusEl.className = 'status fail';
    statusEl.textContent = 'Failed to load free agent data: ' + err.message + ' — check that data/free_agents.json exists in the repo.';
  }
}

function setDataOnly(val){
  state.dataOnly = val;
  document.getElementById('dataOnlyBtn').className = 'toggle-btn' + (val ? ' active' : '');
  document.getElementById('allBtn').className = 'toggle-btn' + (!val ? ' active' : '');
  renderBoard();
}

function buildRows(list){
  return list.length ? list.map(fa => {
    const tag = fa.hasRealData ? '<span class="tag-data">data</span>' : '<span class="tag-est">est.</span>';
    const injury = fa.injuryStatus ? ' · ' + escapeHtml(fa.injuryStatus) : '';
    return `
      <div class="row ${fa.hasRealData ? 'has-data' : ''}">
        <div class="row-info">
          <div class="row-title">${escapeHtml(fa.name)}</div>
          <div class="row-meta">${fa.pos} · Age ${fa.age} · ${fa.role} · ${tag}${fa.team ? ' · ' + escapeHtml(fa.team) : ''}${injury}</div>
        </div>
        <div class="row-val">${fa.val.toLocaleString()}</div>
      </div>`;
  }).join('') : '<div class="empty">No free agents match this filter.</div>';
}

function renderBoard(){
  const wrap = document.getElementById('boardWrap');
  if(!wrap) return;
  const positions = ['ALL','QB','RB','WR','TE','DL','LB','DB'];
  wrap.innerHTML = positions.map((pos, i) => {
    let list = pos === 'ALL' ? FREE_AGENTS.slice() : FREE_AGENTS.filter(fa => fa.pos === pos);
    if(state.dataOnly) list = list.filter(fa => fa.hasRealData);
    list.sort((a,b) => (b.hasRealData - a.hasRealData) || (b.val - a.val));

    const rows = buildRows(list);

    return `
      <details ${list.length ? '' : 'style="opacity:0.5;"'} ${i === 0 ? 'open' : ''}>
        <summary>${pos} <span style="color:var(--text-dim);font-weight:400;">(${list.length})</span></summary>
        <div class="body-wrap">${rows}</div>
      </details>`;
  }).join('');
}

loadFreeAgents();
</script>
</body>
</html>
