name: Draft Pick FV V5 - Phase 6 Research Closeout

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard frozen V5 result and production
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json)" = \
            "b52aca0a7a0313c35065850273f80e9df684fe2d"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_development_candidate_fit_v5.json)" = \
            "e4cdfc3f0c0bb7be8eca0bbac750ba987a3ec738"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_development_candidate_fit_manifest_v5.json)" = \
            "9d0a698d4dc6469e09ad072c4ff0681df2b38ae4"

          test "$(git hash-object research/draft-pick-fv-v5/score_r1_r2_locked_validation_v5.py)" = \
            "52d39b001e078ce2220ee36036b64483cd201c51"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_validation_metric_contract_v5.json)" = \
            "f7425529f0746e1cf8034572a878d62c1b6d4a53"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_locked_validation_results_v5.json)" = \
            "7f3e56633beb8772d94beacc59ac0407ca01365b"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_locked_validation_results_v5.md)" = \
            "f7d0da48a4312f4df3ffed7a7743f26e5889d6c4"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_locked_validation_manifest_v5.json)" = \
            "59c7773ecc3fa9a52e8473fc052a8b6e1ab7e238"

          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          expected_lines = [
              "PICK_BASE = {",
              "  1: {early:7500, mid:5854, late:5244},",
              "  2: {early:3906, mid:3624, late:3291},",
              "  3: {early:2692, mid:2682, late:2319},",
              "  4: {early:1972, mid:1831, late:1689},",
              "  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data",
              "  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data",
              "};",
              "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for line in expected_lines:
              assert line in text, f"deployed pick-value contract changed: {line}"
          print("PASS: deployed PICK_BASE/YEAR_DISCOUNT contract unchanged.")
          PY
          test "$(git hash-object research/package-adjustment-production-candidate-v1/live_deployment.json)" = \
            "fb192d6d52ca302f9694adc3ae39c7f1047f6140"

          for p in \
            research/draft-pick-fv-v5/r1_r2_v5_research_closeout.json \
            research/draft-pick-fv-v5/r1_r2_v5_research_closeout.md \
            research/draft-pick-fv-v5/r1_r2_v5_research_closeout_manifest.json
          do
            test ! -e "$p"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/draft-pick-fv-v5")
          result = json.loads(
              (d / "r1_r2_locked_validation_results_v5.json").read_text()
          )
          manifest = json.loads(
              (d / "r1_r2_locked_validation_manifest_v5.json").read_text()
          )

          assert result["decision"] == "STOP_NO_V5_R1_R2_PICK_FV_CANDIDATE"
          assert result["eligible_candidates"] == []
          assert result["selected_candidate"] is None
          assert result["candidate_refit_performed"] is False
          assert result["candidate_parameters_changed"] is False
          assert result["production_change_authorized"] is False
          assert result["next_stage"] == \
              "draft-pick-fv-v5-phase6-closeout-no-candidate"

          assert manifest["eligible_candidate_n"] == 0
          assert manifest["selected_candidate"] is None
          assert manifest["production_change_authorized"] is False

          print("PASS: V5 final scientific state is frozen no-candidate STOP.")
          PY

      - name: Build immutable V5 closeout
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          d = root / "research" / "draft-pick-fv-v5"

          prereg_path = d / "r1_r2_bridge_preregistration_v5.json"
          fit_path = d / "r1_r2_development_candidate_fit_v5.json"
          fit_manifest_path = d / "r1_r2_development_candidate_fit_manifest_v5.json"
          val_path = d / "r1_r2_locked_validation_results_v5.json"
          val_manifest_path = d / "r1_r2_locked_validation_manifest_v5.json"

          out_json = d / "r1_r2_v5_research_closeout.json"
          out_md = d / "r1_r2_v5_research_closeout.md"
          out_manifest = d / "r1_r2_v5_research_closeout_manifest.json"

          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          pre = load(prereg_path)
          fit = load(fit_path)
          fitm = load(fit_manifest_path)
          val = load(val_path)
          valm = load(val_manifest_path)

          if val["decision"] != "STOP_NO_V5_R1_R2_PICK_FV_CANDIDATE":
              raise RuntimeError("Phase 5 is not the frozen no-candidate STOP")
          if val["eligible_candidates"]:
              raise RuntimeError("unexpected eligible candidate")
          if val["selected_candidate"] is not None:
              raise RuntimeError("unexpected selected candidate")

          baseline = val["primary_scores"]["C0_DEPLOYED"]
          c0_mae = float(baseline["primary_h3_o2"]["macro_mae"])

          candidate_summary = {}
          for cid in pre["selection"]["winner_pool"]:
              score = val["primary_scores"][cid]
              gates = val["eligibility_gate_results"][cid]
              failed = [
                  name
                  for name, passed in gates["gates"].items()
                  if passed is not True
              ]
              candidate_summary[cid] = {
                  "frozen_parameters": score["frozen_parameters"],
                  "frozen_r1_r2_values": score["frozen_r1_r2_values"],
                  "validation_h3_o2_macro_mae": score[
                      "primary_h3_o2"
                  ]["macro_mae"],
                  "validation_improvement_vs_C0": gates[
                      "validation_macro_mae_improvement_vs_C0"
                  ],
                  "improves_2022_vs_C0": gates["gates"][
                      "improves_2022_vs_C0"
                  ],
                  "improves_2023_vs_C0": gates["gates"][
                      "improves_2023_vs_C0"
                  ],
                  "failed_eligibility_gates": failed,
                  "eligible": False,
              }

          c2 = candidate_summary["C2_R1_R2_ROUND_RESCALE"]
          c3 = candidate_summary["C3_R1_R2_LOW_PARAMETER_TIER_CURVE"]

          # Derive structural discontinuities from the already-frozen spliced
          # tables. This is descriptive closeout only; no parameters are fit.
          structural_violations = {}
          tier_order = ("early", "mid", "late")
          for cid in pre["selection"]["winner_pool"]:
              table = val["primary_scores"][cid][
                  "structural_diagnostics_from_frozen_fit"
              ]["spliced_pick_base"]
              flat = []
              for rnd in range(1, 7):
                  for tier in tier_order:
                      flat.append(
                          (
                              f"R{rnd}_{tier}",
                              float(table[str(rnd)][tier]),
                          )
                      )
              violations = []
              for (left_name, left), (right_name, right) in zip(
                  flat, flat[1:]
              ):
                  if right > left + 1e-12:
                      violations.append({
                          "from_cell": left_name,
                          "from_value": left,
                          "to_cell": right_name,
                          "to_value": right,
                          "increase": right - left,
                      })
              structural_violations[cid] = violations

          # V5 must stop here. Future-study guidance may describe what was
          # learned, but cannot create/re-fit a V5 candidate after validation.
          generated = datetime.now(timezone.utc).isoformat()
          closeout = {
              "schema_version": 1,
              "study_id": pre["study_id"],
              "stage": "phase6_research_closeout",
              "status": "V5_RESEARCH_CLOSED_NO_ELIGIBLE_CANDIDATE",
              "generated_at_utc": generated,
              "final_decision": val["decision"],
              "research_complete": True,
              "eligible_candidate_n": 0,
              "selected_candidate": None,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "v5_refit_allowed": False,
              "v5_candidate_family_changes_allowed": False,
              "v5_source_rule_changes_allowed": False,
              "v5_outcome_rule_changes_allowed": False,
              "baseline_validation_h3_o2_macro_mae": c0_mae,
              "candidate_summary": candidate_summary,
              "structural_violations": structural_violations,
              "primary_findings": {
                  "historical_outcomes_support_materially_lower_r1_r2_scale_than_deployed": True,
                  "evidence": (
                      "All three frozen candidates improved H3 O2 validation "
                      "macro MAE by far more than the preregistered 5% gate "
                      "and improved both 2022 and 2023 versus C0."
                  ),
                  "c2_isolation": {
                      "description": (
                          "C2 passed every preregistered eligibility gate "
                          "except all-18-cell monotonicity."
                      ),
                      "validation_improvement_vs_C0": c2[
                          "validation_improvement_vs_C0"
                      ],
                      "failed_gates": c2[
                          "failed_eligibility_gates"
                      ],
                  },
                  "c3_isolation": {
                      "description": (
                          "C3 had the lowest validation H3 O2 MAE of the "
                          "frozen candidates but failed all-18-cell "
                          "monotonicity and mature-H4 robustness."
                      ),
                      "validation_improvement_vs_C0": c3[
                          "validation_improvement_vs_C0"
                      ],
                      "failed_gates": c3[
                          "failed_eligibility_gates"
                      ],
                  },
                  "structural_boundary_interpretation": (
                      "The V5 no-candidate result is driven primarily by "
                      "the requirement to splice materially lower fitted "
                      "R1/R2 values onto untouched deployed R3-R6 values. "
                      "For C2, the sole failed eligibility gate is the "
                      "resulting R2-to-R3 upward discontinuity."
                  ),
              },
              "future_research_constraints": {
                  "new_study_required": True,
                  "reason": (
                      "Validation has been opened. Any new candidate family, "
                      "expanded fitted round scope, or structural constraint "
                      "must be preregistered as a separate study."
                  ),
                  "recommended_question": (
                      "Can an expanded draft-pick Fundamental Value curve "
                      "covering the R1/R2-to-R3 boundary (and, if "
                      "preregistered, the audited R1-R4 scope) preserve "
                      "monotonic continuity while retaining the substantial "
                      "historical-outcome scale improvement observed in V5?"
                  ),
                  "validation_contamination_note": (
                      "The 2022-2023 H3 validation outcomes are no longer "
                      "fresh for designing or selecting a successor family. "
                      "A successor study must explicitly account for that "
                      "fact rather than treating them as untouched holdout."
                  ),
                  "prospective_clean_class_note": (
                      "The 2024 rookie class is not yet a complete H3 outcome "
                      "class as of the V5 closeout and may be reserved by a "
                      "future preregistration as prospective clean H3 "
                      "validation once its third NFL season is complete."
                  ),
              },
              "frozen_mock_trade_policy": {
                  "prior_pick_containing_mock_trades_consumed_by_v5": False,
                  "external_trade_replay_run_in_v5": False,
                  "reason_deferred": (
                      "V5 produced no eligible candidate to replay."
                  ),
                  "future_use": (
                      "Keep prior frozen pick-containing mock trades untouched "
                      "and use them only as external post-selection evidence "
                      "after a successor study freezes an eligible candidate."
                  ),
              },
              "firewalls": {
                  "ktc_or_market_values_used_as_fit_or_validation_target": False,
                  "package_vote_evidence_used": False,
                  "year_discount_changed": False,
                  "r3_r6_changed": False,
                  "production_changed": False,
                  "post_validation_refit": False,
              },
              "source_fingerprints": {
                  prereg_path.name: sha(prereg_path),
                  fit_path.name: sha(fit_path),
                  fit_manifest_path.name: sha(fit_manifest_path),
                  val_path.name: sha(val_path),
                  val_manifest_path.name: sha(val_manifest_path),
              },
              "next_action": (
                  "Archive/freeze V5. Open a separately preregistered "
                  "successor draft-pick structural-continuity study before "
                  "any additional fitting."
              ),
          }

          out_json.write_text(
              json.dumps(closeout, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Draft Pick FV V5 — Research Closeout",
              "",
              "**Final decision:** "
              "`STOP_NO_V5_R1_R2_PICK_FV_CANDIDATE`",
              "",
              "V5 is closed. No candidate is eligible for production and "
              "no post-validation refit is permitted.",
              "",
              "## What V5 established",
              "",
              f"- Deployed C0 validation H3 O2 macro MAE: **{c0_mae:.2f}**",
          ]
          for cid in pre["selection"]["winner_pool"]:
              x = candidate_summary[cid]
              lines.append(
                  f"- {cid}: **{x['validation_improvement_vs_C0']:.2%}** "
                  f"validation MAE improvement vs C0; failed gate(s): "
                  f"`{', '.join(x['failed_eligibility_gates'])}`."
              )

          lines += [
              "",
              "The strongest isolation is **C2**: it passed every "
              "preregistered gate except the all-18-cell monotonicity gate. "
              "Its fitted R1/R2 scale runs below the untouched deployed R3 "
              "table, creating an upward R2→R3 discontinuity.",
              "",
              "C3 reduced validation error even further, but it also failed "
              "mature-H4 robustness, so its issue is not purely structural.",
              "",
              "## Frozen mock trades",
              "",
              "The prior frozen mock trades containing draft picks remain "
              "**unused by V5**. Because V5 produced no eligible candidate, "
              "there is nothing legitimate to replay against them yet. Keep "
              "them frozen for external confirmation after a successor study "
              "selects a candidate.",
              "",
              "## Successor-study constraint",
              "",
              "Do **not** repair V5. Validation has been opened. A successor "
              "study must preregister any expanded round scope or new curve "
              "family before fitting.",
              "",
              "A natural next research question is whether expanding the "
              "fitted curve through the R2→R3 boundary — potentially through "
              "the already-audited R1–R4 source depth — can preserve "
              "monotonicity while retaining the scale improvement V5 found.",
              "",
              "The 2022–2023 validation classes are now spent for successor "
              "candidate design/selection. A future design must account for "
              "that explicitly; it must not relabel them as fresh holdout.",
              "",
              "## Production",
              "",
              "- Production change authorized: **No**",
              "- PICK_BASE changed: **No**",
              "- YEAR_DISCOUNT changed: **No**",
              "- Package Adjustment changed: **No**",
              "- Fundamental Value player formulas changed: **No**",
              "",
          ]
          out_md.write_text("\n".join(lines), encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "study_id": pre["study_id"],
              "stage": "phase6_research_closeout",
              "status": closeout["status"],
              "generated_at_utc": generated,
              "final_decision": closeout["final_decision"],
              "research_complete": True,
              "selected_candidate": None,
              "eligible_candidate_n": 0,
              "production_change_authorized": False,
              "v5_refit_allowed": False,
              "external_trade_replay_run_in_v5": False,
              "successor_study_required_for_any_new_candidate": True,
              "input_hashes": closeout["source_fingerprints"],
              "output_hashes": {
                  out_json.name: sha(out_json),
                  out_md.name: sha(out_md),
              },
          }
          out_manifest.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("DECISION=V5_RESEARCH_CLOSED_NO_ELIGIBLE_CANDIDATE")
          print(
              "C2 failed gates:",
              candidate_summary[
                  "C2_R1_R2_ROUND_RESCALE"
              ]["failed_eligibility_gates"],
          )
          print(
              "C2 structural violations:",
              structural_violations[
                  "C2_R1_R2_ROUND_RESCALE"
              ],
          )
          PY

      - name: Validate V5 closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/draft-pick-fv-v5")
          x = json.loads(
              (d / "r1_r2_v5_research_closeout.json").read_text()
          )
          m = json.loads(
              (d / "r1_r2_v5_research_closeout_manifest.json").read_text()
          )

          assert x["status"] == \
              "V5_RESEARCH_CLOSED_NO_ELIGIBLE_CANDIDATE"
          assert x["final_decision"] == \
              "STOP_NO_V5_R1_R2_PICK_FV_CANDIDATE"
          assert x["research_complete"] is True
          assert x["eligible_candidate_n"] == 0
          assert x["selected_candidate"] is None
          assert x["production_change_authorized"] is False
          assert x["v5_refit_allowed"] is False
          assert x["v5_candidate_family_changes_allowed"] is False

          c2 = x["candidate_summary"][
              "C2_R1_R2_ROUND_RESCALE"
          ]
          assert c2["failed_eligibility_gates"] == [
              "all_18_monotone_nonincreasing"
          ]
          assert c2["validation_improvement_vs_C0"] > 0.68 - 1e-9
          assert c2["improves_2022_vs_C0"] is True
          assert c2["improves_2023_vs_C0"] is True

          c2v = x["structural_violations"][
              "C2_R1_R2_ROUND_RESCALE"
          ]
          assert len(c2v) >= 1
          assert any(
              z["from_cell"] == "R2_late"
              and z["to_cell"] == "R3_early"
              for z in c2v
          )

          c3 = x["candidate_summary"][
              "C3_R1_R2_LOW_PARAMETER_TIER_CURVE"
          ]
          assert "all_18_monotone_nonincreasing" in \
              c3["failed_eligibility_gates"]
          assert "mature_H4_regression_vs_matched_H3_le_2pct" in \
              c3["failed_eligibility_gates"]

          mock = x["frozen_mock_trade_policy"]
          assert mock["prior_pick_containing_mock_trades_consumed_by_v5"] is False
          assert mock["external_trade_replay_run_in_v5"] is False

          assert m["research_complete"] is True
          assert m["selected_candidate"] is None
          assert m["production_change_authorized"] is False
          assert m["v5_refit_allowed"] is False
          assert m["successor_study_required_for_any_new_candidate"] is True

          print(
              "PASS: V5 is immutably closed; no candidate and no "
              "post-validation repair path."
          )
          PY

      - name: Prove only closeout artifacts changed
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' |
            sort
          )
          expected=(
            "research/draft-pick-fv-v5/r1_r2_v5_research_closeout.json"
            "research/draft-pick-fv-v5/r1_r2_v5_research_closeout.md"
            "research/draft-pick-fv-v5/r1_r2_v5_research_closeout_manifest.json"
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)

          echo "PASS: only three V5 closeout files changed."

      - name: Prove production and frozen evidence unchanged
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          expected_lines = [
              "PICK_BASE = {",
              "  1: {early:7500, mid:5854, late:5244},",
              "  2: {early:3906, mid:3624, late:3291},",
              "  3: {early:2692, mid:2682, late:2319},",
              "  4: {early:1972, mid:1831, late:1689},",
              "  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data",
              "  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data",
              "};",
              "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for line in expected_lines:
              assert line in text, f"deployed pick-value contract changed: {line}"
          print("PASS: deployed PICK_BASE/YEAR_DISCOUNT contract unchanged.")
          PY
          test "$(git hash-object research/package-adjustment-production-candidate-v1/live_deployment.json)" = \
            "fb192d6d52ca302f9694adc3ae39c7f1047f6140"

          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json)" = \
            "b52aca0a7a0313c35065850273f80e9df684fe2d"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_development_candidate_fit_v5.json)" = \
            "e4cdfc3f0c0bb7be8eca0bbac750ba987a3ec738"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_locked_validation_results_v5.json)" = \
            "7f3e56633beb8772d94beacc59ac0407ca01365b"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_locked_validation_manifest_v5.json)" = \
            "59c7773ecc3fa9a52e8473fc052a8b6e1ab7e238"

      - name: Re-run production and repository regression
        shell: bash
        run: |
          set -euo pipefail

          # Scheduled refreshes can legitimately update Team Utility projection
          # inputs without rebuilding this derived artifact immediately. Phase 6
          # must not commit unrelated refresh data, but the full regression suite
          # should still run against an internally consistent current repo state.
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

          cp "$TU_JSON" /tmp/team_utility_lineup_projections.json.before_v5_closeout
          cp "$TU_MD" /tmp/team_utility_lineup_projection_report.md.before_v5_closeout

          restore_team_utility() {
            cp /tmp/team_utility_lineup_projections.json.before_v5_closeout "$TU_JSON"
            cp /tmp/team_utility_lineup_projection_report.md.before_v5_closeout "$TU_MD"
          }
          trap restore_team_utility EXIT

          # Rebuild only as a transient regression fixture.
          python3 scripts/projections/build_team_utility_lineup_projections.py --write

          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          # Restore the committed derived artifact so Phase 6 remains
          # closeout-only and cannot smuggle unrelated refreshed data.
          restore_team_utility
          trap - EXIT

          git diff --exit-code -- "$TU_JSON" "$TU_MD"

          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' |
            sort
          )
          expected=(
            "research/draft-pick-fv-v5/r1_r2_v5_research_closeout.json"
            "research/draft-pick-fv-v5/r1_r2_v5_research_closeout.md"
            "research/draft-pick-fv-v5/r1_r2_v5_research_closeout_manifest.json"
          )
          diff -u             <(printf '%s\n' "${expected[@]}" | sort)             <(printf '%s\n' "${changed[@]}" | sort)

          echo "PASS: full repo regression green using transient current Team Utility rebuild; committed Team Utility artifacts restored unchanged."

      - name: Commit V5 research closeout
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during run; refusing stale closeout."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v5/r1_r2_v5_research_closeout.json \
            research/draft-pick-fv-v5/r1_r2_v5_research_closeout.md \
            research/draft-pick-fv-v5/r1_r2_v5_research_closeout_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m "Close Draft Pick FV V5 research"
          git push origin HEAD:main
